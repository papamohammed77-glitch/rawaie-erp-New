name: CTO New-main Gold Diamond Executor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cto:
    if: ${{ !contains(github.event.head_commit.message, '[CTO-EXECUTED]') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3

      - name: Reconstruct exact target from current eleven governed fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_final_main_reconstruction_20260831.py

      - name: Gold/Diamond source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          required=['window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_OwnerLicense','window.RW_Dashboard','window.RW_Items','window.RW_POS','window.RW_Orders','window.RW_Runsheets','window.RW_Purchases','window.RW_Warehouse','window.RW_Finance','window.RW_Reports','window.RW_HR','window.RW_CRM','RW_SUPABASE_CLIENT','var supabase = RW_SUPABASE_CLIENT','MAIN2-COMPLETE-SURGICAL-v1','MAIN2_GOVERNED_CLOSED:v1']
          miss=[x for x in required if x not in s]
          if miss: raise SystemExit('RECONSTRUCTION_CONTRACT_MISSING:'+repr(miss))
          auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'
          if s.count(auth)!=1 or compat in s: raise SystemExit('P163_OWNERSHIP_GATE')
          if s.count("window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';")!=1: raise SystemExit('P163_VERSION_GATE')
          if s.count('// MAIN2_GOVERNED_CLOSED:v1')!=1: raise SystemExit('P163_GOVERNED_GATE')
          if re.search(r'window\.RW_Dashboard\s*=\s*\{\s*render\s*:\s*renderDashboard\s*\}',s): raise SystemExit('P163_DASH_ALIAS_REMAINS')
          if re.search(r'window\.RW_Items\s*=\s*\{\s*render\s*:\s*renderItems\s*\}',s): raise SystemExit('P163_ITEMS_ALIAS_REMAINS')
          if s.lower().count('<script')!=s.lower().count('</script>') or s.lower().count('<style')!=s.lower().count('</style>'): raise SystemExit('HTML_BALANCE')
          if s.count("navigator.serviceWorker.register('./sw.js',{scope:'./'})")!=1: raise SystemExit('SW_CANONICAL_GATE')
          if re.search(r"\.from\(['\"]stock_branches['\"]\)[\s\S]{0,1200}\.(?:insert|update|upsert|delete)\(",s): raise SystemExit('DIRECT_STOCK_WRITER')
          if re.search(r"\.from\(['\"]inventory_log['\"]\)[\s\S]{0,800}\.insert\(",s): raise SystemExit('DIRECT_INVENTORY_LOG_WRITER')
          ms=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)]
          app=[x for x in ms if 'serviceWorker.register' not in x]
          if len(app)!=1: raise SystemExit('APPLICATION_INLINE_SCRIPT_COUNT')
          Path('/tmp/new-main.js').write_text(app[0],encoding='utf-8')
          import subprocess
          r=subprocess.run(['node','--check','/tmp/new-main.js'],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          print('GOLD_DIAMOND_SOURCE_PASS',hashlib.sha256(s.encode()).hexdigest(),len(s.encode()))
          PY

      - name: Browser Gold/Diamond runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-pwa && mkdir -p /tmp/rawaea-pwa
          cp -r Current/PWA/. /tmp/rawaea-pwa/
          cp Current/PWA/New-main /tmp/rawaea-pwa/main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-pwa >/tmp/rawaea-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1800);const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,flat=[];(function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);let denied=false;if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(x){denied=x.message==='OWNER_ONLY'}}const req=['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'];const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'];return{ar:document.documentElement.lang==='ar',state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract,critical:req.every(v=>flat.includes(v)),mods:mods.every(v=>!!window[v]),denied,count:flat.length,main2:window.RW_PWA_RECONSTRUCTION_VERSION||null}});console.log(JSON.stringify({r,e}));if(e.length||!r.ar||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.critical||!r.mods||!r.denied||r.count<30||r.main2!=='MAIN2-COMPLETE-SURGICAL-v1')process.exit(2);await b.close()})().catch(x=>{console.error(x);process.exit(2)});
          NODE

      - name: Persist verified target and continuity record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          target=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          sha=hashlib.sha256(target.encode()).hexdigest(); b=len(target.encode())
          state=Path('CURRENT_STATE.md'); st=state.read_text(encoding='utf-8')
          marker='P163 CLOSED — MAIN2 ownership surgery + governed New-main reconstruction'
          if marker not in st:
              st.write_text(st.rstrip()+f'''\n\n## CTO CLOSURE — 2026-09-03\n\n{marker}\n- Target: `Current/PWA/New-main`\n- Verified SHA-256: `{sha}`\n- Verified bytes: `{b}`\n- Reconstruction source: `Current/PWA/main/main1.md` through `main11.md`.\n- Main2 compatibility ownership removed; authoritative owner retained.\n- Main1 dashboard/items legacy aliases removed.\n- Current modules and tenant-scoped Supabase client preserved.\n- Static Gold/Diamond gates and browser smoke passed.\n- Production database writes: none.\n- `Original/PWA/main/*` remained evidence-only.\n''')
          report=Path('doc/Draft/Reprots/تقرير26.md')
          if not report.exists(): report.write_text(f'''# RAWAEA ERP — CTO Gold/Diamond Closure\n\nDate: 2026-09-03\nTarget: `Current/PWA/New-main`\nStatus: CLOSED — P163\n\nVerified SHA-256: `{sha}`\nVerified bytes: `{b}`\n\nSource: `Current/PWA/main/main1.md` through `main11.md`.\n\nP163 ownership closure, structural gates, JavaScript syntax, and browser Gold/Diamond smoke passed. No Production database writes were performed. Historical `Original/PWA/main/*` remained untouched.\n''',encoding='utf-8')
          for q in ['.github/workflows/_cto_close_newmain_20260903.yml','.github/workflows/cto_executor_temp_20260903.yml','_cto_trigger_20260903.txt']:
              Path(q).unlink(missing_ok=True)
          PY
          git checkout d3b152cc1a0045aee5b53c4e8512eb42b42caaf3 -- .github/workflows/complete-picking-production-canary-20260814.yml
          git config user.name 'RAWAEA CTO Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md doc/Draft/Reprots/تقرير26.md .github/workflows/complete-picking-production-canary-20260814.yml .github/workflows/_cto_close_newmain_20260903.yml .github/workflows/cto_executor_temp_20260903.yml _cto_trigger_20260903.txt
          git diff --cached --check
          git commit -m '[CTO-EXECUTED] New-main Gold Diamond closure [skip ci]'
          git push origin HEAD:main
