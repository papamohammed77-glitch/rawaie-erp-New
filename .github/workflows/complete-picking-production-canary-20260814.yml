name: complete-picking production HTTP canary
on:
  push:
    branches: [main]
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Production HTTP E2E canary
        env:
          SUPABASE_URL: https://fiilmooggumokxanwiyx.supabase.co
          ANON_KEY: sb_publishable_ZQC-PFJJWDoFh-6ZmaTWeg_UtrzzM71
          EMAIL: cp-prod-canary-20260814@example.invalid
          PASSWORD: Tmp-CP-PROD-20260814-Aa1!
          FIX_URL: https://fiilmooggumokxanwiyx.supabase.co/functions/v1/cp-prod-fixture-canary-20260814?token=CP-PROD-FIX-20260814
          SEND_BRANCH_ID: 151e5cd7-ac4a-4fc3-b703-d73a0dbb0dc6
          SEND_ITEM_CODE: 1003
        run: |
          set -euo pipefail
          trap 'curl --silent --show-error --max-time 60 "$FIX_URL&mode=cleanup" >/tmp/cleanup.json || true' EXIT
          TOKEN=$(curl --fail-with-body --silent --show-error --max-time 60 -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" | python -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          # A temporary SQL cleanup will remove any send test artifacts after the run.
          RUN_TOKEN="$TOKEN"
          # SEND-STOCK-VOUCHER production HTTP E2E
          SEND_REF="TASK-INV-SEND-PROD-${GITHUB_RUN_ID}"
          CREATE_BODY=$(python - <<PY
          import json
          print(json.dumps({"type":"Transfer","reference":"$SEND_REF","fromType":"Branch","fromId":"$SEND_BRANCH_ID","toType":"Branch","toId":"$SEND_BRANCH_ID","items":[{"itemCode":"$SEND_ITEM_CODE","itemName":"TASK-INV-SEND","unit":"حبة","qty":1,"unitPrice":0}],"notes":"$SEND_REF"}))
          PY
          )
          curl --fail-with-body --silent --show-error --max-time 60 -X POST "$SUPABASE_URL/functions/v1/create-stock-voucher" -H "Authorization: Bearer $RUN_TOKEN" -H "Content-Type: application/json" --data "$CREATE_BODY" | tee send_create.json
          SEND_VOUCHER=$(python -c "import json;print(json.load(open('send_create.json'))['voucherId'])")
          curl --fail-with-body --silent --show-error --max-time 60 -X POST "$SUPABASE_URL/functions/v1/send-stock-voucher" -H "Authorization: Bearer $RUN_TOKEN" -H "Content-Type: application/json" --data "{\"voucher_code\":\"$SEND_VOUCHER\"}" | tee send_first.json
          python - <<'PY'
          import json
          r=json.load(open('send_first.json')); assert r.get('success') is True and r.get('status')=='Sent' and r.get('movement_count')==1,r
          PY
          set +e
          curl --silent --show-error --max-time 60 -X POST "$SUPABASE_URL/functions/v1/send-stock-voucher" -H "Authorization: Bearer $RUN_TOKEN" -H "Content-Type: application/json" --data "{\"voucher_code\":\"$SEND_VOUCHER\"}" | tee send_retry.json
          set -e
          python - <<'PY'
          import json
          r=json.load(open('send_retry.json')); assert r.get('success') is False and 'Draft' in r.get('msg',''),r
          PY
          echo "SEND_VOUCHER=$SEND_VOUCHER"
          echo "SEND_REF=$SEND_REF"
          echo '{"success":true,"production_e2e":true,"retry_rejected":true,"send_http_e2e":true}'