name: CTO One-Shot New-main Gold Diamond Close
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message, 'CTO-GOLD-DIAMOND-CLOSED') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deterministic New-main reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_final_main_reconstruction_20260831.py
      - name: Surgical P163 ownership closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,subprocess,tempfile
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'
          auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          if s.count(compat)!=1: raise SystemExit(f'P163_COMPAT_COUNT:{s.count(compat)}')
          if s.count(auth)!=1: raise SystemExit(f'P163_AUTH_COUNT:{s.count(auth)}')
          a=s.index(compat); b=s.index(auth,a+len(compat)); block=s[a:b]; closure=block.rfind('})();')
          if closure<0: raise SystemExit('P163_MAIN1_IIFE_CLOSURE_NOT_FOUND')
          s=s[:a]+'})();\n\n'+s[b:]
          for alias in ('window.RW_Dashboard={render:renderDashboard};','window.RW_Items={render:renderItems};'):
              s=s.replace(alias,'')
          s=re.sub(r'window\.RW_Items\s*=\s*RW_Items\s*;','window.RW_Items=RW_Items;',s)
          s=s.replace("window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';",'').replace('// MAIN2_GOVERNED_CLOSED:v1','')
          marker='window.RW_Items=RW_Items;'
          if s.count(marker)!=1: raise SystemExit(f'P163_ITEMS_OWNER_COUNT:{s.count(marker)}')
          i=s.index(marker)+len(marker); s=s[:i]+"\nwindow.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';\n// MAIN2_GOVERNED_CLOSED:v1"+s[i:]
          checks={'compat_absent':compat not in s,'auth_one':s.count(auth)==1,'version_one':s.count("window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';")==1,'governed_one':s.count('// MAIN2_GOVERNED_CLOSED:v1')==1,'dash_alias_absent':'window.RW_Dashboard={render:renderDashboard};' not in s,'items_alias_absent':'window.RW_Items={render:renderItems};' not in s,'items_export_one':s.count(marker)==1,'actions':'var actions=' in s,'delegation':'main1Delegation' in s,'main3':'MAIN3' in s,'main11':'MAIN11' in s,'html':'<html' in s and '</html>' in s,'body':'<body' in s and '</body>' in s,'script_balance':s.lower().count('<script')==s.lower().count('</script>'),'style_balance':s.lower().count('<style')==s.lower().count('</style>'),'doctype':s.lstrip().lower().startswith('<!doctype html>')}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('GOLD_SOURCE_GATE_FAIL:'+','.join(bad))
          scripts=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)]
          if len(scripts)!=2: raise SystemExit('INLINE_SCRIPT_COUNT_EXPECTED_2:'+str(len(scripts)))
          app=max(scripts,key=len); f=Path(tempfile.gettempdir())/'newmain-app.js'; f.write_text(app,encoding='utf-8'); r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('GOLD_JS_SYNTAX_FAIL')
          p.write_text(s,encoding='utf-8'); print('P163_SOURCE_CLOSED',hashlib.sha256(s.encode()).hexdigest(),len(s.encode()))
          PY
      - name: Gold browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8123 --directory Current/PWA >/tmp/rawaea-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[];p.on('pageerror',e=>pe.push(e.message));await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(2000);const x=await p.evaluate(()=>({html:document.documentElement.lang,login:!!document.getElementById('rw-login-page'),app:!!document.getElementById('rw-main-shell'),shell:!!window.RW_ShellContext,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,owner:!!window.RW_OwnerLicense,recon:window.RW_PWA_RECONSTRUCTION_VERSION||null,dash:typeof window.RW_Dashboard,items:typeof window.RW_Items}));console.log(JSON.stringify({x,pe}));if(x.html!=='ar'||!x.login||!x.app||!x.shell||!x.auth||!x.nav||!x.views||!x.owner||x.recon!=='MAIN2-COMPLETE-SURGICAL-v1'||pe.length)process.exit(2);await b.close()})().catch(e=>{console.error(e);process.exit(2)})
          NODE
      - name: Diamond persist and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8'); h=hashlib.sha256(s.encode()).hexdigest(); st=Path('CURRENT_STATE.md'); x=st.read_text(encoding='utf-8')
          x=x.rstrip()+f"\n\n## CTO GOLD / DIAMOND CLOSURE — 2026-09-03\n\nP163 / Main2 ownership surgery = CLOSED\nTarget = `Current/PWA/New-main`\nTarget SHA-256 = `{h}`\nGold source gates = PASS\nGold JavaScript syntax = PASS\nDiamond browser smoke = PASS\nMain1 IIFE closure preserved = YES\nMain2 compatibility implementation = REMOVED\nAuthoritative Main2 Dashboard/Items = RETAINED\nMain1 dashboard/items aliases = REMOVED\nActions / main1Delegation / MAIN3 / MAIN11 = RETAINED\nProduction database writes = NONE\n"
          st.write_text(x,encoding='utf-8'); Path('.github/workflows/cto_one_shot_newmain_close_20260903.yml').unlink(missing_ok=True); Path('_cto_gold_diamond_trigger_20260903.txt').unlink(missing_ok=True)
          PY
          git config user.name 'RAWAEA CTO Executor'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md .github/workflows/cto_one_shot_newmain_close_20260903.yml _cto_gold_diamond_trigger_20260903.txt
          git diff --cached --check
          git commit -m '[CTO-GOLD-DIAMOND-CLOSED] persist verified New-main closure'
          git push origin HEAD:main
