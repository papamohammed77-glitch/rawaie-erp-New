          for x in ["from('companies')","from('app_settings')","from('owner_profile')",'post_stock_movement','reserve_stock','release_stock_reservation','RAWAEA_MAIN_SIDEBAR_COMPLETENESS_FINAL_V1']:assert x in s
          m=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'));assert m['start_url']=='./New-main' and m['scope']=='./' and m['display']=='standalone' and m['dir']=='rtl' and m['lang']=='ar'
          print('STATIC_GATE=PASS')
          PY
      - name: Browser gold gate
