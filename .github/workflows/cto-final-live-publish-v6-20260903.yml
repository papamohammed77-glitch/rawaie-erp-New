          npx playwright install chromium >/dev/null 2>&1
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,path):
                  if path.rstrip('/').endswith('/New-main'):return 'text/html; charset=utf-8'
                  return super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',4173),H).serve_forever()
          PY
          (cd Current/PWA&&python3 /tmp/server.py >/tmp/http.log 2>&1)&pid=$!;trap 'kill "$pid" 2>/dev/null||true' EXIT;sleep 2
          node <<'NODE'
          const{chromium}=require(process.cwd()+'/node_modules/playwright');(async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({serviceWorkers:'block'}),e=[];await p.route('**/*',async r=>{const u=r.request().url();if(u.endsWith('/register-sw.js')||u.endsWith('/sw.js'))return r.fulfill({status:200,contentType:'application/javascript',body:''});if(u.includes('cdn.jsdelivr.net/npm/@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`const a={getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:{id:'owner-auth',email:'owner@fixture',user_metadata:{isOwner:true}}},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({})};const c={auth:a,from:()=>({select(){return this},eq(){return this},in(){return this},or(){return this},order(){return this},limit(){return this},maybeSingle:async()=>({data:{id:'fixture',company_id:'fixture-company',company_name:'الروائع',company_logo:null,status:'trial',auth_id:'owner-auth',email:'owner@fixture',name:'Owner',role:'owner',permissions:['*'],license_status:'trial'},error:null}),then:()=>Promise.resolve({data:[],error:null,count:0}),insert:async()=>({data:null,error:null}),update(){return this},delete(){return this}})};window.supabase={createClient:()=>c};`});if(u.includes('cdn.jsdelivr.net/npm/chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('cdn.jsdelivr.net/npm/sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){}};'});if(u.includes('cdn.sheetjs.com'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});return r.continue()});p.on('pageerror',x=>e.push('PAGE:'+x.message));p.on('console',m=>{if(m.type()==='error')e.push('CONSOLE:'+m.text())});await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1000);const q=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]'),m=await(await fetch(l.href)).json(),c=document.querySelector('.rw-login-card')?.getBoundingClientRect();return{login:!!document.getElementById('rw-login-form'),card:!!document.querySelector('.rw-login-card'),title:!!document.querySelector('.rw-login-title'),logo:!!document.querySelector('.rw-login-logo'),area:c?c.width*c.height:0,sidebar:!!document.getElementById('rw-sidebar'),nav:!!document.getElementById('rw-sidebar-nav'),shell:!!document.getElementById('rw-main-shell'),auth:typeof RW_Auth==='object',navigation:typeof RW_Navigation==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof safeText==='function',from:typeof window.supabase?.from==='function',manifestHref:l?.getAttribute('href'),start:m.start_url,scope:m.scope,display:m.display,dir:m.dir,lang:m.lang,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content}});const menu=await p.evaluate(()=>{RW_STATE.app.currentUser={id:'owner',email:'owner@fixture',isOwner:true,permissions:['*'],name:'Owner',role:'owner'};RW_STATE.permissions=['*'];window.RW_Permissions_check=()=>true;RW_Navigation.buildSidebar();return Array.from(document.querySelectorAll('#rw-sidebar-nav [data-view]')).map(x=>x.getAttribute('data-view')).filter(Boolean)});const lic=await p.evaluate(async()=>{try{RW_STATE.app.companyId='fixture-company';await RW_Navigation.navigate('license');await new Promise(r=>setTimeout(r,250));return{ok:true,container:!!document.getElementById('license-main-container'),view:RW_STATE.app.currentView}}catch(x){return{ok:false,error:String(x.message||x)}}});const expected=['dashboard','telesales','customers','pos','orders','runsheets','online-store','suppliers','purchase-pos','purchases','receiving','items','inventory','branches','picking','loading','delivery','return','unloading','vouchers','transfer','direct-sale','direct-return','supplier-return','vehicle-count','branch-count','general-count','finance','settlement','reports-dashboard','reports-detailed','reports-comprehensive','reports','audit','hr','crm','users','roles','license','settings','notifications'];const ok=!e.length&&q.login&&q.card&&q.title&&q.logo&&q.area>0&&q.sidebar&&q.nav&&q.shell&&q.auth&&q.navigation&&q.owner&&q.safeText&&q.from&&q.manifestHref==='./manifest.json'&&q.start==='./New-main'&&q.scope==='.'+'/'&&q.display==='standalone'&&q.dir==='rtl'&&q.lang==='ar'&&q.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&q.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&expected.every(v=>menu.includes(v)||(v==='return'&&menu.includes('returns')))&&lic.ok&&lic.container&&lic.view==='license';console.log('CTO_FORENSIC_GATE='+JSON.stringify({q,menu,lic,e}));await b.close();if(!ok)process.exit(2)})().catch(x=>{console.error(x.stack||x);process.exit(2)});
          NODE
          echo BROWSER_GOLD_DIAMOND=PASS
      - name: Publish only requested production files
        shell: bash
        env:
          EXPECTED_MAIN_SHA: 067c1228ea6e56fccbc11734fe35f4dbe94a12d2
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          cp Current/PWA/New-main /tmp/New-main.patched
          cp Current/PWA/manifest.json /tmp/manifest.patched
          git checkout -B final-publish origin/main
          cp /tmp/New-main.patched Current/PWA/New-main
          cp /tmp/manifest.patched Current/PWA/manifest.json
          git add Current/PWA/New-main Current/PWA/manifest.json
          git diff --cached --check
          files="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          case "$files" in
            'Current/PWA/New-main '|'Current/PWA/New-main Current/PWA/manifest.json ') ;;
            *) echo "UNAUTHORIZED_TARGETS:$files"; exit 1;;
          esac
          git config user.name 'RAWAEA CTO Final Closure';git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main forensic visual/menu/PWA closure'
