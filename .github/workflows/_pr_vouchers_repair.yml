            s,n=re.subn(pat,'\n',s,flags=re.S)
            assert n==1,(n,pat)
          block='''\n<script data-rw-vouchers-branch-repair="20260820">\n(function(){\n  if(typeof App==='undefined'||typeof supabase==='undefined')return;\n  function A(v){if(v==null)return[];if(Array.isArray(v))return v.map(String);var s=String(v).trim();if(!s)return[];try{var j=JSON.parse(s);if(Array.isArray(j))return j.map(String);if(typeof j==='string')return[j]}catch(e){}return s.split(',').map(function(x){return x.trim()}).filter(Boolean)}\n  function bm(u,b){if(!u||!b)return false;if(String(u.default_branch_id||'')===String(b.id))return true;var a=A(u.allowed_branch_ids);return a.indexOf(String(b.id))>=0||a.indexOf(String(b.branch_code||''))>=0}\n  function vb(s,v){var m=s.refs.vehicleBranchMap||{};if(m[v.id])return m[v.id];var c='VAN-'+String(v.vehicle_code||'').trim().toUpperCase();var b=(s.refs.branches||[]).find(function(x){return String(x.branch_code||'').trim().toUpperCase()===c});return b?b.id:null}\n  var L=App.loadRefs,P=App.pickArr,S=App.pickSearch,Sel=App.pickSelect,R=App.routeHtml,Sum=App.summary,Sub=App.submit;\n  App.loadRefs=function(){var s=this;return Promise.all([L.call(this),supabase.from('users').select('id,name,email,phone,role,status,default_branch_id,allowed_branch_ids').eq('company_id',s.company).eq('status','Active').eq('role','مندوب بيع مباشر').order('name'),supabase.from('vehicles').select('id,vehicle_code,license_plate,model,driver_id,status').eq('company_id',s.company).eq('status','Active').order('vehicle_code'),supabase.from('suppliers').select('id,supplier_code,name,search_label,phone,is_active').eq('company_id',s.company).eq('is_active',true).order('name'),supabase.from('purchase_orders').select('supplier_id,branch_id').eq('company_id',s.company).not('supplier_id','is',null).not('branch_id','is',null)]).then(function(q){for(var i=1;i<5;i++)if(q[i].error)throw q[i].error;s.refs=s.refs||{};s.refs.reps=q[1].data||[];s.refs.vehicles=q[2].data||[];s.refs.suppliers=q[3].data||[];s.refs.vehicleBranchMap={};s.refs.vehicles.forEach(function(v){var x=vb(s,v);if(x)s.refs.vehicleBranchMap[v.id]=x});s.refs.supplierBranchMap={};(q[4].data||[]).forEach(function(x){if(x.supplier_id&&x.branch_id)(s.refs.supplierBranchMap[x.branch_id]||(s.refs.supplierBranchMap[x.branch_id]={}))[x.supplier_id]=1});return s.refs})};\n  App.pickArr=function(k){var s=this,f=(document.getElementById('wsFrom')||{}).value||'',b=(s.refs.branches||[]).find(function(x){return x.id===f});if(k==='wsRep'){if(this.type==='DirectReturn'){var v=s.refs.vehicles.find(function(x){return x.id===f}),m=v&&vb(s,v),mb=(s.refs.branches||[]).find(function(x){return x.id===m});return s.refs.reps.filter(function(r){return !mb||bm(r,mb)})}return s.refs.reps.filter(function(r){return !b||bm(r,b)})}if(this.type==='DirectSale'&&k==='wsTo')return s.refs.vehicles.filter(function(v){var x=vb(s,v);return !!x&&(!b||x===b.id)});if(this.type==='DirectReturn'&&k==='wsFrom')return s.refs.vehicles.filter(function(v){return !!vb(s,v)});if(this.type==='SupplierReturn'&&k==='wsTo'){var m=s.refs.supplierBranchMap[f];return m?s.refs.suppliers.filter(function(x){return !!m[x.id]}):[]}return P.call(this,k)};\n  App.pickSearch=function(k,q){var t=k==='wsRep'?'rep':k==='wsTo'&&this.type==='DirectSale'||k==='wsFrom'&&this.type==='DirectReturn'?'vehicle':k==='wsTo'&&this.type==='SupplierReturn'?'supplier':null;if(!t)return S.call(this,k,q);var s=this,a=s.pickArr(k)||[],z=s.norm(q),box=RW_UI.byId(k+'Menu');var lab=function(x){return t==='rep'?(x.name||x.email||''):t==='vehicle'?(x.vehicle_code||x.license_plate||''):(x.name||x.supplier_code||'')},cod=function(x){return t==='rep'?(x.email||x.phone||''):t==='vehicle'?(x.vehicle_code||x.license_plate||''):(x.supplier_code||x.phone||'')};var rows=a.map(function(x){var A=s.norm(lab(x)),B=s.norm(cod(x));return{x:x,n:A===z||B===z?150:A.indexOf(z)===0?115:B.indexOf(z)===0?110:A.indexOf(z)>=0?70:B.indexOf(z)>=0?60:0}}).filter(function(o){return o.n>0}).sort(function(a,b){return b.n-a.n}).slice(0,15);box.innerHTML=rows.length?rows.map(function(o){var x=o.x;return '<div class="smart-row" onclick="App.pickSelect(\\''+k+'\\',\\''+s.esc(x.id)+'\\')"><b class="text-xs text-white">'+s.esc(lab(x))+'</b><span class="smart-code">'+s.esc(cod(x))+'</span></div>'}).join(''):'<div class="smart-empty">لا توجد نتائج مرتبطة بالفرع المحدد</div>';box.classList.remove('hidden')};\n  App.pickSelect=function(k,id){var s=this;if(k==='wsRep'){var r=s.refs.reps.find(function(x){return x.id===id}),f=(document.getElementById('wsFrom')||{}).value||'',b;if(this.type==='DirectReturn'){var v=s.refs.vehicles.find(function(x){return x.id===f}),m=v&&vb(s,v);b=s.refs.branches.find(function(x){return x.id===m})}else b=s.refs.branches.find(function(x){return x.id===f});if(!r||b&&!bm(r,b))return;RW_UI.byId('wsRep').value=id;RW_UI.byId('wsRepSearch').value=r.name||r.email;RW_UI.byId('wsRepMenu').classList.add('hidden');s.summary();return}if(k==='wsTo'&&this.type==='DirectSale'||k==='wsFrom'&&this.type==='DirectReturn'){var v2=s.pickArr(k).find(function(x){return x.id===id});if(!v2)return;RW_UI.byId(k).value=id;RW_UI.byId(k+'Search').value=v2.vehicle_code||v2.license_plate;RW_UI.byId(k+'Menu').classList.add('hidden');s.summary();return}if(k==='wsTo'&&this.type==='SupplierReturn'){var sp=s.refs.suppliers.find(function(x){return x.id===id}),bid=(document.getElementById('wsFrom')||{}).value||'',m=s.refs.supplierBranchMap[bid];if(!sp||!m||!m[sp.id])return;RW_UI.byId('wsTo').value=id;RW_UI.byId('wsToSearch').value=sp.name||sp.supplier_code;RW_UI.byId('wsToMenu').classList.add('hidden');s.summary();return}return Sel.call(this,k,id)};\n  App.routeHtml=function(){var p=function(k,l,r){return '<div class="smart-field"><input type="hidden" id="'+k+'"><input id="'+k+'Search" class="smart-input" '+(r?'readonly ':'')+'placeholder="'+l+' — ابحث بالاسم أو الكود" onfocus="App.pickShow(\\''+k+'\\')" oninput="App.pickSearch(\\''+k+'\\',this.value)"><div id="'+k+'Menu" class="smart-menu hidden"></div></div>'};if(this.type==='DirectSale')return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+p('wsFrom','الفرع المصدر')+p('wsRep','مندوب البيع المباشر — تابع للفرع')+p('wsTo','المركبة — فرع متنقل')+'</div>';if(this.type==='DirectReturn')return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+p('wsFrom','المركبة المصدر')+p('wsRep','مندوب البيع المباشر — تابع لنطاق المركبة',true)+p('wsTo','الفرع الوجهة')+'</div>';if(this.type==='SupplierReturn')return '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'+p('wsFrom','الفرع المصدر')+p('wsTo','المورد — مرتبط بالفرع')+'</div>';return R.call(this)};\n  App.summary=function(){var s=this,f=RW_UI.byId('wsFrom'),r=RW_UI.byId('wsRep'),t=RW_UI.byId('wsTo'),x='';if(this.type==='DirectSale'){if(f&&f.value)x+='المصدر: '+s.loc(f.value,'Branch');if(r&&r.value){var a=s.refs.reps.find(function(y){return y.id===r.value});if(a)x+=(x?' · ':'')+'المندوب: '+(a.name||a.email)}if(t&&t.value)x+=(x?' · ':'')+'المركبة: '+s.loc(t.value,'Vehicle');RW_UI.safeText(RW_UI.byId('routeSummary'),x||'اختر الفرع ثم المندوب والمركبة');return}if(this.type==='DirectReturn'){if(f&&f.value)x+='المركبة: '+s.loc(f.value,'Vehicle');if(r&&r.value){var a2=s.refs.reps.find(function(y){return y.id===r.value});if(a2)x+=(x?' · ':'')+'المندوب: '+(a2.name||a2.email)}if(t&&t.value)x+=(x?' · ':'')+'الفرع: '+s.loc(t.value,'Branch');RW_UI.safeText(RW_UI.byId('routeSummary'),x||'اختر المركبة والمندوب والفرع');return}if(this.type==='SupplierReturn'){if(f&&f.value)x+='المصدر: '+s.loc(f.value,'Branch');if(t&&t.value)x+=(x?' · ':'')+'المورد: '+s.loc(t.value,'Supplier');RW_UI.safeText(RW_UI.byId('routeSummary'),x||'اختر الفرع ثم المورد');return}return Sum.call(this)};\n  App.submit=function(){var s=this;if(this.mode==='voucher'&&this.type==='DirectSale'){var b=(document.getElementById('wsFrom')||{}).value||'',r=(document.getElementById('wsRep')||{}).value||'',v=(document.getElementById('wsTo')||{}).value||'',br=s.refs.branches.find(function(x){return x.id===b}),rp=s.refs.reps.find(function(x){return x.id===r}),vh=s.refs.vehicles.find(function(x){return x.id===v});if(!b||!r||!v||!br||!rp||!vh||!bm(rp,br)||vb(s,vh)!==b){RW_UI.toast('الفرع والمندوب والمركبة يجب أن تكون ضمن نطاق الفرع المحدد','error');return}}if(this.mode==='voucher'&&this.type==='DirectReturn'){var v2=(document.getElementById('wsFrom')||{}).value||'',r2=(document.getElementById('wsRep')||{}).value||'',d=(document.getElementById('wsTo')||{}).value||'';if(!v2||!r2||!d||!vb(s,s.refs.vehicles.find(function(x){return x.id===v2}))){RW_UI.toast('المركبة والمندوب والفرع الوجهة مطلوبة وصحيحة','error');return}}if(this.mode==='voucher'&&this.type==='SupplierReturn'){var sb=(document.getElementById('wsFrom')||{}).value||'',st=(document.getElementById('wsTo')||{}).value||'',m=s.refs.supplierBranchMap[sb];if(!sb||!st||!m||!m[st]){RW_UI.toast('المورد غير مرتبط بالفرع في البيانات الحالية','error');return}}return Sub.apply(this,arguments)};\n})();\n</script>\n'''
          s=s.replace('</script><script src="../register-sw.js"></script>',block+'</script><script src="../register-sw.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          assert 'INLINE DIRECT-SALE REPRESENTATIVE GOLD CAPABILITY 2026-08-20' not in s
          assert 'FINAL FORENSIC BRANCH-LINKED REPAIR 2026-08-20' not in s
          assert 'vehicle.driver_id===rid' not in s
          assert 'data-rw-vouchers-branch-repair="20260820"' in s
          js='\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S));Path('/tmp/vouchers.js').write_text(js)
          PY
          node --check /tmp/vouchers.js
          git diff --check
          git config user.name 'rawaea-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/vouchers.html
          git commit -m 'fix: branch-scoped voucher entity pickers'
          git push origin HEAD:${BRANCH}
