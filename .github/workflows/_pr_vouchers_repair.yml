name: pr-vouchers-repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair vouchers.html only
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/vouchers.html'); s=p.read_text(encoding='utf-8')
