name: RAWAEA MASTER RECONSTRUCTION GOLD — PR GATE
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  gold_reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gates 0-4
        run: python3 tools/gold_reconstruction_v2.py
      - name: Gate 5
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 --directory Current/PWA >/tmp/rw_http.log 2>&1 &
          sleep 2
          python3 tools/playwright_reconstruction_v2.py
      - name: Gate 7
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          b=json.loads(Path('Current/CTO/RECONSTRUCTION_BASELINE.json').read_text())
          m=Path('Current/PWA/main.html'); c=Path('Current/PWA/main.reconstruction.html')
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert h(m)==b['current_main']['sha256'],'MAIN_CHANGED_DURING_GATES'
          assert c.exists() and c.stat().st_size>100000,'CANDIDATE_INVALID'
          print('GATE7_PASS '+h(c))
          PY
      - name: Persist evidence
        run: |
          git config user.name 'RAWAEA Gold Reconstruction'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/main.reconstruction.html Current/CTO
          git commit -m '[gold-pipeline] persist Gate 0-7 evidence' || true
          git push origin HEAD:${{ github.head_ref }}
