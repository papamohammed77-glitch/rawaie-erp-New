name: Medhat picker Production HTTP diagnostic gate — RETIRED

# Historical writer retained only for chain-of-custody.
# It previously had contents:write and a path capable of mutating Current/PWA/New-main.
# No persistence authority remains here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired writer notice
        run: |
          echo 'RETIRED: historical picker target writer disabled.'
          echo 'No target mutation. No reconstruction. No production writes.'