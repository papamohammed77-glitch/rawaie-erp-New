name: CTO Product UX Single-Target Surgery
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  surgery:
    if: github.event.pull_request.head.ref == 'cto/product-ux-surgery-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: cto/product-ux-surgery-20260903, fetch-depth: 2}
      - name: Patch New-main only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert '<html lang="ar" dir="rtl">' in s
          assert 'window.RW_Auth=' in s and 'window.RW_Navigation=' in s and 'window.RW_Views=' in s
          assert 'window.RW_ShellContext=' in s and 'window.RW_OwnerLicense=' in s
          assert 'window.byId=byId;' in s and 'window.safeText=safeText;' in s
          assert '<link rel="manifest" href="./manifest.json">' in s
          assert 'RAWAEA_PRODUCT_UX_CLOSURE_20260903' not in s
          old='<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>'
          new='<div id="rw-login-company-logo" class="rw-login-logo" aria-label="شعار الشركة">ر</div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div class="rw-company-description">منصة إدارة الأعمال الذكية والمتكاملة</div>'
          assert old in s; s=s.replace(old,new,1)
          css='''.rw-login-page{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 35%,#2563eb 100%)}.rw-login-page:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 15%,rgba(255,255,255,.14),transparent 28%),radial-gradient(circle at 90% 85%,rgba(255,255,255,.10),transparent 25%);pointer-events:none}.rw-login-left{padding:80px 90px;position:relative;z-index:2}.rw-login-title{font-size:64px;line-height:1.15}.rw-login-right{padding:40px;position:relative;z-index:2}.rw-login-card{max-width:520px;border-radius:36px;padding:48px 42px;box-shadow:0 30px 80px rgba(0,0,0,.18)}.rw-login-card:before{content:"";position:absolute;inset:0 0 auto;height:8px;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:36px 36px 0 0}.rw-login-logo{width:120px;height:120px;border-radius:32px;overflow:hidden;box-shadow:0 20px 40px rgba(37,99,235,.25)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-company-name{font-size:34px}.rw-login-form{gap:24px}.rw-input,.rw-login-btn{height:64px;border-radius:20px}.rw-sidebar{width:280px;min-width:280px;box-shadow:0 0 20px rgba(0,0,0,.03)}.rw-sidebar.collapsed{width:80px;min-width:80px}.rw-sidebar-top{padding:60px 24px 18px}.rw-sidebar-brand-logo{width:76px;height:76px;border-radius:20px;object-fit:contain}.rw-sidebar-user{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:14px 0 2px;border-radius:20px;background:#f8fafc;border:1px solid #f1f5f9}.rw-sidebar-user-avatar{width:44px;height:44px;min-width:44px;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:14px;font-weight:800;white-space:nowrap}.rw-sidebar-user-role{font-size:11px;color:#64748b}.rw-sidebar-link.active{background:var(--pl)!important;color:var(--p)!important}@media(max-width:1100px){.rw-login-left{display:none}.rw-login-right{width:100%}.rw-sidebar{transform:translateX(100%)}.rw-sidebar.active{transform:translateX(0)}.rw-main-content,.rw-main-content.expanded{margin-right:0}}@media(max-width:650px){.rw-login-right{padding:15px}.rw-login-card{padding:30px 24px}.rw-login-logo{width:104px;height:104px}.rw-login-title{font-size:34px}.rw-company-name{font-size:28px}}'''
          pos=s.rfind('</style>'); assert pos>=0; s=s[:pos]+css+s[pos:]
          nav='<div id="rw-sidebar-nav" class="rw-sidebar-nav">'; assert s.count(nav)==1; s=s.replace(nav,'<div id="rw-sidebar-user-slot"></div>'+nav,1)
          js='''<script id="RAWAEA_UX_PRODUCT_RUNTIME">(function(){'use strict';function id(x){return document.getElementById(x)}function sync(c,u){c=c||{};var n=String(c.name||'الروائع ERP').trim()||'الروائع ERP',l=String(c.logo||'').trim(),b=id('rw-login-company-logo')||document.querySelector('.rw-login-logo');if(b){var im=id('rw-login-brand-image');if(l){if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';b.textContent='';b.appendChild(im)}im.src=l;im.style.display='block'}else if(im){im.style.display='none';im.removeAttribute('src')}b.setAttribute('aria-label','شعار '+n)}var cn=id('rw-login-company-name')||document.querySelector('.rw-company-name');if(cn)cn.textContent=n;var sn=id('rw-sidebar-company-name');if(sn)sn.textContent=n;var sl=id('rw-sidebar-brand-logo');if(sl&&l)sl.src=l;if(u){var t=document.querySelector('.rw-sidebar-top'),card=id('rw-sidebar-user-card');if(t&&!card){card=document.createElement('div');card.id='rw-sidebar-user-card';card.className='rw-sidebar-user';card.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar"></div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name"></div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role"></div></div>';t.appendChild(card)}if(card){var un=String(u.name||u.email||'مستخدم');id('rw-sidebar-user-name').textContent=un;id('rw-sidebar-user-role').textContent=String(u.role||'—');id('rw-sidebar-user-avatar').textContent=un.charAt(0)||'م'}}}function stateSync(){var a=window.RW_STATE&&RW_STATE.app||{};sync(a.company||{},a.currentUser)}window.RW_UX_PRODUCT_SYNC=stateSync;var client=window.RW_SUPABASE_CLIENT||(window.supabase&&typeof window.supabase.from==='function'?window.supabase:null);try{var r=localStorage.getItem('rawaea_remember_email');if(r&&id('rw-username')){id('rw-username').value=r;if(id('rw-remember'))id('rw-remember').checked=true}}catch(e){}if(client){try{client.from('app_settings').select('company_name,company_logo').limit(1).maybeSingle().then(function(q){if(!q.error&&q.data)sync({name:q.data.company_name,logo:q.data.company_logo})}).catch(function(){})}catch(e){}}if(window.RW_Auth){if(typeof RW_Auth.enterSystem==='function'){var e0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(u){var z=await e0.call(this,u);stateSync();return z}}if(typeof RW_Auth.login==='function'){var l0=RW_Auth.login;RW_Auth.login=async function(u,p){var z=await l0.call(this,u,p);try{var rr=id('rw-remember');if(rr&&rr.checked)localStorage.setItem('rawaea_remember_email',u);else localStorage.removeItem('rawaea_remember_email')}catch(e){}return z}}if(typeof RW_Auth.forgotPassword!=='function')RW_Auth.forgotPassword=async function(){var em=((id('rw-username')||{}).value||'').trim();if(!em)throw new Error('أدخل البريد الإلكتروني أولاً');if(!client||!client.auth)throw new Error('خدمة المصادقة غير متاحة');var q=await client.auth.resetPasswordForEmail(em,{redirectTo:location.href});if(q.error)throw q.error;return true};var fg=id('rw-forgot');if(fg&&!fg.dataset.uxBound){fg.dataset.uxBound='1';fg.addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().catch(function(x){if(typeof safeText==='function')safeText(id('rw-login-error'),x.message||String(x));if(id('rw-login-error'))id('rw-login-error').classList.remove('hidden')})})}}stateSync();setTimeout(stateSync,800);setTimeout(stateSync,2000)})();</script>'''
          end=s.rfind('</script>'); assert end>=0; s=s[:end]+js+s[end:]
          q=re.search(r'<script id="RAWAEA_UX_PRODUCT_RUNTIME">([\s\S]*?)</script>',s); assert q
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(q.group(1),encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          p.write_text(s,encoding='utf-8')
          print('STATIC_PATCH_OK',len(s.encode()))
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Browser gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea && mkdir -p /tmp/rawaea/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea/Current/PWA/manifest.json
          python3 -m http.server 8123 --directory /tmp/rawaea >/tmp/http.log 2>&1 & echo $! >/tmp/pid; trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'}),pe=[];p.on('pageerror',e=>pe.push(String(e.message||e)));await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1800);const a=await p.evaluate(async()=>{const q=document.querySelector.bind(document),l=q('link[rel="manifest"]'),mf=await (await fetch('/Current/PWA/manifest.json')).json(),menu=window.RW_Navigation?.menuTree||[],views=[];(function w(x){(x||[]).forEach(v=>{if(v.view)views.push(v.view);if(v.submenu)w(v.submenu)})})(menu);return{login:!!q('#rw-login-form'),sidebar:!!q('#rw-sidebar'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof window.safeText==='function',ux:typeof RW_UX_PRODUCT_SYNC==='function',forgot:typeof RW_Auth?.forgotPassword==='function',remember:q('#rw-username')?.value==='remembered@example.com',brand:q('#rw-login-company-name')?.textContent,brandImg:!!q('#rw-login-brand-image'),title:parseFloat(getComputedStyle(q('.rw-login-title')).fontSize),pad:parseFloat(getComputedStyle(q('.rw-login-card')).paddingTop),logo:q('.rw-login-logo').getBoundingClientRect().width,manifest:l?.getAttribute('href')||'',mf,views}});const need=['dashboard','telesales','customers','pos','orders','runsheets','suppliers','purchases','receiving','items','inventory','vouchers','picking','loading','delivery','return','unloading','branches','transfer','direct-sale','direct-return','supplier-return','vehicle-count','branch-count','general-count','finance','settlement','reports-dashboard','reports-detailed','reports-comprehensive','reports','audit','hr','crm','users','roles','license','settings','notifications'];const ux=await p.evaluate(()=>{RW_STATE.app.company={name:'شركة اختبار',logo:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3Crect width="96" height="96" fill="%230ea5e9"/%3E%3C/svg%3E'};RW_STATE.app.currentUser={name:'مستخدم تجريبي',role:'Owner'};RW_UX_PRODUCT_SYNC();return{brand:document.querySelector('#rw-login-company-name')?.textContent,img:!!document.querySelector('#rw-login-brand-image'),user:document.querySelector('#rw-sidebar-user-name')?.textContent,role:document.querySelector('#rw-sidebar-user-role')?.textContent}});await b.close();const miss=need.filter(v=>!a.views.includes(v));console.log(JSON.stringify({a,ux,pe,miss}));const m=a.mf;if(pe.length||!a.login||!a.sidebar||!a.auth||!a.nav||!a.views||!a.shell||!a.owner||!a.safeText||!a.ux||!a.forgot||!a.remember||!a.brandImg||a.title<60||a.pad<40||a.logo<100||a.manifest!=='./manifest.json'||m.start_url!=='./New-main'||m.scope!=='./'||m.dir!=='rtl'||m.lang!=='ar'||miss.length||ux.brand!=='شركة اختبار'||!ux.img||ux.user!=='مستخدم تجريبي'||ux.role!=='Owner')process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Persist target only and retire executor
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-UX] Persist New-main product UX closure only'
          git rm .github/workflows/_cto_product_ux_surgery_20260903.yml
          git commit -m '[CTO] Retire temporary New-main UX executor'
          git push origin HEAD:cto/product-ux-surgery-20260903
