name: CTO Product UX Single-Target Surgery
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  surgery:
    if: github.event.pull_request.head.ref == 'cto/product-ux-surgery-20260903'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/product-ux-surgery-20260903
          fetch-depth: 2
      - name: Apply bounded UX/product restoration to New-main only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          marker='RAWAEA_PRODUCT_UX_CLOSURE_20260903'
          if marker in s:
              print('PRODUCT_UX_ALREADY_PRESENT=1')
              raise SystemExit(0)
          assert len(s.encode()) > 500000
          assert '<html lang="ar" dir="rtl">' in s
          assert 'window.RW_Auth=' in s and 'window.RW_Navigation=' in s
          assert 'window.RW_ShellContext=' in s and 'window.RW_OwnerLicense=' in s
          assert 'window.byId=byId;' in s and 'window.safeText=safeText;' in s
          assert 'link rel="manifest" href="./manifest.json"' in s
          css=r'''
/* RAWAEA_PRODUCT_UX_CLOSURE_20260903 */
.rw-login-page{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 35%,#2563eb 100%);position:relative;overflow:hidden}
.rw-login-page:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 15%,rgba(255,255,255,.14),transparent 28%),radial-gradient(circle at 90% 85%,rgba(255,255,255,.10),transparent 25%);pointer-events:none}
.rw-login-left{padding:80px 90px;position:relative;z-index:2}.rw-brand-badge{padding:12px 22px;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);margin-bottom:28px;font-size:14px}.rw-login-title{font-size:64px;margin-bottom:28px}.rw-login-description{font-size:20px;line-height:2;margin-bottom:48px;max-width:620px}.rw-login-features{gap:18px}.rw-login-feature{font-size:18px;gap:16px}.rw-login-feature-icon{width:52px;height:52px;border-radius:18px;font-size:22px;backdrop-filter:blur(14px)}
.rw-login-right{padding:40px;position:relative;z-index:2}.rw-login-card{max-width:520px;border-radius:36px;padding:48px 42px;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.18)}.rw-login-card:before{content:"";position:absolute;top:0;left:0;width:100%;height:8px;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:36px 36px 0 0}.rw-login-logo{width:120px;height:120px;border-radius:32px;font-size:42px;box-shadow:0 20px 40px rgba(37,99,235,.25);margin-bottom:22px}.rw-company-name{font-size:34px;margin-bottom:10px}.rw-company-description{font-size:16px;font-weight:600}.rw-login-logo-area{margin-bottom:38px}.rw-login-form{gap:24px}.rw-form-group{gap:10px}.rw-form-label{font-size:15px}.rw-input{height:64px;border-radius:20px;border:2px solid #e5e7eb;padding:0 20px;font-size:16px;font-weight:700;transition:.25s}.rw-input:focus{border-color:#2563eb;box-shadow:0 0 0 5px rgba(37,99,235,.10)}.rw-login-options{margin-top:-4px;font-size:14px}.rw-login-btn{height:64px;border-radius:22px;font-size:18px;box-shadow:0 16px 35px rgba(37,99,235,.22);margin-top:10px;transition:.25s}.rw-login-btn:hover{transform:translateY(-2px);box-shadow:0 24px 45px rgba(37,99,235,.28)}.rw-login-footer{margin-top:28px;font-size:13px}
.rw-main-shell{width:100%}.rw-sidebar{width:280px;min-width:280px;box-shadow:0 0 20px rgba(0,0,0,.03);transition:width .3s,min-width .3s}.rw-sidebar.collapsed{width:80px;min-width:80px}.rw-sidebar-top{padding:60px 24px 18px;position:relative}.rw-sidebar.collapsed .rw-sidebar-top{padding:60px 12px 18px}.rw-sidebar-brand-logo{width:76px;height:76px;border-radius:20px;object-fit:contain;background:#eff6ff;box-shadow:0 12px 28px rgba(37,99,235,.12)}.rw-sidebar-company-name{font-size:20px}.rw-sidebar-company-subtitle{font-size:12px;font-weight:700}.rw-sidebar-user{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:14px 0 2px;border-radius:20px;background:#f8fafc;border:1px solid #f1f5f9;overflow:hidden}.rw-sidebar-user-avatar{width:44px;height:44px;min-width:44px;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:14px;font-weight:800;white-space:nowrap}.rw-sidebar-user-role{font-size:11px;color:#64748b;white-space:nowrap;margin-top:2px}.rw-sidebar.collapsed .rw-sidebar-user{justify-content:center;padding:14px 8px}.rw-sidebar.collapsed .rw-sidebar-user-name,.rw-sidebar.collapsed .rw-sidebar-user-role{display:none}.rw-sidebar-nav{padding:18px 16px 20px}.rw-sidebar.collapsed .rw-sidebar-nav{padding:18px 8px 20px}.rw-sidebar-link{height:52px;border-radius:16px;gap:16px;padding:0 18px;margin-bottom:6px;transition:.3s}.rw-sidebar-link-icon{width:38px;height:38px;min-width:38px;border-radius:12px}.rw-sidebar-link-text{font-size:14px;font-weight:700}.rw-sidebar-submenu{padding-right:16px}.rw-sidebar.collapsed .rw-sidebar-submenu{display:none}
.rw-main-content{margin-right:280px;transition:margin-right .3s}.rw-main-content.expanded{margin-right:80px}.rw-header{height:96px;padding:0 34px}.rw-header-title{font-size:28px}.rw-header-subtitle{font-size:14px}.rw-header-search{width:340px;height:58px;border-radius:20px}.rw-header-icon-btn{width:58px;height:58px;border-radius:20px}.rw-header-profile{height:58px;border-radius:22px;padding:0 18px}.rw-page-container{padding:34px}.rw-kpi-grid{grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:28px}.rw-kpi-card{border-radius:30px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.04);transition:.22s}.rw-kpi-card:hover{transform:translateY(-4px)}.rw-module-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.rw-module{border-radius:20px;padding:18px;transition:.22s}.rw-module:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.08)}.rw-card{border-radius:24px;box-shadow:0 8px 25px rgba(15,23,42,.04)}
@media(max-width:1100px){.rw-login-left{display:none}.rw-login-right{width:100%}.rw-sidebar{transform:translateX(100%)}.rw-sidebar.active{transform:translateX(0)}.rw-main-content,.rw-main-content.expanded{margin-right:0}.rw-kpi-grid{grid-template-columns:repeat(2,1fr)}.rw-module-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.rw-page-container{padding:12px}.rw-kpi-grid,.rw-grid2,.rw-grid3,.rw-module-grid,.rw-modal-grid{grid-template-columns:1fr}.rw-header{padding:0 12px}.rw-header-search{display:none}.rw-header-profile>div:first-child{display:none}.rw-login-right{padding:15px}.rw-login-card{padding:30px 24px}.rw-login-logo{width:96px;height:96px}}
'''
          pos=s.rfind('</style>'); assert pos!=-1; s=s[:pos]+css+s[pos:]
          nav='<div id="rw-sidebar-nav" class="rw-sidebar-nav">'; assert s.count(nav)==1; s=s.replace(nav,'<div id="rw-sidebar-user-slot"></div>'+nav,1)
          js=r'''
/* Product-level parity: restore the old UX services while preserving the unified core. */
(function(){
  function text(el,v){if(el)el.textContent=v==null?'':String(v)}
  function hydrate(){var st=window.RW_STATE&&RW_STATE.app?RW_STATE.app:null,u=st&&st.currentUser?st.currentUser:null,c=st&&st.company?st.company:null;if(c){text(document.querySelector('.rw-company-name'),c.name||'الروائع ERP');var li=document.querySelector('.rw-login-logo');if(li&&c.logo){li.style.background='center/contain no-repeat url("'+String(c.logo).replace(/"/g,'%22')+'")';li.textContent='';}var si=byId('rw-sidebar-brand-logo');if(si&&c.logo)si.src=c.logo;}var slot=byId('rw-sidebar-user-slot');if(slot&&u){var name=u.name||u.email||'المستخدم',role=u.role||'مستخدم النظام';slot.innerHTML='<div class="rw-sidebar-user"><div class="rw-sidebar-user-avatar">'+esc(name.slice(0,1))+'</div><div><div class="rw-sidebar-user-name">'+esc(name)+'</div><div class="rw-sidebar-user-role">'+esc(role)+'</div></div></div>';}}
  try{var saved=localStorage.getItem('rawaea_remember_email'),inp=byId('rw-username'),remember=byId('rw-remember');if(saved&&inp){inp.value=saved;if(remember)remember.checked=true;}}catch(e){}
  var forgot=byId('rw-forgot');if(forgot){forgot.addEventListener('click',function(e){e.preventDefault();var email=((byId('rw-username')||{}).value||'').trim();if(!email){toast('أدخل البريد الإلكتروني أولاً','warning');return;}showLoader('جاري إرسال رابط إعادة تعيين كلمة المرور...');supabase.auth.resetPasswordForEmail(email,{redirectTo:location.href}).then(function(r){hideLoader();toast(r.error?r.error.message:'تم إرسال رابط إعادة تعيين كلمة المرور',r.error?'error':'success')}).catch(function(e){hideLoader();toast(e.message||'تعذر الاتصال بالخادم','error')})});}
  var form=byId('rw-login-form');if(form)form.addEventListener('submit',function(){try{var rem=byId('rw-remember'),email=byId('rw-username');if(rem&&email){if(rem.checked)localStorage.setItem('rawaea_remember_email',email.value.trim());else localStorage.removeItem('rawaea_remember_email');}}catch(e){}});
  hydrate();setTimeout(hydrate,900);setTimeout(hydrate,2200);window.RW_ProductUX={hydrateCompanyBrand:hydrate,version:'2026-09-03'};
})();
'''
          end=s.rfind('</script>'); assert end!=-1; s=s[:end]+js+s[end:]
          p.write_text(s,encoding='utf-8')
          print('TARGET_SIZE',len(s.encode()))
          PY
          test "$(git diff --name-only)" = 'Current/PWA/New-main'
          git add Current/PWA/New-main
          git commit -m 'CTO: apply product UX surgery to New-main'
          git rm .github/workflows/_cto_product_ux_surgery_20260903.yml
          git commit -m 'CTO: retire temporary product UX surgery runner'
          git push origin HEAD:cto/product-ux-surgery-20260903
