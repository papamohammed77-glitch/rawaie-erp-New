name: CTO New-main Product UX Surgical Executor
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  surgery:
    if: github.event.pull_request.head.ref == 'cto/newmain-product-ux-execute-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: cto/newmain-product-ux-execute-20260903, fetch-depth: 2}
      - name: Patch New-main only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          marker='RAWAEA_PRODUCT_UX_CLOSURE_20260903'
          if marker in s: raise SystemExit('UX_LAYER_ALREADY_PRESENT')
          assert '<html lang="ar" dir="rtl">' in s
          assert 'window.RW_Auth=' in s and 'window.RW_Navigation=' in s and 'window.RW_Views=' in s
          assert 'window.RW_ShellContext=' in s and 'window.RW_OwnerLicense=' in s
          assert 'window.byId=byId;' in s and 'window.safeText=safeText;' in s
          assert '<link rel="manifest" href="./manifest.json">' in s
          old='<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>'
          new='<div id="rw-login-company-logo" class="rw-login-logo" aria-label="شعار الشركة">ر</div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div class="rw-company-description">منصة إدارة الأعمال الذكية والمتكاملة</div>'
          assert old in s
          s=s.replace(old,new,1)
          css='''/* RAWAEA_PRODUCT_UX_CLOSURE_20260903 */\n          .rw-login-page{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 35%,#2563eb 100%)}.rw-login-page:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 15%,rgba(255,255,255,.14),transparent 28%),radial-gradient(circle at 90% 85%,rgba(255,255,255,.10),transparent 25%);pointer-events:none}.rw-login-left{padding:80px 90px;position:relative;z-index:2}.rw-brand-badge{padding:12px 22px;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);margin-bottom:28px;font-size:14px}.rw-login-title{font-size:64px;margin-bottom:28px}.rw-login-description{font-size:20px;line-height:2;margin-bottom:48px;max-width:620px}.rw-login-features{gap:18px}.rw-login-feature{font-size:18px;gap:16px}.rw-login-feature-icon{width:52px;height:52px;border-radius:18px;font-size:22px;backdrop-filter:blur(14px)}.rw-login-right{padding:40px;position:relative;z-index:2}.rw-login-card{max-width:520px;border-radius:36px;padding:48px 42px;box-shadow:0 30px 80px rgba(0,0,0,.18)}.rw-login-card:before{content:"";position:absolute;top:0;left:0;width:100%;height:8px;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:36px 36px 0 0}.rw-login-logo{width:120px;height:120px;border-radius:32px;font-size:42px;box-shadow:0 20px 40px rgba(37,99,235,.25);margin-bottom:22px;overflow:hidden}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-company-name{font-size:34px;margin-bottom:10px}.rw-company-description{font-size:16px;font-weight:600}.rw-login-logo-area{margin-bottom:38px}.rw-login-form{gap:24px}.rw-input{height:64px;border-radius:20px}.rw-login-btn{height:64px;border-radius:22px;font-size:18px}.rw-sidebar{width:280px;min-width:280px;box-shadow:0 0 20px rgba(0,0,0,.03)}.rw-sidebar.collapsed{width:80px;min-width:80px}.rw-sidebar-top{padding:60px 24px 18px}.rw-sidebar-brand-logo{width:76px;height:76px;border-radius:20px;object-fit:contain;background:#eff6ff}.rw-sidebar-user{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:14px 0 2px;border-radius:20px;background:#f8fafc;border:1px solid #f1f5f9}.rw-sidebar-user-avatar{width:44px;height:44px;min-width:44px;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:14px;font-weight:800;white-space:nowrap}.rw-sidebar-user-role{font-size:11px;color:#64748b;margin-top:2px}.rw-sidebar-link.active{background:var(--pl)!important;color:var(--p)!important}@media(max-width:1100px){.rw-login-left{display:none}.rw-login-right{width:100%}.rw-sidebar{transform:translateX(100%)}.rw-sidebar.active{transform:translateX(0)}.rw-main-content,.rw-main-content.expanded{margin-right:0}}@media(max-width:650px){.rw-login-right{padding:15px}.rw-login-card{padding:30px 24px}.rw-login-logo{width:104px;height:104px}.rw-login-title{font-size:34px}.rw-company-name{font-size:28px}}\n          '''
          pos=s.rfind('</style>'); assert pos>=0; s=s[:pos]+css+s[pos:]
          runtime='''<script id="RAWAEA_UX_PRODUCT_RUNTIME">(function(){'use strict';function id(x){return document.getElementById(x)}function sync(c,u){c=c||{};var n=String(c.name||'الروائع ERP').trim()||'الروائع ERP',l=String(c.logo||'').trim(),box=id('rw-login-company-logo')||document.querySelector('.rw-login-logo');if(box){var im=id('rw-login-brand-image');if(l){if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';box.textContent='';box.appendChild(im)}im.src=l;im.style.display='block'}else if(im){im.style.display='none';im.removeAttribute('src')}box.setAttribute('aria-label','شعار '+n)}var cn=id('rw-login-company-name')||document.querySelector('.rw-company-name');if(cn)cn.textContent=n;var sn=id('rw-sidebar-company-name');if(sn)sn.textContent=n;var sl=id('rw-sidebar-brand-logo');if(sl&&l)sl.src=l;if(u){var top=document.querySelector('.rw-sidebar-top'),b=id('rw-sidebar-user-card');if(top&&!b){b=document.createElement('div');b.id='rw-sidebar-user-card';b.className='rw-sidebar-user';var av=document.createElement('div');av.id='rw-sidebar-user-avatar';av.className='rw-sidebar-user-avatar';var wrap=document.createElement('div'),nu=document.createElement('div'),ro=document.createElement('div');nu.id='rw-sidebar-user-name';nu.className='rw-sidebar-user-name';ro.id='rw-sidebar-user-role';ro.className='rw-sidebar-user-role';wrap.append(nu,ro);b.append(av,wrap);top.appendChild(b)}if(b){var un=String(u.name||u.email||'مستخدم');id('rw-sidebar-user-name').textContent=un;id('rw-sidebar-user-role').textContent=String(u.role||'—');id('rw-sidebar-user-avatar').textContent=un.charAt(0)||'م'}}}function stateSync(){var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{};sync(c,a.currentUser)}window.RW_UX_PRODUCT_SYNC=stateSync;window.RW_UX_PRODUCT={sync:stateSync,brand:sync};try{var re=localStorage.getItem('rawaea_remember_email');if(re&&id('rw-username')){id('rw-username').value=re;if(id('rw-remember'))id('rw-remember').checked=true}}catch(e){}var client=window.RW_SUPABASE_CLIENT||null;if(client){try{client.from('app_settings').select('company_name,company_logo').limit(1).maybeSingle().then(function(r){if(!r.error&&r.data){sync({name:r.data.company_name,logo:r.data.company_logo});try{localStorage.setItem('rawaea_company_name',r.data.company_name||'الروائع ERP');if(r.data.company_logo)localStorage.setItem('rawaea_company_logo',r.data.company_logo)}catch(e){}}}).catch(function(){})}catch(e){}}if(window.RW_Auth){var e0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(u){var z=await e0.call(this,u);stateSync();return z};var l0=RW_Auth.login;RW_Auth.login=async function(u,p){var z=await l0.call(this,u,p);try{var r=id('rw-remember');if(r&&r.checked)localStorage.setItem('rawaea_remember_email',u);else localStorage.removeItem('rawaea_remember_email')}catch(e){}return z};if(typeof RW_Auth.forgotPassword!=='function')RW_Auth.forgotPassword=async function(){var em=(id('rw-username')&&id('rw-username').value||'').trim();if(!em)throw new Error('أدخل البريد الإلكتروني أولاً');if(!client)throw new Error('خدمة المصادقة غير متاحة');var r=await client.auth.resetPasswordForEmail(em,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;return true};var fg=id('rw-forgot');if(fg&&!fg.dataset.uxBound){fg.dataset.uxBound='1';fg.addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().then(function(){if(typeof toast==='function')toast('تم إرسال رابط إعادة تعيين كلمة المرور','success')}).catch(function(e){if(typeof safeText==='function')safeText(id('rw-login-error'),e.message||String(e));if(id('rw-login-error'))id('rw-login-error').classList.remove('hidden')})})}}stateSync();setTimeout(stateSync,700);setTimeout(stateSync,1800)})();</script>'''
          end=s.rfind('</script>'); assert end>=0; s=s[:end]+runtime+s[end:]
          p.write_text(s,encoding='utf-8')
          m=re.search(r'<script id="RAWAEA_UX_PRODUCT_RUNTIME">([\s\S]*?)</script>',s); assert m
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(m.group(1),encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          assert s.count(marker)==1 and s.count('RAWAEA_UX_PRODUCT_RUNTIME')==1
          print('STATIC_PRODUCT_UX_PASS')
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Browser product UX gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea && mkdir -p /tmp/rawaea/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea/Current/PWA/manifest.json
          cat >/tmp/http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('/tmp/rawaea');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/http.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid; trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'}),pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){return{from:function(){return{select:function(){return this},limit:function(){return this},maybeSingle:function(){return Promise.resolve({data:{company_name:'الروائع',company_logo:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3Crect width="80" height="80" fill="%232563eb"/%3E%3C/svg%3E'},error:null})}},auth:{resetPasswordForEmail:async()=>({error:null}),getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub-login')}),signOut:async()=>({})}}}}`});return r.continue()});await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1600);const a=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]'),m=await(await fetch(l.href)).json(),q=document.querySelector.bind(document),menu=(RW_Navigation&&RW_Navigation.menuTree)||[],views=[];(function w(x){(x||[]).forEach(v=>{if(v.view)views.push(v.view);if(v.submenu)w(v.submenu)})})(menu);return{login:!!q('#rw-login-form'),sidebar:!!q('#rw-sidebar'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof window.safeText==='function',ux:typeof RW_UX_PRODUCT_SYNC==='function',forgot:typeof RW_Auth?.forgotPassword==='function',remember:q('#rw-username')?.value==='remembered@example.com',brand:q('#rw-login-company-name')?.textContent,brandImg:!!q('#rw-login-brand-image')&&q('#rw-login-brand-image').style.display!=='none',title:parseFloat(getComputedStyle(q('.rw-login-title')).fontSize),pad:parseFloat(getComputedStyle(q('.rw-login-card')).paddingTop),logo:q('.rw-login-logo').getBoundingClientRect().width,manifest:l?.getAttribute('href')||'',start:m.start_url,scope:m.scope,dir:m.dir,lang:m.lang,views}});const need=['dashboard','telesales','customers','pos','orders','runsheets','suppliers','purchases','receiving','items','inventory','vouchers','picking','loading','delivery','return','unloading','branches','transfer','direct-sale','direct-return','supplier-return','vehicle-count','branch-count','general-count','finance','settlement','reports-dashboard','reports-detailed','reports-comprehensive','reports','audit','hr','crm','users','roles','license','settings','notifications'];const ux=await p.evaluate(()=>{RW_STATE.app.company={name:'شركة اختبار',logo:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3Crect width="96" height="96" fill="%230ea5e9"/%3E%3C/svg%3E'};RW_STATE.app.currentUser={name:'مستخدم تجريبي',role:'Owner'};RW_UX_PRODUCT_SYNC();return{brand:q('#rw-login-company-name')?.textContent,img:!!q('#rw-login-brand-image')&&q('#rw-login-brand-image').style.display!=='none,user:q('#rw-sidebar-user-name')?.textContent,role:q('#rw-sidebar-user-role')?.textContent}});await b.close();const miss=need.filter(v=>!a.views.includes(v));console.log('PRODUCT_UX_BROWSER='+JSON.stringify({a,ux,pe,ce,miss}));if(pe.length||ce.length||!a.login||!a.sidebar||!a.auth||!a.nav||!a.views||!a.shell||!a.owner||!a.safeText||!a.ux||!a.forgot||!a.remember||!a.brand||!a.brandImg||a.title<60||a.pad<40||a.logo<100||a.manifest!=='./manifest.json'||a.start!=='./New-main'||a.scope!=='./'||a.dir!=='rtl'||a.lang!=='ar'||miss.length||ux.brand!=='شركة اختبار'||!ux.img||ux.user!=='مستخدم تجريبي'||ux.role!=='Owner')process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo BROWSER_PRODUCT_UX_PASS
      - name: Commit target only and retire runner
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-UX] Persist New-main product UX closure only'
          git rm .github/workflows/_cto_product_ux_surgery_20260903.yml
          git commit -m '[CTO] Retire temporary New-main UX executor'
          git push origin HEAD:cto/newmain-product-ux-execute-20260903
