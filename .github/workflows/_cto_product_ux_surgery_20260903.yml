name: CTO New-main Product UX Auditable Executor
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  execute:
    if: github.event.pull_request.head.ref == 'cto/newmain-product-ux-audit-execute-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cto/newmain-product-ux-audit-execute-20260903
          fetch-depth: 2
      - name: Surgical product UX patch — New-main only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert '<html lang="ar" dir="rtl">' in s
          assert 'window.RW_Auth=' in s and 'window.RW_Navigation=' in s and 'window.RW_Views=' in s
          assert 'window.RW_ShellContext=' in s and 'window.RW_OwnerLicense=' in s
          assert 'window.byId=byId;' in s and 'window.safeText=safeText;' in s
          assert '<link rel="manifest" href="./manifest.json">' in s
          marker='RAWAEA_PRODUCT_UX_CLOSURE_20260903'
          assert marker not in s
          old='<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>'
          new='<div id="rw-login-company-logo" class="rw-login-logo" aria-label="شعار الشركة">ر</div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div class="rw-company-description">منصة إدارة الأعمال الذكية والمتكاملة</div>'
          assert old in s
          s=s.replace(old,new,1)
          css='''/* RAWAEA_PRODUCT_UX_CLOSURE_20260903 */
          .rw-login-page{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 35%,#2563eb 100%)}.rw-login-page:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 15%,rgba(255,255,255,.14),transparent 28%),radial-gradient(circle at 90% 85%,rgba(255,255,255,.10),transparent 25%);pointer-events:none}.rw-login-left{padding:80px 90px;position:relative;z-index:2}.rw-login-title{font-size:64px;line-height:1.15}.rw-login-description{font-size:20px;line-height:2;max-width:620px}.rw-login-right{padding:40px;position:relative;z-index:2}.rw-login-card{max-width:520px;border-radius:36px;padding:48px 42px;box-shadow:0 30px 80px rgba(0,0,0,.18);position:relative}.rw-login-card:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:36px 36px 0 0}.rw-login-logo{width:120px;height:120px;border-radius:32px;overflow:hidden;box-shadow:0 20px 40px rgba(37,99,235,.25)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-company-name{font-size:34px}.rw-login-form{gap:24px}.rw-input,.rw-login-btn{height:64px;border-radius:20px}.rw-sidebar{width:280px;min-width:280px;box-shadow:0 0 20px rgba(0,0,0,.03)}.rw-sidebar.collapsed{width:80px;min-width:80px}.rw-sidebar-top{padding:60px 24px 18px}.rw-sidebar-brand-logo{width:76px;height:76px;border-radius:20px;object-fit:contain;background:#eff6ff}.rw-sidebar-user{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:14px 0 2px;border-radius:20px;background:#f8fafc;border:1px solid #f1f5f9;overflow:hidden}.rw-sidebar-user-avatar{width:44px;height:44px;min-width:44px;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:14px;font-weight:800;white-space:nowrap}.rw-sidebar-user-role{font-size:11px;color:#64748b}.rw-sidebar-link.active{background:var(--pl)!important;color:var(--p)!important}.rw-main-content{margin-right:280px}.rw-header{height:96px}.rw-page-container{padding:34px}.rw-kpi-grid{grid-template-columns:repeat(4,1fr);gap:24px}.rw-kpi-card{border-radius:30px;padding:28px}.rw-module-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.rw-module{border-radius:20px;padding:18px}@media(max-width:1100px){.rw-login-left{display:none}.rw-login-right{width:100%}.rw-sidebar{transform:translateX(100%)}.rw-sidebar.active{transform:translateX(0)}.rw-main-content,.rw-main-content.expanded{margin-right:0}.rw-kpi-grid{grid-template-columns:repeat(2,1fr)}.rw-module-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.rw-page-container{padding:12px}.rw-kpi-grid,.rw-module-grid{grid-template-columns:1fr}.rw-header{padding:0 12px}.rw-header-search{display:none}.rw-login-right{padding:15px}.rw-login-card{padding:30px 24px}.rw-login-logo{width:104px;height:104px}.rw-login-title{font-size:34px}.rw-company-name{font-size:28px}}
          '''
          pos=s.rfind('</style>'); assert pos>=0; s=s[:pos]+css+s[pos:]
          nav='<div id="rw-sidebar-nav" class="rw-sidebar-nav">'; assert s.count(nav)==1; s=s.replace(nav,'<div id="rw-sidebar-user-slot"></div>'+nav,1)
          runtime='''<script id="RAWAEA_UX_PRODUCT_RUNTIME">(function(){'use strict';function id(x){return document.getElementById(x)}function sync(c,u){c=c||{};var n=String(c.name||'الروائع ERP').trim()||'الروائع ERP',l=String(c.logo||'').trim(),b=id('rw-login-company-logo')||document.querySelector('.rw-login-logo');if(b){var im=id('rw-login-brand-image');if(l){if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';b.textContent='';b.appendChild(im)}im.src=l;im.style.display='block'}else if(im){im.removeAttribute('src');im.style.display='none'}b.setAttribute('aria-label','شعار '+n)}var cn=id('rw-login-company-name')||document.querySelector('.rw-company-name');if(cn)cn.textContent=n;var sn=id('rw-sidebar-company-name');if(sn)sn.textContent=n;var sl=id('rw-sidebar-brand-logo');if(sl&&l)sl.src=l;if(u){var top=document.querySelector('.rw-sidebar-top'),card=id('rw-sidebar-user-card');if(top&&!card){card=document.createElement('div');card.id='rw-sidebar-user-card';card.className='rw-sidebar-user';card.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar"></div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name"></div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role"></div></div>';top.appendChild(card)}if(card){var un=String(u.name||u.email||'مستخدم');id('rw-sidebar-user-name').textContent=un;id('rw-sidebar-user-role').textContent=String(u.role||'—');id('rw-sidebar-user-avatar').textContent=un.charAt(0)||'م'}}}function stateSync(){var a=window.RW_STATE&&RW_STATE.app||{};sync(a.company||{},a.currentUser)}window.RW_UX_PRODUCT_SYNC=stateSync;try{var rem=localStorage.getItem('rawaea_remember_email')||'';if(rem&&id('rw-username')){id('rw-username').value=rem;if(id('rw-remember'))id('rw-remember').checked=true}}catch(e){}if(window.RW_Auth){if(typeof RW_Auth.enterSystem==='function'){var e0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(u){var z=await e0.call(this,u);stateSync();return z}}if(typeof RW_Auth.login==='function'){var l0=RW_Auth.login;RW_Auth.login=async function(u,p){var z=await l0.call(this,u,p);try{var r=id('rw-remember');if(r&&r.checked)localStorage.setItem('rawaea_remember_email',u);else localStorage.removeItem('rawaea_remember_email')}catch(e){}return z}}if(typeof RW_Auth.forgotPassword!=='function')RW_Auth.forgotPassword=async function(){var em=((id('rw-username')||{}).value||'').trim();if(!em)throw new Error('أدخل البريد الإلكتروني أولاً');var c=window.RW_SUPABASE_CLIENT||null;if(!c||!c.auth)throw new Error('خدمة المصادقة غير متاحة');var r=await c.auth.resetPasswordForEmail(em,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;return true};var fg=id('rw-forgot');if(fg&&!fg.dataset.uxBound){fg.dataset.uxBound='1';fg.addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().catch(function(x){if(typeof safeText==='function')safeText(id('rw-login-error'),x.message||String(x));if(id('rw-login-error'))id('rw-login-error').classList.remove('hidden')})})}}stateSync();setTimeout(stateSync,900);setTimeout(stateSync,2400)})();</script>'''
          end=s.rfind('</script>'); assert end>=0; s=s[:end]+runtime+s[end:]
          q=re.search(r'<script id="RAWAEA_UX_PRODUCT_RUNTIME">([\s\S]*?)</script>',s); assert q
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(q.group(1),encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          p.write_text(s,encoding='utf-8')
          print('STATIC_PRODUCT_UX_PASS SHA256='+hashlib.sha256(s.encode()).hexdigest()+' BYTES='+str(len(s.encode())))
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Browser product UX gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea && mkdir -p /tmp/rawaea/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea/Current/PWA/manifest.json
          cat >/tmp/http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('/tmp/rawaea');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/http.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid; trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'}),pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(2400);const a=await p.evaluate(async()=>{const q=document.querySelector.bind(document),l=q('link[rel="manifest"]'),mf=await(await fetch('/Current/PWA/manifest.json')).json(),menu=window.RW_Navigation?.menuTree||[],views=[];(function w(x){(x||[]).forEach(v=>{if(v.view)views.push(v.view);if(v.submenu)w(v.submenu)})})(menu);return{login:!!q('#rw-login-form'),sidebar:!!q('#rw-sidebar'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof window.safeText==='function',ux:typeof RW_UX_PRODUCT_SYNC==='function',forgot:typeof RW_Auth?.forgotPassword==='function',remember:q('#rw-username')?.value==='remembered@example.com',title:parseFloat(getComputedStyle(q('.rw-login-title')).fontSize),pad:parseFloat(getComputedStyle(q('.rw-login-card')).paddingTop),logo:q('.rw-login-logo').getBoundingClientRect().width,manifest:l?.getAttribute('href')||'',mf,views}});const need=['dashboard','telesales','customers','pos','orders','runsheets','suppliers','purchases','receiving','items','inventory','vouchers','picking','loading','delivery','return','unloading','branches','transfer','direct-sale','direct-return','supplier-return','vehicle-count','branch-count','general-count','finance','settlement','reports-dashboard','reports-detailed','reports-comprehensive','reports','audit','hr','crm','users','roles','license','settings','notifications'];const ux=await p.evaluate(()=>{RW_STATE.app.company={name:'شركة اختبار',logo:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3Crect width="96" height="96" fill="%230ea5e9"/%3E%3C/svg%3E'};RW_STATE.app.currentUser={name:'مستخدم تجريبي',role:'Owner'};RW_UX_PRODUCT_SYNC();return{brand:document.querySelector('#rw-login-company-name')?.textContent,img:!!document.querySelector('#rw-login-brand-image'),user:document.querySelector('#rw-sidebar-user-name')?.textContent,role:document.querySelector('#rw-sidebar-user-role')?.textContent}});const miss=need.filter(v=>!a.views.includes(v));await b.close();console.log(JSON.stringify({a,ux,pe,ce,miss}));const m=a.mf;if(pe.length||ce.length||!a.login||!a.sidebar||!a.auth||!a.nav||!a.views||!a.shell||!a.owner||!a.safeText||!a.ux||!a.forgot||!a.remember||a.title<60||a.pad<40||a.logo<100||a.manifest!=='./manifest.json'||m.start_url!=='./New-main'||m.scope!=='./'||m.dir!=='rtl'||m.lang!=='ar'||miss.length||ux.brand!=='شركة اختبار'||!ux.img||ux.user!=='مستخدم تجريبي'||ux.role!=='Owner')process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo BROWSER_PRODUCT_UX_PASS
      - name: Persist target only and retire executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .cto-newmain-trigger .cto-newmain-trigger-2 .cto-newmain-trigger-3 .cto-newmain-trigger-4 .cto-newmain-trigger-5 .cto-newmain-trigger-6 .cto-run
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] [GOLD] [DIAMOND] New-main product UX closure'
          git rm .github/workflows/_cto_product_ux_surgery_20260903.yml
          git commit -m 'CTO: retire temporary New-main UX executor'
          git push origin HEAD:cto/newmain-product-ux-audit-execute-20260903
