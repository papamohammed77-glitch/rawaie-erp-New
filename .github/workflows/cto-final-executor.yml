name: CTO Final New-main Executor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message == '[CTO-EXEC] New-main final closure trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Apply safe target-only closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib, json, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.encode('utf-8'))>400000
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('window.byId=byId;')==1 and s.count('window.safeText=safeText;')==1
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert './New-main.manifest.json' not in s
          for ident in ('RAWAEA_PRODUCT_UX_RUNTIME','RAWAEA_LOGIN_PRODUCT_UX_V1','RAWAEA_CTO_FINAL_TARGET_LAYER','RAWAEA_FINAL_PRODUCT_CLOSURE','RAWAEA_FINAL_PRODUCT_CLOSURE_20260903'):
              s=re.sub(r'<script\b[^>]*\bid=["\']'+re.escape(ident)+r'["\'][^>]*>[\s\S]*?</script>', '', s, count=1, flags=re.I)
          # Preserve the governed auth flow; repair only an exact empty-argument call.
          if 'await window.RW_Auth.enterSystem();' in s and 'authUser' in s: s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          if 'await RW_Auth.enterSystem();' in s and 'authUser' in s: s=s.replace('await RW_Auth.enterSystem();','await RW_Auth.enterSystem(authUser);')
          s=s.replace('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>','')
          assert 'register-sw.js' not in s
          for a,b in [('./pos.html','pos'),('./telesales.html','telesales'),('./buyer.html','purchases'),('./vouchers.html','vouchers'),('./picker.html','picking'),('./loader.html','loading'),('./driver.html','delivery'),('./Returns.html','returns'),('./unloader.html','unloading')]: s=s.replace(a,b)
          for z in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']: assert z not in s,z
          marker='RAWAEA_CTO_SAFE_PRODUCT_CLOSURE_20260903'
          if marker not in s:
              layer=r'''<!-- RAWAEA_CTO_SAFE_PRODUCT_CLOSURE_20260903 --><style id="RAWAEA_CTO_SAFE_PRODUCT_STYLE">.rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#2563eb,#06b6d4);z-index:2}.rw-login-logo{width:108px!important;height:108px!important;border-radius:27px!important;overflow:hidden;box-shadow:0 18px 40px rgba(37,99,235,.22)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #eef2f7}.rw-sidebar-user-avatar{width:38px;height:38px;min-width:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:650px){.rw-login-logo{width:92px!important;height:92px!important}}</style><script id="RAWAEA_CTO_SAFE_PRODUCT_RUNTIME">(function(){'use strict';var e=function(i){return document.getElementById(i)},q=function(s){return document.querySelector(s)},d=function(x,f){return x==null||x===''?f:x};function sync(){try{var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},u=a.currentUser||{},n=String(d(c.name,'الروائع ERP')).trim()||'الروائع ERP',logo=String(c.logo||'').trim(),ln=e('rw-login-company-name')||q('.rw-company-name'),sn=e('rw-sidebar-company-name'),lb=e('rw-login-company-logo')||q('.rw-login-logo'),sl=e('rw-sidebar-brand-logo');if(ln)ln.textContent=n;if(sn)sn.textContent=n;if(lb&&logo){var im=e('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';lb.textContent='';lb.appendChild(im)}im.src=logo;im.style.display='block'}if(sl&&logo)sl.src=logo;var top=q('.rw-sidebar-top');if(top&&(u.name||u.email)){var card=e('rw-sidebar-user-card');if(!card){card=document.createElement('div');card.id='rw-sidebar-user-card';card.className='rw-sidebar-user';card.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name">مستخدم</div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role">—</div></div>';top.appendChild(card)}var un=String(d(u.name,u.email||'مستخدم'));e('rw-sidebar-user-name').textContent=un;e('rw-sidebar-user-role').textContent=String(d(u.role,'—'));e('rw-sidebar-user-avatar').textContent=un.trim().charAt(0)||'م'}}catch(x){}}window.RW_CTO_SafeProduct={sync:sync};sync();setInterval(sync,1000);try{var r=e('rw-remember'),u=e('rw-username'),s=localStorage.getItem('rawaea_remember_email')||'';if(r&&u&&s){u.value=s;r.checked=true}var f=e('rw-login-form');if(f&&!f.dataset.ctoRemember){f.dataset.ctoRemember='1';f.addEventListener('submit',function(){try{if(r&&u&&r.checked)localStorage.setItem('rawaea_remember_email',u.value||'');else localStorage.removeItem('rawaea_remember_email')}catch(x){}})}}catch(x){}})();</script>'''
              cut=s.rfind('</body>'); assert cut>0; s=s[:cut]+'\n'+layer+'\n'+s[cut:]
          assert s.count(marker)==1
          assert s.count('RAWAEA_CTO_SAFE_PRODUCT_RUNTIME')==1
          assert s.count('RAWAEA_CTO_SAFE_PRODUCT_STYLE')==1
          mp=s.find(marker); pw=[m.start() for m in re.finditer(r'printWindow\.document\.write',s)]
          assert not pw or mp>max(pw)+10000
          m=re.search(r'<script id="RAWAEA_CTO_SAFE_PRODUCT_RUNTIME">([\s\S]*?)</script>',s); assert m
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(m.group(1),encoding='utf-8'); rc=subprocess.run(['node','--check',str(f)],capture_output=True,text=True); f.unlink(missing_ok=True); assert rc.returncode==0,rc.stderr
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8')); assert (mf.get('start_url'),mf.get('scope'),mf.get('dir'),mf.get('lang'))==('./New-main','./','rtl','ar')
          p.write_text(s,encoding='utf-8'); print('TARGET_STATIC_GATE=PASS'); print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Real browser gate over served HTML
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/rawaea-http.log 2>&1 & pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT; sleep 1
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({viewport:{width:1440,height:900}}),pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));await p.route('https://**/*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};window.Swal={fire:async()=>({}),close(){}};window.XLSX={};window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:null}),signOut:async()=>({error:null}),resetPasswordForEmail:async()=>({error:null}),getUser:async()=>({data:{user:null},error:null})},from(){return{select(){return this},eq(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null})}}})};'}));await p.goto('http://127.0.0.1:4173/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1800);const a=await p.evaluate(()=>({rtl:document.documentElement.dir==='rtl',arabic:document.documentElement.lang==='ar',login:!!document.getElementById('rw-login-form'),visible:getComputedStyle(document.getElementById('rw-login-page')).display!=='none',sidebar:!!document.querySelector('.rw-sidebar'),brand:!!document.getElementById('rw-login-company-name'),remember:document.getElementById('rw-username')?.value==='remembered@example.com',auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',warehouse:typeof RW_Warehouse==='object',byId:typeof window.byId==='function',safeText:typeof window.safeText==='function',closure:typeof RW_CTO_SafeProduct==='object',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href'),menuCount:Array.isArray(RW_Navigation?.menuTree)?RW_Navigation.menuTree.filter(x=>x&&x.view).length:0,logoSize:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0}));if(pe.length||ce.length)throw new Error('RUNTIME_ERRORS:'+JSON.stringify({pe,ce}));for(const k of ['rtl','arabic','login','visible','sidebar','brand','remember','auth','nav','views','shell','owner','warehouse','byId','safeText','closure'])if(!a[k])throw new Error('CONTRACT:'+k);if(a.manifest!=='./manifest.json'||a.menuCount<10||a.logoSize<80)throw new Error('VISUAL_CONTRACT:'+JSON.stringify(a));await p.setViewportSize({width:390,height:844});await p.waitForTimeout(300);const m=await p.evaluate(()=>({visible:getComputedStyle(document.getElementById('rw-login-page')).display!=='none',mobile:getComputedStyle(document.querySelector('.rw-mobile-menu-btn')).display!=='none'}));if(!m.visible||!m.mobile)throw new Error('MOBILE:'+JSON.stringify(m));console.log('BROWSER_GATE_PASS='+JSON.stringify({a,m}));await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Persist verified target and retire executor
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main product UX closure — verified'
          git push origin HEAD:main
