name: CTO Final New-main Executor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message == '[CTO-EXEC] New-main final closure trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Surgical target closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, json, hashlib, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.encode())>400000
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('window.byId=byId;')==1
          assert s.count('window.safeText=safeText;')==1
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert './New-main.manifest.json' not in s
          # Real HTML-parser repair: nested print templates must not contain a literal outer </script>.
          start=s.find('<script>\n(function(){')
          marker='\n</script>\n<script id="RAWAEA_MAIN_SIDEBAR_COMPLETENESS_FINAL_V1"'
          end=s.find(marker,start)
          assert start>=0 and end>start, 'MAIN_INLINE_BOUNDARY_NOT_FOUND'
          body=s[start+len('<script>\n'):end]
          embedded=body.count('</script>')
          if embedded:
              body=body.replace('</script>','<\\/script>')
              s=s[:start+len('<script>\n')]+body+s[end:]
          assert '</script>' not in body
          # The parent target must not depend on the disposable sibling application files.
          s=s.replace('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>','')
          assert 'register-sw.js' not in s
          for a,b in [('./pos.html','pos'),('./telesales.html','telesales'),('./buyer.html','purchases'),('./vouchers.html','vouchers'),('./picker.html','picking'),('./loader.html','loading'),('./driver.html','delivery'),('./Returns.html','returns'),('./unloader.html','unloading')]:
              s=s.replace(a,b)
          for z in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']:
              assert z not in s,z
          marker2='RAWAEA_CTO_SAFE_PRODUCT_CLOSURE_20260903'
          if marker2 not in s:
              layer=r'''<!-- RAWAEA_CTO_SAFE_PRODUCT_CLOSURE_20260903 --><style id="RAWAEA_CTO_SAFE_PRODUCT_STYLE">.rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#2563eb,#06b6d4);z-index:2}.rw-login-logo{width:108px!important;height:108px!important;border-radius:27px!important;overflow:hidden;box-shadow:0 18px 40px rgba(37,99,235,.22)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #eef2f7}.rw-sidebar-user-avatar{width:38px;height:38px;min-width:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:650px){.rw-login-logo{width:92px!important;height:92px!important}}</style><script id="RAWAEA_CTO_SAFE_PRODUCT_RUNTIME">(function(){'use strict';function e(i){return document.getElementById(i)}function q(s){return document.querySelector(s)}function d(x,f){return x==null||x===''?f:x}function sync(){try{var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},u=a.currentUser||{},n=String(d(c.name,'الروائع ERP')).trim()||'الروائع ERP',logo=String(c.logo||c.logo_url||'').trim(),ln=e('rw-login-company-name')||q('.rw-company-name'),sn=e('rw-sidebar-company-name'),lb=e('rw-login-company-logo')||q('.rw-login-logo'),sl=e('rw-sidebar-brand-logo');if(ln)ln.textContent=n;if(sn)sn.textContent=n;if(lb&&logo){var im=e('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';lb.textContent='';lb.appendChild(im)}im.src=logo}if(sl&&logo)sl.src=logo;var top=q('.rw-sidebar-top');if(top&&(u.name||u.email)){var card=e('rw-sidebar-user-card');if(!card){card=document.createElement('div');card.id='rw-sidebar-user-card';card.className='rw-sidebar-user';card.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name">مستخدم</div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role">—</div></div>';top.appendChild(card)}var un=String(d(u.name,u.email||'مستخدم'));e('rw-sidebar-user-name').textContent=un;e('rw-sidebar-user-role').textContent=String(d(u.role,'—'));e('rw-sidebar-user-avatar').textContent=un.trim().charAt(0)||'م'}}catch(x){}}window.RW_CTO_SafeProduct={sync:sync};sync();setTimeout(sync,500);setTimeout(sync,1500);try{var r=e('rw-remember'),u=e('rw-username'),saved=localStorage.getItem('rawaea_remember_email')||'';if(r&&u&&saved){u.value=saved;r.checked=true}var f=e('rw-login-form');if(f&&!f.dataset.ctoRemember){f.dataset.ctoRemember='1';f.addEventListener('submit',function(){try{if(r&&u&&r.checked)localStorage.setItem('rawaea_remember_email',u.value||'');else localStorage.removeItem('rawaea_remember_email')}catch(x){}})}}catch(x){}})();</script>'''
              cut=s.rfind('</body>'); assert cut>0; s=s[:cut]+'\n'+layer+'\n'+s[cut:]
          assert s.count(marker2)==1 and s.count('RAWAEA_CTO_SAFE_PRODUCT_RUNTIME')==1
          mp=s.find(marker2); pw=[m.start() for m in re.finditer(r'printWindow\.document\.write',s)]; assert not pw or mp>max(pw)+10000
          m=re.search(r'<script id="RAWAEA_CTO_SAFE_PRODUCT_RUNTIME">([\s\S]*?)</script>',s); assert m
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(m.group(1),encoding='utf-8'); r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True); f.unlink(missing_ok=True); assert r.returncode==0,r.stderr
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8')); assert (mf.get('start_url'),mf.get('scope'),mf.get('dir'),mf.get('lang'))==('./New-main','./','rtl','ar')
          p.write_text(s,encoding='utf-8'); print('STATIC_GATE_PASS'); print('EMBEDDED_SCRIPT_CLOSES_REPAIRED='+str(embedded)); print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Browser gate on served target
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/rawaea-http.log 2>&1 & pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/Current/PWA/New-main >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/Current/PWA/New-main >/dev/null
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({viewport:{width:1440,height:900},serviceWorkers:'block'}),pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
          await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('@supabase/supabase-js'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){function q(t){let o={_t:t};o.select=()=>o;o.eq=()=>o;o.neq=()=>o;o.in=()=>o;o.or=()=>o;o.order=()=>o;o.limit=()=>o;o.range=()=>o;o.gte=()=>o;o.lte=()=>o;o.is=()=>o;o.not=()=>o;o.contains=()=>o;o.filter=()=>o;o.maybeSingle=async()=>({data:t==='users'?{id:'u',name:'المالك العام',email:'owner@alrawae.com',role:'مدير النظام',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null}:t==='owner_profile'?{auth_user_id:'auth-owner',owner_name:'المالك العام',owner_email:'owner@alrawae.com',license_status:'active'}:t==='app_settings'?{company_name:'الروائع',company_logo:null,status:'trial'}:null),error:null});o.then=f=>Promise.resolve({data:[],error:null,count:0}).then(f);o.insert=async()=>({data:null,error:null});o.update=()=>o;o.delete=()=>o;o.upsert=async()=>({data:null,error:null});return o}return{from:q,rpc:async()=>({data:null,error:null}),auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),signOut:async()=>({error:null}),resetPasswordForEmail:async()=>({error:null})}}};`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});if(u.includes('fonts.googleapis.com'))return r.fulfill({status:200,contentType:'text/css',body:''});if(u.includes('cdnjs.cloudflare.com'))return r.fulfill({status:200,contentType:'text/css',body:''});return r.continue()});
          await p.goto('http://127.0.0.1:4173/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1200);
          const surface=await p.evaluate(()=>({rtl:document.documentElement.dir==='rtl',arabic:document.documentElement.lang==='ar',login:!!document.getElementById('rw-login-form'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof safeText==='function',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',menuCount:Array.isArray(RW_Navigation?.menuTree)?RW_Navigation.menuTree.length:0,loginTitle:getComputedStyle(document.querySelector('.rw-login-title')).fontSize,loginLogo:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0}));
          if(pe.length||ce.length)throw new Error('INITIAL_RUNTIME_ERRORS '+JSON.stringify({pe,ce,surface}));if(!surface.rtl||!surface.arabic||!surface.login||!surface.auth||!surface.nav||!surface.views||!surface.shell||!surface.owner||!surface.safeText||surface.manifest!=='./manifest.json'||surface.menuCount<10)throw new Error('SURFACE_GATE '+JSON.stringify(surface));
          await p.evaluate(async()=>{await RW_Auth.enterSystem({id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}})});await p.waitForTimeout(250);
          const company=await p.evaluate(()=>({id:RW_STATE.app.companyId,name:RW_STATE.app.company?.name,owner:RW_STATE.app.currentUser?.isOwner,license:RW_STATE.app.licenseState,sidebar:document.getElementById('rw-sidebar-company-name')?.textContent,main:!document.getElementById('rw-main-shell')?.classList.contains('hidden')}));if(company.id!=='00000000-0000-0000-0000-000000000001'||company.name!=='الروائع'||!company.owner||company.license!=='active'||company.sidebar!=='الروائع'||!company.main)throw new Error('COMPANY_GATE '+JSON.stringify(company));
          const dash=await p.evaluate(()=>({view:RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.innerText||''}));if(dash.view!=='dashboard')throw new Error('DASHBOARD_GATE '+JSON.stringify(dash));
          await p.evaluate(async()=>{await RW_Navigation.navigate('orders')});const sales=await p.evaluate(()=>({view:RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.innerText||''}));if(sales.view!=='orders')throw new Error('SALES_GATE '+JSON.stringify(sales));
          await p.evaluate(async()=>{await RW_Navigation.navigate('license')});const gold=await p.evaluate(()=>({view:RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.innerText||'',container:!!document.getElementById('license-main-container')}));if(gold.view!=='license'||!gold.container)throw new Error('GOLD_GATE '+JSON.stringify(gold));
          await p.evaluate(()=>{RW_STATE.app.currentUser={id:'u2',isOwner:false,permissions:[]};RW_STATE.permissions=[]});const diamond=await p.evaluate(async()=>{try{await RW_Navigation.navigate('license');return {ok:false,error:'NO_REJECTION'}}catch(e){return {ok:true,error:String(e.message||e)}}});if(!diamond.ok||diamond.error!=='OWNER_ONLY')throw new Error('DIAMOND_GATE '+JSON.stringify(diamond));
          console.log('GOLD=PASS');console.log('DIAMOND=PASS');console.log('CLOSED_100=PASS');console.log(JSON.stringify({surface,company,dashboard:dash.view,sales,gold,diamond}));await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Commit verified target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main product UX closure — verified'
          git push origin HEAD:main
