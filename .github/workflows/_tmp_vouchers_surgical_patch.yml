name: temporary vouchers surgical patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-vouchers-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair surgical override declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/vouchers.html')
          t=p.read_text(encoding='utf-8')
          marker='/* SURGICAL-VEHICLE-REP-SUPPLIER-FIX-2026-08-21 */'
          decl="  var basePickArr=App.pickArr,basePickSearch=App.pickSearch,basePickSelect=App.pickSelect,baseRouteHtml=App.routeHtml,baseSummary=App.summary,baseSubmit=App.submit;\n"
          if marker not in t: raise SystemExit('marker missing')
          start=t.index(marker)
          line="  App.__SURGICAL_VRS_FIX_20260821__=true;\n"
          pos=t.index(line,start)+len(line)
          segment=t[start:pos+len(decl)+10]
          if decl not in segment:
              t=t[:pos]+decl+t[pos:]
              p.write_text(t,encoding='utf-8')
              print('DECLARATION_INSERTED')
          else:
              print('DECLARATION_ALREADY_PRESENT')
          PY
          git diff --check
          git config user.name 'rawaea-surgical-bot'
          git config user.email 'rawaea-surgical-bot@users.noreply.github.com'
          git add Current/PWA/vouchers.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(vouchers): repair surgical override references [skip-vouchers-patch]'
          git push
