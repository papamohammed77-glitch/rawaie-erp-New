name: medhat-temporary-receive-id-20260819

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: patch receive purchase operation id'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch receive purchase request identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/main.html')
          s = p.read_text(encoding='utf-8')
          old = """return fetch(SUPABASE_URL + '/functions/v1/receive-purchase', {\n              method: 'POST',\n              headers: {\n                  'Content-Type': 'application/json',\n                  'Authorization': 'Bearer ' + token\n              },\n              body: JSON.stringify({\n                  po_code: poCode,\n                  itemsReceived: r.value,\n                  notes: notes\n              })\n          });"""
          new = """var receiveOperationId = crypto.randomUUID();\n          return fetch(SUPABASE_URL + '/functions/v1/receive-purchase', {\n              method: 'POST',\n              headers: {\n                  'Content-Type': 'application/json',\n                  'Authorization': 'Bearer ' + token,\n                  'Idempotency-Key': receiveOperationId\n              },\n              body: JSON.stringify({\n                  po_code: poCode,\n                  itemsReceived: r.value,\n                  notes: notes,\n                  operation_id: receiveOperationId\n              })\n          });"""
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 receive-purchase call sites, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Current/PWA/main.html
          git commit -m "fix(inventory): add receive purchase operation identity [skip ci]"
          git push
