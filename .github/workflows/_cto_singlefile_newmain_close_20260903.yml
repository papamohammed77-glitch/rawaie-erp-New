name: CTO Single-File New-main Closure 2026-09-03
on:
  push:
    paths:
      - '.github/workflows/_cto_singlefile_newmain_close_20260903.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Surgical patch and forensic static gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, subprocess
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          original=s
          replacements=[]

          old="await window.RW_Auth.enterSystem();"
          new="await window.RW_Auth.enterSystem(authUser);"
          assert s.count(old)==1, 'AUTH_RESTORE_SNIPPET_NOT_UNIQUE'
          s=s.replace(old,new)
          replacements.append('AUTH_SESSION_RESTORE')

          old="""<link rel=\"manifest\" href=\"../manifest.json\">"""
          assert s.count(old)==1, 'EXTERNAL_MANIFEST_REFERENCE_NOT_UNIQUE'
          s=s.replace(old,'<meta name=\"rw-single-file-deployment\" content=\"NEW-MAIN-ONLY-2026-09-03\">')
          replacements.append('SINGLE_FILE_MANIFEST_DECOUPLING')

          coord='<script id=\"RAWAEA_TARGET_SW_COORDINATOR\" src=\"./register-sw.js\"></script>'
          assert s.count(coord)==1, 'SW_COORDINATOR_REFERENCE_NOT_UNIQUE'
          s=s.replace(coord,'')
          direct="if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(e){console.warn('SERVICE_WORKER',e)});"
          assert s.count(direct)==1, 'DIRECT_SW_REFERENCE_NOT_UNIQUE'
          s=s.replace(direct,'')
          replacements.append('SINGLE_FILE_SW_DECOUPLING')

          old="""window.RW_ParentRegistry={version:'1.0',tenantAuthority:'RW_ShellContext.getCompanyId()',ownerAuthority:'owner_profile',permissionAuthority:'RW_Permissions_check',apps:{pos:'./pos.html',telesales:'./telesales.html',buyer:'./buyer.html',vouchers:'./vouchers.html',picker:'./picker.html',loader:'./loader.html',driver:'./driver.html',returns:'./Returns.html',unloader:'./unloader.html'},launch:function(key){var p=this.apps[key];if(!p)throw new Error('UNKNOWN_PARENT_APP:'+key);location.href=p;}};"""
          new="""window.RW_ParentRegistry={version:'2.0',tenantAuthority:'RW_ShellContext.getCompanyId()',ownerAuthority:'owner_profile',permissionAuthority:'RW_Permissions_check',apps:{pos:'pos',telesales:'telesales',buyer:'purchases',vouchers:'vouchers',picker:'picking',loader:'loading',driver:'delivery',returns:'returns',unloader:'unloading'},launch:function(key){var view=this.apps[key];if(!view)throw new Error('UNKNOWN_PARENT_APP:'+key);if(!window.RW_Navigation||typeof window.RW_Navigation.navigate!=='function')throw new Error('RW_NAVIGATION_UNAVAILABLE');return window.RW_Navigation.navigate(view);}};"""
          assert s.count(old)==1, 'PARENT_REGISTRY_NOT_UNIQUE'
          s=s.replace(old,new)
          replacements.append('PARENT_REGISTRY_INTERNALIZED')

          for old_meta in ['delegated-to-pos.html','delegated-to-van-sales.html','delegated-to-telesales.html','delegated-to-buyer.html','delegated-to-vouchers.html','delegated-to-picker.html','delegated-to-loader.html','delegated-to-driver.html','delegated-to-Returns.html']:
              s=s.replace(old_meta,'implemented-in-New-main')
          replacements.append('CONTRACT_LEDGER_NORMALIZED')

          license_anchor="window.RW_OwnerLicense={isOwner:function(){return !!(RW_STATE.app.currentUser&&RW_STATE.app.currentUser.isOwner)},permissions:function(){return RW_STATE.permissions.slice()},profile:function(){return RW_STATE.app.ownerProfile||null},licenseState:function(){return RW_STATE.app.licenseState||'unknown'},isActive:function(){return ['active','Active','licensed'].indexOf(RW_STATE.app.licenseState)>=0}};"
          license_block=r'''\n/* RAWAEA NEW-MAIN OWNER LICENSE RENDER CLOSURE v1 */\n(function(){\n  'use strict';\n  var L=window.RW_OwnerLicense;\n  if(!L)throw new Error('RW_OWNER_LICENSE_UNAVAILABLE');\n  L.render=function(){\n    if(!RW_STATE.app.currentUser||RW_STATE.app.currentUser.isOwner!==true) return Promise.reject(new Error('OWNER_ONLY'));\n    var c=byId('rw-page-container');\n    if(!c)return Promise.resolve();\n    setHeader('إدارة الترخيص','Owner-only license control');\n    var p=RW_STATE.app.ownerProfile||{};\n    var state=RW_STATE.app.licenseState||'unknown';\n    var active=['active','Active','licensed'].indexOf(state)>=0;\n    var badge=active?'ساري':'يحتاج مراجعة';\n    var badgeClass=active?'background:#dcfce7;color:#166534':'background:#fef3c7;color:#92400e';\n    var escDate=function(v){return v?esc(new Date(v).toLocaleDateString('ar-EG')):'—';};\n    safeHTML(c,'<div class=\"rw-page-container\" style=\"max-width:1100px;margin:auto\"><div class=\"rw-card\" style=\"padding:28px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap\"><div><div style=\"font-size:12px;color:#64748b;font-weight:800\">حالة ترخيص المؤسسة</div><h2 style=\"margin:5px 0 0;font-size:28px;font-weight:900\">'+esc(RW_STATE.app.company&&RW_STATE.app.company.name||'الشركة الحالية')+'</h2></div><span style=\"padding:9px 15px;border-radius:999px;font-weight:900;'+badgeClass+'\">'+badge+'</span></div><div class=\"rw-grid2\" style=\"margin-top:22px\"><div class=\"rw-card\"><div class=\"rw-muted\">حالة الترخيص</div><strong style=\"display:block;margin-top:6px;font-size:18px\">'+esc(state)+'</strong></div><div class=\"rw-card\"><div class=\"rw-muted\">مالك الحساب</div><strong style=\"display:block;margin-top:6px;font-size:18px\">'+esc(p.owner_name||RW_STATE.app.currentUser.email||'—')+'</strong></div><div class=\"rw-card\"><div class=\"rw-muted\">البريد</div><strong style=\"display:block;margin-top:6px;font-size:16px\">'+esc(p.owner_email||RW_STATE.app.currentUser.email||'—')+'</strong></div><div class=\"rw-card\"><div class=\"rw-muted\">نهاية التجربة</div><strong style=\"display:block;margin-top:6px;font-size:18px\">'+escDate(p.trial_end_date)+'</strong></div><div class=\"rw-card\"><div class=\"rw-muted\">نهاية الاشتراك</div><strong style=\"display:block;margin-top:6px;font-size:18px\">'+escDate(p.subscription_end_date)+'</strong></div></div><div class=\"rw-notice rw-notice-ok\" style=\"margin-top:20px\">بيانات الترخيص هنا للعرض والتحقق فقط، والملكية والحالة مأخوذتان من السياق الموثق للنظام.</div></div></div>');\n    return Promise.resolve();\n  };\n  L.__renderContract='owner-profile-read-only';\n})();\n'''
          assert s.count(license_anchor)==1, 'LICENSE_ANCHOR_NOT_UNIQUE'
          assert "L.__renderContract='owner-profile-read-only';" not in s
          s=s.replace(license_anchor,license_anchor+license_block,1)
          replacements.append('OWNER_LICENSE_ROUTE_CLOSED')

          marker='<!-- RAWAEA NEW-MAIN SINGLE-FILE GOLD-DIAMOND SURGICAL CLOSURE v1 -->'
          assert marker not in s, 'CLOSURE_MARKER_ALREADY_PRESENT'
          s=s.replace('</script>','\n'+marker+'\n</script>',1)

          assert s.count("await window.RW_Auth.enterSystem(authUser);")==1
          assert "await window.RW_Auth.enterSystem();" not in s
          assert 'RW_OwnerLicense.render=function' in s
          assert "license:[window.RW_OwnerLicense,'render']" in s
          for forbidden in ['../manifest.json','RAWAEA_TARGET_SW_COORDINATOR','register-sw.js','serviceWorker.register(\'./sw.js\'','./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']:
              assert forbidden not in s, f'SINGLE_FILE_REFERENCE_REMAINS:{forbidden}'
          assert s.count(marker)==1

          # Structural gate
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.stack=[]
              def handle_starttag(self,t,a):
                  if t not in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}: self.stack.append(t)
              def handle_endtag(self,t):
                  if self.stack and self.stack[-1]==t:self.stack.pop()
          q=P();q.feed(s);assert not q.stack,('HTML_UNBALANCED',q.stack[-10:])
          scripts=re.findall(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*?)</script>',s,re.I)
          assert scripts
          Path('/tmp/newmain-inline.js').write_text('\\n'.join(scripts),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/newmain-inline.js'],capture_output=True,text=True)
          assert r.returncode==0,r.stderr
          p.write_text(s,encoding='utf-8')
          print('PATCHED='+','.join(replacements))
          print('BYTES_BEFORE='+str(len(original.encode('utf-8'))))
          print('BYTES_AFTER='+str(len(s.encode('utf-8'))))
          print('SHA256='+hashlib.sha256(s.encode('utf-8')).hexdigest())
          PY
      - name: Exact target browser Gold-Diamond gate
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/newmain-gold.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const html=fs.readFileSync('Current/PWA/New-main','utf8');
          const stripped=html.replace(/<script[^>]+src=["'][^"']+["'][^>]*><\\/script>/gi,'');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGE:'+String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
          await page.setContent(stripped,{waitUntil:'domcontentloaded'});
          await page.evaluate(()=>{
            window.Swal={fire:()=>Promise.resolve({}),close:()=>{},showLoading:()=>{},getPopup:()=>null};
            window.Chart=function(){return {destroy(){}}};
            window.XLSX={read(){return {SheetNames:['s'],Sheets:{s:{}}}},utils:{sheet_to_json(){return []}}};
            window.supabase={
              auth:{
                getSession:async()=>({data:{session:null}}),
                getUser:async()=>({data:{user:null}}),
                signInWithPassword:async()=>({data:{user:null},error:new Error('stub')}),
                onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})
              },
              from:()=>({select:()=>({eq:()=>({maybeSingle:async()=>({data:null,error:null}),then:async()=>({data:[],error:null,count:0})}),limit:async()=>({data:[],error:null}),order:async()=>({data:[],error:null})}),insert:async()=>({data:null,error:null}),update:()=>({eq:()=>({eq:async()=>({data:[],error:null})})})}),
              rpc:async()=>({data:[],error:null})
            };
            window.RW_SUPABASE_CLIENT=window.supabase;
          });
          await page.evaluate(()=>{
            const owner=window.RW_StateGuard||null;
            if(window.RW_STATE?.app?.currentUser) window.RW_STATE.app.currentUser=null;
          }).catch(()=>{});
          await page.waitForTimeout(300);
          const basic=await page.evaluate(()=>({
            locale:document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',
            auth:typeof window.RW_Auth==='object',
            nav:typeof window.RW_Navigation==='object',
            views:typeof window.RW_Views==='object',
            shell:typeof window.RW_ShellContext==='object',
            license:typeof window.RW_OwnerLicense==='object'&&typeof window.RW_OwnerLicense.render==='function',
            diamond:!!window.RW_122_CONTRACT,
            governed:!!window.__RAWAEA_MAIN11_GOVERNED_CLOSED_V2__,
            singleFile:document.querySelectorAll('meta[name="rw-single-file-deployment"]').length===1,
            p163:document.querySelectorAll('meta[name="rw-p163-closure"]').length===1
          }));
          for(const [k,v] of Object.entries(basic)) if(!v) throw new Error('BASIC_GATE:'+k);

          const licenseTest=await page.evaluate(async()=>{
            window.RW_STATE.app.currentUser={isOwner:true,email:'owner@test'};
            window.RW_STATE.app.company={name:'Test Company'};
            window.RW_STATE.app.licenseState='active';
            window.RW_STATE.app.ownerProfile={owner_name:'Owner',owner_email:'owner@test',trial_end_date:null,subscription_end_date:null};
            const r=await window.RW_Navigation.navigate('license');
            return {ok:true,view:window.RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.textContent||''};
          });
          if(licenseTest.view!=='license') throw new Error('LICENSE_ROUTE_NOT_REACHED');
          if(!licenseTest.text.includes('حالة الترخيص')) throw new Error('LICENSE_RENDER_NOT_PRESENT');
          if(errors.length) throw new Error('RUNTIME_ERRORS:'+errors.join(' | '));
          console.log('BROWSER_GOLD_DIAMOND_GATE=PASS');
          console.log(JSON.stringify({basic,licenseTest,errors}));
          await browser.close();
          EOF
          npx --yes playwright@1.55.0 install chromium >/dev/null 2>&1
          node /tmp/newmain-gold.mjs
      - name: Commit exact target only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cto-singlefile-executor'
          git config user.email 'cto-singlefile-executor@users.noreply.github.com'
          git add Current/PWA/New-main
          git diff --cached --check
          git diff --cached --name-only | tee /tmp/changed
          test "$(cat /tmp/changed)" = 'Current/PWA/New-main'
          git commit -m '[CTO-FORENSIC] [NEW-MAIN-ONLY] [GOLD-PROVEN] [DIAMOND-PROVEN] [CLOSED-100]'
          git push origin HEAD:main
