name: CTO next closure - notification runtime
on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - '.github/workflows/_cto_next_unit_notification_20260903.yml'
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[NOTIFICATION-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Install runtime
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Surgical patch and exact-target gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          old="async function showPanel(){\n  var e=email();"
          new="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old not in s:
              raise SystemExit('NOTIFICATION_TARGET_PATTERN_MISSING')
          if s.count(old)!=1:
              raise SystemExit(f'NOTIFICATION_TARGET_PATTERN_COUNT={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('NOTIFICATION_SURGERY_APPLIED')
          PY
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert 'async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;' in s
          class T(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.i=[]; self.open=False; self.src=False; self.buf=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.open=True; self.src=bool(dict(a).get('src')); self.buf=[]
              def handle_data(self,d):
                  if self.open and not self.src: self.buf.append(d)
              def handle_endtag(self,t):
                  if t.lower()=='script':
                      if self.open and not self.src: self.i.append(''.join(self.buf))
                      self.open=False; self.src=False; self.buf=[]
          t=T(); t.feed(s); t.close(); assert len(t.i)==1, f'INLINE_SCRIPT_COUNT={len(t.i)}'
          Path('/tmp/newmain.js').write_text(t.i[0],encoding='utf-8')
          assert 'RAWAEA MAIN2 COMPATIBILITY' not in s
          assert 'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1' in s
          print('NOTIFICATION_STATIC_PASS')
          PY
          node --check /tmp/newmain.js
          cp Current/PWA/New-main Current/PWA/main.html
          cat > /tmp/notification_gate.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.route('**/*', async r=>{
              const u=r.request().url();
              if(u.includes('supabase.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:`
                window.supabase={createClient:()=>({
                  from:()=>({select:()=>({eq:()=>({order:()=>({limit:async()=>({data:[],error:null})})})})}),
                  auth:{onAuthStateChange:()=>({}),getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:null},error:null}),signOut:async()=>({}),signInWithPassword:async()=>({error:new Error('SMOKE_NO_LOGIN')})}
                })};`});
              if(u.includes('chart.umd.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:(o)=>{window.__swalCalled=true;return Promise.resolve({isConfirmed:false})},close:()=>{},showLoading:()=>{}};'});
              if(u.includes('xlsx.full.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={};'});
              if(u.includes('font-awesome')) return r.fulfill({status:200,contentType:'text/css',body:''});
              return r.continue();
            });
            const pe=[]; p.on('pageerror',e=>pe.push(e.message));
            await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});
            const out=await p.evaluate(async()=>{
              window.RW_STATE.app.currentUser={email:'smoke@example.com'};
              try { await window.RW_Notification.showPanel(); return {ok:true,called:!!window.__swalCalled}; }
              catch(e){ return {ok:false,error:String(e&&e.message||e),name:String(e&&e.name||'')}; }
            });
            console.log('NOTIFICATION_BROWSER_RESULT='+JSON.stringify({out,pe}));
            await b.close();
            if(pe.length||!out.ok||!out.called) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
          python3 -m http.server 8123 --directory Current/PWA >/tmp/notification-http.log 2>&1 &
          sleep 1
          node /tmp/notification_gate.js
          git config user.name rawaea-cto-executor
          git config user.email rawaea-cto-executor@users.noreply.github.com
          git add Current/PWA/New-main
          git diff --cached --check
          git commit -m '[NOTIFICATION-CLOSED] Surgical fix for RW_Notification.showPanel runtime closure'
          git push origin HEAD:main
# CTO RETRIGGER: execute against the current main state
