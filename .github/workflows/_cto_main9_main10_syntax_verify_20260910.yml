name: CTO Main9/Main10 Syntax Verify

on:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check Main9
        run: node --check Current/PWA/main2/main9.md
      - name: Syntax check Main10
        run: node --check Current/PWA/main2/main10.md
      - name: Assert surgical replacements
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m9 = fs.readFileSync('Current/PWA/main2/main9.md','utf8');
          const m10 = fs.readFileSync('Current/PWA/main2/main10.md','utf8');
          const required = [
            [m9, ".from('items')", ".eq('company_id', companyId)", 'Main9 tenant scoping'],
            [m10, ".from('app_settings')", ".eq('company_id', companyId)", 'Main10 license tenant scoping']
          ];
          for (const [text, a, b, label] of required) {
            if (!text.includes(a) || !text.includes(b)) throw new Error(label + ' not proven');
          }
          console.log('Surgical replacement markers verified');
          NODE
