name: complete-picking HTTP canary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  new_main_gold:
    if: ${{ github.event.head_commit.message != '[CTO-EXECUTED] New-main Gold Diamond closure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Build governed New-main from MAIN1-MAIN11
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('recon','tools/run_final_main_reconstruction_20260831.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          def fixed(chunks):
              first=m.re.search(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*)',chunks[0],m.re.I)
              if not first: raise RuntimeError('MAIN1_INLINE_SCRIPT_MISSING')
              body=first.group(1)
              for idx in range(1,len(chunks)+1):
                  if idx>1: body+='\\n\\n'+chunks[idx-1]
                  if idx<2: continue
                  f=Path('/tmp')/f'rawaea-phase-{idx}.js'; f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: raise RuntimeError(f'JS_PHASE_SYNTAX_FAIL main{idx}:\\n{r.stderr}')
          m.validate_phase_js=fixed
          m.main()
          PY

      - name: Execute P163 and Gold/Diamond source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,subprocess
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'; auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          ver="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"; gov='// MAIN2_GOVERNED_CLOSED:v1'
          required=['main1Delegation','actions','MAIN3','post_stock_movement','reserve_stock','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_OwnerLicense']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('CONTRACT_MISSING:'+repr(missing))
          if compat in s:
              a=s.index(compat); b=s.index(auth)
              if b<=a: raise SystemExit('P163_OWNER_ORDER')
              s=s[:a]+s[b:]
          for alias in ['window.RW_Dashboard={render:renderDashboard};','window.RW_Items={render:renderItems};']:
              s=s.replace(alias,'',1)
          if s.count('window.RW_Items=RW_Items;')!=1: raise SystemExit('P163_ITEMS_OWNER_COUNT')
          if s.count(ver)>1 or s.count(gov)>1: raise SystemExit('P163_CLOSURE_DUPLICATE')
          if ver not in s: s=s.replace('window.RW_Items=RW_Items;','window.RW_Items=RW_Items;\n'+ver,1)
          if gov not in s: s=s.replace(ver,ver+'\n'+gov,1)
          gates={'compat_absent':compat not in s,'auth_one':s.count(auth)==1,'version_one':s.count(ver)==1,'gov_one':s.count(gov)==1,'dash_alias_absent':'window.RW_Dashboard={render:renderDashboard};' not in s,'items_alias_absent':'window.RW_Items={render:renderItems};' not in s,'actions_preserved':'actions' in s,'delegation_preserved':'main1Delegation' in s,'main3_preserved':'MAIN3' in s,'scripts_balanced':s.lower().count('<script')==s.lower().count('</script>'),'styles_balanced':s.lower().count('<style')==s.lower().count('</style>'),'sw_once':s.count("navigator.serviceWorker.register('./sw.js',{scope:'./'})")==1}
          bad=[k for k,v in gates.items() if not v]
          if bad: raise SystemExit('P163_GATES_FAIL:'+repr(bad))
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
          js=Path('/tmp/new-main.js');js.write_text(ms[0].group('b'),encoding='utf-8')
          r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode: print(r.stderr);raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          p.write_text(s,encoding='utf-8')
          print('SOURCE_GOLD_DIAMOND_PASS sha256='+hashlib.sha256(s.encode()).hexdigest()+' bytes='+str(len(s.encode())))
          PY

      - name: Browser Gold/Diamond smoke on exact New-main
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-pwa && mkdir -p /tmp/rawaea-pwa
          cp -r Current/PWA/. /tmp/rawaea-pwa/
          cp Current/PWA/New-main /tmp/rawaea-pwa/main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-pwa >/tmp/rawaea-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1800);const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,flat=[];(function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);let denied=false;if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(x){denied=x.message==='OWNER_ONLY'}}return{ar:document.documentElement.lang==='ar',body:!!document.body,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract,gd:!!window.RW_GOLD_DIAMOND,denied,count:flat.length,critical:['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'].every(v=>flat.includes(v)),mods:['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'].every(v=>!!window[v])}});console.log(JSON.stringify({r,e}));if(e.length||!r.ar||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.gd||!r.denied||r.count<30||!r.critical||!r.mods)process.exit(2);await b.close()})().catch(x=>{console.error(x);process.exit(2)});
          NODE

      - name: Persist verified New-main and state, then restore executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          st=Path('CURRENT_STATE.md'); old=st.read_text(encoding='utf-8')
          marker='P163 CLOSED — MAIN2 ownership surgery + governed New-main reconstruction'
          if marker not in old:
              st.write_text(old.rstrip()+"\n\n## CTO EXECUTION — 2026-09-03\n\n"+marker+"\n- Target: `Current/PWA/New-main`\n- Verified SHA-256: `"+hashlib.sha256(s.encode()).hexdigest()+"`\n- Reconstruction source: `Current/PWA/main/main1.md` through `main11.md`.\n- P163: MAIN2 compatibility removed; authoritative owner retained; Main1 dashboard/items aliases removed; `actions`, `main1Delegation`, and MAIN3 preserved.\n- Static JavaScript and browser Gold/Diamond gates passed.\n- Production database writes: none. Historical Original files untouched.\n")
          PY
          git config user.name 'RAWAEA CTO Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/complete-picking-canary-20260814.yml
          git add Current/PWA/New-main CURRENT_STATE.md .github/workflows/complete-picking-canary-20260814.yml
          git diff --cached --check
          git commit -m 'fix: execute parent pwa main shell p0'
          git push origin HEAD:main
