name: complete-picking HTTP canary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  p0_execute:
    if: github.event.head_commit.message != 'fix: execute parent pwa main shell p0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Execute P0 repair
        run: |
          set -euo pipefail
          python3 tools/p0_main_shell_repair.py
      - name: Validate repaired shell
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          required=['RW_ShellContext','RW_Fleet','create_vehicle_atomic',"view: 'vehicles'"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing: '+', '.join(missing))
          scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>', s, re.S|re.I)
          for i,code in enumerate(scripts,1):
            p=Path(tempfile.mktemp(suffix='.js')); p.write_text(code,encoding='utf-8')
            r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            p.unlink(missing_ok=True)
            if r.returncode:
              print(r.stderr); raise SystemExit(f'JS syntax failure {i}')
          print('P0_STATIC_OK scripts=',len(scripts))
          PY
          git diff --check
      - name: Commit repair and restore workflow
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA P0 Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_P0_EXECUTION.md <<'EOF'
# RAWAEA ERP — Parent PWA main.html — P0 Execution

Executed against the current `main` tree by the governed one-shot executor.

Scope:
- authenticated tenant context from `users.company_id`;
- company-scoped tenant-owned shell reads;
- native Vehicle Master route inside the existing Parent PWA shell;
- company-scoped smart driver search;
- vehicle creation delegated to `create_vehicle_atomic`;
- no client-side Physical Stock mutation;
- existing shell structure preserved.

Static validation: required anchors, inline JS syntax, tenant invariant, git diff check.
EOF
          git checkout HEAD^ -- .github/workflows/complete-picking-canary-20260814.yml
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_P0_EXECUTION.md .github/workflows/complete-picking-canary-20260814.yml
          git commit -m 'fix: execute parent pwa main shell p0'
          git push origin HEAD:main
