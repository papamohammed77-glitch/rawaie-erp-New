name: complete-picking HTTP canary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  p0_execute:
    if: github.event.head_commit.message != 'fix: execute parent pwa main shell p0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Execute P0 repair against current main
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/p0_main_shell_repair.py
      - name: Validate main shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          for x in ['RW_ShellContext','RW_Fleet','create_vehicle_atomic','view: \'vehicles\'']:
              if x not in s: raise SystemExit('missing '+x)
          for m in re.finditer(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>', s, re.S|re.I):
              p=Path(tempfile.mktemp(suffix='.js')); p.write_text(m.group(1),encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              p.unlink(missing_ok=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit('syntax failure')
          if ".from('app_settings').select('*').limit(1)" in s: raise SystemExit('unscoped app_settings remains')
          print('P0_STATIC_OK')
          PY
          git diff --check
      - name: Record and restore canary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA P0 Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_P0_EXECUTION.md <<'EOF'
# RAWAEA ERP — Parent PWA main.html — P0 Execution

Executed against the current `main` tree by the governed one-shot executor.

Delivered:
- authenticated tenant context from `users.company_id`;
- company-scoped tenant-owned shell reads;
- native Vehicle Master route and Parent PWA capability;
- company-scoped smart driver search;
- vehicle creation delegated to `create_vehicle_atomic`;
- no client-side Physical Stock mutation added;
- existing Parent PWA structure retained.

Validation completed before commit: inline JavaScript syntax, required anchors, app_settings tenant invariant, and git diff check.

Browser E2E and Production browser runtime are separate P4 gates.
EOF
          git checkout HEAD^ -- .github/workflows/complete-picking-canary-20260814.yml
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_P0_EXECUTION.md .github/workflows/complete-picking-canary-20260814.yml
          git commit -m 'fix: execute parent pwa main shell p0'
          git push origin HEAD:main
