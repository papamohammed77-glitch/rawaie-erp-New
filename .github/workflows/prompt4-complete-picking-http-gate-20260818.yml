name: Prompt 4 complete-picking production HTTP gate
on:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Execute live Production HTTP E2E
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 180 \
            "https://fiilmooggumokxanwiyx.supabase.co/functions/v1/complete-picking-runtime-e2e-20260818?token=P4-CP-HTTP-20260818-9f5b1e7c" | tee result.json
          python - <<'PY'
          import json
          r=json.load(open('result.json'))
          assert r.get('success') is True, r
          assert r.get('production_http_e2e') is True, r
          assert r['first']['status']==200 and r['first']['body'].get('success') is True, r
          assert r['retry']['status']!=200 and r['retry']['body'].get('success') is not True, r
          assert float(r['afterRelease']['qty'])==float(r['baseline']['qty']), r
          assert float(r['afterRelease']['allocated_qty'])==float(r['baseline']['allocated_qty']), r
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
