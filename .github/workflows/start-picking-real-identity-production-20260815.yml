name: start-picking real identity production E2E
on:
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise production start-picking with legacy identity bridge
        env:
          SUPABASE_URL: https://fiilmooggumokxanwiyx.supabase.co
          ANON_KEY: sb_publishable_ZQC-PFJJWDoFh-6ZmaTWeg_UtrzzM71
          FIX_URL: https://fiilmooggumokxanwiyx.supabase.co/functions/v1/start-picking-real-identity-e2e-20260815?token=SP-REAL-ID-20260815
          PASSWORD: Tmp-SP-RealId-20260815-Aa1!
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          BASE=os.environ['SUPABASE_URL']; ANON=os.environ['ANON_KEY']; FIX=os.environ['FIX_URL']; PASSWORD=os.environ['PASSWORD']

          def req(url, method='GET', body=None, headers=None):
              data=None if body is None else json.dumps(body).encode()
              h=dict(headers or {})
              if body is not None: h['Content-Type']='application/json'
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,data=data,method=method,headers=h),timeout=60)
                  return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code,json.loads(e.read().decode())

          def create(name,status='Open',company='main',linked=True):
              email=f'sp-real-{name}-{time.time_ns()}@example.invalid'
              q=urllib.parse.urlencode({'mode':'create','status':status,'company':company,'linked':'1' if linked else '0','email':email})
              _,f=req(FIX+'&'+q)
              assert f.get('success') is True,f
              return f

          def login(f):
              code,a=req(BASE+'/auth/v1/token?grant_type=password','POST',{'email':f['email'],'password':PASSWORD},{'apikey':ANON})
              assert code==200,a
              return a['access_token']

          def start(token,code='RS-2'):
              return req(BASE+'/functions/v1/start-picking','POST',{'runsheet_code':code},{'Authorization':'Bearer '+token})[1]

          def verify(f):
              _,v=req(FIX+'&'+urllib.parse.urlencode({'mode':'verify','email':f['email']}))
              return v

          def cleanup(f):
              req(FIX+'&'+urllib.parse.urlencode({'mode':'cleanup','email':f['email'],'auth_id':f['auth_id']}))

          # Open -> Picking with legacy identity mapping (public id != auth id)
          f=create('open','Open'); t=login(f); r=start(t); assert r.get('success') is True,r
          v=verify(f); assert v['runsheet']['status']=='Picking',v; assert v['runsheet']['picker_id']==f['public_user_id'],v; assert v['user']['auth_id']==f['auth_id'],v; assert v['user']['id']!=f['auth_id'],v; assert v['user']['company_id']==v['runsheet']['company_id'],v; assert v['stock']==f['baseline_stock'],(f,v); cleanup(f)

          # Confirmed -> Picking
          f=create('confirmed','Confirmed'); t=login(f); r=start(t); assert r.get('success') is True,r
          v=verify(f); assert v['runsheet']['status']=='Picking',v; assert v['runsheet']['picker_id']==f['public_user_id'],v; assert v['stock']==f['baseline_stock'],v; cleanup(f)

          # Wrong company
          f=create('wrong-company','Open',company='other'); t=login(f); r=start(t); assert r.get('success') is False,r; v=verify(f); assert v['runsheet']['status']=='Open',v; cleanup(f)

          # Missing public user (auth identity exists, public mapping does not)
          f=create('missing-user','Open',linked=False); t=login(f); r=start(t); assert r.get('success') is False,r; assert 'المستخدم غير مسجل' in r.get('msg',''),r; cleanup(f)

          # Invalid session
          r=start('invalid-token'); assert r.get('success') is False,r

          # Duplicate request
          f=create('duplicate'); t=login(f); r1=start(t); r2=start(t); assert r1.get('success') is True,r1; assert r2.get('success') is False,r2; cleanup(f)

          # Concurrent request
          f=create('concurrent'); t=login(f)
          with ThreadPoolExecutor(max_workers=2) as ex:
              a,b=ex.map(lambda _: start(t), [1,2])
          assert sum(1 for r in (a,b) if r.get('success') is True)==1,(a,b)
          assert sum(1 for r in (a,b) if r.get('success') is False)==1,(a,b)
          v=verify(f); assert v['runsheet']['status']=='Picking',v; assert v['runsheet']['picker_id']==f['public_user_id'],v; assert v['stock']==f['baseline_stock'],v; cleanup(f)

          # Final cleanup/baseline verification
          _,final=req(FIX+'&mode=verify&email=sp-real-nonexistent@example.invalid')
          assert final.get('success') is True,final
          print('START_PICKING_PRODUCTION_REAL_IDENTITY_E2E_PASS')
          PY
