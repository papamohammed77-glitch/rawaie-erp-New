name: CTO New-main Gold Now 20260903
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cto-newmain-gold-now
  cancel-in-progress: false
jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Patch exact target — target preserving
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          target=Path('Current/PWA/New-main')
          s=target.read_text(encoding='utf-8'); before=s
          old='<link rel="manifest" href="../manifest.json">'
          new='<link rel="manifest" href="./New-main.manifest.json">'
          if old in s:
              if s.count(old)!=1: raise SystemExit('OLD_MANIFEST_LINK_NOT_UNIQUE')
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('PWA_MANIFEST_LINEAGE_UNKNOWN')
          gold='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          sw='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if 'rw-pwa-runtime-gold' not in s:
              if '</head>' not in s: raise SystemExit('HEAD_CLOSE_MISSING')
              s=s.replace('</head>',gold+'\n'+sw+'\n</head>',1)
          else:
              if s.count('rw-pwa-runtime-gold')!=1 or s.count('RAWAEA_TARGET_SW_COORDINATOR')!=1:
                  raise SystemExit('PWA_RUNTIME_MARKERS_NOT_CANONICAL')
          for required in ['/* RAWAEA MAIN10 AUTHORITATIVE MODULE */','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_OwnerLicense = RW_OwnerLicense;','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=']:
              if required not in s: raise SystemExit('CORE_CONTRACT_MISSING:'+required)
          target.write_text(s,encoding='utf-8')
          Path('Current/PWA/New-main.manifest.json').write_text(json.dumps({'name':'الروائع ERP','short_name':'الروائع ERP','description':'منصة إدارة الأعمال الذكية والمتكاملة - الروائع ERP','start_url':'./New-main','scope':'./','display':'standalone','dir':'rtl','lang':'ar','background_color':'#f8fafc','theme_color':'#2563eb','icons':[{'src':'./New-main-icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('Current/PWA/New-main-icon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2563eb"/><text x="256" y="325" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" font-size="270" font-weight="900" fill="#fff">ر</text></svg>\n',encoding='utf-8')
          print('TARGET_BEFORE_SHA256',hashlib.sha256(before.encode()).hexdigest())
          print('TARGET_AFTER_SHA256',hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_CHANGED',s!=before)
          PY
      - name: Static contract gate
        shell: bash
        run: |
          set -euo pipefail
          test -f Current/PWA/New-main
          test -f Current/PWA/New-main.manifest.json
          test -f Current/PWA/New-main-icon.svg
          test -f Current/PWA/register-sw.js
          test -f Current/PWA/sw.js
          grep -Fq 'rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03"' Current/PWA/New-main
          grep -Fq 'id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"' Current/PWA/New-main
          grep -Fq 'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1' Current/PWA/New-main
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='./' and m['dir']=='rtl' and m['lang']=='ar'
          print('STATIC_GOLD_GATE_PASS')
          PY
      - name: Real HTTP Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir /tmp/site
          cp -a Current/PWA/. /tmp/site/
          cp Current/PWA/New-main /tmp/site/main.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/site/main.html'); s=p.read_text(encoding='utf-8')
          # Only the isolated test copy is changed: remove CDN-only script tags and provide deterministic browser stubs.
          s=re.sub(r'<script\s+(?:defer\s+)?src="https://cdn\.jsdelivr\.net/[^>]+></script>','',s,flags=re.I)
          stub='<script>window.Chart=window.Chart||function(){};window.Swal=window.Swal||{fire:async()=>({isConfirmed:true})};window.XLSX=window.XLSX||{};</script>'
          s=s.replace('<head>','<head>'+stub,1)
          p.write_text(s,encoding='utf-8')
          PY
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          trap 'kill "$(cat /tmp/http.pid)" 2>/dev/null || true' EXIT
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage(); const errs=[];
            p.on('pageerror',e=>errs.push('pageerror:'+e.message));
            p.on('console',m=>{if(m.type()==='error') errs.push('console:'+m.text())});
            await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:10000});
            await p.waitForSelector('#rw-login-page',{timeout:10000});
            await p.waitForTimeout(1400);
            const r=await p.evaluate(async()=>{
              const l=document.querySelector('link[rel="manifest"]');
              const manifest=await (await fetch(l.href)).json();
              const reg=await navigator.serviceWorker.getRegistration('./');
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,manifest:l?.getAttribute('href'),start:manifest.start_url,scope:manifest.scope,sw:!!reg,swScript:reg?.active?.scriptURL||null,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||null,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||null,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,diamond:document.documentElement.outerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')};
            });
            console.log(JSON.stringify({r,errs},null,2));
            const ok=!errs.length&&r.lang==='ar'&&r.dir==='rtl'&&r.manifest==='./New-main.manifest.json'&&r.start==='./New-main'&&r.scope==='./'&&r.sw&&r.swScript?.endsWith('/sw.js')&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.diamond;
            if(!ok) throw new Error('PWA_GOLD_BROWSER_GATE_FAILED');
            await b.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Commit only verified target changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8').rstrip() if st.exists() else ''
          marker='## CTO PWA RUNTIME GOLD — 2026-09-03 (LIVE VERIFIED)'
          h=hashlib.sha256(Path('Current/PWA/New-main').read_bytes()).hexdigest()
          if marker not in s:
              s += f'''\n\n{marker}\n- Target: `Current/PWA/New-main`.\n- Target-specific manifest lineage: `./New-main.manifest.json`; explicit `register-sw.js` coordinator; target icon/manifest assets.\n- Static contract gate: PASS.\n- Real HTTP Chromium gate: PASS; PWA manifest fetched; Service Worker active at `sw.js`; Arabic RTL document; Auth/Navigation/Views/Shell/Owner/Diamond surfaces present; no page/console errors on isolated deterministic test copy.\n- Verified target SHA-256: `{h}`\n- Production Supabase writes: NONE.\n- PWA runtime Closure Unit: GOLD = PROVEN.\n'''
              st.write_text(s+'\n',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg CURRENT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then echo 'NO_TARGET_CHANGES_NEEDED'; exit 0; fi
          git commit -m '[CTO-CURRENT-PATH] [GOLD-PROVEN] New-main PWA runtime closure'
          git push origin HEAD:main
# CTO continuation nonce 2026-09-03T08:42:00+03:00
