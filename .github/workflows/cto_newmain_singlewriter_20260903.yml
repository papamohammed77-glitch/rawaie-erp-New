name: CTO New-main Single Writer Closure 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message != 'chore(cto): finalize New-main single-writer closure' && github.event.head_commit.message != 'chore(cto): retire New-main single-writer executor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Surgical New-main-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess
          p=Path('Current/PWA/New-main');s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000,'TARGET_TOO_SMALL'
          assert '<html lang="ar" dir="rtl">' in s
          # Make the login brand surface addressable by the same canonical company context used after authentication.
          old_login='<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>'
          if old_login in s:
              s=s.replace(old_login,'<div id="rw-login-company-logo" class="rw-login-logo" aria-label="شعار الشركة">ر</div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div class="rw-company-description">منصة إدارة الأعمال الذكية والمتكاملة</div>',1)
          assert 'id="rw-login-company-logo"' in s and 'id="rw-login-company-name"' in s
          # Convert the parent registry from external sibling URLs to internal main navigation.
          pat=re.compile(r"window\.RW_ParentRegistry=\{version:'1\.0'[\s\S]*?\};")
          replacement="window.RW_ParentRegistry={version:'2.0',tenantAuthority:'RW_ShellContext.getCompanyId()',ownerAuthority:'owner_profile',permissionAuthority:'RW_Permissions_check',apps:{pos:'pos',telesales:'telesales',buyer:'purchases',vouchers:'vouchers',picker:'picking',loader:'loading',driver:'delivery',returns:'returns',unloader:'unloading'},launch:function(key){var v=this.apps[key];if(!v)throw new Error('UNKNOWN_PARENT_APP:'+key);if(!window.RW_Navigation||typeof window.RW_Navigation.navigate!=='function')throw new Error('RW_NAVIGATION_UNAVAILABLE');return window.RW_Navigation.navigate(v);}};"
          s,n=pat.subn(replacement,s,count=1)
          assert n==1,'PARENT_REGISTRY_REWRITE_FAILED'
          # Keep MAIN1 delegation on the centralized navigation surface, never on sibling HTML pages.
          dpat=re.compile(r"function main1Delegation\(view\)\{[\s\S]*?\}\nvar actions=",re.M)
          dm=dpat.search(s)
          if dm:
              s=s[:dm.start()] + "function main1Delegation(view){if(window.RW_Views&&typeof window.RW_Views.render==='function')return window.RW_Views.render(view);if(window.RW_Navigation&&typeof window.RW_Navigation.navigate==='function')return window.RW_Navigation.navigate(view);throw new Error('RW_NAVIGATION_UNAVAILABLE')}\nvar actions=" + s[dm.end():]
          # The generic delegated renderer must never emit sibling links.
          if 'window.location.href=el.getAttribute' in s:
              s=s.replace(";byId('rw-page-container').querySelectorAll('[data-href]').forEach(function(el){el.onclick=function(){window.location.href=el.getAttribute('data-href')}})",';')
          forbidden=['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']
          # Rewrite any remaining parent-only literal paths to their internal view names.
          for a,b in [('./pos.html',"'pos'"),('./telesales.html',"'telesales'"),('./buyer.html',"'purchases'"),('./vouchers.html',"'vouchers'"),('./picker.html',"'picking'"),('./loader.html',"'loading'"),('./driver.html',"'delivery'"),('./Returns.html',"'returns'"),('./unloader.html',"'unloading'")]:
              s=s.replace(a,b.strip("'"))
          # Main shell should remain self-contained when auxiliary PWA files are removed.
          s=re.sub(r'<script id="RAWAEA_TARGET_SW_COORDINATOR"[^>]*></script>\s*','',s)
          s=re.sub(r"if\('serviceWorker'\s+in\s+navigator\)navigator\.serviceWorker\.register\('\./sw\.js'\,\{scope:'\./'\}\)\.catch\(function\(e\)\{console\.warn\('SERVICE_WORKER'\,e\)\}\);",'',s)
          # Sync canonical company branding after the authoritative tenant context is established.
          if 'RAWAEA_CANONICAL_COMPANY_BRANDING_V1' not in s:
              patch="""<script id=\"RAWAEA_CANONICAL_COMPANY_BRANDING_V1\">(function(){'use strict';function apply(){var c=window.RW_STATE&&window.RW_STATE.app&&window.RW_STATE.app.company;if(!c)return;var n=String(c.name||'الروائع ERP').trim()||'الروائع ERP',l=String(c.logo||'').trim(),ln=document.getElementById('rw-login-company-name'),ll=document.getElementById('rw-login-company-logo'),sn=document.getElementById('rw-sidebar-company-name'),sl=document.getElementById('rw-sidebar-brand-logo');if(ln)ln.textContent=n;if(sn)sn.textContent=n;if(ll){ll.textContent=l?'':'ر';ll.style.backgroundImage=l?'url('+JSON.stringify(l)+')':'';ll.style.backgroundSize=l?'contain':'';ll.style.backgroundRepeat=l?'no-repeat':'';ll.style.backgroundPosition=l?'center':'';}if(sl){if(l)sl.src=l;else sl.removeAttribute('src');}}window.RW_ApplyCanonicalCompanyBranding=apply;setTimeout(apply,0);setTimeout(apply,250);setTimeout(apply,1000);})();</script>"""
              s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['<!doctype html>','<html lang="ar" dir="rtl">','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense=','window.byId=byId;','window.safeText=safeText;','window.safeHTML=safeHTML;','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','__RAWAEA_MAIN11_GOVERNED_CLOSED_V2__','RW_Permissions_check','rw-login-company-logo','rw-login-company-name','RAWAEA_CANONICAL_COMPANY_BRANDING_V1']
          assert not [x for x in req if x not in s]
          assert s.count("byId('rw-login-form').addEventListener('submit'")==1
          assert s.count('loginForm.addEventListener(\'submit\'')==1
          assert './New-main.manifest.json' not in s
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          for x in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']:
              assert x not in s,x
          blocks=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/inline.js'],capture_output=True,text=True)
          assert r.returncode==0,r.stderr
          print('STATIC_NEWMAIN_ONLY=PASS')
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object','Current/PWA/New-main'],text=True).strip())
          PY
      - name: Chromium forensic runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8123 --directory Current/PWA >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          trap 'kill $(cat /tmp/http.pid) 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const views=['dashboard','telesales','customers','pos','orders','runsheets','online-store','suppliers','purchase-pos','purchases','receiving','items','inventory','branches','picking','loading','delivery','returns','unloading','vouchers','vehicle-count','branch-count','general-count','finance','settlement','reports-dashboard','reports-detailed','reports-comprehensive','reports','hr','crm','users','roles','license','settings','notifications'];
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage();const errs=[];p.on('pageerror',e=>errs.push('PAGE:'+e.message));p.on('console',m=>{if(m.type()==='error')errs.push('CONSOLE:'+m.text())});
          await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('cdn.jsdelivr.net/npm/@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){const data=(t)=>t==='users'?{id:'u1',name:'مالك النظام',email:'owner@alrawae.com',role:'Owner',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*'],auth_id:'auth1'}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null}:t==='owner_profile'?{auth_user_id:'auth1',license_status:'Active'}:t==='app_settings'?{company_name:'الروائع',company_logo:null,status:'trial'}:{};const q=(t)=>({select(){return this},eq(){return this},in(){return this},or(){return this},order(){return this},limit(){return this},range(){return this},gte(){return this},lte(){return this},update(){return this},delete(){return this},insert(){return Promise.resolve({data:null,error:null})},maybeSingle(){return Promise.resolve({data:data(t),error:null})},single(){return Promise.resolve({data:data(t),error:null})},then(f,j){return Promise.resolve({data:Array.isArray(data(t))?data(t):[],error:null,count:0}).then(f,j)}});const c={auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:{id:'auth1',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({}),resetPasswordForEmail:async()=>({error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},from:q};window.RW_SUPABASE_CLIENT=c;return c}};`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});return r.continue()});
          await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1200);
          const base=await p.evaluate(async()=>({login:!!document.getElementById('rw-login-form'),brand:!!document.getElementById('rw-login-company-logo'),name:!!document.getElementById('rw-login-company-name'),sidebar:!!document.getElementById('rw-sidebar'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',supabaseFrom:typeof window.supabase?.from==='function',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||''}));
          const menu=await p.evaluate(()=>{RW_STATE.app.currentUser={id:'u1',email:'owner@alrawae.com',name:'مالك النظام',role:'Owner',isOwner:true,permissions:['*']};RW_STATE.permissions=['*'];RW_Navigation.buildSidebar();return Array.from(document.querySelectorAll('#rw-sidebar-nav [data-view]')).map(x=>x.getAttribute('data-view')).filter(Boolean)});
          const internal=await p.evaluate(async()=>{const before=location.href;const r=await RW_ParentRegistry.launch('pos');return {href:location.href,view:RW_STATE.app.currentView,before,internal:!location.href.includes('.html')};});
          const routes=await p.evaluate(async(vs)=>{const o={};for(const v of vs){try{await RW_Navigation.navigate(v);o[v]=true}catch(e){o[v]=String(e.message||e)}}return o;},views);
          const missing=Object.entries(routes).filter(([v,x])=>x!==true&&String(x).startsWith('ROUTE_HANDLER_MISSING:'));
          console.log('CTO_NEWMAIN_FORENSIC='+JSON.stringify({base,menuCount:menu.length,menu,internal,routes,missing,errors:errs}));
          const ok=!errs.length&&base.login&&base.brand&&base.name&&base.sidebar&&base.auth&&base.nav&&base.views&&base.shell&&base.owner&&base.supabaseFrom&&base.manifest==='./manifest.json'&&menu.length>=20&&internal.internal&&!missing.length&&routes['dashboard']===true&&routes['customers']===true&&routes['pos']===true&&routes['inventory']===true&&routes['finance']===true&&routes['license']===true&&routes['settings']===true&&routes['notifications']===true;await b.close();if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo BROWSER_NEWMAIN_FORENSIC=PASS
      - name: Publish target only and retire executor
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          names=$(git diff --cached --name-only | sort)
          test "$names" = "Current/PWA/New-main" || { echo "$names"; exit 1; }
          git config user.name 'RAWAEA CTO Single Writer'
          git config user.email 'rawaea-cto-single-writer@users.noreply.github.com'
          git commit -m 'chore(cto): finalize New-main single-writer closure'
          git push origin HEAD:main
          # This process must remain the only writer and is retired by the next automatic run guard.