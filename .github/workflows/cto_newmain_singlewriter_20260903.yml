name: CTO New-main Single Writer Closure 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  product:
    if: github.event.head_commit.message == 'CTO PRODUCT EXECUTE UX'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Reconcile only New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, subprocess, tempfile, hashlib
          from html.parser import HTMLParser
