name: P163 exact Main2 ownership surgery

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/New-main-icon.svg'
      - 'Current/PWA/register-sw.js'
      - 'Current/PWA/sw.js'
      - 'Current/manifest.json'
      - '.github/workflows/p163_main2_ownership_surgery_20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p163-final-target-repair
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Surgical target repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          old_manifest='<link rel="manifest" href="../manifest.json">'
          new_manifest='<link rel="manifest" href="./New-main.manifest.json">'
          if old_manifest in s:
              if s.count(old_manifest)!=1: raise SystemExit('MANIFEST_REFERENCE_COUNT')
              s=s.replace(old_manifest,new_manifest,1)
          elif new_manifest not in s:
              raise SystemExit('MANIFEST_CONTRACT_MISSING')
          marker='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if marker not in s:
              anchor='<meta name="rw-p163-closure" content="P163-GOLD-DIAMOND-CLOSED-2026-09-03">'
              if s.count(anchor)!=1: raise SystemExit('P163_ANCHOR_MISSING')
              s=s.replace(anchor,anchor+'\n'+marker,1)
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if coord not in s:
              if '</head>' not in s: raise SystemExit('HEAD_CLOSE_MISSING')
              s=s.replace('</head>',coord+'\n</head>',1)
          old_email="async function showPanel(){\n  var e=email();"
          new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old_email in s:
              if s.count(old_email)!=1: raise SystemExit('NOTIFICATION_EMAIL_COUNT')
              s=s.replace(old_email,new_email,1)
          elif 'var e=email();' in s:
              raise SystemExit('NOTIFICATION_EMAIL_UNEXPECTED_SHAPE')
          p.write_text(s,encoding='utf-8')
          print('TARGET_SURGERIES_APPLIED')
          PY
      - name: Static Gold Diamond gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,subprocess,tempfile,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          required=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('STATIC_MISSING='+repr(missing))
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_EMAIL_BUG_PRESENT')
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.scripts=0
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
              def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']: self.cur['text']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                      self.cur=None
          hp=P(); hp.feed(s); hp.close()
          if len(hp.inline)!=1: raise SystemExit('INLINE_SCRIPT_COUNT='+str(len(hp.inline)))
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(hp.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          subprocess.run(['node','--check','Current/PWA/register-sw.js'],check=True)
          subprocess.run(['node','--check','Current/PWA/sw.js'],check=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='./' and m['lang']=='ar' and m['dir']=='rtl'
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('STATIC_GOLD_DIAMOND=PASS')
          PY
      - name: Exact HTTP Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/site && mkdir -p /tmp/site/Current
          cp -a Current/. /tmp/site/Current/
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/p163-http.log 2>&1 & echo $! >/tmp/p163-http.pid)
          trap 'kill "$(cat /tmp/p163-http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1200);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views; let notification='NOT_EXPOSED';
              if(S?.app&&window.RW_Notification?.showPanel){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL:'+String(e?.message||e)}}
              const l=document.querySelector('link[rel="manifest"]'); const mj=await (await fetch(l.href)).json(); const sw=await fetch('./register-sw.js');
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:l?.getAttribute('href')||'',start:mj.start_url,scope:mj.scope,sw:sw.status};
            });
            console.log('FINAL_GOLD_DIAMOND='+JSON.stringify({r,pe,ce})); await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.notification==='PASS'&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.start==='.'+'/New-main'&&r.scope==='.'+'/'&&r.sw===200;
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Persist verified closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('Current/PWA/New-main'); blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip(); h=hashlib.sha256(p.read_bytes()).hexdigest()
          st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## FINAL-CLOSED — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          if marker not in s:
              st.write_text(s.rstrip()+f'''\n\n{marker}\n- Target Git blob: `{blob}`\n- Target SHA-256: `{h}`\n- Target-preserving PWA manifest isolation, service-worker coordinator, and notification current-user binding: PASS.\n- Static HTMLParser/Node gates: PASS.\n- Exact HTTP Chromium gate: PASS; zero page/console errors; Auth/Navigation/Views/Shell/Owner globals present; notification runtime PASS; Diamond 122/P163 markers PASS.\n- Production Supabase writes: NONE.\n- Fragment reconstruction: NOT USED.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n''',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO P163 Final Closure'; git config user.email 'rawaea-cto-p163-final@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then echo NO_TARGET_CHANGE; exit 0; fi
          git commit -m '[FINAL-CLOSED] [P163-EXECUTED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || { echo MAIN_MOVED_DURING_FINALIZATION; exit 20; }
          git push origin HEAD:main
