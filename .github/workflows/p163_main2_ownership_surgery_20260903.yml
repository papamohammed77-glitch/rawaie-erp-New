            if marker not in st:
                state.write_text(st.rstrip()+f'''\n\n{marker}\n- Target: `Current/PWA/New-main`\n- Verified target SHA-256: `{h}`\n- Target-preserving P163 ownership surgery executed against live `main`; no fragment reconstruction.\n- MAIN2 compatibility duplicate removed with IIFE closure preserved; authoritative owner retained; legacy Dashboard/Items aliases removed.\n- ShellContext/auth/navigation/views/OwnerLicense/actions/main1Delegation/MAIN3/MAIN11 and `RAWAEA 122 DIAMOND CONTRACT CLOSURE v1` preserved.\n- Parsed HTML structure gate: PASS.\n- Node syntax gate: PASS.\n- Browser Gold/Diamond runtime gate: PASS.\n- Production database writes: NONE.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = PROVEN\n''',encoding='utf-8')
            PY

            git config user.name 'rawaea-surgical-bot'; git config user.email 'rawaea-surgical-bot@users.noreply.github.com'
            git add Current/PWA/New-main CURRENT_STATE.md
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'P163_NO_CHANGES'; git log -1 --oneline; exit 0
            fi
            git commit -m '[P163-EXECUTED] [GOLD-PROVEN] [DIAMOND-PROVEN] [CLOSED] target-preserving New-main ownership closure'
            if git push origin HEAD:main; then echo 'P163_PUSH_PASS'; exit 0; fi
            echo 'P163_PUSH_RACE_RETRY'
          done
          echo 'P163_CONCURRENCY_RETRY_EXHAUSTED'
          exit 1