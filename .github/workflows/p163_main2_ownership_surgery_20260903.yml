name: P163 exact Main2 ownership surgery — verifier only

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/New-main-icon.svg'
      - 'Current/PWA/register-sw.js'
      - 'Current/PWA/sw.js'
      - 'Current/manifest.json'
      - '.github/workflows/p163_main2_ownership_surgery_20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p163-main2-verifier
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[P163-VERIFIER-SKIP]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact target identity and static Gold/Diamond gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, subprocess, tempfile, hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          required=[
            'rw-p163-closure',
            'P163-GOLD-DIAMOND-CLOSED-2026-09-03',
            'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1',
            'window.RW_Auth=',
            'window.RW_Navigation=',
            'window.RW_Views=',
            'window.RW_ShellContext',
            'window.RW_OwnerLicense=',
            'applyAuthoritativeContext',
            'window.MAIN_HTML_CURRENT_CONTRACT_LEDGER='
          ]
          miss=[x for x in required if x not in s]
          if miss: raise SystemExit('STATIC_MISSING='+repr(miss))
          class P(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.scripts=0; self.styles=0
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
              elif t.lower()=='style': self.styles+=1
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['text']+=d
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                self.cur=None
          hp=P(); hp.feed(s); hp.close()
          if (hp.scripts,hp.styles,len(hp.inline))!=(5,1,1): raise SystemExit(f'STRUCTURE={(hp.scripts,hp.styles,len(hp.inline))}')
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(hp.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          subprocess.run(['node','--check','Current/PWA/register-sw.js'],check=True)
          subprocess.run(['node','--check','Current/PWA/sw.js'],check=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='./' and m['lang']=='ar' and m['dir']=='rtl'
          side=json.loads(Path('Current/manifest.json').read_text(encoding='utf-8'))
          assert side['start_url']=='./PWA/New-main' and side['scope']=='./PWA/' and side['lang']=='ar' and side['dir']=='rtl'
          assert Path('Current/PWA/New-main-icon.svg').exists()
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
          print('TARGET_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('STATIC_GOLD_DIAMOND=PASS')
          PY
      - name: Exact-target Chromium runtime proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p163site && mkdir -p /tmp/p163site/Current
          cp -a Current/. /tmp/p163site/Current/
          (cd /tmp/p163site && python3 -m http.server 8123 >/tmp/p163-http.log 2>&1 & echo $! >/tmp/p163-http.pid)
          trap 'kill "$(cat /tmp/p163-http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1500);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views;
              const l=document.querySelector('link[rel="manifest"]');
              let manifestHref=l?.getAttribute('href')||'';
              let manifestStatus=null, manifestJson=null;
              try { const rr=await fetch(l.href); manifestStatus=rr.status; manifestJson=await rr.json(); } catch(e) { manifestStatus=-1; }
              return {
                lang:document.documentElement.lang,
                dir:document.documentElement.dir,
                state:!!S,
                auth:!!window.RW_Auth,
                nav:!!N,
                views:!!V,
                shell:!!window.RW_ShellContext,
                owner:!!window.RW_OwnerLicense,
                diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),
                p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',
                manifest:manifestHref,
                manifestStatus,
                start:manifestJson?.start_url||'',
                scope:manifestJson?.scope||''
              };
            });
            console.log('FINAL='+JSON.stringify({r,pe,ce})); await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.manifestStatus===200;
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Emit verification evidence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('Current/PWA/New-main')
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
          print('TARGET_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('VERIFIER_ONLY=PASS')
          print('NO_TARGET_WRITE=ENFORCED')
          print('NO_PRODUCTION_WRITE=ENFORCED')
          PY
