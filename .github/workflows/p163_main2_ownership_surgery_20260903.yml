name: P163 exact Main2 ownership surgery

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p163-final-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Surgical target repair and exact gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,subprocess,tempfile,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          old='<link rel="manifest" href="../manifest.json">'; new='<link rel="manifest" href="./New-main.manifest.json">'
          if old in s:
              if s.count(old)!=1: raise SystemExit('MANIFEST_REFERENCE_COUNT')
              s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('MANIFEST_CONTRACT_MISSING')
          pwa='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if pwa not in s: s=s.replace('<meta name="rw-p163-closure" content="P163-GOLD-DIAMOND-CLOSED-2026-09-03">','<meta name="rw-p163-closure" content="P163-GOLD-DIAMOND-CLOSED-2026-09-03">\n'+pwa,1)
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if coord not in s: s=s.replace('</head>',coord+'\n</head>',1)
          old_email="async function showPanel(){\n  var e=email();"; new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old_email in s:
              if s.count(old_email)!=1: raise SystemExit('NOTIFICATION_EMAIL_COUNT')
              s=s.replace(old_email,new_email,1)
          elif 'var e=email();' in s: raise SystemExit('NOTIFICATION_EMAIL_UNEXPECTED')
          p.write_text(s,encoding='utf-8')
          assert all(x in s for x in ['P163-GOLD-DIAMOND-CLOSED-2026-09-03','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER='])
          assert 'var e=email();' not in s
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.cur={'src':dict(a).get('src'),'text':''}
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['text']+=d
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                self.cur=None
          h=P(); h.feed(s); h.close(); assert len(h.inline)==1
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(h.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          subprocess.run(['node','--check','Current/PWA/register-sw.js'],check=True); subprocess.run(['node','--check','Current/PWA/sw.js'],check=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8')); assert m['start_url']=='./New-main' and m['scope']=='.//' and m['lang']=='ar' and m['dir']=='rtl'
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest()); print('STATIC_GOLD_DIAMOND=PASS')
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/site && mkdir -p /tmp/site/Current && cp -a Current/. /tmp/site/Current
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/p163-http.log 2>&1 & echo $! >/tmp/p163-http.pid); trap 'kill "$(cat /tmp/p163-http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200);const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views;let notification='NOT_EXPOSED';if(S?.app&&window.RW_Notification?.showPanel){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL:'+String(e?.message||e)}}const l=document.querySelector('link[rel="manifest"]');const m=await(await fetch(l.href)).json();return{lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:l?.getAttribute('href')||'',start:m.start_url,scope:m.scope,sw:(await fetch('./register-sw.js')).status}});console.log('FINAL='+JSON.stringify({r,pe,ce}));await b.close();if(pe.length||ce.length||r.lang!=='ar'||r.dir!=='rtl'||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||r.notification!=='PASS'||!r.diamond||r.p163!=='P163-GOLD-DIAMOND-CLOSED-2026-09-03'||r.pwa!=='PWA-RUNTIME-GOLD-2026-09-03'||r.manifest!=='New-main.manifest.json'||r.start!=='.'+'/New-main'||r.scope!=='.'+'/'||r.sw!==200)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Commit verified target on PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA CTO PR Final Closure'; git config user.email 'rawaea-cto-pr-final@users.noreply.github.com'
          git add Current/PWA/New-main
          git diff --cached --check
          if git diff --cached --quiet; then echo 'NO_TARGET_CHANGE'; exit 0; fi
          git commit -m '[P163-FINAL-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
