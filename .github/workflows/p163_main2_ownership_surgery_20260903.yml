name: P163 exact Main2 ownership surgery

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/New-main-icon.svg'
      - 'Current/PWA/register-sw.js'
      - 'Current/PWA/sw.js'
      - 'Current/manifest.json'
      - '.github/workflows/p163_main2_ownership_surgery_20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p163-main2-final
  cancel-in-progress: false

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message || '', '[P163-FINAL-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Target-preserving surgical repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          old='<link rel="manifest" href="../manifest.json">'
          new='<link rel="manifest" href="./New-main.manifest.json">'
          if old in s:
              if s.count(old)!=1: raise SystemExit('MANIFEST_OLD_COUNT')
              s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('MANIFEST_LINK_MISSING')
          meta='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if meta not in s: s=s.replace('</head>',meta+'\n</head>',1)
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if coord not in s: s=s.replace('</head>',coord+'\n</head>',1)
          old_email="async function showPanel(){\n  var e=email();"
          new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old_email in s:
              if s.count(old_email)!=1: raise SystemExit('NOTIFICATION_EMAIL_COUNT')
              s=s.replace(old_email,new_email,1)
          elif 'var e=email();' in s: raise SystemExit('NOTIFICATION_EMAIL_UNEXPECTED')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static Gold and Diamond proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,subprocess,tempfile,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          required=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext','window.RW_OwnerLicense=','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=']
          miss=[x for x in required if x not in s]
          if miss: raise SystemExit('STATIC_MISSING='+repr(miss))
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_BUG_REMAINS')
          if s.count('rw-pwa-runtime-gold')!=1: raise SystemExit('PWA_META_COUNT')
          if s.count('RAWAEA_TARGET_SW_COORDINATOR')!=1: raise SystemExit('SW_COORD_COUNT')
          if s.count('window.RW_OwnerLicense=')!=1: raise SystemExit('OWNER_CONTRACT_COUNT')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.scripts=0; self.styles=0
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
              elif t.lower()=='style': self.styles+=1
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['text']+=d
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                self.cur=None
          hp=P(); hp.feed(s); hp.close()
          if (hp.scripts,hp.styles,len(hp.inline))!=(6,1,1): raise SystemExit(f'STRUCTURE={(hp.scripts,hp.styles,len(hp.inline))}')
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(hp.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          subprocess.run(['node','--check','Current/PWA/register-sw.js'],check=True)
          subprocess.run(['node','--check','Current/PWA/sw.js'],check=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          side=json.loads(Path('Current/manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='./' and m['lang']=='ar' and m['dir']=='rtl'
          assert side['start_url']=='./PWA/New-main' and side['scope']=='./PWA/' and side['lang']=='ar' and side['dir']=='rtl'
          assert Path('Current/PWA/New-main-icon.svg').exists()
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('STATIC_GOLD_DIAMOND=PASS')
          PY
      - name: Chromium Gold and Diamond proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p163site && mkdir -p /tmp/p163site/Current
          cp -a Current/. /tmp/p163site/Current/
          (cd /tmp/p163site && python3 -m http.server 8123 >/tmp/p163-http.log 2>&1 & echo $! >/tmp/p163-http.pid)
          trap 'kill "$(cat /tmp/p163-http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(u.includes('supabase.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:`(function(){function q(){let o={};['select','eq','in','or','order','range','gte','lte','limit','single','maybeSingle'].forEach(k=>o[k]=async function(){return k==='single'||k==='maybeSingle'?{data:null,error:null}:o});return o}window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>({error:null}),signInWithPassword:async()=>({error:new Error('SMOKE_DISABLED')})},from:()=>q(),rpc:async()=>({data:null,error:null})})})();`});
              if(u.includes('chart.umd.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false}),close(){},showLoading(){}};'});
              if(u.includes('xlsx.full.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={utils:{}};'});
              if(u.includes('font-awesome')) return r.fulfill({status:200,contentType:'text/css',body:''});
              return r.continue();
            });
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1500);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views; let notification='NOT_EXPOSED';
              if(S?.app&&window.RW_Notification?.showPanel){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL:'+String(e?.message||e)}}
              const l=document.querySelector('link[rel="manifest"]'); const mj=await (await fetch(l.href)).json(); const sw=await fetch('./register-sw.js');
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:l?.getAttribute('href')||'',start:mj.start_url,scope:mj.scope,sw:sw.status};
            });
            console.log('FINAL='+JSON.stringify({r,pe,ce})); await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.notification==='PASS'&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.start==='./New-main'&&r.scope==='.'+'/'&&r.sw===200;
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Commit final closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          p=Path('Current/PWA/New-main'); blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip(); h=hashlib.sha256(p.read_bytes()).hexdigest()
          st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## P163 FINAL CLOSURE — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          if marker not in s:
              st.write_text(s.rstrip()+f'''\n\n{marker}\n- Target Git blob: `{blob}`\n- Target SHA-256: `{h}`\n- Surgical fixes: PWA manifest isolation, permanent service-worker coordinator binding, notification current-user email binding.\n- Static HTMLParser + Node: PASS.\n- Exact HTTP Chromium: PASS; zero page/console errors; notification runtime PASS; required Gold/Diamond contracts present.\n- Production Supabase writes: NONE.\n- Fragment reconstruction: NOT USED.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n''',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO P163 Final Closure'
          git config user.email 'rawaea-p163-final@users.noreply.github.com'
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[P163-FINAL-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] [CLOSED-100%] Current/PWA/New-main'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then git rebase origin/main; fi
          git push origin HEAD:main
