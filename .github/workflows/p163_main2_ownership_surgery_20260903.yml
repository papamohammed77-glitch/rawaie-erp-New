name: P163 exact Main2 ownership surgery

# CTO CONTINUATION: one deterministic live-target executor. No fragment reconstruction. No production writes.
# Observable PR trigger is temporary and exists only to expose the real executor result.
# Browser harness now serves the exact New-main blob as main.html before runtime validation.

on:
  push:
    paths:
      - '.github/workflows/p163_main2_ownership_surgery_20260903.yml'
      - 'tools/_cto_p163_executor_20260903.py'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgical-closure:
    if: ${{ !contains(github.event.head_commit.message || '', '[P163-EXECUTED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Execute target-preserving P163 closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_cto_p163_executor_20260903.py
