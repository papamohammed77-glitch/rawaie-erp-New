name: P163 exact Main2 ownership surgery

# CTO CONTINUATION: live-target surgical closure only.
# No fragment reconstruction. No production writes. Rebase/reset to latest main before persistence.

on:
  push:
    paths:
      - '.github/workflows/p163_main2_ownership_surgery_20260903.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  surgical-closure:
    if: ${{ !contains(github.event.head_commit.message, '[P163-EXECUTED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Target surgery, gates, and concurrency-safe persistence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "P163_ATTEMPT=$attempt"
            git fetch origin main --prune
            git reset --hard origin/main

            python3 - <<'PY'
            from pathlib import Path
            import hashlib,re
            from html.parser import HTMLParser
            p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
            marker='/* RAWAEA MAIN2 COMPATIBILITY */'; auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
            version="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"; governed='// MAIN2_GOVERNED_CLOSED:v1'
            if marker in s:
                if s.count(marker)!=1 or s.count(auth)!=1: raise SystemExit('P163_OWNER_MARKER_CARDINALITY')
                a=s.index(marker); b=s.index(auth,a+len(marker)); block=s[a:b]
                if version+'\n})();' not in block: raise SystemExit('P163_COMPATIBILITY_BOUNDARY_NOT_PROVEN')
                if 'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1' not in s: raise SystemExit('P163_DIAMOND_EXTENSION_MISSING')
                s=s[:a]+'})();\n\n'+s[b:]
                for alias in ('window.RW_Dashboard={render:renderDashboard};','window.RW_Items={render:renderItems};'):
                    if s.count(alias)!=1: raise SystemExit(f'P163_ALIAS_COUNT:{alias}:{s.count(alias)}')
                    s=s.replace(alias,'',1)
                s=re.sub(r'window\.RW_Items\s*=\s*RW_Items\s*;','window.RW_Items=RW_Items;',s)
                s=s.replace(version,'').replace(governed,'')
                owner='window.RW_Items=RW_Items;'
                if s.count(owner)!=1: raise SystemExit('P163_ITEMS_OWNER_COUNT')
                i=s.index(owner)+len(owner); s=s[:i]+'\n'+version+'\n'+governed+s[i:]
            checks={
              'compat_removed':marker not in s,'auth_once':s.count(auth)==1,'version_once':s.count(version)==1,'governed_once':s.count(governed)==1,
              'dash_alias_absent':'window.RW_Dashboard={render:renderDashboard};' not in s,'items_alias_absent':'window.RW_Items={render:renderItems};' not in s,
              'actions':'var actions=' in s,'delegation':'function main1Delegation(' in s,'main3':'MAIN3' in s,'main11':'MAIN11' in s,
              'shell':'window.RW_ShellContext' in s,'auth':'window.RW_Auth' in s,'nav':'window.RW_Navigation' in s,'views':'window.RW_Views' in s,
              'owner_license':'window.RW_OwnerLicense' in s and 'owner_profile' in s and 'license_status' in s,
              'stock_engine':'post_stock_movement' in s and 'reserve_stock' in s,'finance_reports':all(x in s for x in ('get_trial_balance','get_profit_loss','get_balance_sheet')),
              'edge_call':'edgeCall' in s,'supabase_client':'supabaseClient' in s or 'createClient' in s,
              'diamond':'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1' in s,'doctype':s.lstrip().lower().startswith('<!doctype html>'),'html':'<html' in s.lower() and '</html>' in s.lower(),
              'body':'<body' in s.lower() and '</body>' in s.lower()}
            class T(HTMLParser):
                def __init__(self): super().__init__(convert_charrefs=False); self.starts={}; self.ends={}
                def handle_starttag(self,tag,attrs): self.starts[tag.lower()]=self.starts.get(tag.lower(),0)+1
                def handle_endtag(self,tag): self.ends[tag.lower()]=self.ends.get(tag.lower(),0)+1
            t=T(); t.feed(s); t.close(); checks.update({'script_balance':t.starts.get('script',0)==t.ends.get('script',0),'style_balance':t.starts.get('style',0)==t.ends.get('style',0)})
            bad=[k for k,v in checks.items() if not v]; print('P163_CHECKS',checks)
            if bad: raise SystemExit('P163_STRUCTURAL_FAIL:'+','.join(bad))
            p.write_text(s,encoding='utf-8'); print('P163_TARGET_SHA256',hashlib.sha256(s.encode()).hexdigest())
            PY

            python3 - <<'PY'
            from pathlib import Path
            from html.parser import HTMLParser
            class Scripts(HTMLParser):
                def __init__(self): super().__init__(convert_charrefs=False); self.inline=[]; self.on=False; self.attrs={}; self.buf=[]
                def handle_starttag(self,tag,attrs):
                    if tag.lower()=='script': self.on=True; self.attrs=dict(attrs); self.buf=[]
                def handle_data(self,data):
                    if self.on and not self.attrs.get('src'): self.buf.append(data)
                def handle_endtag(self,tag):
                    if tag.lower()=='script':
                        if self.on and not self.attrs.get('src'): self.inline.append(''.join(self.buf))
                        self.on=False; self.attrs={}; self.buf=[]
            x=Scripts(); x.feed(Path('Current/PWA/New-main').read_text(encoding='utf-8')); x.close()
            if len(x.inline)!=1: raise SystemExit('P163_INLINE_APPLICATION_SCRIPT_COUNT='+str(len(x.inline)))
            Path('/tmp/newmain.js').write_text(x.inline[0],encoding='utf-8')
            PY
            node --check /tmp/newmain.js

            rm -rf /tmp/rw-pwa; mkdir -p /tmp/rw-pwa
            cp -r Current/PWA/. /tmp/rw-pwa/
            cp Current/PWA/New-main /tmp/rw-pwa/main.html
            python3 -m http.server 8123 --directory /tmp/rw-pwa >/tmp/rw-http.log 2>&1 &
            node <<'NODE'
            const {chromium}=require('playwright');
            (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(2500);const r=await p.evaluate(()=>{const S=window.RW_STATE,N=window.RW_Navigation;const flat=[];(function walk(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)walk(x.submenu)})})(N&&N.menuTree);const req=['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'];const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'];let denied=false;if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{N.navigate('license')}catch(e){denied=String(e.message||e).includes('OWNER_ONLY')}}return {lang:document.documentElement.lang,body:!!document.body,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,critical:req.every(v=>flat.includes(v)),mods:mods.every(v=>!!window[v]),denied,count:flat.length,diamond:document.documentElement.outerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),version:window.RW_PWA_RECONSTRUCTION_VERSION||null};});console.log(JSON.stringify({r,pe,ce}));if(pe.length||ce.length||r.lang!=='ar'||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.critical||!r.mods||!r.denied||r.count<30||!r.diamond||r.version!=='MAIN2-COMPLETE-SURGICAL-v1')process.exit(2);await b.close()})().catch(e=>{console.error(e);process.exit(2)})
            NODE

            python3 - <<'PY'
            from pathlib import Path
            import hashlib
            target=Path('Current/PWA/New-main').read_text(encoding='utf-8'); h=hashlib.sha256(target.encode('utf-8')).hexdigest()
