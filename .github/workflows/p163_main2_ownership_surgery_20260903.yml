name: P163 exact Main2 ownership verifier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p163_main2_ownership_surgery_20260903.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[P163-VERIFIER-FROZEN]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Verify-only target identity
        shell: bash
        run: |
          set -euo pipefail
          test -f Current/PWA/New-main
          test "$(git rev-parse HEAD:Current/PWA/New-main)" = "f26581b58f101671f96bdc23c58867b985182955"
          grep -q 'P163-GOLD-DIAMOND-CLOSED-2026-09-03' Current/PWA/New-main
          grep -q 'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1' Current/PWA/New-main
          echo 'P163_VERIFIER_FROZEN=PASS'
