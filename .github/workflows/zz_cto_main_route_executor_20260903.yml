          NODE
          echo BROWSER_TARGET_PRODUCT_GATE=PASS
      - name: Commit only target
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Target-Only Writer'
          git config user.email 'rawaea-cto-target-only-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED-100] New-main product runtime closure'
          git push origin HEAD:main
          echo CTO_TARGET_ONLY_PERSISTED=PASS
