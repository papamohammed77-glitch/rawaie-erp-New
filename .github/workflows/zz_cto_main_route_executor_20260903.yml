name: CTO New-main Target-Only Product Closure 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message == 'chore(cto): finalize New-main single-writer closure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Patch only Current/PWA/New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode('utf-8')) > 500000
          # Forensic boot defect: authenticated user was captured but not passed to enterSystem.
          old='await window.RW_Auth.enterSystem();'
          assert s.count(old)==1
          s=s.replace(old,'await window.RW_Auth.enterSystem(authUser);',1)
          # Never depend on disposable sibling applications for the parent shell.
          forbidden=['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']
          for x in forbidden: assert x not in s,x
          assert './New-main.manifest.json' not in s
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          # One self-contained final UX/runtime layer inside New-main only.
          marker='RAWAEA_MAIN_FINAL_PRODUCT_RUNTIME_CLOSURE_20260903'
          assert marker not in s
          layer=r'''<style id="RAWAEA_MAIN_FINAL_PRODUCT_STYLE">
          .rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#2563eb,#06b6d4);z-index:2}
          .rw-login-logo{width:104px!important;height:104px!important;border-radius:26px!important;overflow:hidden;position:relative;box-shadow:0 18px 38px rgba(37,99,235,.22)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-login-brand-fallback{display:grid;place-items:center;width:100%;height:100%;font-weight:900}
          .rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #f1f5f9}.rw-sidebar-user-avatar{width:38px;height:38px;min-width:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-link.active{background:var(--pl)!important;color:var(--p)!important;box-shadow:0 4px 12px rgba(37,99,235,.10)}
          </style>
          <script id="RAWAEA_MAIN_FINAL_PRODUCT_RUNTIME_CLOSURE_20260903">(function(){'use strict';
            function byId(x){return document.getElementById(x)}
            function syncBrand(){var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},name=String(c.name||'الروائع ERP').trim()||'الروائع ERP',logo=String(c.logo||'').trim();var host=document.querySelector('.rw-login-logo');if(host){host.id='rw-login-company-logo';var im=byId('rw-login-brand-image');if(!im){host.textContent='';im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';host.appendChild(im)}var fb=byId('rw-login-brand-fallback');if(!fb){fb=document.createElement('span');fb.id='rw-login-brand-fallback';fb.className='rw-login-brand-fallback';fb.textContent='ر';host.appendChild(fb)}if(logo){im.src=logo;im.style.display='block';fb.style.display='none'}else{im.style.display='none';im.removeAttribute('src');fb.style.display='grid'}}var cn=byId('rw-login-company-name')||document.querySelector('.rw-company-name');if(cn){cn.id='rw-login-company-name';cn.textContent=name}var sn=byId('rw-sidebar-company-name');if(sn)sn.textContent=name;var u=a.currentUser||{},top=document.querySelector('.rw-sidebar-top');if(top){var card=byId('rw-sidebar-user-card');if(!card){card=document.createElement('div');card.id='rw-sidebar-user-card';card.className='rw-sidebar-user';card.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name">مستخدم</div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role">—</div></div>';top.appendChild(card)}var un=String(u.name||'مستخدم').trim()||'مستخدم';byId('rw-sidebar-user-name').textContent=un;byId('rw-sidebar-user-role').textContent=String(u.role||'—');byId('rw-sidebar-user-avatar').textContent=un.charAt(0)||'م'}}
            window.RW_UX_PRODUCT_SYNC=syncBrand;
            try{var rem=localStorage.getItem('rawaea_remember_email')||'';if(rem&&byId('rw-username')){byId('rw-username').value=rem;var rb=byId('rw-remember');if(rb)rb.checked=true}}catch(e){}
            if(window.RW_Auth){var enter0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(u){var r=await enter0.call(this,u);syncBrand();return r};var login0=RW_Auth.login;RW_Auth.login=async function(u,p){try{var rb=byId('rw-remember');if(rb&&rb.checked)localStorage.setItem('rawaea_remember_email',String(u||''));else localStorage.removeItem('rawaea_remember_email')}catch(e){}return login0.call(this,u,p)};if(typeof RW_Auth.forgotPassword!=='function')RW_Auth.forgotPassword=async function(){var e=(byId('rw-username')&&byId('rw-username').value||'').trim();if(!e)throw new Error('أدخل البريد الإلكتروني أولاً');var r=await window.supabase.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;return true};if(byId('rw-forgot')&&!byId('rw-forgot').dataset.finalBound){byId('rw-forgot').dataset.finalBound='1';byId('rw-forgot').addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().then(function(){if(typeof toast==='function')toast('تم إرسال رابط إعادة تعيين كلمة المرور','success')}).catch(function(x){if(typeof safeText==='function')safeText(byId('rw-login-error'),x.message||String(x));if(byId('rw-login-error'))byId('rw-login-error').classList.remove('hidden')})})}}
            if(window.RW_Warehouse&&typeof RW_Warehouse.loadVoucherForm==='function'){var w=RW_Warehouse;if(typeof w.loadTransfer!=='function')w.loadTransfer=function(){return w.loadVoucherForm('Transfer')};if(typeof w.loadDirectSale!=='function')w.loadDirectSale=function(){return w.loadVoucherForm('DirectSale')};if(typeof w.loadDirectReturn!=='function')w.loadDirectReturn=function(){return w.loadVoucherForm('DirectReturn')};if(typeof w.loadSupplierReturn!=='function')w.loadSupplierReturn=function(){return w.loadVoucherForm('SupplierReturn')};if(typeof w.loadInventory!=='function'&&typeof w.loadVouchers==='function')w.loadInventory=function(){return w.loadVouchers()}}
            if(window.RW_Navigation){var n=RW_Navigation;if(Array.isArray(n.menuTree)){var g=n.menuTree.find(function(x){return x&&x.label==='المخازن والمخزون'&&Array.isArray(x.submenu)});if(g){[['inventory','إدارة المخزون','warehouse:view','fa-boxes-stacked'],['transfer','تحويل مخزني','transfer:view','fa-right-left'],['direct-sale','صرف سيارة بيع مباشر','direct-sale:view','fa-truck-fast'],['direct-return','استلام مرتجع سيارة','direct-return:view','fa-arrow-rotate-left'],['supplier-return','مرتجع لمورد','supplier-return:view','fa-rotate-left']].forEach(function(a){if(!g.submenu.some(function(z){return z&&z.view===a[0]}))g.submenu.push({view:a[0],label:a[1],perm:a[2],icon:a[3]})})}}var nav0=n.navigate;n.navigate=function(v){var map={transfer:'loadTransfer','direct-sale':'loadDirectSale','direct-return':'loadDirectReturn','supplier-return':'loadSupplierReturn',inventory:'loadInventory'};if(map[v]&&window.RW_Warehouse&&typeof RW_Warehouse[map[v]]==='function'){RW_STATE.app.currentView=v;return Promise.resolve(RW_Warehouse[map[v]]())}return nav0.call(this,v)}}
            syncBrand();setTimeout(syncBrand,250);setTimeout(syncBrand,1000);
          })();</script>'''
          s=s.replace('</body>',layer+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('TARGET_PATCHED=PASS')
          PY
      - name: Static target gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          assert len(s.encode('utf-8'))>500000
          assert s.count('await window.RW_Auth.enterSystem(authUser);')==1
          assert s.count('RAWAEA_MAIN_FINAL_PRODUCT_RUNTIME_CLOSURE_20260903')==2
          for x in ["'transfer':'loadTransfer'","'direct-sale':'loadDirectSale'","'direct-return':'loadDirectReturn'","'supplier-return':'loadSupplierReturn']:
              assert x in s,x
          assert 'inventory:\'loadInventory\'' in s
          assert './New-main.manifest.json' not in s
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          for x in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']:
              assert x not in s,x
          assert 'rw-login-brand-image' in s and 'rw-login-company-name' in s and 'rawaea_remember_email' in s and 'forgotPassword' in s
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          assert (mf.get('start_url'),mf.get('scope'),mf.get('dir'),mf.get('lang'))==('./New-main','./','rtl','ar')
          print('STATIC_TARGET_GATE=PASS')
          PY
      - name: Chromium target product gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/site && mkdir -p /tmp/site/Current/PWA
          cp Current/PWA/New-main /tmp/site/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/site/Current/PWA/manifest.json
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('/tmp/site');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid
          trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'}),pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('cdn.jsdelivr.net/npm/@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.__RESET=0;window.supabase={createClient:function(){function row(t){if(t==='app_settings')return {company_name:'الروائع',company_logo:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3C/svg%3E'};if(t==='users')return {id:'db-user',name:'المالك العام',email:'owner@alrawae.com',role:'مدير النظام',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']};if(t==='companies')return {id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null};if(t==='owner_profile')return {auth_user_id:'auth-owner',owner_email:'owner@alrawae.com',license_status:'active'};return null}function q(t){var o={};['select','eq','neq','in','or','order','limit','range','gte','lte','is','not','contains','filter'].forEach(k=>o[k]=function(){return o});o.maybeSingle=async()=>({data:row(t),error:null});o.single=async()=>({data:row(t),error:null});o.then=(f,j)=>Promise.resolve({data:Array.isArray(row(t))?row(t):[],error:null,count:0}).then(f,j);o.insert=async()=>({data:null,error:null});o.update=()=>o;o.delete=()=>o;o.upsert=async()=>({data:null,error:null});return o}return{from:q,rpc:async()=>({data:null,error:null}),channel:()=>({on(){return this},subscribe(){return this},send:async()=>({})}),auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({}),resetPasswordForEmail:async()=>{window.__RESET++;return{error:null}},onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},storage:{from:()=>({upload:async()=>({error:null}),getPublicUrl:()=>({data:{publicUrl:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3C/svg%3E'}})})}}}};`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){this.destroy=function(){}};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={utils:{},read:()=>({})};'});return r.continue()});await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1000);const base=await p.evaluate(()=>{const l=document.querySelector('link[rel="manifest"]');return{locale:document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',login:!!document.getElementById('rw-login-form'),sidebar:!!document.getElementById('rw-sidebar'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',warehouse:typeof RW_Warehouse==='object',remember:document.getElementById('rw-username')?.value==='remembered@example.com',forgot:typeof RW_Auth?.forgotPassword==='function',brand:!!document.getElementById('rw-login-brand-image'),company:document.getElementById('rw-login-company-name')?.textContent==='الروائع',manifest:l?.getAttribute('href')||''}});await p.locator('.rw-password-toggle').click();const pw=await p.locator('#rw-password').getAttribute('type');await p.locator('#rw-username').fill('forgot@example.com');await p.evaluate(()=>RW_Auth.forgotPassword());const reset=await p.evaluate(()=>window.__RESET);const ux=await p.evaluate(()=>{RW_STATE.app.company={name:'شركة اخ