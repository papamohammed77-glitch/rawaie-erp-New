name: CTO final New-main onefile gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message != '[CTO-CLOSED] New-main single-parent runtime closure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Surgical target reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000
          # Proven MAIN11 boot defect.
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          assert 'await window.RW_Auth.enterSystem();' not in s
          # Proven cross-module helper scope defect.
          a='window.safeText=safeText;'; b='window.showLoader=showLoader;window.hideLoader=hideLoader;window.showToast=toast;window._esc=esc;window.formatNumber=fmt;window._rwCompanyId=currentCompanyId;'
          assert s.count(a)==1
          if b not in s: s=s.replace(a,a+b,1)
          # Canonical login branding is refreshed from the authoritative company context.
          old='<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>'
          new='<div id="rw-login-company-logo" class="rw-login-logo" aria-label="شعار الشركة">ر</div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div class="rw-company-description">منصة إدارة الأعمال الذكية والمتكاملة</div>'
          if old in s:s=s.replace(old,new,1)
          assert 'id="rw-login-company-name"' in s and 'id="rw-login-company-logo"' in s
          oldctx="safeText(byId('rw-sidebar-company-name'),RW_STATE.app.company.name||'الشركة الحالية');safeText(byId('rw-sidebar-company-subtitle'),RW_STATE.app.licenseState||'Production');"
          newctx="safeText(byId('rw-sidebar-company-name'),RW_STATE.app.company.name||'الشركة الحالية');safeText(byId('rw-sidebar-company-subtitle'),RW_STATE.app.licenseState||'Production');safeText(byId('rw-login-company-name'),RW_STATE.app.company.name||'الروائع ERP');"
          if oldctx in s:s=s.replace(oldctx,newctx,1)
          # Eliminate direct parent links to disposable sibling application files.
          for oldp,newp in [('./pos.html','pos'),('./telesales.html','telesales'),('./buyer.html','purchases'),('./vouchers.html','vouchers'),('./picker.html','picking'),('./loader.html','loading'),('./driver.html','delivery'),('./Returns.html','returns'),('./unloader.html','unloading')]:s=s.replace(oldp,newp)
          for x in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']:assert x not in s,x
          pm=re.search(r"window\.RW_ParentRegistry=\{version:'1\.0',[\s\S]*?\};",s)
          if pm:
              s=s[:pm.start()]+"window.RW_ParentRegistry={version:'2.0',tenantAuthority:'RW_ShellContext.getCompanyId()',ownerAuthority:'owner_profile',permissionAuthority:'RW_Permissions_check',apps:{pos:'pos',telesales:'telesales',buyer:'purchases',vouchers:'vouchers',picker:'picking',loader:'loading',driver:'delivery',returns:'returns',unloader:'unloading'},launch:function(key){var v=this.apps[key];if(!v)throw new Error('UNKNOWN_PARENT_APP:'+key);return RW_Navigation.navigate(v);}};"+s[pm.end():]
          # Route compatibility for handlers that are already implemented in the parent surface.
          if 'RAWAEA_FINAL_ROUTE_COMPAT_V1' not in s:
              compat="<script id=\"RAWAEA_FINAL_ROUTE_COMPAT_V1\">(function(){'use strict';var n=window.RW_Navigation;if(!n||typeof n.navigate!=='function')return;var prev=n.navigate;n.navigate=function(view){if(view==='inventory'&&window.RW_Views&&window.RW_Views.actions&&typeof window.RW_Views.actions.inventory==='function')return Promise.resolve(window.RW_Views.actions.inventory());if(view==='reports'&&window.RW_Views&&window.RW_Views.actions&&typeof window.RW_Views.actions.reports==='function')return Promise.resolve(window.RW_Views.actions.reports());return prev.apply(this,arguments);};})();</script>"
              s=s.replace('</body>',compat+'</body>',1)
          p.write_text(s,encoding='utf-8')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object','Current/PWA/New-main'],text=True).strip())
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          assert s.count('window.byId=byId;')==1
          assert s.count('window.safeText=safeText;')==1
          assert s.count('window.safeHTML=safeHTML;')==1
          assert s.count("byId('rw-login-form').addEventListener('submit'")==1
          assert s.count('loginForm.addEventListener(\'submit\'')==1
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert './New-main.manifest.json' not in s
          assert 'id="rw-login-company-name"' in s
          assert 'window.RW_ParentRegistry={version:\'2.0\'' in s
          blocks=re.findall(r'<script\b([^>]*)>',s,re.I)
          assert any('src=' not in x for x in blocks)
          print('STATIC_TARGET_ONLY=PASS')
          PY
      - name: Chromium end to end
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >/tmp/http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.rstrip('/').endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('Current/PWA');ThreadingHTTPServer(('127.0.0.1',4173),H).serve_forever()
          PY
          python3 /tmp/http.py >/tmp/http.log 2>&1 & pid=$!;trap 'kill $pid 2>/dev/null || true' EXIT;sleep 2
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({serviceWorkers:'block'}); const pe=[],ce=[];
            await p.route('**/*',async route=>{const u=route.request().url();
              if(u.includes('@supabase/supabase-js'))return route.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){const one=(t)=>t==='users'?{id:'db-user',name:'مالك النظام',email:'owner@alrawae.com',role:'Owner',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null,main_branch_id:'a38332b6-6cea-480a-ada1-6eb6ab0590db',main_branch_code:'BR-01'}:t==='owner_profile'?{auth_user_id:'auth-owner',owner_name:'مالك النظام',owner_email:'owner@alrawae.com',license_status:'Active'}:t==='app_settings'?{company_name:'الروائع',company_logo:null,status:'Active'}:t==='branches'?[{id:'a38332b6-6cea-480a-ada1-6eb6ab0590db',name:'الفرع الرئيسي',branch_code:'BR-01',company_id:'00000000-0000-0000-0000-000000000001'}]:{};const q=t=>{const o={};for(const k of ['select','eq','neq','in','or','order','limit','range','gte','lte','is','not','contains','filter','update','delete','upsert'])o[k]=function(){return o};o.maybeSingle=async()=>({data:one(t),error:null});o.single=async()=>({data:one(t),error:null});o.insert=async()=>({data:null,error:null});o.then=(f,j)=>Promise.resolve({data:Array.isArray(one(t))?one(t):[],error:null,count:0}).then(f,j);return o};const ch=()=>({on(){return this},subscribe(){return this},send:async()=>({})});return{from:q,rpc:async()=>({data:null,error:null}),channel:ch,storage:{from:()=>({upload:async()=>({data:{},error:null}),getPublicUrl:()=>({data:{publicUrl:'https://example.com/logo.svg'}})})},auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),signInWithPassword:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),signOut:async()=>({}),resetPasswordForEmail:async()=>({error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})}}};`});
              if(u.includes('chart.js'))return route.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){this.destroy=function(){}};'});
              if(u.includes('sweetalert2'))return route.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});
              if(u.includes('xlsx'))return route.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});
              return route.continue();});
            p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1000);
            const base=await p.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',menu:!!document.getElementById('rw-sidebar-nav'),brand:!!document.getElementById('rw-login-company-name'),helpers:{showLoader:typeof window.showLoader,showToast:typeof window.showToast,_esc:typeof window._esc,_rwCompanyId:typeof window._rwCompanyId}}));
            const context=await p.evaluate(async()=>{await RW_Auth.enterSystem({id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}});return{authenticated:RW_STATE.app.authenticated,companyId:RW_STATE.app.companyId,company:RW_STATE.app.company.name,owner:RW_STATE.app.currentUser.isOwner,mainVisible:!document.getElementById('rw-main-shell').classList.contains('hidden'),loginName:document.getElementById('rw-login-company-name')?.textContent||''};});
            const menu=await p.evaluate(()=>{RW_Navigation.buildSidebar();return [...document.querySelectorAll('#rw-sidebar-nav [data-view]')].map(x=>x.getAttribute('data-view')).filter(Boolean)});
            const routes=await p.evaluate(async()=>{const out={};for(const v of ['dashboard','pos','orders','inventory','finance','reports','settings','notifications']){try{await Promise.resolve(RW_Navigation.navigate(v));out[v]=true}catch(e){out[v]=String(e.message||e)}}return out});
            const license=await p.evaluate(async()=>{RW_STATE.app.currentUser={id:'owner',name:'مالك النظام',email:'owner@alrawae.com',role:'Owner',isOwner:true,permissions:['*']};RW_STATE.permissions=['*'];try{await RW_Navigation.navigate('license');return {ok:true,view:RW_STATE.app.currentView}}catch(e){return {ok:false,error:String(e.message||e)}}});
            const denied=await p.evaluate(async()=>{RW_STATE.app.currentUser={id:'u',name:'مستخدم',email:'u@example.com',role:'User',isOwner:false,permissions:[]};RW_STATE.permissions=[];try{await RW_Navigation.navigate('license');return {ok:false,error:'NO_DENY'}}catch(e){return {ok:String(e.message||e)==='OWNER_ONLY',error:String(e.message||e)}}});
            console.log('CTO_NEWMAIN_GOLD_DIAMOND='+JSON.stringify({base,context,menuCount:menu.length,menu,routes,license,denied,pageErrors:pe,consoleErrors:ce}));
            const ok=!pe.length&&!ce.length&&base.lang==='ar'&&base.dir==='rtl'&&base.login&&base.manifest==='./manifest.json'&&base.auth&&base.nav&&base.views&&base.shell&&base.owner&&base.menu&&base.brand&&Object.values(base.helpers).every(x=>x==='function')&&context.authenticated&&context.companyId==='00000000-0000-0000-0000-000000000001'&&context.company==='الروائع'&&context.owner&&context.mainVisible&&context.loginName==='الروائع'&&menu.length>=20&&Object.values(routes).every(x=>x===true)&&license.ok&&denied.ok;await b.close();if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo GOLD_BROWSER=PASS
          echo DIAMOND_OWNER_LICENSE=PASS
      - name: Persist target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Final Closure'
          git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main single-parent runtime closure'
          git push origin HEAD:main
