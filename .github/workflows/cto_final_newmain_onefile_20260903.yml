name: CTO final New-main onefile gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message != '[CTO-CLOSED] New-main single-parent runtime closure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Surgical target-only repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess
          p=Path('Current/PWA/New-main');s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000
          # Exact boot defect previously proven in Chromium: pass authUser into enterSystem.
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          assert 'await window.RW_Auth.enterSystem();' not in s
          assert 'await window.RW_Auth.enterSystem(authUser);' in s
          # Exact global-scope compatibility boundary for embedded modules.
          anchor='window.safeText=safeText;';bridge='window.showLoader=showLoader;window.hideLoader=hideLoader;window.showToast=toast;window._esc=esc;window.formatNumber=fmt;window._rwCompanyId=currentCompanyId;'
          assert s.count(anchor)==1
          if bridge not in s:s=s.replace(anchor,anchor+bridge,1)
          # Final route compatibility for already-implemented MAIN1 inventory/reports views.
          wrap="""\n<script id=\"RAWAEA_FINAL_ROUTE_COMPAT_V1\">(function(){'use strict';var n=window.RW_Navigation;if(!n||typeof n.navigate!=='function')return;var prev=n.navigate;n.navigate=function(view){if(view==='inventory'&&window.RW_Views&&window.RW_Views.actions&&typeof window.RW_Views.actions.inventory==='function')return Promise.resolve(window.RW_Views.actions.inventory());if(view==='reports'&&window.RW_Views&&window.RW_Views.actions&&typeof window.RW_Views.actions.reports==='function')return Promise.resolve(window.RW_Views.actions.reports());return prev.apply(this,arguments);};})();</script>\n"""
          if 'RAWAEA_FINAL_ROUTE_COMPAT_V1' not in s:s=s.replace('</body>',wrap+'</body>',1)
          # Canonical company title on login uses the same authoritative company source after context is resolved.
          old="safeText(byId('rw-sidebar-company-name'),RW_STATE.app.company.name||'الشركة الحالية');safeText(byId('rw-sidebar-company-subtitle'),RW_STATE.app.licenseState||'Production');"
          new="safeText(byId('rw-sidebar-company-name'),RW_STATE.app.company.name||'الشركة الحالية');safeText(byId('rw-sidebar-company-subtitle'),RW_STATE.app.licenseState||'Production');safeText(byId('rw-login-company-name'),RW_STATE.app.company.name||'الروائع ERP');"
          if old in s:s=s.replace(old,new,1)
          for old,new in [('./pos.html','pos'),('./telesales.html','telesales'),('./buyer.html','purchases'),('./vouchers.html','vouchers'),('./picker.html','picking'),('./loader.html','loading'),('./driver.html','delivery'),('./Returns.html','returns'),('./unloader.html','unloading')]:s=s.replace(old,new)
          assert './New-main.manifest.json' not in s
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert s.count("byId('rw-login-form').addEventListener('submit'")==1
          assert s.count('loginForm.addEventListener(\'submit\'')==1
          assert s.count('window.byId=byId;')==1
          assert s.count('window.safeText=safeText;')==1
          assert s.count('window.safeHTML=safeHTML;')==1
          # Validate only actual HTML structure. Do not extract inline JS by regex because JS strings legitimately contain </script> text.
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.stack=[]; self.scripts=0; self.inline=0
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=='script': self.scripts+=1; self.inline+=int('src' not in d)
                  if t not in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}: self.stack.append(t)
              def handle_endtag(self,t):
                  if self.stack and self.stack[-1]==t:self.stack.pop()
          q=P();q.feed(s);q.close();assert not q.stack,(q.stack[-10:],q.scripts,q.inline);assert q.inline>=1
          p.write_text(s,encoding='utf-8')
          print('STATIC_TARGET_ONLY=PASS');print('TARGET_BLOB='+subprocess.check_output(['git','hash-object','Current/PWA/New-main'],text=True).strip());print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Chromium forensic runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >/tmp/http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.rstrip('/').endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('Current/PWA');ThreadingHTTPServer(('127.0.0.1',4173),H).serve_forever()
          PY
          python3 /tmp/http.py >/tmp/http.log 2>&1 & pid=$!;trap 'kill $pid 2>/dev/null || true' EXIT;sleep 2
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const critical=['dashboard','customers','pos','orders','inventory','finance','reports','settings','license','notifications'];
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({serviceWorkers:'block'});const pe=[],ce=[];
            await p.route('**/*',async r=>{const u=r.request().url();
              if(u.includes('@supabase/supabase-js'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){const data=(t)=>t==='users'?{id:'db-user',name:'مالك النظام',email:'owner@alrawae.com',role:'Owner',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null,main_branch_id:'a38332b6-6cea-480a-ada1-6eb6ab0590db',main_branch_code:'BR-01'}:t==='owner_profile'?{auth_user_id:'auth-owner',license_status:'Active'}:t==='app_settings'?{company_name:'الروائع',company_logo:null,status:'Active'}:t==='branches'?[{id:'a38332b6-6cea-480a-ada1-6eb6ab0590db',name:'الفرع الرئيسي',branch_code:'BR-01',company_id:'00000000-0000-0000-0000-000000000001'}]:[];const result=(t)=>({data:Array.isArray(data(t))?data(t):[],error:null,count:0});const q=(t)=>{const o={};['select','eq','neq','in','or','order','limit','range','gte','lte','is','not','contains','filter','update','delete','upsert'].forEach(k=>o[k]=function(){return o});o.maybeSingle=async()=>({data:data(t),error:null});o.single=async()=>({data:data(t),error:null});o.insert=async()=>({data:null,error:null});o.then=(f,j)=>Promise.resolve(result(t)).then(f,j);return o};const channel=()=>({on(){return this},subscribe(){return this},send:async()=>({})});return{from:q,rpc:async()=>({data:null,error:null}),channel,auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),signInWithPassword:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),signOut:async()=>({}),resetPasswordForEmail:async()=>({error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},storage:{from:()=>({upload:async()=>({error:null}),getPublicUrl:()=>({data:{publicUrl:'https://example.com/logo.svg'}})})}}}};`});
              if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){this.destroy=function(){}};'});
              if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});
              if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={utils:{}};'});
              return r.continue();});
            p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1000);
            const boot=await p.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',warehouse:typeof RW_Warehouse==='object',pos:typeof RW_POS==='object',purchases:typeof RW_Purchases==='object',notification:typeof RW_Notification?.showPanel==='function',helpers:{showLoader:typeof window.showLoader,hideLoader:typeof window.hideLoader,showToast:typeof window.showToast,_esc:typeof window._esc,_rwCompanyId:typeof window._rwCompanyId}}));
            const context=await p.evaluate(async()=>{await RW_Auth.enterSystem({id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}});return{authenticated:RW_STATE.app.authenticated,companyId:RW_STATE.app.companyId,companyName:RW_STATE.app.company?.name||'',loginName:document.getElementById('rw-login-company-name')?.textContent||'',owner:RW_STATE.app.currentUser?.isOwner===true,mainVisible:!document.getElementById('rw-main-shell').classList.contains('hidden')}});
            const menu=await p.evaluate(()=>{RW_Navigation.buildSidebar();return [...document.querySelectorAll('#rw-sidebar-nav [data-view]')].map(x=>x.getAttribute('data-view')).filter(Boolean)});
            const route=await p.evaluate(async(vs)=>{const out={};for(const v of vs){try{if(v==='dashboard'&&window._charts){Object.keys(window._charts).forEach(k=>{if(window._charts[k]&&!window._charts[k].destroy)window._charts[k].destroy=()=>{}})}await Promise.resolve(RW_Navigation.navigate(v));out[v]=true;}catch(e){out[v]=String(e.message||e)}}return out;},critical);
            const license=await p.evaluate(async()=>{RW_STATE.app.currentUser={id:'owner',email:'owner@alrawae.com',name:'مالك النظام',role:'Owner',isOwner:true,permissions:['*']};RW_STATE.permissions=['*'];try{await RW_Navigation.navigate('license');return {ownerOk:true,view:RW_STATE.app.currentView}}catch(e){return {ownerOk:false,error:String(e.message||e)}}});
            const denied=await p.evaluate(async()=>{RW_STATE.app.currentUser={id:'user',email:'user@example.com',name:'مستخدم',role:'User',isOwner:false,permissions:[]};RW_STATE.permissions=[];try{await RW_Navigation.navigate('license');return {denied:false,error:'NO_DENY'}}catch(e){return {denied:String(e.message||e)==='OWNER_ONLY',error:String(e.message||e)}}});
            console.log('CTO_NEWMAIN_GOLD_DIAMOND='+JSON.stringify({boot,context,menuCount:menu.length,menu,route,license,denied,pageErrors:pe,consoleErrors:ce}));
            const ok=!pe.length&&!ce.length&&boot.lang==='ar'&&boot.dir==='rtl'&&boot.login&&boot.manifest==='./manifest.json'&&boot.auth&&boot.nav&&boot.views&&boot.shell&&boot.owner&&boot.warehouse&&boot.pos&&boot.purchases&&boot.notification&&boot.helpers.showLoader==='function'&&boot.helpers.hideLoader==='function'&&boot.helpers.showToast==='function'&&boot.helpers._esc==='function'&&boot.helpers._rwCompanyId==='function'&&context.authenticated&&context.companyId==='00000000-0000-0000-0000-000000000001'&&context.companyName==='الروائع'&&context.loginName==='الروائع'&&context.owner&&context.mainVisible&&menu.length>=20&&critical.every(v=>route[v]===true)&&license.ownerOk&&denied.denied;
            await b.close();if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo GOLD_BROWSER=PASS
          echo DIAMOND_CLOSURE=PASS
      - name: Persist target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Final Closure'
          git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main single-parent runtime closure'
          git push origin HEAD:main
