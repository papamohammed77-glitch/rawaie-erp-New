name: CTO final New-main onefile gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message != '[CTO-CLOSED] New-main single-parent runtime closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Patch target only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000, 'TARGET_TOO_SMALL'
          old='await window.RW_Auth.enterSystem();'
          if old in s:
              s=s.replace(old,'await window.RW_Auth.enterSystem(authUser);',1)
          assert 'await window.RW_Auth.enterSystem();' not in s, 'AUTH_BOOT_DEFECT_REMAINS'
          # Make the canonical Supabase client available to the single-file UX layer.
          if 'window.__RAWAEA_SUPABASE_CLIENT__=supabase;' not in s:
              m=re.search(r"(var supabase=window\\.supabase\\.createClient\\([^;]+\\);)",s)
              assert m, 'SUPABASE_CLIENT_DECL_NOT_FOUND'
              s=s[:m.end()]+'window.__RAWAEA_SUPABASE_CLIENT__=supabase;'+s[m.end():]
          # Remove direct dependencies on disposable sibling application pages.
          for oldp,newp in [('./pos.html','pos'),('./telesales.html','telesales'),('./buyer.html','purchases'),('./vouchers.html','vouchers'),('./picker.html','picking'),('./loader.html','loading'),('./driver.html','delivery'),('./Returns.html','returns'),('./unloader.html','unloading')]:
              s=s.replace(oldp,newp)
          for x in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']:
              assert x not in s, x
          marker='RAWAEA_CTO_NEWMAIN_FINAL_RUNTIME_V1'
          if marker not in s:
              layer=r'''<!-- RAWAEA_CTO_NEWMAIN_FINAL_RUNTIME_V1 -->
          <style id="RAWAEA_CTO_NEWMAIN_FINAL_STYLE">
          .rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,#2563eb,#06b6d4)}
          .rw-login-logo{width:112px!important;height:112px!important;border-radius:28px!important;overflow:hidden;box-shadow:0 18px 38px rgba(37,99,235,.22);display:grid;place-items:center}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #f1f5f9}.rw-sidebar-user-avatar{width:38px;height:38px;min-width:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:#64748b;margin-top:2px}
          </style>
          <script id="RAWAEA_CTO_NEWMAIN_FINAL_RUNTIME_SCRIPT">
          (function(){'use strict';
            function by(i){return document.getElementById(i)}
            function db(){return window.__RAWAEA_SUPABASE_CLIENT__||window.RW_SUPABASE_CLIENT||null}
            function brand(name,logo){
              name=String(name||'الروائع ERP').trim()||'الروائع ERP';
              var n=by('rw-login-company-name')||document.querySelector('.rw-company-name');
              if(n){n.id='rw-login-company-name';n.textContent=name}
              var b=document.querySelector('.rw-login-logo');
              if(b){var im=by('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';b.textContent='';b.appendChild(im)}if(logo){im.src=String(logo);im.style.display='block'}else{im.style.display='none';im.removeAttribute('src')}}
              var sn=by('rw-sidebar-company-name');if(sn)sn.textContent=name
            }
            async function syncBrand(){
              try{
                var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},name=c.name||'الروائع ERP',logo=c.logo||c.logo_url||'';
                var client=db();
                if(client){var r=await client.from('app_settings').select('company_name,company_logo').limit(1).maybeSingle();if(!r.error&&r.data){name=r.data.company_name||name;logo=r.data.company_logo||logo}}
                brand(name,logo);
                try{localStorage.setItem('rawaea_company_name',name);if(logo)localStorage.setItem('rawaea_company_logo',logo)}catch(e){}
                if(a.currentUser){var top=document.querySelector('.rw-sidebar-top'),box=by('rw-sidebar-user-card');if(top&&!box){box=document.createElement('div');box.id='rw-sidebar-user-card';box.className='rw-sidebar-user';box.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name"></div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role"></div></div>';top.appendChild(box)}if(by('rw-sidebar-user-name'))by('rw-sidebar-user-name').textContent=String(a.currentUser.name||'مستخدم');if(by('rw-sidebar-user-role'))by('rw-sidebar-user-role').textContent=String(a.currentUser.role||'—');if(by('rw-sidebar-user-avatar'))by('rw-sidebar-user-avatar').textContent=String(a.currentUser.name||'م').trim().charAt(0)||'م'}
              }catch(e){}
            }
            window.RW_UX=window.RW_UX||{};RW_UX.syncBrand=syncBrand;RW_UX.brand=brand;
            try{var cached=localStorage.getItem('rawaea_company_name')||'الروائع ERP',cl=localStorage.getItem('rawaea_company_logo')||'',remember=localStorage.getItem('rawaea_remember_email')||'';brand(cached,cl);if(remember&&by('rw-username')){by('rw-username').value=remember;if(by('rw-remember'))by('rw-remember').checked=true}}catch(e){}
            if(window.RW_Auth){var enter0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(u){var z=await enter0.call(this,u);await syncBrand();return z};if(typeof RW_Auth.forgotPassword!=='function')RW_Auth.forgotPassword=async function(){var e=(by('rw-username')&&by('rw-username').value||'').trim();if(!e)throw new Error('أدخل البريد الإلكتروني أولاً');var c=db();if(!c)throw new Error('خدمة المصادقة غير متاحة');var r=await c.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;return true};var fg=by('rw-forgot');if(fg&&!fg.dataset.finalBound){fg.dataset.finalBound='1';fg.addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().then(function(){if(typeof toast==='function')toast('تم إرسال رابط إعادة تعيين كلمة المرور','success')}).catch(function(x){if(typeof safeText==='function')safeText(by('rw-login-error'),x.message||String(x));if(by('rw-login-error'))by('rw-login-error').classList.remove('hidden')})})}}
            if(window.RW_Navigation&&typeof RW_Navigation.navigate==='function'){var nav0=RW_Navigation.navigate;RW_Navigation.navigate=function(view){var type={transfer:'Transfer','direct-sale':'DirectSale','direct-return':'DirectReturn','supplier-return':'SupplierReturn'}[view];if(type&&window.RW_Warehouse&&typeof window.RW_Warehouse.loadVoucherForm==='function'){window.RW_STATE.app.currentView=view;return Promise.resolve(window.RW_Warehouse.loadVoucherForm(type))}return nav0.apply(this,arguments)}}
            syncBrand();setTimeout(syncBrand,500);setTimeout(syncBrand,1500)
          })();
          </script>'''
              s=s.replace('</body>',layer+'</body>',1)
          # Published manifest is authoritative.
          assert s.count('<link rel="manifest" href="./manifest.json">')==1, 'PUBLISHED_MANIFEST_REQUIRED'
          assert './New-main.manifest.json' not in s, 'LEGACY_MANIFEST_REFERENCE'
          p.write_text(s,encoding='utf-8')
          print('SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('BLOB='+subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
          PY
          git diff --check
      - name: Chromium product gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory Current/PWA >/tmp/newmain-http.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/New-main >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/New-main >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({serviceWorkers:'block'});const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.route('**/*',async r=>{const u=r.request().url();
              if(u.includes('@supabase/supabase-js')) return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){const q=t=>{const o={};for(const k of ['select','eq','neq','in','or','order','limit','range','gte','lte','is','not','contains','filter','update','delete','upsert'])o[k]=function(){return o};o.maybeSingle=async()=>({data:t==='users'?{id:'u',name:'مالك النظام',email:'owner@alrawae.com',role:'Owner',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null}:t==='owner_profile'?{auth_user_id:'auth-owner',owner_name:'مالك النظام',owner_email:'owner@alrawae.com',license_status:'Active'}:t==='app_settings'?{company_name:'الروائع',company_logo:null}:[],error:null});o.then=(f,j)=>Promise.resolve({data:[],error:null,count:0}).then(f,j);return o};return{from:q,rpc:async()=>({data:null,error:null}),auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),resetPasswordForEmail:async()=>({error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})}}}};`});
              if(u.includes('chart.js')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});
              if(u.includes('xlsx')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});
              return r.continue();
            });
            await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1200);
            const out=await p.evaluate(async()=>{
              const a={lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',brand:!!document.getElementById('rw-login-company-name'),nav:typeof RW_Navigation==='object',warehouse:typeof RW_Warehouse==='object',routes:{}};
              window.RW_Warehouse={loadVoucherForm:async t=>{window.__voucher=t;return true}};
              for(const v of ['transfer','direct-sale','direct-return','supplier-return']){try{await RW_Navigation.navigate(v);a.routes[v]=window.__voucher}catch(e){a.routes[v]=String(e.message||e)}}
              return a;
            });
            console.log('CTO_FINAL='+JSON.stringify({out,pe,ce}));
            const ok=!pe.length&&!ce.length&&out.lang==='ar'&&out.dir==='rtl'&&out.login&&out.manifest==='./manifest.json'&&out.brand&&out.nav&&out.warehouse&&Object.values(out.routes).every(x=>x===({transfer:'Transfer','direct-sale':'DirectSale','direct-return':'DirectReturn','supplier-return':'SupplierReturn'}[Object.keys(out.routes).find(k=>out.routes[k]===x)]));
            const exact=Object.entries(out.routes).every(([k,v])=>v===({transfer:'Transfer','direct-sale':'DirectSale','direct-return':'DirectReturn','supplier-return':'SupplierReturn'}[k]));
            await b.close();if(!ok||!exact)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Persist only New-main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CTO Automation'
          git config user.email 'cto-automation@users.noreply.github.com'
          git add Current/PWA/New-main
          if git diff --cached --quiet; then echo 'TARGET_ALREADY_CLOSED'; exit 0; fi
          git diff --cached --name-only | grep -Fx 'Current/PWA/New-main'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m '[CTO-CLOSED] New-main single-parent runtime closure'
          git push origin HEAD:main
