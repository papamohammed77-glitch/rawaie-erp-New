name: CTO New-main One Shot Writer 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: "!contains(github.event.head_commit.message, '[CTO-CLOSED]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Surgical target-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000 and len(s.splitlines())>5000
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert './New-main.manifest.json' not in s
          assert s.count('window.byId=byId;')==1 and s.count('window.safeText=safeText;')==1 and s.count('window.safeHTML=safeHTML;')==1
          marker='RAWAEA_UX_PRODUCT_LAYER_2026-09-03'
          if marker not in s:
              layer='''<!-- RAWAEA_UX_PRODUCT_LAYER_2026-09-03 -->
          <style id="RAWAEA_UX_PRODUCT_STYLE">.rw-login-card{position:relative;overflow:hidden;padding:48px!important;border-radius:36px!important}.rw-login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#2563eb,#06b6d4)}.rw-login-title{font-size:64px!important;line-height:1.15!important}.rw-login-logo{width:120px!important;height:120px!important;border-radius:30px!important;overflow:hidden;box-shadow:0 18px 38px rgba(37,99,235,.22)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-company-name{font-size:34px!important}.rw-company-description{font-size:13px!important}.rw-login-form{gap:24px!important}.rw-input{height:56px!important}.rw-login-btn{height:64px!important;border-radius:16px!important}.rw-login-footer{margin-top:8px!important}.rw-form-label{display:flex;align-items:center;gap:7px}.rw-form-group:first-child .rw-form-label:before{content:"\\f007";font-family:"Font Awesome 6 Free";font-weight:900}.rw-form-group:nth-child(2) .rw-form-label:before{content:"\\f023";font-family:"Font Awesome 6 Free";font-weight:900}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid #f1f5f9;border-radius:14px;background:#f8fafc}.rw-sidebar-user-avatar{width:38px;height:38px;min-width:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:var(--muted);margin-top:2px}.rw-sidebar-link.active{background:var(--pl)!important;color:var(--p)!important}@media(max-width:650px){.rw-login-title{font-size:34px!important}.rw-login-card{padding:28px 22px!important}.rw-login-logo{width:104px!important;height:104px!important}.rw-company-name{font-size:28px!important}}</style>
          <script id="RAWAEA_UX_PRODUCT_RUNTIME">(function(){'use strict';function id(x){return document.getElementById(x)}function brand(n,l){n=String(n||'الروائع ERP').trim()||'الروائع ERP';var cn=id('rw-login-company-name')||document.querySelector('.rw-company-name');if(cn){cn.id='rw-login-company-name';cn.textContent=n}var box=id('rw-login-company-logo')||document.querySelector('.rw-login-logo');if(box){box.id='rw-login-company-logo';var im=id('rw-login-brand-image');if(l){if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';box.textContent='';box.appendChild(im)}im.src=String(l);im.style.display='block'}else if(im){im.style.display='none';im.removeAttribute('src')}var sb=id('rw-sidebar-brand-logo');if(sb&&l)sb.src=String(l)}var sn=id('rw-sidebar-company-name');if(sn&&n)sn.textContent=n}function side(u){var top=document.querySelector('.rw-sidebar-top');if(!top||!u)return;var box=id('rw-sidebar-user-card');if(!box){box=document.createElement('div');box.id='rw-sidebar-user-card';box.className='rw-sidebar-user';box.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name">مستخدم</div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role">—</div></div>';top.appendChild(box)}var n=String(u.name||'مستخدم').trim()||'مستخدم';id('rw-sidebar-user-name').textContent=n;id('rw-sidebar-user-role').textContent=String(u.role||'—');id('rw-sidebar-user-avatar').textContent=n.charAt(0)||'م'}function sync(){var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{};brand(c.name||localStorage.getItem('rawaea_company_name')||'الروائع ERP',c.logo||localStorage.getItem('rawaea_company_logo')||'');if(a.currentUser)side(a.currentUser)}window.RW_UX_PRODUCT_SYNC=sync;try{var r=localStorage.getItem('rawaea_remember_email')||'';if(r&&id('rw-username')){id('rw-username').value=r;if(id('rw-remember'))id('rw-remember').checked=true}}catch(e){}var sb=window.supabase;if(sb)try{sb.from('app_settings').select('company_name,company_logo').limit(1).maybeSingle().then(function(x){if(!x.error&&x.data){brand(x.data.company_name,x.data.company_logo);try{localStorage.setItem('rawaea_company_name',x.data.company_name||'الروائع ERP');if(x.data.company_logo)localStorage.setItem('rawaea_company_logo',x.data.company_logo)}catch(e){}}}).catch(function(){})}catch(e){}if(window.RW_Auth){var e0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(u){var z=await e0.call(this,u);sync();return z};var l0=RW_Auth.login;RW_Auth.login=async function(u,p){var z=await l0.call(this,u,p);try{if(id('rw-remember')&&id('rw-remember').checked)localStorage.setItem('rawaea_remember_email',u);else localStorage.removeItem('rawaea_remember_email')}catch(e){}return z};RW_Auth.forgotPassword=async function(){var em=(id('rw-username')&&id('rw-username').value||'').trim();if(!em)throw new Error('أدخل البريد الإلكتروني أولاً');if(!sb||!sb.auth)throw new Error('خدمة المصادقة غير متاحة');var z=await sb.auth.resetPasswordForEmail(em,{redirectTo:window.location.origin+window.location.pathname});if(z.error)throw z.error;return true};var fg=id('rw-forgot');if(fg&&!fg.dataset.uxBound){fg.dataset.uxBound='1';fg.addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().then(function(){if(typeof toast==='function')toast('تم إرسال رابط إعادة تعيين كلمة المرور','success')}).catch(function(x){if(typeof safeText==='function')safeText(id('rw-login-error'),x.message||String(x));if(id('rw-login-error'))id('rw-login-error').classList.remove('hidden')})})}}try{sync()}catch(e){}})();</script>'''
              s=s.replace('</body>',layer+'\n</body>',1); p.write_text(s,encoding='utf-8')
          s=p.read_text(encoding='utf-8'); assert s.count(marker)==1 and s.count('rw-p163-closure')==1
          q=re.search(r'<script id="RAWAEA_UX_PRODUCT_RUNTIME">([\s\S]*?)</script>',s); assert q
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(q.group(1),encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          print('STATIC_PRODUCT_UX_PASS SHA256='+hashlib.sha256(s.encode()).hexdigest()+' LINES='+str(len(s.splitlines()))+' BYTES='+str(len(s.encode())))
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Browser Gold
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rw && mkdir -p /tmp/rw/Current/PWA && cp Current/PWA/New-main /tmp/rw/Current/PWA/New-main && cp Current/PWA/manifest.json /tmp/rw/Current/PWA/manifest.json
          cat >/tmp/http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,path): return 'text/html; charset=utf-8' if path.endswith('/New-main') else super().guess_type(path)
              def log_message(self,*a): pass
          os.chdir('/tmp/rw');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/http.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid; trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'}),pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200);const r=await p.evaluate(()=>({login:!!document.querySelector('#rw-login-form'),sidebar:!!document.querySelector('#rw-sidebar'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof window.safeText==='function',ux:typeof RW_UX_PRODUCT_SYNC==='function',brandImg:!!document.querySelector('#rw-login-brand-image'),forgot:typeof RW_Auth?.forgotPassword==='function',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',title:parseFloat(getComputedStyle(document.querySelector('.rw-login-title')).fontSize),pad:parseFloat(getComputedStyle(document.querySelector('.rw-login-card')).paddingTop),logo:document.querySelector('.rw-login-logo').getBoundingClientRect().width})); console.log('BROWSER_PRODUCT_UX='+JSON.stringify({r,pe,ce})); await b.close(); if(pe.length||ce.length||!r.login||!r.sidebar||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.safeText||!r.ux||!r.brandImg||!r.forgot||r.manifest!=='./manifest.json'||r.title<60||r.pad<40||r.logo<100) process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo BROWSER_PRODUCT_UX_PASS
      - name: Persist only New-main
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Single Writer'
          git config user.email 'rawaea-cto-single-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] [GOLD] [DIAMOND] New-main product UX closure'
          git push origin HEAD:main
