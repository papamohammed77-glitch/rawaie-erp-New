name: CTO temporary New-main UX polish executor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/__tmp_newmain_ux_polish.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Surgical target-only UX enhancement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          if len(s.encode()) < 500000: raise SystemExit('TARGET_TOO_SMALL')
          required=['P163-GOLD-DIAMOND-CLOSED-2026-09-03','function safeText','id="rw-header-search-input"','id="rw-login-form"']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('PRECONDITION_MISSING='+repr(missing))
          if '__RAWAEA_UX_POLISH_V1__' in s: raise SystemExit('UX_ALREADY_PRESENT')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',s,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit(f'INLINE_RUNTIME_COUNT={len(ms)}')
          body=ms[0].group('b')
          ux=r'''
/* RAWAEA UX POLISH V1 — non-invasive experience layer */
(function(){
  'use strict';
  if(window.__RAWAEA_UX_POLISH_V1__) return;
  window.__RAWAEA_UX_POLISH_V1__=true;
  function ready(fn){
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true});
    else fn();
  }
  ready(function(){
    try{
      var st=document.createElement('style');
      st.textContent='''
      + r'''
#rw-connectivity-status{position:fixed;top:10px;left:50%;transform:translate(-50%,-160%);z-index:99999;min-width:min(420px,calc(100vw - 24px));padding:11px 16px;border-radius:14px;font-size:12px;font-weight:900;text-align:center;box-shadow:0 12px 30px rgba(15,23,42,.14);transition:transform .28s ease,opacity .28s ease;opacity:0;pointer-events:none}
#rw-connectivity-status.show{transform:translate(-50%,0);opacity:1}
#rw-connectivity-status.offline{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
#rw-connectivity-status.online{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.rw-ux-focusable:focus-visible,.rw-btn:focus-visible,.rw-header-icon-btn:focus-visible,.rw-sidebar-link:focus-visible,.rw-login-btn:focus-visible,.rw-collapse-btn:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:2px}
@media(max-width:650px){#rw-connectivity-status{top:auto;bottom:12px}}
@media(prefers-reduced-motion:reduce){#rw-connectivity-status{transition:none}}
      '''
      document.head.appendChild(st);

      var status=document.createElement('div');
      status.id='rw-connectivity-status';
      status.setAttribute('role','status');
      status.setAttribute('aria-live','polite');
      document.body.appendChild(status);
      var timer=null;
      function show(text,offline){
        status.textContent=text;
        status.className=offline?'offline show':'online show';
        clearTimeout(timer);
        timer=setTimeout(function(){status.classList.remove('show')},offline?100000:2600);
      }
      function sync(){
        if(!navigator.onLine) show('أنت تعمل الآن بدون اتصال — التغييرات التي تحتاج الخادم ستنتظر عودة الاتصال.',true);
        else if(status.classList.contains('offline')) show('عاد الاتصال. يمكنك متابعة العمل بأمان.',false);
        else status.className='';
      }
      window.addEventListener('offline',function(){show('أنت تعمل الآن بدون اتصال — التغييرات التي تحتاج الخادم ستنتظر عودة الاتصال.',true)});
      window.addEventListener('online',function(){show('عاد الاتصال. يمكنك متابعة العمل بأمان.',false)});
      sync();

      document.addEventListener('keydown',function(e){
        var tag=(e.target&&e.target.tagName||'').toLowerCase();
        var editing=tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable);
        if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!editing){
          e.preventDefault();
          var q=document.getElementById('rw-header-search-input');
          if(q){q.focus();q.select();}
          return;
        }
        if(e.key==='Escape'&&!editing){
          var sb=document.getElementById('rw-sidebar');
          if(sb&&sb.classList.contains('active')&&window.RW_Navigation&&typeof window.RW_Navigation.toggleSidebar==='function'){
            try{window.RW_Navigation.toggleSidebar()}catch(_e){}
          }
        }
      },true);

      var form=document.getElementById('rw-login-form');
      if(form){
        form.addEventListener('submit',function(){
          var btn=document.getElementById('rw-login-btn');
          if(!btn)return;
          btn.setAttribute('aria-busy','true');
          btn.dataset.originalText=btn.textContent||'تسجيل الدخول';
          btn.textContent='جارٍ التحقق…';
          setTimeout(function(){
            if(document.body.contains(btn)){
              btn.setAttribute('aria-busy','false');
              btn.textContent=btn.dataset.originalText||'تسجيل الدخول';
            }
          },12000);
        },true);
      }
    }catch(e){console.warn('RAWAEA UX polish',e)}
  });
})();
'''
          newbody=body.replace('function safeText',ux+'\n  function safeText',1)
          if newbody==body: raise SystemExit('INJECTION_POINT_NOT_FOUND')
          candidate=s[:ms[0].start('b')]+newbody+s[ms[0].end('b'):]
          q=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',candidate,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(q)!=1: raise SystemExit('FINAL_INLINE_COUNT')
          f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(q[0].group('b'),encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          p.write_text(candidate,encoding='utf-8')
          print('TARGET_UX_POLISH=PASS')
          PY
      - name: Commit target only and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papamohammed77-glitch'
          git config user.email 'papamohammed77@gmail.com'
          git add Current/PWA/New-main
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '1'
          git commit -m '[CTO] New-main UX polish: connectivity, keyboard access, resilient login feedback'
          rm -f .github/workflows/__tmp_newmain_ux_polish.yml
          git add .github/workflows/__tmp_newmain_ux_polish.yml
          git commit -m '[CTO] retire temporary New-main UX executor'
          git push origin HEAD:main
