name: CTO Main2 Surgical Transformer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cto-main2-surgical.yml'

permissions:
  contents: write

jobs:
  surgical-main2:
    if: github.actor == 'papamohammed77-glitch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact residual closures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/main2/main2.md')
          s = p.read_text(encoding='utf-8')
          original = s

          # M2-02 residual: remove the obsolete duplicate Top Items query using undefined orderIds.
          old_obsolete_top_items = """        // 5. أفضل الأصناف\n        supabase.from('order_details').select('item_code, item_name, qty, unit_price').in('order_id', orderIds).then(function(res) {\n            renderTopItemsChart(res.data || []);\n        }).catch(function() {});\n"""
          if old_obsolete_top_items not in s:
              raise SystemExit('M2-02 obsolete orderIds block not found')
          s = s.replace(old_obsolete_top_items, '', 1)

          # M2-04 residual: barcode lookup must remain company-scoped.
          old_barcode_lookup = "supabase.from('items').select('id, item_code, barcode, name').in('barcode', barcodes)"
          new_barcode_lookup = "supabase.from('items').select('id, item_code, barcode, name').eq('company_id', companyId).in('barcode', barcodes)"
          count = s.count(old_barcode_lookup)
          if count != 1:
              raise SystemExit(f'M2-04 barcode lookup expected exactly 1 match, got {count}')
          s = s.replace(old_barcode_lookup, new_barcode_lookup, 1)

          if "in('order_id', orderIds)" in s:
              raise SystemExit('M2-02 undefined orderIds usage remains')
          if "select('id, item_code, barcode, name').in('barcode', barcodes)" in s:
              raise SystemExit('M2-04 unscoped barcode lookup remains')
          if s == original:
              raise SystemExit('No residual changes produced')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- Current/PWA/main2/main2.md

      - name: Commit surgical result
        shell: bash
        run: |
          git config user.name 'CTO Surgical Automation'
          git config user.email 'actions@github.com'
          git add Current/PWA/main2/main2.md
          git diff --cached --check
          git commit -m "fix(main2): remove residual undefined orderIds and scope barcode lookup"
          git push origin main
