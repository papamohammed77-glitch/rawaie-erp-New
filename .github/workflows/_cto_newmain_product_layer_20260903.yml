name: CTO New-main Safe Product Closure — 2026-09-03
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  close:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'cto/newmain-safe-closure-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Surgical target closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib, json
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode('utf-8')) > 400000
          assert '<html lang="ar" dir="rtl">' in s
          assert '<link rel="manifest" href="./manifest.json">' in s
          # Canonical auth boot: pass the resolved Supabase auth user into the governed context loader.
          replacements=0
          replacements += s.count('await window.RW_Auth.enterSystem();')
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          replacements += s.count('await RW_Auth.enterSystem();')
          s=s.replace('await RW_Auth.enterSystem();','await RW_Auth.enterSystem(authUser);')
          assert 'await window.RW_Auth.enterSystem(authUser);' in s or 'await RW_Auth.enterSystem(authUser);' in s
          # Single-target publication: remove only the explicit sibling service-worker coordinator.
          s=s.replace('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>','')
          assert 'register-sw.js' not in s
          # No direct sibling HTML product dependency from New-main.
          assert not re.search(r'<link[^>]+href=["\']\./[^"\']+\.html["\'][^>]*>',s,re.I)
          # Final compatibility layer: authoritative in-app branding + the four stock voucher menu views.
          layer=r'''<script id="RAWAEA_FINAL_PRODUCT_CLOSURE">(function(){'use strict';var e=function(x){return document.getElementById(x)},v=function(x,d){return x==null||x===''?d:x};function brand(){try{var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},n=String(v(c.name,'الروائع ERP')).trim()||'الروائع ERP',logo=String(c.logo||'').trim(),ln=e('rw-login-company-name')||document.querySelector('.rw-company-name'),sn=e('rw-sidebar-company-name'),lb=e('rw-login-company-logo')||document.querySelector('.rw-login-logo'),sl=e('rw-sidebar-brand-logo');if(ln)ln.textContent=n;if(sn)sn.textContent=n;if(lb&&logo){var im=e('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.alt='شعار الشركة';im.style.cssText='width:100%;height:100%;object-fit:contain;padding:10px';lb.innerHTML='';lb.appendChild(im)}im.src=logo}if(sl&&logo)sl.src=logo}catch(x){}}function routes(){try{var n=window.RW_Navigation,w=window.RW_Warehouse;if(!n||!w||typeof n.navigate!=='function'||typeof w.loadVoucherForm!=='function')return false;if(n.__finalRoutePatch)return true;var old=n.navigate.bind(n);n.navigate=function(view){if(view==='transfer')return w.loadVoucherForm('Transfer');if(view==='direct-sale')return w.loadVoucherForm('DirectSale');if(view==='direct-return')return w.loadVoucherForm('DirectReturn');if(view==='supplier-return')return w.loadVoucherForm('SupplierReturn');return old.apply(null,arguments)};n.__finalRoutePatch=true;return true}catch(x){return false}}function sync(){brand();if(!routes())setTimeout(function(){if(!routes())setTimeout(routes,500)},100)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync,{once:true});else sync();window.RW_FinalProductClosure={brand:brand,routes:routes}})();</script>'''
          if 'RAWAEA_FINAL_PRODUCT_CLOSURE' not in s:
              cut=s.rfind('</body>'); assert cut>0; s=s[:cut]+'\n'+layer+'\n'+s[cut:]
          assert s.count('RAWAEA_FINAL_PRODUCT_CLOSURE')==1
          assert "w.loadVoucherForm('Transfer')" in s
          assert "w.loadVoucherForm('DirectSale')" in s
          assert "w.loadVoucherForm('DirectReturn')" in s
          assert "w.loadVoucherForm('SupplierReturn')" in s
          # Validate only the actual newly-added closure script; do not parse embedded print-template strings as scripts.
          m=re.search(r'<script id="RAWAEA_FINAL_PRODUCT_CLOSURE">([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/final-closure.js').write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/final-closure.js'],check=True)
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          assert (mf.get('start_url'),mf.get('scope'),mf.get('dir'),mf.get('lang'))==('./New-main','./','rtl','ar')
          p.write_text(s,encoding='utf-8')
          print('PATCH_REPLACEMENTS',replacements)
          print('TARGET_BYTES',len(s.encode('utf-8')))
          print('TARGET_SHA256',hashlib.sha256(s.encode('utf-8')).hexdigest())
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Chromium visual and route gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-pwa && mkdir -p /tmp/rawaea-pwa/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea-pwa/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea-pwa/Current/PWA/manifest.json
          python3 -m http.server 4173 --directory /tmp/rawaea-pwa >/tmp/rawaea-http.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1440,height:900}}); const errs=[];
            p.on('pageerror',e=>errs.push('PAGE:'+e.message)); p.on('console',m=>{if(m.type()==='error')errs.push('CONSOLE:'+m.text())});
            await p.route('https://**/*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};window.Swal={fire:async()=>({}),close(){},showLoading(){}};window.XLSX={};window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:null}),signOut:async()=>({error:null}),resetPasswordForEmail:async()=>({error:null}),getUser:async()=>({data:{user:null},error:null})},from(){return{select(){return this},eq(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null})}}})};'}));
            await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));
            await p.goto('http://127.0.0.1:4173/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1600);
            const a=await p.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),sidebar:!!document.querySelector('.rw-sidebar'),brand:!!document.getElementById('rw-login-company-name'),remember:document.getElementById('rw-username')?.value==='remembered@example.com',auth:typeof window.RW_Auth==='object',nav:typeof window.RW_Navigation==='object',views:typeof window.RW_Views==='object',shell:typeof window.RW_ShellContext==='object',owner:typeof window.RW_OwnerLicense==='object',warehouse:typeof window.RW_Warehouse==='object',notif:typeof window.RW_Notification?.showPanel==='function',closure:typeof window.RW_FinalProductClosure==='object',routePatch:!!window.RW_Navigation?.__finalRoutePatch,manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href'),sw:[...document.scripts].some(x=>(x.src||'').includes('register-sw.js')),menuCount:Array.isArray(window.RW_Navigation?.menuTree)?window.RW_Navigation.menuTree.filter(x=>x&&x.view).length:0,titleSize:getComputedStyle(document.querySelector('.rw-login-title')).fontSize,logoSize:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0}));
            await p.evaluate(()=>{window.__routeCalls=[];RW_Warehouse.loadVoucherForm=function(t){window.__routeCalls.push(t);return t}});
            for(const [v,t] of Object.entries({transfer:'Transfer','direct-sale':'DirectSale','direct-return:'+'DirectReturn',supplier-return:'SupplierReturn'})){await p.evaluate(v=>RW_Navigation.navigate(v),v);}
            const q=await p.evaluate(()=>({calls:window.__routeCalls,company:(RW_STATE.app.company||{}).name||'',user:(RW_STATE.app.currentUser||{}).name||''}));
            console.log('PRODUCT_GATE',JSON.stringify({a,q,errs}));
            await b.close();
            const ok=!errs.length&&a.lang==='ar'&&a.dir==='rtl'&&a.login&&a.sidebar&&a.brand&&a.remember&&a.auth&&a.nav&&a.views&&a.shell&&a.owner&&a.warehouse&&a.notif&&a.closure&&a.routePatch&&a.manifest==='.'+'/New-main'&&!a.sw&&a.menuCount>=10&&Number(a.logoSize)>=80&&JSON.stringify(q.calls)===JSON.stringify(['Transfer','DirectSale','DirectReturn','SupplierReturn']);
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo CHROMIUM_PRODUCT_GATE=PASS
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] [GOLD] [DIAMOND] New-main product UX closure — verified'
          git push origin HEAD:main
          echo CLOSED_TARGET_PUSH=PASS
