name: CTO New-main Safe Product Closure — 2026-09-03
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  close:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'cto/newmain-safe-closure-20260903'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Surgical product closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib, json, tempfile
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode()) > 400000
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('window.byId=byId;') == 1
          assert s.count('window.safeText=safeText;') == 1
          assert s.count('rw-p163-closure') == 1
          assert s.count('<link rel="manifest" href="./manifest.json">') == 1
          assert './New-main.manifest.json' not in s
          for ident in ('RAWAEA_PRODUCT_UX_RUNTIME','RAWAEA_LOGIN_PRODUCT_UX_V1'):
              s=re.sub(r'<script\b[^>]*\bid=["\']'+re.escape(ident)+r'["\'][^>]*>[\s\S]*?</script>', '', s, count=1, flags=re.I)
              assert ident not in s
          marker='RAWAEA_MAIN_PRODUCT_UX_CLOSURE_20260903'
          if marker not in s:
              layer=r'''<!-- RAWAEA_MAIN_PRODUCT_UX_CLOSURE_20260903 -->
              <style id="RAWAEA_MAIN_PRODUCT_UX_STYLE">.rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#2563eb,#06b6d4);z-index:2}.rw-login-logo{width:108px!important;height:108px!important;border-radius:27px!important;overflow:hidden;box-shadow:0 18px 40px rgba(37,99,235,.22)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #eef2f7}.rw-sidebar-user-avatar{width:38px;height:38px;min-width:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:650px){.rw-login-logo{width:92px!important;height:92px!important}}</style>
              <script id="RAWAEA_MAIN_PRODUCT_UX_RUNTIME">(function(){'use strict';var q=function(s){return document.querySelector(s)},e=function(id){return document.getElementById(id)},val=function(x,d){return x==null||x===''?d:x};function sync(){try{var c=(window.RW_STATE&&RW_STATE.app&&RW_STATE.app.company)||{},u=(window.RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser)||{},name=String(val(c.name,'الروائع ERP')).trim(),logo=String(c.logo||'').trim(),logoBox=e('rw-login-company-logo')||q('.rw-login-logo'),nameBox=e('rw-login-company-name')||q('.rw-company-name');if(nameBox)nameBox.textContent=name||'الروائع ERP';if(logoBox&&logo){var im=e('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';logoBox.textContent='';logoBox.appendChild(im)}im.src=logo;im.style.display='block'}var sb=e('rw-sidebar-company-name');if(sb)sb.textContent=name||'الروائع ERP';var top=q('.rw-sidebar-top');if(top&&(u.name||u.email)){var card=e('rw-sidebar-user-card');if(!card){card=document.createElement('div');card.id='rw-sidebar-user-card';card.className='rw-sidebar-user';card.innerHTML='<div class="rw-sidebar-user-avatar" id="rw-sidebar-user-avatar">م</div><div><div class="rw-sidebar-user-name" id="rw-sidebar-user-name">مستخدم</div><div class="rw-sidebar-user-role" id="rw-sidebar-user-role">—</div></div>';top.appendChild(card)}var un=String(val(u.name,u.email||'مستخدم'));e('rw-sidebar-user-name').textContent=un;e('rw-sidebar-user-role').textContent=String(val(u.role,'—'));e('rw-sidebar-user-avatar').textContent=un.charAt(0)||'م'}}catch(x){}}window.RW_UX_PRODUCT={sync:sync};sync();setInterval(sync,1000);try{var r=e('rw-remember'),user=e('rw-username'),saved=localStorage.getItem('rawaea_remember_email')||'';if(r&&user&&saved){user.value=saved;r.checked=true}var f=e('rw-login-form');if(f&&!f.dataset.uxRemember){f.dataset.uxRemember='1';f.addEventListener('submit',function(){try{if(r&&user&&r.checked)localStorage.setItem('rawaea_remember_email',user.value||'');else localStorage.removeItem('rawaea_remember_email')}catch(x){}})}}catch(x){}})();</script>'''
              cut=s.rfind('</body>')
              assert cut > 0
              s=s[:cut]+'\n'+layer+'\n'+s[cut:]
          assert s.count(marker)==1
          assert s.count('RAWAEA_MAIN_PRODUCT_UX_RUNTIME')==1
          assert s.count('RAWAEA_MAIN_PRODUCT_UX_STYLE')==1
          mp=s.find(marker); writes=[m.start() for m in re.finditer(r'printWindow\.document\.write',s)]
          assert not writes or mp > max(writes)+10000
          scripts=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert scripts
          for i,code in enumerate(scripts):
              f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(code,encoding='utf-8'); r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True); f.unlink(missing_ok=True); assert r.returncode==0,(i,r.stderr)
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          assert mf.get('start_url')=='./New-main' and mf.get('scope')=='./' and mf.get('dir')=='rtl' and mf.get('lang')=='ar'
          p.write_text(s,encoding='utf-8')
          print('STATIC_PRODUCT_CLOSURE=PASS'); print('TARGET_BLOB='+subprocess.check_output(['git','rev-parse','HEAD:Current/PWA/New-main'],text=True).strip()); print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Chromium product gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-pwa && mkdir -p /tmp/rawaea-pwa/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea-pwa/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea-pwa/Current/PWA/manifest.json
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          class H(SimpleHTTPRequestHandler):
            def __init__(self,*a,**kw): super().__init__(*a,directory='/tmp/rawaea-pwa',**kw)
            def log_message(self,*a): pass
            def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
          ThreadingHTTPServer(('127.0.0.1',4173),H).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/server.log 2>&1 & spid=$!; trap 'kill $spid 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({viewport:{width:1440,height:900}}),errs=[];p.on('pageerror',e=>errs.push('PAGE:'+e.message));p.on('console',m=>{if(m.type()==='error')errs.push('CONSOLE:'+m.text())});await p.route('https://**/*',r=>r.fulfill({status:200,body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:null}),signOut:async()=>({error:null}),resetPasswordForEmail:async()=>({error:null}),getUser:async()=>({data:{user:null},error:null})},from(){return{select(){return this},eq(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null})}}})};window.Chart=function(){};window.Swal={fire:async()=>({}),close(){}};window.XLSX={};`,contentType:'application/javascript'}));await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));await p.goto('http://127.0.0.1:4173/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1800);const a=await p.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),loginVisible:getComputedStyle(document.getElementById('rw-login-page')).display!=='none',sidebar:!!document.querySelector('.rw-sidebar'),brand:!!document.getElementById('rw-login-company-name'),remember:document.getElementById('rw-username')?.value==='remembered@example.com',auth:typeof window.RW_Auth==='object',nav:typeof window.RW_Navigation==='object',views:typeof window.RW_Views==='object',shell:typeof window.RW_ShellContext==='object',owner:typeof window.RW_OwnerLicense==='object',byId:typeof window.byId==='function',safeText:typeof window.safeText==='function',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href'),menuCount:Array.isArray(window.RW_Navigation?.menuTree)?window.RW_Navigation.menuTree.filter(x=>x&&x.view).length:0,ux:typeof window.RW_UX_PRODUCT==='object',titleSize:getComputedStyle(document.querySelector('.rw-login-title')).fontSize,logoSize:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0}));if(errs.length)throw new Error('RUNTIME_ERRORS:'+errs.join('|'));for(const k of ['auth','nav','views','shell','owner','byId','safeText'])if(!a[k])throw new Error('CONTRACT_FAILURE:'+k);if(a.lang!=='ar'||a.dir!=='rtl'||!a.login||!a.loginVisible||!a.sidebar||!a.brand||!a.remember||a.manifest!=='./manifest.json'||!a.ux||a.menuCount<10||Number(a.logoSize)<80)throw new Error('PRODUCT_GATE_FAILURE:'+JSON.stringify(a));await p.setViewportSize({width:390,height:844});await p.waitForTimeout(300);const m=await p.evaluate(()=>({loginVisible:getComputedStyle(document.getElementById('rw-login-page')).display!=='none',mobileBtn:getComputedStyle(document.querySelector('.rw-mobile-menu-btn')).display!=='none'}));if(!m.loginVisible||!m.mobileBtn)throw new Error('MOBILE_GATE_FAILURE:'+JSON.stringify(m));console.log('CHROMIUM_PRODUCT_GATE=PASS');console.log(JSON.stringify({a,m,errs}));await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Commit target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git diff --cached --check
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main product UX closure — verified'
          git push origin HEAD:main
          echo CLOSED_TARGET_PUSH=PASS
