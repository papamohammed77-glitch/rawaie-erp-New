name: CTO New-main Product UX One Pass 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message == '[CTO-UX-ONEPASS] Persist New-main product UX closure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Patch only Current/PWA/New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,json,hashlib
          p=Path('Current/PWA/New-main');s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('window.byId=byId;')==1
          assert s.count('window.safeText=safeText;')==1
          assert s.count('window.safeHTML=safeHTML;')==1
          assert s.count('rw-p163-closure')==1
          assert s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')==1
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert './New-main.manifest.json' not in s
          marker='RAWAEA_MAIN_PRODUCT_UX_CLOSURE_20260903'
          assert marker not in s
          layer='''<!-- RAWAEA_MAIN_PRODUCT_UX_CLOSURE_20260903 -->
          <style id="RAWAEA_MAIN_PRODUCT_UX_STYLE">
          .rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#2563eb,#06b6d4);z-index:2}.rw-login-logo{width:112px!important;height:112px!important;border-radius:28px!important;overflow:hidden;box-shadow:0 18px 38px rgba(37,99,235,.22)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #f1f5f9}.rw-sidebar-user-avatar{width:38px;height:38px;min-width:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-link.active{background:var(--pl)!important;color:var(--p)!important;box-shadow:0 4px 12px rgba(37,99,235,.10)}
          </style>
          <script id="RAWAEA_MAIN_PRODUCT_UX_RUNTIME">(function(){'use strict';var client=window.RW_SUPABASE_CLIENT||null;function id(x){return document.getElementById(x)}function sync(company,user){company=company||{};var name=String(company.name||'الروائع ERP').trim()||'الروائع ERP',logo=String(company.logo||'').trim();var box=document.querySelector('.rw-login-logo');if(box){var im=id('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';box.textContent='';box.appendChild(im)}if(logo){im.src=logo;im.style.display='block';box.style.backgroundImage='none'}else{im.style.display='none';box.removeAttribute('style');box.classList.add('rw-login-logo')}box.setAttribute('aria-label','شعار '+name)}var n=document.querySelector('.rw-company-name');if(n)n.textContent=name;var sn=id('rw-sidebar-company-name');if(sn)sn.textContent=name;if(user){var top=document.querySelector('.rw-sidebar-top');if(top){var ucard=id('rw-sidebar-user-card');if(!ucard){ucard=document.createElement('div');ucard.id='rw-sidebar-user-card';ucard.className='rw-sidebar-user';ucard.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name">مستخدم</div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role">—</div></div>';top.appendChild(ucard)}var uname=String(user.name||'مستخدم').trim()||'مستخدم';id('rw-sidebar-user-name').textContent=uname;id('rw-sidebar-user-role').textContent=String(user.role||'—');id('rw-sidebar-user-avatar').textContent=uname.charAt(0)||'م'}}}window.RW_UX_PRODUCT={sync:sync};try{var cached=localStorage.getItem('rawaea_company_name'),clogo=localStorage.getItem('rawaea_company_logo'),rem=localStorage.getItem('rawaea_remember_email');sync({name:cached||'الروائع ERP',logo:clogo||''});if(rem&&id('rw-username')){id('rw-username').value=rem;if(id('rw-remember'))id('rw-remember').checked=true}}catch(e){}if(client){try{client.from('app_settings').select('company_name,company_logo').limit(1).maybeSingle().then(function(r){if(!r.error&&r.data){sync({name:r.data.company_name,logo:r.data.company_logo});try{localStorage.setItem('rawaea_company_name',r.data.company_name||'الروائع ERP');if(r.data.company_logo)localStorage.setItem('rawaea_company_logo',r.data.company_logo)}catch(e){}}}).catch(function(){})}catch(e){}}if(window.RW_Auth){var enter0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(authUser){var out=await enter0.call(this,authUser);try{var c=RW_STATE.app.company||{},u=RW_STATE.app.currentUser||{};sync(c,u);try{localStorage.setItem('rawaea_company_name',c.name||'الروائع ERP');if(c.logo)localStorage.setItem('rawaea_company_logo',c.logo)}catch(e){}}catch(e){}return out};var login0=RW_Auth.login;RW_Auth.login=async function(username,password){var out=await login0.call(this,username,password);try{var rb=id('rw-remember');if(rb&&rb.checked)localStorage.setItem('rawaea_remember_email',username);else localStorage.removeItem('rawaea_remember_email')}catch(e){}return out};if(typeof RW_Auth.forgotPassword!=='function')RW_Auth.forgotPassword=async function(){var email=(id('rw-username')&&id('rw-username').value||'').trim();if(!email)throw new Error('أدخل البريد الإلكتروني أولاً');if(!client)throw new Error('خدمة المصادقة غير متاحة');var r=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;return true};var fg=id('rw-forgot');if(fg&&!fg.dataset.uxBound){fg.dataset.uxBound='1';fg.addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().then(function(){if(typeof toast==='function')toast('تم إرسال رابط إعادة تعيين كلمة المرور','success')}).catch(function(x){if(typeof safeText==='function')safeText(id('rw-login-error'),x.message||String(x));if(id('rw-login-error'))id('rw-login-error').classList.remove('hidden')})})}}if(window.RW_Navigation){var nav0=RW_Navigation.navigate;RW_Navigation.navigate=function(v){var z=nav0.call(this,v);setTimeout(function(){document.querySelectorAll('#rw-sidebar-nav [data-view]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===v)})},0);return z}}})();</script>'''
          s=s.replace('</body>',layer+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          req=['RAWAEA_MAIN_PRODUCT_UX_CLOSURE_20260903','RAWAEA_MAIN_PRODUCT_UX_STYLE','RAWAEA_MAIN_PRODUCT_UX_RUNTIME','window.RW_UX_PRODUCT=','rw-login-brand-image','rawaea_company_name','rawaea_company_logo','rawaea_remember_email','forgotPassword=async function','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense=']
          assert not [x for x in req if x not in s]
          assert s.count("byId('rw-login-form').addEventListener('submit'")==1
          blocks=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I);assert blocks
          for i,c in enumerate(blocks):
              f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(c,encoding='utf-8');r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True);f.unlink(missing_ok=True);assert r.returncode==0,(i,r.stderr)
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'));assert (mf.get('start_url'),mf.get('scope'),mf.get('dir'),mf.get('lang'))==('./New-main','./','rtl','ar')
          print('STATIC_PRODUCT_UX=PASS');print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Browser product UX gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea && mkdir -p /tmp/rawaea/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea/Current/PWA/manifest.json
          cat >/tmp/http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('/tmp/rawaea');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/http.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid
          trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'});const pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){return{from:function(){return{select:function(){return this},limit:function(){return this},maybeSingle:function(){return Promise.resolve({data:{company_name:'الروائع',company_logo:'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg"%3E%3Crect width="80" height="80" fill="%232563eb"/%3E%3C/svg%3E'},error:null})}},auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub-login')}),signOut:async()=>({}),resetPasswordForEmail:async()=>({error:null})}}}}`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});return r.continue()});await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200);const a=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const m=await(await fetch(l.href)).json();return{login:!!document.getElementById('rw-login-form'),remember:document.getElementById('rw-username')?.value==='remembered@example.com',company:document.querySelector('.rw-company-name')?.textContent==='الروائع',brand:!!document.getElementById('rw-login-brand-image')&&document.getElementById('rw-login-brand-image').style.display!=='none',forgot:typeof RW_Auth?.forgotPassword==='function',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',sidebarContract:document.getElementById('RAWAEA_MAIN_SIDEBAR_COMPLETENESS_FINAL_V1')!==null,byId:typeof window.byId==='function',safeText:typeof window.safeText==='function',manifest:l?.getAttribute('href')||'',start:m.start_url,scope:m.scope,dir:m.dir,lang:m.lang}});await p.locator('.rw-password-toggle').click();const pass=await p.locator('#rw-password').getAttribute('type');await p.locator('#rw-username').fill('forgot@example.com');await p.evaluate(()=>RW_Auth.forgotPassword());const calls=await p.evaluate(()=>window.__RESET||0);const ux=await p.evaluate(()=>{RW_STATE.app.company={name:'شركة اختبار',logo:''};RW_STATE.app.currentUser={name:'مستخدم تجريبي',role:'Owner'};RW_UX_PRODUCT.sync();return{brand:document.querySelector('.rw-company-name')?.textContent,user:document.getElementById('rw-sidebar-user-name')?.textContent,role:document.getElementById('rw-sidebar-user-role')?.textContent,menu:(RW_Navigation.menuTree||[]).length}});console.log('PRODUCT_UX_BROWSER='+JSON.stringify({a,pass,calls,ux,pe,ce}));await b.close();if(pe.length||ce.length||!a.login||!a.remember||!a.company||!a.brand||!a.forgot||!a.nav||!a.views||!a.shell||!a.owner||!a.sidebarContract||!a.byId||!a.safeText||a.manifest!=='./manifest.json'||a.start!=='./New-main'||a.scope!=='./'||a.dir!=='rtl'||a.lang!=='ar'||pass!=='text'||ux.brand!=='شركة اختبار'||ux.user!=='مستخدم تجريبي'||ux.role!=='Owner'||ux.menu<1)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo BROWSER_PRODUCT_UX=PASS
      - name: Persist target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-UX] Persist New-main product UX layer only'
          git push origin HEAD:main
          echo TARGET_PERSISTED_ONLY=PASS
