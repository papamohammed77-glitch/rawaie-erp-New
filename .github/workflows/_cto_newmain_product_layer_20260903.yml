name: CTO New-main Deterministic Final Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == '[CTO-UX-REPAIR] Deterministic New-main final'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Surgical target repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, hashlib, json
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode()) > 500000
          assert '<html lang="ar" dir="rtl">' in s
          assert '<link rel="manifest" href="./manifest.json">' in s
          for ident in ('RAWAEA_PRODUCT_UX_RUNTIME','RAWAEA_LOGIN_PRODUCT_UX_V1'):
              s=re.sub(r'<script\\b[^>]*\\bid=["\']'+re.escape(ident)+r'["\'][^>]*>[\\s\\S]*?</script>', '', s, count=1, flags=re.I)
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          marker='RAWAEA_DETERMINISTIC_FINAL_RUNTIME_20260903'
          if marker not in s:
              layer='''<!-- RAWAEA_DETERMINISTIC_FINAL_RUNTIME_20260903 --><style id="RAWAEA_DETERMINISTIC_FINAL_STYLE">.rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,#2563eb,#06b6d4)}.rw-login-logo{width:108px!important;height:108px!important;border-radius:27px!important;overflow:hidden}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 11px;border-radius:14px;background:#f8fafc;border:1px solid #eef2f7}.rw-sidebar-user-avatar{width:38px;height:38px;border-radius:12px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900}.rw-sidebar-user-role{font-size:10px;color:#64748b;margin-top:2px}</style><script id="RAWAEA_DETERMINISTIC_FINAL_RUNTIME_20260903">(function(){'use strict';function e(x){return document.getElementById(x)}function sync(){try{var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},u=a.currentUser||{},n=String(c.name||'الروائع ERP').trim()||'الروائع ERP',l=String(c.logo||'').trim(),ln=e('rw-login-company-name')||document.querySelector('.rw-company-name'),sn=e('rw-sidebar-company-name'),lb=e('rw-login-company-logo')||document.querySelector('.rw-login-logo');if(ln)ln.textContent=n;if(sn)sn.textContent=n;if(lb&&l){var im=e('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';lb.textContent='';lb.appendChild(im)}im.src=l}var t=document.querySelector('.rw-sidebar-top');if(t&&(u.name||u.email)){var b=e('rw-sidebar-user-card');if(!b){b=document.createElement('div');b.id='rw-sidebar-user-card';b.className='rw-sidebar-user';b.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name"></div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role"></div></div>';t.appendChild(b)}var un=String(u.name||u.email||'مستخدم');e('rw-sidebar-user-name').textContent=un;e('rw-sidebar-user-role').textContent=String(u.role||'—');e('rw-sidebar-user-avatar').textContent=un.charAt(0)||'م'}}catch(x){}}window.RW_UX_PRODUCT={sync:sync};sync();try{var r=localStorage.getItem('rawaea_remember_email')||'';if(r&&e('rw-username')){e('rw-username').value=r;if(e('rw-remember'))e('rw-remember').checked=true}}catch(x){}if(window.RW_Auth&&!RW_Auth.forgotPassword)RW_Auth.forgotPassword=async function(){var m=(e('rw-username')&&e('rw-username').value||'').trim();if(!m)throw new Error('أدخل البريد الإلكتروني أولاً');var c=window.RW_SUPABASE_CLIENT;if(!c)throw new Error('خدمة المصادقة غير متاحة');var z=await c.auth.resetPasswordForEmail(m,{redirectTo:window.location.origin+window.location.pathname});if(z.error)throw z.error;return true};if(window.RW_Navigation&&window.RW_Warehouse&&typeof RW_Warehouse.loadVoucherForm==='function'&&!RW_Navigation.__deterministicFinal){var old=RW_Navigation.navigate.bind(RW_Navigation);RW_Navigation.navigate=function(v){var m={transfer:'Transfer','direct-sale':'DirectSale','direct-return':'DirectReturn','supplier-return':'SupplierReturn'};return m[v]?RW_Warehouse.loadVoucherForm(m[v]):old(v)};RW_Navigation.__deterministicFinal=true}})();</script>'''
              i=s.rfind('</body>'); assert i>0; s=s[:i]+layer+'\n'+s[i:]
          assert s.count(marker)==1
          blocks=re.findall(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*?)</script>',s,re.I)
          for i,code in enumerate(blocks):
              f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(code,encoding='utf-8'); subprocess.run(['node','--check',str(f)],check=True,stdout=subprocess.DEVNULL); f.unlink(missing_ok=True)
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          assert [mf.get(k) for k in ('start_url','scope','dir','lang')]==['./New-main','./','rtl','ar']
          p.write_text(s,encoding='utf-8')
          print('SURGICAL_PASS',len(s.encode()),hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Chromium final gate
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          mkdir -p /tmp/pwa/Current/PWA
          cp Current/PWA/New-main /tmp/pwa/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/pwa/Current/PWA/manifest.json
          python3 -m http.server 4173 --directory /tmp/pwa >/tmp/pwa-http.log 2>&1 & pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({viewport:{width:1440,height:900}}),e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));await p.route('https://**/*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};window.Swal={fire:async()=>({}),close(){}};window.XLSX={};window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),resetPasswordForEmail:async()=>({error:null}),signInWithPassword:async()=>({error:null})},from(){return{select(){return this},eq(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null})}}})};'}));await p.goto('http://127.0.0.1:4173/Current/PWA/New-main',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1200);const a=await p.evaluate(()=>({login:!!document.getElementById('rw-login-form'),sidebar:!!document.getElementById('rw-sidebar'),brand:!!document.getElementById('rw-login-company-name'),remember:document.getElementById('rw-username')?.value==='remembered@example.com',auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',byId:typeof window.byId==='function',safeText:typeof window.safeText==='function',ux:typeof window.RW_UX_PRODUCT==='object',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',nested:document.getElementById('RAWAEA_PRODUCT_UX_RUNTIME')?1:0,oldUx:document.getElementById('RAWAEA_LOGIN_PRODUCT_UX_V1')?1:0,menu:Array.isArray(RW_Navigation?.menuTree)?RW_Navigation.menuTree.filter(x=>x&&x.view).length:0,logo:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0}));const u=await p.evaluate(()=>{RW_STATE.app.company={name:'شركة اختبار',logo:''};RW_STATE.app.currentUser={name:'مستخدم اختبار',role:'Owner'};RW_UX_PRODUCT.sync();return{c:document.getElementById('rw-login-company-name')?.textContent,n:document.getElementById('rw-sidebar-user-name')?.textContent,r:document.getElementById('rw-sidebar-user-role')?.textContent}});console.log('CHROMIUM_PASS',JSON.stringify({a,u,e}));await b.close();if(e.length||!a.login||!a.sidebar||!a.brand||!a.remember||!a.auth||!a.nav||!a.views||!a.shell||!a.owner||!a.byId||!a.safeText||!a.ux||a.manifest!=='./manifest.json'||a.nested||a.oldUx||a.menu<10||a.logo<80||u.c!=='شركة اختبار'||u.n!=='مستخدم اختبار'||u.r!=='Owner')process.exit(2)})().catch(x=>{console.error(x.stack||x);process.exit(2)})
          NODE
      - name: Persist target only
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Final Executor'
          git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] [GOLD] [DIAMOND] New-main final product closure'
          git push origin HEAD:main
          echo CLOSED_100_PASS
