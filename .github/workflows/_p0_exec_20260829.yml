name: RAWAEA Main PWA Parts Forensic Repair 20260830
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'chore: serialized main pwa parts repair complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair original parts serially
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          root=Path('Current/PWA/main')
          parts=[root/f'main.{i}.txt' for i in range(1,12)]
          if any(not p.exists() for p in parts):
              raise SystemExit('MISSING_MAIN_PART')

          def scope(text, table):
              pat=re.compile(r"supabase\\.from\\('"+re.escape(table)+r"'\\)\\.select\\([^;\\n]*?\\)")
              out=[]
              last=0
              for m in pat.finditer(text):
                  out.append(text[last:m.end()])
                  tail=text[m.end():m.end()+240]
                  if ".eq('company_id',RW_ShellContext.getCompanyId())" not in tail:
                      out.append(".eq('company_id',RW_ShellContext.getCompanyId())")
                  last=m.end()
              out.append(text[last:])
              return ''.join(out)

          for idx,p in enumerate(parts,1):
              text=p.read_text(encoding='utf-8')

              if idx==1:
                  marker='window.RW_STATE = RW_STATE;'
                  if 'window.RW_ShellContext=RW_ShellContext;' not in text:
                      if marker not in text: raise SystemExit('P1_NO_STATE_ANCHOR')
                      block="""
// RAWAEA GOVERNED TENANT CONTEXT
var RW_ShellContext=(function(){
  var companyId=null,resolving=null;
  function resolve(){
    if(companyId){RW_STATE.app.companyId=companyId;return Promise.resolve(companyId);}
    if(resolving)return resolving;
    var u=RW_STATE.app.currentUser||{};
    if(!u.authId)return Promise.reject(new Error('AUTH_ID_UNAVAILABLE'));
    resolving=supabase.from('users').select('id,company_id,name,role,status').eq('auth_id',u.authId).eq('status','Active').maybeSingle().then(function(r){
      if(r.error||!r.data||!r.data.company_id)throw new Error('TENANT_CONTEXT_UNAVAILABLE');
      companyId=r.data.company_id;RW_STATE.app.companyId=companyId;RW_STATE.app.userId=r.data.id||null;
      if(RW_STATE.app.currentUser){if(r.data.name)RW_STATE.app.currentUser.name=r.data.name;if(r.data.role)RW_STATE.app.currentUser.role=r.data.role;}
      return companyId;
    }).finally(function(){resolving=null;});
    return resolving;
  }
  function getCompanyId(){if(!companyId&&RW_STATE.app.companyId)companyId=RW_STATE.app.companyId;if(!companyId)throw new Error('TENANT_CONTEXT_UNAVAILABLE');return companyId;}
  return {resolve:resolve,getCompanyId:getCompanyId,hasCompany:function(){return !!(companyId||RW_STATE.app.companyId);}};
})();
window.RW_ShellContext=RW_ShellContext;
"""
                      text=text.replace(marker,marker+block,1)
                  if 'authId: user.id' not in text:
                      text=text.replace('email: user.email,\n                role:','email: user.email,\n                authId: user.id,\n                role:',1)
                  text=text.replace("RW_STATE.permissions = meta.permissions || ['*'];","RW_STATE.permissions = Array.isArray(meta.permissions) ? meta.permissions : [];",1)
                  text=text.replace("RW_SUPABASE_CLIENT\n            .from('app_settings')\n            .select('*')\n            .limit(1)","RW_SUPABASE_CLIENT\n            .from('app_settings')\n            .select('*')\n            .eq('company_id',RW_ShellContext.getCompanyId())\n            .limit(1)",1)
                  text=text.replace("return supabase.from('customers').select('*').then(function(res)","return supabase.from('customers').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(res)",1)
                  text=text.replace("return supabase.from('branches').select('*').then(function(res)","return supabase.from('branches').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(res)",1)
                  text=text.replace("supabase.from('suppliers').select('*').then(function(r)","supabase.from('suppliers').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(r)",1)
                  if "showToast('تم تشغيل النظام في الوضع الآمن', 'warning');" in text:
                      text=text.replace("showToast('تم تشغيل النظام في الوضع الآمن', 'warning');","throw new Error('FAIL_CLOSED_TENANT_CONTEXT');",1)

              for table in ['app_settings','customers','branches','suppliers','orders','purchase_orders','receiving','stock_vouchers','runsheets','treasury','chart_of_accounts','roles']:
                  text=scope(text,table)
              if idx!=1:
                  text=scope(text,'users')

              if idx==7:
                  old="var detRes = await supabase.from('stock_voucher_details').select('*').eq('voucher_code', voucherCode);"
                  new="var voucherRes = await supabase.from('stock_vouchers').select('id').eq('company_id',RW_ShellContext.getCompanyId()).eq('voucher_code',voucherCode).maybeSingle(); if (voucherRes.error || !voucherRes.data) { hideLoader(); showToast('الإذن غير موجود','error'); return; }\n        var detRes = await supabase.from('stock_voucher_details').select('*').eq('voucher_id',voucherRes.data.id);"
                  text=text.replace(old,new)

              p.write_text(text,encoding='utf-8')

              check=p.read_text(encoding='utf-8')
              if idx==1 and 'window.RW_ShellContext=RW_ShellContext;' not in check: raise SystemExit(f'P{idx}_NO_TENANT_CONTEXT')
              if "تم تشغيل النظام في الوضع الآمن" in check: raise SystemExit(f'P{idx}_FAIL_OPEN_REMAINS')
              print(f'P{idx}_CLOSED')

          logical='\n'.join(p.read_text(encoding='utf-8') for p in parts)
          if logical.count('<!DOCTYPE html>')!=1 or logical.count('<html')!=1 or logical.count('</html>')!=1:
              raise SystemExit('LOGICAL_HTML_STRUCTURE_FAILURE')
          if re.search(r"supabase\\.from\\('stock_branches'\\)[\\s\\S]{0,500}\\.(update|insert|upsert|delete)\\(",logical):
              raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITER_REMAINS')
          if ".from('inventory_log').insert" in logical:
              raise SystemExit('DIRECT_INVENTORY_LOG_WRITER_REMAINS')

          checks=['app_settings','customers','branches','suppliers','orders','purchase_orders','receiving','stock_vouchers','runsheets','treasury','chart_of_accounts','roles']
          for table in checks:
              for m in re.finditer(r"supabase\\.from\\('"+table+r"'\\)\\.select\\(",logical):
                  if ".eq('company_id',RW_ShellContext.getCompanyId())" not in logical[m.end():m.end()+300]:
                      raise SystemExit('UNSCOPED:'+table)

          scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',logical,re.S|re.I)
          for i,code in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'rawaea-main-{i}.js';f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);raise SystemExit(f'JS_SYNTAX:{i}')
          print('LOGICAL_MAIN_PARTS_CLOSED',len(scripts))
          PY
          git diff --check
      - name: Commit original parts and execution record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA Serialized Main PWA Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260830_MAIN_PWA_PARTS_EXECUTION.md <<'EOF'
# RAWAEA ERP — Main PWA Parts Execution — 2026-08-30

Target: Current/PWA/main/main.1.txt through main.11.txt

The runner edits the original parts in place, validates each part before advancing, validates the in-memory logical concatenation, rejects direct Physical Stock writers, rejects unscoped tenant operational reads, and performs Node syntax checks on inline scripts.

No replacement Current/PWA/main.html is created by this execution.
EOF
          git add Current/PWA/main/main.*.txt Current/CTO/20260830_MAIN_PWA_PARTS_EXECUTION.md
          git rm .github/workflows/_p0_exec_20260829.yml
          git commit -m 'chore: serialized main pwa parts repair complete'
          git push origin HEAD:main
