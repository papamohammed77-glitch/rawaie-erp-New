name: RAWAEA P0 Exec 20260829
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  exec:
    if: github.event.head_commit.message != 'chore: p0 execution complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Execute P0 repair
        run: python3 tools/p0_main_shell_repair.py
      - name: Validate repaired main shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          required=['RW_ShellContext','RW_Fleet','create_vehicle_atomic']
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no inline scripts')
          for i,c in enumerate(scripts,1):
              p=Path(tempfile.gettempdir())/f'rw_main_{i}.js';p.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);raise SystemExit('syntax failure '+str(i))
          if "from('app_settings').select('*').limit(1)" in s: raise SystemExit('known unscoped app_settings')
          print('P0_OK scripts',len(scripts))
          PY
          git diff --check
      - name: Record and remove executor
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA P0 Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_P0_EXECUTION.md <<'EOF'
# RAWAEA ERP — Parent PWA main.html — P0 Execution

Executed by the governed temporary runner on 2026-08-29.

P0 changes applied surgically to the existing Parent PWA:
- authenticated tenant context from `users.company_id`;
- company-scoped tenant-owned shell reads;
- native Vehicle Master navigation/view;
- company-scoped smart driver search;
- vehicle creation delegated to `create_vehicle_atomic`;
- no client-side Physical Stock mutation added;
- original Parent PWA structure retained.

Validation completed in the same runner: inline JavaScript syntax, required anchors, tenant-read invariant, and git diff check.

Browser E2E and Production browser runtime are separate P4 gates and are not claimed by this static execution.
EOF
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_P0_EXECUTION.md
          git rm .github/workflows/_p0_exec_20260829.yml
          git commit -m 'chore: p0 execution complete'
          git push origin HEAD:main
