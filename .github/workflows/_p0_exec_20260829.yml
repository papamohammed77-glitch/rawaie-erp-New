name: RAWAEA FINAL MAIN RECONSTRUCTION EXECUTION CHANNEL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_p0_exec_20260829.yml'
      - 'tools/run_final_main_reconstruction_20260831.py'
      - 'tools/p0_main_shell_repair_v2.py'
      - 'tools/master_reconstruction_postprocess.py'
      - 'Current/PWA/main.html'
      - 'Original/PWA/main.html'
permissions:
  contents: write
jobs:
  final_reconstruction:
    if: ${{ !contains(github.event.head_commit.message, '[final-main-reconstruction-20260831]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Verify baseline
        run: |
          set -euo pipefail
          test -s Current/PWA/main.html
          test -s Original/PWA/main.html
          git rev-parse HEAD
          sha256sum Current/PWA/main.html
      - name: Execute reconstruction
        run: python3 tools/run_final_main_reconstruction_20260831.py
      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(scripts,1):
              p=Path(tempfile.gettempdir())/f'rw-final-{i}.js'; p.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(1)
          print('JS_SYNTAX_PASS',len(scripts))
          PY
      - name: Browser smoke gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rw-final-pwa; mkdir -p /tmp/rw-final-pwa
          cp -r Current/PWA/. /tmp/rw-final-pwa/
          python3 -m http.server 8123 --directory /tmp/rw-final-pwa >/tmp/rw-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[];p.on('pageerror',e=>pe.push(e.message));await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(4000);const r=await p.evaluate(()=>({lang:document.documentElement.lang,body:!!document.body,state:!!window.RW_STATE,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract}));console.log(JSON.stringify({r,pe}));if(r.lang!=='ar'||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||pe.length)process.exit(2);await b.close();})().catch(e=>{console.error(e);process.exit(2)})
          NODE
      - name: Persist verified reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-reconstruction-bot'
          git config user.email 'rawaea-reconstruction-bot@users.noreply.github.com'
          git add Current/PWA/main.html Current/CTO
          git diff --cached --quiet && { echo NO_RECONSTRUCTION_DELTA; exit 1; }
          git commit -m '[final-main-reconstruction-20260831] persist reconstructed main.html and evidence'
          git push origin HEAD:main
