name: CTO controlled New-main final closure writer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message == '[CTO-CLOSED] trigger New-main final closure writer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Repair and validate New-main only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib, json, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert './New-main.manifest.json' not in s
          assert 'window.byId=byId;' in s and 'window.safeText=safeText;' in s and 'window.safeHTML=safeHTML;' in s
          # Find the single outer main inline script and repair literal HTML parser terminators embedded in JS print templates.
          starts=[m.start() for m in re.finditer(r'<script(?:\s[^>]*)?>',s,re.I) if not re.search(r'\ssrc\s*=',m.group(0),re.I)]
          assert starts, 'NO_INLINE_SCRIPT'
          # The main script is the longest inline block.
          blocks=[]
          for st in starts:
              tagend=s.find('>',st)+1; en=s.find('</script>',tagend)
              if en>0: blocks.append((en-tagend,tagend,en))
          assert blocks, 'NO_INLINE_SCRIPT_BLOCK'
          _,bs,be=max(blocks)
          body=s[bs:be]
          embedded=body.count('</script>')
          if embedded:
              body=body.replace('</script>','<\\/script>')
              s=s[:bs]+body+s[be:]
          assert body.count('</script>')==0, 'RAW_NESTED_SCRIPT_CLOSE_REMAINS'
          # New-main is the parent product artifact; do not require sibling application pages or register-sw.js.
          s=s.replace('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>','')
          assert 'register-sw.js' not in s
          for old in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html']:
              assert old not in s, old
          # Remove obsolete UX runtime wrappers only when they are distinct standalone wrappers; do not alter MAIN2/MAIN11.
          for ident in ['RAWAEA_PRODUCT_UX_RUNTIME','RAWAEA_CTO_SAFE_PRODUCT_RUNTIME','RAWAEA_CTO_FINAL_PRODUCT_RUNTIME_V2']:
              s=re.sub(r'<script\\b[^>]*\\bid=["\\']'+re.escape(ident)+r'["\\'][^>]*>[\\s\\S]*?</script>','',s,count=1,flags=re.I)
          # Keep the existing login/company hooks; add one minimal authoritative product surface bridge if absent.
          if 'RAWAEA_CTO_FINAL_PRODUCT_SURFACE_MIN_V1' not in s:
              layer='''<!-- RAWAEA_CTO_FINAL_PRODUCT_SURFACE_MIN_V1 --><script id="RAWAEA_CTO_FINAL_PRODUCT_SURFACE_MIN_V1">(function(){'use strict';function id(x){return document.getElementById(x)}function sync(){try{var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},u=a.currentUser||{},n=String(c.name||'الروائع ERP').trim()||'الروائع ERP',l=String(c.logo||c.logo_url||'').trim(),cn=id('rw-login-company-name')||document.querySelector('.rw-company-name'),sn=id('rw-sidebar-company-name'),lb=id('rw-login-company-logo')||document.querySelector('.rw-login-logo'),sb=id('rw-sidebar-brand-logo');if(cn)cn.textContent=n;if(sn)sn.textContent=n;if(lb&&l){var im=id('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';lb.textContent='';lb.appendChild(im)}im.src=l}if(sb&&l)sb.src=l;var top=document.querySelector('.rw-sidebar-top');if(top&&u.name&&!id('rw-sidebar-user-card')){var card=document.createElement('div');card.id='rw-sidebar-user-card';card.className='rw-sidebar-user';card.innerHTML='<div class="rw-sidebar-user-avatar">م</div><div><div class="rw-sidebar-user-name"></div><div class="rw-sidebar-user-role"></div></div>';top.appendChild(card);card.querySelector('.rw-sidebar-user-name').textContent=String(u.name);card.querySelector('.rw-sidebar-user-role').textContent=String(u.role||'—')}}catch(e){}}window.RW_CTO_FINAL_SURFACE_MIN={sync:sync};sync();setTimeout(sync,500);setTimeout(sync,1500)})();</script>'''
              cut=s.rfind('</body>');assert cut>0;s=s[:cut]+layer+'\n'+s[cut:]
          # Validate all inline script bodies after HTML parsing.
          fdir=tempfile.mkdtemp(); ok=0
          for i,m in enumerate(re.finditer(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)):
              f=Path(fdir)/f'{i}.js';f.write_text(m.group(1),encoding='utf-8');r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True);assert r.returncode==0,r.stderr;ok+=1
          print('INLINE_SCRIPTS_NODE_CHECKED='+str(ok))
          print('EMBEDDED_RAW_SCRIPT_CLOSES_REPAIRED='+str(embedded))
          p.write_text(s,encoding='utf-8')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
          PY
          git diff --check
      - name: Browser Login Company Dashboard Sales Gold Diamond
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory . >/tmp/rawaea-http.log 2>&1 & pid=$!;trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30);do curl -fsS http://127.0.0.1:4173/Current/PWA/New-main >/dev/null&&break;sleep 1;done
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({viewport:{width:1440,height:900},serviceWorkers:'block'}),pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
          await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('@supabase/supabase-js'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){function q(t){let o={_t:t};o.select=()=>o;o.eq=()=>o;o.neq=()=>o;o.in=()=>o;o.or=()=>o;o.order=()=>o;o.limit=()=>o;o.range=()=>o;o.gte=()=>o;o.lte=()=>o;o.is=()=>o;o.not=()=>o;o.contains=()=>o;o.filter=()=>o;o.maybeSingle=async()=>({data:t==='users'?{id:'u',name:'المالك العام',email:'owner@alrawae.com',role:'مدير النظام',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null}:t==='owner_profile'?{auth_user_id:'auth-owner',owner_name:'المالك العام',owner_email:'owner@alrawae.com',license_status:'active'}:t==='app_settings'?{company_name:'الروائع',company_logo:null,status:'trial'}:null),error:null});o.then=f=>Promise.resolve({data:[],error:null,count:0}).then(f);o.insert=async()=>({data:null,error:null});o.update=()=>o;o.delete=()=>o;o.upsert=async()=>({data:null,error:null});return o}return{from:q,rpc:async()=>({data:null,error:null}),auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),resetPasswordForEmail:async()=>({error:null}),signOut:async()=>({error:null})}}};`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});if(u.includes('fonts.googleapis.com'))return r.fulfill({status:200,contentType:'text/css',body:''});if(u.includes('cdnjs.cloudflare.com'))return r.fulfill({status:200,contentType:'text/css',body:''});return r.continue()});
          await p.goto('http://127.0.0.1:4173/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1200);
          const surface=await p.evaluate(()=>({rtl:document.documentElement.dir==='rtl',login:!!document.getElementById('rw-login-form'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof safeText==='function',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',menus:Array.isArray(RW_Navigation?.menuTree)?RW_Navigation.menuTree.length:0}));if(pe.length||ce.length)throw new Error('INITIAL_ERRORS '+JSON.stringify({pe,ce,surface}));if(!surface.rtl||!surface.login||!surface.auth||!surface.nav||!surface.views||!surface.shell||!surface.owner||!surface.safeText||surface.manifest!=='./manifest.json'||surface.menus<10)throw new Error('SURFACE_GATE '+JSON.stringify(surface));
          await p.evaluate(async()=>{await RW_Auth.enterSystem({id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}})});await p.waitForTimeout(300);const company=await p.evaluate(()=>({id:RW_STATE.app.companyId,name:RW_STATE.app.company?.name,owner:RW_STATE.app.currentUser?.isOwner,license:RW_STATE.app.licenseState,sidebar:document.getElementById('rw-sidebar-company-name')?.textContent,main:!document.getElementById('rw-main-shell')?.classList.contains('hidden')}));if(company.id!=='00000000-0000-0000-0000-000000000001'||company.name!=='الروائع'||!company.owner||company.license!=='active'||company.sidebar!=='الروائع'||!company.main)throw new Error('COMPANY_GATE '+JSON.stringify(company));
          const dash=await p.evaluate(()=>({view:RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.innerText||''}));if(dash.view!=='dashboard')throw new Error('DASHBOARD_GATE '+JSON.stringify(dash));
          await p.evaluate(async()=>{await RW_Navigation.navigate('orders')});const sales=await p.evaluate(()=>({view:RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.innerText||''}));if(sales.view!=='orders')throw new Error('SALES_GATE '+JSON.stringify(sales));
          await p.evaluate(async()=>{await RW_Navigation.navigate('license')});const gold=await p.evaluate(()=>({view:RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.innerText||'',container:!!document.getElementById('license-main-container')}));if(gold.view!=='license'||!gold.container)throw new Error('GOLD_GATE '+JSON.stringify(gold));
          await p.evaluate(()=>{RW_STATE.app.currentUser={id:'u2',isOwner:false,permissions:[]};RW_STATE.permissions=[]});const diamond=await p.evaluate(async()=>{try{await RW_Navigation.navigate('license');return {ok:false,error:'NO_REJECTION'}}catch(e){return {ok:true,error:String(e.message||e)}}});if(!diamond.ok||diamond.error!=='OWNER_ONLY')throw new Error('DIAMOND_GATE '+JSON.stringify(diamond));
          console.log('GOLD=PASS');console.log('DIAMOND=PASS');console.log('CLOSED_100=PASS');console.log(JSON.stringify({surface,company,dashboard:dash.view,sales,gold,diamond}));await b.close()})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Persist target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git diff --cached --check
          git config user.name 'RAWAEA CTO Single Writer'
          git config user.email 'rawaea-cto-single-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main final product UX/runtime closure'
          git push origin HEAD:main
