name: RAWAEA ERP — Prompt 114 Final Reconstruction
on:
  push:
    branches: [reconstruction-114-final-20260831]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    if: "!contains(github.event.head_commit.message, '[reconstruction-114-artifact]') && !contains(github.event.head_commit.message, '[reconstruction-114-evidence]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: reconstruction-114-final-20260831
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair verified source regression
        shell: python
        run: |
          from pathlib import Path
          p = Path('Current/PWA/main/main7.md')
          s = p.read_text(encoding='utf-8')
          marker = "async function loadSettlement(){"
          start = s.find(marker)
          if start < 0:
              raise SystemExit('LOAD_SETTLEMENT_SOURCE_MISSING')
          end = s.find('\n  async function _onSettlementRsChange', start)
          if end < 0:
              raise SystemExit('LOAD_SETTLEMENT_BOUNDARY_MISSING')
          block = s[start:end]
          malformed = ".join(''));}"
          fixed = ".join('')));}"
          malformed_count = block.count(malformed)
          fixed_count = block.count(fixed)
          if malformed_count == 1 and fixed_count == 0:
              s = s[:start] + block.replace(malformed, fixed, 1) + s[end:]
              p.write_text(s, encoding='utf-8')
              print('SOURCE_REPAIR_APPLIED main7.loadSettlement')
          elif malformed_count == 0 and fixed_count == 1:
              print('SOURCE_REPAIR_ALREADY_PRESENT')
          else:
              raise SystemExit(f'LOAD_SETTLEMENT_REPAIR_AMBIGUOUS malformed={malformed_count} fixed={fixed_count}')
      - name: Build greenfield candidate
        run: python3 tools/reconstruct_114.py
      - name: Static validation and module parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/main.reconstruction.html'); s=p.read_text(encoding='utf-8')
          doc=re.sub(r'<script\b[^>]*>.*?</script\s*>','<script></script>',s,flags=re.I|re.S)
          assert len(re.findall(r'<!doctype\s+html',doc,re.I))==1
          for tag in ['html','head','body']:
              assert len(re.findall(rf'<{tag}\b',doc,re.I))==len(re.findall(rf'</{tag}>',doc,re.I)), tag
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>',s,re.S|re.I)
          for i,c in enumerate(blocks):
              f=Path(tempfile.gettempdir())/f'rw114-{i}.js'; f.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(f'JS_SYNTAX_FAIL_{i}')
          for pat,name in [(r"\.from\(\s*['\"]stock_branches['\"]\s*\)[\s\S]{0,1200}?\.(?:update|insert|upsert|delete)\s*\(",'DIRECT_STOCK_WRITER'),(r"\.from\(\s*['\"]inventory_log['\"]\s*\)[\s\S]{0,1200}?\.(?:update|insert|upsert|delete)\s*\(",'DIRECT_INVENTORY_LOG_WRITER'),(r'00000000-0000-0000-0000-000000000001','HARDCODED_TENANT')]: assert not re.search(pat,s,re.I), name
          assert 'RW_ShellContext' in s and 'getCompanyId' in s and 'isOwner' in s and 'permissions' in s and "'*'" in s
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',doc); dup=sorted(k for k,v in __import__('collections').Counter(ids).items() if v>1); assert not dup, 'DUPLICATE_IDS '+str(dup[:20])
          print('STATIC_GATE_PASS',len(blocks),'inline script blocks; document ids',len(ids))
          PY
      - name: Browser smoke gate
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8765 --directory Current/PWA >/tmp/rw114-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/main.reconstruction.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(3500);
            const data=await page.evaluate(()=>({title:document.title,login:!!document.querySelector('.rw-login-page'),shell:!!document.querySelector('.rw-main-shell'),sidebar:!!document.querySelector('#rw-sidebar'),page:!!document.querySelector('#rw-page-container'),tenant:!!window.RW_ShellContext,nav:!!window.RW_Navigation,ownerState:!!(window.RW_STATE&&window.RW_STATE.app&&window.RW_STATE.app.currentUser),hr:!!window.RW_HR,orders:!!window.RW_Orders}));
            console.log(JSON.stringify({data,errors,pageErrors},null,2));
            if(!data.title || !data.tenant || (!data.login && !data.shell) || !data.nav) process.exit(2);
            if(errors.length || pageErrors.length) process.exit(3);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(4)});
          NODE
      - name: Commit candidate and evidence
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA Prompt 114 Reconstruction'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/main.reconstruction.html Current/PWA/main/main7.md Current/CTO/*.json .github/workflows/reconstruction-114-final.yml tools/reconstruct_114.py
          git commit -m '[reconstruction-114-artifact] candidate build and verified source repair' || exit 0
          git push origin HEAD:reconstruction-114-final-20260831
