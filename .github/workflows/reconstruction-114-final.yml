name: RAWAEA ERP — Prompt 114 Final Reconstruction
on:
  push:
    branches: [reconstruction-114-final-20260831]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    if: "!contains(github.event.head_commit.message, '[reconstruction-114-artifact]') && !contains(github.event.head_commit.message, '[reconstruction-114-evidence]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: reconstruction-114-final-20260831
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build greenfield candidate from main1 + main2..main11
        run: python3 tools/reconstruct_114.py
      - name: Static validation and module parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          p=Path('Current/PWA/main.reconstruction.html')
          s=p.read_text(encoding='utf-8')
          assert s.lower().count('<!doctype html>')==1
          for tag in ['html','head','body','script','style']:
              assert len(re.findall(rf'<{tag}\\b',s,re.I))==len(re.findall(rf'</{tag}>',s,re.I)), tag
          blocks=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(blocks):
              f=Path(tempfile.gettempdir())/f'rw114-{i}.js'; f.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(f'JS_SYNTAX_FAIL_{i}')
          bad=[r"\\.from\\(\\s*[\"']stock_branches[\"']\\s*\\)[\\s\\S]{0,600}?\\.(?:update|insert|upsert|delete)\\s*\\(",r"\\.from\\(\\s*[\"']inventory_log[\"']\\s*\\)[\\s\\S]{0,600}?\\.(?:update|insert|upsert|delete)\\s*\\(",r'00000000-0000-0000-0000-000000000001',r"app_settings[\"']?\\).*limit\\(\\s*1\\s*\\)"]
          for x in bad: assert not re.search(x,s,re.I), x
          ids=re.findall(r'\\bid=[\"\\\']([^\"\\\']+)[\"\\\']',s)
          dup=sorted(k for k,v in __import__('collections').Counter(ids).items() if v>1)
          assert not dup, 'DUPLICATE_IDS '+str(dup[:20])
          print('STATIC_GATE_PASS', len(blocks), 'inline script blocks; ids', len(ids))
          PY
      - name: Browser smoke gate
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8765 --directory Current/PWA >/tmp/rw114-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; const pageErrors=[];
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:8765/main.reconstruction.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            const data=await page.evaluate(()=>({title:document.title,login:!!document.querySelector('.rw-login-page'),shell:!!document.querySelector('.rw-main-shell'),sidebar:!!document.querySelector('#rw-sidebar'),page:!!document.querySelector('#rw-page-container'),ownerContract:!!window.RW_OwnerContract,tenant:!!window.RW_ShellContext}));
            console.log(JSON.stringify({data,errors,pageErrors},null,2));
            if(!data.title || !data.tenant || !data.ownerContract || (!data.login && !data.shell)) process.exit(2);
            if(errors.length || pageErrors.length) process.exit(3);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(4)});
          NODE
      - name: Production evidence placeholder gate
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          # The live Supabase snapshot is collected separately from the privileged DB connector.
          Path('Current/CTO/playwright-result.json').write_text(json.dumps({'status':'PASS','authenticated_runtime':'NOT_VERIFIED','note':'Unauthenticated shell smoke only'},ensure_ascii=False,indent=2),encoding='utf-8')
          Path('Current/CTO/production-contract-result.json').write_text(json.dumps({'status':'PENDING_LIVE_CONNECTOR_VERIFICATION'},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit candidate and evidence
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA Prompt 114 Reconstruction'
          git.config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/main.reconstruction.html Current/CTO/*.json
          git add .github/workflows/reconstruction-114-final.yml tools/reconstruct_114.py
          git add -A
          git commit -m '[reconstruction-114-artifact] greenfield candidate and gates' || exit 0
          git push origin HEAD:reconstruction-114-final-20260831
