name: CTO New-main atomic close
on:
  push:
    branches: [cto-newmain-atomic-close-20260903]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Execute prove commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, tempfile, hashlib, json
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s)>200000 and len(s.splitlines())>5000, 'TARGET_SHAPE_UNEXPECTED'
          assert s.count('rw-p163-closure')==1, 'P163_CARDINALITY'
          assert s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')==1, 'DIAMOND_CARDINALITY'
          # PWA references are repaired to the target-local manifest and coordinator.
          legacy='<link rel="manifest" href="../manifest.json">'
          target='<link rel="manifest" href="./New-main.manifest.json">'
          s=s.replace(legacy,target,1)
          marker='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if marker not in s:
              assert s.lower().count('</head>')==1, 'HEAD_CARDINALITY'
              s=re.sub(r'</head>',marker+'\n</head>',s,count=1,flags=re.I)
          if coord not in s:
              assert s.lower().count('</head>')==1, 'HEAD_CARDINALITY_2'
              s=re.sub(r'</head>',coord+'\n</head>',s,count=1,flags=re.I)
          assert s.count(marker)==1 and s.count(coord)==1, 'PWA_MARKERS'

          def replace_block(text, sig, nextsig, repl, code):
              a=text.find(sig); b=text.find(nextsig,a)
              if a<0 or b<0 or b<=a: raise SystemExit(code)
              return text[:a]+repl+text[b:]

          s=replace_block(s,'function _openTreasuryDialog(editId) {','\n    function _editTreasury(id)',"""function _openTreasuryDialog(editId) {\n        _showToast('إدارة الخزائن والبنوك تتم عبر المحرك المالي المركزي. هذه الشاشة للعرض في PWA.', 'warning');\n        return;\n    }\n""",'TREASURY_BOUNDARY')
          s=replace_block(s,'function _openAccountDialog(editCode) {','\n    async function _seedAccounts()',"""function _openAccountDialog(editCode) {\n        _showToast('دليل الحسابات تتم إدارته عبر المحرك المالي المركزي فقط.', 'warning');\n        return;\n    }\n""",'COA_BOUNDARY')
          s=replace_block(s,'async function _seedAccounts() {','\n    // ==================== Journal ====================',"""async function _seedAccounts() {\n        _showToast('تهيئة دليل الحسابات تتم مركزيًا فقط.', 'warning');\n    }\n\n""",'SEED_BOUNDARY')
          s=replace_block(s,'function _editBudget(accountId, accountName, year, month) {','\n    return {',"""function _editBudget(accountId, accountName, year, month) {\n        _showToast('تعديل الموازنة يتم عبر المسار المالي المركزي فقط.', 'warning');\n        return;\n    }\n\n""",'BUDGET_BOUNDARY')
          # Replace only the clickable budget edit control with a clear locked affordance.
          pat=r'<button type="button" onclick="RW_Finance\._editBudget\([^<]*?</button>'
          s,n=re.subn(pat,'<span class="text-gray-400" title="الكتابة المركزية فقط"><i class="fa-solid fa-lock"></i></span>',s,count=1)
          if n!=1: raise SystemExit('BUDGET_BUTTON_NOT_REPLACED')
          # Make master-data add controls visibly locked; no fake click targets.
          pat2=r'<button type="button" onclick="RW_Finance\._openTreasuryDialog\(\)"[^>]*>.*?</button>'
          s,n=re.subn(pat2,'<span class="px-4 py-2 rounded-xl font-bold bg-gray-100 text-gray-500"><i class="fa-solid fa-lock ml-1"></i>إدارة مركزية فقط</span>',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('TREASURY_BUTTON_NOT_REPLACED')
          pat3=r'<div><button type="button" onclick="RW_Finance\._seedAccounts\(\)".*?</div>'
          s,n=re.subn(pat3,'<span class="px-4 py-2 rounded-lg font-bold bg-gray-100 text-gray-500"><i class="fa-solid fa-lock ml-1"></i>دليل الحسابات مركزي</span>',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('COA_BUTTONS_NOT_REPLACED')

          alias_old="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases'};"
          alias_new="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases',finance:'finance_manager',finance_manager:'finance'};"
          if alias_old in s: s=s.replace(alias_old,alias_new,1)
          assert alias_new in s, 'FINANCE_PERMISSION_ALIAS'
          boundary='<!-- RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1: PWA read-only master data; transactional finance delegates to Core Edge Functions/RPCs. -->'
          if boundary not in s: s=re.sub(r'</head>',boundary+'\n</head>',s,count=1,flags=re.I)
          assert s.count(boundary)==1, 'BOUNDARY_CARDINALITY'
          # Direct financial master writers are forbidden in the exact target.
          assert not re.search(r"from\('treasury'\)\.(insert|update|delete)",s), 'TREASURY_DIRECT_WRITER'
          assert not re.search(r"from\('chart_of_accounts'\)\.(insert|update|delete)",s), 'COA_DIRECT_WRITER'
          assert ".from('budgets').upsert" not in s, 'BUDGET_DIRECT_WRITER'
          # Exact target static syntax check.
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.starts=[]; self.styles=0
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.starts.append(dict(a)); self.cur={'src':dict(a).get('src'),'text':''}
                  elif t.lower()=='style': self.styles+=1
              def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']: self.cur['text']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                      self.cur=None
          q=P(); q.feed(s); q.close(); assert len(q.inline)==1, 'INLINE_COUNT'
          js=Path(tempfile.mkstemp(suffix='.js')[1]); js.write_text(q.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(js)],check=True)
          finally: js.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert (m.get('start_url'),m.get('scope'),m.get('lang'),m.get('dir'))==('./New-main','./','ar','rtl'), 'DEDICATED_MANIFEST'
          for f in ['Current/PWA/register-sw.js','Current/PWA/sw.js','Current/PWA/New-main-icon.svg']: assert Path(f).exists(),f
          # Write, then immediately re-read: this closes the mutation/proof gap.
          p.write_text(s,encoding='utf-8')
          checked=p.read_text(encoding='utf-8')
          assert checked==s, 'WRITE_READBACK_MISMATCH'
          print('STATIC_GOLD_PASS',hashlib.sha256(checked.encode()).hexdigest(),len(checked.splitlines()),len(checked.encode()))
          PY

          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{
            const s=fs.readFileSync('Current/PWA/New-main','utf8'); const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e))); p.on('console',m=>{if(m.type()==='error')ce.push(String(m.text()||''))});
            await p.route('https://cdn.jsdelivr.net/**',async r=>{const u=r.request().url(); if(u.includes('supabase-js')) return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{user:null},error:{message:'stub'}}),signOut:async()=>({error:null})},from:()=>({select:()=>({eq:()=>({order:()=>({limit:()=>({maybeSingle:async()=>({data:null,error:null}),in:async()=>({data:[],error:null})})})}),in:async()=>({data:[],error:null})}),rpc:async()=>({data:null,error:null})})})}`}); if(u.includes('chart.js')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'}); if(u.includes('sweetalert')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false,isDenied:false})};'}); if(u.includes('xlsx')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'}); return r.fulfill({status:200,contentType:'application/javascript',body:''});});
            await p.route('https://cdnjs.cloudflare.com/**',async r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await p.setContent(s,{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(700);
            const out=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation; S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]}; S.permissions=[]; let ld=false,ad=false,fd=false; try{await N.navigate('license')}catch(e){ld=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))} try{await N.navigate('audit')}catch(e){ad=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))} try{await N.navigate('finance')}catch(e){fd=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))} S.permissions=['finance_manager']; const fa=window.RW_Permissions_check('finance:view')===true; S.app.currentUser={email:'owner@example.com',isOwner:true,permissions:['*']}; let ol=false,oa=false; try{await N.navigate('license');ol=true}catch(e){} try{await N.navigate('audit');oa=true}catch(e){} return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',financeAlias:fa,licenseDenied:ld,auditDenied:ad,financeDenied:fd,ownerLicense:ol,ownerAudit:oa,masterGuard:document.documentElement.innerHTML.includes('RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1')};});
            console.log('FORENSIC_BROWSER='+JSON.stringify({out,pe,ce}));
            const ok=!pe.length&&!ce.length&&out.lang==='ar'&&out.dir==='rtl'&&out.state&&out.auth&&out.nav&&out.views&&out.shell&&out.owner&&out.diamond&&out.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&out.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&out.manifest==='.'+'/New-main.manifest.json'&&out.financeAlias&&out.licenseDenied&&out.auditDenied&&out.financeDenied&&out.ownerLicense&&out.ownerAudit&&out.masterGuard; await b.close(); if(!ok) process.exit(2); })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          # Final diff invariant: only the exact target may remain modified.
          rm -f .github/workflows/_cto_newmain_atomic_close_20260903.yml
          git add Current/PWA/New-main .github/workflows/_cto_newmain_atomic_close_20260903.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git push origin HEAD:cto-newmain-atomic-close-20260903
