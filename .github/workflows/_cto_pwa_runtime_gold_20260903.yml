name: CTO PWA Runtime Gold 20260903
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-pwa-runtime:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch target-specific PWA runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('.')
          target = root / 'Current/PWA/New-main'
          text = target.read_text(encoding='utf-8')

          old_manifest = '<link rel="manifest" href="../manifest.json">'
          new_manifest = '<link rel="manifest" href="./New-main.manifest.json">'
          if old_manifest not in text:
              raise SystemExit('EXPECTED_OLD_MANIFEST_LINK_NOT_FOUND')
          if text.count(old_manifest) != 1:
              raise SystemExit(f'EXPECTED_OLD_MANIFEST_LINK_ONCE: {text.count(old_manifest)}')
          if 'rw-pwa-runtime-gold' in text:
              raise SystemExit('PWA_RUNTIME_PATCH_ALREADY_PRESENT')
          if 'id="RAWAEA_TARGET_SW_COORDINATOR"' in text:
              raise SystemExit('TARGET_SW_COORDINATOR_ALREADY_PRESENT')
          if '</head>' not in text:
              raise SystemExit('HEAD_CLOSE_NOT_FOUND')

          # Target-preserving surgical patch only: isolate this PWA entry from unrelated shared manifest ownership.
          text = text.replace(old_manifest, new_manifest, 1)
          marker = '<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          text = text.replace('</head>', marker + '\n</head>', 1)
          text = text.replace('</head>', '<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03"></head>', 1)
          target.write_text(text, encoding='utf-8')

          manifest = root / 'Current/PWA/New-main.manifest.json'
          manifest.write_text('''{
  "name": "الروائع ERP",
  "short_name": "الروائع ERP",
  "description": "منصة إدارة الأعمال الذكية والمتكاملة - الروائع ERP",
  "start_url": "./New-main",
  "scope": "./",
  "display": "standalone",
  "background_color": "#f8fafc",
  "theme_color": "#2563eb",
  "orientation": "any",
  "dir": "rtl",
  "lang": "ar",
  "icons": [
    {
      "src": "./New-main-icon.svg",
      "sizes": "any",
      "type": "image/svg+xml",
      "purpose": "any maskable"
    }
  ]
}
''', encoding='utf-8')

          icon = root / 'Current/PWA/New-main-icon.svg'
          icon.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <text x="256" y="318" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" font-size="250" font-weight="900" fill="#fff">ر</text>
</svg>
''', encoding='utf-8')

          print('PATCHED_TARGET_PWA_RUNTIME')
          PY

      - name: Static contract gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'rw-pwa-runtime-gold' Current/PWA/New-main | wc -l)" -eq 1
          test "$(grep -o 'RAWAEA_TARGET_SW_COORDINATOR' Current/PWA/New-main | wc -l)" -eq 1
          test -f Current/PWA/New-main.manifest.json
          test -f Current/PWA/New-main-icon.svg
          test -f Current/PWA/sw.js
          test -f Current/PWA/register-sw.js
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main'
          assert m['scope']=='./'
          assert m['lang']=='ar' and m['dir']=='rtl'
          print('STATIC_PWA_CONTRACT_PASS')
          PY

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Real HTTP browser gate
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory Current/PWA >/tmp/rw-pwa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext();
            const errors=[];
            const page = await context.newPage();
            page.on('pageerror', e=>errors.push('pageerror:'+e.message));
            page.on('console', m=>{ if(m.type()==='error') errors.push('console:'+m.text()); });
            await page.goto('http://127.0.0.1:8765/New-main', {waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1800);

            const report = await page.evaluate(async()=>{
              const link = document.querySelector('link[rel="manifest"]');
              const sw = ('serviceWorker' in navigator) ? await navigator.serviceWorker.getRegistration('./') : null;
              return {
                lang: document.documentElement.lang,
                dir: document.documentElement.dir,
                p163: document.querySelector('meta[name="rw-p163-closure"]')?.content || null,
                pwaGold: document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content || null,
                manifestHref: link?.getAttribute('href') || null,
                manifestAbs: link ? new URL(link.getAttribute('href'), document.baseURI).href : null,
                swSupported: 'serviceWorker' in navigator,
                swRegistration: !!sw,
                swScope: sw?.scope || null,
                swScript: sw?.active?.scriptURL || sw?.installing?.scriptURL || sw?.waiting?.scriptURL || null,
                body: !!document.body,
                title: document.title
              };
            });

            if(report.lang!=='ar' || report.dir!=='rtl') throw new Error('DOCUMENT_CONTRACT_FAIL');
            if(report.p163!=='P163-GOLD-DIAMOND-CLOSED-2026-09-03') throw new Error('P163_MARKER_FAIL');
            if(report.pwaGold!=='PWA-RUNTIME-GOLD-2026-09-03') throw new Error('PWA_GOLD_MARKER_FAIL');
            if(report.manifestHref!=='./New-main.manifest.json') throw new Error('MANIFEST_LINK_FAIL:'+report.manifestHref);
            const manifest = await page.evaluate(async(url)=>{ const r=await fetch(url); if(!r.ok) throw new Error('MANIFEST_HTTP_'+r.status); return r.json(); }, report.manifestAbs);
            if(manifest.start_url!=='./New-main' || manifest.scope!=='./') throw new Error('MANIFEST_CONTRACT_FAIL');
            if(!report.swSupported || !report.swRegistration) throw new Error('SW_REGISTRATION_FAIL');
            if(!report.swScript || !report.swScript.endsWith('/sw.js')) throw new Error('SW_SCRIPT_FAIL:'+report.swScript);
            if(errors.length) throw new Error('BROWSER_RUNTIME_ERRORS:'+JSON.stringify(errors.slice(0,10)));
            console.log(JSON.stringify({report, manifest, errors}, null, 2));
            await browser.close();
          })().catch(e=>{ console.error(e.stack||e); process.exit(1); });
          NODE

      - name: Persist CTO state and commit verified closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          state = Path('CURRENT_STATE.md')
          marker = '## CTO PWA RUNTIME GOLD — 2026-09-03 (LIVE VERIFIED)'
          text = state.read_text(encoding='utf-8') if state.exists() else ''
          if marker not in text:
              text += ('\n\n' + marker + '\n'
                       '- Target: `Current/PWA/New-main`\n'
                       '- Root cause closed: target referenced the shared `../manifest.json` for an unrelated `/companies/company-1/` PWA surface and had no explicit target SW coordinator link.\n'
                       '- Added target-specific `New-main.manifest.json` with `start_url=./New-main`, `scope=./`, Arabic RTL metadata, and target icon.\n'
                       '- Added explicit `register-sw.js` coordinator link inside New-main.\n'
                       '- Added one exact runtime marker: `PWA-RUNTIME-GOLD-2026-09-03`.\n'
                       '- Static contract gate: PASS.\n'
                       '- Real HTTP Chromium browser gate: PASS; manifest fetched successfully; Service Worker registration active and points to `sw.js`; no pageerror/console errors.\n'
                       '- Production Supabase writes: NONE.\n'
                       '- GOLD = PROVEN for the PWA runtime Closure Unit.\n')
              state.write_text(text, encoding='utf-8')
          PY
          git config user.name 'cto-pwa-executor'
          git config user.email 'cto-pwa-executor@users.noreply.github.com'
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg CURRENT_STATE.md .github/workflows/_cto_pwa_runtime_gold_20260903.yml
          git commit -m '[PWA-RUNTIME] [GOLD-PROVEN] New-main manifest and Service Worker closure' || exit 0
          git push origin HEAD:main

# CTO continuation nonce: 2026-09-03T08:12:00+03:00
