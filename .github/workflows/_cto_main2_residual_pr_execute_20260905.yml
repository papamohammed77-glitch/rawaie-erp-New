name: CTO Main2 Residual PR Execute 20260905

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  close:
    if: github.actor == 'papamohammed77-glitch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply residual Main2 fixes and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/main2/main2.md')
          s = p.read_text(encoding='utf-8')
          old = """        // 5. أفضل الأصناف\n        supabase.from('order_details').select('item_code, item_name, qty, unit_price').in('order_id', orderIds).then(function(res) {\n            renderTopItemsChart(res.data || []);\n        }).catch(function() {});\n"""
          if old not in s:
              raise SystemExit('Residual M2-02 block not found')
          s = s.replace(old, '', 1)
          old2 = "supabase.from('items').select('id, item_code, barcode, name').in('barcode', barcodes)"
          new2 = "supabase.from('items').select('id, item_code, barcode, name').eq('company_id', companyId).in('barcode', barcodes)"
          if s.count(old2) != 1:
              raise SystemExit('Residual M2-04 lookup not found exactly once')
          s = s.replace(old2, new2, 1)
          if "in('order_id', orderIds)" in s:
              raise SystemExit('Undefined orderIds remains')
          if old2 in s:
              raise SystemExit('Unscoped barcode lookup remains')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/_cto_main2_residual_pr_execute_20260905.yml
          git diff --check
          git diff -- Current/PWA/main2/main2.md
          git config user.name 'CTO Main2 Closure Automation'
          git config user.email 'actions@github.com'
          git add Current/PWA/main2/main2.md .github/workflows/_cto_main2_residual_pr_execute_20260905.yml
          git diff --cached --check
          git commit -m "fix(main2): close residual surgical defects"
          git push origin HEAD:${{ github.head_ref }}
