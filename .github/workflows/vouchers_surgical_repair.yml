name: vouchers-surgical-repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Surgical repair and static verification
        shell: bash
        run: |
          set -euo pipefail
          FILE="Current/PWA/vouchers.html"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("Current/PWA/vouchers.html")
          s=p.read_text(encoding="utf-8")
          bad="t=key==='wsRep'?'rep':key==='wsTo'&&s.type==='DirectSale'?'vehicle':s.type==='DirectReturn'&&(key==='wsFrom'?'vehicle':'branch'):s.type==='SupplierReturn'&&key==='wsTo'?'supplier':null;"
          good="t=key==='wsRep'?'rep':key==='wsTo'&&s.type==='DirectSale'?'vehicle':s.type==='DirectReturn'?(key==='wsFrom'?'vehicle':'branch'):s.type==='SupplierReturn'&&key==='wsTo'?'supplier':null;"
          n=s.count(bad)
          if n != 1:
              raise SystemExit(f"Expected exactly 1 malformed ternary, found {n}")
          p.write_text(s.replace(bad,good),encoding="utf-8")
          PY
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile
          html=pathlib.Path("Current/PWA/vouchers.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          with tempfile.TemporaryDirectory() as d:
              for i,code in enumerate(scripts):
                  fn=pathlib.Path(d)/f"script_{i}.js"
                  fn.write_text(code,encoding="utf-8")
                  r=subprocess.run(["node","--check",str(fn)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr)
                      raise SystemExit(f"JavaScript syntax failure in inline script #{i}")
          required=['togglePass','resetPassword','applyRecoveryPassword','cancelRecovery','doLogin','init','logout','tab','toggleMenu','choose','loadList','renderList','details','send','cancel','receive','complete','newWorkspace','renderWorkspace','submit','account']
          missing=[x for x in required if not re.search(r'(?:var App=\{|App\.)'+re.escape(x)+r'\s*[:=]',html)]
          if missing:
              raise SystemExit('Missing required App methods: '+', '.join(missing))
          forbidden=[r"from\(['\"]stock_branches['\"]\)\.(?:insert|update|upsert|delete)",r"from\(['\"]inventory_log['\"]\)\.(?:insert|update|upsert|delete)"]
          for pat in forbidden:
              if re.search(pat,html):
                  raise SystemExit('Direct physical-stock mutation found: '+pat)
          if 'Unexpected token' in html:
              raise SystemExit('Unexpected-token residue found in source')
          print('VOUCHERS_STATIC_CHECK=PASS')
          PY
          git status --short
          git diff -- Current/PWA/vouchers.html
      - name: Commit file-only repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rawaea-cto-bot"
          git config user.email "rawaea-cto-bot@users.noreply.github.com"
          git add Current/PWA/vouchers.html
          git rm .github/workflows/vouchers_surgical_repair.yml
          git commit -m "fix(vouchers): repair malformed picker ternary and verify gold master"
          git push origin HEAD:main
