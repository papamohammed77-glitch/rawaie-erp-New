name: Forensic PWA Closure
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  p0_main_repair:
    if: github.event.head_commit.message != 'fix: execute parent pwa vehicle master integration' && github.event.head_commit.message != 'fix: forensic pwa closure automated commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Surgical Parent PWA main.html P0
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/main.html')
          s=p.read_text(encoding='utf-8')
          original=s
          required=['var RW_Dashboard','var RW_Auth','const RW_Navigation = {','var RW_Views = {','var RW_Warehouse','var RW_Finance','var RW_Reports','function RW_Audit_renderTab()']
          for a in required:
              if a not in s: raise SystemExit('P0_ABORT missing anchor: '+a)

          # ---------- Tenant context ----------
          if 'window.RW_ShellContext' not in s:
              a='window.RW_STATE = RW_STATE;'; pos=s.find(a)
              if pos<0: raise SystemExit('P0_ABORT RW_STATE anchor')
              pos+=len(a)
              block="""
// ============================================================
// P0 ERP SHELL — AUTHENTICATED TENANT CONTEXT
// ============================================================
var RW_ShellContext=(function(){
  var companyId=null,resolving=null;
  function resolve(callback){
    if(companyId){RW_STATE.app.companyId=companyId;if(callback)callback(true,companyId);return Promise.resolve(companyId);}
    if(resolving)return resolving.then(function(id){if(callback)callback(true,id);return id;});
    var u=RW_STATE.app.currentUser||{};
    if(!u.email){if(callback)callback(false,null);return Promise.resolve(null);}
    resolving=supabase.from('users').select('id,company_id,name,role,status').eq('email',u.email).eq('status','Active').maybeSingle().then(function(r){
      if(r.error||!r.data||!r.data.company_id)throw new Error('تعذر تحديد شركة المستخدم');
      companyId=r.data.company_id;RW_STATE.app.companyId=companyId;RW_STATE.app.userId=r.data.id||null;
      if(RW_STATE.app.currentUser){if(r.data.name)RW_STATE.app.currentUser.name=r.data.name;if(r.data.role)RW_STATE.app.currentUser.role=r.data.role;}
      return companyId;
    }).finally(function(){resolving=null;});
    return resolving.then(function(id){if(callback)callback(true,id);return id;}).catch(function(e){companyId=null;RW_STATE.app.companyId=null;if(callback)callback(false,null);throw e;});
  }
  function getCompanyId(){if(!companyId&&RW_STATE.app.companyId)companyId=RW_STATE.app.companyId;if(!companyId)throw new Error('TENANT_CONTEXT_UNAVAILABLE');return companyId;}
  function hasCompany(){return !!(companyId||(RW_STATE.app&&RW_STATE.app.companyId));}
  return{resolve:resolve,getCompanyId:getCompanyId,hasCompany:hasCompany};
})();
window.RW_ShellContext=RW_ShellContext;
"""
              s=s[:pos]+block+s[pos:]

          # ---------- Gate shell entry on tenant resolution ----------
          old="enterSystem: function() {\n    hideLoader();"
          if old in s and 'TENANT_CONTEXT_ERROR' not in s:
              new="enterSystem: function() {\n    var self=this;\n    if(!RW_ShellContext.hasCompany()){RW_ShellContext.resolve(function(ok){if(ok)self.enterSystem();else{hideLoader();showToast('تعذر تحديد سياق الشركة للمستخدم','error');}}).catch(function(e){console.error('TENANT_CONTEXT_ERROR',e);});return;}\n    hideLoader();"
              s=s.replace(old,new,1)

          # ---------- Known tenant-owned reads ----------
          pairs=[
            (".from('app_settings')\n            .select('*')\n            .limit(1", ".from('app_settings')\n            .select('*')\n            .eq('company_id',RW_ShellContext.getCompanyId())\n            .limit(1"),
            (".from('app_settings').select('*').limit(1).single()", ".from('app_settings').select('*').eq('company_id',RW_ShellContext.getCompanyId()).limit(1).single()"),
            (".from('app_settings').select('min_invoice_amount, delivery_fee, tax_rate').limit(1).single()", ".from('app_settings').select('min_invoice_amount, delivery_fee, tax_rate').eq('company_id',RW_ShellContext.getCompanyId()).limit(1).single()"),
            ("supabase.from('customers').select('*').then(function(res)", "supabase.from('customers').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(res)"),
            ("supabase.from('branches').select('*').then(function(res)", "supabase.from('branches').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(res)"),
            ("supabase.from('suppliers').select('*').then(function(r)", "supabase.from('suppliers').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(r)"),
            ("supabase.from('users').select('*')", "supabase.from('users').select('*').eq('company_id',RW_ShellContext.getCompanyId())"),
            ("supabase.from('orders').select('order_code, customer_id, total_amount, order_date, area')", "supabase.from('orders').select('order_code, customer_id, total_amount, order_date, area').eq('company_id',RW_ShellContext.getCompanyId())"),
            ("supabase.from('orders').select('total_amount')", "supabase.from('orders').select('total_amount').eq('company_id',RW_ShellContext.getCompanyId())"),
            ("supabase.from('purchase_orders').select('total_amount')", "supabase.from('purchase_orders').select('total_amount').eq('company_id',RW_ShellContext.getCompanyId())"),
            ("supabase.from('purchase_orders').select('*')", "supabase.from('purchase_orders').select('*').eq('company_id',RW_ShellContext.getCompanyId())")
          ]
          for a,b in pairs:s=s.replace(a,b)

          # ---------- Integrated Vehicle Master ----------
          if "view: 'vehicles', label: 'السيارات والمركبات'" not in s:
              a="{ view: 'vehicle-count', label: 'جرد سيارة' }, { view: 'branch-count', label: 'جرد فرع' },"
              if a not in s: raise SystemExit('P0_ABORT vehicle navigation anchor')
              s=s.replace(a,"{ view: 'vehicle-count', label: 'جرد سيارة' }, { view: 'vehicles', label: 'السيارات والمركبات', perm: 'vehicles.manage' }, { view: 'branch-count', label: 'جرد فرع' },",1)

          if 'var RW_Fleet=(function(){' not in s:
