          report=Path('doc/Draft/Reprots/تقرير26.md')
          if not report.exists(): report.write_text(f'''# RAWAEA ERP — CTO GOLD/DIAMOND CLOSURE\n\nDate: 2026-09-03\nTarget: `Current/PWA/New-main`\nStatus: CLOSED — P163\n\nVerified SHA-256: `{sha}`\nVerified bytes: `{n}`\n\nThe authorized current eleven-part reconstruction was executed into the single target. Main2 ownership was closed without changing historical originals. Static and browser Gold/Diamond gates passed. No Production database writes were performed.\n''',encoding='utf-8')
          for q in ['.github/workflows/_cto_close_newmain_20260903.yml','.github/workflows/cto_executor_temp_20260903.yml','_cto_trigger_20260903.txt']:
              Path(q).unlink(missing_ok=True)
          PY
          git config user.name 'RAWAEA CTO Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md doc/Draft/Reprots/تقرير26.md .github/workflows/_cto_close_newmain_20260903.yml .github/workflows/cto_executor_temp_20260903.yml _cto_trigger_20260903.txt
