          ref: main
          fetch-depth: 3
      - name: Reconstruct target from current eleven governed fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_final_main_reconstruction_20260831.py
      - name: Gold/Diamond source ownership gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,hashlib
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          required=['window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_OwnerLicense','var RW_Dashboard','var RW_Items','window.RW_Items=RW_Items;','RW_SUPABASE_CLIENT','MAIN3']
          miss=[x for x in required if x not in s]
          if miss: raise SystemExit('CURRENT_CONTRACT_MISSING:'+repr(miss))
          auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'; compat='/* RAWAEA MAIN2 COMPATIBILITY */'; ver="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"; gov='// MAIN2_GOVERNED_CLOSED:v1'
          gates={
            'auth_one':s.count(auth)==1,'compat_absent':compat not in s,'version_one':s.count(ver)==1,'governed_one':s.count(gov)==1,
            'dash_alias_absent':not re.search(r'window\.RW_Dashboard\s*=\s*\{\s*render\s*:\s*renderDashboard\s*\}',s),
            'items_alias_absent':not re.search(r'window\.RW_Items\s*=\s*\{\s*render\s*:\s*renderItems\s*\}',s),
            'dashboard_owner_one':len(re.findall(r'(?m)^\s*var\s+RW_Dashboard\s*=\s*',s))==1,
            'items_owner_one':len(re.findall(r'(?m)^\s*var\s+RW_Items\s*=\s*',s))==1,
            'items_export_one':s.count('window.RW_Items=RW_Items;')==1,
            'script_balance':s.lower().count('<script')==s.lower().count('</script>'),
            'style_balance':s.lower().count('<style')==s.lower().count('</style>'),
            'canonical_sw_one':s.count("navigator.serviceWorker.register('./sw.js',{scope:'./'})")==1,
            'actions_preserved':'actions' in s,'main1Delegation_preserved':'main1Delegation' in s
          }
          bad=[k for k,v in gates.items() if not v]
          if bad: raise SystemExit('GOLD_DIAMOND_SOURCE_FAIL:'+repr(bad))
          app=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I) if 'serviceWorker.register' not in m.group(1)]
          if len(app)!=1: raise SystemExit('INLINE_APPLICATION_RUNTIME_COUNT:'+str(len(app)))
          f=Path(tempfile.gettempdir())/'new-main.js'; f.write_text(app[0],encoding='utf-8')
          r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          print('GOLD_DIAMOND_SOURCE_PASS sha256='+hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Browser Gold/Diamond smoke on exact target
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-pwa && mkdir -p /tmp/rawaea-pwa
          cp -r Current/PWA/. /tmp/rawaea-pwa/
          cp Current/PWA/New-main /tmp/rawaea-pwa/New-main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-pwa >/tmp/rawaea-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.goto('http://127.0.0.1:8123/New-main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(2200);const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views;const flat=[];(function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);let denied=false;if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(x){denied=x.message==='OWNER_ONLY'}}return{ar:document.documentElement.lang==='ar',body:!!document.body,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,owner:!!window.RW_OwnerLicense,critical:flat.length>=30&&['dashboard','customers','items','orders','runsheets','purchases','receiving','picking','loading','delivery','return','unloading','transfer','reports','hr','crm','users','roles','license','settings','audit-log','notifications'].every(v=>flat.includes(v)),denied,count:flat.length,main2:window.RW_PWA_RECONSTRUCTION_VERSION||null};});console.log(JSON.stringify({r,e}));if(e.length||!r.ar||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.owner||!r.critical||!r.denied||r.main2!=='MAIN2-COMPLETE-SURGICAL-v1')process.exit(2);await b.close()})().catch(x=>{console.error(x);process.exit(2)});
          NODE
      - name: Persist verified target and state then remove executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          target=Path('Current/PWA/New-main').read_text(encoding='utf-8'); sha=hashlib.sha256(target.encode()).hexdigest(); n=len(target.encode())
          state=Path('CURRENT_STATE.md'); st=state.read_text(encoding='utf-8')
