'''
          candidate=s[:m.start('b')]+body+s[m.end('b'):]
          m2=[z for z in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',candidate,re.I) if not re.search(r'\bsrc\s*=',z.group('a') or '',re.I)]
          if len(m2)!=1: raise SystemExit('FINAL_RUNTIME_COUNT')
          js=Path(tempfile.gettempdir())/'target.js';js.write_text(m2[0].group('b'),encoding='utf-8')
          r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode:print(r.stderr);raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          required=['RW_GOLD_DIAMOND_PARITY','reports-dashboard','reports-detailed','reports-comprehensive','audit-log','transfer','direct-sale','direct-return','supplier-return','showFinanceTab','RW_POS','RW_Orders','RW_Runsheets','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles']
          for x in required:
              if x not in candidate:raise SystemExit('CONTRACT_MISSING:'+x)
          p.write_text(candidate,encoding='utf-8')
          subprocess.run(['git','config','user.name','rawaea-new-main-bot'],check=True);subprocess.run(['git','config','user.email','rawaea-new-main-bot@users.noreply.github.com'],check=True);subprocess.run(['git','add','Current/PWA/New-main'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','[new-main-target-persist] GOLD DIAMOND final parity closure'],check=True);subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY