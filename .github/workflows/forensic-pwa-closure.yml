name: Forensic PWA Closure
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  closure:
    if: github.event.head_commit.message != 'fix: execute parent pwa vehicle master integration' && github.event.head_commit.message != 'fix: forensic pwa closure automated commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Surgical Parent PWA Vehicle Integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('Current/PWA/main.html')
          s=main.read_text(encoding='utf-8')
          if "view: 'vehicles'" in s or 'var RW_Vehicles = ' in s:
              print('vehicle integration already present')
              raise SystemExit(0)
          nav="{ view: 'branches', label: 'المخازن والفروع' }"
          route="        if (view === 'branches') { RW_Branches.render(); return; }"
          title="            'branches':'المخازن والفروع','pos':'نقطة البيع'"
          for label,needle in [('nav',nav),('route',route),('title',title),('module',"var RW_Branches = (function() {")]:
              if s.count(needle)!=1: raise SystemExit(label+' anchor mismatch: '+str(s.count(needle)))
          s=s.replace(nav,nav+", { view: 'vehicles', icon: 'fa-car-side', label: 'السيارات والأسطول' }",1)
          s=s.replace(route,route+"\n        if (view === 'vehicles') { RW_Vehicles.render(); return; }",1)
          s=s.replace(title,"            'branches':'المخازن والفروع','vehicles':'السيارات والأسطول','pos':'نقطة البيع'",1)
          module="var RW_Vehicles=(function(){\nvar vs=[],ds=[];\nfunction e(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m]})}\nasync function ctx(){var a=await supabase.auth.getUser();if(a.error||!a.data.user)throw Error('جلسة غير صالحة');var u=await supabase.from('users').select('id,company_id,name,email,role,status').eq('auth_id',a.data.user.id).eq('status','Active').maybeSingle();if(u.error||!u.data||!u.data.company_id)throw Error('سياق الشركة غير محدد');return{u:a.data.user,c:u.data.company_id}}\nasync function load(){var x=await ctx();var v=await supabase.from('vehicles').select('id,vehicle_code,model,license_plate,driver_id,status,vehicle_type,operation_mode,ownership_type,mobile_stock_enabled,mobile_branch_id,created_at').eq('company_id',x.c).order('created_at',{ascending:false});if(v.error)throw Error(v.error.message);var d=await supabase.from('users').select('id,name,email,role,status').eq('company_id',x.c).eq('status','Active').order('name',{ascending:true});if(d.error)throw Error(d.error.message);vs=v.data||[];ds=d.data||[]}\nfunction dn(id){var d=ds.find(function(x){return x.id===id});return d?d.name+' — '+d.email:'غير مخصص'}\nfunction rr(q){q=String(q||'').trim().toLowerCase();var a=vs.filter(function(v){return !q||[v.vehicle_code,v.license_plate,v.model,v.vehicle_type,v.operation_mode,v.ownership_type,v.status,dn(v.driver_id)].join(' ').toLowerCase().indexOf(q)!==-1});return a.length?a.map(function(v){return'<tr class=\"border-b\"><td class=\"p-3 font-black text-blue-700\">'+e(v.vehicle_code)+'</td><td class=\"p-3 font-bold\">'+e(v.license_plate)+'</td><td class=\"p-3\">'+e(v.model||'—')+'</td><td class=\"p-3\">'+e(dn(v.driver_id))+'</td><td class=\"p-3 text-center\">'+e(v.vehicle_type||'—')+'</td><td class=\"p-3 text-center\">'+(v.mobile_stock_enabled?'✓':'—')+'</td><td class=\"p-3 text-center\">'+e(v.status||'—')+'</td></tr>'}).join(''):'<tr><td colspan=\"7\" class=\"p-8 text-center text-gray-400 font-bold\">لا توجد سيارات مطابقة</td></tr>'}\nfunction open(){var m=byId('rw-v-modal');if(!m){m=document.createElement('div');m.id='rw-v-modal';m.className='fixed inset-0 z-[1000] flex items-center justify-center p-4';m.style.background='rgba(15,23,42,.55)';document.body.appendChild(m)}m.innerHTML='<div class=\"bg-white rounded-3xl w-full max-w-3xl p-6 shadow-2xl\"><h3 class=\"text-2xl font-black mb-5\">إنشاء سيارة</h3><div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\"><input id=\"rv-code\" class=\"rw-input\" style=\"height:52px;padding:0 16px\" placeholder=\"كود السيارة *\"><input id=\"rv-plate\" class=\"rw-input\" style=\"height:52px;padding:0 16px\" placeholder=\"لوحة السيارة *\"><input id=\"rv-model\" class=\"rw-input\" style=\"height:52px;padding:0 16px\" placeholder=\"الموديل\"><select id=\"rv-driver\" class=\"rw-input\" style=\"height:52px;padding:0 16px\"><option value=\"\">بدون تخصيص الآن</option>'+ds.map(function(d){return'<option value=\"'+e(d.id)+'\">'+e(d.name+' — '+d.email)+'</option>'}).join('')+'</select><select id=\"rv-type\" class=\"rw-input\" style=\"height:52px;padding:0 16px\"><option>Delivery</option><option>Direct Sales</option><option>Transport</option><option>Mixed</option></select><select id=\"rv-mode\" class=\"rw-input\" style=\"height:52px;padding:0 16px\"><option>Mixed</option><option>Delivery</option><option>Direct Sales</option></select><select id=\"rv-owner\" class=\"rw-input\" style=\"height:52px;padding:0 16px\"><option>Owned</option><option>Leased</option><option>Rented</option><option>Other</option></select><input id=\"rv-year\" type=\"number\" class=\"rw-input\" style=\"height:52px;padding:0 16px\" placeholder=\"سنة الموديل\"></div><div class=\"flex justify-end gap-3 mt-6\"><button id=\"rv-cancel\" class=\"px-5 py-3 rounded-xl bg-gray-100 font-bold\">إلغاء</button><button id=\"rv-save\" class=\"px-6 py-3 rounded-xl bg-blue-600 text-white font-black\">إنشاء السيارة</button></div></div>';m.style.display='flex';byId('rv-cancel').onclick=function(){m.style.display='none'};byId('rv-save').onclick=save}\nasync function save(){var b=byId('rv-save');b.disabled=true;try{var x=await ctx(),p={p_company_id:x.c,p_vehicle_code:byId('rv-code').value.trim(),p_model:byId('rv-model').value.trim()||null,p_license_plate:byId('rv-plate').value.trim(),p_driver_id:byId('rv-driver').value||null,p_max_weight_kg:null,p_max_volume_m3:null,p_min_trip_value:null,p_status:'Active',p_notes:null,p_vehicle_type:byId('rv-type').value,p_operation_mode:byId('rv-mode').value,p_ownership_type:byId('rv-owner').value,p_model_year:byId('rv-year').value?parseInt(byId('rv-year').value,10):null,p_vin:null,p_fuel_type:null,p_refrigerated:false,p_mobile_stock_enabled:true,p_created_by:x.u.email};if(!p.p_vehicle_code||!p.p_license_plate)throw Error('كود السيارة ولوحة السيارة مطلوبان');var r=await supabase.rpc('create_vehicle_atomic',p);if(r.error)throw Error(r.error.message);byId('rw-v-modal').style.display='none';showToast('تم إنشاء السيارة وربطها بالبنية التشغيلية','success');await render()}catch(z){showToast(z.message||'تعذر إنشاء السيارة','error')}finally{b.disabled=false}}\nasync function render(){var c=byId('rw-page-container');if(!c)return;safeText(byId('rw-header-title'),'السيارات والأسطول');try{await load()}catch(z){safeHTML(c,'<div class=\"p-8 text-center text-red-600 font-bold\">'+e(z.message)+'</div>');return}safeHTML(c,'<div class=\"space-y-6\"><div class=\"bg-white rounded-3xl p-6 shadow-sm border flex items-center justify-between\"><div><div class=\"text-2xl font-black\">السيارات والأسطول</div><div class=\"text-sm text-gray-500 mt-1\">Vehicle Master داخل التطبيق الرئيسي.</div></div><button id=\"rw-v-add\" class=\"px-6 py-3 rounded-xl bg-blue-600 text-white font-black\">+ إنشاء سيارة</button></div><div class=\"bg-white rounded-3xl p-5 shadow-sm border\"><input id=\"rw-v-search\" class=\"rw-input\" style=\"height:54px;padding:0 16px\" placeholder=\"بحث ذكي: الكود، اللوحة، الموديل، المندوب، النوع، الحالة...\"></div><div class=\"bg-white rounded-3xl overflow-hidden shadow-sm border\"><div class=\"overflow-x-auto\"><table class=\"w-full text-sm\"><thead class=\"bg-slate-50\"><tr><th class=\"p-3 text-right\">الكود</th><th class=\"p-3 text-right\">اللوحة</th><th class=\"p-3 text-right\">الموديل</th><th class=\"p-3 text-right\">السائق/المندوب</th><th class=\"p-3\">النوع</th><th class=\"p-3\">المخزون</th><th class=\"p-3\">الحالة</th></tr></thead><tbody id=\"rw-v-rows\">'+rr('')+'</tbody></table></div></div></div>');byId('rw-v-add').onclick=open;byId('rw-v-search').oninput=function(){byId('rw-v-rows').innerHTML=rr(this.value)}}return{render:render}})();window.RW_Vehicles=RW_Vehicles;"
          marker="var RW_Branches = (function() {"
          s=s.replace(marker,module+"\n"+marker,1)
          main.write_text(s,encoding='utf-8')
          PY
          grep -F "view: 'vehicles'" Current/PWA/main.html
          grep -F "if (view === 'vehicles')" Current/PWA/main.html
          grep -F "var RW_Vehicles=(function()" Current/PWA/main.html
      - name: Commit vehicle integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-forensic-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/main.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: execute parent pwa vehicle master integration'
          git push origin HEAD:main
