N.menuTree=tree;N._handleAction=function(a,arg){if(a==='showFinanceTab')return finance(arg);throw new Error('UNKNOWN_NAV_ACTION:'+a)};N.buildSidebar=function(){var root=document.getElementById('rw-sidebar-nav');if(!root)return;function rec(items){var h='';(items||[]).forEach(function(x){if(x.action){if(!can('finance'))return;h+='<button class="rw-sidebar-link" data-action="'+esc(x.action)+'" data-arg="'+esc(x.arg||'')+'"><span class="rw-sidebar-link-icon"><i class="fa-solid '+esc(x.icon||'fa-coins')+'"></i></span><span>'+esc(x.label)+'</span></button>';return}if(x.submenu){var c=(x.submenu||[]).filter(function(y){return y.submenu||can(y.view)});if(!c.length)return;h+='<div class="rw-sidebar-link" data-folder="1"><span class="rw-sidebar-link-icon"><i class="fa-solid '+esc(x.icon||'fa-folder')+'"></i></span><span>'+esc(x.label)+'</span></div><div class="rw-sidebar-submenu">'+rec(c)+'</div>';return}if(x.view&&can(x.view))h+='<button class="rw-sidebar-link" data-view="'+esc(x.view)+'"><span class="rw-sidebar-link-icon"><i class="fa-solid '+esc(x.icon||'fa-circle')+'"></i></span><span>'+esc(x.label)+'</span></button>'});return h}safeHTML(root,rec(tree));root.querySelectorAll('[data-folder]').forEach(function(b){b.onclick=function(){var x=b.nextElementSibling;if(x)x.style.display=x.style.display==='none'?'block':''}});root.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){N.navigate(b.getAttribute('data-view'))}});root.querySelectorAll('[data-action]').forEach(function(b){b.onclick=function(){N._handleAction(b.getAttribute('data-action'),b.getAttribute('data-arg'))}})};
N.navigate=async function(v){S.app.currentView=v;if(!can(v))return Promise.reject(new Error(v==='license'||v==='audit'||v==='audit-log'?'OWNER_ONLY':'PERMISSION_DENIED'));if(v==='audit'||v==='audit-log')return Promise.resolve(window.RW_Audit_renderTab());if(v==='transfer')return Promise.resolve(voucher('Transfer'));if(v==='direct-sale')return Promise.resolve(voucher('DirectSale'));if(v==='direct-return')return Promise.resolve(voucher('DirectReturn'));if(v==='supplier-return')return Promise.resolve(voucher('SupplierReturn'));if(v==='finance')return Promise.resolve(finance('treasury'));var h=R[v];if(h&&h[0]&&typeof h[0][h[1]]==='function')return Promise.resolve(h[0][h[1]]());throw new Error('ROUTE_HANDLER_MISSING:'+v)};
window.RW_GOLD_DIAMOND_PARITY={version:'v2',navigation:'complete',actions:'complete',reports:'complete',vouchers:'complete',owner:'strict',session:'fail-closed'};
