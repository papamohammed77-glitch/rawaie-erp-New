              fleet="""
// ============================================================
// RW_Fleet — integrated Vehicle Master
// Mutation contract: create_vehicle_atomic only.
// ============================================================
var RW_Fleet=(function(){
  var rows=[],drivers=[];
  function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[m];});}
  function cid(){return RW_ShellContext.getCompanyId();}
  async function load(){
    var vr=await supabase.from('vehicles').select('id,vehicle_code,model,license_plate,driver_id,status,vehicle_type,operation_mode,ownership_type,max_weight_kg,max_volume_m3,min_trip_value,refrigerated,mobile_stock_enabled,mobile_branch_id').eq('company_id',cid()).order('vehicle_code',{ascending:true});
    if(vr.error)throw vr.error;rows=vr.data||[];
    var dr=await supabase.from('users').select('id,name,email,role,status').eq('company_id',cid()).eq('status','Active').in('role',['driver','سائق','مندوب']).order('name',{ascending:true});
    if(dr.error)throw dr.error;drivers=dr.data||[];
  }
  function render(){
    var c=byId('rw-page-container');if(!c)return;
    safeText(byId('rw-header-title'),'السيارات والمركبات');
    safeText(byId('rw-header-subtitle'),'Vehicle Master • مندوب • سيارة • Mobile Branch • Van Stock');
    safeHTML(c,'<div class="space-y-5"><div class="rw-card"><div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-xl font-black">Vehicle Master</h2><p class="text-sm text-gray-500 mt-1">إدارة الأسطول داخل الـERP Shell وبالعقد الخلفي المعتمد.</p></div><button class="rw-btn-primary" onclick="RW_Fleet.openCreate()">إضافة سيارة</button></div></div><div class="rw-card p-0 overflow-hidden"><div class="p-4 border-b flex gap-3 items-center flex-wrap"><input id="fleet-search" class="rw-input" style="height:46px;max-width:440px;padding-right:18px" placeholder="بحث ذكي: الكود، اللوحة، الموديل، المندوب..." oninput="RW_Fleet.filter(this.value)"><span id="fleet-count" class="rw-status success">0 مركبة</span></div><div id="fleet-table"></div></div></div>');
    load().then(function(){filter('');}).catch(function(e){safeHTML(byId('fleet-table'),'<div class="p-10 text-center text-red-500">تعذر تحميل السيارات: '+esc(e.message)+'</div>');});
  }
  function filter(term){
    term=String(term||'').toLowerCase().trim();var data=rows.filter(function(v){var d=null;for(var i=0;i<drivers.length;i++)if(drivers[i].id===v.driver_id){d=drivers[i];break;}return !term||[v.vehicle_code,v.license_plate,v.model,v.status,v.vehicle_type,v.operation_mode,d&&d.name,d&&d.email].join(' ').toLowerCase().indexOf(term)!==-1;});
    var w=byId('fleet-table');if(!w)return;var cnt=byId('fleet-count');if(cnt)cnt.textContent=data.length+' مركبة';if(!data.length){safeHTML(w,'<div class="p-10 text-center text-gray-400">لا توجد سيارات.</div>');return;}
    var h='<table class="rw-table"><thead><tr><th>الكود</th><th>اللوحة</th><th>الموديل</th><th>المندوب</th><th>النمط</th><th>الحالة</th><th>Mobile Stock</th></tr></thead><tbody>';data.forEach(function(v){var d=null;for(var i=0;i<drivers.length;i++)if(drivers[i].id===v.driver_id){d=drivers[i];break;}h+='<tr><td>'+esc(v.vehicle_code)+'</td><td>'+esc(v.license_plate)+'</td><td>'+esc(v.model||'-')+'</td><td>'+esc(d?d.name:'غير معين')+'</td><td>'+esc(v.operation_mode||'-')+'</td><td>'+esc(v.status||'-')+'</td><td>'+(v.mobile_stock_enabled?'مفعل':'غير مفعل')+'</td></tr>';});h+='</tbody></table>';safeHTML(w,h);
  }
  async function searchDriverUI(term){term=String(term||'').trim();var q=supabase.from('users').select('id,name,email,role,status').eq('company_id',cid()).eq('status','Active').in('role',['driver','سائق','مندوب']).limit(20);if(term)q=q.or('name.ilike.%'+term+'%,email.ilike.%'+term+'%');var r=await q;var w=byId('vf-driver-results');if(!w)return;var h='';(r.data||[]).forEach(function(d){h+='<button type="button" class="block w-full text-right p-3 border-b bg-white" onclick="RW_Fleet.pickDriver(\\''+d.id+'\\',\\''+esc(d.name)+'\\',\\''+esc(d.email)+'\\')">'+esc(d.name)+' <span class="text-gray-500">'+esc(d.email)+'</span></button>';});safeHTML(w,h||'<div class="p-3 text-gray-400">لا يوجد مندوب مطابق.</div>');}
  function pickDriver(id,name,email){var h=byId('vf-driver-id'),i=byId('vf-driver-search');if(h)h.value=id;if(i)i.value=name+' ('+email+')';safeHTML(byId('vf-driver-results'),'');}
  function openCreate(){var html='<div dir="rtl" class="text-right"><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><input id="vf-code" class="rw-input" placeholder="كود السيارة *"><input id="vf-plate" class="rw-input" placeholder="رقم اللوحة *"><input id="vf-model" class="rw-input" placeholder="الموديل"><input id="vf-driver-search" class="rw-input" placeholder="بحث ذكي بالاسم أو البريد" oninput="RW_Fleet.searchDriverUI(this.value)"><input id="vf-driver-id" type="hidden"><input id="vf-year" type="number" class="rw-input" placeholder="سنة الموديل"><input id="vf-vin" class="rw-input" placeholder="VIN"><input id="vf-fuel" class="rw-input" placeholder="نوع الوقود"><input id="vf-weight" type="number" step="0.01" class="rw-input" placeholder="أقصى وزن kg"><input id="vf-volume" type="number" step="0.01" class="rw-input" placeholder="أقصى حجم m³"><input id="vf-mintrip" type="number" step="0.01" class="rw-input" placeholder="الحد الأدنى لقيمة الرحلة"><select id="vf-type" class="rw-input"><option value="Delivery">Delivery</option><option value="Sales">Sales</option><option value="Mixed" selected>Mixed</option></select><select id="vf-mode" class="rw-input"><option value="Mixed" selected>Mixed</option><option value="DirectSales">Direct Sales</option><option value="Delivery">Delivery</option></select><select id="vf-own" class="rw-input"><option value="Owned" selected>Owned</option><option value="Leased">Leased</option><option value="Rented">Rented</option></select><select id="vf-status" class="rw-input"><option value="Active" selected>Active</option><option value="Inactive">Inactive</option><option value="Maintenance">Maintenance</option></select><label class="flex items-center gap-2 md:col-span-2"><input id="vf-refrigerated" type="checkbox"> <span>مركبة مبردة</span></label><label class="flex items-center gap-2 md:col-span-2"><input id="vf-mobile-stock" type="checkbox" checked> <span>تفعيل Mobile Stock / Van Branch</span></label><textarea id="vf-notes" class="rw-input md:col-span-2" style="height:90px;padding:12px 18px" placeholder="ملاحظات"></textarea><div id="vf-driver-results" class="md:col-span-2 border rounded-xl max-h-40 overflow-auto"></div></div></div>';Swal.fire({title:'إضافة سيارة',html:html,width:820,showCancelButton:true,confirmButtonText:'إنشاء السيارة',cancelButtonText:'إلغاء',preConfirm:function(){return create();}});searchDriverUI('');}
  async function create(){var code=String((byId('vf-code')||{}).value||'').trim(),plate=String((byId('vf-plate')||{}).value||'').trim();if(!code||!plate){Swal.showValidationMessage('كود السيارة ورقم اللوحة مطلوبان');return false;}var u=RW_STATE.app.currentUser||{};var r=await supabase.rpc('create_vehicle_atomic',{p_company_id:cid(),p_vehicle_code:code,p_model:(byId('vf-model')||{}).value||null,p_license_plate:plate,p_driver_id:(byId('vf-driver-id')||{}).value||null,p_max_weight_kg:Number((byId('vf-weight')||{}).value)||null,p_max_volume_m3:Number((byId('vf-volume')||{}).value)||null,p_min_trip_value:Number((byId('vf-mintrip')||{}).value)||null,p_status:(byId('vf-status')||{}).value||'Active',p_notes:(byId('vf-notes')||{}).value||null,p_vehicle_type:(byId('vf-type')||{}).value||'Delivery',p_operation_mode:(byId('vf-mode')||{}).value||'Mixed',p_ownership_type:(byId('vf-own')||{}).value||'Owned',p_model_year:Number((byId('vf-year')||{}).value)||null,p_vin:(byId('vf-vin')||{}).value||null,p_fuel_type:(byId('vf-fuel')||{}).value||null,p_refrigerated:!!(byId('vf-refrigerated')||{}).checked,p_mobile_stock_enabled:!!(byId('vf-mobile-stock')||{}).checked,p_created_by:u.email||null});if(r.error){Swal.showValidationMessage(r.error.message);return false;}if(!r.data||!r.data.success){Swal.showValidationMessage((r.data&&r.data.error)||'فشل إنشاء السيارة');return false;}return r.data;}
  return{render:render,filter:filter,openCreate:openCreate,searchDriverUI:searchDriverUI,pickDriver:pickDriver};
})();
window.RW_Fleet=RW_Fleet;
"""
