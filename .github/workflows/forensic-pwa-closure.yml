name: Forensic PWA Closure
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  closure:
    if: github.event.head_commit.message != 'fix: execute parent pwa vehicle master integration' && github.event.head_commit.message != 'fix: forensic pwa closure automated commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Integrate Vehicle Master into Parent PWA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          main=Path('Current/PWA/main.html')
          s=main.read_text(encoding='utf-8')
          if "view: 'vehicles'" in s or 'var RW_Vehicles = ' in s:
              print('vehicle integration already present; nothing to do')
              raise SystemExit(0)
          nav_anchor="{ view: 'branches', label: 'المخازن والفروع' }"
          if s.count(nav_anchor)!=1: raise SystemExit(f'navigation anchor mismatch: {s.count(nav_anchor)}')
          s=s.replace(nav_anchor, nav_anchor+", { view: 'vehicles', icon: 'fa-car-side', label: 'السيارات والأسطول' }",1)
          route_anchor="        if (view === 'branches') { RW_Branches.render(); return; }"
          if s.count(route_anchor)!=1: raise SystemExit(f'route anchor mismatch: {s.count(route_anchor)}')
          s=s.replace(route_anchor, route_anchor+"\n        if (view === 'vehicles') { RW_Vehicles.render(); return; }",1)
          title_anchor="            'branches':'المخازن والفروع','pos':'نقطة البيع'"
          if s.count(title_anchor)!=1: raise SystemExit(f'title anchor mismatch: {s.count(title_anchor)}')
          s=s.replace(title_anchor, "            'branches':'المخازن والفروع','vehicles':'السيارات والأسطول','pos':'نقطة البيع'",1)
          module=base64.b64decode('''' + ''').decode('utf-8')
          marker="var RW_Branches = (function() {"
          if s.count(marker)!=1: raise SystemExit(f'module anchor mismatch: {s.count(marker)}')
          s=s.replace(marker,module+"\n"+marker,1)
          main.write_text(s,encoding='utf-8')
          print('vehicle integration applied')
          PY
          grep -F "view: 'vehicles'" Current/PWA/main.html
          grep -F "if (view === 'vehicles')" Current/PWA/main.html
          grep -F "var RW_Vehicles = (function ()" Current/PWA/main.html
      - name: Commit vehicle integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-forensic-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/main.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: execute parent pwa vehicle master integration'
          git push origin HEAD:main
