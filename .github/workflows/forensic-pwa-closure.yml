name: RAWAEA TEMP GOLD DIAMOND TARGET EXECUTOR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard trigger
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          case "$COMMIT_MESSAGE" in
            "[new-main-target-persist]"*) ;;
            "[p135-trigger]"*) ;;
            *) echo "NON_TARGET_TRIGGER_SKIP"; exit 0;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Execute verified P135 repair and final parity on published target only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')

          # P135-01: fix the verified false Supabase availability guard.
          old_guard="if (!window.supabase || !window.supabase.auth) {"
          new_guard="if (typeof supabase === 'undefined' || !supabase || !supabase.auth) {"
          if old_guard in s:
              s=s.replace(old_guard,new_guard,1)
          elif new_guard not in s:
              raise SystemExit('P135_EXPECTED_GUARD_NOT_FOUND')

          # P135-02: deterministic runtime identity; contains no secret.
          marker="window.__RAWAEA_P135_RUNTIME_BUILD__ = 'P135-2026-09-01';"
          needle="            console.log('RAWAEA ERP BOOTING...');"
          if marker not in s:
              if needle not in s:
                  raise SystemExit('P135_BOOT_MARKER_ANCHOR_NOT_FOUND')
              s=s.replace(needle,needle+"\n            "+marker+"\n            console.log('RAWAEA_P135_TARGET', 'New-main');",1)

          m=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(m)!=1: raise SystemExit('P135_INLINE_RUNTIME_COUNT')
          js=Path(tempfile.gettempdir())/'target.js';js.write_text(m[0].group('b'),encoding='utf-8')
          r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr);raise SystemExit('P135_TARGET_JS_SYNTAX_FAIL')
          p.write_text(s,encoding='utf-8')

          # P135-03: invalidate the old static cache namespace without changing SW routing.
          sw=Path('Current/PWA/sw.js'); sws=sw.read_text(encoding='utf-8')
          old_cache="var STATIC_CACHE = 'rw-static-v2';"; new_cache="var STATIC_CACHE = 'rw-static-p135-v1';"
          if old_cache in sws: sw.write_text(sws.replace(old_cache,new_cache,1),encoding='utf-8')

          # Existing final parity closure logic is retained below.
          ptxt=p.read_text(encoding='utf-8')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',ptxt,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
          m=ms[0]; body=m.group('b')
          if 'RAWAEA GOLD DIAMOND SESSION FAIL-CLOSED v1' not in body:
              body += r'''\n/* RAWAEA GOLD DIAMOND SESSION FAIL-CLOSED v1 */\n(function(){'use strict';var A=window.RW_Auth,S=window.RW_STATE;if(!A||!S||typeof A.enterSystem!=='function'||A.__rawaeaFailClosed)return;var base=A.enterSystem;A.enterSystem=async function(user){try{return await base.call(this,user)}catch(e){try{S.app.initialized=false;S.app.authenticated=false;S.app.currentUser=null;S.app.companyId=null;S.app.ownerProfile=null;S.app.licenseState='unknown';S.permissions=[]}catch(x){}try{if(typeof this.forceEnterFallback==='function')this.forceEnterFallback()}catch(x){}throw e}};A.__rawaeaFailClosed=true})();\n'''
          if 'RAWAEA GOLD DIAMOND NAVIGATION PARITY v2' not in body:
              body += r'''\n/* RAWAEA GOLD DIAMOND NAVIGATION PARITY v2 */\n(function(){'use strict';var N=window.RW_Navigation,S=window.RW_STATE;if(!N||!S)throw new Error('NAVIGATION_PARITY_PREREQUISITE_MISSING');function owner(){return !!(S.app&&S.app.currentUser&&S.app.currentUser.isOwner===true)}function can(v){var o={license:true,'audit-log':true,audit:true};if(o[v])return owner();var p={users:'users:view',roles:'roles:view',settings:'settings:view',hr:'users:view',crm:'customers:view',notifications:'notifications:view'}[v];if(!p)return true;try{return typeof window.RW_Permissions_check==='function'&&window.RW_Permissions_check(p)===true}catch(e){return false}}function esc(v){return String(v==null?'':v).replace(/[&<>\\"']/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[x]})}\nvar tree=[{view:'dashboard',icon:'fa-chart-pie',label:'لوحة التحكم'},{icon:'fa-chart-line',label:'إدارة المبيعات',submenu:[{view:'telesales',label:'التلي سيلز'},{view:'customers',label:'العملاء'},{view:'online-store',label:'المتجر الإلكتروني'},{view:'pos',label:'نقطة البيع'},{view:'orders',label:'أوردرات المبيعات'},{view:'runsheets',label:'الرانشيتات'}]},{icon:'fa-truck',label:'إدارة المشتريات',submenu:[{view:'suppliers',label:'الموردين'},{view:'purchase-pos',label:'نقطة شراء'},{view:'purchases',label:'أوردرات الشراء'}]},{icon:'fa-warehouse',label:'إدارة المخازن والمخزون',submenu:[{view:'items',label:'الأصناف'},{view:'branches',label:'المخازن والفروع'},{icon:'fa-timeline',label:'العمليات المخزنية',submenu:[{view:'receiving',label:'الاستلام'},{view:'picking',label:'التحضير'},{view:'loading',label:'التحميل'},{view:'delivery',label:'التوصيل'},{view:'return',label:'المرتجعات'},{view:'unloading',label:'التفريغ'}]},{icon:'fa-file-signature',label:'الأذونات المخزنية',submenu:[{view:'transfer',label:'تحويل مخزني'},{view:'direct-sale',label:'صرف سيارة بيع مباشر'},{view:'direct-return',label:'استلام مرتجع سيارة'},{view:'supplier-return',label:'مرتجع لمورد'},{view:'vouchers',label:'عرض الأذونات'}]},{icon:'fa-clipboard-check',label:'الجرد',submenu:[{view:'vehicle-count',label:'جرد سيارة'},{view:'branch-count',label:'جرد فرع'},{view:'general-count',label:'جرد عام'}]}]},{icon:'fa-coins',label:'إدارة الحسابات والمالية',submenu:[{action:'showFinanceTab',arg:'treasury',label:'الخزائن والبنوك'},{action:'showFinanceTab',arg:'accounts',label:'دليل الحسابات'},{action:'showFinanceTab',arg:'journal',label:'قيود يومية'},{action:'showFinanceTab',arg:'receipts',label:'سندات القبض'},{action:'showFinanceTab',arg:'payments',label:'سندات الصرف'},{action:'showFinanceTab',arg:'transfers',label:'التحويلات'},{action:'showFinanceTab',arg:'reports',label:'التقارير المالية'},{view:'settlement',label:'إغلاق اليومية'}]},{icon:'fa-chart-simple',label:'التقارير الذكية',submenu:[{view:'reports-dashboard',label:'لوحة القيادة'},{view:'reports-detailed',label:'التقارير التفصيلية'},{view:'reports-comprehensive',label:'التقارير الشاملة'}]},{view:'hr',icon:'fa-id-card',label:'الموارد البشرية'},{view:'crm',icon:'fa-handshake',label:'إدارة علاقات العملاء (CRM)'},{view:'users',icon:'fa-users-gear',label:'المستخدمين والصلاحيات'},{view:'roles',icon:'fa-user-shield',label:'إدارة أدوار المستخدمين'},{view:'license',icon:'fa-shield-halved',label:'إدارة الترخيص'},{view:'settings',icon:'fa-gear',label:'إعدادات النظام'},{view:'audit-log',icon:'fa-clipboard-list',label:'سجل التدقيق'},{view:'notifications',icon:'fa-bell',label:'الإشعارات'}];\nfunction voucher(t){if(!window.RW_Warehouse||typeof window.RW_Warehouse.loadVoucherForm!=='function')throw new Error('VOUCHER_HANDLER_MISSING');return window.RW_Warehouse.loadVoucherForm(t)}function finance(t){if(!window.RW_Finance||typeof window.RW_Finance.renderSubTab!=='function')throw new Error('FINANCE_SUBTAB_HANDLER_MISSING');return window.RW_Finance.renderSubTab(t||'treasury')}\nvar R={dashboard:[window.RW_Dashboard,'render'],items:[window.RW_Items,'render'],customers:[window.RW_Customers,'render'],suppliers:[window.RW_Suppliers,'render'],branches:[window.RW_Branches,'render'],settings:[window.RW_Settings,'render'],hr:[window.RW_HR,'render'],crm:[window.RW_CRM,'render'],users:[window.RW_Users,'render'],roles:[window.RW_Roles,'render'],license:[window.RW_OwnerLicense,'render'],telesales:[window.RW_TeleSales,'render'],pos:[window.RW_POS,'render'],orders:[window.RW_Orders,'render'],runsheets:[window.RW_Runsheets,'render'],online-store:[window.RW_OnlineStore,'render'],purchases:[window.RW_Purchases,'renderOrders'],'purchase-pos':[window.RW_Purchases,'renderPOS'],picking:[window.RW_Warehouse,'loadPicking'],loading:[window.RW_Warehouse,'loadLoading'],delivery:[window.RW_Warehouse,'loadDelivery'],return:[window.RW_Warehouse,'loadReturn'],returns:[window.RW_Warehouse,'loadReturn'],unloading:[window.RW_Warehouse,'loadUnloading'],receiving:[window.RW_Warehouse,'loadReceiving'],vouchers:[window.RW_Warehouse,'loadVouchers'],'vehicle-count':[window.RW_Warehouse,'loadVehicleCount'],'branch-count':[window.RW_Warehouse,'loadBranchCount'],'general-count':[window.RW_Warehouse,'loadGeneralCount'],settlement:[window.RW_Warehouse,'loadSettlement'],finance:[window.RW_Finance,'render'],reports:[window.RW_Reports,'render'],'reports-dashboard':[window.RW_Reports,'renderDashboard'],'reports-detailed':[window.RW_Reports,'renderDetailedReports'],'reports-comprehensive':[window.RW_Reports_Comprehensive,'render'],notifications:[window.RW_Notification,'showPanel']};\nN.menuTree=tree;N._handleAction=function(a,arg){if(a==='showFinanceTab')return finance(arg);throw new Error('UNKNOWN_NAV_ACTION:'+a)};N.buildSidebar=function(){var root=document.getElementById('rw-sidebar-nav');if(!root)return;function rec(items){var h='';(items||[]).forEach(function(x){if(x.action){if(!can('finance'))return;h+='<button class="rw-sidebar-link" data-action="'+esc(x.action)+'" data-arg="'+esc(x.arg||'')+'"><span class="rw-sidebar-link-icon"><i class="fa-solid '+esc(x.icon||'fa-coins')+'"></i></span><span>'+esc(x.label)+'</span></button>';return}if(x.submenu){var c=(x.submenu||[]).filter(function(y){return y.submenu||can(y.view)});if(!c.length)return;h+='<div class="rw-sidebar-link" data-folder="1"><span class="rw-sidebar-link-icon"><i class="fa-solid '+esc(x.icon||'fa-folder')+'"></i></span><span>'+esc(x.label)+'</span></div><div class="rw-sidebar-submenu">'+rec(c)+'</div>';return}if(x.view&&can(x.view))h+='<button class="rw-sidebar-link" data-view="'+esc(x.view)+'"><span class="rw-sidebar-link-icon"><i class="fa-solid '+esc(x.icon||'fa-circle')+'"></i></span><span>'+esc(x.label)+'</span></button>'});return h}safeHTML(root,rec(tree));root.querySelectorAll('[data-folder]').forEach(function(b){b.onclick=function(){var x=b.nextElementSibling;if(x)x.style.display=x.style.display==='none'?'block':''}});root.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){N.navigate(b.getAttribute('data-view'))}})};\nN.navigate=async function(v){S.app.currentView=v;if(!can(v))return Promise.reject(new Error(v==='license'||v==='audit'||v==='audit-log'?'OWNER_ONLY':'PERMISSION_DENIED'));if(v==='audit'||v==='audit-log')return Promise.resolve(window.RW_Audit_renderTab());if(v==='transfer')return Promise.resolve(voucher('Transfer'));if(v==='direct-sale')return Promise.resolve(voucher('DirectSale'));if(v==='direct-return')return Promise.resolve(voucher('DirectReturn'));if(v==='supplier-return')return Promise.resolve(voucher('SupplierReturn'));if(v==='finance')return Promise.resolve(finance('treasury'));var h=R[v];if(h&&h[0]&&typeof h[0][h[1]]==='function')return Promise.resolve(h[0][h[1]]());throw new Error('ROUTE_HANDLER_MISSING:'+v)};\nwindow.RW_GOLD_DIAMOND_PARITY={version:'v2',navigation:'complete',actions:'complete',reports:'complete',vouchers:'complete',owner:'strict',session:'fail-closed'};\n})();\n'''
          candidate=ptxt[:m.start('b')]+body+ptxt[m.end('b'):]
          m2=[z for z in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',candidate,re.I) if not re.search(r'\bsrc\s*=',z.group('a') or '',re.I)]
          if len(m2)!=1: raise SystemExit('FINAL_RUNTIME_COUNT')
          js=Path(tempfile.gettempdir())/'final.js';js.write_text(m2[0].group('b'),encoding='utf-8')
          r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr);raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          p.write_text(candidate,encoding='utf-8')

          report=Path('doc/Draft/Reprots/تقرير2.md')
          report.write_text('''# تقرير2 — P135 Forensic Runtime Repair\n\n## 1. نقطة الانطلاق\nتمت هذه الجولة وفق `MASTER - RAWAEA ERP.md` وبقاعدة: الواقع الحالي ثم Git ثم Production ثم التاريخ. لم يتم حذف التقرير السابق `تقرير1`.\n\n## 2. الأدلة المباشرة\n- `CURRENT_STATE.md` كان يسجل P133/P134: `401 Invalid API key` في runtime المنشور و`404` لـ`/companies/sw.js`، مع بقاء هوية artifact المنشور غير مثبتة.\n- Supabase project `fiilmooggumokxanwiyx` صحي ومفتاحه الحالي نشط. سجلات Auth تثبت runtime ناجحاً على `workers.dev` مقابل طلبات 401 من runtime آخر؛ لذلك لا يوجد دليل على عطل Auth عام.\n- `Current/PWA/New-main` يحتوي عنوان Supabase الصحيح والعميل المحلي `supabase` المنشأ من مكتبة UMD.\n- `Current/PWA/main/main11.md` و`New-main` كانا يستخدمان guard خاطئاً يفحص `window.supabase.auth` بدلاً من العميل المحلي `supabase.auth`. لذلك `MAIN11_SUPABASE_UNAVAILABLE` تشخيص زائف.\n- `RW_Auth.login` يعتمد صراحة على `supabase.auth.signInWithPassword(...)`.\n- `Current/PWA/sw.js` موجود في Git، لذلك 404 المنشور لا يثبت غياب الملف من المصدر؛ بل يدل على اختلاف artifact أو root/routing في النشر.\n\n## 3. الاستنتاج الجنائي\nالـ401 لا يمكن نسبته إلى تغيير مفتاح Supabase في المصدر الحالي؛ المفتاح الحالي فعال مباشرة في Production. التصنيف الصحيح هو deployment/artifact drift حتى يثبت browser runtime أنه يحمل نفس artifact. أما `MAIN11_SUPABASE_UNAVAILABLE` فله root cause برمجي مستقل ومؤكد: guard خاطئ.\n\n## 4. التعديل الجراحي المنفذ عبر executor\nتم استبدال السطر:\n\n```js\nif (!window.supabase || !window.supabase.auth) {\n```\n\nبـ:\n\n```js\nif (typeof supabase === 'undefined' || !supabase || !supabase.auth) {\n```\n\nوأضيف marker آمن بلا secrets: `__RAWAEA_P135_RUNTIME_BUILD__ = 'P135-2026-09-01'` و`RAWAEA_P135_TARGET`.\n\nتم رفع namespace الخاص بالـstatic cache في `sw.js` إلى `rw-static-p135-v1` فقط؛ لم يتم اختراع مسار SW جديد. كما تم الاحتفاظ بمنطق GOLD/DIAMOND السابق.\n\n## 5. الأخطاء السابقة\n- اعتبار `MAIN11_SUPABASE_UNAVAILABLE` سبب 401 كان خطأ في تشخيص object boundary.\n- افتراض تدوير المفتاح لم يكن مدعوماً بالدليل.\n- الخلط بين `Current/PWA/main.html` القديم والـtarget `Current/PWA/New-main` أدى إلى lineage غير محسوم.\n- إضافة ملفات SW تخمينية قبل إثبات deployment root كانت ستكون معالجة عمياء.\n\n## 6. التحقق المطلوب بعد التنفيذ\n- يجب أن يظهر `RAWAEA_P135_TARGET` في Console للنسخة المنشورة.\n- يجب أن تختفي `MAIN11_SUPABASE_UNAVAILABLE`.\n- يعاد اختبار login.\n- إذا ظهر marker وبقي 401، يصبح العطل محصوراً داخل config/runtime نفسه ونفحص request headers/client construction.\n- بعد إثبات artifact فقط، إذا بقي `/companies/sw.js` = 404، يكون التحقيق التالي Cloudflare root/routing.\n\n## 7. حالة الإغلاق\nتم إصلاح defect البرمجي المؤكد وإضافة بصمة artifact، لكن لا يجوز إعلان إغلاق 401 نهائياً قبل إثبات ظهور marker في النسخة المنشورة ونجاح تسجيل الدخول.\n''',encoding='utf-8')

          state=Path('CURRENT_STATE.md')
          text=state.read_text(encoding='utf-8')
          block='''\n\n---\n\n### P135 — FORENSIC RUNTIME REPAIR\n- Direct target: `Current/PWA/New-main`.\n- Supabase source configuration verified current/active; no key rotation performed.\n- `MAIN11_SUPABASE_UNAVAILABLE` root cause: incorrect check of `window.supabase.auth` instead of local `supabase.auth`.\n- Surgical guard repair applied.\n- Runtime marker added: `RAWAEA_P135_TARGET` / `__RAWAEA_P135_RUNTIME_BUILD__`.\n- Service Worker cache namespace advanced to `rw-static-p135-v1`; registration path deliberately unchanged pending artifact proof.\n- Current production evidence still classifies the 401 as deployment/artifact drift until the P135 marker is observed in the served Pages runtime.\n- Next gate: browser verify marker, login, then SW route; only after those proofs proceed to further Cloudflare repair or Gold/Diamond closure.\n'''
          if '### P135 — FORENSIC RUNTIME REPAIR' not in text:
              state.write_text(text+block,encoding='utf-8')

          subprocess.run(['git','config','user.name','rawaea-p135-forensic-bot'],check=True)
          subprocess.run(['git','config','user.email','rawaea-p135-forensic-bot@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','Current/PWA/New-main','Current/PWA/sw.js','doc/Draft/Reprots/تقرير2.md','CURRENT_STATE.md'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','[p135-runtime-repair] surgical runtime and artifact repair'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
