name: RAWAEA TEMP GOLD DIAMOND TARGET EXECUTOR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard trigger
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          case "$COMMIT_MESSAGE" in
            "[new-main-target-persist]"*) ;;
            *) echo "NON_TARGET_TRIGGER_SKIP"; exit 0;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Execute final parity on published target only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
          m=ms[0]; body=m.group('b')
          if 'RAWAEA GOLD DIAMOND SESSION FAIL-CLOSED v1' not in body:
              body += r'''
/* RAWAEA GOLD DIAMOND SESSION FAIL-CLOSED v1 */
(function(){'use strict';var A=window.RW_Auth,S=window.RW_STATE;if(!A||!S||typeof A.enterSystem!=='function'||A.__rawaeaFailClosed)return;var base=A.enterSystem;A.enterSystem=async function(user){try{return await base.call(this,user)}catch(e){try{S.app.initialized=false;S.app.authenticated=false;S.app.currentUser=null;S.app.companyId=null;S.app.ownerProfile=null;S.app.licenseState='unknown';S.permissions=[]}catch(x){}try{if(typeof this.forceEnterFallback==='function')this.forceEnterFallback()}catch(x){}throw e}};A.__rawaeaFailClosed=true})();
'''
          if 'RAWAEA GOLD DIAMOND NAVIGATION PARITY v2' not in body:
              body += r'''
