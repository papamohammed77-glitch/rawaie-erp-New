bel:'لوحة القيادة'},{view:'reports-detailed',label:'التقارير التفصيلية'},{view:'reports-comprehensive',label:'التقارير الشاملة'}]},{view:'hr',icon:'fa-id-card',label:'الموارد البشرية'},{view:'crm',icon:'fa-handshake',label:'إدارة علاقات العملاء (CRM)'},{view:'users',icon:'fa-users-gear',label:'المستخدمين والصلاحيات'},{view:'roles',icon:'fa-user-shield',label:'إدارة أدوار المستخدمين'},{view:'license',icon:'fa-shield-halved',label:'إدارة الترخيص'},{view:'settings',icon:'fa-gear',label:'إعدادات النظام'},{view:'audit-log',icon:'fa-clipboard-list',label:'سجل التدقيق'},{view:'notifications',icon:'fa-bell',label:'الإشعارات'}];
function voucher(t){if(!window.RW_Warehouse||typeof window.RW_Warehouse.loadVoucherForm!=='function')throw new Error('VOUCHER_HANDLER_MISSING');return window.RW_Warehouse.loadVoucherForm(t)}function finance(t){if(!window.RW_Finance||typeof window.RW_Finance.renderSubTab!=='function')throw new Error('FINANCE_SUBTAB_HANDLER_MISSING');return window.RW_Finance.renderSubTab(t||'treasury')}
