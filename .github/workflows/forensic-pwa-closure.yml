name: RAWAEA TEMP GOLD DIAMOND TARGET EXECUTOR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  target:
    if: github.event.head_commit.message == '[new-main-target-persist] temporary GOLD DIAMOND executor'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Execute surgical New-main repair (Browser E2E paused by explicit directive)
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, hashlib

          p = Path('Current/PWA/New-main')
          legacy = Path('Current/PWA/main.html')
          s = p.read_text(encoding='utf-8')
          legacy_before = hashlib.sha256(legacy.read_bytes()).hexdigest()

          old1 = "if(mappedItem)_uploadFileData[f].item_code=mappedItem.item_code;"
          new1 = "if(mappedItem){_uploadFileData[f].item_code=mappedItem.item_code;_uploadFileData[f].item_id=mappedItem.id;}"
          if s.count(old1) != 1:
              raise SystemExit('UPLOAD_ID_MAPPING_SOURCE_NOT_UNIQUE:' + str(s.count(old1)))
          s = s.replace(old1, new1, 1)

          old2 = "items.push({item_code:_uploadFileData[u].item_code||_uploadFileData[u].barcode,qty:_uploadFileData[u].qty});"
          new2 = "items.push({item_id:_uploadFileData[u].item_id||null,item_code:_uploadFileData[u].item_code||_uploadFileData[u].barcode,qty:_uploadFileData[u].qty});"
          if s.count(old2) != 1:
              raise SystemExit('UPLOAD_ID_PAYLOAD_SOURCE_NOT_UNIQUE:' + str(s.count(old2)))
          s = s.replace(old2, new2, 1)

          if s.count('</html>') != 1 or s.count('</body>') != 1:
              raise SystemExit('DOCUMENT_CLOSURE_INVALID')
          scripts = [m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>', s, re.I) if not re.search(r'\\bsrc\\s*=', m.group('a') or '', re.I)]
          if len(scripts) != 1:
              raise SystemExit('INLINE_SCRIPT_COUNT_INVALID:' + str(len(scripts)))
          js = Path(tempfile.gettempdir())/'new-main-surgical.js'
          js.write_text(scripts[0].group('b'), encoding='utf-8')
          r = subprocess.run(['node','--check',str(js)], capture_output=True, text=True)
          if r.returncode:
              print(r.stderr)
              raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          for x in ['RW_ShellContext','RW_OwnerLicense','RW_Views','RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_HR','RW_CRM','_clickNotif','_renderAndSave','_updateBadge','markRead','bulk-stock-adjustment']:
              if x not in s:
                  raise SystemExit('TARGET_CONTRACT_MISSING:'+x)

          p.write_text(s, encoding='utf-8')
          legacy_after = hashlib.sha256(legacy.read_bytes()).hexdigest()
          if legacy_after != legacy_before:
              raise SystemExit('LEGACY_MAIN_HTML_CHANGED')

          subprocess.run(['git','config','user.name','rawaea-new-main-bot'],check=True)
          subprocess.run(['git','config','user.email','rawaea-new-main-bot@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','Current/PWA/New-main'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode == 0:
              raise SystemExit('NO_SURGICAL_DELTA')
          subprocess.run(['git','commit','-m','fix: align New-main bulk stock payload with atomic adjustment contract'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('SURGICAL_REPAIR_PERSISTED')
          PY