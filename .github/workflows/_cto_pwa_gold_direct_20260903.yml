name: CTO PWA Gold Direct 20260903
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cto-pwa-runtime-gold
  cancel-in-progress: false
jobs:
  close:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Surgical PWA runtime fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          old='<link rel="manifest" href="../manifest.json">'
          new='<link rel="manifest" href="./New-main.manifest.json">'
          if old in s:
              assert s.count(old)==1
              s=s.replace(old,new,1)
          else:
              assert new in s, 'PWA_MANIFEST_LINEAGE_UNKNOWN'
          marker='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          gold='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if 'rw-pwa-runtime-gold' not in s:
              assert '</head>' in s
              s=s.replace('</head>',gold+'\n'+marker+'\n</head>',1)
          else:
              assert s.count('rw-pwa-runtime-gold')==1
              assert s.count('RAWAEA_TARGET_SW_COORDINATOR')==1
          p.write_text(s,encoding='utf-8')
          Path('Current/PWA/New-main.manifest.json').write_text(json.dumps({'name':'الروائع ERP','short_name':'الروائع ERP','start_url':'./New-main','scope':'./','display':'standalone','dir':'rtl','lang':'ar','theme_color':'#2563eb','background_color':'#f8fafc','icons':[{'src':'./New-main-icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('Current/PWA/New-main-icon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2563eb"/><text x="256" y="325" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" font-size="270" font-weight="900" fill="#fff">ر</text></svg>\n',encoding='utf-8')
          PY
      - name: Static gate
        run: |
          set -euo pipefail
          grep -q 'rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03"' Current/PWA/New-main
          grep -q 'id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"' Current/PWA/New-main
          test -f Current/PWA/New-main.manifest.json
          test -f Current/PWA/New-main-icon.svg
          test -f Current/PWA/sw.js
          test -f Current/PWA/register-sw.js
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='.//' and m['dir']=='rtl' and m['lang']=='ar'
          print('PWA_STATIC_CONTRACT_PASS')
          PY
      - name: HTTP browser gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python -m http.server 8765 --directory Current/PWA >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext();const e=[];c.on('page',p=>{p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())})});const p=await c.newPage();await p.goto('http://127.0.0.1:8765/New-main',{waitUntil:'domcontentloaded',timeout:10000});await p.waitForSelector('#rw-login-page',{timeout:10000});await p.waitForTimeout(1200);const r=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const reg=await navigator.serviceWorker.getRegistration('./');const mj=await (await fetch(l.href)).json();return {lang:document.documentElement.lang,dir:document.documentElement.dir,manifest:l.href,mj,sw:!!reg,swScript:reg?.active?.scriptURL||null,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||null,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||null}});if(r.lang!=='ar'||r.dir!=='rtl'||r.manifest!=='http://127.0.0.1:8765/New-main.manifest.json'||r.mj.start_url!=='./New-main'||r.mj.scope!=='./'||!r.sw||!r.swScript?.endsWith('/sw.js')||r.p163!=='P163-GOLD-DIAMOND-CLOSED-2026-09-03'||r.pwa!=='PWA-RUNTIME-GOLD-2026-09-03'||e.length)throw new Error(JSON.stringify({r,e}));console.log(JSON.stringify({r,e}));await b.close();})().catch(x=>{console.error(x);process.exit(1)});
          NODE
      - name: Persist and push target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CURRENT_STATE.md'); s=p.read_text(encoding='utf-8') if p.exists() else ''
          marker='## CTO PWA RUNTIME GOLD — 2026-09-03 (LIVE VERIFIED)'
          if marker not in s:
              s += '\n\n'+marker+'\n- Target: `Current/PWA/New-main`.\n- Target-specific manifest and Service Worker coordinator verified over real HTTP Chromium runtime.\n- Static gate: PASS.\n- Browser gate: PASS; manifest fetched; Service Worker active on `sw.js`; no page/console errors.\n- Production Supabase writes: NONE.\n- PWA runtime Closure Unit GOLD = PROVEN.\n'
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name cto-pwa-executor
          git config user.email cto-pwa-executor@users.noreply.github.com
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg CURRENT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'TARGET_ALREADY_VERIFIED_NO_COMMIT'
            exit 0
          fi
          git commit -m '[PWA-RUNTIME] [GOLD-PROVEN] close New-main manifest and Service Worker runtime'
          git push origin HEAD:main

# Canonical PWA runtime executor — idempotent, serialized, target-preserving.
