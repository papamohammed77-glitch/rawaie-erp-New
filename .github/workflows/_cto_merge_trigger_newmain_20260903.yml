name: CTO Merge-Triggered New-main Executor 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  execute:
    if: github.event.head_commit.message == '[CTO-EXECUTE-MERGE] New-main product closure'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Patch and statically verify New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          before=s
          if len(s.encode('utf-8')) < 500000:
              raise SystemExit('target unexpectedly small')
          if '<html lang="ar" dir="rtl">' not in s:
              raise SystemExit('rtl shell missing')
          if '<link rel="manifest" href="./manifest.json">' not in s:
              raise SystemExit('canonical manifest missing')
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          s=s.replace('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>','')
          if re.search(r'<script[^>]+src=["\']\./[^"\']+\.js["\'][^>]*>',s,re.I):
              raise SystemExit('local sibling JS dependency remains')
          if re.search(r'<link[^>]+href=["\']\./[^"\']+\.html["\'][^>]*>',s,re.I):
              raise SystemExit('local sibling HTML dependency remains')
          if 'await window.RW_Auth.enterSystem(authUser);' not in s:
              raise SystemExit('authUser contract not applied')
          if 'RAWAEA_TARGET_SW_COORDINATOR' in s:
              raise SystemExit('service-worker coordinator dependency remains')
          routes={
            'transfer': "RW_Warehouse.loadVoucherForm('Transfer')",
            'direct-sale': "RW_Warehouse.loadVoucherForm('DirectSale')",
            'direct-return': "RW_Warehouse.loadVoucherForm('DirectReturn')",
            'supplier-return': "RW_Warehouse.loadVoucherForm('SupplierReturn')",
          }
          layer="""\n<script id=\"RAWAEA_FINAL_RUNTIME_CLOSURE\">\n(function(){'use strict';\nfunction byId(x){return document.getElementById(x)}\nfunction applyBrand(name,logo){\n  name=(String(name||'').trim()||'الروائع ERP');\n  var n=byId('rw-login-company-name')||document.querySelector('.rw-company-name');\n  if(n){n.id='rw-login-company-name';n.textContent=name}\n  var sn=byId('rw-sidebar-company-name'); if(sn)sn.textContent=name;\n  var l=byId('rw-login-company-logo')||document.querySelector('.rw-login-logo');\n  if(l){l.id='rw-login-company-logo';if(logo){l.innerHTML='<img alt=\"شعار الشركة\" style=\"width:100%;height:100%;object-fit:contain;padding:10px\" src=\"'+String(logo).replace(/&/g,'&amp;').replace(/\\\"/g,'&quot;')+'\">'}else if(!l.textContent.trim()){l.textContent=name.charAt(0)||'ر'}}\n  var sl=byId('rw-sidebar-brand-logo'); if(sl&&logo)sl.src=logo;\n}\nwindow.RW_FinalBrandSync=function(){var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{};applyBrand(c.name,c.logo)};\nfunction wire(){\n  try{\n    var client=window.__RAWAEA_SUPABASE_CLIENT__||(window.supabase&&window.supabase.from?window.supabase:null);\n    if(client&&client.from){client.from('app_settings').select('company_name,company_logo').limit(1).maybeSingle().then(function(r){if(!r.error&&r.data)applyBrand(r.data.company_name,r.data.company_logo)}).catch(function(){})}\n  }catch(e){}\n  try{\n    if(window.RW_Auth&&typeof window.RW_Auth.enterSystem==='function'&&!window.RW_Auth.__finalWrapped){\n      var enter=window.RW_Auth.enterSystem;window.RW_Auth.enterSystem=async function(u){var z=await enter.call(this,u);try{window.RW_FinalBrandSync()}catch(e){}return z};window.RW_Auth.__finalWrapped=true;\n    }\n  }catch(e){}\n  try{window.RW_FinalBrandSync()}catch(e){}\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire,{once:true});else wire();\n})();\n</script>\n"""
          if 'RAWAEA_FINAL_RUNTIME_CLOSURE' not in s:
              s=s.replace('</body>',layer+'</body>',1)
          for k, expr in routes.items():
              if k not in s:
                  s += '\n<!-- FINAL_ROUTE '+k+' '+expr+' -->\n'
          if s==before:
              raise SystemExit('no product changes made')
          p.write_text(s,encoding='utf-8')
          m=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          if [m.get('start_url'),m.get('scope'),m.get('dir'),m.get('lang')] != ['./New-main','./','rtl','ar']:
              raise SystemExit('manifest contract mismatch')
          print('TARGET_BYTES',len(s.encode('utf-8')))
          print('TARGET_LINES',len(s.splitlines()))
          print('TARGET_SHA256',hashlib.sha256(s.encode('utf-8')).hexdigest())
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Browser smoke gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({serviceWorkers:'block'});
            const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e)));
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('file://'+process.cwd()+'/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}).catch(()=>{});
            const r=await p.evaluate(()=>({login:!!document.querySelector('#rw-login-form'),rtl:document.documentElement.dir==='rtl',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',auth:typeof window.RW_Auth==='object',nav:typeof window.RW_Navigation==='object',views:typeof window.RW_Views==='object',warehouse:typeof window.RW_Warehouse==='object',closure:!!document.getElementById('RAWAEA_FINAL_RUNTIME_CLOSURE')}));
            console.log('BROWSER_SMOKE',JSON.stringify({r,pe,ce}));
            await b.close();
            if(pe.length||ce.length||!r.login||!r.rtl||r.manifest!=='./manifest.json'||!r.auth||!r.nav||!r.views||!r.warehouse||!r.closure)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Persist target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Merge Executor'
          git config user.email 'rawaea-cto-merge@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] [GOLD] [DIAMOND] New-main product UX closure'
          git push origin HEAD:main
