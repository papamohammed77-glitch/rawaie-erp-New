name: CTO Main1 Surgical Executor — one-shot migration channel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  execute:
    if: github.event.head_commit.message == '[CTO-EXECUTE-MERGE] New-main product closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Surgical Main1 foundation closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Current/PWA/main2/main1.md')
          s = p.read_text(encoding='utf-8')
          before = s

          old_bootstrap_start = """        // ✅ Bootstrap: تحميل البيانات الأساسية مرة واحدة لجميع التبويبات
          Promise.all([
              RW_Data.loadItems(),
              RW_Data.loadCustomers(),
              RW_Data.loadBranches()
          ]).then(function() {"""
          start = s.find(old_bootstrap_start)
          if start < 0:
              raise SystemExit('ASSERT FAILED: Main1 bootstrap start not found')
          catch_anchor = """      } catch(e) {
          console.error(e);
          this.forceEnterFallback();
      },
          forceEnterFallback: function() {"""
          end = s.find(catch_anchor, start)
          if end < 0:
              raise SystemExit('ASSERT FAILED: Main1 bootstrap catch anchor not found')
          old_bootstrap = s[start:end]
          if s.count(old_bootstrap) != 1:
              raise SystemExit('ASSERT FAILED: bootstrap block is not unique')

          new_bootstrap = """        // ✅ Bootstrap: تحميل البيانات الأساسية مرة واحدة لجميع التبويبات
          Promise.all([
              RW_Data.loadItems(),
              RW_Data.loadCustomers(),
              RW_Data.loadBranches()
          ]).then(function() {
              console.log('✅ Bootstrap data loaded successfully.');
              console.log('ITEMS COUNT', window.RW_STATE.data.items?.length);
              console.log('CUSTOMERS COUNT', window.RW_STATE.data.customers?.length);
              console.log('SUPPLIERS COUNT', window.RW_STATE.data.suppliers?.length);
              console.log('BRANCHES COUNT', window.RW_STATE.data.branches?.length);

              supabase.from('suppliers').select('*').eq('company_id', RW_STATE.app.company.id).then(function(r) {
                  RW_STATE.data.suppliers = r.data || [];
                  console.log('✅ Suppliers loaded.');
              }).catch(function(e) {
                  console.warn('⚠️ Suppliers optional load failed:', e);
              });

              RW_STATE.app.initialized = true;
              RW_Navigation.navigate('dashboard');
              setTimeout(function() { RW_Notification.renderBell(); }, 500);
          }).catch(function(e) {
              console.error('❌ Bootstrap failed; keeping authenticated UI closed:', e);
              RW_STATE.app.initialized = false;
              RW_STATE.app.authenticated = false;
              hideLoader();
              showToast('تعذر تجهيز بيانات النظام. لم يتم فتح النظام لتجنب حالة تشغيل ناقصة.', 'error');
          });
"""
          s = s.replace(old_bootstrap, new_bootstrap, 1)

          old_fallback = """          forceEnterFallback: function() {
          hideLoader();
          try {
              byId('rw-login-page').style.display = 'none';
              byId('rw-main-shell').style.display = 'flex';
              RW_Navigation.buildSidebar();
              RW_Navigation.navigate('dashboard');
              showToast('تم تشغيل النظام في الوضع الآمن', 'warning');
          } catch(e) {
              document.body.innerHTML = '<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Cairo;\"><h1>RAWAEA ERP</h1><p>حدث خطأ أثناء تشغيل النظام</p><button onclick=\"location.reload()\">إعادة التحميل</button></div>';
          }
      },
"""
          if s.count(old_fallback) != 1:
              raise SystemExit(f'ASSERT FAILED: fallback block count={s.count(old_fallback)}')
          new_fallback = """          forceEnterFallback: function() {
          hideLoader();
          RW_STATE.app.initialized = false;
          RW_STATE.app.authenticated = false;
          try {
              byId('rw-main-shell').style.display = 'none';
              byId('rw-login-page').style.display = 'flex';
              showToast('تعذر تهيئة النظام. تم منع الدخول حتى اكتمال التهيئة بأمان.', 'error');
          } catch(e) {
              document.body.innerHTML = '<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Cairo;\"><h1>RAWAEA ERP</h1><p>تعذر تهيئة النظام بأمان</p><button onclick=\"location.reload()\">إعادة التحميل</button></div>';
          }
      },
"""
          s = s.replace(old_fallback, new_fallback, 1)

          core_loaders = {
              'loadItems': ("""        }).catch(function(e) {
            console.error('loadItems', e);
            RW_STATE.data.items = [];
            return [];
        });""", """        }).catch(function(e) {
            console.error('loadItems', e);
            RW_STATE.data.items = [];
            throw e;
        });"""),
              'loadCustomers': ("""        }).catch(function(e) {
            console.error('loadCustomers', e);
            RW_STATE.data.customers = [];
            return [];
        });""", """        }).catch(function(e) {
            console.error('loadCustomers', e);
            RW_STATE.data.customers = [];
            throw e;
        });"""),
              'loadBranches': ("""        }).catch(function(e) {
            console.error('loadBranches', e);
            RW_STATE.data.branches = [];
            return [];
        });""", """        }).catch(function(e) {
            console.error('loadBranches', e);
            RW_STATE.data.branches = [];
            throw e;
        });""")
          }
          for name, (old, new) in core_loaders.items():
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'ASSERT FAILED: {name} loader block count={c}')
              s = s.replace(old, new, 1)

          old_logout = """        RW_Audit_log('logout', 'auth', userEmail, null, null);

        supabase.auth.signOut().then(function() {
            RW_STATE.app.authenticated = false;"""
          new_logout = """        RW_Audit_log('logout', 'auth', userEmail, null, null);

        RW_STATE.app.initialized = false;
        RW_STATE.app.authenticated = false;
        RW_STATE.app.currentUser = null;
        RW_STATE.permissions = [];
        supabase.auth.signOut().then(function() {"""
          if s.count(old_logout) != 1:
              raise SystemExit(f'ASSERT FAILED: logout block count={s.count(old_logout)}')
          s = s.replace(old_logout, new_logout, 1)

          if 'تم تشغيل النظام في الوضع الآمن' in s:
              raise SystemExit('ASSERT FAILED: fail-open fallback remains')
          if '}).finally(function()' in s:
              raise SystemExit('ASSERT FAILED: bootstrap finally navigation remains')
          if re.search(r"RW_STATE\.data\.(items|customers|branches) = \[\];\s*return \[\];", s):
              raise SystemExit('ASSERT FAILED: bootstrap loader still masks errors')
          if 'RW_STATE.app.initialized = true;' not in s:
              raise SystemExit('ASSERT FAILED: successful initialization marker missing')
          if 'RW_STATE.app.currentUser = null;' not in s:
              raise SystemExit('ASSERT FAILED: logout identity reset missing')

          p.write_text(s, encoding='utf-8')
          print('MAIN1_BYTES_BEFORE', len(before.encode('utf-8')))
          print('MAIN1_BYTES_AFTER', len(s.encode('utf-8')))
          print('MAIN1_CHANGED', before != s)
          PY

      - name: Main1 static syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/main2/main1.md')
          s=p.read_text(encoding='utf-8')
          assert s.count('<html')==1
          assert s.count('</html>')==1
          assert s.count('<body>')==1
          assert s.count('</body>')==1
          assert s.count('RW_STATE.app.initialized = true;')==1
          assert s.count('RW_STATE.app.currentUser = null;')==1
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          assert blocks, 'inline script missing'
          Path('/tmp/main1.js').write_text('\n\n'.join(blocks),encoding='utf-8')
          print('INLINE_SCRIPT_BLOCKS',len(blocks))
          PY
          node --check /tmp/main1.js
          git diff --check

      - name: Persist evidence and retire the temporary channel
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_FILE_SHA="$(git hash-object Current/PWA/main2/main1.md)"
          mkdir -p doc/Draft/Reprots
          cat > doc/Draft/Reprots/Execution_Log_Main1_Surgical_Closure_20260911.md <<EOF
          # Main1 Surgical Closure Execution Log

          - Execution UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - Input Git HEAD: ${BEFORE_SHA}
          - Current Main1 file: Current/PWA/main2/main1.md
          - Current Main1 content SHA after patch: ${AFTER_FILE_SHA}
          - Original Main1: NOT MODIFIED

          ## Surgical defects closed
          1. Bootstrap failure no longer opens the authenticated shell.
          2. Core bootstrap data loaders no longer convert DB failures to empty successful results.
          3. Navigation to dashboard occurs only after required bootstrap success.
          4. Logout clears initialized/authenticated/currentUser/permissions state.

          ## Verification
          - Exact block uniqueness assertions: PASS
          - HTML boundary check: PASS
          - Inline JavaScript syntax: PASS
          - git diff --check: PASS
          - Production data mutation by this source patch: NONE

          ## Status
          MAIN1 FOUNDATION SOURCE CLOSURE = IMPLEMENTED
          MAIN1 FOUNDATION CI SYNTAX = VERIFIED
          MAIN1 AUTHENTICATED PRODUCTION UI E2E = NOT PROVEN IN THIS RUN
          EOF
          git rm .github/workflows/_cto_merge_trigger_newmain_20260903.yml
          git config user.name 'RAWAEA CTO Executor'
          git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/main2/main1.md doc/Draft/Reprots/Execution_Log_Main1_Surgical_Closure_20260911.md
          git commit -m '[CTO-MAIN1-CLOSED] Main1 foundation surgical closure'
          git push origin HEAD:main
