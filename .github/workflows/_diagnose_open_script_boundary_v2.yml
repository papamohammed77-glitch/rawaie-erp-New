name: Diagnose Main1 open-script boundary v2
on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Cumulative runtime boundary matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          CUR=Path('Current/PWA/main')
          parts=[(CUR/f'main{i}.md').read_text(encoding='utf-8-sig') for i in range(1,12)]
          op=re.compile(r'<script(?![^>]*\bsrc\s*=)[^>]*>',re.I)
          matches=list(op.finditer(parts[0])); assert matches
          p1=parts[0][matches[-1].end():]
          p1=re.sub(r'(?m)^\s*<!--\s*RAWAEA_P1_FORENSIC_CLOSED:[^>]*-->\s*$','',p1,flags=re.I)
          frags=[x.rstrip() for x in parts[1:]]
          print('PART_COUNTS')
          for i,p in enumerate(parts,1):
              print(i,'IIFE_OPEN',p.count('(function'),'IIFE_CLOSE',p.count('})();'),'TRY_OPEN',p.count('try{')+p.count('try {'),'TRY_CLOSE',p.count('catch(e)'),'BYTES',len(p.encode()))
          js=p1
          for i in range(1,12):
              if i>1: js += '\n\n'+frags[i-2]
              f=Path(tempfile.gettempdir())/f'cum-runtime-{i}.js'; f.write_text(js+'\n',encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              status='PASS' if r.returncode==0 else 'FAIL'
              print(f'MAIN{i}_RUNTIME_CUMULATIVE {status} lines={js.count(chr(10))+1} bytes={len(js.encode())}')
              if r.returncode:
                  print(r.stderr)
                  lines=js.splitlines(); m=re.search(r':(\d+)',r.stderr)
                  if m:
                      n=int(m.group(1));
                      for j in range(max(1,n-20),min(len(lines),n+20)+1): print(f'{j}: {lines[j-1]}')
                  raise SystemExit(f'FIRST_RUNTIME_SYNTAX_FAILURE_MAIN{i}')
          print('ALL_RUNTIME_FRAGMENTS_PASS')
          print('PAREN_COUNTS',js.count('{'),js.count('}'),js.count('('),js.count(')'),js.count('['),js.count(']'))
          PY
