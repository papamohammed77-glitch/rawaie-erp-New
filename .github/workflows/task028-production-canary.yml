      - task-028-loading-unloading-refactor
  workflow_dispatch:
jobs:
  production-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke temporary production canary harness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X GET \
            'https://fiilmooggumokxanwiyx.supabase.co/functions/v1/task028-production-canary-20260814' \
            -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpaWxtb29nZ3Vtb2t4YW53aXl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDkwOTIsImV4cCI6MjA5NDI4NTA5Mn0.LZScCxnCiRrTSCCBmTryszQpY1AwBgR2dkTBbC5kOc4' \
            -H 'Content-Type: application/json' \
            | tee canary-result.json
      - name: Validate canary response
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open('canary-result.json','r',encoding='utf-8') as f:
              data=json.load(f)
          print(json.dumps(data,ensure_ascii=False,indent=2))
          if not data.get('success'):
              raise SystemExit('Production canary returned success=false')
          final=data.get('finalBeforeCleanup') or {}
          after=data.get('finalAfterCleanup') or {}
          print('Production canary completed; cleanup:', after)
          PY
