name: Medhat owner recovery verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify owner credential recovery
        run: echo recovery-verification-kept
  repair-main1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Apply isolated main1 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/main/main1.md')
          s=p.read_text(encoding='utf-8')
          marker='RAWAEA_P1_FORENSIC_CLOSED:v14'
          if marker in s:
              print('MAIN1_ALREADY_CLOSED')
              raise SystemExit(0)
          def req(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}_COUNT={c}')
              s=s.replace(old,new,1)
          anchor='window.RW_STATE = RW_STATE;'
          tenant="""

// RAWAEA GOVERNED TENANT CONTEXT
var RW_ShellContext=(function(){
    var companyId=null,userId=null,resolving=null;
    function applyUserIdentity(row,authUser){
        companyId=row.company_id||null;
        userId=row.id||null;
        RW_STATE.app.companyId=companyId;
        RW_STATE.app.userId=userId;
        if(RW_STATE.app.currentUser){
            RW_STATE.app.currentUser.id=userId;
            RW_STATE.app.currentUser.authId=(authUser&&authUser.id)||RW_STATE.app.currentUser.authId||null;
            RW_STATE.app.currentUser.companyId=companyId;
            if(row.name)RW_STATE.app.currentUser.name=row.name;
            if(row.role)RW_STATE.app.currentUser.role=row.role;
            RW_STATE.app.currentUser.isOwner=RW_STATE.app.currentUser.isOwner===true;
        }
        var dbPerms=Array.isArray(row.permissions)?row.permissions.slice():[];
        RW_STATE.permissions=(RW_STATE.app.currentUser&&RW_STATE.app.currentUser.isOwner===true)?['*']:dbPerms;
        return companyId;
    }
    function resolve(){
        if(companyId)return Promise.resolve(companyId);
        if(resolving)return resolving;
        if(!RW_SUPABASE_CLIENT)return Promise.reject(new Error('SUPABASE_CLIENT_UNAVAILABLE'));
        resolving=RW_SUPABASE_CLIENT.auth.getUser().then(function(r){
            if(r.error||!r.data||!r.data.user||!r.data.user.id)throw new Error('AUTH_ID_UNAVAILABLE');
            return r.data.user;
        }).then(function(authUser){
            return RW_SUPABASE_CLIENT.from('users').select('id,company_id,name,role,status,permissions').eq('auth_id',authUser.id).eq('status','Active').maybeSingle().then(function(r){
                if(r.error||!r.data||!r.data.company_id)throw new Error('TENANT_CONTEXT_UNAVAILABLE');
                return applyUserIdentity(r.data,authUser);
            });
        }).finally(function(){resolving=null;});
        return resolving;
    }
    function getCompanyId(){if(!companyId)throw new Error('TENANT_CONTEXT_UNAVAILABLE');return companyId;}
    return {resolve:resolve,getCompanyId:getCompanyId,hasCompany:function(){return !!companyId;}};
})();
window.RW_ShellContext=RW_ShellContext;
"""
          req(anchor,anchor+tenant,'TENANT_CONTEXT')
          req("email: user.email,\n                role: meta.role || 'مدير النظام',\n                isOwner: meta.isOwner === true || meta.isOwner === 'true'\n            };\n","email: user.email,\n                authId: user.id,\n                companyId: null,\n                role: meta.role || 'مدير النظام',\n                isOwner: meta.isOwner === true || meta.isOwner === 'true'\n            };\n",'AUTH_USER')
          req("RW_STATE.permissions = meta.permissions || ['*'];","RW_STATE.permissions = (RW_STATE.app.currentUser && RW_STATE.app.currentUser.isOwner === true) ? ['*'] : (Array.isArray(meta.permissions) ? meta.permissions.slice() : []);",'OWNER_PERMISSIONS')
          req('enterSystem: function() {','enterSystem: async function() {','ENTER_ASYNC')
          req('self.enterSystem();','self.enterSystem().catch(function(e){ console.error(\'ENTER_SYSTEM_FAILED\',e); });','ENTER_CALL')
          req('enterSystem: async function() {\n    hideLoader();','enterSystem: async function() {\n    try { await RW_ShellContext.resolve(); } catch(e) { console.error(\'TENANT_CONTEXT_FAILED\',e); this.forceEnterFallback(); return; }\n    hideLoader();','ENTER_RESOLVE')
          req(".from('app_settings')\n            .select('*')\n            .limit(1)",".from('app_settings')\n            .select('*')\n            .eq('company_id',RW_ShellContext.getCompanyId())\n            .limit(1)",'APP_SETTINGS')
          req("supabase.from('suppliers').select('*').then(function(r)","supabase.from('suppliers').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(r)",'SUPPLIERS')
          req("return supabase.from('items').select('*').then(function(res)","return supabase.from('items').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(res)",'ITEMS')
          req("return supabase.from('customers').select('*').then(function(res)","return supabase.from('customers').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(res)",'CUSTOMERS')
          req("return supabase.from('branches').select('*').then(function(res)","return supabase.from('branches').select('*').eq('company_id',RW_ShellContext.getCompanyId()).then(function(res)",'BRANCHES')
          old="""        forceEnterFallback: function() {\n        hideLoader();\n        try {\n            byId('rw-login-page').style.display = 'none';\n            byId('rw-main-shell').style.display = 'flex';\n            RW_Navigation.buildSidebar();\n            RW_Navigation.navigate('dashboard');\n            showToast('تم تشغيل النظام في الوضع الآمن', 'warning');\n        } catch(e) {\n            document.body.innerHTML = '<div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Cairo;\"><h1>RAWAEA ERP</h1><p>حدث خطأ أثناء تشغيل النظام</p><button onclick=\"location.reload()\">إعادة التحميل</button></div>';\n        }\n    },"""
          new="""        forceEnterFallback: function() {\n        hideLoader();\n        try {\n            RW_STATE.app.authenticated = false;\n            byId('rw-main-shell').style.display = 'none';\n            byId('rw-login-page').style.display = 'flex';\n            showToast('تعذر تحديد سياق الشركة الآمن. لم يتم تشغيل النظام.', 'error');\n        } catch(e) {\n            console.error('FAIL_CLOSED_TENANT_CONTEXT', e);\n        }\n    },"""
          req(old,new,'FAIL_CLOSED')
          if re.search(r"supabase\.from\(['\"]stock_branches['\"]\)[^;]{0,1200}\.(?:update|insert|upsert|delete)\(",s,re.S): raise SystemExit('DIRECT_STOCK_WRITER')
          if re.search(r"supabase\.from\(['\"]inventory_log['\"]\)[^;]{0,700}\.insert\(",s,re.S): raise SystemExit('DIRECT_INVENTORY_LOG_WRITER')
          code='\n'.join(re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I))
          f=Path(tempfile.gettempdir())/'main1.js';f.write_text(code,encoding='utf-8')
          r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('MAIN1_JS_SYNTAX')
          p.write_text(s.rstrip()+'\n<!-- '+marker+' -->\n',encoding='utf-8')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(p)],check=True)
          subprocess.run(['git','commit','-m','fix(p1): close main1 tenant owner shell'],check=True)
          import os
          subprocess.run(['git','push','origin',f'HEAD:{os.environ["GITHUB_HEAD_REF"]}'],check=True)
          PY
