name: Medhat owner recovery verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Verify owner credential recovery
        run: echo recovery-verification-kept
  repair-main1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Inspect
        run: |
          set -euo pipefail
          test -f Current/PWA/main/main1.md
          wc -c Current/PWA/main/main1.md
