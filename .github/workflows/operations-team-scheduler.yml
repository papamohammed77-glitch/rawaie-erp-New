name: Operations Team Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: operations-team-scheduler
  cancel-in-progress: false

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and dispatch operations queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_RUNTIME_URL: ${{ secrets.AGENT_RUNTIME_URL }}
          AGENT_RUNTIME_TOKEN: ${{ secrets.AGENT_RUNTIME_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/operations/operations_control_plane.py

      - name: Publish control-plane summary
        run: |
          echo '## Operations Control Plane' >> "$GITHUB_STEP_SUMMARY"
          echo 'Polled every 5 minutes; created/updated task records; dispatched NEW tasks only when Agent Runtime is configured.' >> "$GITHUB_STEP_SUMMARY"
