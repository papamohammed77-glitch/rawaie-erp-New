name: CTO New-main final exact close
on:
  push:
    branches: [cto-newmain-final-exact-close-20260903]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Surgical target patch and full gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,subprocess,tempfile,hashlib,json
          p=Path('Current/PWA/New-main');s=p.read_text(encoding='utf-8');assert len(s)>200000 and len(s.splitlines())>5000,'TARGET_SHAPE'
          assert s.count('rw-p163-closure')==1,'P163';assert s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')==1,'DIAMOND'
          s=s.replace('<link rel="manifest" href="../manifest.json">','<link rel="manifest" href="./New-main.manifest.json">',1)
          head_anchor='</style>\n</head>';assert head_anchor in s,'HEAD_ANCHOR'
          if 'rw-pwa-runtime-gold' not in s:s=s.replace(head_anchor,'</style>\n<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">\n</head>',1)
          if 'RAWAEA_TARGET_SW_COORDINATOR' not in s:s=s.replace('</head>','<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>\n</head>',1)
          def rb(text,a1,a2,repl,name):
              a=text.find(a1);b=text.find(a2,a);assert a>=0 and b>a,name;return text[:a]+repl+text[b:]
          s=rb(s,'function _openTreasuryDialog(editId) {','\n    function _editTreasury(id)',"function _openTreasuryDialog(editId) {\n        _showToast('إدارة الخزائن والبنوك تتم عبر المحرك المالي المركزي. PWA للعرض والتشغيل المصرح فقط.', 'warning');\n        return;\n    }\n",'TREASURY_BOUNDARY')
          s=rb(s,'function _openAccountDialog(editCode) {','\n    async function _seedAccounts()',"function _openAccountDialog(editCode) {\n        _showToast('دليل الحسابات تتم إدارته عبر المحرك المالي المركزي فقط.', 'warning');\n        return;\n    }\n",'COA_BOUNDARY')
          s=rb(s,'async function _seedAccounts() {','\n    // ==================== Journal ====================',"async function _seedAccounts() {\n        _showToast('تهيئة دليل الحسابات تتم مركزيًا فقط.', 'warning');\n    }\n\n",'SEED_BOUNDARY')
          s=rb(s,'function _editBudget(accountId, accountName, year, month) {','\n    return {',"function _editBudget(accountId, accountName, year, month) {\n        _showToast('تعديل الموازنة يتم عبر المسار المالي المركزي فقط.', 'warning');\n        return;\n    }\n\n",'BUDGET_BOUNDARY')
          alias_old="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases'};";alias_new="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases',finance:'finance_manager',finance_manager:'finance'};"
          if alias_old in s:s=s.replace(alias_old,alias_new,1)
          assert alias_new in s,'FINANCE_ALIAS'
          bnd='<!-- RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1: PWA read-only master data; transactional finance delegates to Core Edge Functions/RPCs. -->'
          if bnd not in s:s=s.replace('</head>',bnd+'\n</head>',1)
          assert s.count(bnd)==1,'BOUNDARY'
          assert not re.search(r"from\('treasury'\)\.(insert|update|delete)",s),'TREASURY_WRITER'
          assert not re.search(r"from\('chart_of_accounts'\)\.(insert|update|delete)",s),'COA_WRITER'
          assert ".from('budgets').upsert" not in s,'BUDGET_WRITER'
          assert '<link rel="manifest" href="../manifest.json">' not in s,'LEGACY_MANIFEST'
          assert s.count('<link rel="manifest" href="./New-main.manifest.json">')==1,'MANIFEST_TARGET'
          assert s.count('<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">')==1,'PWA_META'
          assert s.count('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>')==1,'SW_COORD'
          class P(HTMLParser):
              def __init__(self):super().__init__(convert_charrefs=False);self.cur=None;self.inline=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script':self.cur={'src':dict(a).get('src'),'text':''}
              def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']:self.cur['text']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur['src'] and self.cur['text'].strip():self.inline.append(self.cur['text'])
                      self.cur=None
          q=P();q.feed(s);q.close();assert len(q.inline)==1,'INLINE_COUNT'
          f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(q.inline[0],encoding='utf-8')
          try:subprocess.run(['node','--check',str(f)],check=True)
          finally:f.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'));assert (m.get('start_url'),m.get('scope'),m.get('lang'),m.get('dir'))==('./New-main','./','ar','rtl'),'MANIFEST_CONTRACT'
          for x in ['Current/PWA/register-sw.js','Current/PWA/sw.js','Current/PWA/New-main-icon.svg']:assert Path(x).exists(),x
          p.write_text(s,encoding='utf-8');assert p.read_text(encoding='utf-8')==s,'READBACK'
          print('STATIC_GOLD_PASS',hashlib.sha256(s.encode()).hexdigest(),len(s.splitlines()),len(s.encode()))
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright');(async()=>{const s=fs.readFileSync('Current/PWA/New-main','utf8');const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(String(m.text()||''))});await p.route('https://cdn.jsdelivr.net/**',async r=>{const u=r.request().url();if(u.includes('supabase-js'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{user:null},error:{message:'stub'}}),signOut:async()=>({error:null})},from:()=>({select:()=>({eq:()=>({order:()=>({limit:()=>({maybeSingle:async()=>({data:null,error:null})})})})}),rpc:async()=>({data:null,error:null})})})}`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false,isDenied:false})};'});if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});return r.fulfill({status:200,contentType:'application/javascript',body:''})});await p.route('https://cdnjs.cloudflare.com/**',async r=>r.fulfill({status:200,contentType:'text/css',body:''}));await p.setContent(s,{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(600);const out=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation;S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};S.permissions=[];let ld=false,ad=false,fd=false;try{await N.navigate('license')}catch(e){ld=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}try{await N.navigate('audit')}catch(e){ad=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}try{await N.navigate('finance')}catch(e){fd=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}S.permissions=['finance_manager'];const fa=window.RW_Permissions_check('finance:view')===true;S.app.currentUser={email:'owner@example.com',isOwner:true,permissions:['*']};let ol=false,oa=false;try{await N.navigate('license');ol=true}catch(e){}try{await N.navigate('audit');oa=true}catch(e){}return{state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,lang:document.documentElement.lang,dir:document.documentElement.dir,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),financeAlias:fa,licenseDenied:ld,auditDenied:ad,financeDenied:fd,ownerLicense:ol,ownerAudit:oa,masterGuard:document.documentElement.innerHTML.includes('RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1')}});console.log('FORENSIC_RUNTIME='+JSON.stringify({out,pe,ce}));const ok=!pe.length&&!ce.length&&out.state&&out.auth&&out.nav&&out.views&&out.shell&&out.owner&&out.lang==='ar'&&out.dir==='rtl'&&out.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&out.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&out.manifest==='.'+'/New-main.manifest.json'&&out.diamond&&out.financeAlias&&out.licenseDenied&&out.auditDenied&&out.financeDenied&&out.ownerLicense&&out.ownerAudit&&out.masterGuard;await b.close();if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)});NODE
