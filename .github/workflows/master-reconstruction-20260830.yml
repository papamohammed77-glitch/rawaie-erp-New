name: RAWAEA TEMP TARGET-ONLY CLOSURE
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-reconstruction-20260830.yml'
permissions:
  contents: write
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate and patch published New-main only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',s,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
          m=ms[0]; body=m.group('b')
          # Repair the historic RW_Table double-escape if still present.
          repaired=body.replace("\\\\'", "\\'")
          if repaired!=body: body=repaired
          if 'RAWAEA GOLD DIAMOND FINAL CLOSURE v1' not in body:
              body += r'''
/* RAWAEA GOLD DIAMOND FINAL CLOSURE v1 */
(function(){
  'use strict';
  var S=window.RW_STATE,A=window.RW_Auth,N=window.RW_Navigation;
  if(!S||!A||!N)throw new Error('FINAL_CLOSURE_PREREQUISITE_MISSING');
  function owner(){return !!(S.app&&S.app.currentUser&&S.app.currentUser.isOwner===true)}
  function allowed(v){if(v==='license'||v==='audit'||v==='audit-log')return owner();if(owner())return true;var p={users:'users',roles:'roles',settings:'settings',hr:'users',crm:'customers',notifications:'notifications'}[v];if(!p)return true;try{return typeof window.RW_Permissions_check==='function'&&window.RW_Permissions_check(p)===true}catch(e){return false}}
  A.__rawaeaFailClosedFinal=true;
  var enter=A.enterSystem, fallback=A.forceEnterFallback;
  A.forceEnterFallback=function(){try{S.app.initialized=false;S.app.authenticated=false;S.app.currentUser=null;S.app.companyId=null;S.app.ownerProfile=null;S.app.licenseState='unknown';S.permissions=[]}catch(e){};if(typeof fallback==='function')return fallback.apply(this,arguments)};
  A.enterSystem=async function(user){try{return await enter.call(this,user)}catch(e){try{this.forceEnterFallback()}catch(x){};throw e}};
  var missingTree=[
    {view:'online-store',label:'المتجر الإلكتروني',parent:'sales'},
    {view:'purchase-pos',label:'نقطة شراء',parent:'purchases'},
    {view:'branches',label:'المخازن والفروع',parent:'warehouse'},
    {view:'vehicle-count',label:'جرد سيارة',parent:'counts'},
    {view:'branch-count',label:'جرد فرع',parent:'counts'},
    {view:'general-count',label:'جرد عام',parent:'counts'}
  ];
  function flatten(a,o){(a||[]).forEach(function(x){if(x.view)o[x.view]=x;if(x.submenu)flatten(x.submenu,o)})}
  var index={};flatten(N.menuTree,index);
  missingTree.forEach(function(x){if(index[x.view])return;var node={view:x.view,label:x.label};var host=index[x.parent];if(!host)return;if(!host.submenu)host.submenu=[];host.submenu.push(node);index[x.view]=node});
  N._rawaeaFinalAllowed=allowed;
  var baseNavigate=N.navigate;
  N.navigate=async function(v){if(!allowed(v))throw new Error((v==='license'||v==='audit'||v==='audit-log')?'OWNER_ONLY':'PERMISSION_DENIED');if(v==='audit-log')v='audit';return baseNavigate.call(this,v)};
  window.RW_GOLD_DIAMOND={version:'v1',target:'Current/PWA/New-main',modules:'MAIN1-MAIN11',navigation:'closed',session:'fail-closed',owner:'strict',production:'compatible'};
})();
'''
          candidate=s[:m.start('b')]+body+s[m.end('b'):]
          ms2=[z for z in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',candidate,re.I) if not re.search(r'\\bsrc\\s*=',z.group('a') or '',re.I)]
          if len(ms2)!=1:raise SystemExit('FINAL_INLINE_RUNTIME_COUNT')
          if not re.fullmatch(r'\s*</body>\s*</html>\s*',candidate[ms2[0].end():],re.I):raise SystemExit('OUTER_TAIL_INVALID')
          js=Path(tempfile.gettempdir())/'final-new-main.js';js.write_text(ms2[0].group('b'),encoding='utf-8')
          r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode:print(r.stderr);raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          required=['RW_GOLD_DIAMOND','RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views','audit-log','reports-dashboard','reports-detailed','reports-comprehensive']
          for x in required:
              if x not in candidate:raise SystemExit('TARGET_CONTRACT_MISSING:'+x)
          p.write_text(candidate,encoding='utf-8')
          subprocess.run(['git','config','user.name','rawaea-new-main-bot'],check=True);subprocess.run(['git','config','user.email','rawaea-new-main-bot@users.noreply.github.com'],check=True);subprocess.run(['git','add','Current/PWA/New-main'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','[new-main-target-persist] GOLD DIAMOND final closure'],check=True);subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
      - name: Browser contract smoke on published target
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 --directory Current/PWA >/tmp/rawaea-new-main-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200);const x=await p.evaluate(async()=>{const n=window.RW_Navigation,S=window.RW_STATE;const flat=[];const walk=a=>(a||[]).forEach(v=>{if(v.view)flat.push(v.view);if(v.submenu)walk(v.submenu)});walk(n.menuTree);const required=['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'];const critical=required.every(v=>flat.includes(v));const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'].every(v=>!!window[v]);S.app.currentUser={isOwner:false};let denied=false;try{await n.navigate('license')}catch(e){denied=e.message==='OWNER_ONLY'}return{critical,mods,denied,parity:window.RW_GOLD_DIAMOND,menuCount:flat.length};});console.log(JSON.stringify({x,pe,ce}));if(!x.critical||!x.mods||!x.denied||x.menuCount<30||pe.length||ce.length)process.exit(2);await b.close();})().catch(e=>{console.error(e);process.exit(2)});
          NODE