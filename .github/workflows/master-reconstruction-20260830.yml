name: P124 ACTIVE TARGET SURGICAL GATE
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  target:
    if: ${{ contains(github.event.head_commit.message, 'P124 surgical persist') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Surgical New-main completion — Browser E2E paused
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,tempfile
          p=Path('Current/PWA/New-main'); legacy=Path('Current/PWA/main.html')
          if not p.is_file() or not p.stat().st_size: raise SystemExit('TARGET_MISSING')
          if not legacy.is_file() or not legacy.stat().st_size: raise SystemExit('LEGACY_MAIN_MISSING')
          before=hashlib.sha256(legacy.read_bytes()).hexdigest(); s=p.read_text(encoding='utf-8')
          old1="if(mappedItem)_uploadFileData[f].item_code=mappedItem.item_code;"
          new1="if(mappedItem){_uploadFileData[f].item_code=mappedItem.item_code;_uploadFileData[f].item_id=mappedItem.id;}"
          old2="items.push({item_code:_uploadFileData[u].item_code||_uploadFileData[u].barcode,qty:_uploadFileData[u].qty});"
          new2="items.push({item_id:_uploadFileData[u].item_id||null,item_code:_uploadFileData[u].item_code||_uploadFileData[u].barcode,qty:_uploadFileData[u].qty});"
          changed=False
          if old1 in s: s=s.replace(old1,new1,1); changed=True
          if old2 in s: s=s.replace(old2,new2,1); changed=True
          if new1 not in s: raise SystemExit('UPLOAD_ITEM_ID_MAPPING_NOT_CLOSED')
          if new2 not in s: raise SystemExit('UPLOAD_ITEM_ID_PAYLOAD_NOT_CLOSED')
          # Do not ship invalid rows that lack canonical item identity.
          if 'item_id:_uploadFileData[u].item_id||null' not in s: raise SystemExit('UPLOAD_CANONICAL_ITEM_ID_MISSING')
          if re.search(r"supabase\\.from\\(['\"]stock_branches['\"]\\)\\s*\\.\s*(?:insert|update|upsert|delete)\\s*\\(",s,re.I): raise SystemExit('NEW_MAIN_DIRECT_STOCK_WRITER_DETECTED')
          if s.lower().count('</html>')!=1 or s.lower().count('</body>')!=1: raise SystemExit('DOCUMENT_CLOSURE_INVALID')
          scripts=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',s,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(scripts)!=1: raise SystemExit('INLINE_RUNTIME_COUNT_INVALID')
          js=Path(tempfile.gettempdir())/'p124-final.js';js.write_text(scripts[0].group('b'),encoding='utf-8');r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          required=['rw-login-page','rw-main-shell','rw-page-container','rw-header-title','rw-header-subtitle','rw-sidebar-nav','rw-logout-btn','window.RW_ShellContext','window.RW_OwnerLicense','window.RW_Views','window.RW_Dashboard','window.RW_Items','window.RW_POS','window.RW_Orders','window.RW_Runsheets','window.RW_Purchases','window.RW_Warehouse','window.RW_Finance','window.RW_Reports','window.RW_HR','window.RW_CRM','_clickNotif','_renderAndSave','_updateBadge','markRead','bulk-stock-adjustment']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('TARGET_CONTRACT_MISSING:'+','.join(missing))
          if hashlib.sha256(legacy.read_bytes()).hexdigest()!=before: raise SystemExit('LEGACY_MAIN_HTML_CHANGED')
          if not changed: raise SystemExit('NO_TARGET_REPAIR_DELTA')
          p.write_text(s,encoding='utf-8')
          subprocess.run(['git','config','user.name','rawaea-p124-bot'],check=True);subprocess.run(['git','config','user.email','rawaea-p124-bot@users.noreply.github.com'],check=True);subprocess.run(['git','add','Current/PWA/New-main'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode==0: raise SystemExit('TARGET_DELTA_NOT_STAGED')
          subprocess.run(['git','commit','-m','fix: close New-main bulk stock item identity contract'],check=True);subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print('P124_TARGET_REPAIR_COMMITTED',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
