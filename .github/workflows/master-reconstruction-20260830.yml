name: RAWAEA FINAL MAIN.HTML RECONSTRUCTION — 20260831

on:
  push:
    branches: [main]
    paths-ignore:
      - Current/PWA/main.reconstruction.html
      - Current/CTO/**

permissions:
  contents: write

jobs:
  reconstruct:
    if: >-
      !contains(github.event.head_commit.message, '[master-reconstruction-candidate]') &&
      !contains(github.event.head_commit.message, '[master-reconstruction-executor]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build candidate from verified current source
        run: python3 tools/final_main_reconstruction_20260831.py

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('Current/PWA/main.reconstruction.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(scripts,1):
              p=Path(tempfile.gettempdir())/f'rw-main-{i}.js'; p.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'JS_SYNTAX_FAIL_{i}')
          print('JS_SYNTAX_PASS',len(scripts))
          PY

      - name: Candidate browser smoke gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rw-pwa; mkdir -p /tmp/rw-pwa
          cp -r Current/PWA/. /tmp/rw-pwa/
          cp Current/PWA/main.reconstruction.html /tmp/rw-pwa/main.html
          python3 -m http.server 8123 --directory /tmp/rw-pwa >/tmp/rw-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(4000);
            const r=await page.evaluate(()=>({title:document.title,lang:document.documentElement.lang,body:!!document.body,rwState:!!window.RW_STATE,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract,sw:'serviceWorker' in navigator}));
            console.log(JSON.stringify({r,pageErrors}));
            if(r.lang!=='ar'||!r.body||!r.rwState||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||pageErrors.length) process.exit(2);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE

      - name: Persist candidate evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA Final Reconstruction'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260831_MAIN_HTML_RECONSTRUCTION_CANDIDATE.md <<'EOF'
# RAWAEA ERP — FINAL MAIN.HTML RECONSTRUCTION CANDIDATE

Candidate-only build. `Current/PWA/main.html` is intentionally unchanged in this run.

Gates:
- current Git/Production state reconciled before build;
- current main.html behavioral seed;
- governed shell transformation applied to candidate only;
- contract ledger;
- original symbol parity;
- structural HTML/script/style parity;
- no direct stock/inventory_log writer;
- tenant and OWNER contract guards;
- JavaScript syntax;
- browser smoke.
EOF
          git add Current/PWA/main.reconstruction.html Current/CTO/MAIN_HTML_CURRENT_CONTRACT_LEDGER.json Current/CTO/20260831_MAIN_HTML_RECONSTRUCTION_CANDIDATE.md
          git diff --cached --quiet && { echo 'NO_CANDIDATE_ARTIFACT'; exit 1; }
          git commit -m '[master-reconstruction-candidate] persist verified main.html candidate'
          git push origin HEAD:main
