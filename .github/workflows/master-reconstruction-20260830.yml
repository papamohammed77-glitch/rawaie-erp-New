name: RAWAEA TEMP TARGET-ONLY CTO EXECUTOR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  target:
    if: ${{ contains(github.event.head_commit.message, '[CTO-EXECUTE-NOW]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Reconstruct New-main from governed fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_final_main_reconstruction_20260831.py
      - name: Execute P163 and Gold gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          required=['main1Delegation','actions','/* RAWAEA MAIN2 AUTHORITATIVE MODULE */','MAIN3','post_stock_movement','reserve_stock','save_sales_invoice_atomic','edgeCall','supabaseClient']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('RECONSTRUCTION_CONTRACT_MISSING:'+repr(missing))
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'; auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          if s.count(compat)!=1 or s.count(auth)!=1: raise SystemExit(f'P163_OWNER_COUNTS compat={s.count(compat)} auth={s.count(auth)}')
          a=s.index(compat); b=s.index(auth)
          if b<=a: raise SystemExit('P163_OWNER_ORDER_INVALID')
          s=s[:a]+s[b:]
          for alias in ['window.RW_Dashboard={render:renderDashboard};','window.RW_Items={render:renderItems};']:
            if s.count(alias)!=1: raise SystemExit(f'P163_ALIAS_COUNT_INVALID:{alias}:{s.count(alias)}')
            s=s.replace(alias,'',1)
          close='window.RW_Items=RW_Items;'; version="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"; governed='// MAIN2_GOVERNED_CLOSED:v1'
          if s.count(close)!=1: raise SystemExit('P163_RW_ITEMS_OWNER_INVALID')
          if s.count(version)>1 or s.count(governed)>1: raise SystemExit('P163_CLOSURE_DUPLICATE')
          if version not in s: s=s.replace(close,close+'\n'+version,1)
          if governed not in s: s=s.replace(version,version+'\n'+governed,1)
          checks={'compat_absent':compat not in s,'auth_one':s.count(auth)==1,'version_one':s.count(version)==1,'governed_one':s.count(governed)==1,'dashboard_alias_absent':'window.RW_Dashboard={render:renderDashboard};' not in s,'items_alias_absent':'window.RW_Items={render:renderItems};' not in s,'actions_preserved':'actions' in s,'delegation_preserved':'main1Delegation' in s,'main3_preserved':'MAIN3' in s,'rw_items_authority':s.count(close)==1}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('P163_GATES_FAILED:'+repr(bad))
          if re.search(r"\.from\(['\"]stock_branches['\"]\)[\s\S]{0,1200}\.(?:insert|update|upsert|delete)\(",s): raise SystemExit('DIRECT_STOCK_WRITER')
          if re.search(r"\.from\(['\"]inventory_log['\"]\)[\s\S]{0,800}\.insert\(",s): raise SystemExit('DIRECT_INVENTORY_LOG_WRITER')
          if s.lower().count('<script')!=s.lower().count('</script>'): raise SystemExit('SCRIPT_BALANCE')
          if s.lower().count('<style')!=s.lower().count('</style>'): raise SystemExit('STYLE_BALANCE')
          if len(re.findall(r'navigator\.serviceWorker\.register',s))>1: raise SystemExit('SW_DUPLICATE')
          p.write_text(s,encoding='utf-8')
          print('P163_GOLD_OK bytes='+str(len(s.encode()))+' sha256='+hashlib.sha256(s.encode()).hexdigest())
          print(checks)
          PY
      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit(f'INLINE_RUNTIME_COUNT={len(ms)}')
          Path('/tmp/new-main.js').write_text(ms[0].group('b'),encoding='utf-8')
          PY
          node --check /tmp/new-main.js
      - name: Browser smoke gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 --directory Current/PWA >/tmp/rawaea-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200);const x=await p.evaluate(async()=>{const flat=[];(function walk(a){(a||[]).forEach(v=>{if(v.view)flat.push(v.view);if(v.submenu)walk(v.submenu)})})(window.RW_Navigation&&window.RW_Navigation.menuTree);const req=['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'];const critical=req.every(v=>flat.includes(v));const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'].every(v=>!!window[v]);let denied=false;if(window.RW_Navigation&&window.RW_Navigation.navigate){window.RW_STATE.app.currentUser={isOwner:false};try{await window.RW_Navigation.navigate('license')}catch(e){denied=e.message==='OWNER_ONLY'}}return {critical,mods,denied,menuCount:flat.length};});console.log(JSON.stringify({x,pe,ce}));if(pe.length||ce.length||!x.critical||!x.mods||!x.denied||x.menuCount<30)process.exit(2);await b.close();})().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Record closure state and commit successful candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          target=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          state=Path('CURRENT_STATE.md')
          st=state.read_text(encoding='utf-8')
          marker='P163 CLOSED — MAIN2 ownership surgery + governed New-main reconstruction'
          if marker not in st:
              st=st.rstrip()+f"\n\n## CTO EXECUTION — 2026-09-03\n\n{marker}\n- Target: `Current/PWA/New-main`\n- Target SHA-256: `{hashlib.sha256(target.encode()).hexdigest()}`\n- Reconstruction source: `Current/PWA/main/main1.md` through `main11.md`; `Original/PWA/main/*` remained evidence-only.\n- P163: duplicate MAIN2 compatibility removed; legacy Main1 dashboard/items aliases removed; `actions`, `main1Delegation`, and MAIN3 preserved; governed reconstruction marker retained under authoritative MAIN2 owner.\n- Static gates: JS syntax, HTML script/style balance, SW uniqueness, no direct stock/inventory-log writers.\n- Browser smoke: required module/menu/owner-boundary checks passed.\n- Production database writes: none.\n"
              state.write_text(st,encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'fix(cto): complete New-main reconstruction and P163 ownership [CTO-EXECUTED] [skip ci]'
          git push origin HEAD:main
