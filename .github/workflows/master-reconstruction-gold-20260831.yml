name: RAWAEA Master Reconstruction GOLD 20260831

on:
  push:
    branches: [reconstruction-gold-20260831]

permissions:
  contents: write

jobs:
  gold-reconstruction:
    if: !contains(github.event.head_commit.message, '[gold-pipeline]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate 0/checkout frozen world
        uses: actions/checkout@v4
        with:
          ref: reconstruction-gold-20260831
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gate 0-4 forensic build and parity
        run: |
          set -euo pipefail
          python3 tools/gold_reconstruction.py
          test -f Current/PWA/main.reconstruction.html
          test -f Current/CTO/RECONSTRUCTION_BASELINE.json
          test -f Current/CTO/parity.json

      - name: Gate 5 install Playwright
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Gate 5 Playwright
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --directory Current/PWA >/tmp/rw_http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python3 tools/playwright_reconstruction.py

      - name: Gate 7 fresh baseline comparison
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          b=json.loads(Path('Current/CTO/RECONSTRUCTION_BASELINE.json').read_text())
          c=Path('Current/PWA/main.reconstruction.html')
          m=Path('Current/PWA/main.html')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          if sha(m) != b['current_main']['sha256']:
              raise SystemExit('GATE7_FAIL_CURRENT_MAIN_CHANGED')
          if not c.exists() or c.stat().st_size < 100000:
              raise SystemExit('GATE7_FAIL_CANDIDATE_TOO_SMALL')
          print('GATE7_PASS candidate_sha256=' + sha(c))
          PY

      - name: Persist evidence on reconstruction branch
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA Gold Reconstruction'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/MASTER_RECONSTRUCTION_GATE_STATUS.md <<'EOF'
          # MASTER RECONSTRUCTION — Gate 0–7

          Gate 0 — CURRENT WORLD FROZEN: PASS
          Gate 1 — CANONICAL REGISTRIES: PASS (generated by pipeline)
          Gate 2 — GAP SURFACE: must be zero before success
          Gate 3 — main.reconstruction.html: PASS when candidate generated
          Gate 4 — AUTOMATED PARITY: PASS when workflow reaches this point
          Gate 5 — PLAYWRIGHT: PASS for unauthenticated browser smoke; authenticated flows are skipped unless governed credentials/test facility exist
          Gate 6 — PRODUCTION CONTRACT VERIFICATION: performed separately against live Supabase before replacement
          Gate 7 — FRESH BASELINE: PASS
          Gate 8–10 — NOT YET AUTHORIZED BY THIS WORKFLOW
          EOF
          git add Current/PWA/main.reconstruction.html Current/CTO/RECONSTRUCTION_BASELINE.json Current/CTO/parity.json Current/CTO/playwright-result.json Current/CTO/MASTER_RECONSTRUCTION_GATE_STATUS.md
          git commit -m '[gold-pipeline] persist Gate 0-7 evidence and candidate' || true
          git push origin HEAD:reconstruction-gold-20260831
