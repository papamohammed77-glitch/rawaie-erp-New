name: P0 Main ERP Shell Repair (PR)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  repair:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Execute governed repair
        run: python3 tools/p0_main_shell_repair_v2.py
      - name: Validate repaired shell
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          required=['window.RW_ShellContext','window.RW_OwnerContract','window.RW_SettingsIdentity','window.RW_ShellBranding']
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          if "meta.permissions || ['*']" in s: raise SystemExit('wildcard fallback remains')
          if re.search(r"\.from\('app_settings'\)\.select\('\*'\)\.limit\(1\)",s): raise SystemExit('global app_settings remains')
          if '.from(\'inventory_log\').insert' in s: raise SystemExit('direct inventory_log writer remains')
          if re.search(r"\.from\('stock_branches'\).*\.update",s,re.S): raise SystemExit('direct stock writer remains')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(scripts,1):
              p=Path(tempfile.gettempdir())/f'rw_main_{i}.js';p.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'syntax failure {i}')
          print('CRITICAL_MAIN_PWA_SOURCE_VALID',len(scripts))
          PY
          git diff --check
      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA Critical Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_PWA_CRITICAL_REPAIR.md <<'EOF'
# RAWAEA ERP — Critical Main PWA Restoration — 2026-08-29

Executed by governed PR workflow.
Scope: authenticated tenant context, app_settings-backed identity/branding, currency/settings continuity, fail-closed bootstrap, and Owner/license protection.

Browser E2E remains a separate gate.
EOF
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_PWA_CRITICAL_REPAIR.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: critical main pwa restoration complete'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
