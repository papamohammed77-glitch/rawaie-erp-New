name: Vouchers forensic finalizer 20260820
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[vouchers-finalize]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch current Gold Master only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/vouchers.html')
          text=p.read_text(encoding='utf-8')
          marker='</script><script src="../register-sw.js"></script>'
          if marker not in text:
              raise SystemExit('REGISTER_SW_MARKER_NOT_FOUND')
          if 'RW_VOUCHERS_BRANCH_LINK_FORENSIC_20260820' in text:
              raise SystemExit('PATCH_ALREADY_PRESENT')
          patch=r'''\n<script data-rw-vouchers-forensic="RW_VOUCHERS_BRANCH_LINK_FORENSIC_20260820">\n(function(){\n  'use strict';\n  if(typeof App==='undefined'||typeof supabase==='undefined')return;\n  var oldLoadRefs=App.loadRefs,oldPickArr=App.pickArr,oldPickSearch=App.pickSearch,oldPickSelect=App.pickSelect,oldRouteHtml=App.routeHtml,oldSummary=App.summary,oldSubmit=App.submit;\n  function norm(v){return App.norm?App.norm(v):String(v==null?'':v).toLowerCase().trim()}\n  function esc(v){return App.esc?App.esc(v):String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\"/g,'&quot;').replace(/'/g,'&#39;')}\n  function allowed(v){if(v==null)return[];if(Array.isArray(v))return v.map(String);var s=String(v).trim();if(!s)return[];try{var j=JSON.parse(s);if(Array.isArray(j))return j.map(String);if(typeof j==='string')return[j]}catch(e){}return s.split(',').map(function(x){return x.trim()}).filter(Boolean)}\n  function branchMatch(user,branch){if(!user||!branch)return false;if(String(user.default_branch_id||'')===String(branch.id))return true;var a=allowed(user.allowed_branch_ids),id=String(branch.id),code=String(branch.branch_code||'');return a.indexOf(id)>=0||a.indexOf(code)>=0}\n  function label(x,type){if(!x)return'';return type==='rep'?(x.name||x.email||''):type==='vehicle'?(x.vehicle_code||x.license_plate||x.model||''):(x.name||x.supplier_code||'')}\n  function score(x,q,type){if(!q)return 1;var a='',b='',c='';if(type==='rep'){a=norm(x.name);b=norm(x.email);c=norm(x.phone)}else if(type==='vehicle'){a=norm(x.vehicle_code);b=norm(x.license_plate);c=norm(x.model)}else{a=norm(x.name);b=norm(x.supplier_code);c=norm(x.phone)}return a===q||b===q||c===q?140:a.indexOf(q)===0||b.indexOf(q)===0||c.indexOf(q)===0?110:a.indexOf(q)>=0||b.indexOf(q)>=0||c.indexOf(q)>=0?65:0}\n  App.loadRefs=function(){var s=this;return Promise.all([Promise.resolve(oldLoadRefs.call(this)),supabase.from('users').select('id,name,email,phone,role,status,default_branch_id,allowed_branch_ids').eq('company_id',s.company).eq('status','Active').eq('role','مندوب بيع مباشر').order('name'),supabase.from('purchase_orders').select('supplier_id,branch_id').eq('company_id',s.company).not('supplier_id','is',null),supabase.from('vehicles').select('id,vehicle_code,license_plate,model,driver_id,status').eq('company_id',s.company).eq('status','Active').order('vehicle_code'),supabase.from('suppliers').select('id,supplier_code,name,search_label,phone,is_active').eq('company_id',s.company).eq('is_active',true).order('name')]).then(function(r){if(r[1].error)throw r[1].error;if(r[2].error)throw r[2].error;if(r[3].error)throw r[3].error;if(r[4].error)throw r[4].error;s.refs=s.refs||{};s.refs.reps=r[1].data||[];s.refs.vehicles=r[3].data||[];s.refs.suppliers=r[4].data||[];s.refs.supplierBranchMap={};(r[2].data||[]).forEach(function(x){if(x.supplier_id&&x.branch_id)(s.refs.supplierBranchMap[x.branch_id]||(s.refs.supplierBranchMap[x.branch_id]={}))[x.supplier_id]=1});return s.refs})};\n  App.pickArr=function(key){var s=this,branchId=(document.getElementById('wsFrom')||{}).value||'',branch=(s.refs.branches||[]).find(function(b){return b.id===branchId});if(key==='wsRep')return(s.refs.reps||[]).filter(function(r){return !branch||branchMatch(r,branch)});if(key==='wsTo'&&s.type==='DirectSale'){var rid=(document.getElementById('wsRep')||{}).value||'';return(s.refs.vehicles||[]).filter(function(v){var rep=(s.refs.reps||[]).find(function(r){return r.id===v.driver_id});return !!rid&&v.driver_id===rid&&v.status==='Active'&&(!branch||branchMatch(rep,branch))})}if(key==='wsFrom'&&s.type==='DirectReturn'){return(s.refs.vehicles||[]).filter(function(v){var rep=(s.refs.reps||[]).find(function(r){return r.id===v.driver_id});return !branch||branchMatch(rep,branch)})}if(key==='wsTo'&&s.type==='SupplierReturn'){var map=(s.refs.supplierBranchMap||{})[branchId];if(map&&Object.keys(map).length){var ids=Object.keys(map);var f=(s.refs.suppliers||[]).filter(function(x){return ids.indexOf(x.id)>=0});if(f.length)return f}return s.refs.suppliers||[]}return oldPickArr.call(this,key)};\n  App.pickSearch=function(key,q){var type=key==='wsRep'?'rep':key==='wsTo'&&this.type==='DirectSale'?'vehicle':key==='wsFrom'&&this.type==='DirectReturn'?'vehicle':key==='wsTo'&&this.type==='SupplierReturn'?'supplier':null;if(!type)return oldPickSearch.call(this,key,q);var s=this,arr=this.pickArr(key)||[],z=norm(q),box=document.getElementById(key+'Menu');if(!box)return;var rows=arr.map(function(x){return{x:x,score:score(x,z,type)}}).filter(function(o){return o.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,15);box.innerHTML=rows.length?rows.map(function(o){var x=o.x;return'<div class="smart-row" onclick="App.pickSelect(\\''+key+'\\',\\''+esc(x.id)+'\\')"><div><b class="text-xs text-white">'+esc(label(x,type))+'</b><div class="smart-code">'+esc(type==='vehicle'?(x.license_plate||x.vehicle_code||''):(type==='rep'?(x.email||x.phone||''):(x.supplier_code||x.phone||'')))+'</div></div><span class="text-[9px] text-emerald-400">اختيار</span></div>'}).join(''):'<div class="smart-empty">'+esc(type==='rep'?'لا يوجد مندوب بيع مباشر مرتبط بالفرع المختار':type==='vehicle'?'لا توجد مركبة فعالة مرتبطة بالفرع/المندوب المختار':'لا يوجد مورد مرتبط تاريخيًا بهذا الفرع؛ تم عرض موردي الشركة')+'</div>';box.classList.remove('hidden')};\n  App.pickSelect=function(key,id){var s=this;if(key==='wsRep'){var r=(s.refs.reps||[]).find(function(x){return x.id===id}),bId=(document.getElementById('wsFrom')||{}).value||'',b=(s.refs.branches||[]).find(function(x){return x.id===bId});if(!r||b&&!branchMatch(r,b))return;document.getElementById('wsRep').value=id;document.getElementById('wsRepSearch').value=label(r,'rep');document.getElementById('wsRepMenu').classList.add('hidden');if(s.type==='DirectSale'){document.getElementById('wsTo').value='';document.getElementById('wsToSearch').value='';document.getElementById('wsToMenu').classList.add('hidden')}s.updateSource();return}if((key==='wsTo'&&s.type==='DirectSale')||(key==='wsFrom'&&s.type==='DirectReturn')){var v=(s.refs.vehicles||[]).find(function(x){return x.id===id});if(!v)return;var rep=(s.refs.reps||[]).find(function(r){return r.id===v.driver_id}),bId=(document.getElementById('wsFrom')||{}).value||'',b=(s.refs.branches||[]).find(function(x){return x.id===bId});if(b&&(!rep||!branchMatch(rep,b)))return;if(key==='wsTo'&&s.type==='DirectSale'){var rid=(document.getElementById('wsRep')||{}).value||'';if(!rid||v.driver_id!==rid)return;document.getElementById('wsTo').value=id;document.getElementById('wsToSearch').value=label(v,'vehicle');document.getElementById('wsToMenu').classList.add('hidden');s.updateSource();return}document.getElementById('wsFrom').value=id;document.getElementById('wsFromSearch').value=label(v,'vehicle');document.getElementById('wsFromMenu').classList.add('hidden');var rh=document.getElementById('wsRep'),rs=document.getElementById('wsRepSearch');if(rh)rh.value=rep?rep.id:'';if(rs)rs.value=rep?label(rep,'rep'):'';s.updateSource();return}if(key==='wsTo'&&s.type==='SupplierReturn'){var sp=(s.refs.suppliers||[]).find(function(x){return x.id===id}),bid=(document.getElementById('wsFrom')||{}).value||'',map=(s.refs.supplierBranchMap||{})[bid];if(!sp||(map&&Object.keys(map).length&&!map[sp.id]))return;document.getElementById('wsTo').value=id;document.getElementById('wsToSearch').value=label(sp,'supplier');document.getElementById('wsToMenu').classList.add('hidden');s.updateSource();return}return oldPickSelect.call(this,key,id)};\n  App.routeHtml=function(){var s=this,t=this.type;function p(k,l,o){o=o||{};return'<div class="smart-field"><input type="hidden" id="'+k+'" value=""><input id="'+k+'Search" class="smart-input" autocomplete="off" '+(o.readonly?'readonly ':'')+'placeholder="'+esc(l)+'" onfocus="App.pickShow(\\''+k+'\\')" oninput="App.pickSearch(\\''+k+'\\',this.value)"><div id="'+k+'Menu" class="smart-menu hidden"></div></div>'}if(t==='DirectSale')return'<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+p('wsFrom','الفرع المصدر — ابحث بالكود أو الاسم')+p('wsRep','مندوب البيع المباشر — مرتبط بالفرع')+p('wsTo','المركبة — مرتبطة بالمندوب المختار')+'</div>';if(t==='DirectReturn')return'<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+p('wsFrom','المركبة المصدر — مرتبطة بالفرع')+p('wsRep','مندوب البيع المباشر — مرتبط بالمركبة',{readonly:true})+p('wsTo','الفرع الوجهة — ابحث بالكود أو الاسم')+'</div>';if(t==='SupplierReturn')return'<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'+p('wsFrom','الفرع المصدر — ابحث بالكود أو الاسم')+p('wsTo','المورد — مرتبط بالفرع عند ثبوت الربط')+'</div>';return oldRouteHtml.call(this)};\n  App.summary=function(){var t='',fr=document.getElementById('wsFrom'),to=document.getElementById('wsTo'),re=document.getElementById('wsRep');if(this.type==='DirectSale'){if(fr&&fr.value)t+='المصدر: '+this.loc(fr.value,'Branch');if(re&&re.value){var r=(this.refs.reps||[]).find(function(x){return x.id===re.value});if(r)t+=(t?' · ':'')+'المندوب: '+label(r,'rep')}if(to&&to.value)t+=(t?' · ':'')+'المركبة: '+this.loc(to.value,'Vehicle');RW_UI.safeText(document.getElementById('routeSummary'),t||'اختر الفرع ثم المندوب ثم المركبة');return}if(this.type==='DirectReturn'){if(fr&&fr.value)t+='المركبة: '+this.loc(fr.value,'Vehicle');if(re&&re.value){var rr=(this.refs.reps||[]).find(function(x){return x.id===re.value});if(rr)t+=(t?' · ':'')+'المندوب: '+label(rr,'rep')}if(to&&to.value)t+=(t?' · ':'')+'الوجهة: '+this.loc(to.value,'Branch');RW_UI.safeText(document.getElementById('routeSummary'),t||'اختر المركبة ثم الفرع الوجهة');return}if(this.type==='SupplierReturn'){if(fr&&fr.value)t+='المصدر: '+this.loc(fr.value,'Branch');if(to&&to.value)t+=(t?' · ':'')+'المورد: '+this.loc(to.value,'Supplier');RW_UI.safeText(document.getElementById('routeSummary'),t||'اختر الفرع ثم المورد');return}return oldSummary.call(this)};\n  App.submit=function(){var s=this;if(this.type==='DirectSale'){var b=document.getElementById('wsFrom'),r=document.getElementById('wsRep'),v=document.getElementById('wsTo');var br=b&&b.value||'',rid=r&&r.value||'',vid=v&&v.value||'',bo=(s.refs.branches||[]).find(function(x){return x.id===br}),rp=(s.refs.reps||[]).find(function(x){return x.id===rid}),vh=(s.refs.vehicles||[]).find(function(x){return x.id===vid});if(!br||!rid||!vid){RW_UI.toast('الفرع والمندوب والمركبة مطلوبة','warning');return}if(!rp||!branchMatch(rp,bo)||!vh||vh.driver_id!==rid){RW_UI.toast('تسلسل المندوب/المركبة غير متسق مع قاعدة البيانات','error');return}}else if(this.type==='DirectReturn'){var vf=document.getElementById('wsFrom'),rr=document.getElementById('wsRep'),bt=document.getElementById('wsTo');var vid2=vf&&vf.value||'',rid2=rr&&rr.value||'',bid2=bt&&bt.value||'',veh=(s.refs.vehicles||[]).find(function(x){return x.id===vid2}),rep2=(s.refs.reps||[]).find(function(x){return x.id===rid2}),br2=(s.refs.branches||[]).find(function(x){return x.id===bid2});if(!vid2||!rid2||!bid2||!veh||!rep2||veh.driver_id!==rid2||!branchMatch(rep2,br2)){RW_UI.toast('المركبة والمندوب والفرع غير متسقة مع قاعدة البيانات','error');return}}else if(this.type==='SupplierReturn'){var bf=document.getElementById('wsFrom'),st=document.getElementById('wsTo'),map2=(s.refs.supplierBranchMap||{})[(bf&&bf.value)||''];if(!bf||!bf.value||!st||!st.value){RW_UI.toast('الفرع والمورد مطلوبان','warning');return}if(map2&&Object.keys(map2).length&&!map2[st.value]){RW_UI.toast('المورد غير مرتبط بالفرع المختار','error');return}}return oldSubmit.apply(this,arguments)};\n  console.info('[VOUCHERS] branch-linked reference forensic repair loaded');\n})();\n</script>'''
          p.write_text(text.replace(marker,patch+marker),encoding='utf-8')
          PY
          python3 - <<'PY'
          import re, pathlib
          t=pathlib.Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',t,re.I)
          pathlib.Path('/tmp/vouchers-all.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'RW_VOUCHERS_BRANCH_LINK_FORENSIC_20260820' in t
          assert 'DirectReturn' in t and 'wsRep' in t and 'supplierBranchMap' in t
          PY
          node --check /tmp/vouchers-all.js
          git config user.name 'RAWAEA Forensic Repair'
          git config user.email 'actions@rawaea.invalid'
          git add Current/PWA/vouchers.html
          git commit -m '[vouchers-finalize] close branch-linked manual voucher pickers'
          git rm .github/workflows/vouchers-forensic-finalize-20260820.yml
          git commit -m '[vouchers-finalize] remove one-shot finalizer'
          git push
