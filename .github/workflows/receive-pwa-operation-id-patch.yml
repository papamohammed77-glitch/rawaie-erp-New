name: patch receive voucher PWA operation id
on:
  push:
    paths:
      - '.github/workflows/receive-pwa-operation-id-patch.yml'
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/main.html')
          s = p.read_text(encoding='utf-8')
          old = "var ses = await supabase.auth.getSession(), token = ses.data.session ? ses.data.session.access_token : null;\n        try {\n            var res = await fetch(RW_SUPABASE_URL + '/functions/v1/receive-stock-voucher', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ voucher_code: voucherCode, receivedItems: result.value }) });"
          new = "var ses = await supabase.auth.getSession(), token = ses.data.session ? ses.data.session.access_token : null;\n        var receiveOperationId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('RCV-' + Date.now() + '-' + Math.random().toString(36).slice(2));\n        try {\n            var res = await fetch(RW_SUPABASE_URL + '/functions/v1/receive-stock-voucher', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, 'Idempotency-Key': receiveOperationId }, body: JSON.stringify({ voucher_code: voucherCode, receivedItems: result.value, operation_id: receiveOperationId }) });"
          if old not in s:
              raise SystemExit('Expected receive-voucher consumer snippet not found; aborting without modification')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target snippet, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff -- Current/PWA/main.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Current/PWA/main.html
          git commit -m "fix: pass stable receive operation id from PWA"
          git push