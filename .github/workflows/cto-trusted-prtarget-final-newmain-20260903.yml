name: CTO Trusted PR Target Final New-main Closure 2026-09-03
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  close:
    if: contains(github.event.pull_request.title, '[CTO-FORENSIC-CLOSE-20260903]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Surgical target closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, hashlib, subprocess
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode('utf-8')) > 400000, 'target unexpectedly small'
          assert '<html lang="ar" dir="rtl">' in s, 'RTL shell missing'
          assert '<link rel="manifest" href="./manifest.json">' in s, 'canonical manifest missing'
          before=s
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          assert 'await window.RW_Auth.enterSystem(authUser);' in s, 'canonical authUser boot contract missing'
          s=s.replace('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>','')
          assert 'register-sw.js' not in s, 'sibling service-worker dependency remains'
          assert not re.search(r'<link[^>]+href=["\']\./[^"\']+\.html["\'][^>]*>',s,re.I), 'sibling HTML dependency remains'
          if 'RAWAEA_FINAL_PRODUCT_CLOSURE' not in s:
              layer='''<script id="RAWAEA_FINAL_PRODUCT_CLOSURE">(function(){'use strict';function E(x){return document.getElementById(x)}function syncBrand(){try{var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},n=String(c.name||'الروائع ERP').trim()||'الروائع ERP',logo=String(c.logo||'').trim(),ln=E('rw-login-company-name')||document.querySelector('.rw-company-name'),sn=E('rw-sidebar-company-name'),lb=E('rw-login-company-logo')||document.querySelector('.rw-login-logo'),sl=E('rw-sidebar-brand-logo');if(ln)ln.textContent=n;if(sn)sn.textContent=n;if(lb&&logo){var im=E('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.alt='شعار الشركة';im.style.cssText='width:100%;height:100%;object-fit:contain;padding:10px';lb.innerHTML='';lb.appendChild(im)}im.src=logo}if(sl&&logo)sl.src=logo}catch(e){}}function patchRoutes(){try{var n=window.RW_Navigation,w=window.RW_Warehouse;if(!n||!w||typeof n.navigate!=='function'||typeof w.loadVoucherForm!=='function')return false;if(n.__finalRoutePatch)return true;var old=n.navigate.bind(n);n.navigate=function(v){if(v==='transfer')return w.loadVoucherForm('Transfer');if(v==='direct-sale')return w.loadVoucherForm('DirectSale');if(v==='direct-return')return w.loadVoucherForm('DirectReturn');if(v==='supplier-return')return w.loadVoucherForm('SupplierReturn');return old.apply(null,arguments)};n.__finalRoutePatch=true;return true}catch(e){return false}}function wire(){syncBrand();if(!patchRoutes())setTimeout(function(){if(!patchRoutes())setTimeout(patchRoutes,600)},100)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire,{once:true});else wire();window.RW_FinalProductClosure={syncBrand:syncBrand,patchRoutes:patchRoutes}})();</script>'''
              cut=s.rfind('</body>'); assert cut>0; s=s[:cut]+'\n'+layer+'\n'+s[cut:]
          assert s.count('RAWAEA_FINAL_PRODUCT_CLOSURE')==1
          for x in ("w.loadVoucherForm('Transfer')","w.loadVoucherForm('DirectSale')","w.loadVoucherForm('DirectReturn')","w.loadVoucherForm('SupplierReturn')"): assert x in s
          m=re.search(r'<script id="RAWAEA_FINAL_PRODUCT_CLOSURE">([\s\S]*?)</script>',s); assert m
          Path('/tmp/final-closure.js').write_text(m.group(1),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/final-closure.js'],check=True)
          mf=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          assert (mf.get('start_url'),mf.get('scope'),mf.get('dir'),mf.get('lang'))==('./New-main','./','rtl','ar')
          p.write_text(s,encoding='utf-8')
          print('TARGET_BYTES='+str(len(s.encode())))
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_CHANGED='+str(s!=before))
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Chromium product gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-pwa && mkdir -p /tmp/rawaea-pwa/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea-pwa/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea-pwa/Current/PWA/manifest.json
          python3 -m http.server 4173 --directory /tmp/rawaea-pwa >/tmp/rawaea-pwa-http.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGE:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
            await page.route('https://**/*',r=>r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};window.Swal={fire:async()=>({}),close(){},showLoading(){}};window.XLSX={};window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:null}),signOut:async()=>({}),resetPasswordForEmail:async()=>({error:null}),getUser:async()=>({data:{user:null},error:null})},from(){return{select(){return this},eq(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null})}}})};'}));
            await page.addInitScript(()=>localStorage.setItem('rawaea_remember_email','remembered@example.com'));
            await page.goto('http://127.0.0.1:4173/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1800);
            const a=await page.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),sidebar:!!document.querySelector('.rw-sidebar'),brand:!!(document.getElementById('rw-login-company-name')||document.querySelector('.rw-company-name')),remember:document.getElementById('rw-remember')?.checked===false&&!!document.getElementById('rw-remember'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',warehouse:typeof RW_Warehouse==='object',notif:typeof RW_Notification?.showPanel==='function',closure:typeof RW_FinalProductClosure==='object',routePatch:!!RW_Navigation?.__finalRoutePatch,manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href'),sw:[...document.scripts].some(s=>(s.src||'').includes('register-sw.js')),menuCount:Array.isArray(RW_Navigation?.menuTree)?RW_Navigation.menuTree.filter(x=>x&&x.view).length:0,logoSize:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0,passwordToggle:!!document.querySelector('.rw-password-toggle')}));
            await page.evaluate(()=>{window.__routeCalls=[];RW_Warehouse.loadVoucherForm=x=>(window.__routeCalls.push(x),x)});
            for(const v of ['transfer','direct-sale','direct-return','supplier-return']) await page.evaluate(v=>RW_Navigation.navigate(v),v);
            const q=await page.evaluate(()=>window.__routeCalls);
            console.log('CTO_FINAL_GATE='+JSON.stringify({a,q,errors}));
            await browser.close();
            const ok=!errors.length&&a.lang==='ar'&&a.dir==='rtl'&&a.login&&a.sidebar&&a.brand&&a.remember&&a.auth&&a.nav&&a.views&&a.shell&&a.owner&&a.warehouse&&a.notif&&a.closure&&a.routePatch&&a.manifest==='.'+'/New-main'&&!a.sw&&a.menuCount>=10&&a.logoSize>=80&&a.passwordToggle&&JSON.stringify(q)===JSON.stringify(['Transfer','DirectSale','DirectReturn','SupplierReturn']);
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo CTO_FINAL_GATE_PASS=YES
      - name: Commit only target to main
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Trusted Final Executor'
          git config user.email 'rawaea-cto-trusted-final@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] [GOLD] [DIAMOND] New-main final product closure'
          git push origin HEAD:main
