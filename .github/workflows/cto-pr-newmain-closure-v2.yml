name: CTO PR New-main Closure Executor v2
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  close:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.event.pull_request.head.ref }}, fetch-depth: 2}
      - name: Patch target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('Current/PWA/New-main');s=p.read_text(encoding='utf-8');assert len(s.encode())>500000
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);')
          s=re.sub(r'<script[^>]+src=["\']\./register-sw\.js["\'][^>]*>\s*</script>','',s,flags=re.I)
          for a,b in [('./pos.html','pos'),('./telesales.html','telesales'),('./buyer.html','purchases'),('./vouchers.html','vouchers'),('./picker.html','picking'),('./loader.html','loading'),('./driver.html','delivery'),('./Returns.html','returns'),('./unloader.html','unloading')]:s=s.replace(a,b)
          for z in ['./pos.html','./telesales.html','./buyer.html','./vouchers.html','./picker.html','./loader.html','./driver.html','./Returns.html','./unloader.html','./register-sw.js']:assert z not in s,z
          marker='RAWAEA_CTO_PR_CLOSURE_FINAL_V2'
          if marker not in s:
            layer=r'''<!-- RAWAEA_CTO_PR_CLOSURE_FINAL_V2 --><style>.rw-login-card{position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,#2563eb,#06b6d4)}.rw-login-logo{width:112px!important;height:112px!important;border-radius:28px!important;overflow:hidden;box-shadow:0 18px 38px rgba(37,99,235,.22);display:grid;place-items:center}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #f1f5f9}.rw-sidebar-user-avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}.rw-sidebar-user-name{font-size:12px;font-weight:900}.rw-sidebar-user-role{font-size:10px;color:#64748b}</style><script id="RAWAEA_CTO_PR_RUNTIME_FINAL_V2">(function(){'use strict';function by(i){return document.getElementById(i)}function db(){return window.RW_SUPABASE_CLIENT||window.__RAWAEA_SUPABASE_CLIENT__||null}function brand(n,l){n=String(n||'الروائع ERP').trim()||'الروائع ERP';var t=by('rw-login-company-name')||document.querySelector('.rw-company-name');if(t){t.id='rw-login-company-name';t.textContent=n}var b=document.querySelector('.rw-login-logo');if(b){var im=by('rw-login-brand-image');if(!im){im=document.createElement('img');im.id='rw-login-brand-image';im.className='rw-login-brand-image';im.alt='شعار الشركة';b.textContent='';b.appendChild(im)}if(l){im.src=String(l);im.style.display='block'}else im.style.display='none'}var s=by('rw-sidebar-company-name');if(s)s.textContent=n}async function sync(){try{var a=window.RW_STATE&&RW_STATE.app||{},c=a.company||{},n=c.name||'الروائع ERP',l=c.logo||c.logo_url||'',q=db();if(q){var r=await q.from('app_settings').select('company_name,company_logo').limit(1).maybeSingle();if(!r.error&&r.data){n=r.data.company_name||n;l=r.data.company_logo||l}}brand(n,l);if(a.currentUser){var top=document.querySelector('.rw-sidebar-top'),box=by('rw-sidebar-user-card');if(top&&!box){box=document.createElement('div');box.id='rw-sidebar-user-card';box.className='rw-sidebar-user';box.innerHTML='<div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name"></div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role"></div></div>';top.appendChild(box)}if(by('rw-sidebar-user-name'))by('rw-sidebar-user-name').textContent=String(a.currentUser.name||'مستخدم');if(by('rw-sidebar-user-role'))by('rw-sidebar-user-role').textContent=String(a.currentUser.role||'—');if(by('rw-sidebar-user-avatar'))by('rw-sidebar-user-avatar').textContent=String(a.currentUser.name||'م').trim().charAt(0)||'م'}}catch(e){}}window.RW_UX=window.RW_UX||{};RW_UX.sync=sync;RW_UX.syncBrand=sync;if(window.RW_Auth){var e0=RW_Auth.enterSystem;RW_Auth.enterSystem=async function(u){var z=await e0.call(this,u);await sync();return z};if(typeof RW_Auth.forgotPassword!=='function')RW_Auth.forgotPassword=async function(){var e=(by('rw-username')&&by('rw-username').value||'').trim();if(!e)throw new Error('أدخل البريد الإلكتروني أولاً');var q=db();if(!q)throw new Error('خدمة المصادقة غير متاحة');var r=await q.auth.resetPasswordForEmail(e,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;return true}}if(window.RW_Navigation&&typeof RW_Navigation.navigate==='function'){var n0=RW_Navigation.navigate;RW_Navigation.navigate=function(v){var t={transfer:'Transfer','direct-sale':'DirectSale','direct-return':'DirectReturn','supplier-return':'SupplierReturn'}[v];if(t&&window.RW_Warehouse&&typeof window.RW_Warehouse.loadVoucherForm==='function'){window.RW_STATE.app.currentView=v;return Promise.resolve(window.RW_Warehouse.loadVoucherForm(t))}return n0.apply(this,arguments)}}sync();setTimeout(sync,500);setTimeout(sync,1500)})();</script>'''
            s=s.replace('</body>',layer+'</body>',1)
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert './New-main.manifest.json' not in s
          p.write_text(s,encoding='utf-8')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Chromium gate on DOM
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1; npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{const html=fs.readFileSync('Current/PWA/New-main','utf8');const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({serviceWorkers:'block'});const pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('@supabase/supabase-js'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){const row=t=>t==='users'?{id:'u',name:'مالك النظام',email:'owner@alrawae.com',role:'Owner',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null}:t==='owner_profile'?{auth_user_id:'auth-owner',license_status:'Active'}:t==='app_settings'?{company_name:'الروائع',company_logo:null}:[];const q=t=>{const o={};for(const k of ['select','eq','neq','in','or','order','limit','range','gte','lte','is','not','contains','filter','update','delete','upsert'])o[k]=function(){return o};o.maybeSingle=async()=>({data:row(t),error:null});o.single=async()=>({data:row(t),error:null});o.then=(f,j)=>Promise.resolve({data:[],error:null}).then(f,j);return o};return{from:q,rpc:async()=>({data:null,error:null}),auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:{id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}}},error:null}),resetPasswordForEmail:async()=>({error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})}}}};`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});return r.continue()});await p.setContent(html,{waitUntil:'load'});await p.waitForTimeout(3000);const out=await p.evaluate(async()=>{const a={login:!!document.getElementById('rw-login-form'),manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',rtl:document.documentElement.dir,auth:typeof RW_Auth,nav:typeof RW_Navigation,wh:typeof RW_Warehouse,brand:document.getElementById('rw-login-company-name')?.textContent||'',routes:{}};if(a.auth!=='object')return a;await RW_Auth.enterSystem({id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}});for(const [v,t] of Object.entries({transfer:'Transfer','direct-sale':'DirectSale','direct-return':'DirectReturn','supplier-return':'SupplierReturn'})){const old=RW_Warehouse.loadVoucherForm;RW_Warehouse.loadVoucherForm=async k=>{window.__route=k;return true};await RW_Navigation.navigate(v);RW_Warehouse.loadVoucherForm=old;a.routes[v]=window.__route}a.company=RW_STATE.app.company.name;return a});console.log('CTO_FINAL_GATE='+JSON.stringify({out,pe,ce}));const ok=!pe.length&&!ce.length&&out.login&&out.manifest==='./manifest.json'&&out.rtl==='rtl'&&out.auth==='object'&&out.nav==='object'&&out.wh==='object'&&out.brand==='الروائع'&&out.company==='الروائع'&&JSON.stringify(out.routes)===JSON.stringify({transfer:'Transfer','direct-sale':'DirectSale','direct-return':'DirectReturn','supplier-return':'SupplierReturn'});await b.close();if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
      - name: Persist target only and clean executor files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/cto-pr-newmain-closure.yml .github/workflows/cto-pr-newmain-closure-v2.yml .github/workflows/cto-pr-newmain-diagnostic-v3.yml || true
          git add Current/PWA/New-main
          git add -u .github/workflows
          test "$(git diff --cached --name-only | grep -v '^Current/PWA/New-main$' | wc -l)" -eq 0
          git config user.name 'CTO Automation';git config user.email 'cto-automation@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main target-only UX runtime closure v2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
