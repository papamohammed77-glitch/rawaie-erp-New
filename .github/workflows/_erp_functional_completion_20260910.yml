 md:grid-cols-3 gap-4"><div class="p-4 rounded-xl bg-gray-50"><b>قيمة المخزون بالتكلفة</b><div class="text-xl font-black">'+money(d.stock_value_at_cost)+' EGP</div></div><div class="p-4 rounded-xl bg-gray-50"><b>انحراف الموازنة</b><div class="text-xl font-black">'+money(d.budget_variance)+' EGP</div></div><div class="p-4 rounded-xl '+(unbalanced?'bg-red-50':'bg-emerald-50')+'"><b>قيود غير متوازنة</b><div class="text-xl font-black">'+unbalanced+'</div></div></div>');};byId('fe-refresh').onclick=load;byId('fe-journal').onclick=function(){RW_Finance.renderSubTab('journal');};await load();}
