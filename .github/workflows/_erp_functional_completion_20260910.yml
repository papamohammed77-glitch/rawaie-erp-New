لأصناف الراكدة وعددها '+d.dormant_items+' وتحديد تصريف/عرض.</li>';if(d.accounts_receivable>0)h+='<li>• متابعة تحصيل الذمم المدينة قبل زيادة الائتمان.</li>';if(d.accounts_payable>0)h+='<li>• جدولة الالتزامات للموردين وفق السيولة المتاحة.</li>';if(!d.low_stock_items&&!d.dormant_items&&!d.accounts_receivable&&!d.accounts_payable)h+='<li>• لا توجد إشارة خطر حرجة وفق البيانات الحالية؛ استمر في المراقبة اليومية.</li>';h+='</ul></div></div>';safeHTML(byId('dc-main'),h);}
