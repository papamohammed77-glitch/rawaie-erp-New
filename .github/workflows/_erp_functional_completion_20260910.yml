name: ERP Functional Completion 20260910

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main2/**'
      - 'supabase/migrations/20260910_enterprise_completion_core.sql'
      - '.github/workflows/_erp_functional_completion_20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[CTO-AUTO]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Read all source and original parts to EOF, pairwise inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          c=Path('Current/PWA/main2');o=Path('Original/PWA/main')
          names=[f'main{i}.md' for i in range(1,12)]
          assert all((c/x).is_file() for x in names)
          assert all((o/x).is_file() for x in names)
          rows=[]
          for n in names:
              ct=(c/n).read_text(encoding='utf-8')
              ot=(o/n).read_text(encoding='utf-8')
              rows.append({'main':n,'current_sha256':hashlib.sha256(ct.encode()).hexdigest(),'original_sha256':hashlib.sha256(ot.encode()).hexdigest(),'current_lines':len(ct.splitlines()),'original_lines':len(ot.splitlines()),'current_bytes':len(ct.encode()),'original_bytes':len(ot.encode()),'current_functions':len(re.findall(r'\b(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(',ct)),'original_functions':len(re.findall(r'\b(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(',ot))})
          Path('/tmp/main_matrix.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          assert not any('قيد التطوير' in (c/n).read_text(encoding='utf-8') for n in names)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          print('EOF_PAIRWISE_READ=PASS')
          PY

      - name: Surgical functional completion in Current only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          c=Path('Current/PWA/main2')

          # Main1: expose the completed Store / Finance / Decision capabilities in navigation.
          p=c/'main1.md'; s=p.read_text(encoding='utf-8')
          old="{ icon: 'fa-chart-line', label: 'إدارة المبيعات', submenu: [{ view: 'telesales', label: 'التلي سيلز' }, { view: 'customers', label: 'العملاء' }, { view: 'online-store', label: 'المتجر الإلكتروني' }, { view: 'pos', label: 'نقطة البيع' }, { view: 'orders', label: 'أوردرات المبيعات' }, { view: 'runsheets', label: 'الرانشيتات' }] }"
          new="{ icon: 'fa-chart-line', label: 'إدارة المبيعات', submenu: [{ view: 'telesales', label: 'التلي سيلز' }, { view: 'customers', label: 'العملاء' }, { view: 'online-store', label: 'المتجر الإلكتروني' }, { view: 'store-admin', label: 'إدارة المتجر والعروض' }, { view: 'pos', label: 'نقطة البيع' }, { view: 'orders', label: 'أوردرات المبيعات' }, { view: 'runsheets', label: 'الرانشيتات' }] }"
          if old in s: s=s.replace(old,new,1)
          old2="{ action: 'showFinanceTab', arg: 'reports', label: 'التقارير المالية' }, { view: 'settlement', label: 'إغلاق اليومية' }] }"
          new2="{ action: 'showFinanceTab', arg: 'reports', label: 'التقارير المالية' }, { view: 'finance-control', label: 'مركز الرقابة المالية' }, { view: 'settlement', label: 'إغلاق اليومية' }] }"
          if old2 in s: s=s.replace(old2,new2,1)
          old3="{ view: 'reports-dashboard', label: 'لوحة القيادة' },\n    { view: 'reports-detailed', label: 'التقارير التفصيلية' },"
          new3="{ view: 'reports-dashboard', label: 'لوحة القيادة' },\n    { view: 'decision-center', label: 'مركز القرار التنفيذي' },\n    { view: 'reports-detailed', label: 'التقارير التفصيلية' },"
          if old3 in s: s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')

          # Main11: replace explicit placeholders with live document controls.
          p=c/'main11.md'; s=p.read_text(encoding='utf-8')
          s=s.replace("html += '<div class=\"border-2 border-dashed rounded-xl p-6 text-center w-40\"><i class=\"fa-solid fa-id-card text-3xl text-gray-400\"></i><p class=\"text-xs mt-2\">صورة الهوية</p><p class=\"text-xs text-gray-400\">(قيد التطوير)</p></div>';\n        html += '<div class=\"border-2 border-dashed rounded-xl p-6 text-center w-40\"><i class=\"fa-solid fa-file-contract text-3xl text-gray-400\"></i><p class=\"text-xs mt-2\">عقد العمل</p><p class=\"text-xs text-gray-400\">(قيد التطوير)</p></div>';", "html += '<div class=\"border-2 rounded-xl p-4 text-center w-48 bg-white\"><i class=\"fa-solid fa-id-card text-3xl text-blue-500\"></i><p class=\"text-xs mt-2 font-bold\">صورة الهوية</p><button type=\"button\" class=\"mt-2 bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold\" onclick=\"RW_HR_Documents.openUpload(\\'"+'"+emp.id+"+'\\',\\'identity\\')\">رفع / استبدال</button><div id=\"hr-doc-identity-"+'"+emp.id+"+'\" class=\"text-xs text-gray-400 mt-2\"></div></div>';\n        html += '<div class=\"border-2 rounded-xl p-4 text-center w-48 bg-white\"><i class=\"fa-solid fa-file-contract text-3xl text-emerald-500\"></i><p class=\"text-xs mt-2 font-bold\">عقد العمل</p><button type=\"button\" class=\"mt-2 bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-bold\" onclick=\"RW_HR_Documents.openUpload(\\'"+'"+emp.id+"+'\\',\\'contract\\')\">رفع / استبدال</button><div id=\"hr-doc-contract-"+'"+emp.id+"+'\" class=\"text-xs text-gray-400 mt-2\"></div></div>';",1)
          p.write_text(s,encoding='utf-8')

          # Main6: append a real store administration surface backed by Production items/orders.
          p=c/'main6.md'; s=p.read_text(encoding='utf-8')
          if 'RW_OnlineStoreAdmin' not in s:
              s += r'''
// ============================================================
