    h+='</tbody></table></div>'; safeHTML(box,h); box.querySelectorAll('.osa-save').forEach(function(btn){btn.onclick=async function(){var id=btn.dataset.id,payload={};box.querySelectorAll('[data-id="'+id+'"][data-k]').forEach(function(el){var k=el.dataset.k;payload[k]=el.type==='checkbox'?el.checked:el.value;});payload.sales_price=Number(payload.sales_price||0);payload.discount_percent=Number(payload.discount_percent||0);payload.max_qty_per_order=payload.max_qty_per_order===''?null:Number(payload.max_qty_per_order);payload.sort_order=Number(payload.sort_order||0);var rr=await supabase.from('items').update(payload).eq('id',id).eq('company_id',companyId);if(rr.error)showToast(rr.error.message,'error');else{RW_Audit_log('update','items',id,null,payload);showToast('تم تحديث إعدادات المتجر','success');}};});
