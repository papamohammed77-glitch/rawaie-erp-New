          c=Path('Current/PWA/main2');out=Path('/tmp/assembled-main.html');names=[f'main{i}.md' for i in range(1,12)]
          text=''.join((c/n).read_text(encoding='utf-8') for n in names);out.write_text(text,encoding='utf-8')
          assert text.lower().count('<html')==1 and text.lower().count('</html>')==1
          assert text.lower().count('<body')==1 and text.lower().count('</body>')==1
          assert text.lower().count('<script')==text.lower().count('</script>')
          assert '(قيد التطوير)' not in text
          # hard stubs/placeholder markers in the current source set
          bad=[]
          for pat in ['coming soon','placeholder','todo:','not implemented','قيد التطوير','غير مكتمل']:
              if re.search(re.escape(pat),text,re.I): bad.append(pat)
          assert not bad, bad
          print('ASSEMBLY_BOUNDARIES=PASS')
          print('ASSEMBLY_SHA256='+hashlib.sha256(text.encode()).hexdigest())
          PY

      - name: Parse complete parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('/tmp/assembled-main.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert blocks
          for code in blocks:
              p=Path(tempfile.mkstemp(suffix='.js')[1]);p.write_text(code,encoding='utf-8')
              try: subprocess.run(['node','--check',str(p)],check=True)
              finally:p.unlink(missing_ok=True)
          print('FULL_PARENT_NODE_PARSE=PASS')
          PY

