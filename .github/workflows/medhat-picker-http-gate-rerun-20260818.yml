          scripts=[z for z in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',s,re.I) if not re.search(r'\\bsrc\\s*=',z.group('a') or '',re.I)]
          if len(scripts)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
