name: P124 MAIN1 Surgical Target Gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  p124-surgical:
    if: ${{ contains(github.event.head_commit.message, 'P124 surgical persist') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact current target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Surgical repair only — Browser E2E paused
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess, tempfile

          target=Path('Current/PWA/New-main')
          legacy=Path('Current/PWA/main.html')
          if not target.is_file() or not target.stat().st_size: raise SystemExit('TARGET_MISSING')
          if not legacy.is_file() or not legacy.stat().st_size: raise SystemExit('LEGACY_MAIN_MISSING')
          before=hashlib.sha256(legacy.read_bytes()).hexdigest()
          s=target.read_text(encoding='utf-8')

          old1="if(mappedItem)_uploadFileData[f].item_code=mappedItem.item_code;"
          new1="if(mappedItem){_uploadFileData[f].item_code=mappedItem.item_code;_uploadFileData[f].item_id=mappedItem.id;}"
          old2="items.push({item_code:_uploadFileData[u].item_code||_uploadFileData[u].barcode,qty:_uploadFileData[u].qty});"
          new2="items.push({item_id:_uploadFileData[u].item_id||null,item_code:_uploadFileData[u].item_code||_uploadFileData[u].barcode,qty:_uploadFileData[u].qty});"
          changed=False
          if old1 in s: s=s.replace(old1,new1,1); changed=True
          if old2 in s: s=s.replace(old2,new2,1); changed=True
          if new1 not in s: raise SystemExit('UPLOAD_ITEM_ID_MAPPING_NOT_CLOSED')
          if new2 not in s: raise SystemExit('UPLOAD_ITEM_ID_PAYLOAD_NOT_CLOSED')

          # No direct physical-stock DML in New-main.
          if re.search(r"supabase\\.from\\(['\"]stock_branches['\"]\\)\\s*\\.\s*(?:insert|update|upsert|delete)\\s*\\(",s,re.I):
              raise SystemExit('NEW_MAIN_DIRECT_STOCK_WRITER_DETECTED')

          # One document, one inline script, and valid JS.
          if s.lower().count('</html>') != 1 or s.lower().count('</body>') != 1:
              raise SystemExit('DOCUMENT_CLOSURE_INVALID')
          scripts=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',s,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(scripts)!=1: raise SystemExit('INLINE_RUNTIME_COUNT_INVALID')
          js=Path(tempfile.gettempdir())/'p124-new-main.js'; js.write_text(scripts[0].group('b'),encoding='utf-8')
          r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          required=['rw-login-page','rw-main-shell','rw-page-container','rw-header-title','rw-header-subtitle','rw-sidebar-nav','rw-logout-btn','window.RW_ShellContext','window.RW_OwnerLicense','window.RW_Views','window.RW_Dashboard','window.RW_Items','window.RW_POS','window.RW_Orders','window.RW_Runsheets','window.RW_Purchases','window.RW_Warehouse','window.RW_Finance','window.RW_Reports','window.RW_HR','window.RW_CRM','_clickNotif','_renderAndSave','_updateBadge','markRead','bulk-stock-adjustment']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('TARGET_CONTRACT_MISSING:'+','.join(missing))

          if changed: target.write_text(s,encoding='utf-8')
          after=hashlib.sha256(legacy.read_bytes()).hexdigest()
          if after!=before: raise SystemExit('LEGACY_MAIN_HTML_CHANGED')
          print('P124_STATIC_GATE_PASS', {'changed':changed,'target_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'browser_e2e':'PAUSED_BY_DIRECTIVE'})
          if not changed: raise SystemExit('NO_SURGICAL_TARGET_DELTA')
          subprocess.run(['git','config','user.name','rawaea-p124-bot'],check=True)
          subprocess.run(['git','config','user.email','rawaea-p124-bot@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','Current/PWA/New-main'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','fix: align New-main bulk stock payload with atomic adjustment contract'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)
          else: raise SystemExit('EXPECTED_TARGET_DELTA_NOT_STAGED')
          PY
