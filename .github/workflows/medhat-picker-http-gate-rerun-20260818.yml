name: Medhat picker Production HTTP gate rerun
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Reconstruct New-main from governed MAIN1-MAIN11
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('recon','tools/run_final_main_reconstruction_20260831.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          def fixed(chunks):
              first=m.re.search(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*)',chunks[0],m.re.I)
              if not first: raise RuntimeError('MAIN1_INLINE_SCRIPT_MISSING')
              body=first.group(1)
              for idx in range(1,len(chunks)+1):
                  if idx>1: body+='\\n\\n'+chunks[idx-1]
                  if idx<2: continue
                  f=Path('/tmp')/f'rawaea-phase-{idx}.js'; f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: raise RuntimeError('JS_PHASE_SYNTAX_FAIL main%d\\n%s'%(idx,r.stderr))
          m.validate_phase_js=fixed
          m.main()
          PY
      - name: Execute exact P163 ownership surgery and Gold Diamond closure
