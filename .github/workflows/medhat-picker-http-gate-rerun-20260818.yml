name: Medhat picker Production HTTP gate rerun
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[new-main-target-persist]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Close GOLD DIAMOND on published target only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          scripts=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',s,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(scripts)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
          m=scripts[0]; body=m.group('b').replace("\\\\'","\\'")
          patch=r'''
