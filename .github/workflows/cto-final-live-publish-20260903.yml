          if(u.includes('cdn.jsdelivr.net/npm/chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});
          if(u.includes('cdn.jsdelivr.net/npm/sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){}};'});
          if(u.includes('cdn.sheetjs.com'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});
          return r.continue()});
          p.on('pageerror',e=>errors.push('PAGE:'+e.message));p.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
          await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1000);
          const base=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const m=await(await fetch(l.href)).json();const c=document.querySelector('.rw-login-card')?.getBoundingClientRect();return{login:!!document.getElementById('rw-login-form'),card:!!document.querySelector('.rw-login-card'),title:!!document.querySelector('.rw-login-title'),logo:!!document.querySelector('.rw-login-logo'),cardArea:c?c.width*c.height:0,sidebar:!!document.getElementById('rw-sidebar'),nav:!!document.getElementById('rw-sidebar-nav'),shell:!!document.getElementById('rw-main-shell'),auth:typeof RW_Auth==='object',navigation:typeof RW_Navigation==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof safeText==='function',globalFrom:typeof window.supabase?.from==='function',manifestHref:l?.getAttribute('href')||'',start:m.start_url,scope:m.scope,display:m.display,dir:m.dir,lang:m.lang,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||''}});
          const menu=await p.evaluate(()=>{RW_STATE.app.currentUser={id:'owner',email:'owner@fixture',isOwner:true,permissions:['*'],name:'Owner',role:'owner'};RW_STATE.permissions=['*'];window.RW_Permissions_check=()=>true;RW_Navigation.buildSidebar();return Array.from(document.querySelectorAll('#rw-sidebar-nav [data-view]')).map(x=>x.getAttribute('data-view')).filter(Boolean)});
          const lic=await p.evaluate(async()=>{try{RW_STATE.app.companyId='fixture-company';await RW_Navigation.navigate('license');await new Promise(r=>setTimeout(r,250));return{ok:true,container:!!document.getElementById('license-main-container'),view:RW_STATE.app.currentView}}catch(e){return{ok:false,error:String(e.message||e)}}});
          const expected=['dashboard','telesales','customers','pos','orders','runsheets','online-store','suppliers','purchase-pos','purchases','receiving','items','inventory','branches','picking','loading','delivery','return','unloading','vouchers','transfer','direct-sale','direct-return','supplier-return','vehicle-count','branch-count','general-count','finance','settlement','reports-dashboard','reports-detailed','reports-comprehensive','reports','audit','hr','crm','users','roles','license','settings','notifications'];
          const menuOk=expected.every(v=>menu.includes(v)||(v==='return'&&menu.includes('returns')));const visual=base.login&&base.card&&base.title&&base.logo&&base.cardArea>0&&base.sidebar&&base.nav;const runtime=base.shell&&base.auth&&base.navigation&&base.owner&&base.safeText&&base.globalFrom;const man=base.manifestHref==='./manifest.json'&&base.start==='./New-main'&&base.scope==='.'+'/'&&base.display==='standalone'&&base.dir==='rtl'&&base.lang==='ar';const markers=base.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&base.pwa==='PWA-RUNTIME-GOLD-2026-09-03';console.log('CTO_FORENSIC_GATE='+JSON.stringify({base,menu,lic,errors}));const ok=!errors.length&&visual&&runtime&&man&&markers&&menuOk&&lic.ok&&lic.container&&lic.view==='license';await b.close();if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo BROWSER_GOLD_DIAMOND=PASS
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          cp Current/PWA/New-main /tmp/New-main.patched;cp Current/PWA/manifest.json /tmp/manifest.patched
