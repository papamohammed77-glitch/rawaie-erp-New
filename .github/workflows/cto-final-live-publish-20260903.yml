                      icons.append(x);seen.add(x.get('src'))
                  m['icons']=icons
              elif k not in m or m[k] in (None,''):m[k]=v
          m.update({'start_url':'./New-main','scope':'./','display':'standalone','dir':'rtl','lang':'ar'})
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for x in ["from('companies')","from('app_settings')","from('owner_profile')",'post_stock_movement','reserve_stock','release_stock_reservation']:assert x in s,x
          assert s.count('RAWAEA_MAIN_SIDEBAR_COMPLETENESS_FINAL_V1')==1
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest());print('TARGET_BYTES='+str(len(s.encode())));print('MANIFEST_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import tempfile,subprocess,json
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8');assert s.count('<link rel="manifest" href="./manifest.json">')==1
          class P(HTMLParser):
              def __init__(self):super().__init__(convert_charrefs=False);self.cur=None;self.inline=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script':self.cur=(dict(a).get('src'),'')
              def handle_data(self,d):
                  if self.cur is not None and not self.cur[0]:self.cur=(None,self.cur[1]+d)
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur[0] and self.cur[1].strip():self.inline.append(self.cur[1])
                      self.cur=None
          q=P();q.feed(s);q.close();assert q.inline
          for code in q.inline:
              f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(code,encoding='utf-8')
              try:subprocess.run(['node','--check',str(f)],check=True)
              finally:f.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'));assert (m['start_url'],m['scope'],m['display'],m['dir'],m['lang'])==('./New-main','./','standalone','rtl','ar')
          print('STATIC_GATE=PASS')
          PY
      - name: Browser forensic gate + clean production publish
