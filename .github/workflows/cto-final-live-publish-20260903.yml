shboard','لوحة التقارير الذكية','reports:view','fa-chart-pie'],['reports-detailed','التقارير التفصيلية','reports:view','fa-table-list'],['reports-comprehensive','التقارير الشاملة','reports:view','fa-chart-column'],['reports','التقارير','reports:view','fa-chart-line'],['audit','سجل التدقيق','owner','fa-list-check']].forEach(function(x){child(f,x[0],x[1],x[2],x[3]);});[['hr','الموارد البشرية','users:view','fa-id-card'],['crm','إدارة علاقات العملاء (CRM)','customers:view','fa-handshake'],['users','المستخدمون والصلاحيات','users:view','fa-users-gear'],['roles','أدوار المستخدمين','roles:view','fa-user-shield'],['license','إدارة الترخيص','owner','fa-shield-halved'],['settings','إعدادات النظام','settings:view','fa-gear'],['notifications','الإشعارات','notifications:view','fa-bell']].forEach(function(x){if(!nav.menuTree.some(function(m){return m&&m.view===x[0];}))nav.menuTree.push({view:x[0],label:x[1],perm:x[2],icon:x[3]});});})();</script>'''
              i=s.rfind('</body>');assert i>=0;s=s[:i]+patch+'\n'+s[i:]
          t.write_text(s,encoding='utf-8')
          a=json.loads(p.read_text(encoding='utf-8')); b=json.loads(l.read_text(encoding='utf-8')); m=dict(a)
          for k,v in b.items():
              if k=='icons':
                  icons=list(m.get('icons') or []);seen={x.get('src') for x in icons if isinstance(x,dict)}
                  for x in v or []:
