name: CTO Final Read-only New-main Browser Verify 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[CTO-VERIFY-RESULT]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Chromium exact artifact gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          (async()=>{
            const html=fs.readFileSync('Current/PWA/New-main','utf8');
            const manifest=JSON.parse(fs.readFileSync('Current/PWA/manifest.json','utf8'));
            if(!html.includes('<html lang="ar" dir="rtl">')) throw new Error('RTL_HTML_MISSING');
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({serviceWorkers:'block'}),pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e)));
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(u.includes('@supabase/')) return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({from:()=>({select(){return this},limit(){return this},maybeSingle(){return Promise.resolve({data:{company_name:'الروائع ERP',company_logo:''},error:null})}}),auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({}),resetPasswordForEmail:async()=>({error:null})}})};`});
              if(u.includes('chart.js')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});
              if(u.includes('xlsx')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});
              if(u.startsWith('http')) return r.fulfill({status:200,contentType:u.endsWith('.css')?'text/css':'application/javascript',body:''});
              return r.continue();
            });
            await p.setContent(html,{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1800);
            const r=await p.evaluate(()=>({login:!!document.querySelector('#rw-login-form'),sidebar:!!document.querySelector('#rw-sidebar'),brand:!!document.querySelector('#rw-login-company-name'),logo:!!document.querySelector('#rw-login-logo, #rw-login-brand-image, .rw-login-logo'),remember:!!document.querySelector('#rw-remember'),forgot:!!document.querySelector('#rw-forgot'),auth:typeof window.RW_Auth==='object',nav:typeof window.RW_Navigation==='object',views:typeof window.RW_Views==='object',shell:typeof window.RW_ShellContext==='object',owner:typeof window.RW_OwnerLicense==='object',byId:typeof window.byId==='function',safeText:typeof window.safeText==='function',title:document.querySelector('.rw-login-title')?parseFloat(getComputedStyle(document.querySelector('.rw-login-title')).fontSize):0,logoSize:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0,menuCount:Array.isArray(window.RW_Navigation?.menuTree)?window.RW_Navigation.menuTree.filter(x=>x&&x.view).length:0,reset:typeof window.RW_Auth?.forgotPassword==='function',manifestHref:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||''}));
            console.log('FINAL_READONLY_BROWSER='+JSON.stringify({r,manifest:{start_url:manifest.start_url,scope:manifest.scope,dir:manifest.dir,lang:manifest.lang,icons:(manifest.icons||[]).length},pe,ce}));
            await b.close();
            const ok=!pe.length&&!ce.length&&r.login&&r.sidebar&&r.brand&&r.logo&&r.remember&&r.forgot&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.byId&&r.safeText&&r.reset&&manifest.start_url==='./New-main'&&manifest.scope==='./'&&manifest.dir==='rtl'&&manifest.lang==='ar'&&manifest.icons.length>=3&&r.menuCount>=10;
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo FINAL_READONLY_BROWSER_GOLD=PASS
