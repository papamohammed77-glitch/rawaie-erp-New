name: CTO Final Read-only New-main Browser Verify
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Immutable audited target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Current/PWA/New-main)" = "28612a6e76fb0f58cf6b0677c43a8828d0e4436d"
          grep -Fq '<html lang="ar" dir="rtl">' Current/PWA/New-main
          test "$(grep -F -c '<link rel="manifest" href="./manifest.json">' Current/PWA/New-main)" = 1
          test "$(git hash-object Current/PWA/manifest.json)" = "f2f52998fd04094905f09afa9fbcb64b2bd38190"
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          test -z "$(find . -maxdepth 1 -type f -name '.cto*' -print -quit)"
          test -z "$(find Current/PWA -maxdepth 1 -type f -name '.cto*' -print -quit)"
          test -z "$(find .cto -type f -print -quit 2>/dev/null || true)"
      - name: Served Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pwa && cp -a Current/PWA/. /tmp/pwa/
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,path): return 'text/html; charset=utf-8' if path.endswith('/New-main') else super().guess_type(path)
              def log_message(self,*a): pass
          os.chdir('/tmp/pwa'); ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/server.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8123/New-main >/dev/null && break; sleep 1; done
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:1440,height:900},serviceWorkers:'block'}),pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e)));
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(u.includes('@supabase/supabase-js'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:function(){function q(t){const o={select(){return o},eq(){return o},neq(){return o},in(){return o},or(){return o},order(){return o},limit(){return o},range(){return o},gte(){return o},lte(){return o},is(){return o},not(){return o},contains(){return o},filter(){return o},maybeSingle:async()=>({data:t==='app_settings'?{company_name:'الروائع',company_logo:null}:t==='users'?{id:'u1',name:'المالك العام',email:'owner@alrawae.com',role:'مدير النظام',company_id:'00000000-0000-0000-0000-000000000001',status:'Active'}:t==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:null}:t==='owner_profile'?{auth_user_id:'auth-owner',license_status:'Active'}:null,error:null}),then:f=>Promise.resolve({data:[],error:null,count:0}).then(f),insert:async()=>({data:null,error:null}),update(){return o},delete(){return o},upsert:async()=>({data:null,error:null})};return o}return{from:q,rpc:async()=>({data:null,error:null}),auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({error:null}),resetPasswordForEmail:async()=>({error:null})}}}};`});
              if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){},showLoading(){}};'});
              if(u.includes('xlsx'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});
              if(u.includes('font-awesome')||u.endsWith('.css'))return r.fulfill({status:200,contentType:'text/css',body:''});
              return r.continue();
            });
            await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1500);
            const a=await p.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),sidebar:!!document.getElementById('rw-sidebar'),brand:!!document.querySelector('.rw-company-name'),remember:!!document.getElementById('rw-remember'),forgot:!!document.getElementById('rw-forgot'),toggle:!!document.querySelector('.rw-password-toggle'),auth:typeof window.RW_Auth==='object',nav:typeof window.RW_Navigation==='object',views:typeof window.RW_Views==='object',shell:typeof window.RW_ShellContext==='object',owner:typeof window.RW_OwnerLicense==='object',warehouse:typeof window.RW_Warehouse==='object',byId:typeof window.byId==='function',safeText:typeof window.safeText==='function',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',menuCount:Array.isArray(window.RW_Navigation?.menuTree)?window.RW_Navigation.menuTree.filter(x=>x&&x.view).length:0,logoSize:document.querySelector('.rw-login-logo')?.getBoundingClientRect().width||0}));
            console.log('CTO_FINAL_READONLY_BROWSER='+JSON.stringify({a,pe,ce}));
            const ok=!pe.length&&!ce.length&&a.lang==='ar'&&a.dir==='rtl'&&a.login&&a.sidebar&&a.brand&&a.remember&&a.forgot&&a.toggle&&a.auth&&a.nav&&a.views&&a.shell&&a.owner&&a.warehouse&&a.byId&&a.safeText&&a.manifest==='.'+'/manifest.json'&&a.menuCount>=10&&a.logoSize>=80;
            await b.close(); if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo CTO_FINAL_READONLY_GOLD=PASS
