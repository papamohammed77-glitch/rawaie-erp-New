name: CTO authoritative Current-PWA New-main closure
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/manifest.json'
      - '.github/workflows/cto_authoritative_current_path_close_20260903.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.event.pull_request.head.sha || 'main' }}, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Recover trusted complete target only when current artifact is provably truncated
        shell: bash
        run: |
          set -euo pipefail
          TRUSTED_COMMIT='a14c589dd969449168fac1c0ad4ed4a9e1281e0c'
          CURRENT_BLOB="$(git rev-parse 'HEAD:Current/PWA/New-main')"
          LINE_COUNT="$(wc -l < Current/PWA/New-main | tr -d ' ')"
          echo "CURRENT_BLOB=$CURRENT_BLOB CURRENT_LINE_COUNT=$LINE_COUNT"
          if [ "$CURRENT_BLOB" = '4ffaf5f1f5a9fb1bbc0cc555904a42017fd096a5' ] || [ "$LINE_COUNT" -lt 20 ]; then
            TRUSTED_BLOB="$(git rev-parse "$TRUSTED_COMMIT:Current/PWA/New-main")"
            test -n "$TRUSTED_BLOB"
            git checkout "$TRUSTED_COMMIT" -- Current/PWA/New-main
            test "$(git hash-object Current/PWA/New-main)" = "$TRUSTED_BLOB"
            echo 'TRUSTED_COMPLETE_NEWMAIN_RESTORED'
          fi
      - name: Static and runtime Gold Diamond gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,subprocess,tempfile,hashlib,re
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          old='<link rel="manifest" href="../manifest.json">'; new='<link rel="manifest" href="./New-main.manifest.json">'
          if old in s: assert s.count(old)==1; s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')
          elif new not in s: raise SystemExit('PWA_MANIFEST_CONTRACT_MISSING')
          # Surgical owner cleanup is only for the known legacy object-assignment shim; MAIN10 binding is retained.
          legacy=re.compile(r'\n?window\.RW_OwnerLicense\s*=\s*\{\s*isOwner\s*:\s*function\([^)]*\)\s*\{.*?\}\s*\};\s*',re.S)
          for m in list(legacy.finditer(s)):
              block=m.group(0)
              if 'license_status' not in block and 'MAIN10' not in block:
                  s=s[:m.start()]+'\n'+s[m.end():]
          p.write_text(s,encoding='utf-8')
          req=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense = RW_OwnerLicense;','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('CLOSURE_CONTRACT_MISSING '+repr(miss))
          if s.count('window.RW_OwnerLicense = RW_OwnerLicense;')!=1: raise SystemExit('OWNER_BINDING_NOT_SOLE')
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.cur={'src':dict(a).get('src'),'text':''}
              def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']: self.cur['text']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                      self.cur=None
          hp=P(); hp.feed(s); assert len(hp.inline)==1, 'INLINE_SCRIPT_COUNT='+str(len(hp.inline))
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(hp.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text()); assert m['start_url']=='./New-main' and m['scope']=='./' and m['lang']=='ar' and m['dir']=='rtl'
          fallback=json.loads(Path('Current/manifest.json').read_text()); assert fallback['start_url']=='./PWA/New-main' and fallback['scope']=='./PWA/' and fallback['lang']=='ar' and fallback['dir']=='rtl'
          print('STATIC_GOLD_DIAMOND_PASS sha256='+hashlib.sha256(s.encode()).hexdigest())
          PY
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          mkdir -p /tmp/site/Current && cp -a Current/. /tmp/site/Current/
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/http.log 2>&1 & echo $! >/tmp/pid)
          trap 'kill "$(cat /tmp/pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1000);
            const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views; const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Views']; const l=document.querySelector('link[rel=manifest]'); const mj=await (await fetch(l.href)).json(); const side=await (await fetch('/Current/manifest.json')).json(); return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,missing:mods.filter(x=>!window[x]),diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content,manifest:l?.getAttribute('href'),start:mj.start_url,scope:mj.scope,sideStart:side.start_url,sideScope:side.scope,sw:(await fetch('./register-sw.js')).status};});
            console.log('FINAL_GOLD_DIAMOND='+JSON.stringify({r,pe,ce})); await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&!r.missing.length&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.start==='./New-main'&&r.scope==='.'+'/'&&r.sideStart==='./PWA/New-main'&&r.sideScope==='./PWA/'&&r.sw===200;
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Publish verified closure artifact to PR branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); st=Path('CURRENT_STATE.md'); h=hashlib.sha256(p.read_bytes()).hexdigest(); s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## FINAL-CLOSED — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          if marker not in s:
              st.write_text(s.rstrip()+f'''\n\n{marker}\n- Target SHA-256: `{h}`\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n''',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg Current/manifest.json CURRENT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[FINAL-CLOSED] [WHOLE-NEWMAIN-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN]'
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'main' }}
# Sole closure executor; known-truncated fingerprint and exact trusted parent are evidence-gated.
# closure_nonce: 2026-09-03T05:48Z
