name: CTO authoritative Current-PWA New-main verifier
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cto_authoritative_current_path_close_20260903.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[CTO-GOVERNANCE-FROZEN]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Verify-only target identity
        shell: bash
        run: |
          set -euo pipefail
          test -f Current/PWA/New-main
          test "$(git rev-parse HEAD:Current/PWA/New-main)" = "f26581b58f101671f96bdc23c58867b985182955"
          test -f Current/manifest.json
          grep -q '"start_url": "./PWA/New-main"' Current/manifest.json
          grep -q 'P163-GOLD-DIAMOND-CLOSED-2026-09-03' Current/PWA/New-main
          echo 'AUTHORITATIVE_TARGET_VERIFIER=PASS'
