name: CTO authoritative Current-PWA New-main closure
on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/New-main-icon.svg'
      - 'Current/PWA/register-sw.js'
      - '.github/workflows/cto_authoritative_current_path_close_20260903.yml'
permissions:
  contents: write
concurrency:
  group: cto-authoritative-current-path
  cancel-in-progress: false
jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message || '', '[FINAL-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Browser runtime
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Surgical repair only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          old="async function showPanel(){\n  var e=email();"
          new="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old in s:
              if s.count(old)!=1: raise SystemExit(f'NOTIFICATION_BUG_COUNT={s.count(old)}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('NOTIFICATION_SURGERY_APPLIED')
          elif new in s:
              print('NOTIFICATION_ALREADY_FIXED')
          else:
              raise SystemExit('NOTIFICATION_CONTRACT_MISSING')
          print('TARGET_SHA256_AFTER_SURGERY='+hashlib.sha256(s.encode()).hexdigest())
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          from html.parser import HTMLParser
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          required=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_ShellContext=','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_OwnerLicense=','var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=','applyAuthoritativeContext']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('STATIC_REQUIRED_MISSING '+repr(missing))
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_OLD_REFERENCE_REMAINS')
          assert s.count('window.RW_Notification=RW_Notification;')==1
          assert s.lower().count('<script')==s.lower().count('</script>')
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.inline=[]; self.cur=None
              def handle_starttag(self,t,a):
                  if t.lower()=='script':
                      d=dict(a); self.cur={'src':d.get('src'),'buf':[]};
              def handle_data(self,d):
                  if self.cur is not None and self.cur['src'] is None: self.cur['buf'].append(d)
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if self.cur['src'] is None: self.inline.append(''.join(self.cur['buf']))
                      self.cur=None
          h=P(); h.feed(s); h.close();
          assert len(h.inline)==1, f'INLINE_SCRIPT_COUNT={len(h.inline)}'
          Path('/tmp/New-main.inline.js').write_text(h.inline[0],encoding='utf-8')
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='./' and m['lang']=='ar' and m['dir']=='rtl'
          assert Path('Current/PWA/New-main-icon.svg').exists()
          assert s.startswith('<!doctype html>') and '<html lang="ar" dir="rtl">' in s
          print('STATIC_GOLD_DIAMOND_PASS')
          PY
          node --check /tmp/New-main.inline.js
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
      - name: Exact HTTP Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          cp Current/PWA/New-main Current/PWA/main.html
          (cd Current/PWA && python3 -m http.server 8123 >/tmp/newmain-http.log 2>&1 & echo $! >/tmp/newmain-http.pid)
          trap 'kill "$(cat /tmp/newmain-http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message));
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(u.includes('supabase.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:`(function(){const result={data:[],error:null,count:0};function chain(){const o={};['select','eq','in','order','range','gte','lte','or','update','insert'].forEach(k=>o[k]=()=>o);o.maybeSingle=async()=>result;o.limit=async()=>result;o.head=()=>o;return o}window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>({error:null}),signInWithPassword:async()=>({error:new Error('SMOKE_DISABLED')})},from:()=>chain()})})();`});
              if(u.includes('chart.umd.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false}),close(){},showLoading(){}};'});
              if(u.includes('xlsx.full.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={utils:{}};'});
              if(u.includes('font-awesome')) return r.fulfill({status:200,contentType:'text/css',body:''});
              return r.continue();
            });
            await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1200);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views;
              let notify='NOT_EXPOSED', notifyError='';
              if(window.RW_Notification&&typeof window.RW_Notification.showPanel==='function'){
                S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};
                try{await window.RW_Notification.showPanel();notify='PASS'}catch(e){notify='FAIL';notifyError=String(e&&e.message||e)}
              }
              let licenseDenied=false,auditDenied=false,guardErrors=[];
              if(N&&typeof N.navigate==='function'){
                try{S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};await N.navigate('license');}catch(e){guardErrors.push(String(e&&e.message||e));licenseDenied=String(e&&e.message||e)==='OWNER_ONLY'}
                try{await N.navigate('audit');}catch(e){guardErrors.push(String(e&&e.message||e));auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e&&e.message||e))}
              }
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.querySelector('#rw-login-page'),state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification:notify,notificationError:notifyError,licenseDenied,auditDenied,guardErrors,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||null,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||null,manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||null};
            });
            console.log('FINAL_GOLD_DIAMOND='+JSON.stringify({r,pe,ce}));
            await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.login&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.notification==='PASS'&&r.licenseDenied&&r.auditDenied&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json';
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Record immutable closure state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); h=hashlib.sha256(p.read_bytes()).hexdigest()
          st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## FINAL-CLOSED — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          if marker not in s:
              s=s.rstrip()+f'''\n\n{marker}\n- Target: `Current/PWA/New-main`\n- Verified target SHA-256: `{h}`\n- Surgical defect fixed: `RW_Notification.showPanel()` no longer reads an unbound `email()`; it reads the authenticated tenant-scoped current-user email.\n- Owner/tenant security: `applyAuthoritativeContext` requires user `company_id`, active status, company record, and owner profile; owner elevation requires owner metadata + wildcard permission + owner profile.\n- Static Gold/Diamond gates: PASS.\n- Real HTTP Chromium gate: PASS with zero page errors and zero console errors; notification smoke PASS; non-owner license/audit guards PASS.\n- PWA manifest: `./New-main.manifest.json`, start `./New-main`, scope `./`, `lang=ar`, `dir=rtl`.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n- Production Supabase writes: NONE.\n'''
              st.write_text(s+'\n',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Closure'
          git config user.email 'rawaea-cto-closure@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'FINAL_CLOSED_NO_DIFF'
            exit 0
          fi
          git commit -m '[FINAL-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
