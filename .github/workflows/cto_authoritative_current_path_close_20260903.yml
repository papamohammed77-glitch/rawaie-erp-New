name: CTO authoritative Current-PWA New-main closure
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cto_authoritative_current_path_close_20260903.yml'
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/register-sw.js'
      - 'Current/PWA/sw.js'
      - 'Current/manifest.json'
permissions:
  contents: write
concurrency:
  group: cto-authoritative-current-path
  cancel-in-progress: false
jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message || '', '[FINAL-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Forensic target surgery — no reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib,json,re,subprocess,tempfile
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          if len(s)<500000 or not s.rstrip().endswith('</html>'):
              raise SystemExit('TARGET_NOT_PROVABLY_COMPLETE')
          before_sha=hashlib.sha256(s.encode()).hexdigest()
          body=s.find('<body')
          op=s.find('<script>',body)
          cl=s.rfind('</script>')
          if body<0 or op<0 or cl<=op: raise SystemExit('INLINE_BOUNDARY_NOT_FOUND')
          inner=s[op+8:cl]
          no, nc = inner.count('<script'), inner.count('</script>')
          print(f'NESTED_SCRIPT_TOKENS_BEFORE=open:{no},close:{nc}')
          if (no,nc)==(3,3):
              inner=inner.replace('<script','<scr\' + \'ipt').replace('</script>','</scr\' + \'ipt>')
              s=s[:op+8]+inner+s[cl:]
              print('NESTED_PRINT_SCRIPT_SURGERY=PASS')
          elif (no,nc)!=(0,0):
              raise SystemExit(f'UNEXPECTED_NESTED_SCRIPT_SHAPE={no},{nc}')
          old='<link rel="manifest" href="../manifest.json">'; new='<link rel="manifest" href="./New-main.manifest.json">'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('MANIFEST_LINK_MISSING')
          meta='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if meta not in s: s=s.replace('</head>',meta+'\n</head>',1)
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if coord not in s: s=s.replace('</head>',coord+'\n</head>',1)
          if 'window.RW_OwnerLicense = RW_OwnerLicense;' not in s and 'window.RW_OwnerLicense={' in s:
              s=s.replace('window.RW_OwnerLicense={','var RW_OwnerLicense={',1)
              anchor='};\nwindow.MAIN_HTML_CURRENT_CONTRACT_LEDGER='
              if s.count(anchor)!=1: raise SystemExit('OWNER_EXPORT_ANCHOR_MISSING')
              s=s.replace(anchor,'};\nwindow.RW_OwnerLicense = RW_OwnerLicense;\nwindow.MAIN_HTML_CURRENT_CONTRACT_LEDGER=',1)
          old_email='async function showPanel(){\n  var e=email();'; new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old_email in s: s=s.replace(old_email,new_email,1)
          p.write_text(s,encoding='utf-8')
          after=hashlib.sha256(s.encode()).hexdigest(); print(f'TARGET_SHA256_BEFORE={before_sha}'); print(f'TARGET_SHA256_AFTER={after}')
          required=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense = RW_OwnerLicense;','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('CONTRACT_MISSING '+repr(missing))
          if s.count('window.RW_OwnerLicense = RW_OwnerLicense;')!=1: raise SystemExit('OWNER_EXPORT_CARDINALITY')
          if s.count('rw-pwa-runtime-gold')!=1 or s.count('RAWAEA_TARGET_SW_COORDINATOR')!=1: raise SystemExit('PWA_CARDINALITY')
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.scripts=0; self.styles=0
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
                  elif t.lower()=='style': self.styles+=1
              def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']: self.cur['text']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                      self.cur=None
          h=P(); h.feed(s); h.close(); print(f'STRUCTURE=scripts:{h.scripts},styles:{h.styles},inline:{len(h.inline)}')
          if (h.scripts,h.styles,len(h.inline))!=(6,1,1): raise SystemExit('HTML_STRUCTURE_GATE')
          js=Path(tempfile.mkstemp(suffix='.js')[1]); js.write_text(h.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(js)],check=True)
          finally: js.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text()); assert (m['start_url'],m['scope'],m['lang'],m['dir'])==('./New-main','./','ar','rtl')
          fm=json.loads(Path('Current/manifest.json').read_text()); assert (fm['start_url'],fm['scope'],fm['lang'],fm['dir'])==('./PWA/New-main','./PWA/','ar','rtl')
          print('STATIC_GOLD_DIAMOND_GATE=PASS')
          PY
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
      - name: Chromium runtime Gold Diamond gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir -p /tmp/site/Current && cp -a Current/. /tmp/site/Current/
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          trap 'kill "$(cat /tmp/http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1500);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views; let notification='NOT_EXPOSED',licenseDenied=false,auditDenied=false;
              if(S?.app&&window.RW_Notification?.showPanel){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL:'+String(e?.message||e)}}
              if(N?.navigate){try{await N.navigate('license')}catch(e){licenseDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e?.message||e))}try{await N.navigate('audit')}catch(e){auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e?.message||e))}}
              const l=document.querySelector('link[rel="manifest"]'); const mj=await (await fetch(l.href)).json(); const fm=await (await fetch('/Current/manifest.json')).json(); const sw=await fetch('./register-sw.js');
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,licenseDenied,auditDenied,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),manifest:l?.getAttribute('href')||'',start:mj.start_url,scope:mj.scope,fstart:fm.start_url,fscope:fm.scope,sw:sw.status};
            });
            console.log('FINAL_GOLD_DIAMOND='+JSON.stringify({r,pe,ce})); await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.notification==='PASS'&&r.licenseDenied&&r.auditDenied&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.diamond&&r.manifest.endsWith('New-main.manifest.json')&&r.start==='./New-main'&&r.scope==='./'&&r.fstart==='./PWA/New-main'&&r.fscope==='./PWA/'&&r.sw===200;
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Commit only verified target
        shell: bash
        run: |
          set -euo pipefail
          git diff -- Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/register-sw.js Current/PWA/sw.js Current/manifest.json
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main
          if git diff --cached --quiet; then echo 'TARGET_ALREADY_VERIFIED_NO_WRITE'; exit 0; fi
          git diff --cached --check
          git commit -m '[FINAL-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git fetch origin main
          test "$(git rev-parse HEAD^1)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
