          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[];
          await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('supabase.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>({error:null}),signInWithPassword:async()=>({error:new Error('SMOKE_DISABLED')})},from:()=>({select(){return this},eq(){return this},or(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null})}),rpc:async()=>({data:null,error:null})})};`});if(u.includes('chart.umd.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false}),close(){},showLoading(){}};'});if(u.includes('xlsx.full.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={utils:{}};'});if(u.includes('font-awesome'))return r.fulfill({status:200,contentType:'text/css',body:''});return r.continue();});
          p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1000);
          const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation;S.app.currentUser={id:'smoke',email:'smoke@example.com',isOwner:false,permissions:[]};let licenseDenied=false,auditDenied=false,nPass=false;try{await N.navigate('license')}catch(e){licenseDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message))}try{await N.navigate('audit-log')}catch(e){auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message))}try{await window.RW_Notification.showPanel();nPass=true}catch(e){}const views=[];(function w(a){(a||[]).forEach(x=>{if(x.view)views.push(x.view);if(x.submenu)w(x.submenu)})})(N.menuTree);return{login:!!document.querySelector('#rw-login-page'),state:!!S,auth:!!window.RW_Auth,nav:!!N,views:views.length,licenseDenied,auditDenied,nPass,diamond:!!window.RW_GOLD_DIAMOND,meta:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',ver:window.RW_PWA_RECONSTRUCTION_VERSION||null}});
          console.log(JSON.stringify({r,pe,ce}));const ok=!pe.length&&!ce.length&&r.login&&r.state&&r.auth&&r.nav&&r.views>=30&&r.licenseDenied&&r.auditDenied&&r.nPass&&r.diamond&&r.meta==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.ver==='MAIN2-COMPLETE-SURGICAL-v1';await b.close();if(!ok)process.exit(2);})();
          NODE
      - name: Persist exact target and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz_newmain_closure_executor.yml
          git config user.name 'rawaea-new-main-bot'
          git config user.email 'rawaea-new-main-bot@users.noreply.github.com'
          git add Current/PWA/New-main .github/workflows/zz_newmain_closure_executor.yml
          git commit -m '[new-main-target-persist] GOLD DIAMOND closure v3'
          git push origin HEAD:main
