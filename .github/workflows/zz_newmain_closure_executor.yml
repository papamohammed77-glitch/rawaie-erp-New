name: CTO New-main surgical closure executor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/zz_newmain_closure_executor.yml']
permissions:
  contents: write
concurrency:
  group: cto-newmain-surgical-closure
  cancel-in-progress: true
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Surgical closure in exact target only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
