  }
  if(!A.__rawaeaFailClosedFinal){var oldEnter=A.enterSystem,oldFallback=A.forceEnterFallback;A.forceEnterFallback=function(){try{S.app.initialized=false;S.app.authenticated=false;S.app.currentUser=null;S.app.companyId=null;S.app.ownerProfile=null;S.app.licenseState='unknown';S.permissions=[]}catch(e){};return oldFallback.apply(this,arguments)};A.enterSystem=async function(u){try{return await oldEnter.call(this,u)}catch(e){try{this.forceEnterFallback()}catch(x){}throw e}};A.__rawaeaFailClosedFinal=true;}
  N._handleAction=function(a,arg){if(a!=='showFinanceTab')throw new Error('UNKNOWN_NAV_ACTION:'+a);if(!can('finance'))throw new Error('PERMISSION_DENIED');if(!window.RW_Finance||typeof window.RW_Finance.renderSubTab!=='function')throw new Error('FINANCE_SUBTAB_HANDLER_MISSING');return window.RW_Finance.renderSubTab(arg||'treasury')};
  var T=[
    {label:'لوحة التحكم',view:'dashboard',icon:'fa-chart-pie'},
    {label:'إدارة المبيعات',icon:'fa-chart-line',submenu:[{label:'التلي سيلز',view:'telesales'},{label:'العملاء',view:'customers'},{label:'المتجر الإلكتروني',view:'online-store'},{label:'نقطة البيع',view:'pos'},{label:'أوردرات المبيعات',view:'orders'},{label:'الرانشيتات',view:'runsheets'}]},
