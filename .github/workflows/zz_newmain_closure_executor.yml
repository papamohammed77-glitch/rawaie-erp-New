    {label:'التقارير الذكية',icon:'fa-chart-simple',submenu:[{label:'لوحة القيادة',view:'reports-dashboard'},{label:'التقارير التفصيلية',view:'reports-detailed'},{label:'التقارير الشاملة',view:'reports-comprehensive'}]},
    {label:'الموارد البشرية',view:'hr',icon:'fa-id-card'},{label:'إدارة علاقات العملاء (CRM)',view:'crm',icon:'fa-handshake'},
    {label:'المستخدمين والصلاحيات',view:'users',icon:'fa-users-gear'},{label:'إدارة أدوار المستخدمين',view:'roles',icon:'fa-user-shield'},
    {label:'إدارة الترخيص',view:'license',icon:'fa-shield-halved'},{label:'إعدادات النظام',view:'settings',icon:'fa-gear'},
    {label:'سجل التدقيق',view:'audit-log',icon:'fa-clipboard-list'},{label:'الإشعارات',view:'notifications',icon:'fa-bell'}
  ];
  N.menuTree=T;
  N.buildSidebar=function(){var root=document.getElementById('rw-sidebar-nav');if(!root)return;root.textContent='';function draw(parent,items){(items||[]).forEach(function(x){if(x.submenu){var h=document.createElement('div');h.className='rw-sidebar-link';h.textContent=x.label;var box=document.createElement('div');box.className='rw-sidebar-submenu';draw(box,x.submenu);h.onclick=function(){box.style.display=box.style.display==='none'?'block':'none'};parent.appendChild(h);parent.appendChild(box);return}if(x.action){if(!can('finance'))return;var ab=document.createElement('button');ab.className='rw-sidebar-link';ab.type='button';ab.textContent=x.label;ab.onclick=function(){N._handleAction(x.action,x.arg)};parent.appendChild(ab);return}if(x.view&&!can(x.view))return;var b=document.createElement('button');b.className='rw-sidebar-link';b.type='button';b.textContent=x.label;b.onclick=function(){N.navigate(x.view)};parent.appendChild(b)})}draw(root,T)};
  N.navigate=async function(v){S.app.currentView=v;if(!can(v))throw new Error((v==='license'||v==='audit'||v==='audit-log')?'OWNER_ONLY':'PERMISSION_DENIED');if(v==='audit'||v==='audit-log')return window.RW_Audit_renderTab();if(v==='transfer')return window.RW_Warehouse.loadVoucherForm('Transfer');if(v==='direct-sale')return window.RW_Warehouse.loadVoucherForm('DirectSale');if(v==='direct-return')return window.RW_Warehouse.loadVoucherForm('DirectReturn');if(v==='supplier-return')return window.RW_Warehouse.loadVoucherForm('SupplierReturn');if(v==='finance'&&window.RW_Finance&&typeof window.RW_Finance.render==='function')return window.RW_Finance.render();if(v==='notifications'&&window.RW_Notification&&typeof window.RW_Notification.showPanel==='function')return window.RW_Notification.showPanel();if(v==='reports-dashboard'&&window.RW_Reports&&typeof window.RW_Reports.renderDashboard==='function')return window.RW_Reports.renderDashboard();if(v==='reports-detailed'&&window.RW_Reports&&typeof window.RW_Reports.renderDetailedReports==='function')return window.RW_Reports.renderDetailedReports();if(v==='reports-comprehensive'&&window.RW_Reports_Comprehensive&&typeof window.RW_Reports_Comprehensive.render==='function')return window.RW_Reports_Comprehensive.render();return window.RW_Views.render(v)};
  if(window.RW_Workflow&&typeof window.RW_Workflow.loadRules==='function'&&!window.RW_Workflow.__rawaeaOwnerOnlyFinal){var lr=window.RW_Workflow.loadRules;window.RW_Workflow.loadRules=async function(){if(!isOwner())throw new Error('OWNER_ONLY_WORKFLOW_RULES');return lr.apply(this,arguments)};window.RW_Workflow.__rawaeaOwnerOnlyFinal=true;}
  window.RW_GOLD_DIAMOND={version:'v3',target:'Current/PWA/New-main',chain:'MAIN1-MAIN11',navigation:'complete',finance_actions:'complete',routes:'complete',owner:'strict',audit:'owner-only',session:'fail-closed',tenant:'RW_ShellContext',stock_authority:'canonical-core'};
})();
'''
          candidate=s[:ms[0].start('b')]+body+s[ms[0].end('b'):]
          if not re.fullmatch(r'(?s).*<\/body>\s*<\/html>\s*',candidate): raise SystemExit('HTML_TAIL_INVALID')
          q=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',candidate,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(q)!=1: raise SystemExit('FINAL_INLINE_COUNT')
          f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(q[0].group('b'),encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          p.write_text(candidate,encoding='utf-8')
          print('SURGICAL_TARGET_PATCH=PASS')
          PY
      - name: Exact target static gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,tempfile
          p=Path('Current/PWA/New-main');s=p.read_text(encoding='utf-8')
          req=['P163-GOLD-DIAMOND-CLOSED-2026-09-03','MAIN2-COMPLETE-SURGICAL-v1','MAIN2_GOVERNED_CLOSED:v1','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_GOLD_DIAMOND=']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('MISSING='+repr(miss))
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',s,re.I) if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_COUNT')
          f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(ms[0].group('b'),encoding='utf-8');
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest());print('TARGET_BYTES='+str(len(s.encode())));print('STATIC_GATE=PASS')
