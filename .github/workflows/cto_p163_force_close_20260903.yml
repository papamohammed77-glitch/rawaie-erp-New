name: CTO P163 Force Close — Independent
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cto-p163-force-close
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Patch New-main and verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main && git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8'); before=s
          old='<link rel="manifest" href="../manifest.json">'
          if old in s: s=s.replace(old,'<link rel="manifest" href="./New-main.manifest.json">',1)
          elif './New-main.manifest.json' not in s: raise SystemExit('PWA_MANIFEST_LINEAGE_UNKNOWN')
          if 'rw-pwa-runtime-gold' not in s:
            s=s.replace('</head>','<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">\n<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>\n</head>',1)
          if '/* RAWAEA MAIN10 AUTHORITATIVE MODULE */' not in s: raise SystemExit('MAIN10_MISSING')
          if 'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1' not in s: raise SystemExit('DIAMOND_MISSING')
          assert 'window.RW_OwnerLicense = RW_OwnerLicense;' in s
          assert 'window.RW_Auth=' in s and 'window.RW_Navigation=' in s and 'window.RW_Views=' in s and 'window.RW_ShellContext=' in s
          # Close the known legacy notification implementation only when still present.
          oldn="async function showPanel(){\n  var e=email();"; newn="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if s.count(oldn)==1: s=s.replace(oldn,newn,1)
          p.write_text(s,encoding='utf-8')
          Path('Current/PWA/New-main.manifest.json').write_text(json.dumps({'name':'الروائع ERP','short_name':'الروائع ERP','start_url':'./New-main','scope':'./','display':'standalone','dir':'rtl','lang':'ar','background_color':'#f8fafc','theme_color':'#2563eb','icons':[{'src':'./New-main-icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('Current/PWA/New-main-icon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2563eb"/><text x="256" y="325" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" font-size="270" font-weight="900" fill="#fff">ر</text></svg>\n',encoding='utf-8')
          print('BEFORE',hashlib.sha256(before.encode()).hexdigest()); print('AFTER',hashlib.sha256(s.encode()).hexdigest())
          PY
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='.//' and m['lang']=='ar' and m['dir']=='rtl'
          assert Path('Current/PWA/New-main-icon.svg').exists()
          PY
          rm -rf /tmp/site && mkdir /tmp/site
          cp -a Current/PWA/. /tmp/site/
          cp Current/PWA/New-main /tmp/site/main.html
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          timeout 60s node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:10000});await p.waitForSelector('#rw-login-page',{timeout:10000});await p.waitForTimeout(1200);const r=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const mj=await (await fetch(l.href)).json();const reg=await navigator.serviceWorker.getRegistration('./');return {lang:document.documentElement.lang,dir:document.documentElement.dir,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,diamond:document.documentElement.outerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),manifest:l?.getAttribute('href'),start:mj.start_url,scope:mj.scope,sw:!!reg,swScript:reg?.active?.scriptURL||null,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||null}};console.log(JSON.stringify({r,e},null,2));if(e.length||r.lang!=='ar'||r.dir!=='rtl'||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.diamond||r.manifest!=='./New-main.manifest.json'||r.start!=='./New-main'||r.scope!=='./'||!r.sw||!r.swScript?.endsWith('/sw.js')||r.pwa!=='PWA-RUNTIME-GOLD-2026-09-03')throw new Error('BROWSER_GATE_FAILED');await b.close()})().catch(x=>{console.error(x.stack||x);process.exit(1)});
          NODE
          kill "$(cat /tmp/http.pid)" 2>/dev/null || true
      - name: Commit verified target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); h=hashlib.sha256(p.read_bytes()).hexdigest()
          st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8').rstrip()
          if '## CTO CURRENT-PATH RECONCILIATION — 2026-09-03' not in s:
            s+=f'\n\n## CTO CURRENT-PATH RECONCILIATION — 2026-09-03\n- Target: `Current/PWA/New-main`.\n- PWA manifest lineage corrected to target-specific `New-main.manifest.json`; explicit target Service Worker coordinator added.\n- Node + static PWA gates: PASS.\n- Real HTTP Chromium gate: PASS; manifest fetched; Service Worker active on `sw.js`; core Auth/Navigation/Views/Shell/Owner/Diamond surfaces present; no page/console errors.\n- Verified target SHA-256: `{h}`\n- Production Supabase writes: NONE.\n- Current-path GOLD/DIAMOND Closure Unit: PROVEN.\n'
            st.write_text(s+'\n',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[CTO-CURRENT-PATH] [GOLD-PROVEN] [DIAMOND-PROVEN] close New-main runtime gaps'
          git push origin HEAD:main
