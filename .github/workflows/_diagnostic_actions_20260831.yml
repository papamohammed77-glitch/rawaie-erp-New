# RUN 2026-09-03 — CTO FINAL TARGET EXECUTOR
name: ACTIONS DIAGNOSTIC 20260831
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnostic:
    if: ${{ !contains(github.event.head_commit.message, '[CTO-EXECUTED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 3

      - name: Execute canonical New-main reconstruction and P163
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_new_main_clean_room_20260831.py

      - name: Gold/Diamond source gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          required=['window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_OwnerLicense','window.RW_Dashboard','window.RW_Items','window.RW_POS','window.RW_Orders','window.RW_Runsheets','window.RW_Purchases','window.RW_Warehouse','window.RW_Finance','window.RW_Reports','window.RW_HR','window.RW_CRM','main1Delegation','actions','MAIN3','post_stock_movement','reserve_stock','post_journal_entry']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('REQUIRED_CONTRACT_MISSING:'+repr(missing))
          checks={
            'compat_absent':'/* RAWAEA MAIN2 COMPATIBILITY */' not in s,
            'authoritative_one':s.count('/* RAWAEA MAIN2 AUTHORITATIVE MODULE */')==1,
            'reconstruction_version_one':s.count("window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';")==1,
            'governed_one':s.count('// MAIN2_GOVERNED_CLOSED:v1')==1,
            'legacy_dashboard_alias_absent':'window.RW_Dashboard={render:renderDashboard};' not in s,
            'legacy_items_alias_absent':'window.RW_Items={render:renderItems};' not in s,
            'actions_preserved':'actions' in s,
            'main1Delegation_preserved':'main1Delegation' in s,
            'main3_preserved':'MAIN3' in s,
            'script_balance':s.lower().count('<script')==s.lower().count('</script>'),
            'style_balance':s.lower().count('<style')==s.lower().count('</style>')
          }
          if not all(checks.values()): raise SystemExit('GOLD_DIAMOND_FAIL:'+repr(checks))
          print('GOLD_DIAMOND_SOURCE_PASS',checks)
          print('TARGET_SHA256',hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_BYTES',len(s.encode()))
          PY

      - name: Final JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_APPLICATION_SCRIPT_COUNT:'+str(len(ms)))
          Path('/tmp/new-main.js').write_text(ms[0].group('b'),encoding='utf-8')
          PY
          node --check /tmp/new-main.js

      - name: Browser smoke gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-new-main-pwa && mkdir -p /tmp/rawaea-new-main-pwa
          cp -r Current/PWA/. /tmp/rawaea-new-main-pwa/
          cp Current/PWA/New-main /tmp/rawaea-new-main-pwa/New-main.html
          python3 -m http.server 8124 --directory /tmp/rawaea-new-main-pwa >/tmp/rawaea-new-main-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message));
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8124/New-main.html',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1800);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,flat=[];
              (function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);
              const req=['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'];
              const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'];
              let denied=false;
              if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(e){denied=e.message==='OWNER_ONLY'}}
              return {lang:document.documentElement.lang,body:!!document.body,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,critical:req.every(v=>flat.includes(v)),mods:mods.every(v=>!!window[v]),denied,count:flat.length};
            });
            console.log(JSON.stringify({r,pe,ce}));
            if(pe.length||ce.length||r.lang!=='ar'||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.critical||!r.mods||!r.denied||r.count<30)process.exit(2);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE

      - name: Persist verified target and closure state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'RAWAEA CTO Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main
          git diff --cached --quiet && { echo 'NEW_MAIN_NO_DELTA'; exit 1; }
          git commit -m '[CTO-EXECUTED] New-main Gold/Diamond closure'
          git push origin HEAD:main
