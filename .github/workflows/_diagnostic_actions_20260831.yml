name: ACTIONS DIAGNOSTIC 20260831
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnostic:
    if: ${{ !contains(github.event.head_commit.message, '[CTO-EXECUTED]') && !contains(github.event.head_commit.message, '[CTO-EXECUTOR-INSTALL]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Execute New-main reconstruction with correct continuation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import subprocess
          spec=importlib.util.spec_from_file_location('recon','tools/run_final_main_reconstruction_20260831.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          def fixed(chunks):
              first=m.re.search(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*)',chunks[0],m.re.I)
              if not first: raise RuntimeError('MAIN1_INLINE_SCRIPT_MISSING')
              body=first.group(1)
              for idx in range(1,len(chunks)+1):
                  if idx>1: body+='\\n\\n'+chunks[idx-1]
                  if idx<2: continue
                  f=Path('/tmp')/f'rawaea-phase-{idx}.js'; f.write_text(body,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode: raise RuntimeError(f'JS_PHASE_SYNTAX_FAIL:main{idx}:\\n{r.stderr}')
          m.validate_phase_js=fixed
          m.main()
          PY
      - name: P163 and Gold Diamond gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'; auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'; version="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"; governed='// MAIN2_GOVERNED_CLOSED:v1'
          required=['main1Delegation','actions','MAIN3','post_stock_movement','reserve_stock','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_OwnerLicense']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('CONTRACT_MISSING:'+repr(missing))
          if compat in s:
              a=s.index(compat); b=s.index(auth)
              if b<=a: raise SystemExit('P163_OWNER_ORDER')
              s=s[:a]+s[b:]
          for alias in ['window.RW_Dashboard={render:renderDashboard};','window.RW_Items={render:renderItems};']:
              if alias in s: s=s.replace(alias,'',1)
          if s.count('window.RW_Items=RW_Items;')!=1: raise SystemExit('P163_RW_ITEMS_OWNER_COUNT')
          if version not in s: s=s.replace('window.RW_Items=RW_Items;','window.RW_Items=RW_Items;\n'+version,1)
          if governed not in s: s=s.replace(version,version+'\n'+governed,1)
          if version not in s or governed not in s or s.count(version)!=1 or s.count(governed)!=1: raise SystemExit('P163_MARKER_FAILURE')
          if compat in s: raise SystemExit('P163_COMPAT_REMAINS')
          if 'window.RW_Dashboard={render:renderDashboard};' in s or 'window.RW_Items={render:renderItems};' in s: raise SystemExit('P163_ALIAS_REMAINS')
          if 'actions' not in s or 'main1Delegation' not in s or 'MAIN3' not in s: raise SystemExit('P163_PRESERVATION_FAILURE')
          if s.lower().count('<script')!=s.lower().count('</script>') or s.lower().count('<style')!=s.lower().count('</style>'): raise SystemExit('DOCUMENT_BALANCE_FAILURE')
          p.write_text(s,encoding='utf-8')
          print('P163_GOLD_PASS sha256='+hashlib.sha256(s.encode()).hexdigest()+' bytes='+str(len(s.encode())))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
          Path('/tmp/rawaea-new-main.js').write_text(ms[0].group('b'),encoding='utf-8')
          PY
          node --check /tmp/rawaea-new-main.js
      - name: Browser target smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-pwa && mkdir -p /tmp/rawaea-pwa
          cp -r Current/PWA/. /tmp/rawaea-pwa/
          cp Current/PWA/New-main /tmp/rawaea-pwa/New-main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-pwa >/tmp/rawaea-pwa.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.goto('http://127.0.0.1:8123/New-main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1500);const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,flat=[];(function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);let denied=false;if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(x){denied=x.message==='OWNER_ONLY'}}return{ar:document.documentElement.lang==='ar',body:!!document.body,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract,critical:['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'].every(v=>flat.includes(v)),denied,count:flat.length};});console.log(JSON.stringify({r,e}));if(e.length||!r.ar||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.critical||!r.denied||r.count<30)process.exit(2);await b.close()})().catch(x=>{console.error(x);process.exit(2)})
          NODE
      - name: Persist target and state only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8'); state=Path('CURRENT_STATE.md'); st=state.read_text(encoding='utf-8')
          marker='P163 CLOSED — MAIN2 ownership surgery + governed New-main reconstruction'
          if marker not in st:
              state.write_text(st.rstrip()+"\n\n## CTO EXECUTION — 2026-09-03\n\n"+marker+"\n- Target: `Current/PWA/New-main`\n- Verified SHA-256: `"+hashlib.sha256(s.encode()).hexdigest()+"`\n- Reconstructed from existing `Current/PWA/main/main1.md` through `main11.md`; historical originals untouched.\n- P163 ownership surgery passed; browser/static Gold/Diamond gates passed.\n- No production database writes.\n")
          PY
          git config user.name 'RAWAEA CTO Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[CTO-EXECUTED] New-main Gold/Diamond closure'
          git push origin HEAD:main
