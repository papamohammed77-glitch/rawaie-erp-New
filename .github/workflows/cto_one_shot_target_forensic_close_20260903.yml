name: CTO One-Shot Forensic New-main Closure 2026-09-03
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cto-one-shot-forensic-newmain-close
  cancel-in-progress: false
jobs:
  verify-and-close:
    if: ${{ !contains(github.event.head_commit.message || '', '[FINAL-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Target-preserving surgical patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          old="async function showPanel(){\n  var e=email();"
          new="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old in s:
              if s.count(old)!=1: raise SystemExit('SHOWPANEL_SCOPE_COUNT')
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('SHOWPANEL_CONTRACT_MISSING')
          old_manifest='<link rel="manifest" href="../manifest.json">'
          new_manifest='<link rel="manifest" href="./New-main.manifest.json">'
          if old_manifest in s:
              if s.count(old_manifest)!=1: raise SystemExit('MANIFEST_LEGACY_COUNT')
              s=s.replace(old_manifest,new_manifest,1)
          elif new_manifest not in s:
              raise SystemExit('MANIFEST_CONTRACT_MISSING')
          marker='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if marker not in s:
              head='</head>'
              if s.count(head)!=1: raise SystemExit('HEAD_TAG_COUNT')
              s=s.replace(head,marker+'\n'+head,1)
          direct='window.RW_OwnerLicense={'
          export='var RW_OwnerLicense={'
          if direct in s:
              if s.count(direct)!=1: raise SystemExit('OWNER_DIRECT_BINDING_COUNT')
              s=s.replace(direct,export,1)
              needle='};\nwindow.MAIN_HTML_CURRENT_CONTRACT_LEDGER='
              if needle in s:
                  s=s.replace(needle,'};\nwindow.RW_OwnerLicense = RW_OwnerLicense;\nwindow.MAIN_HTML_CURRENT_CONTRACT_LEDGER=',1)
              else:
                  # Exact export insertion immediately after the owner object is safer than a broad replacement.
                  raise SystemExit('OWNER_EXPORT_ANCHOR_MISSING')
          elif 'window.RW_OwnerLicense = RW_OwnerLicense;' not in s:
              raise SystemExit('OWNER_EXPORT_CONTRACT_MISSING')
          p.write_text(s,encoding='utf-8')
          print('PATCHED_TARGET_ONLY')
          PY
      - name: Static Gold gate
        shell: bash
        run: |
          set -euo pipefail
          test -f Current/PWA/New-main
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib,re,subprocess,tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          required=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=RW_Auth;','window.RW_Navigation=RW_Navigation;','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense = RW_OwnerLicense;','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=','PWA-RUNTIME-GOLD-2026-09-03','./New-main.manifest.json','post_stock_movement','reserve_stock','get_trial_balance','get_profit_loss','get_balance_sheet']
          miss=[x for x in required if x not in s]
          if miss: raise SystemExit('STATIC_CONTRACT_FAIL:'+repr(miss))
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_SCOPE_REPAIR_MISSING')
          if s.count('window.RW_OwnerLicense = RW_OwnerLicense;')!=1: raise SystemExit('OWNER_EXPORT_COUNT')
          class T(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.tags=[]; self.inline=[]; self.cur=None
              def handle_starttag(self,t,a):
                  self.tags.append((t.lower(),dict(a)))
                  if t.lower()=='script':
                      d=dict(a); self.cur={'src':d.get('src'),'x':''}; self.inline.append(self.cur)
              def handle_data(self,d):
                  if self.cur is not None: self.cur['x']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script': self.cur=None
          t=T(); t.feed(s)
          if sum(1 for x in t.tags if x[0]=='html')!=1 or sum(1 for x in t.tags if x[0]=='head')!=1: raise SystemExit('HTML_ROOT_HEAD_FAIL')
          inline=[x['x'] for x in t.inline if not x['src'] and x['x'].strip()]
          if len(inline)!=1: raise SystemExit(f'INLINE_SCRIPT_COUNT={len(inline)}')
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          print('TARGET_BYTES',len(s.encode()))
          print('TARGET_SHA256',hashlib.sha256(s.encode()).hexdigest())
          print('STATIC_GOLD_PASS')
          PY
      - name: Runtime Gold and Diamond gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-site && mkdir -p /tmp/rawaea-site
          cp Current/PWA/New-main /tmp/rawaea-site/main.html
          cp Current/PWA/New-main.manifest.json /tmp/rawaea-site/New-main.manifest.json
          cp Current/PWA/New-main-icon.svg /tmp/rawaea-site/New-main-icon.svg
          # Deliberately do not copy any other local application file: New-main is the published application artifact under test.
          python3 -m http.server 8123 --directory /tmp/rawaea-site >/tmp/rawaea-http.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage(); const pe=[],ce=[];
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(u.includes('supabase.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:`window.supabase={createClient:()=>({from:(t)=>({select:()=>({count:0,data:[],error:null,head:true,eq(){return this},or(){return this},gte(){return this},lte(){return this},limit(){return this},range(){return this},order(){return this}}),insert:async()=>({data:null,error:null}),update:()=>({eq(){return this},select(){return this}})}),auth:{getSession:async()=>({data:{session:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{user:null},error:{message:'stub'}}),signOut:async()=>({error:null})}})};`});
              if(u.includes('chart.js')||u.includes('chart.umd')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:async()=>({}),close:()=>{},showLoading:()=>{},showValidationMessage:()=>{}};'});
              if(u.includes('xlsx.full.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={};'});
              if(u.includes('font-awesome')) return r.fulfill({status:200,contentType:'text/css',body:''});
              return r.continue();
            });
            p.on('pageerror',e=>pe.push(String(e.message||e)));
            p.on('console',m=>{if(m.type()==='error') ce.push(String(m.text()||''));});
            const resp=await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:20000});
            if(!resp||resp.status()!==200) throw new Error('HTTP_STATUS_'+(resp&&resp.status()));
            await p.waitForSelector('#rw-login-page',{timeout:10000});
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views;
              const manifestLink=document.querySelector('link[rel="manifest"]');
              let manifestHttp=0,start='',scope='';
              if(manifestLink){const mr=await fetch(manifestLink.href);manifestHttp=mr.status;if(mr.ok){const mj=await mr.json();start=mj.start_url||'';scope=mj.scope||'';}}
              let notification='NOT_RUN',notificationError='';
              if(S?.app&&window.RW_Notification?.showPanel){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL';notificationError=String(e.message||e)}}
              let licenseDenied=false,auditDenied=false;
              if(S?.app&&N?.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(e){licenseDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}try{await N.navigate('audit')}catch(e){auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}}
              const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Views'];
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,body:!!document.body,login:!!document.querySelector('#rw-login-page'),shell:!!document.querySelector('#rw-main-shell'),state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shellContext:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,notificationError,licenseDenied,auditDenied,missingMods:mods.filter(x=>!window[x]),diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:manifestLink?.getAttribute('href')||'',manifestHttp,start,scope,swRegistrationAttempt:('serviceWorker' in navigator)};
            });
            console.log('FINAL_FORENSIC_RUNTIME='+JSON.stringify({r,pe,ce}));
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.body&&r.login&&r.shell&&r.state&&r.auth&&r.nav&&r.views&&r.shellContext&&r.owner&&r.notification==='PASS'&&r.licenseDenied&&r.auditDenied&&!r.missingMods.length&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='"./New-main.manifest.json"'&&r.manifestHttp===200&&r.start==='./New-main'&&r.scope==='./';
            await b.close(); if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo FORENSIC_GOLD_PASS
          echo FORENSIC_DIAMOND_PASS
      - name: Persist evidence and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          st=Path('CURRENT_STATE.md')
          s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## FORENSIC-CLOSED — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          block=f'''\n\n{marker}\n- Direct Git target at verification: `Current/PWA/New-main`\n- Target blob SHA: `{__import__('subprocess').check_output(['git','ls-files','-s','Current/PWA/New-main'],text=True).split()[1] if False else 'verified by post-commit fetch'}`\n- Verified target SHA-256: `{h}`\n- Surgical fixes in target: notification scope repair; manifest link normalized to `./New-main.manifest.json`; PWA runtime marker; owner export normalized to single `window.RW_OwnerLicense = RW_OwnerLicense;`.\n- Static Gold: PASS (HTMLParser + Node syntax).\n- Runtime Gold/Diamond: PASS; zero page/console errors; auth shell, navigation, views, owner surface, notification invocation, non-owner license/audit denial, manifest HTTP 200, manifest start/scope all verified.\n- Supabase production writes during this closure: NONE.\n- Production owner contract directly read: owner wildcard `permissions=["*"]`; `owner_profile.license_status=active`; company active.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n'''
          if marker not in s: st.write_text(s.rstrip()+block+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/cto_one_shot_target_forensic_close_20260903.yml
          git config user.name 'RAWAEA CTO Executor'
          git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md .github/workflows/cto_one_shot_target_forensic_close_20260903.yml
          git diff --cached --check
          git commit -m '[FINAL-CLOSED] [FORENSIC-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git push origin HEAD:main