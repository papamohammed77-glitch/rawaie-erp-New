name: CTO repair receive-purchase consumer
on:
  push:
    branches: [ctorepair-receive-purchase-consumer-20260819]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply surgical operation_id patch and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/main.html')
          s = p.read_text(encoding='utf-8')
          needle = '''body: JSON.stringify({\n                  po_code: poCode,\n                  itemsReceived: r.value,\n                  notes: notes\n              })'''
          replacement = '''body: JSON.stringify({\n                  po_code: poCode,\n                  itemsReceived: r.value,\n                  notes: notes,\n                  operation_id: crypto.randomUUID()\n              })'''
          count = s.count(needle)
          if count != 1:
              raise SystemExit(f'Expected exactly one receive-purchase payload, found {count}')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          print('patched receive-purchase payload: operation_id=crypto.randomUUID()')
          PY
          git config user.name 'rawaea-cto-bot'
          git config user.email 'cto-bot@rawaea.com'
          git add Current/PWA/main.html
          git rm .github/workflows/ctorepair-receive-purchase-consumer-20260819.yml
          git commit -m 'fix(receive-purchase): send request operation identity'
          git push origin HEAD
