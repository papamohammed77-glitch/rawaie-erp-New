name: Gold Master Vouchers Forensic Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - gold-master-vouchers-20260820

jobs:
  forensic-build:
    if: ${{ !contains(github.event.head_commit.message || '', '[gold-master]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Materialize verified Gold Master vouchers.html
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          # The payload above is intentionally replaced below by the repository-stored verified asset.
          # Fail closed if the compressed payload does not decode to the expected Gold Master marker.
          try:
              data=gzip.decompress(base64.b64decode(payload))
          except Exception as e:
              raise SystemExit('GOLD_MASTER_PAYLOAD_INVALID:'+str(e))
          text=data.decode('utf-8')
          if 'RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20' not in text:
              raise SystemExit('GOLD_MASTER_MARKER_MISSING')
          open('Current/PWA/vouchers.html','wb').write(data)
          print('MATERIALIZED',len(data),'bytes')
          PY

      - name: Syntax and static audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          if not scripts: raise SystemExit('NO_INLINE_SCRIPT')
          Path('/tmp/vouchers-inline.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          for name in ['doLogin','init','choose','details','itemDetails','send','cancel','receive','complete','renderWorkspace','renderProducts','renderCart','submit']:
            if name+':function' not in s: raise SystemExit('MISSING_APP_METHOD:'+name)
          if 'RW_VOUCHER_RECEIVE:' not in s: raise SystemExit('MISSING_RECEIVE_IDEMPOTENCY')
          if 'stock_branches' in s and re.search(r"stock_branches[^\n]{0,120}\.(?:update|insert|upsert)",s,re.I): raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITE_DETECTED')
          if 'inventory_log' in s and re.search(r"inventory_log[^\n]{0,120}\.(?:update|insert|upsert)",s,re.I): raise SystemExit('DIRECT_PHYSICAL_LOG_WRITE_DETECTED')
          print('STATIC_AUDIT_PASS')
          PY
          node --check /tmp/vouchers-inline.js

      - name: Commit Gold Master
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git config user.name 'rawaea-cto-bot'
          git config user.email 'rawaea-cto-bot@users.noreply.github.com'
          git add Current/PWA/vouchers.html
          git diff --cached --check
          git commit -m 'fix(vouchers): materialize verified Gold Master [gold-master]' || echo 'NO_CHANGES'
          git push origin HEAD:${{ github.head_ref }}
