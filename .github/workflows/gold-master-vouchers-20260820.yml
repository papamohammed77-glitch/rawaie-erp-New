name: Gold Master Vouchers Forensic Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [gold-master-vouchers-20260820]

permissions:
  contents: write

jobs:
  forensic-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Apply deterministic Gold Master repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'Current/PWA/vouchers.html';
          let s = fs.readFileSync(path, 'utf8');
          const build = 'RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20';
          const marker = '/* RAWAEA VOUCHERS GOLD MASTER 2026-08-20 */';

          if (!s.includes(build)) {
            s = s.replace(
              '<meta name="theme-color" content="#21154f">',
              '<meta name="theme-color" content="#21154f"><meta name="rw-build" content="' + build + '">'
            );
          }

          s = s.replace(
            '.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b;overscroll-behavior:contain}',
            '.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b;overscroll-behavior:contain;overflow:hidden}'
          );
          s = s.replace(
            '.cart{min-width:0;display:flex;flex-direction:column;min-height:0;background:#111827}',
            '.cart{min-width:0;display:flex;flex-direction:column;min-height:0;background:#111827;overflow:hidden}'
          );

          const gm = `/* RAWAEA VOUCHERS GOLD MASTER 2026-08-20 */
          (function(){
            var marker='GOLD-MASTER-2026-08-20';
            var workspaceCollapsed=false;
            try{workspaceCollapsed=localStorage.getItem('RW_VOUCHER_WORKSPACE_COLLAPSED')==='1'}catch(e){workspaceCollapsed=false}

            App.applyWorkspaceCollapsed=function(){
              var head=document.getElementById('workspaceHead');
              var floatBtn=document.getElementById('workspaceCollapseFloat');
              var inlineBtn=document.getElementById('workspaceCollapseBtn');
              if(!head||!floatBtn||!inlineBtn)return;
              head.classList.toggle('is-collapsed',workspaceCollapsed);
              inlineBtn.innerHTML=workspaceCollapsed?'<i class="fa-solid fa-chevron-down"></i>':'<i class="fa-solid fa-chevron-up"></i>';
              inlineBtn.title=workspaceCollapsed?'فتح الجزء العلوي':'ضم الجزء العلوي';
              inlineBtn.setAttribute('aria-label',inlineBtn.title);
              floatBtn.classList.toggle('visible',workspaceCollapsed);
            };
            App.toggleWorkspaceHead=function(){
              workspaceCollapsed=!workspaceCollapsed;
              try{localStorage.setItem('RW_VOUCHER_WORKSPACE_COLLAPSED',workspaceCollapsed?'1':'0')}catch(e){}
              this.applyWorkspaceCollapsed();
            };
            var originalRenderWorkspace=App.renderWorkspace;
            App.renderWorkspace=function(){originalRenderWorkspace.call(this);this.applyWorkspaceCollapsed()};
            var oldBack=App.back;
            App.back=function(){oldBack.call(this);var l=document.getElementById('typeLabel');if(l)l.textContent='إذن جديد'};

            var originalLoadRefs=App.loadRefs;
            App.loadRefs=function(){
              var s=this;
              return originalLoadRefs.call(this).then(function(){
                var map={};
                (s.refs.vehicles||[]).forEach(function(v){
                  var code='VAN-'+String(v.vehicle_code||'').trim().toUpperCase();
                  var b=(s.refs.branches||[]).find(function(x){return String(x.branch_code||'').toUpperCase()===code});
                  if(b)map[v.id]=b.id;
                });
                s.refs.vehicleBranchMap=map;
              });
            };

            App.avail=function(id){
              var e=document.getElementById('wsFrom');
              if(!e||!e.value)return null;
              var branch=e.value;
              if(this.type==='DirectReturn'&&(this.refs.vehicleBranchMap||{})[branch])branch=this.refs.vehicleBranchMap[branch];
              var k=branch+':'+id;
              return Object.prototype.hasOwnProperty.call(this.stock,k)?Number(this.stock[k]||0):0;
            };
            App.canAddQuantity=function(item,next){
              var av=this.avail(item.id);
              if(av===null)return true;
              if(this.type==='DirectReturn')return true;
              if(this.mode==='engine'&&this.type==='Adjustment'){
                var m=document.getElementById('wsMode');
                var mode=m?m.value:'replace';
                return mode!=='deduct'||next<=av;
              }
              if(this.mode==='engine'&&this.type==='Scrap')return next<=av;
              return next<=av;
            };

            App._refreshDetailPopup=function(code){
              var popup=Swal.getPopup();
              if(!popup)return;
              var span=popup.querySelector('#detailQtySpan');
              var cartItem=this.cart.find(function(c){return c.code===code});
              var qty=cartItem?Number(cartItem.qty):0;
              if(span)span.textContent=qty;
              if(qty===0){
                var controls=popup.querySelector('#detailQtyControls');
                if(controls)controls.outerHTML='<button type="button" data-code="'+this.esc(code)+'" onclick="App._addFromDetail(this.dataset.code)" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold"><i class="fa-solid fa-cart-plus ml-1"></i> أضف للسلة</button>';
              }
            };

            App.itemDetails=function(id){
              var s=this;
              var x=this.items.find(function(i){return i.id===id});
              if(!x)return;
              var av=this.avail(id);
              var inCart=this.cart.find(function(c){return c.id===id});
              var qty=inCart?Number(inCart.qty):0;
              var status=av===null?'اختر المصدر':av>10?'🟢 متوفر':av>0?'🟡 محدود ('+f(av)+')':'🔴 غير متاح';
              var canAdd=(av===null)||av>0||this.type==='DirectReturn'||(this.mode==='engine'&&this.type==='Adjustment'&&((document.getElementById('wsMode')||{}).value||'replace')!=='deduct');
              var controls=qty>0
                ?'<div id="detailQtyControls" class="flex items-center gap-3">'
                  +'<button type="button" data-code="'+s.esc(x.item_code)+'" onclick="App._updateDetailQty(this.dataset.code,-1)" class="w-10 h-10 rounded-full bg-slate-700 text-white font-black text-lg">−</button>'
                  +'<span id="detailQtySpan" class="text-xl font-black text-white min-w-6 text-center">'+qty+'</span>'
                  +'<button type="button" data-code="'+s.esc(x.item_code)+'" onclick="App._updateDetailQty(this.dataset.code,1)" class="w-10 h-10 rounded-full bg-blue-600 text-white font-black text-lg">+</button>'
                  +'</div>'
                :(canAdd
                  ?'<button type="button" data-code="'+s.esc(x.item_code)+'" onclick="App._addFromDetail(this.dataset.code)" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold"><i class="fa-solid fa-cart-plus ml-1"></i> أضف للسلة</button>'
                  :'<span class="text-xs text-slate-500 font-bold">لا توجد كمية متاحة</span>');
              var html='<div class="text-right text-slate-100">'
                +'<div class="flex gap-4 items-start">'
                +'<div class="w-28 h-28 rounded-3xl bg-slate-800 overflow-hidden flex items-center justify-center shrink-0">'+(x.image_url?'<img src="'+s.esc(x.image_url)+'" class="w-full h-full object-cover">':'<i class="fa-solid fa-box text-4xl text-slate-500"></i>')+'</div>'
                +'<div class="flex-1 min-w-0"><h3 class="text-lg font-black text-white truncate">'+s.esc(x.name||x.item_code)+'</h3><p class="text-xs text-slate-400 mt-1">الكود: '+s.esc(x.item_code)+'</p><p class="text-xs text-slate-400">الباركود: '+s.esc(x.barcode||'—')+'</p><p class="text-xs text-slate-400">الوحدة: '+s.esc(x.unit||'حبة')+'</p></div></div>'
                +'<div class="grid grid-cols-2 gap-2 mt-4">'
                +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">سعر البيع</span><b class="block mt-1 text-white">'+f(x.sales_price||0)+'</b></div>'
                +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">التكلفة</span><b class="block mt-1 text-white">'+f(x.cost_price||0)+'</b></div>'
                +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">التصنيف</span><b class="block mt-1 text-white">'+s.esc(x.category||'أخرى')+'</b></div>'
                +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">المتاح</span><b class="block mt-1 text-white">'+(av===null?'اختر المصدر':f(av))+'</b></div></div>'
                +'<div class="flex items-center justify-between bg-slate-800 rounded-2xl p-4 mt-4 gap-3"><span class="text-2xl font-black text-emerald-400 whitespace-nowrap">'+f(x.sales_price||x.cost_price||0)+'</span>'+controls+'</div>'
                +'<div class="text-xs text-slate-400 mt-2">الحالة: <b class="text-slate-200">'+status+'</b></div></div>';
              Swal.fire({html:html,width:520,showCloseButton:true,showConfirmButton:false,customClass:{popup:'!bg-slate-900 !rounded-3xl !border !border-slate-700',closeButton:'!text-slate-400'}});
            };
            App._addFromDetail=function(code){this.add(code);this._refreshDetailPopup(code)};
            App._updateDetailQty=function(code,delta){var idx=this.cart.findIndex(function(c){return c.code===code});if(delta>0)this.add(code);else if(idx>=0)this.dec(idx);this._refreshDetailPopup(code)};

            App.renderProducts=function(){
              var s=this,q=(document.getElementById('wsSearch')||{}).value||'',z=this.norm(q);
              var a=this.items.filter(function(x){
                if(s.cat!=='الكل'&&(x.category||'أخرى')!==s.cat)return false;
                if(!z)return true;
                var n=s.norm(x.name),c=s.norm(x.item_code),b=s.norm(x.barcode),l=s.norm(x.search_label);
                return c===z||b===z||c.indexOf(z)===0||b.indexOf(z)===0||n.indexOf(z)>=0||l.indexOf(z)>=0;
              }).sort(function(a,b){
                if(!z)return String(a.name||'').localeCompare(String(b.name||''),'ar');
                function score(x){
                  var c=s.norm(x.item_code),br=s.norm(x.barcode),n=s.norm(x.name),l=s.norm(x.search_label);
                  return c===z?150:br===z?145:c.indexOf(z)===0?120:br.indexOf(z)===0?115:n.indexOf(z)>=0?75:l.indexOf(z)>=0?55:0;
                }
                return score(b)-score(a)||String(a.name||'').localeCompare(String(b.name||''),'ar');
              }).slice(0,120);
              RW_UI.safeText(RW_UI.byId('count'),a.length?' · '+a.length:'');
              var h=a.map(function(x){
                var av=s.avail(x.id),inCart=(s.cart.find(function(c){return c.id===x.id})||{}).qty||0,disabled=av!==null&&av<=0&&!(s.mode==='engine'&&s.type==='Adjustment')&&s.type!=='DirectReturn';
                return '<div class="product-card '+(disabled?'opacity-60':'')+'">'
                  +'<button type="button" data-item-id="'+s.esc(x.id)+'" class="w-full text-right" onclick="App.itemDetails(this.dataset.itemId)" title="عرض تفاصيل الصنف">'
                  +'<div class="product-img mb-2">'+(x.image_url?'<img src="'+s.esc(x.image_url)+'" loading="lazy">':'<i class="fa-solid fa-box text-2xl text-slate-600"></i>')+'</div>'
                  +'<div class="flex justify-between gap-2"><div class="min-w-0"><b class="text-xs truncate block">'+s.esc(x.name||x.item_code)+'</b><span class="text-[10px] text-slate-500">'+s.esc(x.item_code)+' · '+s.esc(x.unit||'حبة')+'</span></div><span class="text-[9px] text-slate-400">'+(av===null?'اختر المصدر':av>0?'متاح '+f(av):'غير متاح')+'</span></div></button>'
                  +'<div class="flex justify-between mt-2"><span class="text-[11px] text-emerald-400 font-black">'+f(x.sales_price||x.cost_price||0)+'</span>'
                  +'<button type="button" '+(disabled?'disabled':'')+' data-item-code="'+s.esc(x.item_code)+'" onclick="event.stopPropagation();App.add(this.dataset.itemCode)" class="w-9 h-9 rounded-full '+(!disabled?'bg-blue-600 hover:bg-blue-500':'bg-slate-700')+' flex items-center justify-center" title="إضافة">'+(inCart||'<i class="fa-solid fa-plus text-xs"></i>')+'</button></div></div>';
              }).join('');
              RW_UI.safeHTML(RW_UI.byId('products'),h||'<div class="col-span-full text-center text-slate-500 py-14">🔍 لا توجد نتائج</div>');
            };
            App.add=function(code){var s=this,x=this.items.find(function(i){return i.item_code===code});if(!x)return;var ex=this.cart.find(function(c){return c.id===x.id}),next=(ex?ex.qty:0)+1;if(!this.canAddQuantity(x,next)){RW_UI.toast('الكمية المتاحة في المصدر: '+f(this.avail(x.id)),'warning');return}if(ex)ex.qty=next;else this.cart.push({id:x.id,code:x.item_code,name:x.name||x.item_code,unit:x.unit||'حبة',qty:1,price:Number(x.sales_price||x.cost_price||0)});this.renderCart();this.renderProducts();this.updateResults()};
            App.inc=function(i){var x=this.cart[i];if(!x)return;var master=this.items.find(function(a){return a.id===x.id});if(!master)return;if(!this.canAddQuantity(master,x.qty+1)){RW_UI.toast('الكمية تتجاوز المتاح في المصدر','warning');return}x.qty++;this.renderCart();this.renderProducts();this.updateResults()};
            App.choose=function(t){this.type=t;this.mode=(t==='Scrap'||t==='Adjustment')?'engine':'voucher';this.toggleMenu();this.newWorkspace()};
            if(window.RW_SW&&navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.update().catch(function(){})})}).catch(function(){})}
            console.info('[VOUCHERS] '+marker+' loaded');
          })();`;

          const start = s.indexOf(marker);
          if (start >= 0) {
            const end = s.indexOf('</script>', start);
            if (end < 0) throw new Error('SCRIPT_CLOSE_NOT_FOUND');
            s = s.slice(0, start) + gm + '\n' + s.slice(end);
          } else {
            const target = '</script><script src="../register-sw.js"></script>';
            if (!s.includes(target)) throw new Error('VOUCHERS_SCRIPT_TARGET_NOT_FOUND');
            s = s.replace(target, gm + '\n</script><script src="../register-sw.js"></script>');
          }

          fs.writeFileSync(path, s);
          NODE

      - name: Syntax and static audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          if not scripts: raise SystemExit('NO_INLINE_SCRIPT')
          Path('/tmp/vouchers-inline.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          required=['doLogin','init','choose','details','itemDetails','send','cancel','receive','complete','renderWorkspace','renderProducts','renderCart','submit']
          for name in required:
            if name+':function' not in s and 'App.'+name+'=function' not in s: raise SystemExit('MISSING_APP_METHOD:'+name)
          checks=['RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20','marker=\'GOLD-MASTER-2026-08-20\'','workspaceCollapseBtn','workspaceCollapseFloat','App.toggleWorkspaceHead=function','App.itemDetails=function','App._addFromDetail=function','event.stopPropagation();App.add(this.dataset.itemCode)']
          for x in checks:
            if x not in s: raise SystemExit('MISSING_INVARIANT:'+x)
          if re.search(r"supabase\.from\(['\"]stock_branches['\"]\)\.(update|insert|upsert|delete)",s,re.I): raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITE_DETECTED')
          if re.search(r"supabase\.from\(['\"]inventory_log['\"]\)\.(update|insert|upsert|delete)",s,re.I): raise SystemExit('DIRECT_PHYSICAL_LOG_WRITE_DETECTED')
          if 'RW_VOUCHER_RECEIVE:' not in s: raise SystemExit('RECEIVE_IDENTITY_MISSING')
          print('STATIC_AUDIT_PASS')
          PY
          node --check /tmp/vouchers-inline.js
          git diff --check
          echo 'NODE_SYNTAX_PASS'

      - name: Commit Gold Master
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git config user.name 'rawaea-cto-bot'
          git config user.email 'rawaea-cto-bot@users.noreply.github.com'
          git add Current/PWA/vouchers.html .github/workflows/gold-master-vouchers-20260820.yml
          git commit -m 'fix(vouchers): finalize forensic Gold Master [gold-master]' || echo 'NO_CHANGES'
          git push origin HEAD:${{ github.head_ref }}
