name: Gold Master Vouchers Forensic Build

on:
  push:
    branches:
      - gold-master-vouchers-20260820
  pull_request:
    branches:
      - main

jobs:
  forensic-build:
    if: ${{ !contains(github.event.head_commit.message, '[gold-master]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Apply surgical Gold Master patch
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'Current/PWA/vouchers.html';
          let s = fs.readFileSync(path, 'utf8');
          function replaceMethod(name, nextName, body) {
            const re = new RegExp(name + ':function\\([\\s\\S]*?\\},' + nextName + ':function');
            if (!re.test(s)) throw new Error('method boundary not found: ' + name + ' -> ' + nextName);
            s = s.replace(re, body + ',' + nextName + ':function');
          }
          s = s.replace('<meta name="theme-color" content="#21154f">', '<meta name="theme-color" content="#21154f"><meta name="rw-build" content="RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20">');
          s = s.replace('.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b;overscroll-behavior:contain}', '.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b;overscroll-behavior:contain;overflow:hidden}.catalog-grid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}');
          s = s.replace('.cart{min-width:0;display:flex;flex-direction:column;min-height:0;background:#111827}', '.cart{min-width:0;display:flex;flex-direction:column;min-height:0;background:#111827;overflow:hidden}.cart-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}');
          s = s.replace('var App={user:null,company:null,', "var App={build:'RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20',user:null,company:null,");
          replaceMethod('choose','loadList', String.raw`choose:function(t){this.type=t;this.mode=(t==='Scrap'||t==='Adjustment')?'engine':'voucher';var labels={Transfer:'تحويل داخلي',DirectSale:'صرف مباشر',DirectReturn:'مرتجع مباشر',SupplierReturn:'مرتجع مورد',Scrap:'إتلاف / إعدام',Adjustment:'تسوية جرد'};var label=document.getElementById('typeLabel');if(label)label.textContent=labels[t]||'إذن جديد';this.toggleMenu();this.newWorkspace()}`);
          replaceMethod('loadRefs','tab', String.raw`loadRefs:function(){var s=this;return Promise.all([supabase.from('branches').select('id,branch_code,name,is_active').eq('company_id',s.company).eq('is_active',true).order('name'),supabase.from('vehicles').select('id,vehicle_code,status,driver_id').eq('company_id',s.company).eq('status','Active').order('vehicle_code'),supabase.from('suppliers').select('id,supplier_code,name,is_active').eq('company_id',s.company).eq('is_active',true).order('name')]).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;if(r[2].error)throw r[2].error;var branches=r[0].data||[],vehicles=r[1].data||[],map={};for(var i=0;i<vehicles.length;i++){var code='VAN-'+String(vehicles[i].vehicle_code||'').trim().toUpperCase();for(var j=0;j<branches.length;j++){if(String(branches[j].branch_code||'').toUpperCase()===code){map[vehicles[i].id]=branches[j].id;break}}}s.refs={branches:branches,vehicles:vehicles,suppliers:r[2].data||[],vehicleBranchMap:map}})`);
          replaceMethod('catSet','source', String.raw`catSet:function(c){this.cat=c;this.renderCats();this.renderProducts()},onAdjustmentModeChange:function(){this.renderProducts();this.updateResults()}`);
          replaceMethod('avail','renderProducts', String.raw`avail:function(id){var e=RW_UI.byId('wsFrom');if(!e||!e.value)return null;var branchId=e.value;if(this.type==='DirectReturn')branchId=(this.refs.vehicleBranchMap||{})[e.value]||null;if(!branchId)return null;var k=branchId+':'+id;return Object.prototype.hasOwnProperty.call(this.stock,k)?Number(this.stock[k]||0):0},canAddQuantity:function(item,qty){var av=this.avail(item.id);if(av===null)return true;if(this.mode==='engine'){if(this.type==='Adjustment'){var m=RW_UI.byId('wsMode'),mode=m?m.value:'replace';if(mode==='replace'||mode==='add')return true;return qty<=av}return qty<=av}if(this.type==='DirectReturn')return true;return qty<=av},renderProducts:function(){var s=this,q=(RW_UI.byId('wsSearch')||{}).value||'',z=this.norm(q),a=this.items.filter(function(x){if(s.cat!=='الكل'&&(x.category||'أخرى')!==s.cat)return false;if(!z)return true;var n=s.norm(x.name),c=s.norm(x.item_code),b=s.norm(x.barcode),l=s.norm(x.search_label);return c===z||b===z||c.indexOf(z)===0||b.indexOf(z)===0||n.indexOf(z)>=0||l.indexOf(z)>=0}).sort(function(a,b){function score(x){if(!z)return 0;var c=s.norm(x.item_code),br=s.norm(x.barcode),n=s.norm(x.name),l=s.norm(x.search_label);return c===z?140:br===z?135:c.indexOf(z)===0?110:br.indexOf(z)===0?105:n.indexOf(z)>=0?70:l.indexOf(z)>=0?50:0}return score(b)-score(a)||String(a.name||'').localeCompare(String(b.name||''))}).slice(0,120);RW_UI.safeText(RW_UI.byId('count'),a.length?' · '+a.length:'');var h='';for(var i=0;i<a.length;i++){var x=a[i],av=s.avail(x.id),inCart=(s.cart.find(function(c){return c.id===x.id})||{}).qty||0,cls=av===null?'n':av>10?'g':av>0?'y':'r',txt=av===null?'اختر المصدر':av>0?'متاح '+f(av):'غير متاح',disabled=av!==null&&av<=0&&s.mode!=='engine'&&s.type!=='DirectReturn';h+='<div class="product-card '+(disabled?'opacity-60':'')+'"><button type="button" class="w-full text-right" onclick="App.itemDetails(\''+x.id+'\')" title="عرض تفاصيل الصنف"><div class="product-img mb-2">'+(x.image_url?'<img src="'+s.esc(x.image_url)+'" loading="lazy">':'<i class="fa-solid fa-box text-2xl text-slate-600"></i>')+'</div><div class="flex justify-between gap-2"><div class="min-w-0"><b class="text-xs truncate block">'+s.esc(x.name||x.item_code)+'</b><span class="text-[10px] text-slate-500">'+s.esc(x.item_code)+' · '+s.esc(x.unit||'حبة')+'</span></div><span class="text-[9px] text-slate-400"><i class="stock-dot '+cls+'"></i> '+txt+'</span></div></button><div class="flex justify-between mt-2"><span class="text-[11px] text-emerald-400 font-black">'+f(x.sales_price||x.cost_price||0)+'</span><button type="button" onclick="event.stopPropagation();App.add(\''+x.id+'\')" class="w-9 h-9 rounded-full '+(!disabled?'bg-blue-600 hover:bg-blue-500':'bg-slate-700')+' flex items-center justify-center" title="إضافة">'+(inCart||'<i class="fa-solid fa-plus text-xs"></i>')+'</button></div></div>'}if(!h)h='<div class="col-span-full text-center text-slate-500 py-14">🔍 لا توجد نتائج</div>';RW_UI.safeHTML(RW_UI.byId('products'),h)},itemDetails:function(id){var s=this,x=this.items.find(function(i){return i.id===id});if(!x)return;var av=this.avail(x.id),h='<div class="text-right"><div class="flex gap-4 items-start"><div class="w-28 h-28 rounded-3xl bg-slate-100 overflow-hidden flex items-center justify-center">'+(x.image_url?'<img src="'+s.esc(x.image_url)+'" class="w-full h-full object-cover">':'<i class="fa-solid fa-box text-4xl text-slate-400"></i>')+'</div><div class="flex-1"><h3 class="text-lg font-black">'+s.esc(x.name||x.item_code)+'</h3><p class="text-xs text-slate-400 mt-1">الكود: '+s.esc(x.item_code)+'</p><p class="text-xs text-slate-400">الباركود: '+s.esc(x.barcode||'—')+'</p><p class="text-xs text-slate-400">الوحدة: '+s.esc(x.unit||'حبة')+'</p></div></div><div class="grid grid-cols-2 gap-2 mt-4"><div class="p-3 bg-slate-50 rounded-2xl"><span class="text-[10px] text-slate-400">سعر البيع</span><b class="block mt-1">'+f(x.sales_price||0)+'</b></div><div class="p-3 bg-slate-50 rounded-2xl"><span class="text-[10px] text-slate-400">التكلفة</span><b class="block mt-1">'+f(x.cost_price||0)+'</b></div><div class="p-3 bg-slate-50 rounded-2xl"><span class="text-[10px] text-slate-400">التصنيف</span><b class="block mt-1">'+s.esc(x.category||'أخرى')+'</b></div><div class="p-3 bg-slate-50 rounded-2xl"><span class="text-[10px] text-slate-400">المتاح</span><b class="block mt-1">'+(av===null?'اختر المصدر':f(av))+'</b></div></div></div>';Swal.fire({title:'تفاصيل الصنف',html:h,showCancelButton:true,confirmButtonText:'إضافة إلى السلة',cancelButtonText:'إغلاق',customClass:{popup:'!rounded-3xl'}}).then(function(r){if(r.isConfirmed)s.add(id)})}`);
          replaceMethod('add','dec', String.raw`add:function(id){var x=this.items.find(function(i){return i.id===id});if(!x)return;var ex=this.cart.find(function(c){return c.id===id}),next=(ex?ex.qty:0)+1;if(!this.canAddQuantity(x,next)){RW_UI.toast('الكمية المتاحة في المصدر: '+f(this.avail(x.id)),'warning');return}if(ex)ex.qty=next;else this.cart.push({id:x.id,code:x.item_code,name:x.name||x.item_code,unit:x.unit||'حبة',qty:1,price:Number(x.sales_price||x.cost_price||0)});this.renderCart();this.renderProducts();this.updateResults()}`);
          replaceMethod('inc','remove', String.raw`inc:function(i){var x=this.cart[i];if(!x)return;var master=this.items.find(function(a){return a.id===x.id});if(!master)return;var next=x.qty+1;if(!this.canAddQuantity(master,next)){RW_UI.toast('الكمية تتجاوز المتاح في المصدر','warning');return}x.qty=next;this.renderCart();this.renderProducts();this.updateResults()}`);
          s = s.replace('this.mode=null;this.cart=[];this.tab(this.tabName)', "this.mode=null;this.cart=[];var label=document.getElementById('typeLabel');if(label)label.textContent='إذن جديد';this.tab(this.tabName)");
          s = s.replace("document.addEventListener('DOMContentLoaded',function(){if(location.hash&&/type=recovery|access_token=.*type=recovery/i.test(location.hash)){if(App.showRecovery)App.showRecovery()}else App.init()})", "document.addEventListener('DOMContentLoaded',function(){if(location.hash&&/type=recovery|access_token=.*type=recovery/i.test(location.hash)){if(App.showRecovery)App.showRecovery()}else App.init();console.log('[VOUCHERS] '+App.build+' loaded')})");
          s = s.replace('<button onclick="App.doLogin()"', '<button type="button" onclick="App.doLogin()"');
          s = s.replace('<button onclick="App.resetPassword()"', '<button type="button" onclick="App.resetPassword()"');
          s = s.replace('<button onclick="App.applyRecoveryPassword()"', '<button type="button" onclick="App.applyRecoveryPassword()"');
          s = s.replace('<button onclick="App.cancelRecovery()"', '<button type="button" onclick="App.cancelRecovery()"');
          fs.writeFileSync(path,s);
          NODE

      - name: Syntax and Gold Master static audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          Path('/tmp/vouchers-inline.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          if not scripts: raise SystemExit('NO_INLINE_SCRIPT')
          if 'stock_branches' in s and re.search(r"stock_branches[^\n]{0,120}\\.(?:update|insert|upsert)",s,re.I): raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITE_DETECTED')
          if 'inventory_log' in s and re.search(r"inventory_log[^\n]{0,120}\\.(?:update|insert|upsert)",s,re.I): raise SystemExit('DIRECT_PHYSICAL_LOG_WRITE_DETECTED')
          required=['doLogin','init','choose','details','itemDetails','send','cancel','receive','complete','renderWorkspace','renderProducts','renderCart','submit']
          for name in required:
              if not re.search(r'\\b'+re.escape(name)+r'\\s*:\\s*function',s): raise SystemExit('MISSING_APP_METHOD:'+name)
          if '<meta name="rw-build" content="RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20">' not in s: raise SystemExit('MISSING_BUILD_MARKER')
          if 'RW_VOUCHER_RECEIVE:' not in s: raise SystemExit('MISSING_RECEIVE_IDEMPOTENCY')
          if "RW_API.call('create-stock-voucher'" not in s: raise SystemExit('MISSING_CREATE_CAPABILITY')
          if "RW_API.call('receive-stock-voucher'" not in s: raise SystemExit('MISSING_RECEIVE_CAPABILITY')
          if "RW_API.call('bulk-stock-adjustment'" not in s: raise SystemExit('MISSING_ADJUSTMENT_CAPABILITY')
          print('STATIC_AUDIT_PASS')
          PY
          node --check /tmp/vouchers-inline.js

      - name: Commit Gold Master
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git config user.name 'rawaea-cto-bot'
          git config user.email 'rawaea-cto-bot@users.noreply.github.com'
          git add Current/PWA/vouchers.html
          git diff --cached --check
          git commit -m 'fix(vouchers): finalize Gold Master UX and interaction contract [gold-master]' || echo 'NO_CHANGES'
          git push origin HEAD:${{ github.head_ref || 'gold-master-vouchers-20260820' }}
