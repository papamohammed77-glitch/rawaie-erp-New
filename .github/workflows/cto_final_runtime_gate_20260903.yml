name: CTO independent Gold Diamond runtime gate — READ ONLY

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/sw.js'
      - 'Current/PWA/register-sw.js'
      - 'Current/manifest.json'
      - '.github/workflows/cto_final_runtime_gate_20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-diamond:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Static target gate
        shell: bash
        run: |
          set -euo pipefail
          test -f Current/PWA/New-main
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          assert len(s.encode())>500000, 'TARGET_TOO_SMALL'
          req=['<!doctype html>','<html lang="ar" dir="rtl">','P163-GOLD-DIAMOND-CLOSED-2026-09-03','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense=','applyAuthoritativeContext']
          miss=[x for x in req if x not in s]
          assert not miss, f'STATIC_MISSING={miss}'
          assert s.count('<link rel="manifest" href="../manifest.json">')==1, 'MANIFEST_LINK_DRIFT'
          assert './New-main.manifest.json' not in s, 'SELF_MANIFEST_LINK'
          m=json.loads(Path('Current/manifest.json').read_text())
          assert (m.get('start_url'),m.get('scope'),m.get('lang'),m.get('dir'))==('./PWA/New-main','./PWA/','ar','rtl'), 'ROOT_MANIFEST_CONTRACT'
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_BYTES='+str(len(s.encode())))
          print('STATIC_GOLD_DIAMOND=PASS')
          PY
      - name: Browser runtime gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-site && mkdir -p /tmp/rawaea-site
          cp -a Current /tmp/rawaea-site/Current
          cat >/tmp/rawaea-http.py <<'PY'
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          class H(SimpleHTTPRequestHandler):
            def guess_type(self,path): return 'text/html; charset=utf-8' if path.endswith('/New-main') else super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          (cd /tmp/rawaea-site && python3 /tmp/rawaea-http.py >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          trap 'kill "$(cat /tmp/http.pid)" 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e))); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.route('**/*',async r=>{const u=r.request().url();
              if(u.includes('supabase.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},from:()=>{let q={};for(const k of ['select','eq','in','or','order','range','gte','lte','limit','update','insert','delete'])q[k]=function(){return q};q.maybeSingle=async()=>({data:null,error:null});return q},rpc:async()=>({data:null,error:null})})};`});
              if(u.includes('chart.umd.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false}),close(){},showLoading(){}};'});
              if(u.includes('xlsx.full.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={utils:{}};'});
              if(u.includes('font-awesome'))return r.fulfill({status:200,contentType:'text/css',body:''}); return r.continue();});
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1200);
            const out=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,L=document.querySelector('link[rel="manifest"]'); if(!S||!N)throw Error('CORE_GLOBALS_MISSING');
              let denied=false,allowed=false,text=false; S.app.currentUser={id:'x',isOwner:false,permissions:[]}; try{await N.navigate('license')}catch(e){denied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}
              S.permissions=['*'];S.app.currentUser.permissions=['*'];S.app.currentUser.isOwner=true; try{await N.navigate('license');allowed=true;text=/إدارة الترخيص/.test(document.getElementById('rw-page-container')?.innerText||'')}catch(e){}
              const m=L?await(await fetch(L.href)).json():null; const sw=await fetch('./sw.js'); return {locale:document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',auth:typeof RW_Auth==='object',nav:typeof N==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',ownerLicense:typeof RW_OwnerLicense==='object',notification:typeof RW_Notification?.showPanel==='function',denied,allowed,text,wildcard:S.permissions.includes('*'),owner:S.app.currentUser.isOwner===true,diamond:document.documentElement.outerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:L?.getAttribute('href')||'',start:m?.start_url||'',scope:m?.scope||'',sw:sw.status};});
            console.log(JSON.stringify({out,pe,ce}));
            const ok=!pe.length&&!ce.length&&out.locale&&out.auth&&out.nav&&out.views&&out.shell&&out.ownerLicense&&out.notification&&out.denied&&out.allowed&&out.text&&out.wildcard&&out.owner&&out.diamond&&out.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&out.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&out.manifest==='../manifest.json'&&out.start==='./PWA/New-main'&&out.scope==='./PWA/'&&out.sw===200; await b.close(); if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo 'GOLD_BROWSER=PASS'
          echo 'DIAMOND_BROWSER=PASS'
      - name: Persistence boundary
        run: |
          echo 'TARGET=Current/PWA/New-main'
          echo 'VERIFIER=READ_ONLY'
          echo 'NO_TARGET_WRITE=TRUE'