name: governed-main4-rebuild — ARCHIVED VERIFY ONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main/main4.md'
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived fragment
        run: |
          set -euo pipefail
          test -s Current/PWA/main/main4.md
          ! grep -q "git push" .github/workflows/governed-main4-rebuild.yml
          echo "ARCHIVED_VERIFY_ONLY_PASS"
