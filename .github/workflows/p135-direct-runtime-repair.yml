name: RAWAEA P135 DIRECT RUNTIME REPAIR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  closure:
    if: startsWith(github.event.head_commit.message, '[CTO-TRUSTED-ARTIFACT-RUN]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Trusted artifact restore and PWA-only normalization
        shell: bash
        run: |
          set -euo pipefail
          git show 339aa1829b44e9f8babce39f69a9bb66f0de5be6:Current/PWA/New-main > Current/PWA/New-main
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          req=['window.RW_PWA_RECONSTRUCTION_VERSION=\'MAIN2-COMPLETE-SURGICAL-v1\';','// MAIN2_GOVERNED_CLOSED:v1','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense = RW_OwnerLicense;','MAIN3','MAIN11','function main1Delegation(','var actions=','post_stock_movement','get_trial_balance','get_profit_loss','get_balance_sheet','edgeCall']
          for x in req: assert x in s,x
          assert s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')==1
          s=re.sub(r'\n?<meta name="rw-pwa-runtime-gold"[^>]*>','',s,count=1)
          s=re.sub(r'\n?<script id="RAWAEA_TARGET_SW_COORDINATOR"[^>]*></script>','',s,count=1)
          assert s.count('</head>')==1
          s=s.replace('<link rel="manifest" href="../manifest.json">','<link rel="manifest" href="./New-main.manifest.json">',1)
          s=s.replace('</head>','<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">\n<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>\n</head>',1)
          p.write_text(s,encoding='utf-8')
          Path('Current/PWA/New-main.manifest.json').write_text(json.dumps({'name':'الروائع ERP','short_name':'الروائع ERP','description':'منصة إدارة الأعمال الذكية والمتكاملة - الروائع ERP','start_url':'./New-main','scope':'./','display':'standalone','dir':'rtl','lang':'ar','background_color':'#f8fafc','theme_color':'#2563eb','icons':[{'src':'./New-main-icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('Current/PWA/New-main-icon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2563eb"/><text x="256" y="325" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" font-size="270" font-weight="900" fill="#fff">ر</text></svg>\n',encoding='utf-8')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_BYTES='+str(len(s.encode())))
          PY
      - name: Static Gold Diamond gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < Current/PWA/New-main)" -gt 150000
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          test "$(grep -o 'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1' Current/PWA/New-main | wc -l)" -eq 1
          test "$(grep -o 'MAIN2_GOVERNED_CLOSED:v1' Current/PWA/New-main | wc -l)" -eq 1
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess,tempfile
          class T(HTMLParser):
            def __init__(self): super().__init__(); self.cur=None; self.items=[]
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.cur={'src':dict(a).get('src'),'x':''}; self.items.append(self.cur)
            def handle_data(self,d):
              if self.cur is not None:self.cur['x']+=d
            def handle_endtag(self,t):
              if t.lower()=='script':self.cur=None
          q=T(); q.feed(Path('Current/PWA/New-main').read_text(encoding='utf-8')); inline=[x['x'] for x in q.items if not x['src'] and x['x'].strip()]
          assert len(inline)==1
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          finally:f.unlink(missing_ok=True)
          print('STATIC_GOLD_DIAMOND_PASS')
          PY
      - name: Real HTTP Chromium Gold Diamond gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-site && mkdir -p /tmp/rawaea-site && cp -a Current/PWA/. /tmp/rawaea-site/ && cp Current/PWA/New-main /tmp/rawaea-site/main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-site >/tmp/rawaea-http.log 2>&1 & pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const e=[];
          await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('supabase.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:"window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),getUser:async()=>({data:{user:null},error:null}),signOut:async()=>({error:null})}})};"});if(u.includes('chart.umd.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:()=>Promise.resolve(),close:()=>{},showLoading:()=>{}};'});if(u.includes('xlsx.full.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={};'});if(u.includes('font-awesome'))return r.fulfill({status:200,contentType:'text/css',body:''});return r.continue()});p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:20000});await p.waitForSelector('#rw-login-page',{timeout:10000});const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views;const req=['dashboard','telesales','customers','suppliers','branches','pos','purchase-pos','purchases','orders','runsheets','online-store','items','inventory','vouchers','picking','loading','delivery','returns','unloading','finance','reports','hr','crm','users','roles','license','settings','notifications'];const missing=req.filter(x=>!Object.prototype.hasOwnProperty.call((V&&V.permissionMap)||{},x));let ld=false,ad=false;if(S?.app&&N?.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(x){ld=String(x.message||x)==='OWNER_ONLY'}try{await N.navigate('audit')}catch(x){ad=String(x.message||x)==='OWNER_ONLY'}}const m=document.querySelector('link[rel="manifest"]');const mj=await(await fetch(m.href)).json();return{lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.querySelector('#rw-login-page'),shell:!!document.querySelector('#rw-main-shell'),state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shellCtx:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,missing,licenseDenied:ld,auditDenied:ad,mods:['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Views'].every(x=>!!window[x]),diamond:document.documentElement.outerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),version:window.RW_PWA_RECONSTRUCTION_VERSION||null,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||null,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||null,manifest:m?.getAttribute('href'),start:mj.start_url,scope:mj.scope}});console.log(JSON.stringify({r,e},null,2));const ok=!e.length&&r.lang==='ar'&&r.dir==='rtl'&&r.login&&r.shell&&r.state&&r.auth&&r.nav&&r.views&&r.shellCtx&&r.owner&&!r.missing.length&&r.licenseDenied&&r.auditDenied&&r.mods&&r.diamond&&r.version==='MAIN2-COMPLETE-SURGICAL-v1'&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.start==='./New-main'&&r.scope==='./';await b.close();if(!ok)process.exit(2)})().catch(x=>{console.error(x.stack||x);process.exit(2)});
          NODE
          echo GOLD_BROWSER_PASS && echo DIAMOND_BROWSER_PASS
      - name: Persist exact CLOSED state and retire temporary carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,datetime
          p=Path('Current/PWA/New-main'); h=hashlib.sha256(p.read_bytes()).hexdigest(); st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8').rstrip(); marker='## CTO WHOLE NEW-MAIN CLOSURE — 2026-09-03 (LIVE VERIFIED)'
          if marker in s:s=s[:s.index(marker)].rstrip()
          s += f'''\n\n{marker}\n- Verified target artifact restored from trusted complete source `339aa1829b44e9f8babce39f69a9bb66f0de5be6`; no fragment reconstruction.\n- Target SHA-256: `{h}`.\n- Static Gold/Diamond: PASS. Real HTTP Chromium Gold/Diamond: PASS; Arabic RTL boot, core state/auth/navigation/views/shell/owner contracts, permission-map routes, owner-only guards, manifest lineage and P163/PWA markers verified; page/console errors = 0.\n- Diamond 122 and MAIN2 governed closure retained.\n- Production Supabase writes: NONE.\n- Destructive historical baseline executors retired.\n- Whole `Current/PWA/New-main`: GOLD = PROVEN; DIAMOND = PROVEN; CLOSED = PROVEN.\n'''
          st.write_text(s+'\n',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Final'; git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git rm -f .github/workflows/p135-direct-runtime-repair.yml .github/workflows/cto_trusted_artifact_closure_20260903.yml .github/workflows/_cto_final_gold_diamond_verify_20260903.yml tools/_cto_final_gold_diamond_verify_20260903.js 2>/dev/null || true
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[FINAL-VERIFIED] [GOLD-PROVEN] [DIAMOND-PROVEN] [CLOSED] Current/PWA/New-main'
          git push origin HEAD:main
