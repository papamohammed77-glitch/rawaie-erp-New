    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Execute governed New-main reconstruction and P163
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          mod_path=Path('tools/run_final_main_reconstruction_20260831.py')
          spec=importlib.util.spec_from_file_location('recon',mod_path)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          def validate_phase_js_after_boundary(chunks):
              first_script=m.re.search(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*)',chunks[0],m.re.I)
              if not first_script: raise RuntimeError('MAIN1_INLINE_SCRIPT_MISSING_FOR_PHASE_VALIDATION')
              js_body=first_script.group(1)
              for idx in range(1,len(chunks)+1):
                  if idx>1: js_body+='\\n\\n'+chunks[idx-1]
                  if idx<2: continue
                  temp=Path('/tmp')/f'rawaea-phase-{idx}.js'
                  temp.write_text(js_body,encoding='utf-8')
                  import subprocess
                  r=subprocess.run(['node','--check',str(temp)],capture_output=True,text=True)
                  if r.returncode: raise RuntimeError(f'JS_PHASE_SYNTAX_FAIL:main{idx}:\\n{r.stderr}')
          m.validate_phase_js=validate_phase_js_after_boundary
          m.main()
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'
          auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          version="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"
          governed='// MAIN2_GOVERNED_CLOSED:v1'
          required=['main1Delegation','actions','MAIN3','post_stock_movement','reserve_stock','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_OwnerLicense','RW_GOLD_DIAMOND']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('CONTRACT_MISSING:'+repr(missing))
          checks={'compat_absent':compat not in s,'auth_one':s.count(auth)==1,'version_one':s.count(version)==1,'governed_one':s.count(governed)==1,'dashboard_alias_absent':'window.RW_Dashboard={render:renderDashboard};' not in s,'items_alias_absent':'window.RW_Items={render:renderItems};' not in s,'actions':'actions' in s,'main1Delegation':'main1Delegation' in s,'main3':'MAIN3' in s,'script_balance':s.lower().count('<script')==s.lower().count('</script>'),'style_balance':s.lower().count('<style')==s.lower().count('</style>'),'canonical_sw_once':s.count("navigator.serviceWorker.register('./sw.js',{scope:'./'})")==1}
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('P163_GOLD_GATES_FAIL:'+repr(bad))
          print('P163_GOLD_GATES_PASS',checks)
          print('NEW_MAIN_SHA256',hashlib.sha256(s.encode()).hexdigest())
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_RUNTIME_COUNT='+str(len(ms)))
          Path('/tmp/rawaea-new-main.js').write_text(ms[0].group('b'),encoding='utf-8')
          PY
          node --check /tmp/rawaea-new-main.js

      - name: Browser runtime smoke on New-main
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-final && mkdir -p /tmp/rawaea-final
          cp -r Current/PWA/. /tmp/rawaea-final/
          cp Current/PWA/New-main /tmp/rawaea-final/New-main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-final >/tmp/rawaea-final.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const errors=[];p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto('http://127.0.0.1:8123/New-main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200);const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation,flat=[];(function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);let denied=false;if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(e){denied=e.message==='OWNER_ONLY'}}return{lang:document.documentElement.lang,body:!!document.body,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract,critical:['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'].every(v=>flat.includes(v)),mods:['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'].every(v=>!!window[v]),denied,count:flat.length,gd:!!window.RW_GOLD_DIAMOND}});console.log(JSON.stringify({r,errors}));if(errors.length||r.lang!=='ar'||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.critical||!r.mods||!r.denied||r.count<30||!r.gd)process.exit(2);await b.close()})().catch(e=>{console.error(e);process.exit(2)});
          NODE

