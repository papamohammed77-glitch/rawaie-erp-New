name: Medhat auth login verification

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/register-sw.js'
      - 'Current/PWA/sw.js'
      - 'Current/manifest.json'
      - '.github/workflows/medhat-auth-login-verification-20260818.yml'

permissions:
  contents: write

concurrency:
  group: rawaea-authoritative-newmain-closure
  cancel-in-progress: false

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message || '', '[FINAL-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Target-preserving surgical fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re, subprocess, tempfile, hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          before=s
          old_manifest='<link rel="manifest" href="../manifest.json">'
          new_manifest='<link rel="manifest" href="./New-main.manifest.json">'
          if old_manifest in s:
              if s.count(old_manifest)!=1: raise SystemExit('MANIFEST_OLD_CARDINALITY')
              s=s.replace(old_manifest,new_manifest,1)
          elif new_manifest not in s:
              raise SystemExit('MANIFEST_CONTRACT_MISSING')
          meta='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if meta not in s:
              if s.count('</head>')!=1: raise SystemExit('HEAD_CARDINALITY')
              s=s.replace('</head>',meta+'\n</head>',1)
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if coord not in s:
              if s.count('</head>')!=1: raise SystemExit('HEAD_CARDINALITY_2')
              s=s.replace('</head>',coord+'\n</head>',1)
          # Exactly one owner authority surface is required; never delete it.
          if s.count('window.RW_OwnerLicense={')!=1: raise SystemExit('OWNER_AUTHORITY_CARDINALITY')
          old_email="async function showPanel(){\n  var e=email();"
          new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old_email in s:
              if s.count(old_email)!=1: raise SystemExit('NOTIFICATION_OLD_CARDINALITY')
              s=s.replace(old_email,new_email,1)
          elif new_email not in s:
              raise SystemExit('NOTIFICATION_BINDING_CONTRACT_MISSING')
          required=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_ShellContext','window.RW_OwnerLicense={','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=','rw-pwa-runtime-gold','RAWAEA_TARGET_SW_COORDINATOR']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('CONTRACT_MISSING:'+repr(missing))
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_BUG_REMAINS')
          if s.count('rw-pwa-runtime-gold')!=1 or s.count('RAWAEA_TARGET_SW_COORDINATOR')!=1: raise SystemExit('PWA_CARDINALITY')
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.scripts=0; self.styles=0
              def handle_starttag(self,t,a):
                  t=t.lower()
                  if t=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
                  elif t=='style': self.styles+=1
              def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']: self.cur['text']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                      self.cur=None
          hp=P(); hp.feed(s); hp.close()
          if len(hp.inline)!=1: raise SystemExit(f'INLINE_RUNTIME_COUNT:{len(hp.inline)}')
          j=Path(tempfile.mkstemp(suffix='.js')[1]); j.write_text(hp.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(j)],check=True)
          finally: j.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          if (m.get('start_url'),m.get('scope'),m.get('lang'),m.get('dir'))!=('./New-main','./','ar','rtl'): raise SystemExit('DEDICATED_MANIFEST_FAIL')
          fm=json.loads(Path('Current/manifest.json').read_text(encoding='utf-8'))
          if (fm.get('start_url'),fm.get('scope'),fm.get('lang'),fm.get('dir'))!=('./PWA/New-main','./PWA/','ar','rtl'): raise SystemExit('FALLBACK_MANIFEST_FAIL')
          for f in ['Current/PWA/register-sw.js','Current/PWA/sw.js','Current/PWA/New-main-icon.svg']:
              if not Path(f).exists(): raise SystemExit('PWA_FILE_MISSING:'+f)
          if s==before: raise SystemExit('NO_NEW_TARGET_CHANGE')
          p.write_text(s,encoding='utf-8')
          print('TARGET_SURGICAL_CHANGE=PASS')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
      - name: Chromium exact-target runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rawaea && mkdir -p /tmp/rawaea
          cp -a Current/PWA/. /tmp/rawaea/
          (cd /tmp/rawaea && python3 -m http.server 8123 >/tmp/rawaea-http.log 2>&1 & echo $! >/tmp/rawaea.pid)
          trap 'kill "$(cat /tmp/rawaea.pid)" 2>/dev/null || true' EXIT
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(u.startsWith('https://') && !u.includes('raw.githubusercontent.com')) return r.abort();
              return r.continue();
            });
            const pe=[],ce=[]; p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1200);
            const r=await p.evaluate(async()=>({
              ar:document.documentElement.lang==='ar',dir:document.documentElement.dir==='rtl',body:!!document.body,
              state:!!window.RW_STATE,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,
              diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),
              p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',
              manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',notification:typeof window.RW_Notification?.showPanel==='function',
              notificationSource:(typeof window.RW_Notification?.showPanel==='function' ? String(window.RW_Notification.showPanel).includes('RW_STATE') : false)
            }));
            console.log('FINAL_RUNTIME='+JSON.stringify({r,pe,ce})); await b.close();
            const ok=!pe.length&&!ce.length&&r.ar&&r.dir&&r.body&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.notification;
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Persist verified closure and commit target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('Current/PWA/New-main'); h=hashlib.sha256(p.read_bytes()).hexdigest(); b=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## FINAL-CLOSED — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          block=f'''\n\n{marker}\n- Target: `Current/PWA/New-main`\n- Git blob: `{b}`\n- SHA-256: `{h}`\n- Target-preserving PWA manifest isolation: PASS.\n- Permanent service-worker coordinator: PASS.\n- Authoritative owner surface preserved exactly once: PASS.\n- Notification current-user email binding: PASS.\n- HTMLParser + Node static gates: PASS.\n- Exact-target Chromium smoke: PASS with zero page/console errors.\n- Production Supabase writes: NONE.\n- Reconstruction/rebuilding: NOT USED.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n'''
          if marker not in s: st.write_text(s.rstrip()+block+'\n',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[FINAL-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then git rebase origin/main; fi
          git push origin HEAD:main
