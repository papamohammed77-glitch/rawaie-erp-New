name: CTO Single Controlled New-main UX 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  surgery:
    if: github.event.head_commit.message != 'chore(cto): finalize New-main UX surgery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Surgical target repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode()) > 500000
          css="""
          .rw-input-wrapper{position:relative;width:100%}
          .rw-input-icon{position:absolute;top:50%;right:16px;transform:translateY(-50%);color:#94a3b8;font-size:16px;z-index:2;pointer-events:none}
          .rw-input-wrapper .rw-input{padding-right:46px}
          .rw-sidebar-user{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:16px;background:#f8fafc;border:1px solid #eef2f7;min-width:0}
          .rw-sidebar-user-avatar{width:42px;height:42px;min-width:42px;border-radius:13px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900}
          .rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .rw-sidebar-user-role{font-size:10px;color:#64748b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .rw-sidebar.collapsed .rw-sidebar-user{justify-content:center;padding:10px}
          .rw-sidebar.collapsed .rw-sidebar-user-name,.rw-sidebar.collapsed .rw-sidebar-user-role{display:none}
          .rw-login-logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
          """
          if '.rw-input-wrapper{position:relative;width:100%}' not in s:
              s=s.replace('</style>',css+'</style>',1)
          old_user='<div class="rw-sidebar-top"><div class="rw-sidebar-brand"><img id="rw-sidebar-brand-logo" class="rw-sidebar-brand-logo" alt="شعار الشركة"><div><div id="rw-sidebar-company-name" class="rw-sidebar-company-name">الروائع ERP</div><div id="rw-sidebar-company-subtitle" class="rw-sidebar-company-subtitle">Production Context</div></div></div></div>'
          new_user='<div class="rw-sidebar-top"><div class="rw-sidebar-brand"><img id="rw-sidebar-brand-logo" class="rw-sidebar-brand-logo" alt="شعار الشركة"><div><div id="rw-sidebar-company-name" class="rw-sidebar-company-name">الروائع ERP</div><div id="rw-sidebar-company-subtitle" class="rw-sidebar-company-subtitle">Production Context</div></div></div><div id="rw-sidebar-user" class="rw-sidebar-user"><div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div style="min-width:0"><div id="rw-sidebar-user-name" class="rw-sidebar-user-name">مستخدم</div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role">—</div></div></div></div>'
          assert s.count(old_user)==1
          s=s.replace(old_user,new_user,1)
          old_login='<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>'
          new_login='<div class="rw-login-logo" aria-label="شعار الشركة"><img id="rw-login-company-logo" alt="شعار الشركة" style="display:none"><span id="rw-login-company-fallback">ر</span></div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div class="rw-company-description">منصة إدارة الأعمال الذكية والمتكاملة</div>'
          assert s.count(old_login)==1
          s=s.replace(old_login,new_login,1)
          old_username='<label class="rw-form-label" for="rw-username">اسم المستخدم</label><input id="rw-username" class="rw-input" type="email" autocomplete="username">'
          new_username='<label class="rw-form-label" for="rw-username">اسم المستخدم</label><div class="rw-input-wrapper"><span class="rw-input-icon"><i class="fa-solid fa-user"></i></span><input id="rw-username" class="rw-input" type="email" autocomplete="username"></div>'
          assert s.count(old_username)==1
          s=s.replace(old_username,new_username,1)
          old_password='<input id="rw-password" class="rw-input" type="password" autocomplete="current-password">'
          new_password='<span class="rw-input-icon"><i class="fa-solid fa-lock"></i></span><input id="rw-password" class="rw-input" type="password" autocomplete="current-password">'
          assert s.count(old_password)==1
          s=s.replace(old_password,new_password,1)
          old_enter="var img=byId('rw-sidebar-brand-logo');if(img&&RW_STATE.app.company.logo)img.src=RW_STATE.app.company.logo;byId('rw-login-page').classList.add('hidden');"
          new_enter="var img=byId('rw-sidebar-brand-logo');if(img&&RW_STATE.app.company.logo)img.src=RW_STATE.app.company.logo;var su=byId('rw-sidebar-user-name');if(su)su.textContent=RW_STATE.app.currentUser.name||RW_STATE.app.currentUser.email||'مستخدم';var sr=byId('rw-sidebar-user-role');if(sr)sr.textContent=RW_STATE.app.currentUser.role||'—';var sa=byId('rw-sidebar-user-avatar');if(sa)sa.textContent=String((RW_STATE.app.currentUser.name||RW_STATE.app.currentUser.email||'م').trim()).charAt(0)||'م';var li=byId('rw-login-company-logo'),lf=byId('rw-login-company-fallback'),ln=byId('rw-login-company-name');if(ln)ln.textContent=RW_STATE.app.company.name||'الروائع ERP';if(li&&RW_STATE.app.company.logo){li.src=RW_STATE.app.company.logo;li.style.display='block';if(lf)lf.style.display='none'}byId('rw-login-page').classList.add('hidden');"
          assert s.count(old_enter)==1
          s=s.replace(old_enter,new_enter,1)
          helper="""
          var rwRemember=byId('rw-remember'),rwUsername=byId('rw-username');
          try{if(localStorage.getItem('rw_login_remember')==='1'){if(rwRemember)rwRemember.checked=true;if(rwUsername)rwUsername.value=localStorage.getItem('rw_login_email')||''}}catch(e){}
          var rwForgot=byId('rw-forgot');if(rwForgot)rwForgot.addEventListener('click',function(e){e.preventDefault();var email=rwUsername&&rwUsername.value.trim();if(!email){safeText(byId('rw-login-error'),'اكتب البريد الإلكتروني أولاً لاستعادة كلمة المرور.');byId('rw-login-error').classList.remove('hidden');return}showLoader('جاري إرسال رابط الاستعادة...');supabase.auth.resetPasswordForEmail(email,{redirectTo:location.href}).then(function(r){if(r.error)throw r.error;toast('تم إرسال رابط استعادة كلمة المرور','success')}).catch(function(err){safeText(byId('rw-login-error'),err.message||String(err));byId('rw-login-error').classList.remove('hidden')}).finally(hideLoader)});
          """
          anchor="byId('rw-login-form').addEventListener('submit',function(e){"
          assert s.count(anchor)==1
          s=s.replace(anchor,helper+'\n'+anchor,1)
          old_submit="var email=byId('rw-username').value.trim(),password=byId('rw-password').value;RW_Auth.login(email,password).catch(function(err){"
          new_submit="var email=byId('rw-username').value.trim(),password=byId('rw-password').value;try{if(byId('rw-remember')&&byId('rw-remember').checked){localStorage.setItem('rw_login_remember','1');localStorage.setItem('rw_login_email',email)}else{localStorage.removeItem('rw_login_remember');localStorage.removeItem('rw_login_email')}}catch(e){}RW_Auth.login(email,password).catch(function(err){"
          assert s.count(old_submit)==1
          s=s.replace(old_submit,new_submit,1)
          p.write_text(s,encoding='utf-8')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_BYTES='+str(len(s.encode())))
          PY
      - name: Static target gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['<!doctype html>','<html lang="ar" dir="rtl">','window.byId=byId;','window.safeText=safeText;','window.safeHTML=safeHTML;','window.RW_Auth=RW_Auth;','window.RW_Navigation=RW_Navigation;','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense=','RW_Permissions_check','rw-sidebar-user-name','rw-login-company-logo','supabase.auth.resetPasswordForEmail']
          missing=[x for x in req if x not in s]
          assert not missing,missing
          assert s.count("byId('rw-login-form').addEventListener('submit'")==1
          assert s.count("loginForm.addEventListener('submit'")==1
          assert './New-main.manifest.json' not in s
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          blocks=re.findall(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*?)</script>',s,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          r=subprocess.run(['node','--check','/tmp/inline.js'],capture_output=True,text=True)
          assert r.returncode==0,r.stderr
          print('STATIC_TARGET_ONLY=PASS')
          print('TARGET_BLOB='+subprocess.check_output(['git','hash-object','Current/PWA/New-main'],text=True).strip())
          PY
      - name: Chromium end-to-end shell gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-site; mkdir -p /tmp/rawaea-site/Current/PWA
          cp -a Current/PWA/. /tmp/rawaea-site/Current/PWA/
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('/tmp/rawaea-site'); ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid
          trap 'kill $(cat /tmp/http.pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e)));
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForTimeout(800);
            const base=await p.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,login:!!document.getElementById('rw-login-form'),toggle:typeof window.togglePasswordVisibility==='function',auth:typeof window.RW_Auth==='object',nav:typeof window.RW_Navigation==='object',views:typeof window.RW_Views==='object',shell:typeof window.RW_ShellContext==='object',owner:typeof window.RW_OwnerLicense==='object',sidebar:!!document.getElementById('rw-sidebar'),userCard:!!document.getElementById('rw-sidebar-user'),loginLogo:!!document.getElementById('rw-login-company-logo'),manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||''}));
            await p.click('#rw-password'); await p.evaluate(()=>window.togglePasswordVisibility('rw-password',document.querySelector('.rw-password-toggle')));
            const passwordType=await p.$eval('#rw-password',e=>e.type);
            const routes=await p.evaluate(async()=>{
              function q(table){const out={data:[],count:0,error:null};const obj={select(){return obj},eq(){return obj},in(){return obj},order(){return obj},limit(){return obj},range(){return obj},or(){return obj},maybeSingle:async()=>({data:table==='users'?{id:'db-user',name:'مالك النظام',email:'owner@alrawae.com',role:'Owner',company_id:'00000000-0000-0000-0000-000000000001',status:'Active',permissions:['*']}:table==='companies'?{id:'00000000-0000-0000-0000-000000000001',name:'الروائع',logo_url:'https://example.com/logo.svg'}:table==='owner_profile'?{auth_user_id:'auth-owner',owner_name:'مالك النظام',owner_email:'owner@alrawae.com',license_status:'Active'}:table==='app_settings'?{company_name:'الروائع',company_logo:'https://example.com/logo-settings.svg',status:'Active'}:null,error:null}),then:fn=>Promise.resolve(out).then(fn)};return obj}
              window.supabase.from=q;
              window.supabase.auth.getSession=async()=>({data:{session:null},error:null});
              RW_STATE.app.initialized=false;
              await RW_Auth.enterSystem({id:'auth-owner',email:'owner@alrawae.com',user_metadata:{isOwner:true}});
              const afterLogin={authenticated:RW_STATE.app.authenticated,companyId:RW_STATE.app.companyId,company:RW_STATE.app.company.name,logo:RW_STATE.app.company.logo,isOwner:RW_STATE.app.currentUser.isOwner,sidebarVisible:!document.getElementById('rw-main-shell').classList.contains('hidden'),sidebarUser:document.getElementById('rw-sidebar-user-name')?.textContent||''};
              const checks={};
              for(const v of ['dashboard','customers','orders','finance','settings','license']){try{const r=RW_Navigation.navigate(v);await new Promise(x=>setTimeout(x,50));checks[v]={ok:true,view:RW_STATE.app.currentView,text:(document.getElementById('rw-page-container')?.innerText||'').slice(0,300)};}catch(e){checks[v]={ok:false,error:String(e.message||e)}}}
              return {afterLogin,checks};
            });
            const out={base,passwordType,routes,pe,ce}; console.log('NEWMAIN_E2E='+JSON.stringify(out));
            const routeOk=Object.values(routes.checks).every(x=>x.ok);
            const ok=!pe.length&&!ce.length&&base.lang==='ar'&&base.dir==='rtl'&&base.login&&base.toggle&&base.auth&&base.nav&&base.views&&base.shell&&base.owner&&base.sidebar&&base.userCard&&base.loginLogo&&base.manifest===''
              &&passwordType==='text'&&routes.afterLogin.authenticated&&routes.afterLogin.companyId==='00000000-0000-0000-0000-000000000001'&&routes.afterLogin.company==='الروائع'&&routes.afterLogin.isOwner&&routes.afterLogin.sidebarVisible&&routes.afterLogin.sidebarUser==='مالك النظام'&&routeOk;
            await b.close(); if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo CHROMIUM_E2E=PASS
      - name: Commit target only and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/cto_single_controlled_newmain_ux_20260903.yml
          git add Current/PWA/New-main
          git diff --cached --check
          names=$(git diff --cached --name-only | sort)
          test "$names" = ".github/workflows/cto_single_controlled_newmain_ux_20260903.yml\nCurrent/PWA/New-main" || { echo "$names"; exit 1; }
          git config user.name 'RAWAEA CTO Controlled Executor'
          git config user.email 'rawaea-cto-controlled@users.noreply.github.com'
          git commit -m 'chore(cto): finalize New-main UX surgery'
          git push origin HEAD:main
