name: Forensic Runtime Closure 20260828
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  closure:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'forensic runtime closure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate canonical PWA runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          core=root/'Current/PWA/core.js'
          sw=root/'Current/PWA/sw.js'
          vouchers=root/'Current/PWA/vouchers.html'

          c=core.read_text(encoding='utf-8')
          old="var path = swPath || '../sw.js';"
          assert old in c, 'core default SW path anchor missing'
          c=c.replace(old,"var path = swPath || 'sw.js';",1)
          core.write_text(c,encoding='utf-8')

          s=sw.read_text(encoding='utf-8')
          s=s.replace("var STATIC_CACHE = 'rw-static-v1';","var STATIC_CACHE = 'rw-static-v2';",1)
          s=s.replace("var STATIC_EXTENSIONS = ['.css', '.woff', '.woff2', '.ttf', '.png', '.jpg', '.jpeg', '.svg', '.ico', '.webp', '.js'];","var STATIC_EXTENSIONS = ['.css', '.woff', '.woff2', '.ttf', '.png', '.jpg', '.jpeg', '.svg', '.ico', '.webp'];",1)
          anchor="function isStaticAsset(pathname) {"
          assert anchor in s, 'sw static asset anchor missing'
          insert="""function isRuntimeScript(pathname) {\n    var lowerPath = pathname.toLowerCase();\n    return lowerPath.slice(-3) === '.js' || lowerPath.slice(-4) === '.mjs';\n}\n\n"""
          s=s.replace(anchor,insert+anchor,1)
          anchor2="    // 3. الموارد الثابتة: Cache First مع حماية من تجاوز الحصة\n"
          assert anchor2 in s, 'sw fetch anchor missing'
          replacement="""    // 3. Runtime scripts: Network Only to prevent stale application code.\n    if (isRuntimeScript(url.pathname)) {\n        event.respondWith(fetch(request));\n        return;\n    }\n\n    // 4. الموارد الثابتة: Cache First مع حماية من تجاوز الحصة\n"""
          s=s.replace(anchor2,replacement,1)
          s=s.replace("    // 4. أي موارد أخرى: Network First مع fallback للكاش\n","    // 5. أي موارد أخرى: Network First مع fallback للكاش\n",1)
          s=s.replace("                            try {\n                                cache.put(request, copy);\n                            } catch (e) {\n                                // إذا فشل التخزين (مثلاً QuotaExceeded)، نتجاهل بهدوء\n                                console.warn('[SW] تعذر تخزين الملف (تجاوز الحصة):', url.pathname);\n                            }","                            cache.put(request, copy).catch(function(e) {\n                                console.warn('[SW] تعذر تخزين الملف (تجاوز الحصة):', url.pathname);\n                            });",1)
          s=s.replace("                    try {\n                        cache.put(request, copy);\n                    } catch (e) {\n                        console.warn('[SW] تعذر تخزين الملف:', url.pathname);\n                    }","                    cache.put(request, copy).catch(function(e) {\n                        console.warn('[SW] تعذر تخزين الملف:', url.pathname);\n                    });",1)
          sw.write_text(s,encoding='utf-8')

          v=vouchers.read_text(encoding='utf-8')
          old_scan=".from('items').select('id,item_code,barcode,name,search_label,category,unit,description,image_url,sales_price,cost_price,is_active').eq('is_active',true).or('barcode.eq.'+code+',item_code.eq.'+code).limit(1)"
          new_scan=".from('items').select('id,item_code,barcode,name,search_label,category,unit,description,image_url,sales_price,cost_price,is_active').eq('company_id',s.company).eq('is_active',true).or('barcode.eq.'+code+',item_code.eq.'+code).limit(1)"
          assert old_scan in v, 'voucher scan anchor missing'
          v=v.replace(old_scan,new_scan,1)
          vouchers.write_text(v,encoding='utf-8')
          PY

          node --check Current/PWA/core.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',p,re.S)
          Path('/tmp/vouchers-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/vouchers-inline.js
          test "$(grep -F "var path = swPath || '../sw.js';" -c Current/PWA/core.js)" -eq 0
          test "$(grep -F "STATIC_CACHE = 'rw-static-v2'" -c Current/PWA/sw.js)" -eq 1
          test "$(grep -F "slice(-3) === '.js'" -c Current/PWA/sw.js)" -eq 1
          test "$(grep -F ".eq('company_id',s.company)" -c Current/PWA/vouchers.html)" -ge 1
      - name: Commit and self-delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'rawaea-forensic-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/core.js Current/PWA/sw.js Current/PWA/vouchers.html
          git rm -f .github/workflows/forensic-runtime-closure-20260828.yml
          git commit -m 'chore: close shared PWA runtime path and cache drift' || exit 0
          git push origin HEAD:main
