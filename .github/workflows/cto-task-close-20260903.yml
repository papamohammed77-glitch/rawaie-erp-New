name: CTO temporary forensic task closer
on:
  push:
    branches: [cto-task-close-20260903]
permissions:
  contents: write
concurrency:
  group: cto-task-close-20260903
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch only the two published targets
        shell: bash
        env:
          EXPECTED_MAIN_SHA: 067c1228ea6e56fccbc11734fe35f4dbe94a12d2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess, tempfile, hashlib

          target=Path('Current/PWA/New-main')
          pub=Path('Current/PWA/manifest.json')
          legacy=Path('Current/PWA/New-main.manifest.json')
          s=target.read_text(encoding='utf-8')
          assert len(s.encode('utf-8'))>500000, 'TARGET_TOO_SMALL'

          old='<link rel="manifest" href="./New-main.manifest.json">'
          new='<link rel="manifest" href="./manifest.json">'
          if old in s:
              assert s.count(old)==1, 'MANIFEST_OLD_DUPLICATE'
              s=s.replace(old,new,1)
          assert s.count(new)==1, 'PUBLISHED_MANIFEST_REF_NOT_EXACTLY_ONE'

          marker='RAWAEA_MAIN_SIDEBAR_COMPLETENESS_V1'
          if marker not in s:
              patch=r'''<script id="RAWAEA_MAIN_SIDEBAR_COMPLETENESS_V1">
          (function(){
            'use strict';
            var nav=window.RW_Navigation;
            if(!nav||!Array.isArray(nav.menuTree))return;
            function group(label,icon){
              var g=nav.menuTree.find(function(x){return x&&x.label===label&&Array.isArray(x.submenu);});
              if(!g){g={label:label,icon:icon,submenu:[]};nav.menuTree.push(g);}
              return g;
            }
            function child(g,view,label,perm,icon){
              if(!g.submenu.some(function(x){return x&&x.view===view;}))g.submenu.push({view:view,label:label,perm:perm,icon:icon||'fa-circle'});
            }
            var sales=group('إدارة المبيعات','fa-chart-line');
            child(sales,'online-store','المتجر الإلكتروني','online-store:view','fa-store');
            var purchases=group('إدارة المشتريات','fa-truck');
            child(purchases,'purchase-pos','نقطة شراء','purchase-pos:view','fa-cash-register');
            var warehouse=group('المخازن والمخزون','fa-warehouse');
            child(warehouse,'branches','المخازن والفروع','branches:view','fa-code-branch');
            child(warehouse,'receiving','الاستلام','receiving:view','fa-box-open');
            child(warehouse,'picking','التحضير','picking:view','fa-hand-pointer');
            child(warehouse,'loading','التحميل','loading:view','fa-dolly');
            child(warehouse,'delivery','التوصيل','delivery:view','fa-truck-fast');
            child(warehouse,'return','المرتجعات','return:view','fa-rotate-left');
            child(warehouse,'vouchers','الأذونات المخزنية','vouchers:view','fa-file-invoice');
            child(warehouse,'transfer','تحويل مخزني','transfer:view','fa-right-left');
            child(warehouse,'direct-sale','صرف سيارة بيع مباشر','direct-sale:view','fa-car-side');
            child(warehouse,'direct-return','استلام مرتجع سيارة','direct-return:view','fa-rotate-right');
            child(warehouse,'supplier-return','مرتجع لمورد','supplier-return:view','fa-rotate-left');
            child(warehouse,'vehicle-count','جرد سيارة','vehicle-count:view','fa-truck-ramp-box');
            child(warehouse,'branch-count','جرد فرع','branch-count:view','fa-building');
            child(warehouse,'general-count','جرد عام','general-count:view','fa-clipboard-check');
            var admin=group('المالية والإدارة','fa-coins');
            child(admin,'finance','الحسابات والمالية','finance:view','fa-coins');
            child(admin,'reports','التقارير','reports:view','fa-chart-column');
            child(admin,'audit','سجل التدقيق','owner','fa-list-check');
            if(!nav.menuTree.some(function(x){return x&&x.view==='hr';}))nav.menuTree.push({view:'hr',icon:'fa-id-card',label:'الموارد البشرية',perm:'users:view'});
            if(!nav.menuTree.some(function(x){return x&&x.view==='crm';}))nav.menuTree.push({view:'crm',icon:'fa-handshake',label:'إدارة علاقات العملاء (CRM)',perm:'customers:view'});
            if(!nav.menuTree.some(function(x){return x&&x.view==='users';}))nav.menuTree.push({view:'users',icon:'fa-users-gear',label:'المستخدمون والصلاحيات',perm:'users:view'});
            if(!nav.menuTree.some(function(x){return x&&x.view==='roles';}))nav.menuTree.push({view:'roles',icon:'fa-user-shield',label:'أدوار المستخدمين',perm:'roles:view'});
            if(!nav.menuTree.some(function(x){return x&&x.view==='license';}))nav.menuTree.push({view:'license',icon:'fa-shield-halved',label:'إدارة الترخيص',perm:'owner'});
            if(!nav.menuTree.some(function(x){return x&&x.view==='settings';}))nav.menuTree.push({view:'settings',icon:'fa-gear',label:'إعدادات النظام',perm:'settings:view'});
          })();
          </script>'''
              assert s.count('</body>')==1, 'BODY_COUNT'
              s=s.replace('</body>',patch+'\n</body>',1)
          assert s.count(marker)==1
          target.write_text(s,encoding='utf-8')

          legacy_json=json.loads(legacy.read_text(encoding='utf-8'))
          pub_json=json.loads(pub.read_text(encoding='utf-8'))
          merged=dict(pub_json)
          for k,v in legacy_json.items():
              if k=='icons':
                  icons=list(merged.get('icons') or [])
                  seen={x.get('src') for x in icons if isinstance(x,dict)}
                  for icon in (v or []):
                      if isinstance(icon,dict) and icon.get('src') in seen:
                          continue
                      icons.append(icon); seen.add(icon.get('src'))
                  merged['icons']=icons
              elif k not in merged or merged[k] in (None,''):
                  merged[k]=v
          merged['start_url']='./New-main'
          merged['scope']='./'
          merged['display']='standalone'
          merged['dir']='rtl'
          merged['lang']='ar'
          pub.write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('TARGET_BYTES',len(s.encode('utf-8')))
          print('TARGET_SHA256',hashlib.sha256(s.encode('utf-8')).hexdigest())
          print('MANIFEST',json.dumps(merged,ensure_ascii=False,sort_keys=True))
          PY

          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess, tempfile
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          assert 'RAWAEA_MAIN_SIDEBAR_COMPLETENESS_V1' in s
          assert s.count('RAWAEA_MAIN_SIDEBAR_COMPLETENESS_V1')==1
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.cur=(dict(a).get('src'),'')
              def handle_data(self,d):
                  if self.cur is not None and not self.cur[0]: self.cur=(self.cur[0],self.cur[1]+d)
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur[0] and self.cur[1].strip(): self.inline.append(self.cur[1])
                      self.cur=None
          q=P(); q.feed(s); q.close(); assert q.inline
          for code in q.inline:
              f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(code,encoding='utf-8')
              try: subprocess.run(['node','--check',str(f)],check=True)
              finally: f.unlink(missing_ok=True)
          m=__import__('json').loads(Path('Current/PWA/manifest.json').read_text())
          assert (m['start_url'],m['scope'],m['display'],m['dir'],m['lang'])==('./New-main','./','standalone','rtl','ar')
          print('STATIC_GATE=PASS')
          PY

      - name: Browser UX and full-menu gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory Current/PWA >/tmp/cto-http.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          cat >/tmp/cto-gate.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({serviceWorkers:'block'}); const errors=[];
            await p.route('**/*',async route=>{
              const u=route.request().url();
              if(u.includes('cdn.jsdelivr.net/npm/@supabase/')) return route.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:null},error:new Error('stub')}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({}),resetPasswordForEmail:async()=>({})},from:()=>({select(){return this},eq(){return this},in(){return this},or(){return this},order(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null}),then:()=>Promise.resolve({data:[],error:null,count:0}),insert:async()=>({data:null,error:null}),update:()=>this,delete:()=>this})})};`});
              if(u.includes('cdn.jsdelivr.net/npm/chart.js')) return route.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});
              if(u.includes('cdn.jsdelivr.net/npm/sweetalert2')) return route.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){}};'});
              if(u.includes('cdn.sheetjs.com')) return route.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={utils:{},read(){return {}}};'});
              return route.continue();
            });
            p.on('pageerror',e=>errors.push('PAGE:'+e.message));
            p.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
            await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1200);
            const base=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const m=await(await fetch(l.href)).json();return{
              login:!!document.getElementById('rw-login-form'),loginCard:!!document.querySelector('.rw-login-card'),loginTitle:!!document.querySelector('.rw-login-title'),loginLogo:!!document.querySelector('.rw-login-logo'),
              sidebar:!!document.getElementById('rw-sidebar'),nav:!!document.getElementById('rw-sidebar-nav'),mainShell:!!document.getElementById('rw-main-shell'),
              shell:typeof RW_ShellContext==='object',auth:typeof RW_Auth==='object',navigation:typeof RW_Navigation==='object',views:typeof RW_Views==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof safeText==='function',
              manifestHref:l?.getAttribute('href')||'',start:m.start_url,scope:m.scope,display:m.display,dir:m.dir,lang:m.lang,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||''
            }});
            const menu=await p.evaluate(()=>{RW_STATE.app.currentUser={id:'owner-fixture',email:'owner@fixture',isOwner:true,permissions:['*']};RW_STATE.permissions=['*'];RW_Navigation.buildSidebar();return Array.from(document.querySelectorAll('#rw-sidebar-nav [data-view]')).map(x=>x.getAttribute('data-view')).filter(Boolean)});
            const text=await p.evaluate(()=>document.getElementById('rw-sidebar-nav')?.innerText||'');
            const ownerLicense=await p.evaluate(async()=>{try{RW_STATE.app.companyId='fixture-company';await RW_Navigation.navigate('license');return {ok:true,view:RW_STATE.app.currentView,container:!!document.getElementById('license-main-container')}}catch(e){return {ok:false,error:String(e.message||e)}}});
            const result={base,menu,text,ownerLicense,errors}; console.log('CTO_FORENSIC_GATE='+JSON.stringify(result));
            const expected=['dashboard','telesales','customers','pos','orders','runsheets','online-store','suppliers','purchase-pos','purchases','receiving','items','inventory','branches','picking','loading','delivery','return','vouchers','transfer','direct-sale','direct-return','supplier-return','vehicle-count','branch-count','general-count','finance','reports','audit','hr','crm','users','roles','license','settings','notifications'];
            const menuOk=expected.every(v=>menu.includes(v)||(v==='return'&&menu.includes('returns')));
            const visualOk=base.login&&base.loginCard&&base.loginTitle&&base.loginLogo&&base.sidebar&&base.nav&&base.mainShell;
            const runtimeOk=base.shell&&base.auth&&base.navigation&&base.views&&base.owner&&base.safeText;
            const manifestOk=base.manifestHref==='./manifest.json'&&base.start==='./New-main'&&base.scope==='.'+'/'&&base.display==='standalone'&&base.dir==='rtl'&&base.lang==='ar';
            const markersOk=base.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&base.pwa==='PWA-RUNTIME-GOLD-2026-09-03';
            const ok=!errors.length&&visualOk&&runtimeOk&&manifestOk&&markersOk&&menuOk&&ownerLicense.ok&&ownerLicense.view==='license'&&ownerLicense.container;
            await b.close(); if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          node /tmp/cto-gate.cjs
          echo BROWSER_GOLD_DIAMOND=PASS

      - name: Rebase patch onto the current main without carrying the temporary workflow
        shell: bash
        env:
          EXPECTED_MAIN_SHA: 067c1228ea6e56fccbc11734fe35f4dbe94a12d2
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          cp Current/PWA/New-main /tmp/New-main.patched
          cp Current/PWA/manifest.json /tmp/manifest.patched
          git checkout -B cto-final-publish origin/main
          cp /tmp/New-main.patched Current/PWA/New-main
          cp /tmp/manifest.patched Current/PWA/manifest.json
          git add Current/PWA/New-main Current/PWA/manifest.json
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "Current/PWA/New-main
          Current/PWA/manifest.json"
          git config user.name 'RAWAEA CTO Final Closure'
          git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main forensic visual/menu/PWA closure'
          git push origin HEAD:main
