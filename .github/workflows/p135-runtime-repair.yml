name: RAWAEA P135 One-Time Surgical Runtime Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p135-runtime-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rawaea-p135-one-time-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Forensic preflight and exact surgical patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          needle="function safeText(el,text){if(el)el.textContent=text==null?'':String(text)}"
          bridge="window.safeText=safeText;"
          assert s.count(needle)==1, 'safeText declaration count changed'
          assert s.count(bridge)==0, 'surgical bridge already present; refusing duplicate'
          before=hashlib.sha256(s.encode()).hexdigest()
          s=s.replace(needle, needle+'\n'+bridge, 1)
          p.write_text(s, encoding='utf-8')
          after=hashlib.sha256(s.encode()).hexdigest()
          print('BEFORE_SHA256='+before)
          print('AFTER_SHA256='+after)
          print('PATCH_COUNT=',s.count(bridge))
          PY
          node --check <(sed -n '/<script>/,/<\/script>/p' Current/PWA/New-main | sed '1d;$d')
          test $(grep -o 'window.safeText=safeText;' Current/PWA/New-main | wc -l) -eq 1
          echo 'SURGICAL_STATIC=PASS'
      - name: Commit exact target change and retire writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papamohammed77-glitch'
          git config user.email 'papamohammed77-glitch@users.noreply.github.com'
          git add Current/PWA/New-main
          git diff --cached --check
          git commit -m '[CTO-FORENSIC] Repair cross-IIFE safeText runtime scope'
          git rm .github/workflows/p135-runtime-repair.yml
          git commit -m '[CTO-GOVERNANCE] Retire one-time runtime repair writer'
          git push origin HEAD:main
