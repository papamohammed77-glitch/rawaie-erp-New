name: RAWAEA P135 One-Time Surgical Runtime Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p135-runtime-repair.yml'
      - 'Current/PWA/New-main'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rawaea-p135-one-time-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Exact target surgical patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          byid_decl="function byId(id){return document.getElementById(id)}"
          byid_bridge="window.byId=byId;"
          safetext_decl="function safeText(el,text){if(el)el.textContent=text==null?'':String(text)}"
          safetext_bridge="window.safeText=safeText;"
          assert s.count(byid_decl)==1,'BYID_DECLARATION_COUNT_INVALID'
          assert s.count(safetext_decl)==1,'SAFETEXT_DECLARATION_COUNT_INVALID'
          assert s.count(byid_bridge)<=1,'BYID_BRIDGE_DUPLICATED'
          assert s.count(safetext_bridge)<=1,'SAFETEXT_BRIDGE_DUPLICATED'
          before=hashlib.sha256(s.encode()).hexdigest()
          changed=[]
          if s.count(safetext_bridge)==0:
              s=s.replace(safetext_decl,safetext_decl+'\n'+safetext_bridge,1)
              changed.append('safeText-global-bridge')
          if s.count(byid_bridge)==0:
              s=s.replace(byid_decl,byid_decl+'\n'+byid_bridge,1)
              changed.append('byId-global-bridge')
          if not changed:
              raise SystemExit('NO_TARGET_RUNTIME_BRIDGE_CHANGE')
          p.write_text(s,encoding='utf-8')
          print('PATCH=APPLIED:'+','.join(changed))
          print('BEFORE_SHA256='+before)
          print('AFTER_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert scripts,'INLINE_SCRIPT_NOT_FOUND'
          Path('/tmp/new-main-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/new-main-inline.js
          grep -o 'window.safeText=safeText;' Current/PWA/New-main | wc -l | grep '^1$'
          grep -o 'window.byId=byId;' Current/PWA/New-main | wc -l | grep '^1$'
          echo 'STATIC_PATCH_GATE=PASS'
      - name: Chromium exact target regression gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory Current/PWA >/tmp/p135-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          cat >/tmp/p135.mjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const errors=[];
            async function open(){
              const p=await browser.newPage({serviceWorkers:'block'});
              p.setDefaultTimeout(12000);p.setDefaultNavigationTimeout(20000);
              p.on('pageerror',e=>errors.push('PAGE:'+String(e.message||e)));
              p.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
              await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>window.RW_STATE&&window.RW_Navigation&&window.RW_OwnerLicense&&typeof window.byId==='function'&&typeof window.safeText==='function');
              return p;
            }
            const p=await open();
            const initial=await p.evaluate(()=>({lang:document.documentElement.lang,dir:document.documentElement.dir,auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',ownerLicense:typeof RW_OwnerLicense==='object',notification:typeof RW_Notification?.showPanel==='function',byId:typeof window.byId==='function',safeText:typeof window.safeText==='function'}));
            await p.evaluate(()=>{RW_STATE.app.currentUser={id:'probe',email:'owner@smoke.local',isOwner:true,permissions:['*']};RW_STATE.permissions=['*'];RW_STATE.app.companyId='00000000-0000-0000-0000-000000000001';RW_STATE.app.licenseState='active';});
            let owner={ok:false};
            try{await p.evaluate(async()=>{await RW_Navigation.navigate('license')});owner=await p.evaluate(()=>({ok:true,view:RW_STATE.app.currentView,container:!!document.getElementById('license-main-container'),text:(document.getElementById('rw-page-container')?.innerText||'')}));}catch(e){owner={ok:false,error:String(e.message||e)};}
            const afterOwner=await p.evaluate(()=>({view:RW_STATE.app.currentView,container:!!document.getElementById('license-main-container'),text:(document.getElementById('rw-page-container')?.innerText||'')}));
            await p.evaluate(()=>{RW_STATE.app.currentUser={id:'probe',email:'user@smoke.local',isOwner:false,permissions:[]};RW_STATE.permissions=[];});
            let denied='';try{await p.evaluate(async()=>{await RW_Navigation.navigate('license')});denied='NO_REJECTION';}catch(e){denied=String(e.message||e)}
            await p.close();
            const result={initial,owner,afterOwner,denied,errors};
            console.log('P135_RUNTIME='+JSON.stringify(result));
            const ok=initial.lang==='ar'&&initial.dir==='rtl'&&initial.auth&&initial.nav&&initial.views&&initial.shell&&initial.ownerLicense&&initial.notification&&initial.byId&&initial.safeText&&owner.ok&&afterOwner.view==='license'&&afterOwner.container&&/إدارة الترخيص/.test(afterOwner.text)&&denied==='OWNER_ONLY'&&!errors.length;
            await browser.close();
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          node /tmp/p135.mjs
          echo 'CHROMIUM_SURGICAL_GATE=PASS'
      - name: Persist target and retire one-time writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papamohammed77-glitch'
          git config user.email 'papamohammed77-glitch@users.noreply.github.com'
          git add Current/PWA/New-main
          if git diff --cached --quiet; then
            echo 'NO_TARGET_CHANGE'
          else
            git diff --cached --check
            git commit -m '[CTO-FORENSIC] Export byId and safeText across governed runtime scope'
          fi
          git rm .github/workflows/p135-runtime-repair.yml
          git commit -m '[CTO-GOVERNANCE] Retire one-time runtime repair writer'
          git push origin HEAD:main
