name: RAWAEA P135 One-Time Surgical Runtime Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p135-runtime-repair.yml'
      - 'Current/PWA/New-main'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rawaea-p135-one-time-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Exact target surgical patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          helpers=[
            ("function byId(id){return document.getElementById(id)}","window.byId=byId;","byId-global-bridge"),
            ("function safeHTML(el,html){if(el)el.innerHTML=html}","window.safeHTML=safeHTML;","safeHTML-global-bridge"),
            ("function safeText(el,text){if(el)el.textContent=text==null?'':String(text)}","window.safeText=safeText;","safeText-global-bridge")]
          changed=[]; before=hashlib.sha256(s.encode()).hexdigest()
          for decl,bridge,label in helpers:
              assert s.count(decl)==1, label+'_DECLARATION_COUNT_INVALID'
              assert s.count(bridge)<=1, label+'_DUPLICATED'
              if bridge not in s:
                  s=s.replace(decl,decl+'\n'+bridge,1); changed.append(label)
          if not changed: raise SystemExit('NO_TARGET_RUNTIME_BRIDGE_CHANGE')
          p.write_text(s,encoding='utf-8')
          print('PATCH=APPLIED:'+','.join(changed)); print('BEFORE_SHA256='+before); print('AFTER_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert len(scripts)==1,'INLINE_SCRIPT_COUNT_INVALID'
          Path('/tmp/new-main-inline.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/new-main-inline.js
          echo 'STATIC_PATCH_GATE=PASS'
      - name: Chromium exact target owner/license gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >/tmp/p135-http.py <<'PY'
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          import os
          class H(SimpleHTTPRequestHandler):
            def __init__(self,*args,**kwargs): super().__init__(*args,directory=os.environ['SERVE_DIR'],**kwargs)
            def log_message(self,fmt,*args): pass
            def guess_type(self,path): return 'text/html; charset=utf-8' if path.endswith('/New-main') else super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',4173),H).serve_forever()
          PY
          SERVE_DIR="$PWD/Current/PWA" python3 /tmp/p135-http.py >/tmp/p135-http.log 2>&1 &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT; sleep 2
          cat >/tmp/p135.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const OWNER_ID='production-owner-fixture', COMPANY_ID='production-company-fixture';
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']}); const errors=[]; let navigationError='';
            const p=await b.newPage({serviceWorkers:'block'}); p.setDefaultTimeout(15000); p.setDefaultNavigationTimeout(20000);
            p.on('pageerror',e=>errors.push('PAGE:'+String(e.message||e))); p.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE:'+m.text())});
            try{await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded'})}catch(e){navigationError=String(e.message||e)}; await p.waitForTimeout(3000);
            const initial=await p.evaluate(()=>({locale:document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',state:!!RW_STATE,auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',ownerLicense:typeof RW_OwnerLicense==='object',notification:typeof RW_Notification?.showPanel==='function',byId:typeof window.byId==='function',safeHTML:typeof window.safeHTML==='function',safeText:typeof window.safeText==='function'}));
            const denied=initial.nav&&initial.state?await p.evaluate(async()=>{RW_STATE.app.currentUser={id:'nonowner-fixture',email:'user@fixture',isOwner:false,permissions:[]};RW_STATE.permissions=[];RW_STATE.app.companyId=null;try{await RW_Navigation.navigate('license');return {ok:false,error:'NO_REJECTION'}}catch(e){return {ok:e?.message==='OWNER_ONLY',error:String(e?.message||e)}}}):{ok:false,error:'NAV_UNAVAILABLE'};
            const owner=initial.nav&&initial.state?await p.evaluate(async({OWNER_ID,COMPANY_ID})=>{RW_STATE.app.currentUser={id:OWNER_ID,email:'owner@production.fixture',auth_id:OWNER_ID,isOwner:true,permissions:['*'],company_id:COMPANY_ID};RW_STATE.permissions=['*'];RW_STATE.app.companyId=COMPANY_ID;RW_STATE.app.licenseState='active';try{await RW_Navigation.navigate('license');return {ok:true,view:RW_STATE.app.currentView,container:!!document.getElementById('license-main-container'),text:(document.getElementById('rw-page-container')?.innerText||'')};}catch(e){return {ok:false,error:String(e?.message||e),view:RW_STATE.app.currentView}}},{OWNER_ID,COMPANY_ID}):{ok:false,error:'NAV_UNAVAILABLE'};
            const finalState=await p.evaluate(()=>({view:RW_STATE?.app?.currentView||null,license:!!document.getElementById('license-main-container'),licenseText:(document.getElementById('rw-page-container')?.innerText||'').includes('إدارة الترخيص')}));
            const result={initial,denied,owner,finalState,navigationError,errors}; console.log('P135_RUNTIME='+JSON.stringify(result));
            const ok=!errors.length&&!navigationError&&initial.locale&&initial.state&&initial.auth&&initial.nav&&initial.views&&initial.shell&&initial.ownerLicense&&initial.notification&&initial.byId&&initial.safeHTML&&initial.safeText&&denied.ok&&owner.ok&&owner.view==='license'&&finalState.license&&finalState.licenseText;
            await p.close();await b.close();if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          node /tmp/p135.cjs
          echo 'CHROMIUM_OWNER_LICENSE_GATE=PASS'
      - name: Persist target and retire one-time writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papamohammed77-glitch'; git config user.email 'papamohammed77-glitch@users.noreply.github.com'
          git add Current/PWA/New-main; git diff --cached --check
          git commit -m '[CTO-FORENSIC] Export audited DOM helper bridges from New-main'
          git rm .github/workflows/p135-runtime-repair.yml
          git commit -m '[CTO-GOVERNANCE] Retire one-time runtime repair writer'
          git push origin HEAD:main
