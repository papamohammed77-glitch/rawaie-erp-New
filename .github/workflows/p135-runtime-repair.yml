name: RAWAEA P135 One-Time Surgical Runtime Repair
# CTO V4: controlled target convergence; no semantic app changes outside Current/PWA/New-main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p135-runtime-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rawaea-p135-one-time-repair-final
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Surgical target convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s)>500000, 'TARGET_TOO_SMALL'
          old='<link rel="manifest" href="../manifest.json">'; new='<link rel="manifest" href="./New-main.manifest.json">'
          assert s.count(old)<=1 and s.count(new)<=1, 'MANIFEST_DUPLICATE_CONFLICT'
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('MANIFEST_LINK_MISSING')
          anchor='<meta name="rw-p163-closure" content="P163-GOLD-DIAMOND-CLOSED-2026-09-03">'
          assert s.count(anchor)==1,'P163_MARKER_COUNT'
          pwa='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if pwa not in s: s=s.replace(anchor,anchor+'\n'+pwa,1)
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          assert s.count(coord)<=1,'SW_COORD_DUPLICATE'
          if coord not in s:
              idx=s.find('</head>')
              assert idx>=0,'HEAD_TAG_MISSING'
              s=s[:idx]+coord+'\n'+s[idx:]
          decl="function safeHTML(el,html){if(el)el.innerHTML=html}"; bridge='window.safeHTML=safeHTML;'
          assert s.count(decl)==1,'SAFEHTML_DECL_COUNT'
          if bridge not in s: s=s.replace(decl,decl+'\n'+bridge,1)
          safe_decl="function safeText(el,text){if(el)el.textContent=text==null?'':String(text)}"; safe_bridge='window.safeText=safeText;'
          assert s.count(safe_decl)==1,'SAFETEXT_DECL_COUNT'
          if safe_bridge not in s: s=s.replace(safe_decl,safe_decl+'\n'+safe_bridge,1)
          assert s.count('window.byId=byId;')==1,'BYID_BRIDGE_NOT_EXACTLY_ONE'
          assert s.count('window.safeText=safeText;')==1,'SAFETEXT_BRIDGE_NOT_EXACTLY_ONE'
          required=['RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense=','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=']
          missing=[x for x in required if x not in s]
          assert not missing,'STATIC_REQUIRED_MISSING='+repr(missing)
          p.write_text(s,encoding='utf-8')
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('TARGET_SIZE='+str(len(s)))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert len(scripts)==1,'INLINE_SCRIPT_COUNT_INVALID'
          Path('/tmp/new-main-inline.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/new-main-inline.js
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text())
          assert m.get('start_url')=='./New-main' and m.get('scope')=='./' and m.get('lang')=='ar' and m.get('dir')=='rtl','MANIFEST_VALUES'
          print('PWA_MANIFEST_STATIC=PASS')
          PY
      - name: Chromium fresh target smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >/tmp/p135-http.py <<'PY'
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          import os
          class H(SimpleHTTPRequestHandler):
            def __init__(self,*args,**kwargs): super().__init__(*args,directory=os.environ['SERVE_DIR'],**kwargs)
            def log_message(self,fmt,*args): pass
            def guess_type(self,path): return 'text/html; charset=utf-8' if path.endswith('/New-main') else super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',4173),H).serve_forever()
          PY
          SERVE_DIR="$PWD/Current/PWA" python3 /tmp/p135-http.py >/tmp/p135-http.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          cat >/tmp/p135.cjs <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({serviceWorkers:'block'});const pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded'});await p.waitForTimeout(2500);const x=await p.evaluate(()=>({state:!!RW_STATE,auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',byId:typeof byId==='function',safeHTML:typeof safeHTML==='function',safeText:typeof safeText==='function',notify:typeof RW_Notification?.showPanel==='function',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',body:(document.body?.innerText||'').slice(0,500)}));console.log('P135_BASELINE='+JSON.stringify({x,pe,ce}));if(pe.length||ce.length||!x.state||!x.auth||!x.nav||!x.views||!x.shell||!x.owner||!x.byId||!x.safeHTML||!x.safeText||!x.notify||x.manifest!=='./New-main.manifest.json'||x.pwa!=='PWA-RUNTIME-GOLD-2026-09-03')process.exit(2);await p.close();await b.close();})().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          node /tmp/p135.cjs
          echo 'CHROMIUM_BASELINE=PASS'
      - name: Persist target then retire writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA CTO Final Closure'
          git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git add Current/PWA/New-main
          git diff --cached --check
          if git diff --cached --quiet; then echo 'NO_TARGET_CHANGE'; exit 1; fi
          git commit -m '[CTO-V4] Surgical Gold Diamond convergence for Current/PWA/New-main'
          git rm .github/workflows/p135-runtime-repair.yml
          git commit -m '[CTO-V4] Retire temporary target repair writer'
          git push origin HEAD:main
