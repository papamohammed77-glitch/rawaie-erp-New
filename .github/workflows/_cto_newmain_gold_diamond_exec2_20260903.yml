name: CTO New-main Gold Diamond execution 2
on:
  push:
    branches: [cto-newmain-forensic-gold-diamond-20260903]
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch exact target only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          original=s
          if len(s)<200000 or len(s.splitlines())<5000: raise SystemExit('TARGET_SHAPE_UNEXPECTED')
          if s.count('<meta name="rw-p163-closure" content="P163-GOLD-DIAMOND-CLOSED-2026-09-03">')!=1: raise SystemExit('P163_CARDINALITY')
          if s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')!=1: raise SystemExit('DIAMOND_CARDINALITY')
          if s.count('<link rel="manifest" href="../manifest.json">')>1: raise SystemExit('MANIFEST_LEGACY_CARDINALITY')
          s=s.replace('<link rel="manifest" href="../manifest.json">','<link rel="manifest" href="./New-main.manifest.json">',1)
          head='</head>'
          pwa_meta='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          sw_coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if pwa_meta not in s: s=s.replace(head,pwa_meta+'\n'+head,1)
          if sw_coord not in s: s=s.replace(head,sw_coord+'\n'+head,1)
          if s.count(pwa_meta)!=1 or s.count(sw_coord)!=1: raise SystemExit('PWA_MARKER_CARDINALITY')

          def replace_func(src, signature, next_sig, replacement, code):
              a=src.find(signature); b=src.find(next_sig,a)
              if a<0 or b<0 or b<=a: raise SystemExit(code)
              return src[:a]+replacement+src[b:]

          s=replace_func(s,'function _openTreasuryDialog(editId) {','\n    function _editTreasury(id)',"""function _openTreasuryDialog(editId) {\n        _showToast('إدارة الخزائن والبنوك تتم عبر المحرك المالي المركزي. PWA للعرض والتشغيل المصرح فقط.', 'warning');\n        return;\n    }\n""",'TREASURY_BOUNDARY')
          s=replace_func(s,'function _openAccountDialog(editCode) {','\n    async function _seedAccounts()',"""function _openAccountDialog(editCode) {\n        _showToast('دليل الحسابات تتم إدارته مركزيًا. لا توجد كتابة محاسبية مباشرة من PWA.', 'warning');\n        return;\n    }\n""",'COA_BOUNDARY')
          s=replace_func(s,'async function _seedAccounts() {','\n    // ==================== Journal ====================',"""async function _seedAccounts() {\n        _showToast('تهيئة دليل الحسابات تتم من المحرك المالي المركزي فقط.', 'warning');\n    }\n\n""",'SEED_BOUNDARY')
          s=replace_func(s,'function _editBudget(accountId, accountName, year, month) {','\n    return {',"""function _editBudget(accountId, accountName, year, month) {\n        _showToast('تعديل الموازنات غير متاح مباشرة من PWA؛ الكتابة المركزية فقط.', 'warning');\n        return;\n    }\n\n""",'BUDGET_BOUNDARY')

          # Make the treasury/account add affordances explicitly non-actionable.
          old='<button type="button" onclick="RW_Finance._openTreasuryDialog()" class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold"><i class="fa-solid fa-plus ml-1"></i>إضافة</button>'
          new='<span class="px-4 py-2 rounded-xl font-bold bg-gray-100 text-gray-500"><i class="fa-solid fa-lock ml-1"></i>إدارة مركزية فقط</span>'
          if old in s: s=s.replace(old,new,1)
          old2='<div><button type="button" onclick="RW_Finance._seedAccounts()" class="bg-amber-500 text-white px-3 py-2 rounded-lg ml-2"><i class="fa-solid fa-seedling ml-1"></i>تهيئة</button>\n            <button type="button" onclick="RW_Finance._openAccountDialog()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg"><i class="fa-solid fa-plus ml-1"></i>حساب جديد</button></div>'
          new2='<span class="px-4 py-2 rounded-lg font-bold bg-gray-100 text-gray-500"><i class="fa-solid fa-lock ml-1"></i>دليل الحسابات مركزي</span>'
          if old2 in s: s=s.replace(old2,new2,1)

          # Remove the budget edit button affordance without corrupting HTML.
          s=re.sub(r'<button type="button" onclick="RW_Finance\._editBudget\\([^<]*?</button>', '<span class="text-gray-400" title="الكتابة المركزية فقط"><i class="fa-solid fa-lock"></i></span>', s, count=1)

          # Permission alias reconciles UI contract with production role semantics.
          needle="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases'};"
          repl="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases',finance:'finance_manager',finance_manager:'finance'};"
          if needle in s: s=s.replace(needle,repl,1)
          elif repl not in s: raise SystemExit('FINANCE_PERMISSION_ALIAS_MISSING')

          marker='<!-- RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1: PWA read-only master data; transactional finance delegates to Core Edge Functions/RPCs. -->'
          if marker not in s: s=s.replace('</head>',marker+'\n</head>',1)
          if s.count(marker)!=1: raise SystemExit('FINANCE_BOUNDARY_CARDINALITY')

          for pat,err in [(r"from\('treasury'\)\.(insert|update|delete)",'TREASURY_DIRECT_WRITER'),(r"from\('chart_of_accounts'\)\.(insert|update|delete)",'COA_DIRECT_WRITER')]:
              if re.search(pat,s): raise SystemExit(err)
          if ".from('budgets').upsert" in s or "from('budgets').upsert" in s: raise SystemExit('BUDGET_DIRECT_WRITER')
          if '<link rel="manifest" href="../manifest.json">' in s: raise SystemExit('LEGACY_MANIFEST_REMAINS')
          if s==original: raise SystemExit('NO_CHANGE')
          p.write_text(s,encoding='utf-8')
          print('TARGET_PATCH_OK',len(s),len(s.splitlines()))
          PY
      - name: Static Gold gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess,tempfile,re,hashlib,json
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA_TARGET_SW_COORDINATOR','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','MAIN_HTML_CURRENT_CONTRACT_LEDGER','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_ShellContext','window.RW_OwnerLicense={','RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('STATIC_MISSING='+repr(miss))
          if s.count('<link rel="manifest" href="./New-main.manifest.json">')!=1: raise SystemExit('MANIFEST_TARGET_FAIL')
          if re.search(r"from\('treasury'\)\.(insert|update|delete)",s): raise SystemExit('TREASURY_WRITER_STATIC')
          if re.search(r"from\('chart_of_accounts'\)\.(insert|update|delete)",s): raise SystemExit('COA_WRITER_STATIC')
          if ".from('budgets').upsert" in s: raise SystemExit('BUDGET_WRITER_STATIC')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.inline=[]; self.cur=None; self.scripts=0; self.styles=0
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
              elif t.lower()=='style': self.styles+=1
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['text']+=d
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                self.cur=None
          q=P(); q.feed(s); q.close()
          if len(q.inline)!=1: raise SystemExit('INLINE_COUNT='+str(len(q.inline)))
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(q.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          if (m.get('start_url'),m.get('scope'),m.get('lang'),m.get('dir'))!=('./New-main','./','ar','rtl'): raise SystemExit('DEDICATED_MANIFEST_FAIL')
          for x in ['Current/PWA/register-sw.js','Current/PWA/sw.js','Current/PWA/New-main-icon.svg']:
            if not Path(x).exists(): raise SystemExit('PWA_ASSET_MISSING='+x)
          print('STATIC_GOLD_PASS SHA256='+hashlib.sha256(s.encode()).hexdigest(),'BYTES='+str(len(s.encode())))
          PY
      - name: Exact target browser contract gate
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const fs=require('fs'); const {chromium}=require('playwright');
          (async()=>{
            const s=fs.readFileSync('Current/PWA/New-main','utf8'); const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e))); p.on('console',m=>{if(m.type()==='error')ce.push(String(m.text()||''))});
            await p.route('https://cdn.jsdelivr.net/**',async r=>{const u=r.request().url(); if(u.includes('supabase-js')) return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{user:null},error:{message:'stub'}})},from:()=>({select:()=>({eq:()=>({order:()=>({limit:()=>({in:()=>({data:[],error:null})})})})}),rpc:async()=>({data:null,error:null})})})}`}); if(u.includes('chart.js')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'}); if(u.includes('sweetalert')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false,isDenied:false})};'}); if(u.includes('xlsx')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'}); return r.fulfill({status:200,contentType:'application/javascript',body:''});});
            await p.route('https://cdnjs.cloudflare.com/**',async r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await p.setContent(s,{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(500);
            const out=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation; let licenseDenied=false,auditDenied=false,financeDenied=false; S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]}; S.permissions=[]; try{await N.navigate('license')}catch(e){licenseDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))} try{await N.navigate('audit')}catch(e){auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))} try{await N.navigate('finance')}catch(e){financeDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))} S.permissions=['finance_manager']; const financeAlias=window.RW_Permissions_check('finance:view')===true; S.app.currentUser={email:'owner@example.com',isOwner:true,permissions:['*']}; let ownerLicense=false,ownerAudit=false; try{await N.navigate('license');ownerLicense=true}catch(e){} try{await N.navigate('audit');ownerAudit=true}catch(e){} return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',financeAlias,licenseDenied,auditDenied,financeDenied,ownerLicense,ownerAudit,masterGuard:document.documentElement.innerHTML.includes('RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1')};});
            console.log('FORENSIC_BROWSER='+JSON.stringify({out,pe,ce}));
            const ok=!pe.length&&!ce.length&&out.lang==='ar'&&out.dir==='rtl'&&out.state&&out.auth&&out.nav&&out.views&&out.shell&&out.owner&&out.diamond&&out.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&out.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&out.manifest==='\./New-main.manifest.json'&&out.financeAlias&&out.licenseDenied&&out.auditDenied&&out.financeDenied&&out.ownerLicense&&out.ownerAudit&&out.masterGuard; await b.close(); if(!ok) process.exit(2); })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Commit only target then remove executor
        run: |
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          rm -f .github/workflows/_cto_newmain_gold_diamond_exec2_20260903.yml
          git add Current/PWA/New-main .github/workflows/_cto_newmain_gold_diamond_exec2_20260903.yml
          git diff --cached --check
          files=$(git diff --cached --name-only)
          test "$files" = "Current/PWA/New-main"
          git commit -m '[CTO-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git push origin HEAD:cto-newmain-forensic-gold-diamond-20260903
