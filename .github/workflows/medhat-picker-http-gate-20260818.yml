name: Medhat picker Production HTTP gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  p0_main_repair:
    if: github.event.head_commit.message != 'fix: execute parent pwa main shell p0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Apply audited Parent PWA P0 patch
        run: python3 tools/p0_main_shell_repair.py
      - name: Validate P0 invariants and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          required=['RW_ShellContext','RW_Fleet','create_vehicle_atomic',"if (view === 'vehicles')"]
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          if ".from('app_settings')\n            .select('*')\n            .limit(1" in s: raise SystemExit('unscoped app_settings remains')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no inline scripts')
          for i,c in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'rwmain_{i}.js';f.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);raise SystemExit('JS syntax failure '+str(i))
          subprocess.run(['git','diff','--check'],check=True)
          print('P0_STATIC_OK',len(scripts))
          PY
      - name: Record result and restore original workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA P0 Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_P0_EXECUTION.md <<'EOF'
# RAWAEA ERP — Parent PWA main.html — P0 Execution Record

P0 is an in-place Parent-PWA hardening pass.

Applied: authenticated tenant context from `users.company_id`; company-scoped known tenant/app_settings reads; integrated Vehicle Master capability and navigation; smart driver search scoped by company; vehicle creation delegated to Production `create_vehicle_atomic`; no client-side Physical Stock writer.

Validation: full inline JavaScript syntax check, P0 invariants, and git diff check.

Explicitly not claimed: browser E2E, Production browser runtime, global Inventory Zero-Debt closure.
EOF
          git checkout HEAD^ -- .github/workflows/medhat-picker-http-gate-20260818.yml
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_P0_EXECUTION.md .github/workflows/medhat-picker-http-gate-20260818.yml
          git commit -m 'fix: execute parent pwa main shell p0'
          git push origin HEAD:main
