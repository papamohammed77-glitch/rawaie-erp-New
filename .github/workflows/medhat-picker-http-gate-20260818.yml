name: Medhat picker Production HTTP gate

# RETIRED PUSH GATE
# Preserved for historical/manual verification only.
# It previously rewrote protected Current/PWA/main.html on every push.
# No automatic workflow may mutate the protected main.html while New-main
# is the governed reconstruction target.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - name: Retired gate notice
        run: |
          echo "RETIRED_PUSH_GATE"
          echo "Protected Current/PWA/main.html is no longer auto-mutated."
