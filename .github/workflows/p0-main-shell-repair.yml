name: RAWAEA P1 main1 critical repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair_main1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test workflow
        run: |
          set -e
          test -f Current/PWA/main/main1.md
          test -f tools/p1_main1_repair.py
          wc -c Current/PWA/main/main1.md
          echo P1_WORKFLOW_SMOKE_OK
