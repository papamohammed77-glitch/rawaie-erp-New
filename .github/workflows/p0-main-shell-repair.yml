name: RAWAEA P1 main1 critical repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair_main1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute main1 repair tool
        run: |
          set -euo pipefail
          python3 tools/p1_main1_repair.py
      - name: Commit main1 repair
        run: |
          set -euo pipefail
          git add Current/PWA/main/main1.md
          if git diff --cached --quiet; then
            echo NO_MAIN1_CHANGE
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p1): repair main1 tenant owner shell'
          git push origin HEAD:main
