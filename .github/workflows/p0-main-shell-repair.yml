name: RAWAEA P1 main1 critical repair — ARCHIVED VERIFY ONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main/main1.md'
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived main1 repair source
        run: |
          set -euo pipefail
          test -s Current/PWA/main/main1.md
          test -s tools/p1_main1_repair.py
          ! grep -q "git push" .github/workflows/p0-main-shell-repair.yml
          echo P1_MAIN1_ARCHIVE_VERIFY_PASS
