name: P0 Parent PWA main repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'fix: execute parent pwa main shell p0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Run audited P0 patch
        run: python3 tools/p0_main_shell_repair.py
      - name: Validate JavaScript and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          required=['RW_ShellContext','RW_Fleet','create_vehicle_atomic',"if (view === 'vehicles')"]
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          if ".from('app_settings')\n            .select('*')\n            .limit(1" in s: raise SystemExit('unscoped app_settings remains')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          if not scripts: raise SystemExit('no inline scripts')
          for i,c in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'rw_main_{i}.js';f.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);raise SystemExit('syntax failure '+str(i))
          subprocess.run(['git','diff','--check'],check=True)
          print('P0_STATIC_OK',len(scripts))
          PY
      - name: Record result and restore runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA P0 Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_P0_EXECUTION.md <<'EOF'
# RAWAEA ERP — Parent PWA main.html — P0 Execution Record

P0 executed against the current main tree as an in-place repair.

Delivered:
- authenticated tenant context sourced from `users.company_id` before shell entry;
- known Parent PWA tenant-owned `app_settings` reads company-scoped;
- known customer/branch/supplier/user/order/procurement reads company-scoped where applicable;
- Vehicle Master integrated into the existing Parent PWA navigation and routing;
- smart driver search scoped to the authenticated company;
- Vehicle creation delegated only to Production `create_vehicle_atomic`;
- no client Physical Stock writer introduced;
- existing Parent PWA structure retained.

Validation: static JavaScript syntax + invariant checks + git diff check.

Not claimed here: browser E2E, Production browser runtime, or global Inventory Zero-Debt closure.

Roadmap: P0 tenant/core/navigation parity; P1 shared runtime convergence; P2 ERP workspace/navigation parity; P3 business/UX closure; P4 runtime/Production closure.
EOF
          git checkout HEAD^ -- .github/workflows/p0-main-shell-repair.yml
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_P0_EXECUTION.md .github/workflows/p0-main-shell-repair.yml
          git commit -m 'fix: execute parent pwa main shell p0'
          git push origin HEAD:main
