name: RAWAEA NEW-MAIN CLEAN-ROOM — 20260831

on:
  push:
    branches: [golden-new-main-20260831]
    paths:
      - 'tools/run_new_main_clean_room_20260831.py'
      - 'Current/PWA/main/**'
      - 'Original/PWA/main/**'
      - '.github/workflows/new_main_clean_room_20260831.yml'
  pull_request:
    branches: [golden-new-main-20260831]
    paths:
      - 'tools/run_new_main_clean_room_20260831.py'
      - 'Current/PWA/main/**'
      - 'Original/PWA/main/**'
      - '.github/workflows/new_main_clean_room_20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-new-main:
    if: ${{ !contains(github.event.head_commit.message, '[new-main-clean-room-persist]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verification source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'golden-new-main-20260831' && 'golden-new-main-20260831' || 'ci/golden-new-main-final-20260831' }}
          fetch-depth: 2
      - name: Prove legacy runtime file is untouched before build
        shell: bash
        run: |
          set -euo pipefail
          test -s Current/PWA/main.html
          git hash-object Current/PWA/main.html > /tmp/main-html-before.sha
      - name: Build New-main only from current fragments
        run: python3 tools/run_new_main_clean_room_20260831.py
      - name: Fragment syntax diagnostics for main1..main11
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,re,subprocess,tempfile
          spec=importlib.util.spec_from_file_location('rw_builder','tools/run_new_main_clean_room_20260831.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          for idx in range(1,12):
              src=mod.repaired_source(Path('Current/PWA/main')/f'main{idx}.md')
              if idx==1:
                  scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',src,re.S|re.I)
                  if not scripts: raise SystemExit('MAIN1_NO_INLINE_SCRIPT')
                  src=scripts[-1]
              p=Path(tempfile.gettempdir())/f'rw-fragment-{idx}.js'; p.write_text(src,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: print(r.stderr); raise SystemExit(f'JS_SYNTAX_FAIL_main{idx}')
              print(f'FRAGMENT_JS_SYNTAX_PASS_main{idx}')
          PY
      - name: Structural contract gate for New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['rw-login-page','rw-main-shell','rw-page-container','rw-header-title','rw-header-subtitle','rw-sidebar-nav','rw-logout-btn','window.RW_ShellContext','window.RW_OwnerLicense','window.RW_Views','window.RW_Dashboard','window.RW_Items','window.RW_POS','window.RW_Orders','window.RW_Runsheets','window.RW_Purchases','window.RW_Warehouse','window.RW_Finance','window.RW_Reports','window.RW_HR','window.RW_CRM']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('STRUCTURAL_CONTRACT_MISSING:'+','.join(miss))
          if not s.rstrip().lower().endswith('</script>\n</body>\n</html>'): raise SystemExit('FINAL_DOCUMENT_END_INVARIANT_FAILED')
          print('STRUCTURAL_CONTRACT_PASS')
          PY
      - name: JavaScript syntax gate for New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          m=re.search(r'<script(?![^>]*\\bsrc=)[^>]*>',s,re.I)
          if not m: raise SystemExit('NO_INLINE_SCRIPT_FOUND')
          close=s.find('</script>',m.end())
          if close<0: raise SystemExit('INLINE_SCRIPT_CLOSE_NOT_FOUND')
          c=s[m.end():close]
          p=Path(tempfile.gettempdir())/'rw-new-main-inline.js'; p.write_text(c,encoding='utf-8')
          r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('JS_SYNTAX_FAIL_NEW_MAIN')
          print('JS_SYNTAX_PASS_NEW_MAIN')
          PY
      - name: Browser smoke gate for New-main
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then echo 'SYSTEM_BROWSER_NOT_FOUND'; exit 2; fi
          rm -rf /tmp/rw-new-main-pwa && mkdir -p /tmp/rw-new-main-pwa
          cp -r Current/PWA/. /tmp/rw-new-main-pwa/
          cp /tmp/rw-new-main-pwa/New-main /tmp/rw-new-main-pwa/New-main.html
          python3 -m http.server 8124 --directory /tmp/rw-new-main-pwa >/tmp/rw-new-main-http.log 2>&1 &
          export BROWSER_BIN
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const browser=await chromium.launch({headless:true,executablePath:process.env.BROWSER_BIN,args:['--no-sandbox']});const page=await browser.newPage();const pageErrors=[];const consoleErrors=[];page.on('pageerror',e=>pageErrors.push(e.message));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});await page.goto('http://127.0.0.1:8124/New-main.html',{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(1200);const r=await page.evaluate(()=>({lang:document.documentElement.lang,body:!!document.body,login:!!document.getElementById('rw-login-page'),app:!!document.getElementById('rw-main-shell'),container:!!document.getElementById('rw-page-container'),shell:!!window.RW_ShellContext,views:!!window.RW_Views,owner:!!window.RW_OwnerLicense}));console.log(JSON.stringify({result:r,pageErrors,consoleErrors}));if(r.lang!=='ar'||!r.body||!r.login||!r.app||!r.container||!r.shell||!r.views||!r.owner||pageErrors.length)process.exit(2);await browser.close();})().catch(e=>{console.error(e);process.exit(2)});
          NODE
      - name: Prove legacy main.html remained byte-identical
        shell: bash
        run: |
          set -euo pipefail
          git hash-object Current/PWA/main.html > /tmp/main-html-after.sha
          diff -u /tmp/main-html-before.sha /tmp/main-html-after.sha
          test -s Current/PWA/New-main
      - name: Persist verified New-main to Golden branch
        if: ${{ github.ref_name == 'golden-new-main-20260831' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-new-main-reconstruction-bot'
          git config user.email 'rawaea-new-main-reconstruction-bot@users.noreply.github.com'
          git add Current/PWA/New-main Current/CTO/20260831_NEW_MAIN_CLEAN_ROOM_EXECUTION.json
          git diff --cached --quiet && { echo 'NO_NEW_MAIN_DELTA'; exit 1; }
          git commit -m '[new-main-clean-room-persist] persist verified New-main artifact'
          git push origin HEAD:golden-new-main-20260831
