name: CTO New-main Final Executor 2026-09-03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cto-newmain-final-executor-20260903.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message == '[CTO-EXECUTE] New-main final target-only closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target-only surgical update, static gate, browser gate, and persist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, tempfile
          from html.parser import HTMLParser
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.splitlines())>5000
          old='<link rel="manifest" href="./New-main.manifest.json">'
          new='<link rel="manifest" href="../manifest.json">'
          if old in s:
              assert s.count(old)==1
              s=s.replace(old,new,1)
          assert s.count(new)==1
          marker="byId('rw-login-form').addEventListener('submit',function(e){"
          start=s.find(marker)
          if start>=0:
              end=s.find("});byId('rw-logout-btn')",start)
              assert end>start
              s=s[:start]+s[end+3:]
          assert marker not in s
          assert s.count("loginForm.addEventListener('submit'")==1
          assert s.count('function safeText')==1
          assert 'window.safeText=safeText' in s
          m=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='./' and m['display']=='standalone' and m['dir']=='rtl' and m['lang']=='ar'
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.ins=False; self.src=None; self.buf=''; self.blocks=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.ins=True; self.src=dict(a).get('src'); self.buf=''
              def handle_data(self,d):
                  if self.ins:self.buf+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:
                      if not self.src and self.buf.strip():self.blocks.append(self.buf)
                      self.ins=False; self.src=None; self.buf=''
          q=P();q.feed(s);q.close();assert q.blocks
          for code in q.blocks:
              f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(code,encoding='utf-8')
              try:subprocess.run(['node','--check',str(f)],check=True)
              finally:f.unlink(missing_ok=True)
          p.write_text(s,encoding='utf-8')
          print('TARGET_ONLY_SURGERY_PASS')
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/site
          mkdir -p /tmp/site/Current
          cp -a Current/. /tmp/site/Current
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p):
                  if p.endswith('/New-main'): return 'text/html; charset=utf-8'
                  return super().guess_type(p)
          os.chdir('/tmp/site'); ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid
          trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const{chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage(),pe=[],ce=[];
          await p.route('**/*',async r=>{const u=r.request().url();
            if(u.includes('cdn.jsdelivr.net/npm/@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({}),resetPasswordForEmail:async()=>({})},from:()=>({select(){return this},eq(){return this},maybeSingle:async()=>({data:null,error:null}),then:()=>Promise.resolve({data:[],error:null})})})};`});
            if(u.includes('cdn.jsdelivr.net/npm/chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});
            if(u.includes('cdn.jsdelivr.net/npm/sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){}};'});
            if(u.includes('cdn.sheetjs.com'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});
            return r.continue()});
          await p.addInitScript(()=>{window.__bindings=0;const a=EventTarget.prototype.addEventListener;EventTarget.prototype.addEventListener=function(t){if(t==='submit'&&this.id==='rw-login-form')window.__bindings++;return a.apply(this,arguments)}});
          p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
          await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(800);
          const r=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const m=await(await fetch(l.href)).json();return{login:!!document.getElementById('rw-login-form'),sidebar:!!document.getElementById('rw-sidebar'),nav:!!document.getElementById('rw-sidebar-nav'),shell:!!document.getElementById('rw-main-shell'),auth:!!window.RW_Auth,navigation:!!window.RW_Navigation,views:!!window.RW_Views,safeText:typeof window.safeText==='function',bindings:window.__bindings||0,manifestHref:l?.getAttribute('href')||'',manifestPath:new URL(l?.getAttribute('href')||'',location.href).pathname,start:m.start_url,scope:m.scope,dir:m.dir,lang:m.lang}});
          console.log('NEWMAIN_BROWSER_GATE='+JSON.stringify({r,pe,ce}));await b.close();
          if(pe.length||ce.length||!r.login||!r.sidebar||!r.nav||!r.shell||!r.auth||!r.navigation||!r.views||!r.safeText||r.bindings!==1||r.manifestHref!=='../manifest.json'||r.manifestPath!=='/Current/PWA/manifest.json'||r.start!=='./New-main'||r.scope!=='./'||r.dir!=='rtl'||r.lang!=='ar')process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git rm -f .github/workflows/cto-newmain-final-executor-20260903.yml
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Executor'
          git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main exact target-only final'
          git push origin HEAD:main
