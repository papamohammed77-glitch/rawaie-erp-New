name: P0 Execute Parent PWA Repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Execute P0 repair script
        run: python3 tools/p0_main_shell_repair.py
      - name: Validate patched main.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          required=['RW_ShellContext','RW_Fleet','create_vehicle_atomic',"if (view === 'vehicles')"]
          for x in required:
              if x not in s: raise SystemExit('MISSING '+x)
          if ".from('app_settings')\n            .select('*')\n            .limit(1" in s: raise SystemExit('UNSCOPED_APP_SETTINGS')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(scripts,1):
              f=Path(tempfile.gettempdir())/f'rw_main_{i}.js';f.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr);raise SystemExit('JS_SYNTAX_'+str(i))
          print('P0_VALIDATION_OK',len(scripts))
          PY
          git diff --check
      - name: Record and publish P0 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA P0 Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_P0_EXECUTION.md <<'EOF'
# RAWAEA ERP — Parent PWA main.html — P0 Execution Record

P0 repaired the existing Parent PWA in place.

Applied: authenticated tenant context from users.company_id before shell entry; known Parent-PWA app_settings reads company scoped; known tenant-owned reads scoped; integrated Vehicle Master capability and navigation; smart driver lookup scoped to company; vehicle creation delegated to Production create_vehicle_atomic; no client-side Physical Stock writer added.

Preservation: the Parent PWA was not rebuilt or replaced; existing modules/routes remain.

Validation: inline JavaScript syntax, P0 invariants, git diff check.

Explicitly not claimed: browser E2E, Production browser runtime, or full Inventory Zero-Debt closure.
EOF
          git rm .github/workflows/p0-execute-on-push.yml tools/p0_main_shell_repair.py
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_P0_EXECUTION.md
          git commit -m 'fix: execute parent pwa main shell p0'
          git push origin HEAD:main
