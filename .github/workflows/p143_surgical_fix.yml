name: RAWAEA P143 surgical repair

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main.html'
      - '.github/workflows/p143_surgical_fix.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[P143-surgical-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Surgical repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Current/PWA/main.html')
          s = p.read_text(encoding='utf-8')
          print('MAIN_BYTES', len(s.encode('utf-8')))

          valid_key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpaWxtb29nZ3Vtb2t4YW53aWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDkwOTIsImV4cCI6MjA5NDI4NTA5Mn0.LZScCxnCiRrTSCCBmTryszQpY1AwBgR2dkTBbC5kOc4'

          key_pattern = re.compile(r"var\s+RW_SUPABASE_ANON_KEY\s*=\s*'[^']*';")
          matches = key_pattern.findall(s)
          print('KEY_DECLARATIONS', len(matches))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one RW_SUPABASE_ANON_KEY declaration; found {len(matches)}')
          s = key_pattern.sub("var RW_SUPABASE_ANON_KEY='" + valid_key + "';", s, count=1)

          sw_pattern = re.compile(r"navigator\.serviceWorker\.register\(\s*['\"][^'\"]+['\"]\s*,\s*\{\s*scope\s*:\s*['\"][^'\"]+['\"]\s*\}\s*\)")
          sw_matches = sw_pattern.findall(s)
          print('SW_REGISTRATIONS', sw_matches)
          if len(sw_matches) != 1:
              raise SystemExit(f'Expected exactly one ServiceWorker registration; found {len(sw_matches)}')
          s = sw_pattern.sub("navigator.serviceWorker.register('./sw.js',{scope:'./'})", s, count=1)

          p.write_text(s, encoding='utf-8')
          final = p.read_text(encoding='utf-8')
          assert valid_key in final, 'new Supabase anon key missing after write'
          assert "navigator.serviceWorker.register('./sw.js',{scope:'./'})" in final, 'new SW registration missing after write'
          assert not re.search(r"navigator\.serviceWorker\.register\(\s*['\"]\.\./sw\.js['\"]", final), 'legacy ../sw.js registration remains'
          print('P143_SURGICAL_REPAIR_PASS')
          PY

      - name: Persist repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-p143-repair-bot'
          git config user.email 'rawaea-p143-repair-bot@users.noreply.github.com'
          git add Current/PWA/main.html
          git diff --cached --quiet && { echo 'P143_NO_DELTA'; exit 1; }
          git commit -m '[main-reconstruction-executed] [P143-surgical-fix] repair Supabase key and SW registration'
          git push origin HEAD:main
