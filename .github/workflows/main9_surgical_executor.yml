name: Main9 Surgical Executor 20260910

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/main9_surgical_executor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Main9 surgery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib, json

          repo = Path('.')
          main9 = repo / 'Current/PWA/main2/main9.md'
          main2 = repo / 'Current/PWA/main2/main2.md'
          directive = repo / 'doc/Draft/Reprots/MASTER — RAWAEA ERP Successor CTO Memory Recovery & Gold-Diamond Execution Directive.md'
          report108 = repo / 'doc/Draft/Reprots/Report108_Main9_Current_Truth_Recheck_20260910.md'
          report109 = repo / 'doc/Draft/Reprots/Report109_Main9_Surgical_Execution_20260910.md'

          before_commit = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          before_text = main9.read_text(encoding='utf-8')
          main2_text = main2.read_text(encoding='utf-8')
          directive_text = directive.read_text(encoding='utf-8')
          report108_text = report108.read_text(encoding='utf-8')

          assert len(before_text) > 50000, 'Main9 incomplete'
          assert len(main2_text) > 500000, 'Main2 incomplete'
          assert 'CURRENT VERIFIED REALITY' in directive_text
          assert 'MAIN9 FORMAL SYNTAX' in report108_text

          replacement = '''    // MAIN9-M9-08-SURGICAL-20260910
    async function _generateReport(sectionKey, reportId) {
        var resultDiv = byId('report-result');
        if (!resultDiv) return;

        var fromDate = byId('rp-date-from') ? byId('rp-date-from').value : '';
        var toDate = byId('rp-date-to') ? byId('rp-date-to').value : '';
        var customer = byId('rp-customer') ? byId('rp-customer').value : '';
        var supplier = byId('rp-supplier') ? byId('rp-supplier').value : '';
        var itemCode = byId('rp-item') ? byId('rp-item').value : '';
        var account = byId('rp-account') ? byId('rp-account').value : '';
        var treasury = byId('rp-treasury') ? byId('rp-treasury').value : '';
        var driver = byId('rp-driver') ? byId('rp-driver').value : '';
        var area = byId('rp-area') ? byId('rp-area').value : '';

        function _dateValid() {
            return (!fromDate && !toDate) || (fromDate && toDate && fromDate <= toDate);
        }

        function _table(title, rows, columns) {
            rows = Array.isArray(rows) ? rows : [];
            var html = '<h4 class="font-bold mb-3">' + _esc(title) + '</h4>';
            if (!rows.length) return html + '<div class="text-center py-4 text-gray-500">لا توجد بيانات</div>';
            html += '<table class="w-full text-sm"><thead><tr class="bg-gray-50">';
            for (var c = 0; c < columns.length; c++) html += '<th class="p-2">' + _esc(columns[c].label) + '</th>';
            html += '</tr></thead><tbody>';
            for (var r = 0; r < rows.length; r++) {
                html += '<tr class="border-t">';
                for (var c2 = 0; c2 < columns.length; c2++) {
                    var v = rows[r] ? rows[r][columns[c2].key] : '';
                    if (v === null || v === undefined) v = '';
                    html += '<td class="p-2">' + _esc(String(v)) + '</td>';
                }
                html += '</tr>';
            }
            return html + '</tbody></table>';
        }

        async function _query(table, select, apply) {
            var q = supabase.from(table).select(select);
            if (typeof apply === 'function') q = apply(q);
            var res = await q;
            if (res.error) throw res.error;
            return res.data || [];
        }

        async function _orders(select) {
            return _query('orders', select || '*', function(q) {
                q = q.eq('company_id', _companyId());
                if (fromDate && toDate) q = q.gte('order_date', fromDate).lt('order_date', _nextDate(toDate));
                if (customer) q = q.eq('customer_id', customer);
                if (area) q = q.eq('area', area);
                return q;
            });
        }

        async function _branches() {
            return _query('branches', 'id,branch_code,name', function(q) {
                return q.eq('company_id', _companyId()).eq('is_active', true).order('name', {ascending:true});
            });
        }

        async function _items() {
            return _query('items', 'id,item_code,name,unit,reorder_point,max_qty,cost_price,sales_price,barcode,is_active', function(q) {
                return q.order('item_code', {ascending:true});
            });
        }

        async function _stockMap() {
            var branches = await _branches();
            var ids = branches.map(function(b) { return b.id; }).filter(Boolean);
            var map = {};
            if (!ids.length) return map;
            var rows = await _query('stock_branches', 'item_id,branch_id,qty,allocated_qty', function(q) {
                return q.in('branch_id', ids);
            });
            for (var i = 0; i < rows.length; i++) {
                var row = rows[i];
                if (!row.item_id) continue;
                if (!map[row.item_id]) map[row.item_id] = {qty:0,allocated:0};
                map[row.item_id].qty += Number(row.qty || 0);
                map[row.item_id].allocated += Number(row.allocated_qty || 0);
            }
            return map;
        }

        async function _currentCompanyCustomer() {
            if (!customer) throw new Error('يرجى اختيار عميل');
            var rows = await _query('customers', 'id,customer_code,name,company_id', function(q) {
                return q.eq('company_id', _companyId()).eq('id', customer).limit(1);
            });
            if (!rows.length) throw new Error('العميل غير موجود ضمن الشركة الحالية');
            return rows[0];
        }

        async function _financeRpc(name, args) {
            var res = await supabase.rpc(name, args);
            if (res.error) throw res.error;
            var value = res.data;
            if (Array.isArray(value)) return value;
            if (value && typeof value === 'object') {
                var keys = Object.keys(value);
                for (var i = 0; i < keys.length; i++) {
                    if (Array.isArray(value[keys[i]])) return value[keys[i]];
                }
                return [value];
            }
            return [];
        }

        try {
            if (!_dateValid()) throw new Error('نطاق التاريخ غير صالح');

            var companyId = _companyId();
            var html = '';
            var data = [];

            if (reportId === 'sales-summary') {
                data = await _orders('id,total_amount,order_date');
                var total = 0;
                for (var i1 = 0; i1 < data.length; i1++) total += Number(data[i1].total_amount || 0);
                var avg = data.length ? Math.round(total / data.length) : 0;
                html = '<h4 class="font-bold mb-3">ملخص المبيعات</h4>' +
                    '<div class="grid grid-cols-3 gap-4">' +
                    '<div class="bg-blue-50 p-4 rounded-xl text-center"><p class="text-xs">عدد الأوردرات</p><p class="text-2xl font-black">' + data.length + '</p></div>' +
                    '<div class="bg-green-50 p-4 rounded-xl text-center"><p class="text-xs">الإجمالي</p><p class="text-2xl font-black">' + _fmtNum(total) + ' EGP</p></div>' +
                    '<div class="bg-amber-50 p-4 rounded-xl text-center"><p class="text-xs">متوسط الأوردر</p><p class="text-2xl font-black">' + _fmtNum(avg) + ' EGP</p></div>' +
                    '</div>';
            } else if (reportId === 'sales-by-customer') {
                data = await _orders('customer_id,customer_name,total_amount');
                var cm = {};
                for (var i2 = 0; i2 < data.length; i2++) {
                    var cid = data[i2].customer_id || 'غير محدد';
                    if (!cm[cid]) cm[cid] = {id:cid,name:data[i2].customer_name || cid,total:0,count:0};
                    cm[cid].total += Number(data[i2].total_amount || 0);
                    cm[cid].count++;
                }
                var ca = Object.keys(cm).map(function(k){return cm[k];}).sort(function(a,b){return b.total-a.total;});
                html = _table('المبيعات حسب العميل', ca, [
                    {key:'id',label:'كود العميل'},{key:'name',label:'اسم العميل'},{key:'count',label:'عدد الفواتير'},{key:'total',label:'إجمالي المبيعات'}
                ]);
            } else if (reportId === 'sales-by-item') {
                data = await _orders('id');
                var orderIds = data.map(function(x){return x.id;}).filter(Boolean);
                var details = [];
                if (orderIds.length) details = await _query('order_details','order_id,item_id,item_code,item_name,qty,unit_price',function(q){return q.in('order_id',orderIds);});
                var im = {};
                for (var i3=0;i3<details.length;i3++) {
                    var d3=details[i3]; var key3=d3.item_id || d3.item_code;
                    if (!im[key3]) im[key3]={code:d3.item_code || '',name:d3.item_name || d3.item_code || '',qty:0,total:0};
                    im[key3].qty += Number(d3.qty || 0);
                    im[key3].total += Number(d3.qty || 0) * Number(d3.unit_price || 0);
                }
                html = _table('المبيعات حسب الصنف', Object.keys(im).map(function(k){return im[k];}).sort(function(a,b){return b.total-a.total;}), [
                    {key:'code',label:'كود الصنف'},{key:'name',label:'اسم الصنف'},{key:'qty',label:'الكمية'},{key:'total',label:'إجمالي المبيعات'}
                ]);
            } else if (reportId === 'sales-by-area') {
                data = await _orders('area,total_amount');
                var am={};
                for (var i4=0;i4<data.length;i4++){var a4=data[i4].area||'غير محدد';am[a4]=(am[a4]||0)+Number(data[i4].total_amount||0);}
                html=_table('المبيعات حسب المنطقة',Object.keys(am).map(function(k){return {area:k,total:am[k]};}).sort(function(a,b){return b.total-a.total;}),[
                    {key:'area',label:'المنطقة'},{key:'total',label:'الإجمالي'}
                ]);
            } else if (reportId === 'sales-order-status') {
                data=await _orders('order_status');
                var sm={};
                for (var i5=0;i5<data.length;i5++){var s5=data[i5].order_status||'غير محدد';sm[s5]=(sm[s5]||0)+1;}
                html=_table('حالة الأوردرات',Object.keys(sm).map(function(k){return {status:k,count:sm[k]};}),[
                    {key:'status',label:'الحالة'},{key:'count',label:'العدد'}
                ]);
            } else if (reportId === 'sales-customer-ledger') {
                var cust=await _currentCompanyCustomer();
                data=await _query('customer_ledger','entry_date,reference,description,debit,credit,balance',function(q){return q.eq('customer_id',cust.id).order('entry_date',{ascending:false});});
                html=_table('كشف حساب العميل',data,[
                    {key:'entry_date',label:'التاريخ'},{key:'reference',label:'المرجع'},{key:'description',label:'البيان'},{key:'debit',label:'مدين'},{key:'credit',label:'دائن'},{key:'balance',label:'الرصيد'}
                ]);
            } else if (reportId === 'sales-runsheet-performance') {
                data=await _query('runsheets','id,runsheet_code,run_date,total_amount,status,driver_id,vehicle_id',function(q){return q.eq('company_id',companyId).gte('run_date',fromDate).lt('run_date',_nextDate(toDate));});
                html=_table('أداء الرانشيتات',data,[
                    {key:'runsheet_code',label:'كود الرانشيت'},{key:'run_date',label:'التاريخ'},{key:'driver_id',label:'السائق'},{key:'total_amount',label:'القيمة'},{key:'status',label:'الحالة'}
                ]);
            } else if (reportId === 'inventory-stock' || reportId === 'inventory-low-stock' || reportId === 'inventory-dormant') {
                var items=await _items();
                var stock=await _stockMap();
                var invRows=[];
                for(var i6=0;i6<items.length;i6++){
                    var it=items[i6], st=stock[it.id]||{qty:0,allocated:0};
                    var avail=Math.max(0,Number(st.qty||0)-Number(st.allocated||0));
                    invRows.push({item:it,qty:Number(st.qty||0),allocated:Number(st.allocated||0),available:avail});
                }
                if(reportId==='inventory-stock'){
                    var stockOut=invRows.map(function(x){return {item_code:x.item.item_code,name:x.item.name,unit:x.item.unit,qty:x.qty,allocated:x.allocated,available:x.available,sales_price:x.item.sales_price,value:x.qty*Number(x.item.sales_price||0)};});
                    html=_table('جرد المخزون الحالي',stockOut,[
                        {key:'item_code',label:'كود الصنف'},{key:'name',label:'اسم الصنف'},{key:'unit',label:'الوحدة'},{key:'qty',label:'الكمية الفعلية'},{key:'allocated',label:'المحجوزة'},{key:'available',label:'المتاحة'},{key:'sales_price',label:'سعر البيع'},{key:'value',label:'قيمة المخزون'}
                    ]);
                } else if(reportId==='inventory-low-stock'){
                    var low=invRows.filter(function(x){return x.available <= (Number(x.item.reorder_point)||5);}).sort(function(a,b){return a.available-b.available;});
                    html=_table('الأصناف الأقل من حد الطلب',low.map(function(x){return {item_code:x.item.item_code,name:x.item.name,available:x.available,reorder_point:Number(x.item.reorder_point)||5};}),[
                        {key:'item_code',label:'كود الصنف'},{key:'name',label:'اسم الصنف'},{key:'available',label:'المتاح'},{key:'reorder_point',label:'حد الطلب'}
                    ]);
                } else {
                    var od=await _orders('id'); var ids=od.map(function(x){return x.id;}).filter(Boolean); var sold={};
                    if(ids.length){var odt=await _query('order_details','item_code',function(q){return q.in('order_id',ids);});for(var i7=0;i7<odt.length;i7++) if(odt[i7].item_code) sold[odt[i7].item_code]=true;}
                    var dorm=invRows.filter(function(x){return x.available>0&&!sold[x.item.item_code];}).sort(function(a,b){return b.available-a.available;}).slice(0,30);
                    html=_table('تحليل دوران المخزون (الأصناف الراكدة)',dorm.map(function(x){return {item_code:x.item.item_code,name:x.item.name,available:x.available};}),[
                        {key:'item_code',label:'كود الصنف'},{key:'name',label:'اسم الصنف'},{key:'available',label:'المتاح'}
                    ]);
                }
            } else if (reportId === 'purchase-by-supplier' || reportId === 'purchase-order-status') {
                data=await _query('purchase_orders','po_code,supplier_id,supplier_name,total_amount,status,po_date',function(q){
                    q=q.eq('company_id',companyId);
                    return q.gte('po_date',fromDate).lt('po_date',_nextDate(toDate));
                });
                if(reportId==='purchase-order-status'){
                    var pom={};for(var p1=0;p1<data.length;p1++){var ps=data[p1].status||'غير محدد';pom[ps]=(pom[ps]||0)+1;}
                    html=_table('حالة أوامر الشراء',Object.keys(pom).map(function(k){return {status:k,count:pom[k]};}),[
                        {key:'status',label:'الحالة'},{key:'count',label:'العدد'}
                    ]);
                } else {
                    if(supplier)data=data.filter(function(x){return String(x.supplier_id||'')===String(supplier);});
                    var pom2={};for(var p2=0;p2<data.length;p2++){var sid=data[p2].supplier_id||'غير محدد';if(!pom2[sid])pom2[sid]={id:sid,name:data[p2].supplier_name||sid,total:0,count:0};pom2[sid].total+=Number(data[p2].total_amount||0);pom2[sid].count++;}
                    html=_table('المشتريات حسب المورد',Object.keys(pom2).map(function(k){return pom2[k];}).sort(function(a,b){return b.total-a.total;}),[
                        {key:'id',label:'كود المورد'},{key:'name',label:'اسم المورد'},{key:'count',label:'عدد الأوامر'},{key:'total',label:'إجمالي المشتريات'}
                    ]);
                }
            } else if (reportId === 'purchase-receiving') {
                var receiving=await _query('receiving','operation_id,date,po_number,responsible,status',function(q){return q.eq('company_id',companyId).gte('date',fromDate).lt('date',_nextDate(toDate));});
                var opIds=receiving.map(function(r){return r.operation_id;}).filter(Boolean);
                var rd=opIds.length?await _query('receiving_details','operation_id,item_code,item_name,qty_expected,qty_received,difference,reason',function(q){return q.in('operation_id',opIds);}):[];
                html=_table('تقرير استلام البضاعة',rd,[
                    {key:'operation_id',label:'عملية الاستلام'},{key:'item_code',label:'كود الصنف'},{key:'item_name',label:'الصنف'},{key:'qty_expected',label:'المطلوب'},{key:'qty_received',label:'المستلم'},{key:'difference',label:'الفرق'},{key:'reason',label:'السبب'}
                ]);
            } else if (reportId === 'finance-trial-balance') {
                data=await _financeRpc('get_trial_balance',{p_from_date:fromDate,p_to_date:toDate});
                html=_table('ميزان المراجعة',data,Object.keys(data[0]||{}).map(function(k){return {key:k,label:k};}));
            } else if (reportId === 'finance-profit-loss') {
                data=await _financeRpc('get_profit_loss',{p_from_date:fromDate,p_to_date:toDate});
                html=_table('قائمة الدخل',data,Object.keys(data[0]||{}).map(function(k){return {key:k,label:k};}));
            } else if (reportId === 'finance-balance-sheet') {
                data=await _financeRpc('get_balance_sheet_data',{p_as_of:toDate});
                html=_table('الميزانية العمومية',data,Object.keys(data[0]||{}).map(function(k){return {key:k,label:k};}));
            } else if (reportId === 'finance-cash-flow') {
                data=await _financeRpc('get_cash_flow',{p_from_date:fromDate,p_to_date:toDate});
                html=_table('قائمة التدفقات النقدية',data,Object.keys(data[0]||{}).map(function(k){return {key:k,label:k};}));
            } else if (reportId === 'finance-general-ledger') {
                if(!account){safeHTML(resultDiv,'<div class="text-center py-4 text-gray-500">يرجى اختيار حساب</div>');return;}
                data=await _query('journal_lines','entry_id,account_id,account_name,debit,credit',function(q){return q.eq('account_id',account);});
                var jeIds=data.map(function(x){return x.entry_id;}).filter(Boolean);
                var je=jeIds.length?await _query('journal_entries','id,entry_code,entry_date,reference,description,company_id',function(q){return q.eq('company_id',companyId).in('id',jeIds);}):[];
                var allowed={};for(var j1=0;j1<je.length;j1++)allowed[je[j1].id]=je[j1];
                data=data.filter(function(x){return !!allowed[x.entry_id];}).map(function(x){var j=allowed[x.entry_id];return {entry_code:j.entry_code,entry_date:j.entry_date,reference:j.reference,description:j.description,account_name:x.account_name,debit:x.debit,credit:x.credit};});
                html=_table('دفتر الأستاذ العام',data,[
                    {key:'entry_code',label:'القيد'},{key:'entry_date',label:'التاريخ'},{key:'reference',label:'المرجع'},{key:'description',label:'البيان'},{key:'account_name',label:'الحساب'},{key:'debit',label:'مدين'},{key:'credit',label:'دائن'}
                ]);
            } else if (reportId === 'finance-pnl-cost-center') {
                data=await _financeRpc('get_pnl_by_cost_center',{p_from_date:fromDate,p_to_date:toDate});
                html=_table('الربح والخسارة حسب مركز التكلفة',data,Object.keys(data[0]||{}).map(function(k){return {key:k,label:k};}));
            } else if (reportId === 'finance-budget-vs-actual') {
                data=await _financeRpc('get_budget_vs_actual',{p_year:Number(String(toDate).slice(0,4)),p_month:Number(String(toDate).slice(5,7)),p_cost_center_id:null});
                html=_table('الموازنة مقابل الفعلي',data,Object.keys(data[0]||{}).map(function(k){return {key:k,label:k};}));
            } else if (reportId === 'finance-treasury') {
                var tres=await _query('treasury','id,name',function(q){return q.eq('company_id',companyId);});
                var tqIds=treasury ? [treasury] : tres.map(function(x){return x.id;});
                data=tqIds.length?await _query('cash_box','*',function(q){return q.in('treasury_id',tqIds);}):[];
                html=_table('كشف حساب الخزينة',data,Object.keys(data[0]||{}).map(function(k){return {key:k,label:k};}));
            } else if (reportId === 'finance-tax') {
                html='<div class="bg-amber-50 border border-amber-200 rounded-2xl p-5"><h4 class="font-black text-lg mb-2">Capability Gate</h4><p class="text-sm text-amber-800">تقرير الضرائب غير متاح حتى يتوفر مصدر Production سلطوي مثبت.</p></div>';
            } else if (reportId === 'crm-customer-list') {
                data=await _query('customers','customer_code,name,area,debt,status',function(q){return q.eq('company_id',companyId).order('name',{ascending:true});});
                html=_table('قائمة العملاء',data,[
                    {key:'customer_code',label:'كود العميل'},{key:'name',label:'اسم العميل'},{key:'area',label:'المنطقة'},{key:'debt',label:'الدين'},{key:'status',label:'الحالة'}
                ]);
            } else if (reportId === 'crm-customer-analysis') {
                data=await _orders('customer_id,customer_name,total_amount');
                var crm={};for(var c1=0;c1<data.length;c1++){var cn=data[c1].customer_name||'غير محدد';if(!crm[cn])crm[cn]={name:cn,total:0,count:0};crm[cn].total+=Number(data[c1].total_amount||0);crm[cn].count++;}
                html=_table('تحليل العملاء',Object.keys(crm).map(function(k){return crm[k];}).sort(function(a,b){return b.total-a.total;}),[
                    {key:'name',label:'العميل'},{key:'count',label:'عدد الأوردرات'},{key:'total',label:'الإجمالي'}
                ]);
            } else if (reportId === 'crm-customer-followups') {
                html='<div class="text-center py-4 text-gray-500">سجل المتابعات غير متوفر حاليًا</div>';
            } else if (reportId === 'crm-customer-by-area') {
                data=await _query('customers','area',function(q){return q.eq('company_id',companyId);});
                var crmArea={};for(var c2=0;c2<data.length;c2++){var ar=data[c2].area||'غير محدد';crmArea[ar]=(crmArea[ar]||0)+1;}
                html=_table('العملاء حسب المنطقة',Object.keys(crmArea).map(function(k){return {area:k,count:crmArea[k]};}),[
                    {key:'area',label:'المنطقة'},{key:'count',label:'عدد العملاء'}
