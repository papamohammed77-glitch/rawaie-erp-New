name: RAWAEA MAIN1 Reconstruction Runner — ARCHIVED VERIFY ONLY
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main/main1.md'
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived main1
        run: |
          set -euo pipefail
          test -s Current/PWA/main/main1.md
          ! grep -q "git push" .github/workflows/main1-reconstruction-runner.yml
          echo MAIN1_ARCHIVE_VERIFY_PASS
