name: CTO PR-target forensic New-main closure v3
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Patch target only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          old='<link rel="manifest" href="../manifest.json">'
          new='<link rel="manifest" href="./New-main.manifest.json">'
          if old in s:
              if s.count(old)!=1: raise SystemExit('MANIFEST_LEGACY_CARDINALITY')
              s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('MANIFEST_CONTRACT_MISSING')
          meta='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if meta not in s:
              if s.count('</head>')!=1: raise SystemExit('HEAD_CARDINALITY')
              s=s.replace('</head>',meta+'\n</head>',1)
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if coord not in s:
              if s.count('</head>')!=1: raise SystemExit('HEAD_CARDINALITY_2')
              s=s.replace('</head>',coord+'\n</head>',1)
          if s.count('window.RW_OwnerLicense={')!=1: raise SystemExit('OWNER_AUTHORITY_CARDINALITY')
          old_email="async function showPanel(){\n  var e=email();"
          new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old_email in s:
              if s.count(old_email)!=1: raise SystemExit('NOTIFICATION_OLD_CARDINALITY')
              s=s.replace(old_email,new_email,1)
          elif new_email not in s and 'var e=RW_STATE.app.currentUser&&RW_STATE.app.currentUser.email;' not in s:
              raise SystemExit('NOTIFICATION_BINDING_CONTRACT_MISSING')
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_SCOPE_BUG')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess,tempfile,hashlib,json
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA_TARGET_SW_COORDINATOR','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','applyAuthoritativeContext','MAIN_HTML_CURRENT_CONTRACT_LEDGER','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_ShellContext','window.RW_OwnerLicense={']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('STATIC_CONTRACT_MISSING='+repr(miss))
          if s.count('window.RW_OwnerLicense={')!=1: raise SystemExit('OWNER_CARDINALITY')
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_SCOPE_BUG')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.scripts=0; self.styles=0
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
              elif t.lower()=='style': self.styles+=1
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['text']+=d
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                self.cur=None
          p=P(); p.feed(s); p.close()
          if len(p.inline)!=1: raise SystemExit('INLINE_COUNT='+str(len(p.inline)))
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(p.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          if (m.get('start_url'),m.get('scope'),m.get('lang'),m.get('dir'))!=('./New-main','./','ar','rtl'): raise SystemExit('DEDICATED_MANIFEST_FAIL')
          fm=json.loads(Path('Current/manifest.json').read_text(encoding='utf-8'))
          if (fm.get('start_url'),fm.get('scope'),fm.get('lang'),fm.get('dir'))!=('./PWA/New-main','./PWA/','ar','rtl'): raise SystemExit('FALLBACK_MANIFEST_FAIL')
          for x in ['Current/PWA/register-sw.js','Current/PWA/sw.js','Current/PWA/New-main-icon.svg']:
            if not Path(x).exists(): raise SystemExit('PWA_FILE_MISSING='+x)
          print('STATIC_GOLD_PASS SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Runtime Gold Diamond gate isolated
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p /tmp/site/Current/PWA
          cp Current/PWA/New-main /tmp/site/Current/PWA/New-main.html
          cp Current/PWA/New-main.manifest.json /tmp/site/Current/PWA/New-main.manifest.json
          cp Current/PWA/register-sw.js /tmp/site/Current/PWA/register-sw.js
          cp Current/PWA/sw.js /tmp/site/Current/PWA/sw.js
          python3 -m http.server 8123 --directory /tmp/site >/tmp/server.log 2>&1 & echo $! >/tmp/pid
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e))); p.on('console',m=>{if(m.type()==='error')ce.push(String(m.text()||''))});
            await p.route('https://cdn.jsdelivr.net/**',async r=>{const u=r.request().url(); if(u.includes('supabase-js')) return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},from:()=>({select:()=>({eq:()=>({order:()=>({limit:()=>({data:[],error:null})})})})}),rpc:async()=>({data:null,error:null})})}`}); if(u.includes('chart.js')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'}); if(u.includes('sweetalert')) return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({})};'}); return r.fulfill({status:200,contentType:'application/javascript',body:''});});
            await p.route('https://cdnjs.cloudflare.com/**',async r=>r.fulfill({status:200,contentType:'text/css',body:''}));
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main.html',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1200);
            const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation; let note='NOAPI',ld=false,ad=false; if(S?.app&&window.RW_Notification?.showPanel){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await Promise.race([window.RW_Notification.showPanel(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('NOTIFY_TIMEOUT')),3000))]);note='PASS'}catch(e){note='FAIL:'+String(e.message||e)}} if(N?.navigate){try{await Promise.race([N.navigate('license'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('LICENSE_TIMEOUT')),3000))])}catch(e){ld=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))} try{await Promise.race([N.navigate('audit'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('AUDIT_TIMEOUT')),3000))])}catch(e){ad=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}} const l=document.querySelector('link[rel="manifest"]'); const mj=await (await fetch(l.href)).json(); const sw=await fetch('./register-sw.js'); return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,note,ld,ad,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:l?.getAttribute('href')||'',start:mj.start_url,scope:mj.scope,sw:sw.status};});
            console.log('FORENSIC_V3='+JSON.stringify({r,pe,ce}));
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.note==='PASS'&&r.ld&&r.ad&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.start==='.'+'/New-main'&&r.scope==='.'+'/'&&r.sw===200;
            await b.close(); if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo RUNTIME_GOLD_PASS
          echo DIAMOND_PASS
      - name: Commit target-only closure
        run: |
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main
          git diff --cached --check
          git diff --cached --quiet && echo 'TARGET_ALREADY_CLOSED' && exit 0
          git commit -m '[FINAL-CLOSED] [FORENSIC-V3] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
