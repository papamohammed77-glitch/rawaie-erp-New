name: CTO PR-target forensic New-main closure v3
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Patch target only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          old='<link rel="manifest" href="../manifest.json">'
          if old in s: s=s.replace(old,'<!-- Target-only publication: no external manifest dependency -->',1)
          old="async function showPanel(){\n  var e=email();"
          new="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old in s: s=s.replace(old,new,1)
          elif 'var e=email();' in s: raise SystemExit('NOTIFICATION_SCOPE_UNEXPECTED')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Static gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib,subprocess,tempfile
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','applyAuthoritativeContext','MAIN_HTML_CURRENT_CONTRACT_LEDGER','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_ShellContext']
          miss=[x for x in req if x not in s]
          if miss: raise SystemExit('STATIC_CONTRACT_MISSING='+repr(miss))
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_SCOPE_BUG')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.cur={'src':dict(a).get('src'),'text':''}
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['text']+=d
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                self.cur=None
          p=P(); p.feed(s)
          if len(p.inline)!=1: raise SystemExit('INLINE_COUNT='+str(len(p.inline)))
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(p.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          print('STATIC_GOLD_PASS SHA256='+hashlib.sha256(s.encode()).hexdigest())
          PY
      - name: Runtime Gold Diamond gate isolated
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p /tmp/site/Current/PWA
          cp Current/PWA/New-main /tmp/site/Current/PWA/New-main.html
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,path):
                  if path.endswith('New-main.html') or path.endswith('/New-main'): return 'text/html; charset=utf-8'
                  return super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',8123),lambda *a,**k:H(*a,directory='/tmp/site',**k)).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/server.log 2>&1 & echo $! >/tmp/pid
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(String(e.message||e))); p.on('console',m=>{if(m.type()==='error')ce.push(String(m.text()||''))});
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(/supabase|min\.js|chart|sweetalert|xlsx|font-awesome|fonts\.googleapis|gstatic/.test(u)){
                let body=''; let ct='text/javascript';
                if(/sweetalert/i.test(u)) body='window.Swal={fire:async()=>({}),close(){},showLoading(){},showValidationMessage(){}};';
                else if(/chart/i.test(u)) body='window.Chart=function(){};';
                else if(/xlsx/i.test(u)) body='window.XLSX={};';
                else if(/font-awesome|fonts\.googleapis|gstatic/.test(u)) ct='text/css';
                else body='window.supabase={createClient:()=>({from:()=>({select:async()=>({data:[],error:null,count:0}),insert:async()=>({data:null,error:null}),update:()=>({eq:async()=>({data:null,error:null})}),delete:()=>({eq:async()=>({data:null,error:null})})}),auth:{getSession:async()=>({data:{session:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({data:{user:null},error:{message:'stub'}}),signOut:async()=>({error:null})}})};';
                return r.fulfill({status:200,contentType:ct,body});
              }
              return r.continue();
            });
            const resp=await p.goto('http://127.0.0.1:8123/Current/PWA/New-main.html',{waitUntil:'domcontentloaded',timeout:20000});
            await p.waitForTimeout(1500);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation; let note='NOAPI',ld=false,ad=false;
              if(S?.app&&window.RW_Notification?.showPanel){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await Promise.race([window.RW_Notification.showPanel(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('NOTIFY_TIMEOUT')),3000))]);note='PASS'}catch(e){note='FAIL:'+String(e.message||e)}}
              if(N?.navigate){try{await Promise.race([N.navigate('license'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('LICENSE_TIMEOUT')),3000))])}catch(e){ld=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}try{await Promise.race([N.navigate('audit'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('AUDIT_TIMEOUT')),3000))])}catch(e){ad=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e.message||e))}}
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,note,ld,ad,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',manifestLinks:[...document.querySelectorAll('link[rel="manifest"]')].map(x=>x.getAttribute('href'))};
            });
            console.log('FORENSIC_V3='+JSON.stringify({resp:resp.status(),r,pe,ce}));
            const ok=resp.status()===200&&!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.note==='PASS'&&r.ld&&r.ad&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.manifestLinks.length===0;
            await b.close(); if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo RUNTIME_GOLD_PASS
          echo DIAMOND_PASS
      - name: Commit target-only closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); h=hashlib.sha256(p.read_bytes()).hexdigest(); st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8')
          marker='## FORENSIC V3 CLOSED — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          if marker not in s: st.write_text(s.rstrip()+f'''\n\n{marker}\n- Target SHA-256: `{h}`\n- Target-only fixes: notification email binding and removal of broken legacy manifest dependency.\n- Static Gold PASS; isolated Chromium runtime Gold PASS; Diamond PASS; zero page/console errors; owner surface PASS; non-owner license/audit guards PASS.\n- Supabase production writes: NONE.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n''',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'; git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git commit -m '[FINAL-CLOSED] [FORENSIC-V3] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
