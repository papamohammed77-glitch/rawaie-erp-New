name: CTO direct P163 target closure
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: p163-main-target-closure
  cancel-in-progress: true
jobs:
  p163:
    if: ${{ !contains(github.event.head_commit.message, '[P163-EXECUTED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/node_modules
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser dependency
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Execute P163
        run: timeout 600s python3 tools/_cto_p163_direct_20260903.py
# CTO continuation trigger — serialized target-preserving P163