name: Forensic warehouse role finalizer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalizer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair JS escaping and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/warehouse.supervisor')
          s=p.read_text(encoding='utf-8')
          s=s.replace("\\\\'live\\\\'", "\\'live\\'")
          s=s.replace("\\\\'roster\\\\'", "\\'roster\\'")
          s=s.replace("\\\\'"+"+emp.id+"+"\\\\'", "\\'"+"+emp.id+"+"\\'")
          if 'set_active_warehouse_role' not in s: raise SystemExit('RPC patch missing')
          if ".eq('role','مخزني')" not in s: raise SystemExit('warehouse role filter missing')
          if "perms.indexOf('warehouse_supervisor')!==-1" not in s: raise SystemExit('supervisor gate missing')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "supabase.rpc('set_active_warehouse_role'" Current/PWA/warehouse.supervisor
          grep -q "eq('company_id',s.companyId).eq('role','مخزني')" Current/PWA/warehouse.supervisor
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/forensic_warehouse_role_patch.yml
          git config user.name 'rawaea-forensic-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Current/PWA/warehouse.supervisor .github/workflows/forensic_warehouse_role_patch.yml
          git commit -m 'fix: finalize warehouse supervisor role routing'
          git push