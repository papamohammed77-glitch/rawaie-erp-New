name: CTO Single Controlled UX Surgery 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ux_surgery:
    if: github.event.head_commit.message == '[CTO-UX] Execute New-main product closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Patch only Current/PWA/New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000
          def rep(old,new,label):
              global s
              assert s.count(old)==1,label+'_ANCHOR'
              s=s.replace(old,new,1)
          rep('.rw-login-card{width:min(520px,94vw);background:rgba(255,255,255,.97);border-radius:30px;padding:36px;box-shadow:0 25px 70px rgba(0,0,0,.2)}','.rw-login-card{width:min(520px,94vw);background:rgba(255,255,255,.97);border-radius:30px;padding:36px;box-shadow:0 25px 70px rgba(0,0,0,.2);position:relative;overflow:hidden}.rw-login-card:before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:linear-gradient(90deg,#2563eb,#06b6d4)}','LOGIN_CARD')
          rep('.rw-login-logo{width:88px;height:88px;margin:0 auto 14px;border-radius:24px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900}.rw-company-name{font-size:28px;font-weight:900}', '.rw-login-logo{width:104px;height:104px;margin:0 auto 14px;border-radius:26px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900;overflow:hidden;position:relative;box-shadow:0 18px 38px rgba(37,99,235,.22)}.rw-login-brand-image{width:100%;height:100%;object-fit:contain;padding:10px}.rw-login-brand-fallback{display:grid;place-items:center;width:100%;height:100%}.rw-company-name{font-size:28px;font-weight:900}', 'LOGIN_LOGO_CSS')
          rep('<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>','<div class="rw-login-logo"><img id="rw-login-brand-image" class="rw-login-brand-image hidden" alt="شعار الشركة"><span id="rw-login-brand-fallback" class="rw-login-brand-fallback">ر</span></div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div id="rw-login-company-description" class="rw-company-description">نظام ERP متكامل</div>','LOGIN_MARKUP')
          rep('.rw-sidebar-company-subtitle{font-size:11px;color:var(--muted);margin-top:2px}.rw-collapse-btn', '.rw-sidebar-company-subtitle{font-size:11px;color:var(--muted);margin-top:2px}.rw-sidebar-user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f8fafc;border:1px solid #f1f5f9}.rw-sidebar-user-avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.rw-sidebar-user-name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar-user-role{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw-sidebar.collapsed .rw-sidebar-user{justify-content:center;padding:10px}.rw-sidebar.collapsed .rw-sidebar-user-name,.rw-sidebar.collapsed .rw-sidebar-user-role{display:none}.rw-collapse-btn','SIDEBAR_USER_CSS')
          rep('<div class="rw-sidebar-top"><div class="rw-sidebar-brand"><img id="rw-sidebar-brand-logo" class="rw-sidebar-brand-logo" alt="شعار الشركة"><div><div id="rw-sidebar-company-name" class="rw-sidebar-company-name">الروائع ERP</div><div id="rw-sidebar-company-subtitle" class="rw-sidebar-company-subtitle">Production Context</div></div></div></div><div id="rw-sidebar-nav"', '<div class="rw-sidebar-top"><div class="rw-sidebar-brand"><img id="rw-sidebar-brand-logo" class="rw-sidebar-brand-logo" alt="شعار الشركة"><div><div id="rw-sidebar-company-name" class="rw-sidebar-company-name">الروائع ERP</div><div id="rw-sidebar-company-subtitle" class="rw-sidebar-company-subtitle">Production Context</div></div></div><div class="rw-sidebar-user"><div id="rw-sidebar-user-avatar" class="rw-sidebar-user-avatar">م</div><div><div id="rw-sidebar-user-name" class="rw-sidebar-user-name">مستخدم</div><div id="rw-sidebar-user-role" class="rw-sidebar-user-role">—</div></div></div></div><div id="rw-sidebar-nav"','SIDEBAR_USER_MARKUP')
          rep("if(r.error)throw r.error;await this.enterSystem(r.data.user)}finally{hideLoader()}","if(r.error)throw r.error;try{localStorage.setItem('rawaea_remember_email',byId('rw-remember')&&byId('rw-remember').checked?username:'')}catch(e){}await this.enterSystem(r.data.user)}finally{hideLoader()}", 'REMEMBER_WRITE')
          rep("},enterSystem:async function(authUser){await applyAuthoritativeContext(authUser);", "},forgotPassword:async function(){var email=(byId('rw-username')&&byId('rw-username').value||'').trim();if(!email)throw new Error('أدخل البريد الإلكتروني أولاً');var r=await supabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});if(r.error)throw r.error;return true},enterSystem:async function(authUser){await applyAuthoritativeContext(authUser);", 'FORGOT_PASSWORD')
          rep("await applyAuthoritativeContext(authUser);await Promise.all([RW_Data.loadItems(),RW_Data.loadCustomers(),RW_Data.loadBranches(),RW_Data.loadSuppliers()]);RW_STATE.app.initialized=true;safeText(byId('rw-header-user-display'),RW_STATE.app.currentUser.name);safeText(byId('rw-header-role-display'),RW_STATE.app.currentUser.role||'');safeText(byId('rw-sidebar-company-name'),RW_STATE.app.company.name||'الشركة الحالية');safeText(byId('rw-sidebar-company-subtitle'),RW_STATE.app.licenseState||'Production');var img=byId('rw-sidebar-brand-logo');if(img&&RW_STATE.app.company.logo)img.src=RW_STATE.app.company.logo;", "await applyAuthoritativeContext(authUser);await Promise.all([RW_Data.loadItems(),RW_Data.loadCustomers(),RW_Data.loadBranches(),RW_Data.loadSuppliers()]);RW_STATE.app.initialized=true;safeText(byId('rw-header-user-display'),RW_STATE.app.currentUser.name);safeText(byId('rw-header-role-display'),RW_STATE.app.currentUser.role||'');safeText(byId('rw-sidebar-company-name'),RW_STATE.app.company.name||'الشركة الحالية');safeText(byId('rw-sidebar-company-subtitle'),RW_STATE.app.licenseState||'Production');var companyName=RW_STATE.app.company.name||'الروائع ERP',companyLogo=RW_STATE.app.company.logo||'';safeText(byId('rw-login-company-name'),companyName);var limg=byId('rw-login-brand-image'),lfallback=byId('rw-login-brand-fallback');if(limg&&companyLogo){limg.src=companyLogo;limg.classList.remove('hidden');if(lfallback)lfallback.classList.add('hidden');}else{if(limg)limg.classList.add('hidden');if(lfallback)lfallback.classList.remove('hidden');}try{localStorage.setItem('rawaea_company_name',companyName);if(companyLogo)localStorage.setItem('rawaea_company_logo',companyLogo);}catch(e){}safeText(byId('rw-sidebar-company-name'),companyName);var img=byId('rw-sidebar-brand-logo');if(img&&companyLogo)img.src=companyLogo;safeText(byId('rw-sidebar-user-name'),RW_STATE.app.currentUser.name||'مستخدم');safeText(byId('rw-sidebar-user-role'),RW_STATE.app.currentUser.role||'—');safeText(byId('rw-sidebar-user-avatar'),(RW_STATE.app.currentUser.name||'م').trim().charAt(0)||'م');safeText(byId('rw-header-user-avatar'),(RW_STATE.app.currentUser.name||'م').trim().charAt(0)||'م');", 'BRANDING_SYNC')
          rep("var RW_Navigation={menuTree:[{view:'dashboard'", "var RW_Navigation={menuTree:[{view:'van-sales',icon:'fa-truck-fast',label:'فان سيلز',perm:'van-sales:view'},{view:'dashboard'", 'VAN_SALES_MENU')
          rep("function main1Delegation(view){var map={pos:", "function main1Delegation(view){var map={'van-sales':['فان سيلز',[['🚚','./van-sales.html','Van Sales','البيع المباشر والميداني']],'دورة البيع الميداني مملوكة لتطبيق Van Sales.'],pos:", 'VAN_SALES_DELEGATION')
          rep("permissionByView={dashboard:'dashboard:view'", "permissionByView={van-sales:'van-sales:view',dashboard:'dashboard:view'", 'VAN_SALES_PERMISSION')
          rep("byId('rw-login-form').addEventListener('submit',function(e){", "try{var remembered=localStorage.getItem('rawaea_remember_email')||'';if(remembered){byId('rw-username').value=remembered;byId('rw-remember').checked=true;}}catch(e){};byId('rw-forgot').addEventListener('click',function(e){e.preventDefault();RW_Auth.forgotPassword().then(function(){toast('تم إرسال رابط إعادة تعيين كلمة المرور','success')}).catch(function(err){safeText(byId('rw-login-error'),err.message||String(err));byId('rw-login-error').classList.remove('hidden')})});byId('rw-login-form').addEventListener('submit',function(e){", 'LOGIN_WIRING')
          p.write_text(s,encoding='utf-8')
          print('TARGET_PATCHED')
          PY
          git diff --check
          git add Current/PWA/New-main
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re,tempfile,subprocess,json
          from html.parser import HTMLParser
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense=','window.safeText=safeText;','window.safeHTML=safeHTML;','window.byId=byId;','rw-login-brand-image','forgotPassword:async function','rawaea_remember_email','van-sales:view','./van-sales.html']
          missing=[x for x in req if x not in s]
          assert not missing,missing
          assert s.count("byId('rw-login-form').addEventListener('submit'")==1
          assert s.count('rw-p163-closure')==1
          assert s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')==1
          assert s.count('__RAWAEA_MAIN11_GOVERNED_CLOSED_V2__')==1
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.stack=[]; self.blocks=[]
              def handle_starttag(self,t,a):
                  if t=='script' and 'src' not in dict(a): self.blocks.append('')
                  if t not in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}: self.stack.append(t)
              def handle_data(self,d):
                  if self.blocks:self.blocks[-1]+=d
              def handle_endtag(self,t):
                  if t=='script' and self.blocks and self.blocks[-1].strip(): pass
                  if self.stack and self.stack[-1]==t:self.stack.pop()
          q=P();q.feed(s);q.close();assert not q.stack
          scripts=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I);assert scripts
          for i,code in enumerate(scripts):
              f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(code,encoding='utf-8')
              try: subprocess.run(['node','--check',str(f)],check=True,capture_output=True,text=True)
              finally: f.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'));assert m['start_url']=='./New-main' and m['scope']=='./' and m['dir']=='rtl' and m['lang']=='ar'
          print('STATIC_UX_GATE=PASS')
          PY
      - name: Browser product gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea && mkdir -p /tmp/rawaea/Current/PWA && cp Current/PWA/New-main /tmp/rawaea/Current/PWA/New-main && cp Current/PWA/manifest.json /tmp/rawaea/Current/PWA/manifest.json
          cat >/tmp/raw-http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('/tmp/rawaea');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/raw-http.py >/tmp/raw-http.log 2>&1 & echo $! >/tmp/pid;trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({serviceWorkers:'block'});const pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
          await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(800);
          const r=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const m=await(await fetch(l.href)).json();const nav=RW_Navigation.menuTree||[];return{locale:document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',login:!!document.getElementById('rw-login-form'),passwordToggle:typeof window.togglePasswordVisibility==='function',forgot:typeof RW_Auth.forgotPassword==='function',remember:localStorage.getItem('rawaea_remember_email')!==null,brand:!!document.getElementById('rw-login-brand-image'),sidebar:!!document.getElementById('rw-sidebar'),sidebarUser:!!document.getElementById('rw-sidebar-user-name'),menuVan:nav.some(x=>x.view==='van-sales'),auth:typeof RW_Auth==='object',views:typeof RW_Views==='object',safeText:typeof window.safeText==='function',safeHTML:typeof window.safeHTML==='function',byId:typeof window.byId==='function',manifest:l.getAttribute('href'),start:m.start_url,scope:m.scope,dir:m.dir,lang:m.lang}});
          console.log('PRODUCT_BROWSER='+JSON.stringify({r,pe,ce}));await b.close();if(pe.length||ce.length||!r.locale||!r.login||!r.passwordToggle||!r.forgot||!r.brand||!r.sidebar||!r.sidebarUser||!r.menuVan||!r.auth||!r.views||!r.safeText||!r.safeHTML||!r.byId||r.manifest!=='./manifest.json'||r.start!=='./New-main'||r.scope!=='./'||r.dir!=='rtl'||r.lang!=='ar')process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo PRODUCT_BROWSER_GATE=PASS
      - name: Persist target and retire this writer
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main .github/workflows/_cto_surgical_login_dedup_20260903.yml
          git config user.name 'CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          cat > .github/workflows/_cto_surgical_login_dedup_20260903.yml <<'EOF'
          name: CTO Surgical Login Dedup 2026-09-03 — RETIRED
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            archived:
              runs-on: ubuntu-latest
              steps:
                - name: Archive notice
                  run: echo 'Historical login/license surgical writer retired after controlled product UX closure.'
          EOF
          git add .github/workflows/_cto_surgical_login_dedup_20260903.yml
          test "$(git diff --cached --name-only)" = $'Current/PWA/New-main\n.github/workflows/_cto_surgical_login_dedup_20260903.yml'
          git commit -m '[CTO-UX] Persist target-only product closure and retire writer'
          git push origin HEAD:main
          echo 'PERSISTED_TARGET_AND_RETIRED_WRITER=PASS'