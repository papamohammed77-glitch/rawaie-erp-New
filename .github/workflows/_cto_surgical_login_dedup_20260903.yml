name: CTO Surgical Login Dedup 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: cto-surgical-login-dedup
  cancel-in-progress: true
jobs:
  patch:
    if: startsWith(github.event.head_commit.message, '[CTO-LOGIN-DEDUPE-TRIGGER]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Surgical patch New-main only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/New-main')
          s = p.read_text(encoding='utf-8')
          guarded = "byId('rw-login-form').addEventListener('submit',function(e){if(window.__RAWAEA_MAIN11_EVENTS_BOUND__)return;"
          if s.count(guarded) != 1:
              raise SystemExit(f'LOGIN_DEDUPE_GUARD_MISSING_OR_DUPLICATE={s.count(guarded)}')
          old = "navigate:function(view){RW_STATE.app.currentView=view;var handler=actions[view];if(handler){Promise.resolve(handler()).catch(function(e){safeHTML(byId('rw-page-container'),'<div class=\\\"rw-notice rw-notice-bad\\\">'+esc(e.message||e)+'</div>')})}else{main1Delegation(view)}}"
          new = "navigate:function(view){var permissionByView={dashboard:'dashboard:view',customers:'customers:view',items:'items:view',suppliers:'suppliers:view',orders:'orders:view',runsheets:'runsheets:view',inventory:'inventory:view',finance:'finance:view',audit:'owner',reports:'reports:view',hr:'hr:view',settings:'settings:view',notifications:'notifications:view',telesales:'telesales:view',pos:'pos:use',purchases:'purchases:view',receiving:'receiving:view',vouchers:'vouchers:view',picking:'picking:view',loading:'loading:view',delivery:'delivery:view',returns:'returns:view',unloading:'unloading:view',online-store:'online-store:view',purchase-pos:'purchase-pos:view',branches:'branches:view',vehicle-count:'vehicle-count:view',branch-count:'branch-count:view',general-count:'general-count:view',users:'users:view',roles:'roles:view'};var required=permissionByView[view];if(required&&!RW_Permissions_check(required)){RW_STATE.app.currentView='dashboard';var box=byId('rw-page-container');if(box)safeHTML(box,'<div class=\\\"rw-notice rw-notice-bad\\\">غير مصرح لك بفتح هذه الوحدة.</div>');return false}RW_STATE.app.currentView=view;var handler=actions[view];if(handler){Promise.resolve(handler()).catch(function(e){safeHTML(byId('rw-page-container'),'<div class=\\\"rw-notice rw-notice-bad\\\">'+esc(e.message||e)+'</div>')})}else{main1Delegation(view)}return true}"
          if s.count(old) != 1:
              raise SystemExit(f'NAVIGATE_TARGET_NOT_FOUND_OR_DUPLICATE={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('ROUTE_AUTH_GUARD_PATCH=PASS')
          PY
          git diff --check
          files=$(git diff --name-only)
          test "$files" = "Current/PWA/New-main"
          git config user.name "cto-surgical-login-dedup"
          git config user.email "cto-surgical-login-dedup@users.noreply.github.com"
          git add -- Current/PWA/New-main
          git commit -m "[CTO-ROUTE-GUARD] Protect New-main runtime routes"
          git push origin HEAD:main
