name: warehouse-supervisor-team-surgical

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  surgical-fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[TEAM_SCOPE_APPLY]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch warehouse.supervisor Team tab only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('Current/PWA/warehouse.supervisor')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              "        .pulse{animation:softPulse 2s infinite}\n        @keyframes softPulse{0%{opacity:1}50%{opacity:0.7}100%{opacity:1}}",
              "        .pulse{animation:softPulse 2s infinite}\n        @keyframes softPulse{0%{opacity:1}50%{opacity:0.7}100%{opacity:1}}\n        .team-hero{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 55%,#2563eb 100%);color:#fff;border-radius:24px;padding:18px;box-shadow:0 14px 36px rgba(15,23,42,.16)}\n        .team-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:11px;font-weight:800}\n        .team-filter{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:12px 14px;width:100%;outline:none;font-weight:700}\n        .team-card{background:#fff;border:1px solid #eef2f7;border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.04)}\n        .team-role-select{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;width:100%;font-weight:800;outline:none}\n        .team-role-select:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(59,130,246,.10)}\n        .team-stat{background:#f8fafc;border-radius:18px;padding:12px}\n        .team-muted{color:#64748b;font-size:11px;font-weight:700}"
          )

          old_init = """    init: function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة');return}var isO=user.isOwner,perms=user.permissions,has=isO||perms.indexOf('warehouse_supervisor')!==-1;if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return}RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);s.currentUser=user;supabase.from('users').select('company_id').eq('id',user.id||'').maybeSingle().then(function(r){if(r.error||!r.data||!r.data.company_id)throw new Error('سياق الشركة غير محدد');s.companyId=r.data.company_id;s.enterApp()}).catch(function(e){RW_UI.showError(e.message||'تعذر تحديد الشركة')})})},"""
          new_init = """    init: function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة');return}var isO=user.isOwner,perms=user.permissions,has=isO||perms.indexOf('warehouse_supervisor')!==-1;if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return}RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);s.currentUser=user;supabase.from('users').select('company_id,default_branch_id,allowed_branch_ids').eq('id',user.id||'').maybeSingle().then(function(r){if(r.error||!r.data||!r.data.company_id)throw new Error('سياق الشركة غير محدد');s.companyId=r.data.company_id;s.supervisorBranchId=r.data.default_branch_id||null;s.supervisorBranchCodes=s.normalizeBranchCodes(r.data.allowed_branch_ids);s.resolveSupervisorScope().then(function(){s.enterApp()})}).catch(function(e){RW_UI.showError(e.message||'تعذر تحديد الشركة')})})},"""
          if old_init not in text:
              raise SystemExit('INIT_BLOCK_NOT_FOUND')
          text = text.replace(old_init, new_init, 1)

          old_load = """    loadStaff: function(){\n        var s=this;\n        supabase.from('users').select('id,name,email,role,active_warehouse_role').eq('company_id',s.companyId).eq('role','مخزني').order('name').then(function(r){\n            if(r.error){Swal.fire({title:'خطأ',text:r.error.message,icon:'error'});return}\n            s.staffList = r.data || [];\n            if(s.currentTab==='roster')s.renderRoster();\n        });\n    },"""
          new_load = """    normalizeBranchCodes: function(value){\n        var out=[];\n        if(Array.isArray(value)){out=value.slice(0)}\n        else if(typeof value==='string'){\n            var v=value.trim();\n            if(v){\n                try{var parsed=JSON.parse(v);if(Array.isArray(parsed))out=parsed.map(function(x){return String(x).trim()})}\n                catch(e){out=v.split(',').map(function(x){return x.trim()})}\n            }\n        }\n        var clean=[];\n        for(var i=0;i<out.length;i++){var c=String(out[i]||'').trim();if(c&&clean.indexOf(c)===-1)clean.push(c)}\n        return clean;\n    },\n\n    resolveSupervisorScope: function(){\n        var s=this;\n        return supabase.from('branches').select('id,branch_code,name,is_active').eq('company_id',s.companyId).then(function(r){\n            if(r.error)throw r.error;\n            s.branchRows=r.data||[];\n            var codes=s.supervisorBranchCodes.slice(0);\n            if(s.supervisorBranchId){\n                for(var i=0;i<s.branchRows.length;i++){if(s.branchRows[i].id===s.supervisorBranchId&&codes.indexOf(s.branchRows[i].branch_code)===-1)codes.push(s.branchRows[i].branch_code)}\n            }\n            if(codes.indexOf('*')===-1 && !codes.length)throw new Error('نطاق فرع المشرف غير محدد');\n            s.effectiveBranchCodes=codes;\n            s.effectiveBranchRows=[];\n            for(var j=0;j<s.branchRows.length;j++){if(codes.indexOf('*')!==-1 || codes.indexOf(s.branchRows[j].branch_code)!==-1)s.effectiveBranchRows.push(s.branchRows[j])}\n        });\n    },\n\n    staffMatchesScope: function(emp){\n        var s=this,scope=s.effectiveBranchCodes||[];\n        if(scope.indexOf('*')!==-1)return true;\n        var target=[];\n        if(emp.default_branch_id){\n            for(var i=0;i<(s.branchRows||[]).length;i++){if(s.branchRows[i].id===emp.default_branch_id){target.push(s.branchRows[i].branch_code);break}}\n        }\n        target=target.concat(s.normalizeBranchCodes(emp.allowed_branch_ids));\n        if(!target.length)return false;\n        for(var j=0;j<target.length;j++){if(scope.indexOf(target[j])!==-1)return true}\n        return false;\n    },\n\n    loadStaff: function(){\n        var s=this;\n        supabase.from('users').select('id,name,email,role,status,active_warehouse_role,default_branch_id,allowed_branch_ids').eq('company_id',s.companyId).in('role',['مخزني','أمين مخزن']).eq('status','Active').order('name').then(function(r){\n            if(r.error){Swal.fire({title:'خطأ',text:r.error.message,icon:'error'});return}\n            var rows=r.data||[];\n            s.staffList=rows.filter(function(emp){return s.staffMatchesScope(emp)});\n            if(s.currentTab==='roster')s.renderRoster();\n        });\n    },"""
          if old_load not in text:
              raise SystemExit('LOAD_BLOCK_NOT_FOUND')
          text = text.replace(old_load, new_load, 1)

          start = text.index('    renderRoster: function(){')
          end = text.index('    renderLive: function(){', start)
          new_roster = r'''    renderRoster: function(){
        var s=this;
        RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-2xl text-blue-400"></i></div>');
        var roles=['استلام','تحضير','تحميل','مرتجعات','تفريغ','أذونات','جرد','احتياطي'];
        var icons={'استلام':'📦','تحضير':'📋','تحميل':'🚛','مرتجعات':'↩️','تفريغ':'🔄','أذونات':'📄','جرد':'🔍','احتياطي':'🪑'};
        var scopeRows=s.effectiveBranchRows||[];
        var scopeText=scopeRows.length?scopeRows.map(function(b){return b.name+' ('+b.branch_code+')'}).join(' • '):((s.effectiveBranchCodes||[]).join(' • ')||'غير محدد');
        var assigned=0;
        for(var x=0;x<s.staffList.length;x++){if(s.staffList[x].active_warehouse_role)assigned++}
        var html='';
        html+='<div class="team-hero mb-4">';
        html+='<div class="flex items-start justify-between gap-3"><div><div class="text-[11px] opacity-75 font-black mb-1">فريقي • نطاق التشغيل</div><div class="text-xl font-black">'+scopeText+'</div><div class="text-xs opacity-80 mt-2">فقط العمال المخزنيون العاملون داخل نطاق فرع المشرف يمكن إدارتهم من هنا.</div></div><div class="text-3xl">👥</div></div>';
        html+='<div class="flex flex-wrap gap-2 mt-3"><span class="team-chip">👤 '+s.staffList.length+' عامل</span><span class="team-chip">⚙️ '+assigned+' مكلف</span><span class="team-chip">🔄 '+(s.staffList.length-assigned)+' احتياطي/غير محدد</span></div>';
        html+='</div>';
        html+='<div class="mb-4"><input id="teamSearch" class="team-filter" placeholder="ابحث باسم العامل أو البريد أو المهمة..." oninput="App.filterRoster(this.value)"></div>';
        html+='<div id="teamRosterList">';
        html+=s.buildRosterCards(s.staffList,roles,icons);
        html+='</div>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
    },

    buildRosterCards: function(rows,roles,icons){
        var s=this;
        if(!rows.length)return '<div class="card text-center text-slate-400 py-10"><div class="text-4xl mb-3">🔎</div><div class="font-black">لا يوجد عمال ضمن نطاق الفرع</div><div class="text-xs mt-2">لا يتم عرض أعضاء من فروع أخرى.</div></div>';
        var html='';
        for(var i=0;i<rows.length;i++){
            var emp=rows[i];
            var role=emp.active_warehouse_role||'احتياطي';
            var jobLabel=emp.role||'مخزني';
            var branchCodes=s.normalizeBranchCodes(emp.allowed_branch_ids);
            if(emp.default_branch_id){for(var b=0;b<(s.branchRows||[]).length;b++){if(s.branchRows[b].id===emp.default_branch_id&&branchCodes.indexOf(s.branchRows[b].branch_code)===-1)branchCodes.unshift(s.branchRows[b].branch_code)}}
            var branchText=branchCodes.length?branchCodes.join(' • '):'نطاق غير محدد';
            html+='<div class="team-card mb-3 slide-in" data-team-card="'+String(emp.name||'').toLowerCase()+' '+String(emp.email||'').toLowerCase()+' '+role.toLowerCase()+' '+jobLabel.toLowerCase()+'">';
            html+='<div class="flex items-start justify-between gap-3">';
            html+='<div class="min-w-0"><div class="font-black text-slate-800 text-base">'+(emp.name||emp.email)+'</div><div class="text-xs text-slate-400 mt-1 truncate">'+emp.email+'</div><div class="flex flex-wrap gap-2 mt-2"><span class="team-muted">المسمى الأساسي: '+jobLabel+'</span><span class="team-muted">النطاق: '+branchText+'</span></div></div>';
            html+='<div class="bg-blue-50 text-blue-700 px-3 py-2 rounded-2xl text-xs font-black whitespace-nowrap">'+(icons[role]||'🪑')+' '+role+'</div>';
            html+='</div>';
            html+='<div class="team-stat mt-3"><div class="flex items-center justify-between mb-2"><span class="text-xs font-black text-slate-600">المهمة التشغيلية الحالية</span><span class="text-[10px] text-slate-400">يمكن تغييرها فورًا حسب احتياج العمل</span></div>';
            html+='<select class="team-role-select" data-user-id="'+emp.id+'" data-original-role="'+role+'" onchange="App.updateRole(this.dataset.userId,this.value)">';
            for(var j=0;j<roles.length;j++){html+='<option value="'+roles[j]+'"'+(roles[j]===role?' selected':'')+'>'+(icons[roles[j]]||'')+' '+roles[j]+'</option>'}
            html+='</select></div></div>';
        }
        return html;
    },

    filterRoster: function(query){
        var q=String(query||'').trim().toLowerCase();
        var cards=document.querySelectorAll('[data-team-card]');
        for(var i=0;i<cards.length;i++){cards[i].style.display=(!q||cards[i].getAttribute('data-team-card').indexOf(q)!==-1)?'block':'none'}
    },

    updateRole: function(userId,newRole){
        var s=this;
        if(!userId||!newRole)return;
        RW_UI.showLoader('جاري تحويل المهمة...');
        supabase.rpc('set_active_warehouse_role',{p_user_id:userId,p_role:newRole}).then(function(r){
            RW_UI.hideLoader();
            if(r.error){Swal.fire({title:'تعذر تغيير المهمة',text:r.error.message,icon:'error'});s.loadStaff();return}
            for(var i=0;i<s.staffList.length;i++){if(s.staffList[i].id===userId){s.staffList[i].active_warehouse_role=newRole;break}}
            RW_UI.toast('تم تحويل '+newRole+' للعامل بنجاح','success');
            s.renderRoster();
        });
    },

'''
          text = text[:start] + new_roster + text[end:]

          path.write_text(text, encoding='utf-8')

          # Add branch-scope state to App object without touching unrelated behavior.
          text = path.read_text(encoding='utf-8')
          marker = "    currentUser: null, companyId: null, staffList: [], currentTab: 'dashboard', chartInstance: null,"
          replacement = "    currentUser: null, companyId: null, staffList: [], currentTab: 'dashboard', chartInstance: null, supervisorBranchId: null, supervisorBranchCodes: [], effectiveBranchCodes: [], branchRows: [], effectiveBranchRows: [],"
          if marker not in text:
              raise SystemExit('STATE_MARKER_NOT_FOUND')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          print('PATCH_OK')
      - name: Validate JavaScript syntax
        run: |
          node --check Current/PWA/warehouse.supervisor
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "rawaea-cto-bot"
          git config user.email "rawaea-cto-bot@users.noreply.github.com"
          rm -f .github/workflows/warehouse-supervisor-team-surgical.yml
          git add Current/PWA/warehouse.supervisor .github/workflows/warehouse-supervisor-team-surgical.yml
          git commit -m "[TEAM_SCOPE_APPLY] surgical warehouse supervisor team scope and UX"
          git push origin main
