name: receive-stock-voucher Production HTTP E2E
on:
  push:
    paths:
      - '.github/workflows/receive-stock-voucher-production-http-e2e-20260816.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Production RECEIVE HTTP E2E
        env:
          SUPABASE_URL: https://fiilmooggumokxanwiyx.supabase.co
          ANON_KEY: sb_publishable_ZQC-PFJJWDoFh-6ZmaTWeg_UtrzzM71
          EMAIL: cp-prod-canary-20260814@example.invalid
          PASSWORD: Tmp-CP-PROD-20260814-Aa1!
          VOUCHER: QA-RCV-HTTP-20260816-040337422
          ITEM: 1003
        run: |
          set -euo pipefail
          TOKEN=$(curl --fail-with-body --silent --show-error --max-time 60 -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" | python -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          OP1="RCV-HTTP-OP-1-20260816"
          OP2="RCV-HTTP-OP-2-20260816"
          call() { curl --fail-with-body --silent --show-error --max-time 60 -X POST "$SUPABASE_URL/functions/v1/receive-stock-voucher" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "Idempotency-Key: $1" --data "{\"voucher_code\":\"$VOUCHER\",\"receivedItems\":[{\"itemCode\":\"$ITEM\",\"receivedQty\":1} ],\"operation_id\":\"$1\"}"; }
          FIRST=$(call "$OP1" | tee first.json)
          python - <<'PY'
          import json
          r=json.load(open('first.json')); assert r.get('success') is True and r.get('status')=='Sent',r
          PY
          RETRY=$(call "$OP1" | tee retry.json)
          python - <<'PY'
          import json
          r=json.load(open('retry.json')); assert r.get('success') is True and r.get('operation_id')=='RCV-HTTP-OP-1-20260816',r
          PY
          SECOND=$(call "$OP2" | tee second.json)
          python - <<'PY'
          import json
          r=json.load(open('second.json')); assert r.get('success') is True and r.get('status')=='Received' and r.get('operation_id')=='RCV-HTTP-OP-2-20260816',r
          PY
          echo '{"success":true,"normal":true,"retry":true,"second_partial":true,"production_http":true}'