name: TEMP Main9 Syntax Gate 2026-09-10
on:
  pull_request:
    paths:
      - 'Current/PWA/main2/main9.md'
      - 'Current/PWA/main2/main2.md'
      - '.github/workflows/_tmp_main9_syntax_gate_20260910.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
      - name: Node syntax gate
        shell: bash
        run: |
          set -euo pipefail
          node --version
          cp Current/PWA/main2/main9.md /tmp/main9.js
          cp Current/PWA/main2/main2.md /tmp/main2.js
          node --check /tmp/main9.js
          node --check /tmp/main2.js
          cat /tmp/main2.js /tmp/main9.js > /tmp/main2-main9.js
          node --check /tmp/main2-main9.js
          echo MAIN9_SYNTAX=PASS
          echo MAIN2_SYNTAX=PASS
          echo MAIN2_PLUS_MAIN9_PARSE=PASS
