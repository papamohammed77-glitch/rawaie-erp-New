name: complete-picking concurrent HTTP canary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  p0_main_repair:
    if: github.event.head_commit.message != 'fix: execute parent pwa main shell p0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Repair Parent PWA main.html without rebuilding it
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/main.html')
          s=p.read_text(encoding='utf-8')
          original=s
          required=['window.RW_STATE = RW_STATE;','window.RW_Navigation = RW_Navigation;','window.RW_Views = RW_Views;','Current/PWA/core.js']
          for a in required:
              if a.startswith('Current/'):
                  continue
              if a not in s: raise SystemExit('P0_ABORT missing '+a)

          # Canonical tenant context, sourced from authenticated users row.
          if 'window.RW_ShellContext' not in s:
              anchor='window.RW_Navigation = RW_Navigation;'
              pos=s.find(anchor)
              if pos<0: raise SystemExit('P0_ABORT navigation anchor missing')
              pos+=len(anchor)
              block=r'''
// ============================================================
// P0 ERP SHELL — AUTHENTICATED TENANT CONTEXT
// Never infer company from app_settings LIMIT 1.
// ============================================================
var RW_ShellContext=(function(){
  var companyId=null,resolving=null;
  function resolve(callback){
    if(companyId){RW_STATE.app.companyId=companyId;if(callback)callback(true,companyId);return Promise.resolve(companyId);}
    if(resolving)return resolving.then(function(id){if(callback)callback(true,id);return id;});
    var u=RW_STATE.app.currentUser||{};
    if(!u.email){if(callback)callback(false,null);return Promise.resolve(null);}
    resolving=supabase.from('users').select('id,company_id,name,role,status').eq('email',u.email).eq('status','Active').maybeSingle().then(function(r){
      if(r.error||!r.data||!r.data.company_id)throw new Error('تعذر تحديد سياق الشركة للمستخدم');
      companyId=r.data.company_id;RW_STATE.app.companyId=companyId;RW_STATE.app.userId=r.data.id||null;
      if(RW_STATE.app.currentUser){if(r.data.name)RW_STATE.app.currentUser.name=r.data.name;if(r.data.role)RW_STATE.app.currentUser.role=r.data.role;}
      return companyId;
    }).finally(function(){resolving=null;});
    return resolving.then(function(id){if(callback)callback(true,id);return id;}).catch(function(e){companyId=null;RW_STATE.app.companyId=null;if(callback)callback(false,null);throw e;});
  }
  function getCompanyId(){if(!companyId&&RW_STATE.app.companyId)companyId=RW_STATE.app.companyId;if(!companyId)throw new Error('TENANT_CONTEXT_UNAVAILABLE');return companyId;}
  function hasCompany(){return !!(companyId||(RW_STATE.app&&RW_STATE.app.companyId));}
  return{resolve:resolve,getCompanyId:getCompanyId,hasCompany:hasCompany};
})();
window.RW_ShellContext=RW_ShellContext;

// Gate every shell entry on authenticated company context.
var _rwOriginalEnterSystem=RW_Auth.enterSystem;
RW_Auth.enterSystem=function(){
  var self=this;
  if(!RW_ShellContext.hasCompany()){
    RW_ShellContext.resolve(function(ok){
      if(ok)self.enterSystem();
      else{hideLoader();showToast('تعذر تحديد سياق الشركة للمستخدم','error');}
    }).catch(function(e){console.error('TENANT_CONTEXT_ERROR',e);});
    return;
  }
  return _rwOriginalEnterSystem.apply(this,arguments);
};

'''
              s=s[:pos]+block+s[pos:]

          # Remove known global app_settings LIMIT 1 reads without touching already scoped reads.
          s=re.sub(r"\.from\('app_settings'\)(\s*\.select\([^\n;]*?\))(\s*)\.limit\(1\)",
                   r".from('app_settings')\1.eq('company_id', RW_ShellContext.getCompanyId())\2.limit(1)",s)

          # Integrated Vehicle Master in the existing RW_Views/router.
          if 'window.RW_Fleet' not in s:
              anchor='// ============================================================\n// RW_HR – الموارد البشرية'
              pos=s.find(anchor)
              if pos<0: raise SystemExit('P0_ABORT RW_HR anchor missing')
              block=r'''
// ============================================================
// RW_Fleet — Vehicle Master inside the Parent ERP Shell
// Backend contract: create_vehicle_atomic only.
// No client-side vehicle/branch/stock writer.
// ============================================================
var RW_Fleet=(function(){
  var vehicles=[],drivers=[];
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function cid(){return RW_ShellContext.getCompanyId();}
  async function load(){
    var v=await supabase.from('vehicles').select('id,vehicle_code,model,license_plate,driver_id,status,vehicle_type,operation_mode,ownership_type,max_weight_kg,max_volume_m3,min_trip_value,refrigerated,mobile_stock_enabled,mobile_branch_id').eq('company_id',cid()).order('vehicle_code',{ascending:true});
    if(v.error)throw v.error;vehicles=v.data||[];
    var d=await supabase.from('users').select('id,name,email,role,status').eq('company_id',cid()).eq('status','Active').in('role',['driver','سائق','مندوب']).order('name',{ascending:true});
    if(d.error)throw d.error;drivers=d.data||[];
  }
  function driverName(id){for(var i=0;i<drivers.length;i++)if(drivers[i].id===id)return drivers[i].name||drivers[i].email||'';return'غير معين';}
  function filter(q){q=String(q||'').trim().toLowerCase();return vehicles.filter(function(v){return !q||[v.vehicle_code,v.license_plate,v.model,v.vehicle_type,v.operation_mode,v.ownership_type,v.status,driverName(v.driver_id)].join(' ').toLowerCase().indexOf(q)!==-1;});}
  function render(){
    var c=byId('rw-page-container');if(!c)return;
    safeText(byId('rw-header-title'),'السيارات والمركبات');
    safeText(byId('rw-header-subtitle'),'Vehicle Master • مندوب • سيارة • Mobile Branch • Van Stock');
    safeHTML(c,'<div class="space-y-5"><div class="rw-card"><div class="flex items-center justify-between gap-3 flex-wrap"><div><h2 class="text-xl font-black">السيارات والمركبات</h2><p class="text-sm text-gray-500 mt-1">سجل موحد للأسطول مرتبط بالمندوب والفرع المتنقل والمخزون.</p></div><button class="rw-btn-primary" onclick="RW_Fleet.openCreate()">إضافة سيارة</button></div></div><div class="rw-card p-0 overflow-hidden"><div class="p-4 border-b"><input id="rw-fleet-search" class="rw-input" style="height:52px;padding-right:18px" placeholder="بحث ذكي بالكود، اللوحة، الموديل، المندوب، الحالة..." oninput="RW_Fleet.draw(this.value)"></div><div id="rw-fleet-table" class="overflow-auto"></div></div></div>');
    load().then(function(){draw('');}).catch(function(e){safeHTML(byId('rw-fleet-table'),'<div class="p-8 text-center text-red-500 font-bold">'+esc(e.message)+'</div>');});
  }
  function draw(q){var w=byId('rw-fleet-table');if(!w)return;var a=filter(q);if(!a.length){safeHTML(w,'<div class="p-10 text-center text-gray-400">لا توجد سيارات ضمن الشركة الحالية.</div>');return;}var h='<table class="rw-table"><thead><tr><th>الكود</th><th>اللوحة</th><th>الموديل</th><th>المندوب</th><th>النمط</th><th>الحالة</th><th>Mobile Stock</th></tr></thead><tbody>';a.forEach(function(v){h+='<tr><td>'+esc(v.vehicle_code)+'</td><td>'+esc(v.license_plate)+'</td><td>'+esc(v.model||'-')+'</td><td>'+esc(driverName(v.driver_id))+'</td><td>'+esc(v.operation_mode||'-')+'</td><td>'+esc(v.status||'-')+'</td><td>'+(v.mobile_stock_enabled?'مفعل':'غير مفعل')+'</td></tr>';});h+='</tbody></table>';safeHTML(w,h);}
  async function driversSearch(q){q=String(q||'').trim();var x=supabase.from('users').select('id,name,email,role,status').eq('company_id',cid()).eq('status','Active').in('role',['driver','سائق','مندوب']).limit(20);if(q)x=x.or('name.ilike.%'+q+'%,email.ilike.%'+q+'%');var r=await x;return r.data||[];}
  async function create(){var code=String((byId('vf-code')||{}).value||'').trim(),plate=String((byId('vf-plate')||{}).value||'').trim();if(!code||!plate){Swal.showValidationMessage('كود السيارة ورقم اللوحة مطلوبان');return false;}var u=RW_STATE.app.currentUser||{};var r=await supabase.rpc('create_vehicle_atomic',{p_company_id:cid(),p_vehicle_code:code,p_model:(byId('vf-model')||{}).value||null,p_license_plate:plate,p_driver_id:(byId('vf-driver-id')||{}).value||null,p_max_weight_kg:Number((byId('vf-weight')||{}).value)||null,p_max_volume_m3:Number((byId('vf-volume')||{}).value)||null,p_min_trip_value:Number((byId('vf-mintrip')||{}).value)||null,p_status:(byId('vf-status')||{}).value||'Active',p_notes:(byId('vf-notes')||{}).value||null,p_vehicle_type:(byId('vf-type')||{}).value||'Delivery',p_operation_mode:(byId('vf-mode')||{}).value||'Mixed',p_ownership_type:(byId('vf-own')||{}).value||'Owned',p_model_year:Number((byId('vf-year')||{}).value)||null,p_vin:(byId('vf-vin')||{}).value||null,p_fuel_type:(byId('vf-fuel')||{}).value||null,p_refrigerated:!!(byId('vf-refrigerated')||{}).checked,p_mobile_stock_enabled:!!(byId('vf-mobile-stock')||{}).checked,p_created_by:u.email||null});if(r.error){Swal.showValidationMessage(r.error.message);return false;}return r.data&&r.data.success?r.data:(Swal.showValidationMessage((r.data&&r.data.error)||'فشل إنشاء السيارة'),false);}
  function openCreate(){var html='<div dir="rtl"><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><input id="vf-code" class="rw-input" placeholder="كود السيارة *"><input id="vf-plate" class="rw-input" placeholder="رقم اللوحة *"><input id="vf-model" class="rw-input" placeholder="الموديل"><input id="vf-weight" type="number" step="0.01" class="rw-input" placeholder="أقصى وزن kg"><input id="vf-volume" type="number" step="0.01" class="rw-input" placeholder="أقصى حجم m³"><input id="vf-mintrip" type="number" step="0.01" class="rw-input" placeholder="الحد الأدنى لقيمة الرحلة"><select id="vf-type" class="rw-input"><option value="Delivery">Delivery</option><option value="Sales">Sales</option><option value="Mixed" selected>Mixed</option></select><select id="vf-mode" class="rw-input"><option value="Mixed" selected>Mixed</option><option value="DirectSales">Direct Sales</option><option value="Delivery">Delivery</option></select><select id="vf-own" class="rw-input"><option value="Owned" selected>Owned</option><option value="Leased">Leased</option><option value="Rented">Rented</option></select><select id="vf-status" class="rw-input"><option value="Active" selected>Active</option><option value="Inactive">Inactive</option><option value="Maintenance">Maintenance</option></select><input id="vf-year" type="number" class="rw-input" placeholder="سنة الموديل"><input id="vf-vin" class="rw-input" placeholder="VIN"><input id="vf-fuel" class="rw-input" placeholder="نوع الوقود"><div class="md:col-span-2"><input id="vf-driver-search" class="rw-input" placeholder="بحث ذكي بالمندوب/السائق" oninput="RW_Fleet.pickDriverSearch(this.value)"><input id="vf-driver-id" type="hidden"><div id="vf-driver-results" class="border rounded-xl mt-2 max-h-40 overflow-auto"></div></div><label class="flex items-center gap-2 md:col-span-2"><input id="vf-refrigerated" type="checkbox"> مركبة مبردة</label><label class="flex items-center gap-2 md:col-span-2"><input id="vf-mobile-stock" type="checkbox" checked> Mobile Stock</label><textarea id="vf-notes" class="rw-input md:col-span-2" style="height:90px;padding:12px 18px" placeholder="ملاحظات"></textarea></div></div>';Swal.fire({title:'إضافة سيارة',html:html,width:820,showCancelButton:true,confirmButtonText:'إنشاء السيارة',cancelButtonText:'إلغاء',preConfirm:function(){return create();}});pickDriverSearch('');}
  async function pickDriverSearch(q){var r=await driversSearch(q),w=byId('vf-driver-results');if(!w)return;var h='';r.forEach(function(d){h+='<button type="button" class="block w-full text-right p-3 border-b bg-white" onclick="RW_Fleet.pickDriver(\\''+d.id+'\\',\\''+esc(d.name)+'\\',\\''+esc(d.email)+'\\')">'+esc(d.name)+' <span class="text-gray-500">'+esc(d.email)+'</span></button>';});safeHTML(w,h||'<div class="p-3 text-gray-400">لا يوجد مندوب مطابق.</div>');}
  function pickDriver(id,name,email){var h=byId('vf-driver-id'),i=byId('vf-driver-search');if(h)h.value=id;if(i)i.value=name+' ('+email+')';safeHTML(byId('vf-driver-results'),'');}
  return{render:render,draw:draw,openCreate:openCreate,pickDriverSearch:pickDriverSearch,pickDriver:pickDriver};
})();
window.RW_Fleet=RW_Fleet;

'''
              s=s[:pos]+block+s[pos:]

          # Router parity: preserve all old routes, add one capability.
          if "if(view==='vehicles')" not in s and 'if (view === \'vehicles\')' not in s:
              anchor="window.RW_Views = RW_Views;"
              pos=s.find(anchor)
              if pos<0: raise SystemExit('P0_ABORT RW_Views export anchor')
              pos+=len(anchor)
              route=r'''
// P0 navigation capability — does not replace existing routes.
var _rwOriginalViewRender=RW_Views.render;
RW_Views.render=function(view){if(view==='vehicles'){RW_Fleet.render();return;}_rwOriginalViewRender.apply(this,arguments);};
window.RW_Views=RW_Views;

// Add Vehicle Master to the already-rendered sidebar without changing existing entries.
(function(){
  function addFleet(){
    var nav=byId('rw-sidebar-nav');if(!nav||byId('rw-nav-vehicles'))return;
    var allowed=false;try{allowed=RW_Auth.checkPermission('vehicles.manage');}catch(e){}
    if(!allowed)return;
    var b=document.createElement('button');b.id='rw-nav-vehicles';b.type='button';b.className='rw-sidebar-link';b.setAttribute('data-view','vehicles');b.innerHTML='<span class="rw-sidebar-link-icon"><i class="fa-solid fa-car-side"></i></span><span class="rw-sidebar-link-text">السيارات والمركبات</span>';b.onclick=function(){RW_Navigation.navigate('vehicles');};nav.appendChild(b);
  }
  var obs=new MutationObserver(addFleet);obs.observe(document.documentElement,{childList:true,subtree:true});setTimeout(addFleet,700);setTimeout(addFleet,1800);
})();
'''
              s=s[:pos]+route+s[pos:]

          p.write_text(s,encoding='utf-8')
          if s==original:raise SystemExit('P0_ABORT no changes')
          print('P0_PATCHED',len(original.encode()),len(s.encode()))
          PY

      - name: Validate P0 output
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          for x in ['RW_ShellContext','RW_Fleet','create_vehicle_atomic',"view==='vehicles'","data-view','vehicles.manage"]:
              if x not in s: raise SystemExit('VALIDATION_FAILED missing '+x)
          if ".from('app_settings')\n            .select('*')\n            .limit(1" in s: raise SystemExit('VALIDATION_FAILED unscoped app_settings remains')
          codes=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(codes,1):
              f=Path(tempfile.gettempdir())/f'rwmain_{i}.js';f.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr);raise SystemExit('VALIDATION_FAILED JS syntax '+str(i))
          print('P0_STATIC_OK',len(codes))
          PY
          git diff --check

      - name: Record and publish P0; restore original workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA P0 Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_P0_EXECUTION.md <<'EOF'
# Parent PWA main.html — P0 execution record

Executed against the current `main` tree by the proven push canary workflow.

P0 delivered:
- authenticated tenant context sourced from `users.company_id` before shell entry;
- known `app_settings LIMIT 1` reads in the Parent PWA company-scoped;
- integrated Vehicle Master route and navigation capability;
- smart driver search scoped to the current company;
- Vehicle creation delegated only to Production `create_vehicle_atomic`;
- no client-side Physical Stock writer added;
- Parent PWA existing routes/functions preserved.

Validation:
- full inline JavaScript syntax check passed;
- git diff --check passed.

This record does not claim browser E2E or full Production runtime closure; those remain explicit P4 evidence boundaries.
EOF
          git checkout HEAD^ -- .github/workflows/complete-picking-concurrency-canary-20260814.yml
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_P0_EXECUTION.md .github/workflows/complete-picking-concurrency-canary-20260814.yml
          git commit -m 'fix: execute parent pwa main shell p0'
          git push origin HEAD:main

  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Concurrent staging canary
        env:
          SUPABASE_URL: https://hfzznsiprnwkpayskzhu.supabase.co
          ANON_KEY: sb_publishable_xd6h0YBpVA1VmNH6A1LCXg_9DhF2ifh
          PASSWORD: Tmp-CP-20260814-Aa1!
          AUTH_BASE: https://hfzznsiprnwkpayskzhu.supabase.co/functions/v1/cp-auth-canary-20260814?token=CP-AUTH-20260814
          FIX_URL: https://hfzznsiprnwkpayskzhu.supabase.co/functions/v1/cp-fixture-canary-20260814?token=CP-FIX-20260814
        run: |
          set -euo pipefail
