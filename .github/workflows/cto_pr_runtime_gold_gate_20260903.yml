name: CTO PR Runtime Gold Diamond Gate 20260903
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/New-main-icon.svg'
      - 'Current/PWA/register-sw.js'
      - 'Current/PWA/sw.js'
      - '.github/workflows/cto_pr_runtime_gold_gate_20260903.yml'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: cto-pr-runtime-gold-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Surgical normalize exact target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          for x in ['RAWAEA MAIN2 AUTHORITATIVE MODULE','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=']:
              assert x in s,x
          if 'async function showPanel(){\n  var e=email();' in s:
              assert s.count('async function showPanel(){\n  var e=email();')==1
              s=s.replace('async function showPanel(){\n  var e=email();','async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;',1)
          s=s.replace('<link rel="manifest" href="../manifest.json">','<link rel="manifest" href="./New-main.manifest.json">',1)
          if 'rw-p163-closure' not in s: s=s.replace('</head>','<meta name="rw-p163-closure" content="P163-GOLD-DIAMOND-CLOSED-2026-09-03">\n</head>',1)
          if 'rw-pwa-runtime-gold' not in s: s=s.replace('</head>','<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">\n<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>\n</head>',1)
          elif 'RAWAEA_TARGET_SW_COORDINATOR' not in s: s=s.replace('</head>','<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>\n</head>',1)
          assert s.count('rw-p163-closure')==1 and s.count('rw-pwa-runtime-gold')==1 and s.count('RAWAEA_TARGET_SW_COORDINATOR')==1
          p.write_text(s,encoding='utf-8')
          m=Path('Current/PWA/New-main.manifest.json')
          if not m.exists():
              m.write_text(json.dumps({'name':'الروائع ERP','short_name':'الروائع ERP','description':'منصة إدارة الأعمال الذكية والمتكاملة - الروائع ERP','start_url':'./New-main','scope':'./','display':'standalone','dir':'rtl','lang':'ar','background_color':'#f8fafc','theme_color':'#2563eb','icons':[{'src':'./New-main-icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          icon=Path('Current/PWA/New-main-icon.svg')
          if not icon.exists(): icon.write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2563eb"/><text x="256" y="325" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" font-size="270" font-weight="900" fill="#fff">ر</text></svg>\n',encoding='utf-8')
          PY
      - name: Static Gold Diamond gate
        shell: bash
        run: |
          set -euo pipefail
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess,tempfile,json
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          assert len(s.encode())>150000
          assert s.count('<html lang="ar" dir="rtl">')==1
          assert s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')==1
          assert s.count('// MAIN2_GOVERNED_CLOSED:v1')==1
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.cur=None; self.inline=[]
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.cur={'src':dict(a).get('src'),'buf':[]}
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['buf'].append(d)
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and ''.join(self.cur['buf']).strip(): self.inline.append(''.join(self.cur['buf']))
                self.cur=None
          q=P(); q.feed(s); q.close(); assert len(q.inline)==1
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(q.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='./' and m['dir']=='rtl' and m['lang']=='ar'
          assert Path('Current/PWA/New-main-icon.svg').exists()
          print('STATIC_GOLD_DIAMOND_PASS')
          PY
      - name: Exact HTTP Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir /tmp/site
          cp -a Current/PWA/. /tmp/site/
          cp Current/PWA/New-main /tmp/site/main.html
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          trap 'kill "$(cat /tmp/http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[]; p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
          await p.route('**/*',async r=>{const u=r.request().url(); if(u.includes('supabase.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>({error:null})},from:()=>{const o={};['select','eq','in','order','range','gte','lte','or','update','insert'].forEach(k=>o[k]=()=>o);o.maybeSingle=async()=>({data:null,error:null});o.limit=async()=>({data:[],error:null});return o}})}`}); if(u.includes('chart.umd.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){}'}); if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false}),close(){},showLoading(){}}'}); if(u.includes('xlsx.full.min.js'))return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={utils:{}}'}); if(u.includes('font-awesome'))return r.fulfill({status:200,contentType:'text/css',body:''}); return r.continue();});
          await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(1200);
          const r=await p.evaluate(async()=>{const S=window.RW_STATE,N=window.RW_Navigation; let notification='NOT_EXPOSED'; if(window.RW_Notification&&typeof window.RW_Notification.showPanel==='function'){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL:'+String(e&&e.message||e)}} let licenseDenied=false,auditDenied=false; if(N&&typeof N.navigate==='function'){try{S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};await N.navigate('license')}catch(e){licenseDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e&&e.message||e))} try{await N.navigate('audit')}catch(e){auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e&&e.message||e))}} const l=document.querySelector('link[rel="manifest"]'); const m=await (await fetch(l.href)).json(); return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,licenseDenied,auditDenied,manifest:l?.getAttribute('href')||null,start:m.start_url,scope:m.scope,p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||null,pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||null,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')}}); console.log(JSON.stringify({r,pe,ce},null,2)); await b.close(); const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.notification==='PASS'&&r.licenseDenied&&r.auditDenied&&r.manifest==='New-main.manifest.json'&&r.start==='./New-main'&&r.scope==='./'&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.diamond; if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo BROWSER_GOLD_DIAMOND_PASS
      - name: Commit proven closure back to PR branch
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA CTO Closure'
          git config user.email 'rawaea-cto-closure@users.noreply.github.com'
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg
          if git diff --cached --quiet; then echo 'ALREADY_CLOSED'; exit 0; fi
          git diff --cached --check
          git commit -m '[CTO-PR-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git push origin HEAD:"$BRANCH"
