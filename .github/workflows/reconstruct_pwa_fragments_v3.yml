name: RAWAEA PWA fragment reconstruction v3
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  reconstruct:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'forensic-reconstruct-v3-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forensic-reconstruct-v3-20260830
          fetch-depth: 0
      - name: Reconstruct and prove fragment equivalence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          cur=Path('Current/PWA/main.html').read_bytes(); orig=Path('Original/PWA/main.html').read_bytes()
          def norm(b): return re.sub(rb'^(<!DOCTYPE html>\n<!--)[^>]*(-->\n)',rb'\1__BUILD_MARKER__\2',b,count=1,flags=re.I)
          if norm(cur)!=norm(orig): raise SystemExit('BLOCKING_UNKNOWN: integrated current main differs functionally from Original')
          sizes=[63126,100436,76707,63334,68592,26717,101985,67029,89270,18851]
          sizes.append(len(cur)-sum(sizes))
          if sizes[-1] < 0: raise SystemExit('BOUNDARY_OVERFLOW')
          rows=[]; off=0
          for i,size in enumerate(sizes,1):
              b=cur[off:off+size]; ob=Path(f'Original/PWA/main/main{i}.md').read_bytes()
              Path(f'Current/PWA/main/main{i}.md').write_bytes(b)
              rows.append({'part':i,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'original_bytes':len(ob),'original_sha256':hashlib.sha256(ob).hexdigest(),'raw_exact':b==ob,'normalized_exact':norm(b)==norm(ob)})
              off+=size
          joined=b''.join(Path(f'Current/PWA/main/main{i}.md').read_bytes() for i in range(1,12))
          report={'canonical_normalized_equivalent':True,'current_main_sha256':hashlib.sha256(cur).hexdigest(),'original_main_sha256':hashlib.sha256(orig).hexdigest(),'fragments':rows,'concatenation_sha256':hashlib.sha256(joined).hexdigest(),'concat_equals_current_main':joined==cur,'fragment_sizes':sizes}
          Path('Current/CTO').mkdir(parents=True,exist_ok=True)
          Path('Current/CTO/PWA_FRAGMENT_RECONSTRUCTION_REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if joined!=cur or not all(r['normalized_exact'] for r in rows): raise SystemExit('RECONSTRUCTION_VALIDATION_FAILED')
          PY
      - name: Validate integrated runtime structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=b''.join(Path(f'Current/PWA/main/main{i}.md').read_bytes() for i in range(1,12)).decode('utf-8')
          checks={'doctype':bool(re.search(r'<!DOCTYPE html>',s,re.I)),'html_close':bool(re.search(r'</html>\s*$',s,re.I)),'script_balanced':len(re.findall(r'<script\b',s,re.I))==len(re.findall(r'</script>',s,re.I)),'style_balanced':len(re.findall(r'<style\b',s,re.I))==len(re.findall(r'</style>',s,re.I)),'brace_balance':s.count('{')-s.count('}')==0}
          Path('Current/CTO/PWA_FRAGMENT_RUNTIME_STRUCTURE.json').write_text(json.dumps(checks,indent=2),encoding='utf-8'); print(checks); assert all(checks.values())
          PY
      - name: Commit reconstructed fragments
        run: |
          git config user.name 'RAWAEA CTO Reconstruction'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/main Current/CTO/PWA_FRAGMENT_RECONSTRUCTION_REPORT.json Current/CTO/PWA_FRAGMENT_RUNTIME_STRUCTURE.json
          git commit -m 'fix(pwa): reconstruct complete main1-main11 from verified main'
          git push origin HEAD:forensic-reconstruct-v3-20260830
