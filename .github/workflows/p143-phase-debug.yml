name: P143 phase isolation — temporary forensic test
on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main/**'
      - '.github/workflows/p143-phase-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: isolate first broken fragment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          cur=Path('Current/PWA/main')
          parts=[cur/f'main{i}.md' for i in range(1,12)]
          chunks=[]
          for i,p in enumerate(parts,1):
              s=p.read_text(encoding='utf-8-sig')
              if i==1:
                  s=re.sub(r'(?m)^\s*const RW_Auth\s*=\s*','var RW_Auth = ',s,count=1)
                  s=re.sub(r'(?m)^\s*const RW_Navigation\s*=\s*','var RW_Navigation = ',s,count=1)
              elif i==7:
                  pat=re.compile(r"(safeHTML\(q\(['\"]settlement-rs-select['\"]\),[\s\S]*?\.join\(''\))\);}",re.M)
                  s=pat.sub(r'\1));}',s,count=1)
              s=re.sub(r'</body>\s*','',s,flags=re.I)
              s=re.sub(r'</html>\s*','',s,flags=re.I)
              s=re.sub(r'\s*<!--\s*RAWAEA_[^>]*-->\s*$','',s,flags=re.I|re.S)
              if i>1 and re.search(r'</script>',s,re.I): raise SystemExit(f'MAIN{i}_SCRIPT_CLOSURE_FORBIDDEN')
              chunks.append(s.rstrip())
          running=re.search(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*)',chunks[0],re.I)
          if not running: raise SystemExit('MAIN1_INLINE_SCRIPT_MISSING')
          js=running.group(1)
          for i in range(1,12):
              if i>1: js += '\n\n' + chunks[i-1]
              f=Path(tempfile.gettempdir())/f'phase-{i}.js'; f.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(f'FIRST_JS_BREAK=main{i}')
                  print(r.stderr)
                  print('TAIL_BEGIN')
                  print('\n'.join(js.splitlines()[-40:]))
                  print('TAIL_END')
                  raise SystemExit(2)
              print(f'PHASE_OK=main{i}')
          print('ALL_PHASES_JS_SYNTAX_OK')
          PY