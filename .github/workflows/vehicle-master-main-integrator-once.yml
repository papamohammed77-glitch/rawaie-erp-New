name: vehicle-master-main-integrator-once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Vehicle Master into main navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('Current/PWA/main.html')
          s = p.read_text(encoding='utf-8')
          marker = "{ view: 'branches', label: 'المخازن والفروع' }"
          insert = marker + ", { action: 'openVehicleMaster', label: 'إدارة السيارات والأسطول' }"
          if s.count(marker) != 1:
              raise SystemExit(f'Expected exactly one branches menu marker, found {s.count(marker)}')
          if "openVehicleMaster" not in s:
              s = s.replace(marker, insert, 1)
          action_anchor = "if (action === 'showFinanceTab') {"
          action_insert = "if (action === 'openVehicleMaster') { window.location.href = 'vehicles.html'; return; } if (action === 'showFinanceTab') {"
          if s.count(action_anchor) != 1:
              raise SystemExit(f'Expected exactly one finance action anchor, found {s.count(action_anchor)}')
          if "if (action === 'openVehicleMaster')" not in s:
              s = s.replace(action_anchor, action_insert, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate integration markers
        run: |
          test "$(grep -o "openVehicleMaster" Current/PWA/main.html | wc -l)" -eq 2
          grep -F "vehicles.html" Current/PWA/main.html >/dev/null
      - name: Commit main integration and remove one-shot workflow
        run: |
          git config user.name 'rawaea-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Current/PWA/main.html
          git commit -m 'feat(pwa): integrate vehicle master into warehouse navigation'
          git push origin HEAD:main
          git rm .github/workflows/vehicle-master-main-integrator-once.yml
          git commit -m 'chore(ci): remove one-shot vehicle master integrator'
          git push origin HEAD:main
