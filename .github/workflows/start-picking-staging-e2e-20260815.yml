name: start-picking staging HTTP E2E
on:
  push:
    branches: [main]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Start-picking HTTP E2E matrix
        env:
          SUPABASE_URL: https://hfzznsiprnwkpayskzhu.supabase.co
          ANON_KEY: sb_publishable_xd6h0YBpVA1VmNH6A1LCXg_9DhF2ifh
          FIX_URL: https://hfzznsiprnwkpayskzhu.supabase.co/functions/v1/start-picking-e2e-fixture-20260815?token=SP-E2E-20260815
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          from concurrent.futures import ThreadPoolExecutor

          BASE=os.environ['SUPABASE_URL']; ANON=os.environ['ANON_KEY']; FIX=os.environ['FIX_URL']; PASSWORD='Tmp-SP-20260815-Aa1!'
          def req(url, method='GET', body=None, headers=None):
              data=None if body is None else json.dumps(body).encode(); h=headers or {}
              if body is not None: h={**h,'Content-Type':'application/json'}
              r=urllib.request.urlopen(urllib.request.Request(url,data=data,method=method,headers=h),timeout=60)
              return r.status,json.loads(r.read().decode())
          def start(token, code):
              try: return req(BASE+'/functions/v1/start-picking','POST',{'runsheet_code':code},{'Authorization':'Bearer '+token})[1]
              except urllib.error.HTTPError as e: return json.loads(e.read().decode())
          def create(status='Open', kind='normal'):
              email=f"sp-{kind}-{status}-{time.time_ns()}@example.invalid"
              _,f=req(FIX+'&'+urllib.parse.urlencode({'mode':'create','status':status,'kind':kind,'email':email})); assert f['success'],f; return f
          def login(f):
              _,a=req(BASE+'/auth/v1/token?grant_type=password','POST',{'email':f['email'],'password':PASSWORD},{'apikey':ANON}); return a['access_token']
          def verify(f):
              _,v=req(FIX+'&'+urllib.parse.urlencode({'mode':'verify','runsheet_id':f['runsheet_id'],'auth_id':f['auth_id']})); return v
          def cleanup(f):
              req(FIX+'&'+urllib.parse.urlencode({'mode':'cleanup','runsheet_id':f['runsheet_id'],'auth_id':f['auth_id'],'temp_company_id':f.get('temp_company_id') or ''}))

          f=create('Open'); t=login(f); r=start(t,f['runsheet_code']); assert r['success'],r; v=verify(f); assert v['runsheet']['status']=='Picking'; assert v['runsheet']['picker_id']==v['user']['id']; assert v['user']['company_id']==v['runsheet']['company_id']; cleanup(f)
          f=create('Confirmed'); t=login(f); r=start(t,f['runsheet_code']); assert r['success'],r; v=verify(f); assert v['runsheet']['status']=='Picking'; assert v['runsheet']['picker_id']==v['user']['id']; cleanup(f)
          f=create('Open','wrong-company'); t=login(f); r=start(t,f['runsheet_code']); assert not r['success'],r; cleanup(f)
          f=create('Open','missing-user'); t=login(f); r=start(t,f['runsheet_code']); assert not r['success'],r; assert 'المستخدم غير مسجل' in r.get('msg',''); cleanup(f)
          f=create('Picking'); t=login(f); r=start(t,f['runsheet_code']); assert not r['success'],r; cleanup(f)

          f=create('Open'); t=login(f); r1=start(t,f['runsheet_code']); r2=start(t,f['runsheet_code']); assert r1['success'],r1; assert not r2['success'],r2; cleanup(f)
          f=create('Open'); t=login(f)
          with ThreadPoolExecutor(max_workers=2) as ex: a,b=ex.map(lambda _:start(t,f['runsheet_code']),[1,2])
          assert sum(1 for r in (a,b) if r.get('success') is True)==1,(a,b); assert sum(1 for r in (a,b) if r.get('success') is False)==1,(a,b); v=verify(f); assert v['runsheet']['status']=='Picking'; assert v['runsheet']['picker_id']==v['user']['id']; cleanup(f)
          print('START_PICKING_STAGING_E2E_PASS')
          PY
