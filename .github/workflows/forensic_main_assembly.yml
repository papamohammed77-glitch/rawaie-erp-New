name: RAWAEA governed main assembly — CTO GOLD EXECUTOR
# Temporary CTO execution mode. Runs once on [CTO_EXECUTE_P163]; its successful result is committed with [CTO-EXECUTED], which is excluded by the guard.
on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main/**'
      - 'Current/PWA/main.html'
      - 'Current/PWA/New-main'
      - 'tools/run_final_main_reconstruction_20260831.py'
      - 'tools/p0_main_shell_repair_v2.py'
      - 'tools/master_reconstruction_postprocess.py'
      - '.github/workflows/forensic_main_assembly.yml'
permissions:
  contents: write
jobs:
  forensic-assembly:
    if: ${{ contains(github.event.head_commit.message, '[CTO_EXECUTE_P163]') && !contains(github.event.head_commit.message, '[CTO-EXECUTED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reconstruct governed target from Current fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_final_main_reconstruction_20260831.py
      - name: Execute P163 ownership surgery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          required=['main1Delegation','actions','/* RAWAEA MAIN2 AUTHORITATIVE MODULE */','MAIN3','post_stock_movement','reserve_stock','save_sales_invoice_atomic','edgeCall','supabaseClient']
          miss=[x for x in required if x not in s]
          if miss: raise SystemExit('RECONSTRUCTION_CONTRACT_MISSING '+repr(miss))
          compat='/* RAWAEA MAIN2 COMPATIBILITY */';auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          if s.count(compat)!=1 or s.count(auth)!=1: raise SystemExit(f'P163_OWNER_COUNTS compat={s.count(compat)} auth={s.count(auth)}')
          a=s.index(compat);b=s.index(auth)
          if b<=a: raise SystemExit('P163_OWNER_ORDER_INVALID')
          s=s[:a]+s[b:]
          for alias in ['window.RW_Dashboard={render:renderDashboard};','window.RW_Items={render:renderItems};']:
            if s.count(alias)!=1: raise SystemExit('P163_ALIAS_COUNT '+alias+' '+str(s.count(alias)))
            s=s.replace(alias,'',1)
          close='window.RW_Items=RW_Items;';version="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';";governed='// MAIN2_GOVERNED_CLOSED:v1'
          if s.count(close)!=1: raise SystemExit('P163_RW_ITEMS_OWNER_COUNT')
          if s.count(version)>1 or s.count(governed)>1: raise SystemExit('P163_CLOSURE_DUPLICATE')
          if version not in s:s=s.replace(close,close+'\n'+version,1)
          if governed not in s:s=s.replace(version,version+'\n'+governed,1)
          if compat in s or s.count(version)!=1 or s.count(governed)!=1: raise SystemExit('P163_CLOSURE_FAIL')
          if 'window.RW_Dashboard={render:renderDashboard};' in s or 'window.RW_Items={render:renderItems};' in s: raise SystemExit('P163_ALIAS_SURVIVAL')
          if 'actions' not in s or 'main1Delegation' not in s or 'MAIN3' not in s: raise SystemExit('P163_PRESERVATION_FAIL')
          if re.search(r"\.from\(['\"]stock_branches['\"]\)[\s\S]{0,1200}\.(?:insert|update|upsert|delete)\(",s): raise SystemExit('DIRECT_STOCK_WRITER')
          if re.search(r"\.from\(['\"]inventory_log['\"]\)[\s\S]{0,900}\.(?:insert|update|upsert|delete)\(",s): raise SystemExit('DIRECT_INVENTORY_LOG_WRITER')
          if s.lower().count('<script')!=s.lower().count('</script>') or s.lower().count('<style')!=s.lower().count('</style>'): raise SystemExit('HTML_BALANCE')
          if len(re.findall(r'navigator\.serviceWorker\.register',s))>1: raise SystemExit('SW_DUPLICATE')
          ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(ms)!=1: raise SystemExit('INLINE_RUNTIME_COUNT '+str(len(ms)))
          Path('/tmp/new-main.js').write_text(ms[0].group('b'),encoding='utf-8')
          p.write_text(s,encoding='utf-8')
          print('P163_GOLD_OK bytes',len(s.encode()),'sha256',hashlib.sha256(s.encode()).hexdigest())
          PY
          node --check /tmp/new-main.js
          git diff --check
      - name: Deep source capability audit against original fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          target=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          def inventory(s):
            funcs=set(re.findall(r'(?<![\w$])(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',s))
            ids=set(re.findall(r'\b(?:id|data-view|data-page)=["\']([^"\']+)["\']',s))
            rpcs=set(re.findall(r'\.rpc\(\s*["\']([^"\']+)',s))
            tables=set(re.findall(r'\.from\(\s*["\']([^"\']+)',s))
            return funcs,ids,rpcs,tables
          tf,ti,tr,tt=inventory(target)
          losses={}
          for i in range(1,12):
            p=Path(f'Current/PWA/main/main{i}.md')
            o=Path(f'Original/PWA/main/main{i}.md')
            of,oi,orpc,ot=inventory(o.read_text(encoding='utf-8'))
            cf,ci,cr,ct=inventory(p.read_text(encoding='utf-8'))
            losses[f'main{i}']={'current_fragment_function_loss':[x for x in sorted(cf) if x not in tf], 'original_function_not_anywhere_in_target':[x for x in sorted(of) if x not in tf], 'original_ids_not_anywhere_in_target':[x for x in sorted(oi) if x not in ti], 'original_rpcs_not_anywhere_in_target':[x for x in sorted(orpc) if x not in tr], 'original_tables_not_anywhere_in_target':[x for x in sorted(ot) if x not in tt]}
          # Main1..11 parity is evidence, not a blind requirement: reconstructed wrappers may replace historical names.
          print(json.dumps(losses,ensure_ascii=False,indent=2))
          PY
      - name: Browser smoke — New-main local application
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rw-pwa; mkdir -p /tmp/rw-pwa; cp -r Current/PWA/. /tmp/rw-pwa/; cp Current/PWA/New-main /tmp/rw-pwa/main.html
          python3 -m http.server 8123 --directory /tmp/rw-pwa >/tmp/rw-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[];p.on('pageerror',e=>pe.push(e.message));await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1500);const r=await p.evaluate(()=>({lang:document.documentElement.lang,body:!!document.body,state:!!window.RW_STATE,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract,main2:document.body.innerHTML.includes('MAIN2-COMPLETE-SURGICAL-v1')}));console.log(JSON.stringify({r,pe}));if(r.lang!=='ar'||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.main2||pe.length)process.exit(2);await b.close();})().catch(e=>{console.error(e);process.exit(2)})
          NODE
      - name: Persist only target plus current state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          target=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          state=Path('CURRENT_STATE.md')
          st=state.read_text(encoding='utf-8')
          marker='P163 CLOSED — MAIN2 ownership surgery + governed New-main reconstruction'
          if marker not in st:
            st=st.rstrip()+f"\n\n## CTO EXECUTION — 2026-09-03\n\n{marker}\n- Target: `Current/PWA/New-main`\n- Target SHA-256: `{hashlib.sha256(target.encode()).hexdigest()}`\n- Reconstructed from `Current/PWA/main/main1.md` through `main11.md`; `Original/PWA/main/*` remained immutable evidence.\n- P163 closed by deterministic ownership surgery: compatibility owner removed, legacy dashboard/items aliases removed, reconstruction marker retained under authoritative MAIN2 owner; `actions`, `main1Delegation`, and MAIN3 preserved.\n- Static gates and browser smoke passed.\n- Supabase production data writes: none.\n"
            state.write_text(st,encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'fix(cto): complete New-main reconstruction and P163 [CTO-EXECUTED] [main-reconstruction-executed]'
          git push origin HEAD:main
