name: RAWAEA forensic main assembly — VERIFY ONLY

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Current/PWA/main/**'
      - 'Current/PWA/main.html'

permissions:
  contents: read

jobs:
  forensic-assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build forensic manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          parts=[f'main{i}.md' for i in range(1,12)]
          cur=Path('Current/PWA/main'); org=Path('Original/PWA/main')
          sha=lambda b: hashlib.sha256(b).hexdigest()
          def meta(p):
              b=p.read_bytes(); return {'path':str(p),'bytes':len(b),'sha256':sha(b),'lines':b.count(b'\n')+1}
          def symbols(p):
              s=p.read_text(encoding='utf-8')
              return {
                'functions':sorted(set(re.findall(r'(?<![\\w$])function\\s+([A-Za-z_$][\\w$]*)\\s*\\(',s))),
                'ids':sorted(set(re.findall(r'\\bid=["\']([^"\']+)["\']',s))),
                'rpcs':sorted(set(re.findall(r'\\.rpc\\(\\s*["\']([^"\']+)["\']',s))),
                'tables':sorted(set(re.findall(r'\\.from\\(\\s*["\']([^"\']+)["\']',s))),
                'feature_counts':{k:s.count(k) for k in ['rec-purchase','rec-offers','RW_POS','RW_Roles','RW_TeleSales','RW_ShellContext','RW_OwnerContract']}
              }
          out={'parts':[],'current_main_html':meta(Path('Current/PWA/main.html')),'original_main_html':meta(Path('Original/PWA/main.html'))}
          for n in parts:
              out['parts'].append({'part':n,'current':meta(cur/n),'original':meta(org/n),'current_symbols':symbols(cur/n),'original_symbols':symbols(org/n)})
          Path('Current/CTO').mkdir(parents=True,exist_ok=True)
          Path('Current/CTO/FORENSIC_MAIN_ASSEMBLY_MANIFEST.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FORENSIC_MANIFEST_PASS')
          PY

      - name: Validate current main HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          checks=[r'<!doctype\s+html',r'<html\b',r'</html>',r'<head\b',r'</head>',r'<body\b',r'</body>']
          assert all(re.search(x,s,re.I) for x in checks), 'HTML_STRUCTURE_FAIL'
          assert s.lower().count('<script')==s.lower().count('</script>'), 'SCRIPT_BALANCE_FAIL'
          assert s.lower().count('<style')==s.lower().count('</style>'), 'STYLE_BALANCE_FAIL'
          assert 'window.RW_ShellContext' in s and 'window.RW_OwnerContract' in s, 'CONTRACTS_MISSING'
          assert 'rec-purchase' in s and 'rec-offers' in s, 'RECOMMENDATION_PARITY_MISSING'
          assert not re.search(r"\.from\(['\"]stock_branches['\"]\)[\s\S]{0,500}?\.(?:update|insert|upsert|delete)\(",s), 'DIRECT_STOCK_WRITER'
          assert not re.search(r"\.from\(['\"]inventory_log['\"]\)[\s\S]{0,500}?\.(?:update|insert|upsert|delete)\(",s), 'DIRECT_INVENTORY_LOG_WRITER'
          assert not re.search(r"\.from\(['\"]app_settings['\"]\)\.select\([^;]*?\)\.limit\(\s*1\s*\)",s,re.S), 'UNSCOPED_APP_SETTINGS'
          print('CURRENT_MAIN_FORENSIC_VERIFY_PASS')
          PY

      - name: Record-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-forensic-bot'
          git config user.email 'rawaea-forensic-bot@users.noreply.github.com'
          git add Current/CTO/FORENSIC_MAIN_ASSEMBLY_MANIFEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(cto): record main assembly forensic verification [no-deploy]'
          git push origin HEAD:main
