name: RAWAEA governed main assembly — EXECUTE AND VERIFY

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Current/PWA/main/**'
      - 'Current/PWA/main.html'
      - '.github/workflows/forensic_main_assembly.yml'

permissions:
  contents: write

jobs:
  forensic-assembly:
    if: ${{ !contains(github.event.head_commit.message, '[main-reconstruction-executed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reconcile source baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s Current/PWA/main.html
          test -s Original/PWA/main.html
          git rev-parse HEAD
          sha256sum Current/PWA/main.html

      - name: Execute governed clean-room reconstruction
        run: python3 tools/master_reconstruction_postprocess.py

      - name: Structural and contract gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          checks={
            'doctype':bool(re.search(r'<!doctype\\s+html',s,re.I)),
            'html_close':bool(re.search(r'</html>',s,re.I)),
            'head_close':bool(re.search(r'</head>',s,re.I)),
            'body_close':bool(re.search(r'</body>',s,re.I)),
            'script_balance':s.lower().count('<script')==s.lower().count('</script>'),
            'style_balance':s.lower().count('<style')==s.lower().count('</style>'),
            'shell': 'window.RW_ShellContext' in s and 'RW_ShellContext.getCompanyId()' in s,
            'owner': 'window.RW_OwnerContract' in s,
            'recommendations': 'rec-purchase' in s and 'rec-offers' in s,
            'no_direct_stock_writer':not re.search(r"\\.from\\(['\"]stock_branches['\"]\\)[\\s\\S]{0,500}?\\.(?:update|insert|upsert|delete)\\(",s),
            'no_direct_inventory_log_writer':not re.search(r"\\.from\\(['\"]inventory_log['\"]\\)[\\s\\S]{0,500}?\\.(?:update|insert|upsert|delete)\\(",s),
            'no_unscoped_app_settings':not re.search(r"\\.from\\(['\"]app_settings['\"]\\)\\.select\\([^;]*?\\)\\.limit\\(\\s*1\\s*\\)",s,re.S),
            'no_owner_fallback':"meta.permissions || ['*']" not in s,
          }
          if not all(checks.values()): raise SystemExit('STRUCTURAL_CONTRACT_FAIL '+json.dumps(checks,ensure_ascii=False))
          print('STRUCTURAL_CONTRACT_PASS',json.dumps(checks,ensure_ascii=False))
          PY
          git diff --check

      - name: Original feature symbol parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          def symbols(s):
              return {
                'functions':sorted(set(re.findall(r'(?<![\\w$])function\\s+([A-Za-z_$][\\w$]*)\\s*\\(',s))),
                'ids':sorted(set(re.findall(r'\\bid=["\']([^"\']+)["\']',s))),
                'rpcs':sorted(set(re.findall(r'\\.rpc\\(\\s*["\']([^"\']+)["\']',s))),
                'tables':sorted(set(re.findall(r'\\.from\\(\\s*["\']([^"\']+)["\']',s))),
                'edge_refs':sorted(set(re.findall(r'functions/v1/([A-Za-z0-9._-]+)',s))),
              }
          o=symbols(Path('Original/PWA/main.html').read_text(encoding='utf-8'))
          f=symbols(Path('Current/PWA/main.html').read_text(encoding='utf-8'))
          losses={k:sorted(set(o[k])-set(f[k])) for k in o}
          Path('Current/CTO/FORENSIC_MAIN_SYMBOL_PARITY.json').write_text(json.dumps({'losses':losses,'original_counts':{k:len(v) for k,v in o.items()},'final_counts':{k:len(v) for k,v in f.items()}},ensure_ascii=False,indent=2),encoding='utf-8')
          if any(losses.values()): raise SystemExit('ORIGINAL_SYMBOL_PARITY_FAIL '+json.dumps(losses,ensure_ascii=False))
          print('ORIGINAL_SYMBOL_PARITY_PASS')
          PY

      - name: Candidate browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rw-pwa; mkdir -p /tmp/rw-pwa
          cp -r Current/PWA/. /tmp/rw-pwa/
          python3 -m http.server 8123 --directory /tmp/rw-pwa >/tmp/rw-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
            await page.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const r=await page.evaluate(()=>({title:document.title,lang:document.documentElement.lang,body:!!document.body,rwState:!!window.RW_STATE,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract}));
            console.log(JSON.stringify({r,pageErrors}));
            if(r.lang!=='ar'||!r.body||!r.rwState||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||pageErrors.length)process.exit(2);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE

      - name: Persist reconstruction evidence and updated main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Current/CTO
          git config user.name 'rawaea-reconstruction-bot'
          git config user.email 'rawaea-reconstruction-bot@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          p=Path('Current/PWA/main.html')
          out={'event_type':'MAIN_HTML_RECONSTRUCTION_EXECUTED','utc':'2026-08-31','main_sha256':h(p),'bytes':p.stat().st_size,'source_seed':'Current/PWA/main.html before this run','executor':'tools/master_reconstruction_postprocess.py','candidate_model':'current-full-artifact semantic reconstruction; no historical fragment concatenation','browser_smoke':'PASS'}
          Path('Current/CTO/20260831_MAIN_HTML_RECONSTRUCTION_EXECUTION.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git add Current/PWA/main.html Current/CTO
          git diff --cached --quiet && { echo 'NO_EXECUTION_DELTA'; exit 1; }
          git commit -m '[main-reconstruction-executed] persist final reconstructed main.html and evidence'
          git push origin HEAD:main
