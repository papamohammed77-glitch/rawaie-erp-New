name: RAWAEA governed published main.html forensic gate

# Source of Truth is the published ERP frontend file.
# Historical Current/PWA/main2 fragments and New-main are reference/evidence only.
# This workflow MUST NOT reconstruct, overwrite, or generate the published main.html.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'doc/Draft/Reprots/**'
      - 'CURRENT_STATE.md'
      - '.github/workflows/forensic_main_assembly.yml'

permissions:
  contents: read

jobs:
  verify-published-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governance repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch published Source of Truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import hashlib
          url='https://raw.githubusercontent.com/papamohammed77-glitch/erp-frontend/main/companies/company-1/main.html'
          raw=urlopen(url,timeout=30).read()
          Path('/tmp/published-main.html').write_bytes(raw)
          text=raw.decode('utf-8')
          print('SOURCE_OF_TRUTH='+url)
          print('BYTES='+str(len(raw)))
          print('LINES='+str(len(text.splitlines())))
          print('SHA256='+hashlib.sha256(raw).hexdigest())
          print('EOF_LAST_3='+repr(text.splitlines()[-3:]))
          if text.splitlines()[-3:] != ['</script>','</body>','</html>']:
            raise SystemExit('PUBLISHED_MAIN_EOF_INVALID')
          PY

      - name: Full published HTML and JS syntax validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re
          raw=Path('/tmp/published-main.html').read_text(encoding='utf-8')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.starts=[]; self.ends=[]
            def handle_starttag(self,t,a): self.starts.append(t.lower())
            def handle_startendtag(self,t,a): self.starts.append(t.lower())
            def handle_endtag(self,t): self.ends.append(t.lower())
          p=P(); p.feed(raw); p.close(); sc=Counter(p.starts); ec=Counter(p.ends)
          for t in ['html','head','body','script']:
            print(t.upper()+'_OPEN/CLOSE='+str(sc[t])+'/'+str(ec[t]))
            if sc[t]!=ec[t]: raise SystemExit(t.upper()+'_TAG_BALANCE_INVALID')
          markers=[x for x in ['(قيد التطوير)','قيد التطوير','TODO','FIXME','Coming Soon'] if x in raw]
          print('INCOMPLETE_MARKERS='+repr(markers))
          if markers: raise SystemExit('INCOMPLETE_MARKERS_FOUND')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          js=[]
          for m in scripts:
            attrs=m.group('a') or ''
            if not re.search(r'\bsrc\s*=',attrs,re.I):
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              typ=(tm.group(1) if tm else '').lower()
              if typ in ('','text/javascript','application/javascript','application/ecmascript','text/ecmascript'):
                a=m.start(); b=m.end()-len('</script>'); js.append((a,b))
          positioned=[' ' if ch!='\n' else ch for ch in raw]
          for a,b in js:
            oe=raw.find('>',a)+1; positioned[oe:b]=list(raw[oe:b])
          Path('/tmp/published-main-positioned.js').write_text(''.join(positioned),encoding='utf-8')
          print('INLINE_JS_BLOCKS='+str(len(js)))
          if len(js)!=1: raise SystemExit('INLINE_JS_BLOCK_COUNT_INVALID')
          PY
          node --check /tmp/published-main-positioned.js
          echo NODE_CHECK=PASS

      - name: Governance assertions
        shell: bash
        run: |
          set -euo pipefail
          echo 'PUBLISHED_SOURCE_ONLY_GATE=PASS'
          echo 'NO_RECONSTRUCTION_PERFORMED=PASS'
