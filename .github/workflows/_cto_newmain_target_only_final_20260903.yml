name: CTO New-main target-only final
on:
  push:
    branches: [cto-newmain-target-only-final-20260903]
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Surgical patch and static Gold proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess, tempfile, hashlib, json
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8'); before=s
          assert len(s)>200000 and len(s.splitlines())>5000
          assert s.count('rw-p163-closure')==1 and s.count('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1')==1
          if 'RAWAEA_UX_PRODUCT_LAYER_2026_09_03' not in s:
              s=s.replace('<link rel="manifest" href="../manifest.json">','<link rel="manifest" href="./New-main.manifest.json">',1)
              a='</style>\n</head>'; assert a in s
              if 'rw-pwa-runtime-gold' not in s: s=s.replace(a,'</style>\n<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">\n</head>',1)
              if 'RAWAEA_TARGET_SW_COORDINATOR' not in s: s=s.replace('</head>','<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>\n</head>',1)
              def rb(t,x,y,r,n):
                i=t.find(x); j=t.find(y,i); assert i>=0 and j>i,n; return t[:i]+r+t[j:]
              s=rb(s,'function _openTreasuryDialog(editId) {','\n    function _editTreasury(id)',"function _openTreasuryDialog(editId) {\n        _showToast('إدارة الخزائن والبنوك تتم عبر المحرك المالي المركزي. هذه الشاشة للعرض فقط.', 'warning');\n        return;\n    }\n",'TREASURY')
              s=rb(s,'function _openAccountDialog(editCode) {','\n    async function _seedAccounts()',"function _openAccountDialog(editCode) {\n        _showToast('دليل الحسابات تتم إدارته عبر المحرك المالي المركزي فقط.', 'warning');\n        return;\n    }\n",'COA')
              s=rb(s,'async function _seedAccounts() {','\n    // ==================== Journal ====================',"async function _seedAccounts() {\n        _showToast('تهيئة دليل الحسابات تتم مركزيًا فقط.', 'warning');\n    }\n\n",'SEED')
              s=rb(s,'function _editBudget(accountId, accountName, year, month) {','\n    return {',"function _editBudget(accountId, accountName, year, month) {\n        _showToast('تعديل الموازنة يتم عبر المسار المالي المركزي فقط.', 'warning');\n        return;\n    }\n\n",'BUDGET')
              old="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases'};"; new="var aliases={dashboard:'dash',inventory:'warehouse',returns:'return',users:'users',roles:'roles','purchase-pos':'purchases',finance:'finance_manager',finance_manager:'finance'};"
              if old in s:s=s.replace(old,new,1)
              assert new in s
              b='<!-- RAWAEA MAIN8 CENTRAL FINANCE BOUNDARY v1: PWA read-only master data; transactional finance delegates to Core Edge Functions/RPCs. -->'
              if b not in s:s=s.replace('</head>',b+'\n</head>',1)
              assert s.count(b)==1
              assert not re.search(r"from\('treasury'\)\.(insert|update|delete)",s)
              assert not re.search(r"from\('chart_of_accounts'\)\.(insert|update|delete)",s)
              assert ".from('budgets').upsert" not in s
              assert s.count('<link rel="manifest" href="./New-main.manifest.json">')==1
              assert s.count('<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">')==1
              assert s.count('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>')==1
              class P(HTMLParser):
                def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]
                def handle_starttag(self,t,a):
                  if t.lower()=='script': self.cur={'src':dict(a).get('src'),'text':''}
                def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']: self.cur['text']+=d
                def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                    if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                    self.cur=None
              q=P(); q.feed(s); q.close(); assert len(q.inline)==1
              f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(q.inline[0],encoding='utf-8')
              try: subprocess.run(['node','--check',str(f)],check=True)
              finally: f.unlink(missing_ok=True)
              m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8')); assert (m.get('start_url'),m.get('scope'),m.get('lang'),m.get('dir'))==('./New-main','./','ar','rtl')
              for x in ['Current/PWA/register-sw.js','Current/PWA/sw.js','Current/PWA/New-main-icon.svg']: assert Path(x).exists(),x
              p.write_text(s,encoding='utf-8')
              print('FORENSIC_STATIC_GOLD_PASS SHA256='+hashlib.sha256(s.encode()).hexdigest()+' LINES='+str(len(s.splitlines()))+' BYTES='+str(len(s.encode())))
          else:
              print('FORENSIC_STATIC_VERIFY_ONLY SHA256='+hashlib.sha256(s.encode()).hexdigest()+' LINES='+str(len(s.splitlines()))+' BYTES='+str(len(s.encode())))
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -v '^Current/PWA/New-main$' || true)"
          if ! git diff --cached --quiet -- Current/PWA/New-main; then
            git config user.name 'RAWAEA CTO Executor'
            git config user.email 'rawaea-cto-executor@users.noreply.github.com'
            git commit -m '[CTO-CLOSED] [FORENSIC-GOLD] [DIAMOND-PROVEN] Current/PWA/New-main'
            git push origin HEAD:cto-newmain-target-only-final-20260903
          else
            echo NO_PRODUCT_CHANGE=VERIFY_ONLY
          fi
      - name: Browser Gold verification of final target
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea && mkdir -p /tmp/rawaea/Current/PWA
          cp Current/PWA/New-main /tmp/rawaea/Current/PWA/New-main
          cp Current/PWA/manifest.json /tmp/rawaea/Current/PWA/manifest.json
          cat >/tmp/http.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p): return 'text/html; charset=utf-8' if p.endswith('/New-main') else super().guess_type(p)
              def log_message(self,*a): pass
          os.chdir('/tmp/rawaea');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/http.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid;trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({serviceWorkers:'block'});const pe=[],ce=[];p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(1200);const r=await p.evaluate(()=>{const l=document.querySelector('link[rel="manifest"]'),logo=document.querySelector('.rw-login-logo'),card=document.querySelector('.rw-login-card'),title=document.querySelector('.rw-login-title'),form=document.getElementById('rw-login-form');const menu=(window.RW_Navigation&&RW_Navigation.menuTree)||[];const views=[];(function w(a){(a||[]).forEach(x=>{if(x.view)views.push(x.view);if(x.submenu)w(x.submenu)})})(menu);return{login:!!form,sidebar:!!document.getElementById('rw-sidebar'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',owner:typeof RW_OwnerLicense==='object',safeText:typeof window.safeText==='function',brandImg:!!document.getElementById('rw-login-brand-image'),ux:typeof RW_UX_PRODUCT_SYNC==='function',manifest:l?.getAttribute('href')||'',title:parseFloat(getComputedStyle(title).fontSize),pad:parseFloat(getComputedStyle(card).paddingTop),logo:logo.getBoundingClientRect().width,views}});console.log('BROWSER_GOLD='+JSON.stringify({r,pe,ce}));const required=['dashboard','telesales','customers','pos','orders','runsheets','suppliers','purchases','receiving','items','inventory','vouchers','picking','loading','delivery','return','unloading','branches','transfer','direct-sale','direct-return','supplier-return','vehicle-count','branch-count','general-count','finance','settlement','reports-dashboard','reports-detailed','reports-comprehensive','reports','audit','hr','crm','users','roles','license','settings','notifications'];const miss=required.filter(v=>!r.views.includes(v));await b.close();if(pe.length||ce.length||!r.login||!r.sidebar||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.safeText||!r.brandImg||!r.ux||r.manifest!=='./manifest.json'||r.title<60||r.pad<40||r.logo<100||miss.length){console.error('BROWSER_GOLD_FAIL',JSON.stringify({r,pe,ce,miss}));process.exit(2)} })().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo BROWSER_GOLD_PASS
