name: Vouchers Gold Master Surgical Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Apply surgical vouchers repair
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Current/PWA/vouchers.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* RAWAEA VOUCHERS GOLD MASTER 2026-08-20 */'
          if marker not in s:
              raise SystemExit('Expected Gold Master marker not found')

          # 1) Keep the existing implementation and add a non-destructive
          #    workspace collapse controller around the already-rendered head.
          anchor = "var oldBack=App.back;App.back=function(){oldBack.call(this);var l=document.getElementById('typeLabel');if(l)l.textContent='إذن جديد'};"
          if anchor not in s:
              raise SystemExit('Expected back wrapper anchor not found')

          s = s.replace(anchor, anchor + r'''
  var workspaceCollapsed=false;
  App.injectWorkspaceCollapseStyles=function(){
    if(document.getElementById('rw-vouchers-collapse-style'))return;
    var st=document.createElement('style');
    st.id='rw-vouchers-collapse-style';
    st.textContent=''' + "" + '''
      .workspace-head{position:relative;transition:max-height .24s ease,opacity .18s ease,padding .22s ease,transform .22s ease;max-height:620px;overflow:visible;}
      .workspace-head.is-collapsed{max-height:0!important;opacity:0;overflow:hidden;padding-top:0!important;padding-bottom:0!important;border-bottom:0!important;transform:translateY(-6px);}
      .workspace-collapse-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.10);color:#cbd5e1;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(148,163,184,.18);transition:.18s;}
      .workspace-collapse-btn:hover{background:rgba(255,255,255,.18);color:#fff;}
      .workspace-collapse-float{position:absolute;right:10px;top:10px;z-index:150;width:42px;height:42px;border-radius:14px;background:#1e293b;color:#fff;border:1px solid #475569;box-shadow:0 12px 28px rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;}
      .workspace-collapse-float.visible{display:flex;}
    ''';
    document.head.appendChild(st);
  };
  App.applyWorkspaceCollapsed=function(){
    var ws=document.querySelector('#mainContent .ws');
    if(!ws)return;
    var head=document.getElementById('workspaceHead');
    var floatBtn=document.getElementById('workspaceCollapseFloat');
    var inlineBtn=document.getElementById('workspaceCollapseBtn');
    if(!head||!floatBtn||!inlineBtn)return;
    head.classList.toggle('is-collapsed',workspaceCollapsed);
    inlineBtn.title=workspaceCollapsed?'فتح إعدادات الإذن':'ضم الجزء العلوي';
    inlineBtn.setAttribute('aria-label',inlineBtn.title);
    inlineBtn.innerHTML=workspaceCollapsed?'▾':'▴';
    floatBtn.classList.toggle('visible',workspaceCollapsed);
  };
  App.toggleWorkspaceHead=function(){
    workspaceCollapsed=!workspaceCollapsed;
    try{localStorage.setItem('RW_VOUCHER_WORKSPACE_COLLAPSED',workspaceCollapsed?'1':'0')}catch(e){}
    this.applyWorkspaceCollapsed();
  };
  var originalRenderWorkspace=App.renderWorkspace;
  App.renderWorkspace=function(){
    originalRenderWorkspace.call(this);
    this.injectWorkspaceCollapseStyles();
    var ws=document.querySelector('#mainContent .ws');
    if(!ws)return;
    ws.style.position='relative';
    var head=ws.firstElementChild;
    if(head){
      head.id='workspaceHead';
      head.classList.add('workspace-head');
      var titleRow=head.querySelector('.flex.items-center.gap-3');
      if(titleRow&&!document.getElementById('workspaceCollapseBtn')){
        var oldBackBtn=titleRow.querySelector('button');
        var btn=document.createElement('button');
        btn.type='button';
        btn.id='workspaceCollapseBtn';
        btn.className='workspace-collapse-btn';
        btn.onclick=function(){App.toggleWorkspaceHead()};
        if(oldBackBtn) titleRow.insertBefore(btn,oldBackBtn.nextSibling); else titleRow.prepend(btn);
      }
      if(!document.getElementById('workspaceCollapseFloat')){
        var f=document.createElement('button');
        f.type='button';
        f.id='workspaceCollapseFloat';
        f.className='workspace-collapse-float';
        f.title='فتح إعدادات الإذن';
        f.setAttribute('aria-label','فتح إعدادات الإذن');
        f.innerHTML='▾';
        f.onclick=function(){App.toggleWorkspaceHead()};
        ws.appendChild(f);
      }
    }
    this.applyWorkspaceCollapsed();
  };
  try{workspaceCollapsed=localStorage.getItem('RW_VOUCHER_WORKSPACE_COLLAPSED')==='1'}catch(e){workspaceCollapsed=false}
''')

          # 2) Replace the previous Gold Master IIFE with a clean, bounded override.
          start = s.index(marker)
          end = s.index('</script>', start)
          prefix = s[:start]
          suffix = s[end:]
          new_iife = r'''/* RAWAEA VOUCHERS GOLD MASTER 2026-08-20 */
(function(){
  var marker='GOLD-MASTER-2026-08-20';
  function safeId(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

  var originalLoadRefs=App.loadRefs;
  App.loadRefs=function(){
    var s=this;
    return originalLoadRefs.call(this).then(function(){
      var map={};
      (s.refs.vehicles||[]).forEach(function(v){
        var code='VAN-'+String(v.vehicle_code||'').trim().toUpperCase();
        var b=(s.refs.branches||[]).find(function(x){return String(x.branch_code||'').toUpperCase()===code});
        if(b)map[v.id]=b.id;
      });
      s.refs.vehicleBranchMap=map;
    });
  };

  App.avail=function(id){
    var e=document.getElementById('wsFrom');
    if(!e||!e.value)return null;
    var branch=e.value;
    if(this.type==='DirectReturn'&&(this.refs.vehicleBranchMap||{})[branch])branch=this.refs.vehicleBranchMap[branch];
    var k=branch+':'+id;
    return Object.prototype.hasOwnProperty.call(this.stock,k)?Number(this.stock[k]||0):0;
  };

  App.canAddQuantity=function(item,next){
    var av=this.avail(item.id);
    if(av===null)return true;
    if(this.type==='DirectReturn')return true;
    if(this.mode==='engine'&&this.type==='Adjustment'){
      var m=document.getElementById('wsMode');
      var mode=m?m.value:'replace';
      return mode!=='deduct'||next<=av;
    }
    if(this.mode==='engine'&&this.type==='Scrap')return next<=av;
    return next<=av;
  };

  App._refreshDetailPopup=function(code){
    var popup=Swal.getPopup();
    if(!popup)return;
    var span=popup.querySelector('#detailQtySpan');
    var cartItem=this.cart.find(function(c){return c.code===code});
    var qty=cartItem?Number(cartItem.qty):0;
    if(span)span.textContent=qty;
    if(qty===0){
      var controls=popup.querySelector('#detailQtyControls');
      if(controls)controls.outerHTML='<button onclick="App._addFromDetail(\\''+safeId(code)+'\\')" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold"><i class="fa-solid fa-cart-plus ml-1"></i> أضف للسلة</button>';
    }
  };

  App.itemDetails=function(id){
    var s=this,x=this.items.find(function(i){return i.id===id});
    if(!x)return;
    var av=this.avail(id);
    var inCart=this.cart.find(function(c){return c.id===id});
    var qty=inCart?Number(inCart.qty):0;
    var status=av===null?'اختر المصدر':av>10?'🟢 متوفر':av>0?'🟡 محدود ('+f(av)+')':'🔴 غير متاح';
    var canAdd=(av===null)||av>0||this.type==='DirectReturn'||(this.mode==='engine'&&this.type==='Adjustment'&&((document.getElementById('wsMode')||{}).value||'replace')!=='deduct');
    var html='<div class="text-right text-slate-100">'
      +'<div class="flex gap-4 items-start">'
      +'<div class="w-28 h-28 rounded-3xl bg-slate-800 overflow-hidden flex items-center justify-center shrink-0">'+(x.image_url?'<img src="'+s.esc(x.image_url)+'" class="w-full h-full object-cover">':'<i class="fa-solid fa-box text-4xl text-slate-500"></i>')+'</div>'
      +'<div class="flex-1 min-w-0"><h3 class="text-lg font-black text-white truncate">'+s.esc(x.name||x.item_code)+'</h3><p class="text-xs text-slate-400 mt-1">الكود: '+s.esc(x.item_code)+'</p><p class="text-xs text-slate-400">الباركود: '+s.esc(x.barcode||'—')+'</p><p class="text-xs text-slate-400">الوحدة: '+s.esc(x.unit||'حبة')+'</p></div>'
      +'</div>'
      +'<div class="grid grid-cols-2 gap-2 mt-4">'
      +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">سعر البيع</span><b class="block mt-1 text-white">'+f(x.sales_price||0)+'</b></div>'
      +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">التكلفة</span><b class="block mt-1 text-white">'+f(x.cost_price||0)+'</b></div>'
      +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">التصنيف</span><b class="block mt-1 text-white">'+s.esc(x.category||'أخرى')+'</b></div>'
      +'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-[10px] text-slate-400">المتاح</span><b class="block mt-1 text-white">'+(av===null?'اختر المصدر':f(av))+'</b></div>'
      +'</div>'
      +'<div class="flex items-center justify-between bg-slate-800 rounded-2xl p-4 mt-4 gap-3">'
      +'<span class="text-2xl font-black text-emerald-400 whitespace-nowrap">'+f(x.sales_price||x.cost_price||0)+'</span>'
      +(qty>0?'<div id="detailQtyControls" class="flex items-center gap-3"><button onclick="App._updateDetailQty(\\''+safeId(x.item_code)+'\\',-1)" class="w-10 h-10 rounded-full bg-slate-700 text-white font-black text-lg">−</button><span id="detailQtySpan" class="text-xl font-black text-white min-w-6 text-center">'+qty+'</span><button onclick="App._updateDetailQty(\\''+safeId(x.item_code)+'\\',1)" class="w-10 h-10 rounded-full bg-blue-600 text-white font-black text-lg">+</button></div>'
      :(canAdd?'<button onclick="App._addFromDetail(\\''+safeId(x.item_code)+'\\')" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold"><i class="fa-solid fa-cart-plus ml-1"></i> أضف للسلة</button>':'<span class="text-xs text-slate-500 font-bold">لا توجد كمية متاحة</span>'))
      +'</div><div class="text-xs text-slate-400 mt-2">الحالة: <b class="text-slate-200">'+status+'</b></div>'
      +'</div>';
    Swal.fire({html:html,width:520,showCloseButton:true,showConfirmButton:false,customClass:{popup:'!bg-slate-900 !rounded-3xl !border !border-slate-700',closeButton:'!text-slate-400'}});
  };

  App._addFromDetail=function(code){
    this.add(code);
    this._refreshDetailPopup(code);
  };

  App._updateDetailQty=function(code,delta){
    var idx=this.cart.findIndex(function(c){return c.code===code});
    if(delta>0){
      this.add(code);
    }else if(idx>=0){
      this.dec(idx);
    }
    this._refreshDetailPopup(code);
  };

  App.renderProducts=function(){
    var s=this,q=(document.getElementById('wsSearch')||{}).value||'',z=this.norm(q);
    var a=this.items.filter(function(x){
      if(s.cat!=='الكل'&&(x.category||'أخرى')!==s.cat)return false;
      if(!z)return true;
      var n=s.norm(x.name),c=s.norm(x.item_code),b=s.norm(x.barcode),l=s.norm(x.search_label);
      return c===z||b===z||c.indexOf(z)===0||b.indexOf(z)===0||n.indexOf(z)>=0||l.indexOf(z)>=0;
    }).sort(function(a,b){
      if(!z)return String(a.name||'').localeCompare(String(b.name||''),'ar');
      function score(x){
        var c=s.norm(x.item_code),br=s.norm(x.barcode),n=s.norm(x.name),l=s.norm(x.search_label);
        return c===z?150:br===z?145:c.indexOf(z)===0?120:br.indexOf(z)===0?115:n.indexOf(z)>=0?75:l.indexOf(z)>=0?55:0;
      }
      return score(b)-score(a)||String(a.name||'').localeCompare(String(b.name||''),'ar');
    }).slice(0,120);
    RW_UI.safeText(RW_UI.byId('count'),a.length?' · '+a.length:'');
    var h=a.map(function(x){
      var av=s.avail(x.id),inCart=(s.cart.find(function(c){return c.id===x.id})||{}).qty||0;
      var disabled=av!==null&&av<=0&&!(s.mode==='engine'&&s.type==='Adjustment')&&s.type!=='DirectReturn';
      return '<div class="product-card '+(disabled?'opacity-60':'')+'">'
        +'<button type="button" class="w-full text-right" onclick="App.itemDetails(\\''+safeId(x.id)+'\\')" title="عرض تفاصيل الصنف">'
        +'<div class="product-img mb-2">'+(x.image_url?'<img src="'+s.esc(x.image_url)+'" loading="lazy">':'<i class="fa-solid fa-box text-2xl text-slate-600"></i>')+'</div>'
        +'<div class="flex justify-between gap-2"><div class="min-w-0"><b class="text-xs truncate block">'+s.esc(x.name||x.item_code)+'</b><span class="text-[10px] text-slate-500">'+s.esc(x.item_code)+' · '+s.esc(x.unit||'حبة')+'</span></div><span class="text-[9px] text-slate-400">'+(av===null?'اختر المصدر':av>0?'متاح '+f(av):'غير متاح')+'</span></div>'
        +'</button><div class="flex justify-between mt-2"><span class="text-[11px] text-emerald-400 font-black">'+f(x.sales_price||x.cost_price||0)+'</span>'
        +'<button type="button" '+(disabled?'disabled':'')+' onclick="event.stopPropagation();App.add(\\''+safeId(x.item_code)+'\\')" class="w-9 h-9 rounded-full '+(!disabled?'bg-blue-600 hover:bg-blue-500':'bg-slate-700')+' flex items-center justify-center" title="إضافة">'+(inCart||'<i class="fa-solid fa-plus text-xs"></i>')+'</button></div></div>';
    }).join('');
    RW_UI.safeHTML(RW_UI.byId('products'),h||'<div class="col-span-full text-center text-slate-500 py-14">🔍 لا توجد نتائج</div>');
  };

  App.add=function(code){
    var s=this,x=this.items.find(function(i){return i.item_code===code});
    if(!x)return;
    var ex=this.cart.find(function(c){return c.id===x.id}),next=(ex?ex.qty:0)+1;
    if(!this.canAddQuantity(x,next)){RW_UI.toast('الكمية المتاحة في المصدر: '+f(this.avail(x.id)),'warning');return}
    if(ex)ex.qty=next;else this.cart.push({id:x.id,code:x.item_code,name:x.name||x.item_code,unit:x.unit||'حبة',qty:1,price:Number(x.sales_price||x.cost_price||0)});
    this.renderCart();this.renderProducts();this.updateResults();
  };

  App.inc=function(i){
    var x=this.cart[i];if(!x)return;var m=this.items.find(function(a){return a.id===x.id});if(!m)return;
    if(!this.canAddQuantity(m,x.qty+1)){RW_UI.toast('الكمية تتجاوز المتاح في المصدر','warning');return}
    x.qty++;this.renderCart();this.renderProducts();this.updateResults();
  };

  App.choose=function(t){this.type=t;this.mode=(t==='Scrap'||t==='Adjustment')?'engine':'voucher';this.toggleMenu();this.newWorkspace()};

  console.info('[VOUCHERS] '+marker+' loaded');
})();
'''
          s = prefix + new_iife + suffix

          p.write_text(s, encoding='utf-8')
          print('patched', p, 'bytes=', p.stat().st_size)

      - name: Verify JavaScript and invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/vouchers.html')
          s=p.read_text(encoding='utf-8')
          assert "marker='GOLD-MASTER-2026-08-20'" in s
          assert "console.info('[VOUCHERS] '+marker+' loaded');" in s
          assert "workspaceCollapseBtn" in s and "workspaceCollapseFloat" in s
          assert "App.toggleWorkspaceHead=function" in s
          assert "App.itemDetails=function" in s and "App._addFromDetail=function" in s and "App._updateDetailQty=function" in s
          assert "event.stopPropagation();App.add" in s
          assert not re.search(r"supabase\.from\(['\"]stock_branches['\"]\)\.(update|insert|upsert|delete)", s)
          assert not re.search(r"supabase\.from\(['\"]inventory_log['\"]\)\.(update|insert|upsert|delete)", s)
          # Catch the exact old broken symbol usage.
          assert "'+marker+' loaded'" in s
          assert "'+marker+' loaded');" in s
          print('static invariants: PASS')
          inline=[]
          for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I):
              body=m.group(1)
              if body.strip(): inline.append(body)
          Path('/tmp/vouchers.inline.js').write_text('\n\n'.join(inline),encoding='utf-8')
          print('inline script bytes:', Path('/tmp/vouchers.inline.js').stat().st_size)
          PY
          node --check /tmp/vouchers.inline.js
          echo 'node syntax: PASS'

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/vouchers_gold_master_surgical_fix.yml
          git add Current/PWA/vouchers.html .github/workflows/vouchers_gold_master_surgical_fix.yml
          git commit -m 'fix(vouchers): forensic Gold Master UI closure'
          git push origin main
