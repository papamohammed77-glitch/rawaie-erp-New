name: CTO single-parent embed legacy modules
on:
  push:
    branches: [cto-single-parent-embed-20260903]
permissions:
  contents: write
concurrency:
  group: cto-single-parent-embed-20260903
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build embedded module registry and patch New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re, hashlib
          target=Path('Current/PWA/New-main')
          s=target.read_text(encoding='utf-8')
          assert len(s.encode())>500000,'TARGET_TOO_SMALL'
          # Parent branding nodes.
          s=s.replace('<div class="rw-login-logo">ر</div><div class="rw-company-name">الروائع ERP</div><div class="rw-company-description">Clean-room MAIN1 contract surface</div>', '<div id="rw-login-company-logo" class="rw-login-logo" aria-label="شعار الشركة">ر</div><div id="rw-login-company-name" class="rw-company-name">الروائع ERP</div><div class="rw-company-description">نظام إدارة الأعمال المتكامل</div>', 1)
          s=s.replace('await window.RW_Auth.enterSystem();','await window.RW_Auth.enterSystem(authUser);',1)
          # Eliminate old parent registry with sibling URLs.
          pat_parent=re.compile(r"window\.RW_ParentRegistry=\{version:'1\.0',[\s\S]*?\};",re.M)
          parent="window.RW_ParentRegistry={version:'2.0',tenantAuthority:'RW_ShellContext.getCompanyId()',ownerAuthority:'owner_profile',permissionAuthority:'RW_Permissions_check',apps:{pos:'pos',telesales:'telesales',buyer:'purchases',vouchers:'vouchers',picker:'picking',loader:'loading',driver:'delivery',returns:'returns',unloader:'unloading'},launch:function(key){var v=this.apps[key];if(!v)throw new Error('UNKNOWN_PARENT_APP:'+key);return window.RW_Navigation.navigate(v);}};"
          s,n=pat_parent.subn(parent,s,count=1)
          if n==0 and "version:'2.0'" not in s:
              i=s.rfind('</body>'); assert i>=0; s=s[:i]+parent+'\n'+s[i:]
          # Replace delegated and main1 delegation with internal embedded launcher; the actual module bodies are stored below.
          pat_del=re.compile(r"function delegated\(title,links,description\)\{[\s\S]*?\}\nasync function renderDashboard",re.M)
          replacement="function delegated(title,links,description){setHeader(title,'الوحدة تعمل داخل القلب المركزي الموحد');var box=byId('rw-page-container');if(!box)return;safeHTML(box,'');if(window.RW_EmbeddedApps&&window.RW_EmbeddedApps.render){return window.RW_EmbeddedApps.render(RW_STATE.app.currentView,box,title,description); }safeHTML(box,'<div class=\"rw-card\"><h2>'+esc(title)+'</h2><p class=\"rw-muted\">تعذر تحميل الوحدة المضمنة.</p></div>');}\nasync function renderDashboard"
          s,n=pat_del.subn(replacement,s,count=1); assert n==1,'DELEGATED_NOT_FOUND'
          pat_main=re.compile(r"function main1Delegation\(view\)\{[\s\S]*?\}\nvar actions=",re.M)
          replacement_main="function main1Delegation(view){if(window.RW_EmbeddedApps&&window.RW_EmbeddedApps.render)return window.RW_EmbeddedApps.render(view,byId('rw-page-container'),'الوحدة المتخصصة','وحدة أصلية مدمجة داخل New-main');throw new Error('RW_EMBEDDED_APPS_UNAVAILABLE')}\nvar actions="
          s,n=pat_main.subn(replacement_main,s,count=1); assert n==1,'MAIN1_DELEGATION_NOT_FOUND'
          # Remove old inline navigation implementation's external href if present.
          assert './pos.html' not in s and './telesales.html' not in s and './buyer.html' not in s and './vouchers.html' not in s and './picker.html' not in s and './loader.html' not in s and './driver.html' not in s and './Returns.html' not in s and './unloader.html' not in s
          # Add a compact, source-driven company branding bridge at the end.
          if 'RAWAEA_CANONICAL_COMPANY_BRANDING_V2' not in s:
              brand=r'''<script id="RAWAEA_CANONICAL_COMPANY_BRANDING_V2">(function(){'use strict';function apply(b){b=b||{};var n=String(b.company_name||b.name||'الروائع ERP').trim()||'الروائع ERP',l=String(b.company_logo||b.logo_url||'').trim(),a=document.getElementById('rw-login-company-name'),i=document.getElementById('rw-login-company-logo'),sn=document.getElementById('rw-sidebar-company-name'),si=document.getElementById('rw-sidebar-brand-logo');if(a)a.textContent=n;if(sn)sn.textContent=n;if(i){i.textContent=l?'':'ر';i.style.backgroundImage=l?'url('+JSON.stringify(l)+')':'';i.style.backgroundSize=l?'contain':'';i.style.backgroundRepeat=l?'no-repeat':'';i.style.backgroundPosition=l?'center':'';i.setAttribute('data-branded',l?'1':'0')}if(si){if(l)si.src=l;else si.removeAttribute('src')}}window.RW_ApplyCanonicalCompanyBranding=apply;function sync(){try{var c=window.RW_STATE&&window.RW_STATE.app&&window.RW_STATE.app.company;if(c)apply({name:c.name,logo_url:c.logo})}catch(e){}}function wrap(){try{var a=window.RW_Auth;if(!a||typeof a.enterSystem!=='function'||a.enterSystem.__rwCanonicalBrandingWrapped)return;var o=a.enterSystem;a.enterSystem=async function(u){var r=await o.call(this,u);sync();return r};a.enterSystem.__rwCanonicalBrandingWrapped=true}catch(e){console.warn('RW_BRANDING_WRAP',e)}}function ready(){wrap();sync()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready,{once:true});else ready();setTimeout(function(){wrap();sync()},0)})();</script>'''
              i=s.rfind('</body>'); assert i>=0; s=s[:i]+brand+'\n'+s[i:]
          # Embed the original legacy applications and their local JS/CSS dependencies in-memory.
          apps={'pos':'Current/PWA/pos.html','telesales':'Current/PWA/telesales.html','purchases':'Current/PWA/buyer.html','receiving':'Current/PWA/buyer.html','vouchers':'Current/PWA/vouchers.html','picking':'Current/PWA/picker.html','loading':'Current/PWA/loader.html','delivery':'Current/PWA/driver.html','returns':'Current/PWA/Returns.html','unloading':'Current/PWA/unloader.html'}
          route_names={'pos':'pos','telesales':'telesales','purchases':'purchases','receiving':'receiving','vouchers':'vouchers','picking':'picking','loading':'loading','delivery':'delivery','returns':'returns','unloading':'unloading'}
          def inline_locals(html, base):
              # Inline local JS and CSS transitively so runtime no longer requires sibling assets.
              changed=True; guard=0
              while changed and guard<10:
                  changed=False; guard+=1
                  def sj(m):
                      nonlocal changed
                      src=m.group(1); q=(base/src).resolve()
                      if not q.exists() or q.suffix.lower()!='.js': return m.group(0)
                      code=q.read_text(encoding='utf-8')
                      changed=True
                      return '<script>'+code+'</script>'
                  html,n=re.subn(r'<script\s+[^>]*src=["\']([^"\']+)["\'][^>]*>\s*</script>',sj,html,flags=re.I)
                  def cs(m):
                      nonlocal changed
                      href=m.group(1); q=(base/href).resolve()
                      if not q.exists() or q.suffix.lower()!='.css': return m.group(0)
                      code=q.read_text(encoding='utf-8')
                      changed=True
                      return '<style>'+code+'</style>'
                  html,n2=re.subn(r'<link\s+[^>]*rel=["\']stylesheet["\'][^>]*href=["\']([^"\']+)["\'][^>]*>',cs,html,flags=re.I)
              # Route known sibling HTML navigations back through the parent router.
              mapping={'pos.html':'pos','telesales.html':'telesales','buyer.html':'purchases','vouchers.html':'vouchers','picker.html':'picking','loader.html':'loading','driver.html':'delivery','Returns.html':'returns','unloader.html':'unloading'}
              for fn,view in mapping.items():
                  html=re.sub(r'''(?:window\.)?location\.href\s*=\s*['\"][^'\"]*'''+re.escape(fn)+r'''['\"]''', f"parent.RW_ParentRegistry.launch('{view}')", html)
                  html=re.sub(r'''(?:window\.)?location\.assign\(\s*['\"][^'\"]*'''+re.escape(fn)+r'''['\"]\s*\)''', f"parent.RW_ParentRegistry.launch('{view}')", html)
                  html=html.replace('href="./'+fn+'"', 'href="#" data-rw-parent-view="'+view+'"')
                  html=html.replace("href='./"+fn+"'", 'href="#" data-rw-parent-view="'+view+'"')
              bridge=r'''<script>(function(){document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('[data-rw-parent-view]'):null;if(a){e.preventDefault();try{parent.RW_ParentRegistry.launch(a.getAttribute('data-rw-parent-view'))}catch(x){}}},true);try{window.RW_PARENT_CONTEXT=parent.RW_ShellContext;window.RW_PARENT_CLIENT=parent.RW_SUPABASE_CLIENT}catch(e){}})();</script>'''
              html=html.replace('</body>',bridge+'</body>') if '</body>' in html else html+bridge
              return html
          payload={}
          for view,path in apps.items():
              q=Path(path); assert q.exists(),path
              html=inline_locals(q.read_text(encoding='utf-8'),q.parent)
              # Remove module manifest, since parent manifest is canonical.
              html=re.sub(r'<link\s+[^>]*rel=["\']manifest["\'][^>]*>','',html,flags=re.I)
              payload[view]=base64.b64encode(html.encode('utf-8')).decode('ascii')
          registry={"version":"1.0","encoding":"base64","modules":payload}
          script="""<script id=\"RAWAEA_EMBEDDED_APPS_V1\">(function(){'use strict';var R=%s;function dec(b){try{return decodeURIComponent(escape(atob(b)))}catch(e){var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}}function render(view,box,title,description){var b=R.modules[view];if(!b){safeHTML(box,'<div class=\\\"rw-card\\\"><h2>'+esc(title||'الوحدة')+'</h2><p class=\\\"rw-muted\\\">لا يوجد محتوى مضمن لهذه الوحدة.</p></div>');return}safeHTML(box,'');var frame=document.createElement('iframe');frame.className='rw-embedded-app-frame';frame.title=title||view;frame.style.cssText='width:100%%;min-height:calc(100vh - 150px);border:1px solid #e5e7eb;border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.06);display:block';box.appendChild(frame);frame.srcdoc=dec(b);return frame}window.RW_EmbeddedApps={version:R.version,render:render,has:function(v){return !!(R.modules&&R.modules[v])}};})();</script>"""%%json.dumps(registry,ensure_ascii=False,separators=(',',':'))
          marker='RAWAEA_EMBEDDED_APPS_V1'
          if marker in s:
              # Avoid duplicate registry; replace existing block.
              s=re.sub(r'<script id="RAWAEA_EMBEDDED_APPS_V1">[\s\S]*?</script>',script,s,count=1)
          else:
              i=s.rfind('</body>');assert i>=0;s=s[:i]+script+'\n'+s[i:]
          # Add route aliases for all embedded views after actions is declared.
          alias=r'''<script id="RAWAEA_EMBEDDED_ROUTE_ALIASES_V1">(function(){function bind(){try{var a=window.RW_Views&&window.RW_Views.actions;if(!a||!window.RW_EmbeddedApps)return;['pos','telesales','purchases','receiving','vouchers','picking','loading','delivery','returns','unloading'].forEach(function(v){a[v]=function(){var b=byId('rw-page-container');return window.RW_EmbeddedApps.render(v,b,v,'');}});}catch(e){console.warn('RW_EMBEDDED_ROUTE_ALIASES',e)}}setTimeout(bind,0);setTimeout(bind,50);})();</script>'''
          if 'RAWAEA_EMBEDDED_ROUTE_ALIASES_V1' not in s:
              i=s.rfind('</body>');assert i>=0;s=s[:i]+alias+'\n'+s[i:]
          target.write_text(s,encoding='utf-8')
          print('TARGET_BYTES='+str(len(s.encode())))
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('EMBEDDED_MODULES='+','.join(payload.keys()))
          PY
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'))
          assert (m['start_url'],m['scope'],m['display'],m['dir'],m['lang'])==('./New-main','./','standalone','rtl','ar')
          print('STATIC_MANIFEST=PASS')
          PY
      - name: Browser final gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,path):
                  if path.rstrip('/').endswith('/New-main'): return 'text/html; charset=utf-8'
                  return super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',4173),H).serve_forever()
          PY
          (cd Current/PWA && python3 /tmp/server.py >/tmp/http.log 2>&1)& pid=$!;trap 'kill "$pid" 2>/dev/null || true' EXIT;sleep 2
          node <<'NODE'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const views=['pos','telesales','purchases','receiving','vouchers','picking','loading','delivery','returns','unloading'];
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']});const p=await b.newPage({serviceWorkers:'block'});const errors=[];await p.route('**/*',async r=>{const u=r.request().url();if(u.endsWith('/register-sw.js')||u.endsWith('/sw.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'/* bypass */'});if(u.includes('cdn.jsdelivr.net/npm/@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),getUser:async()=>({data:{user:null},error:new Error('stub')}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({}),resetPasswordForEmail:async()=>({})},from:()=>({select(){return this},eq(){return this},in(){return this},or(){return this},order(){return this},limit(){return this},maybeSingle:async()=>({data:null,error:null}),then:r=>Promise.resolve({data:[],error:null,count:0})})})};`});if(u.includes('chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){}};'});if(u.includes('sheetjs'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});return r.continue()});p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(700);const base=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const m=await (await fetch(l.href)).json();return{login:!!document.getElementById('rw-login-form'),brandName:!!document.getElementById('rw-login-company-name'),brandLogo:!!document.getElementById('rw-login-company-logo'),sidebar:!!document.getElementById('rw-sidebar'),nav:!!document.getElementById('rw-sidebar-nav'),auth:!!window.RW_Auth,navigation:!!window.RW_Navigation,embedded:!!window.RW_EmbeddedApps,parent:!!window.RW_ParentRegistry,from:typeof window.supabase?.from==='function',href:l?.getAttribute('href')||'',start:m.start_url,scope:m.scope,display:m.display,dir:m.dir,lang:m.lang};});const menu=await p.evaluate(()=>{RW_STATE.app.currentUser={id:'owner',isOwner:true,permissions:['*'],name:'Owner',role:'owner'};RW_STATE.permissions=['*'];window.RW_Permissions_check=()=>true;RW_Navigation.buildSidebar();return Array.from(document.querySelectorAll('#rw-sidebar-nav [data-view]')).map(x=>x.getAttribute('data-view')).filter(Boolean)});const embedded=await p.evaluate(async vs=>{const o={};for(const v of vs){try{RW_STATE.app.currentUser={id:'owner',isOwner:true,permissions:['*'],name:'Owner',role:'owner'};RW_STATE.permissions=['*'];await RW_Navigation.navigate(v);await new Promise(r=>setTimeout(r,50));const f=document.querySelector('#rw-page-container iframe');o[v]={ok:!!f,srcdoc:!!f?.srcdoc,bytes:f?.srcdoc?.length||0};}catch(e){o[v]={ok:false,error:String(e.message||e)}}}return o;},views);console.log('CTO_EMBEDDED_FINAL='+JSON.stringify({base,menu,embedded,errors}));const ok=!errors.length&&base.login&&base.brandName&&base.brandLogo&&base.sidebar&&base.nav&&base.auth&&base.navigation&&base.embedded&&base.parent&&base.from&&base.href==='manifest.json'&&base.start==='./New-main'&&base.scope==='.'+'/'&&base.display==='standalone'&&base.dir==='rtl'&&base.lang==='ar'&&menu.length>20&&views.every(v=>embedded[v]&&embedded[v].ok&&embedded[v].bytes>1000);await b.close();if(!ok)process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo BROWSER_EMBEDDED_GOLD=PASS
      - name: Publish only New-main and clean temporary workflow on target branch
        shell: bash
        run: |
          set -euo pipefail
          cp Current/PWA/New-main /tmp/New-main.final
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git merge-base origin/main HEAD)"
          git checkout -B final-publish origin/main
          cp /tmp/New-main.final Current/PWA/New-main
          git rm -q .github/workflows/cto-single-parent-embed-20260903.yml
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only | tr '\n' ' ')" = 'Current/PWA/New-main '
          git config user.name 'RAWAEA CTO Final Closure'
          git config user.email 'rawaea-cto-final@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main single-parent embedded legacy modules'
          git push origin HEAD:main
