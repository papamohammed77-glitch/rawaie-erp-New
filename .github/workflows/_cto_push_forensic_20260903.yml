name: CTO Push Forensic 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  forensic:
    if: github.event.head_commit.message != 'chore(cto): remove one-off forensic push workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Reconstruct and diagnose
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund esprima@4.0.1 >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib
          root=Path('Current/PWA/main'); parts=[root/f'main{i}.md' for i in range(1,12)]
          p1=parts[0].read_text(encoding='utf-8-sig')
          opens=list(re.finditer(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>',p1,re.I)); assert opens, 'MAIN1_SCRIPT_OPEN_MISSING'
          app=p1[opens[-1].end():]; cut=app.rfind('</script>'); app=app[:cut] if cut>=0 else app
          app=re.sub(r'(?m)^\\s*<!--\\s*RAWAEA_P1_FORENSIC_CLOSED:[^>]*-->\\s*$','',app,flags=re.I)
          chunks=[app.rstrip()]
          for i in range(2,12):
              s=parts[i-1].read_text(encoding='utf-8-sig').rstrip()
              if i==7 and s.count(".join(''));}")==1: s=s.replace(".join(''));}",".join('')));}",1)
              chunks.append(s)
          for i in range(2,12):
              js='\\n\\n'.join(chunks[:i])+'\\n})();\\n'; p=Path(f'/tmp/boundary{i}.js');p.write_text(js,encoding='utf-8');r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              print(f'BOUNDARY_{i}', 'PASS' if r.returncode==0 else 'FAIL');
              if r.returncode: print(r.stderr.strip().splitlines()[-3:])
          final='\\n\\n'.join(chunks)+'\\n})();\\n';fp=Path('/tmp/final.js');fp.write_text(final,encoding='utf-8');r=subprocess.run(['node','--check',str(fp)],capture_output=True,text=True)
          print('FINAL', 'PASS' if r.returncode==0 else 'FAIL', 'sha256',hashlib.sha256(final.encode()).hexdigest(),'bytes',len(final.encode()))
          if r.returncode:
              print(r.stderr)
              js="const fs=require('fs'),esprima=require('esprima');const src=fs.readFileSync('/tmp/final.js','utf8');const toks=esprima.tokenize(src,{loc:true,range:true,comment:true,tolerant:true});const st=[];const C={')':'(',']':'[','}':'{'};for(const t of toks){if(t.type!=='Punctuator')continue;const v=t.value;if(v==='('||v==='['||v==='{')st.push({v,line:t.loc.start.line,col:t.loc.start.column+1,range:t.range});else if(v===')'||v===']'||v==='}'){if(!st.length||st[st.length-1].v!==C[v]){console.log('MISMATCH',v,t.loc.start,st.slice(-20));break;}st.pop();}}console.log('UNRESOLVED',st.slice(-50));"
              Path('/tmp/e.js').write_text(js,encoding='utf-8');subprocess.run(['node','/tmp/e.js'],check=False);raise SystemExit(1)
          PY
