name: CTO Push Forensic 2026-09-03
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  forensic:
    if: github.event.head_commit.message == '[CTO-EXECUTE] Existing workflow target closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Execute target-only final closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,tempfile
          from html.parser import HTMLParser
          p=Path('Current/PWA/New-main');s=p.read_text(encoding='utf-8')
          assert len(s.splitlines())>5000
          old='<link rel="manifest" href="./New-main.manifest.json">';new='<link rel="manifest" href="./manifest.json">'
          if old in s: assert s.count(old)==1;s=s.replace(old,new,1)
          assert s.count(new)==1
          marker="byId('rw-login-form').addEventListener('submit',function(e){";start=s.find(marker)
          if start>=0:
              end=s.find("});byId('rw-logout-btn')",start);assert end>start;s=s[:start]+s[end+3:]
          assert marker not in s and s.count("loginForm.addEventListener('submit'")==1
          assert s.count('function safeText')==1 and 'window.safeText=safeText' in s
          m=json.loads(Path('Current/PWA/manifest.json').read_text(encoding='utf-8'));assert m['start_url']=='./New-main' and m['scope']=='./' and m['display']=='standalone' and m['dir']=='rtl' and m['lang']=='ar'
          class P(HTMLParser):
              def __init__(self):super().__init__(convert_charrefs=False);self.ins=False;self.src=None;self.buf='';self.blocks=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script':self.ins=True;self.src=dict(a).get('src');self.buf=''
              def handle_data(self,d):
                  if self.ins:self.buf+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:
                      if not self.src and self.buf.strip():self.blocks.append(self.buf)
                      self.ins=False;self.src=None;self.buf=''
          q=P();q.feed(s);q.close();assert q.blocks
          for code in q.blocks:
              f=Path(tempfile.mkstemp(suffix='.js')[1]);f.write_text(code,encoding='utf-8')
              try:subprocess.run(['node','--check',str(f)],check=True)
              finally:f.unlink(missing_ok=True)
          p.write_text(s,encoding='utf-8');print('STATIC_GOLD_PASS')
          PY
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/site;mkdir -p /tmp/site/Current;cp -a Current/. /tmp/site/Current
          cat >/tmp/server.py <<'PY'
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          import os
          class H(SimpleHTTPRequestHandler):
              def guess_type(self,p):
                  if p.endswith('/New-main'):return 'text/html; charset=utf-8'
                  return super().guess_type(p)
          os.chdir('/tmp/site');ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          python3 /tmp/server.py >/tmp/http.log 2>&1 & echo $! >/tmp/pid;trap 'kill $(cat /tmp/pid) 2>/dev/null || true' EXIT
          node <<'NODE'
          const{chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage(),pe=[],ce=[];
          await p.route('**/*',async r=>{const u=r.request().url();if(u.includes('cdn.jsdelivr.net/npm/@supabase/'))return r.fulfill({status:200,contentType:'application/javascript',body:`window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signInWithPassword:async()=>({error:new Error('stub')}),signOut:async()=>({}),resetPasswordForEmail:async()=>({})},from:()=>({select(){return this},eq(){return this},maybeSingle:async()=>({data:null,error:null}),then:()=>Promise.resolve({data:[],error:null})})})};`});if(u.includes('cdn.jsdelivr.net/npm/chart.js'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Chart=function(){};'});if(u.includes('cdn.jsdelivr.net/npm/sweetalert2'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.Swal={fire:async()=>({}),close(){}};'});if(u.includes('cdn.sheetjs.com'))return r.fulfill({status:200,contentType:'application/javascript',body:'window.XLSX={};'});return r.continue()});
          await p.addInitScript(()=>{window.__bindings=0;const a=EventTarget.prototype.addEventListener;EventTarget.prototype.addEventListener=function(t){if(t==='submit'&&this.id==='rw-login-form')window.__bindings++;return a.apply(this,arguments)}});p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(700);
          const r=await p.evaluate(async()=>{const l=document.querySelector('link[rel="manifest"]');const m=await(await fetch(l.href)).json();return{login:!!document.getElementById('rw-login-form'),sidebar:!!document.getElementById('rw-sidebar'),nav:!!document.getElementById('rw-sidebar-nav'),shell:!!document.getElementById('rw-main-shell'),auth:!!window.RW_Auth,navigation:!!window.RW_Navigation,views:!!window.RW_Views,safeText:typeof window.safeText==='function',bindings:window.__bindings||0,manifestHref:l?.getAttribute('href')||'',manifestPath:new URL(l?.getAttribute('href')||'',location.href).pathname,start:m.start_url,scope:m.scope,dir:m.dir,lang:m.lang}});console.log('NEWMAIN_BROWSER_GATE='+JSON.stringify({r,pe,ce}));await b.close();if(pe.length||ce.length||!r.login||!r.sidebar||!r.nav||!r.shell||!r.auth||!r.navigation||!r.views||!r.safeText||r.bindings!==1||r.manifestHref!=='./manifest.json'||r.manifestPath!=='/Current/PWA/manifest.json'||r.start!=='./New-main'||r.scope!=='./'||r.dir!=='rtl'||r.lang!=='ar')process.exit(2)})().catch(e=>{console.error(e.stack||e);process.exit(2)})
          NODE
          echo BROWSER_GOLD_PASS
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/_cto_push_forensic_20260903.yml').write_text('''name: CTO Push Forensic 2026-09-03\non:\n  push:\n    branches: [main]\npermissions:\n  contents: read\njobs:\n  forensic:\n    if: github.event.head_commit.message != 'chore(cto): remove one-off forensic push workflow'\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: main\n          fetch-depth: 1\n      - name: Reconstruct and diagnose\n        shell: bash\n        run: |\n          set -euo pipefail\n          npm init -y >/dev/null 2>&1\n          npm install --no-audit --no-fund esprima@4.0.1 >/dev/null 2>&1\n          python3 - <<\'PY2\'\n          from pathlib import Path\n          import re, subprocess, hashlib\n          root=Path(\'Current/PWA/main\'); parts=[root/f\'main{i}.md\' for i in range(1,12)]\n          p1=parts[0].read_text(encoding=\'utf-8-sig\')\n          opens=list(re.finditer(r\'<script(?![^>]*\\\\bsrc\\\\s*=)[^>]*>\',p1,re.I)); assert opens, \'MAIN1_SCRIPT_OPEN_MISSING\'\n          app=p1[opens[-1].end():]; cut=app.rfind(\'</script>\'); app=app[:cut] if cut>=0 else app\n          app=re.sub(r\'(?m)^\\\\s*<!--\\\\s*RAWAEA_P1_FORENSIC_CLOSED:[^>]*-->\\\\s*$\',\'\',app,flags=re.I)\n          chunks=[app.rstrip()]\n          for i in range(2,12): chunks.append(parts[i-1].read_text(encoding=\'utf-8-sig\').rstrip())\n          final=\'\\\\n\\\\n\'.join(chunks)+\'\\\\n})();\\\\n\'; fp=Path(\'/tmp/final.js\'); fp.write_text(final,encoding=\'utf-8\'); r=subprocess.run([\'node\',\'--check\',str(fp)],capture_output=True,text=True)\n          print(\'FINAL\', \'PASS\' if r.returncode==0 else \'FAIL\', hashlib.sha256(final.encode()).hexdigest(), len(final.encode()))\n          if r.returncode: print(r.stderr); raise SystemExit(1)\n          PY2\n''',encoding='utf-8')
          PY
          git add .github/workflows/_cto_push_forensic_20260903.yml
          git rm -f .github/workflows/cto-newmain-final-executor-20260903.yml 2>/dev/null || true
          git diff --cached --check
          git config user.name 'RAWAEA CTO Executor'
          git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git commit -m 'chore(cto): remove one-off forensic push workflow'
          git push origin HEAD:main
