name: ERP Functional Completion v2 20260910

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main2/**'
      - '.github/workflows/_erp_functional_completion_v2_20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[CTO-AUTO]')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Recover and read Current + Original completely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          c=Path('Current/PWA/main2'); o=Path('Original/PWA/main')
          names=[f'main{i}.md' for i in range(1,12)]
          assert all((c/n).is_file() for n in names), 'CURRENT_SET_INCOMPLETE'
          assert all((o/n).is_file() for n in names), 'ORIGINAL_SET_INCOMPLETE'
          rows=[]
          for n in names:
              ct=(c/n).read_text(encoding='utf-8')
              ot=(o/n).read_text(encoding='utf-8')
              rows.append({'main':n,'current_sha256':hashlib.sha256(ct.encode()).hexdigest(),'original_sha256':hashlib.sha256(ot.encode()).hexdigest(),'current_bytes':len(ct.encode()),'original_bytes':len(ot.encode()),'current_lines':len(ct.splitlines()),'original_lines':len(ot.splitlines())})
          Path('/tmp/main_matrix.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          print('ALL_CURRENT_AND_ORIGINAL_READ_TO_EOF=PASS')
          PY

      - name: Closure 1 - HR documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/main2/main11.md'); s=p.read_text(encoding='utf-8')
          if '(قيد التطوير)' in s:
              pattern=re.compile(r"\s*// قسم المستندات \(للرفع لاحقاً\).*?html \+= '</div>';",re.S)
              replacement=r'''\n        // قسم المستندات — إدارة فعلية عبر Supabase Storage + employee_documents\n        html += '<div class="bg-gray-50 p-4 rounded-xl"><h4 class="font-bold text-lg mb-3"><i class="fa-solid fa-file-arrow-up ml-2"></i>المستندات</h4>';\n        html += '<div class="flex flex-wrap gap-4">';\n        html += '<div class="border rounded-xl p-4 text-center w-48 bg-white"><i class="fa-solid fa-id-card text-3xl text-blue-500"></i><p class="text-xs mt-2 font-bold">صورة الهوية</p><button type="button" class="mt-2 bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold" onclick="RW_HR_Documents.openUploadByEmail(\\\'' + _esc(emp.email) + '\\\',\\\'identity\\\')">رفع / استبدال</button><button type="button" class="mt-2 mr-1 bg-gray-100 text-gray-700 px-3 py-1 rounded-lg text-xs font-bold" onclick="RW_HR_Documents.viewByEmail(\\\'' + _esc(emp.email) + '\\\',\\\'identity\\\')">عرض</button><div id="hr-doc-identity-' + _esc(emp.email).replace(/[^A-Za-z0-9_-]/g,'_') + '" class="text-xs text-gray-400 mt-2">جاري الحالة...</div></div>';\n        html += '<div class="border rounded-xl p-4 text-center w-48 bg-white"><i class="fa-solid fa-file-contract text-3xl text-emerald-500"></i><p class="text-xs mt-2 font-bold">عقد العمل</p><button type="button" class="mt-2 bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-bold" onclick="RW_HR_Documents.openUploadByEmail(\\\'' + _esc(emp.email) + '\\\',\\\'contract\\\')">رفع / استبدال</button><button type="button" class="mt-2 mr-1 bg-gray-100 text-gray-700 px-3 py-1 rounded-lg text-xs font-bold" onclick="RW_HR_Documents.viewByEmail(\\\'' + _esc(emp.email) + '\\\',\\\'contract\\\')">عرض</button><div id="hr-doc-contract-' + _esc(emp.email).replace(/[^A-Za-z0-9_-]/g,'_') + '" class="text-xs text-gray-400 mt-2">جاري الحالة...</div></div>';\n        html += '</div></div>';'''
              s2,n=pattern.subn(replacement,s,count=1)
              assert n==1, 'HR_DOCUMENT_BLOCK_NOT_FOUND'
              s=s2
          if 'var RW_HR_Documents=' not in s:
              marker='window.RW_HR = RW_HR;'
              helper=r'''\n// ============================================================\n// RW_HR_Documents — مستندات الموظفين\n// ============================================================\nvar RW_HR_Documents=(function(){\n  function cid(){return _rwCompanyId();}\n  function clean(x){return String(x||'file').replace(/[^A-Za-z0-9._-]/g,'_');}\n  async function findEmp(email){var r=await supabase.from('users').select('id,email,name').eq('company_id',cid()).eq('email',email).maybeSingle();if(r.error||!r.data)throw new Error('الموظف غير موجود');return r.data;}\n  async function openUploadByEmail(email,type){var e=await findEmp(email);return openUpload(e.id,type,email);}\n  async function openUpload(employeeId,type,email){var input=document.createElement('input');input.type='file';input.accept=type==='identity'?'.pdf,image/*':'.pdf,.doc,.docx';input.onchange=async function(){try{var file=input.files&&input.files[0];if(!file)return;showLoader('جاري رفع المستند...');var path=cid()+'/'+employeeId+'/'+type+'/'+crypto.randomUUID()+'-'+clean(file.name);var up=await supabase.storage.from('employee-documents').upload(path,file,{upsert:false});if(up.error)throw up.error;await supabase.from('employee_documents').update({status:'replaced',updated_at:new Date().toISOString()}).eq('company_id',cid()).eq('employee_id',employeeId).eq('document_type',type).eq('status','active');var ins=await supabase.from('employee_documents').insert({company_id:cid(),employee_id:employeeId,document_type:type,storage_path:path,document_name:file.name,mime_type:file.type||null,status:'active',created_by:email||null});if(ins.error)throw ins.error;hideLoader();showToast('تم حفظ المستند','success');Swal.close();}catch(e){hideLoader();showToast(e.message||'فشل رفع المستند','error');}};input.click();}\n  async function viewByEmail(email,type){try{var e=await findEmp(email);var r=await supabase.from('employee_documents').select('storage_path,document_name').eq('company_id',cid()).eq('employee_id',e.id).eq('document_type',type).eq('status','active').order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error||!r.data)throw new Error('لا يوجد مستند محفوظ');var u=await supabase.storage.from('employee-documents').createSignedUrl(r.data.storage_path,300);if(u.error)throw u.error;window.open(u.data.signedUrl,'_blank','noopener');}catch(e){showToast(e.message||'تعذر فتح المستند','error');}}\n  return {openUploadByEmail:openUploadByEmail,viewByEmail:viewByEmail};\n})();\nwindow.RW_HR_Documents=RW_HR_Documents;\n'''
              s=s.replace(marker,helper+marker,1)
          assert '(قيد التطوير)' not in s
          p.write_text(s,encoding='utf-8')
          print('HR_CLOSURE=PASS')
          PY
          grep -n 'قيد التطوير' Current/PWA/main2/main11.md && exit 1 || true

      - name: Verify HR source and continue only after local parse
        shell: bash
        run: |
          node --check <(python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('Current/PWA/main2/main11.md').read_text(encoding='utf-8')
          print('\n'.join(re.findall(r'<script[^>]*>([\s\S]*)</script>',s,re.I)))
          PY
          )

      - name: Closure 2 - Online Store admin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/main2/main6.md'); s=p.read_text(encoding='utf-8')
          if 'RW_OnlineStoreAdmin' not in s:
              insert=r'''\n// ============================================================\n// RW_OnlineStoreAdmin — إدارة أصناف المتجر والعروض والأوردرات\n// ============================================================\nvar RW_OnlineStoreAdmin=(function(){\n  function cid(){return _rwCompanyId();} function esc(x){return String(x==null?'':x).replace(/[&<>\"]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':'&quot;';});}\n  async function render(){var c=byId('rw-page-container');if(!c)return;var id=cid();safeText(byId('rw-header-title'),'إدارة المتجر الإلكتروني');safeText(byId('rw-header-subtitle'),'الأصناف المعروضة والعروض ومتابعة أوردرات المتجر');safeHTML(c,'<div class="p-4 space-y-4"><div class="flex gap-2"><button id="osa-i" class="bg-blue-600 text-white px-4 py-2 rounded-xl">الأصناف والعروض</button><button id="osa-o" class="bg-white border px-4 py-2 rounded-xl">أوردرات المتجر</button></div><div id="osa-c"></div></div>');byId('osa-i').onclick=items;byId('osa-o').onclick=orders;await items();}\n  async function items(){var b=byId('osa-c');var r=await supabase.from('items').select('id,item_code,name,sales_price,show_in_store,discount_percent,discount_start,discount_end,is_daily_deal,badge_text,max_qty_per_order,sort_order').eq('company_id',cid()).order('sort_order',{ascending:true});if(r.error){safeHTML(b,esc(r.error.message));return;}var h='<div class="overflow-auto bg-white border rounded-2xl"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th>الصنف</th><th>متجر</th><th>سعر</th><th>خصم%</th><th>من</th><th>إلى</th><th>صفقة</th><th>شارة</th><th>حد</th><th>ترتيب</th><th></th></tr></thead><tbody>';(r.data||[]).forEach(function(x){h+='<tr class="border-t"><td class="p-2">'+esc(x.name)+'<div class="text-xs text-gray-400">'+esc(x.item_code)+'</div></td><td><input type="checkbox" data-id="'+x.id+'" data-k="show_in_store" '+(x.show_in_store?'checked':'')+'></td><td><input class="w-20 border" type="number" data-id="'+x.id+'" data-k="sales_price" value="'+(x.sales_price||0)+'"></td><td><input class="w-16 border" type="number" data-id="'+x.id+'" data-k="discount_percent" value="'+(x.discount_percent||0)+'"></td><td><input class="border" type="date" data-id="'+x.id+'" data-k="discount_start" value="'+(x.discount_start||'')+'"></td><td><input class="border" type="date" data-id="'+x.id+'" data-k="discount_end" value="'+(x.discount_end||'')+'"></td><td><input type="checkbox" data-id="'+x.id+'" data-k="is_daily_deal" '+(x.is_daily_deal?'checked':'')+'></td><td><input class="w-24 border" data-id="'+x.id+'" data-k="badge_text" value="'+esc(x.badge_text||'')+'"></td><td><input class="w-16 border" type="number" data-id="'+x.id+'" data-k="max_qty_per_order" value="'+(x.max_qty_per_order||'')+'></td><td><input class="w-14 border" type="number" data-id="'+x.id+'" data-k="sort_order" value="'+(x.sort_order||0)+'"></td><td><button class="osa-save bg-emerald-600 text-white px-2 rounded" data-id="'+x.id+'">حفظ</button></td></tr>';});h+='</tbody></table></div>';safeHTML(b,h);b.querySelectorAll('.osa-save').forEach(function(btn){btn.onclick=async function(){var id=btn.dataset.id,p={};b.querySelectorAll('[data-id="'+id+'"][data-k]').forEach(function(e){p[e.dataset.k]=e.type==='checkbox'?e.checked:e.value;});p.sales_price=Number(p.sales_price||0);p.discount_percent=Number(p.discount_percent||0);p.max_qty_per_order=p.max_qty_per_order===''?null:Number(p.max_qty_per_order);p.sort_order=Number(p.sort_order||0);var z=await supabase.from('items').update(p).eq('id',id).eq('company_id',cid());if(z.error)showToast(z.error.message,'error');else showToast('تم تحديث إعدادات المتجر','success');};});}\n  async function orders(){var b=byId('osa-c');var r=await supabase.from('orders').select('id,order_code,order_date,customer_name,total_amount,payment_type,order_status,source').eq('company_id',cid()).order('order_date',{ascending:false}).limit(200);if(r.error){safeHTML(b,esc(r.error.message));return;}var h='<div class="overflow-auto bg-white border rounded-2xl"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th>الأوردر</th><th>التاريخ</th><th>العميل</th><th>القيمة</th><th>المصدر</th><th>الحالة</th><th></th></tr></thead><tbody>';(r.data||[]).forEach(function(x){h+='<tr class="border-t"><td class="p-2">'+esc(x.order_code)+'</td><td>'+esc(x.order_date)+'</td><td>'+esc(x.customer_name)+'</td><td>'+Number(x.total_amount||0).toLocaleString()+'</td><td>'+esc(x.source)+'</td><td><select class="osa-os border" data-id="'+x.id+'"><option>Pending</option><option>Confirmed</option><option>Invoiced</option><option>Delivered</option><option>Cancelled</option></select></td><td><button class="osa-oo bg-blue-600 text-white px-2 rounded" data-id="'+x.id+'">حفظ</button></td></tr>';});h+='</tbody></table></div>';safeHTML(b,h);(r.data||[]).forEach(function(x){var q=b.querySelector('.osa-os[data-id="'+x.id+'"]');if(q)q.value=x.order_status||'Pending';});b.querySelectorAll('.osa-oo').forEach(function(btn){btn.onclick=async function(){var q=b.querySelector('.osa-os[data-id="'+btn.dataset.id+'"]'),z=await supabase.from('orders').update({order_status:q.value,updated_at:new Date().toISOString()}).eq('id',btn.dataset.id).eq('company_id',cid());if(z.error)showToast(z.error.message,'error');else showToast('تم تحديث حالة الأوردر','success');};});}\n  return {render:render,items:items,orders:orders};\n})();window.RW_OnlineStoreAdmin=RW_OnlineStoreAdmin;\n'''
              p.write_text(s+insert,encoding='utf-8')
          print('STORE_CLOSURE=PASS')
          PY

      - name: Closure 3 - Finance and Decision routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/main2/main1.md');s=p.read_text(encoding='utf-8')
          if 'store-admin' not in s:s=s.replace("{ view: 'online-store', label: 'المتجر الإلكتروني' },","{ view: 'online-store', label: 'المتجر الإلكتروني' }, { view: 'store-admin', label: 'إدارة المتجر والعروض' },",1)
          if 'finance-control' not in s:s=s.replace("{ view: 'settlement', label: 'إغلاق اليومية' }", "{ view: 'finance-control', label: 'مركز الرقابة المالية' }, { view: 'settlement', label: 'إغلاق اليومية' }",1)
          if 'decision-center' not in s:s=s.replace("{ view: 'reports-dashboard', label: 'لوحة القيادة' },", "{ view: 'reports-dashboard', label: 'لوحة القيادة' }, { view: 'decision-center', label: 'مركز القرار التنفيذي' },",1)
          p.write_text(s,encoding='utf-8')
          p=Path('Current/PWA/main9.md');s=p.read_text(encoding='utf-8')
          if 'RW_DecisionCenter' not in s:
              s+=r'''\n// ============================================================\n// RW_DecisionCenter — مركز القرار التنفيذي\n// ============================================================\nvar RW_DecisionCenter=(function(){function esc(x){return String(x==null?'':x).replace(/[&<>]/g,function(m){return m==='&'?'&amp;':m==='<'?'&lt;':m==='>'?'&gt;':'';});}async function render(){var c=byId('rw-page-container'),id=_companyId(),to=new Date().toISOString().slice(0,10),from=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);if(!c)return;var r=await supabase.rpc('get_enterprise_decision_center',{p_company_id:id,p_from_date:from,p_to_date:to});if(r.error){safeHTML(c,'<div class="text-red-500 p-4">'+esc(r.error.message)+'</div>');return;}var d=r.data||{},h='<div class="p-4 space-y-5"><div class="grid grid-cols-1 md:grid-cols-4 gap-4">';[['المبيعات',d.sales],['الأوردرات',d.orders],['قيمة المخزون',d.stock_value_at_cost],['النقدية',d.cash_position],['العملاء',d.accounts_receivable],['الموردون',d.accounts_payable],['منخفض المخزون',d.low_stock_items],['راكدة',d.dormant_items]].forEach(function(x){h+='<div class="bg-white border rounded-2xl p-5"><div class="text-xs text-gray-500">'+x[0]+'</div><div class="text-2xl font-black mt-2">'+Number(x[1]||0).toLocaleString('ar-EG')+'</div></div>';});h+='</div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="bg-white border rounded-2xl p-5"><h3 class="font-black mb-3">إشارات المخاطر</h3>';Object.keys(d.risk_flags||{}).forEach(function(k){h+='<div class="flex justify-between border-b py-2"><span>'+esc(k)+'</span><b class="'+(d.risk_flags[k]?'text-red-600':'text-emerald-600')+'">'+(d.risk_flags[k]?'يحتاج قرار':'طبيعي')+'</b></div>';});h+='</div><div class="bg-white border rounded-2xl p-5"><h3 class="font-black mb-3">الإجراء المقترح</h3><div class="text-sm space-y-2">'+(d.low_stock_items>0?'<p>• راجع إعادة الطلب للأصناف منخفضة المخزون.</p>':'')+(d.dormant_items>0?'<p>• ضع خطة تصريف للأصناف الراكدة.</p>':'')+(d.accounts_receivable>0?'<p>• شدد متابعة التحصيل.</p>':'')+(d.accounts_payable>0?'<p>• راجع جدولة التزامات الموردين.</p>':'')+((!d.low_stock_items&&!d.dormant_items&&!d.accounts_receivable&&!d.accounts_payable)?'<p>• لا توجد إشارة حرجة وفق البيانات الحالية.</p>':'')+'</div></div></div></div>';safeText(byId('rw-header-title'),'مركز القرار التنفيذي');safeHTML(c,h);}return {render:render};})();window.RW_DecisionCenter=RW_DecisionCenter;\n'''
          p.write_text(s,encoding='utf-8')
          print('DECISION_ROUTE=PASS')
          PY

      - name: Closure 4 - post-completion source verification and full assembly parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          c=Path('Current/PWA/main2');names=[f'main{i}.md' for i in range(1,12)]
          text=''.join((c/n).read_text(encoding='utf-8') for n in names);Path('/tmp/assembled.html').write_text(text,encoding='utf-8')
          assert '(قيد التطوير)' not in text
          for pat in ['coming soon','placeholder','not implemented','TODO:']:
              assert re.search(re.escape(pat),text,re.I) is None,pat
          assert text.lower().count('<html')==1 and text.lower().count('</html>')==1
          assert text.lower().count('<body')==1 and text.lower().count('</body>')==1
          assert text.lower().count('<script')==text.lower().count('</script>')
          print('FINAL_SOURCE_NO_PLACEHOLDER=PASS')
          print('ASSEMBLED_SHA256='+hashlib.sha256(text.encode()).hexdigest())
          PY
          python3 - <<'PY'
          import re,subprocess,tempfile
          from pathlib import Path
          s=Path('/tmp/assembled.html').read_text(encoding='utf-8');blocks=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I);assert blocks
          for code in blocks:
              p=Path(tempfile.mkstemp(suffix='.js')[1]);p.write_text(code,encoding='utf-8')
              try:subprocess.run(['node','--check',str(p)],check=True)
              finally:p.unlink(missing_ok=True)
          print('FULL_PARENT_NODE_PARSE=PASS')
          PY

      - name: Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cp /tmp/assembled.html /tmp/index.html
          python3 -m http.server 4173 --directory /tmp >/tmp/erp-http.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'}),e=[];p.on('pageerror',x=>e.push(x.message));await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1000);const r=await p.evaluate(()=>({login:!!document.getElementById('rw-login-page'),page:!!document.getElementById('rw-page-container'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',finance:typeof RW_Finance==='object',reports:typeof RW_Reports==='object',hr:typeof RW_HR==='object',crm:typeof RW_CRM==='object',storeAdmin:typeof RW_OnlineStoreAdmin==='object',decision:typeof RW_DecisionCenter==='object'}));console.log(JSON.stringify({r,e}));if(e.length||!r.login||!r.page||!r.auth||!r.nav||!r.views||!r.finance||!r.reports||!r.hr||!r.crm||!r.storeAdmin||!r.decision)process.exit(2);await b.close()})().catch(e=>{console.error(e);process.exit(2)})
          NODE
          echo CHROMIUM_RUNTIME=PASS

      - name: Persist execution record and source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
