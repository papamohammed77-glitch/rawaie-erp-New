name: CTO Final New-main Surgical Closure

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - '.github/workflows/_cto_final_newmain_surgery_20260903.yml'

permissions:
  contents: write

concurrency:
  group: cto-final-newmain-surgery
  cancel-in-progress: false

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message || '', '[FINAL-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Surgical target mutation and static gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, subprocess, tempfile, hashlib

          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          before=s

          old_manifest='<link rel="manifest" href="../manifest.json">'
          new_manifest='<link rel="manifest" href="./New-main.manifest.json">'
          if old_manifest in s:
              assert s.count(old_manifest)==1, 'legacy manifest cardinality'
              s=s.replace(old_manifest,new_manifest,1)
          else:
              assert new_manifest in s, 'PWA_MANIFEST_CONTRACT_MISSING'

          pwa_meta='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if pwa_meta not in s:
              assert s.count('</head>')==1
              s=s.replace('</head>',pwa_meta+'\n</head>',1)

          sw_coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if sw_coord not in s:
              assert s.count('</head>')==1
              s=s.replace('</head>',sw_coord+'\n</head>',1)

          # Preserve the single authoritative owner surface already present in New-main.
          assert s.count('window.RW_OwnerLicense={')==1, 'OWNER_AUTHORITY_CARDINALITY'
          assert 'window.RW_OwnerLicense={' in s

          old_email="async function showPanel(){\n  var e=email();"
          new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          assert s.count(old_email)==1, f'NOTIFICATION_OLD_COUNT={s.count(old_email)}'
          s=s.replace(old_email,new_email,1)

          required=[
            'rw-p163-closure',
            'P163-GOLD-DIAMOND-CLOSED-2026-09-03',
            'rw-pwa-runtime-gold',
            'PWA-RUNTIME-GOLD-2026-09-03',
            'RAWAEA_TARGET_SW_COORDINATOR',
            'RAWAEA 122 DIAMOND CONTRACT CLOSURE v1',
            'window.RW_Auth=',
            'window.RW_Navigation=',
            'window.RW_Views=',
            'window.RW_ShellContext=',
            'window.RW_OwnerLicense={',
            'applyAuthoritativeContext',
            'window.MAIN_HTML_CURRENT_CONTRACT_LEDGER='
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'CLOSURE_CONTRACT_MISSING {missing}'
          assert s.count('window.RW_OwnerLicense={')==1
          assert 'var e=email();' not in s
          assert s.count('rw-pwa-runtime-gold')==1
          assert s.count('RAWAEA_TARGET_SW_COORDINATOR')==1

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.cur=None; self.inline=[]; self.scripts=0; self.styles=0
              def handle_starttag(self,t,a):
                  t=t.lower()
                  if t=='script':
                      self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
                  elif t=='style': self.styles+=1
              def handle_data(self,d):
                  if self.cur is not None and not self.cur['src']:
                      self.cur['text']+=d
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.cur is not None:
                      if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                      self.cur=None

          hp=P(); hp.feed(s); hp.close()
          assert (hp.scripts,hp.styles,len(hp.inline))==(6,1,1), (hp.scripts,hp.styles,len(hp.inline))
          js=Path(tempfile.mkstemp(suffix='.js')[1])
          js.write_text(hp.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(js)],check=True)
          finally: js.unlink(missing_ok=True)

          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          assert (m['start_url'],m['scope'],m['lang'],m['dir'])==('./New-main','./','ar','rtl')
          fm=json.loads(Path('Current/manifest.json').read_text(encoding='utf-8'))
          assert (fm['start_url'],fm['scope'],fm['lang'],fm['dir'])==('./PWA/New-main','./PWA/','ar','rtl')
          assert Path('Current/PWA/register-sw.js').exists() and Path('Current/PWA/sw.js').exists()
          assert s != before
          p.write_text(s,encoding='utf-8')
          print('TARGET_MUTATION_OK')
          print('TARGET_SHA256',hashlib.sha256(s.encode()).hexdigest())
          PY
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
      - name: Chromium runtime gate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir -p /tmp/site/Current
          cp -a Current/. /tmp/site/Current/
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/newmain-http.log 2>&1 & echo $! >/tmp/newmain-http.pid)
          trap 'kill "$(cat /tmp/newmain-http.pid)" 2>/dev/null || true' EXIT
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.route('https://*.supabase.co/**', async route=>{
              const u=route.request().url();
              let body='{}';
              if(u.includes('/rest/v1/notifications')) body='[]';
              if(u.includes('/auth/v1/session')) body='{"access_token":null,"refresh_token":null,"user":null}';
              await route.fulfill({status:200,contentType:'application/json',body});
            });
            const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message));
            p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1200);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views;
              let notification='NOT_EXPOSED',licenseDenied=false,auditDenied=false;
              if(S?.app&&window.RW_Notification?.showPanel){
                S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};
                try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL:'+String(e?.message||e)}
                try{await N.navigate('license')}catch(e){licenseDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e?.message||e))}
                try{await N.navigate('audit')}catch(e){auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e?.message||e))}
              }
              const l=document.querySelector('link[rel="manifest"]');
              const mj=await (await fetch(l.href)).json();
              const side=await (await fetch('/Current/manifest.json')).json();
              const sw=await fetch('./register-sw.js');
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,licenseDenied,auditDenied,diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:l?.getAttribute('href')||'',start:mj.start_url,scope:mj.scope,sideStart:side.start_url,sideScope:side.scope,sw:sw.status};
            });
            console.log('FINAL_GOLD_DIAMOND='+JSON.stringify({r,pe,ce}));
            await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.notification==='PASS'&&r.licenseDenied&&r.auditDenied&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.start==='.'+'/New-main'&&r.scope==='.'+'/'&&r.sideStart==='.'+'/PWA/New-main'&&r.sideScope==='.'+'/PWA/'&&r.sw===200;
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Commit only target app plus closure state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('Current/PWA/New-main')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          st=Path('CURRENT_STATE.md')
          s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## FINAL-CLOSED — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          if marker not in s:
              s=s.rstrip()+f'''\n\n{marker}\n- Target Git blob: `{blob}`\n- Target SHA-256: `{h}`\n- Target-preserving surgery: PASS.\n- PWA manifest isolation + permanent service-worker coordinator: PASS.\n- Authoritative owner surface preserved; notification email binding fixed: PASS.\n- Static HTMLParser/Node gates: PASS.\n- Exact HTTP Chromium gate: PASS; zero page/console errors; notification runtime PASS; owner-only guards PASS.\n- Supabase production writes: NONE.\n- Fragment reconstruction: NOT USED.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n'''
              st.write_text(s+'\n',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'
          git config user.email 'rawaea-cto-executor@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[FINAL-CLOSED] [WHOLE-NEWMAIN-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] Current/PWA/New-main'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then git rebase origin/main; fi
          git push origin HEAD:main
