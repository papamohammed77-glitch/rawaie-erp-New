name: CTO one-time trusted New-main surgical repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_cto_diagnose_trusted_artifact_20260903.yml'
      - '.cto/trigger-20260903'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cto-one-time-newmain-surgery-20260903
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Exact target surgical repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          needle='function byId(id){return document.getElementById(id)}'
          bridge='window.byId=byId;'
          assert s.count(needle)==1,'BYID_DECLARATION_COUNT_INVALID'
          assert s.count('window.safeText=safeText;')==1,'SAFETEXT_BRIDGE_INVALID'
          assert s.count(bridge) in (0,1),'BYID_BRIDGE_COUNT_INVALID'
          if s.count(bridge)==0:
              before=hashlib.sha256(s.encode()).hexdigest()
              s=s.replace(needle,needle+'\n'+bridge,1)
              p.write_text(s,encoding='utf-8')
              print('PATCH=APPLIED')
              print('BEFORE_SHA256='+before)
              print('AFTER_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          else:
              print('PATCH=ALREADY_PRESENT')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert len(scripts)==1,'INLINE_SCRIPT_COUNT_INVALID'
          Path('/tmp/new-main-inline.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/new-main-inline.js
          grep -o 'window.safeText=safeText;' Current/PWA/New-main | wc -l | grep '^1$'
          grep -o 'window.byId=byId;' Current/PWA/New-main | wc -l | grep '^1$'
          echo 'SURGICAL_STATIC=PASS'
      - name: Chromium owner/non-owner and shell gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8129 --directory Current/PWA >/tmp/p135-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            async function test(){
              const p=await b.newPage({serviceWorkers:'block'});const errors=[];
              p.on('pageerror',e=>errors.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await p.goto('http://127.0.0.1:8129/New-main',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>window.RW_STATE&&window.RW_Navigation&&window.RW_OwnerLicense&&typeof window.byId==='function'&&typeof window.safeText==='function');
              const initial=await p.evaluate(()=>({locale:document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',ownerLicense:typeof RW_OwnerLicense==='object',notif:typeof RW_Notification?.showPanel==='function',byId:typeof window.byId==='function',safeText:typeof window.safeText==='function'}));
              await p.evaluate(()=>{RW_STATE.app.currentUser={id:'probe',email:'owner@smoke.local',isOwner:true,permissions:['*']};RW_STATE.permissions=['*'];RW_STATE.app.companyId='00000000-0000-0000-0000-000000000001';RW_STATE.app.licenseState='active';});
              let owner={ok:false};try{await p.evaluate(async()=>{await RW_Navigation.navigate('license')});owner=await p.evaluate(()=>({ok:true,view:RW_STATE.app.currentView,container:!!document.getElementById('license-main-container'),text:document.getElementById('rw-page-container')?.innerText||''}));}catch(e){owner={ok:false,error:String(e.message||e)}}
              await p.evaluate(()=>{RW_STATE.app.currentUser={id:'probe',email:'user@smoke.local',isOwner:false,permissions:[]};RW_STATE.permissions=[];});
              let denied='';try{await p.evaluate(async()=>{await RW_Navigation.navigate('license')});denied='NO_REJECTION';}catch(e){denied=String(e.message||e)}
              await p.close();return {initial,owner,denied,errors};
            }
            const r=await test();console.log('SURGICAL_RUNTIME='+JSON.stringify(r));
            const ok=r.initial.locale&&r.initial.auth&&r.initial.nav&&r.initial.views&&r.initial.shell&&r.initial.ownerLicense&&r.initial.notif&&r.initial.byId&&r.initial.safeText&&r.owner.ok&&r.owner.view==='license'&&r.owner.container&&/إدارة الترخيص/.test(r.owner.text)&&r.denied==='OWNER_ONLY'&&!r.errors.length;
            await b.close();if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo 'SURGICAL_RUNTIME=PASS'
      - name: Persist exact repair and retire writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA CTO Surgical Repair'
          git config user.email 'rawaea-cto-surgical@users.noreply.github.com'
          git add Current/PWA/New-main
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m '[CTO-FORENSIC] Export byId across governed runtime scope'
          fi
          git rm .github/workflows/_cto_diagnose_trusted_artifact_20260903.yml .cto/trigger-20260903 || true
          git commit -m '[CTO-GOVERNANCE] Retire one-time trusted artifact writer and trigger'
          git push origin HEAD:main
