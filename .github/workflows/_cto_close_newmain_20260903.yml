name: CTO Close New-main — Target-Preserving P163
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message, '[CTO-CLOSURE-EXECUTED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Surgical P163 closure on existing target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8'); before=s
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'; auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          version="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"; governed='// MAIN2_GOVERNED_CLOSED:v1'; diamond='RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'
          legacy_dash='window.RW_Dashboard={render:renderDashboard};'; legacy_items='window.RW_Items={render:renderItems};'; auth_dash='window.RW_Dashboard=RW_Dashboard;'; auth_items='window.RW_Items=RW_Items;'
          def need(c,m):
              if not c: raise SystemExit(m)
          need(s.count(compat)==1,'P163_COMPAT_COUNT'); need(s.count(auth)==1,'P163_AUTH_COUNT'); need(s.count(version)==1,'P163_VERSION_COUNT'); need(s.count(governed)==1,'P163_GOVERNED_COUNT'); need(diamond in s,'P163_DIAMOND_MISSING')
          a,b=s.index(compat),s.index(auth); need(b>a,'P163_BOUNDARY_ORDER')
          region=s[a:b]; need(region.count('var RW_Dashboard = (function()')==1,'P163_COMPAT_DASH_OWNER_MISSING'); need(region.count('var RW_Items = (function()')==1,'P163_COMPAT_ITEMS_OWNER_MISSING'); need(region.rfind('window.RW_Items=RW_Items;')>=0,'P163_COMPAT_END_MISSING')
          s=s[:a]+s[b:]; s=s.replace(legacy_dash,'').replace(legacy_items,'')
          need(s.count(auth)==1,'P163_AUTH_LOST'); need(s.count('var RW_Dashboard =')==1,'P163_DASH_OWNER'); need(s.count('var RW_Items =')==1,'P163_ITEMS_OWNER'); need(s.count(auth_dash)==1,'P163_AUTH_DASH_EXPORT'); need(s.count(auth_items)==1,'P163_AUTH_ITEMS_EXPORT')
          s=s.replace(version,'').replace(governed,''); i=s.index(auth_items)+len(auth_items); s=s[:i]+'\n'+version+'\n'+governed+s[i:]
          required=['main1Delegation','actions','MAIN3','edgeCall','window.RW_SUPABASE_CLIENT','window.RW_Auth','RW_ShellContext.getCompanyId','post_stock_movement','reserve_stock',diamond]; missing=[x for x in required if x not in s]; need(not missing,'P163_REQUIRED_MISSING '+repr(missing))
          need('function post_journal_entry' not in s,'P163_FORBIDDEN_JOURNAL_IMPL'); need('function save_sales_invoice_atomic' not in s,'P163_FORBIDDEN_INVOICE_IMPL')
          need(s.lower().count('<script')==s.lower().count('</script>'),'P163_SCRIPT_BALANCE'); need(s.lower().count('<style')==s.lower().count('</style>'),'P163_STYLE_BALANCE'); need(len(re.findall(r'navigator\.serviceWorker\.register',s))==1,'P163_SW_REGISTER')
          p.write_text(s,encoding='utf-8'); print('P163_TARGET_CHANGED',s!=before); print('P163_TARGET_SHA256',hashlib.sha256(s.encode()).hexdigest()); print('P163_BEFORE_BYTES',len(before.encode()),'P163_AFTER_BYTES',len(s.encode()))
          PY
      - name: JavaScript syntax gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8'); scripts=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc\s*=)[\s\S]*?</script>',s,re.I)]
          # Extract application inline script robustly without treating external scripts as application code.
          scripts=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)]
          if len(scripts)!=1: raise SystemExit('INLINE_APPLICATION_RUNTIME_COUNT:'+str(len(scripts)))
          Path('/tmp/newmain.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/newmain.js
          git diff --check
          echo NODE_SYNTAX_PASS
      - name: Browser Gold Diamond contract smoke
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1; npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rw; mkdir -p /tmp/rw; cp -r Current/PWA/. /tmp/rw/; cp Current/PWA/New-main /tmp/rw/main.html; python3 -m http.server 8123 --directory /tmp/rw >/tmp/rw.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage(),pe=[],ce=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});await p.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(2500);const r=await p.evaluate(()=>{const N=window.RW_Navigation,S=window.RW_STATE,flat=[];(function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);S.app.currentUser={isOwner:false};let denied=false;try{N.navigate('license')}catch(e){denied=e.message==='OWNER_ONLY'}const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'].every(v=>!!window[v]);return{count:flat.length,critical:['dashboard','telesales','customers','pos','orders','runsheets','suppliers','purchases','receiving','items','inventory','vouchers','picking','loading','delivery','returns','unloading','finance','reports','hr','crm','users','roles','license','settings','notifications'].every(v=>flat.includes(v)),denied,mods,ownerLicense:!!window.RW_OwnerLicense,main2:window.RW_PWA_RECONSTRUCTION_VERSION||null}});console.log(JSON.stringify({r,pe,ce}));if(pe.length||ce.length||r.count<30||!r.critical||!r.denied||!r.mods||!r.ownerLicense||r.main2!=='MAIN2-COMPLETE-SURGICAL-v1')process.exit(2);await b.close()})().catch(e=>{console.error(e);process.exit(2)});
          NODE
          echo BROWSER_GOLD_DIAMOND_PASS
      - name: Persist target and continuity record
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA CTO Executor'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Current/PWA/New-main'); st=Path('CURRENT_STATE.md'); s=p.read_text(encoding='utf-8'); h=hashlib.sha256(s.encode()).hexdigest(); x=st.read_text(encoding='utf-8').rstrip()
          x+=f"\n\n## CTO CLOSURE — 2026-09-03 — P163 TARGET-PRESERVING\n\n- Directly verified previous executor failures: retired owner-recovery verifier (HTTP 410) and over-broad P163 Gold gate boundary.\n- `Current/PWA/New-main` was modified in-place only after exact compatibility/authoritative ownership preconditions passed.\n- MAIN2 authoritative owners, MAIN3+ content, and `RAWAEA 122 DIAMOND CONTRACT CLOSURE v1` were preserved.\n- Production-owned stock/journal/invoice functions were not fabricated into the PWA.\n- Node syntax gate: PASS.\n- Browser Gold/Diamond smoke: PASS.\n- Target SHA-256: `{h}`\n- Production business-data writes: none.\n"
          st.write_text(x+'\n',encoding='utf-8')
          PY
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[CTO-CLOSURE-EXECUTED] [new-main-target-persist] P163 Gold Diamond closure'
          git push origin main
