name: forensic-vouchers-inventory-privacy-fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[forensic-vouchers-privacy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vouchers privacy boundary
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('Current/PWA/vouchers.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # The warehouse catalog must never request commercial prices.
          s = s.replace(
              "select('id,item_code,barcode,name,search_label,category,unit,sales_price,cost_price,image_url,is_active')",
              "select('id,item_code,barcode,name,search_label,category,unit,description,image_url,is_active')"
          )

          # Remove visible sale/cost price blocks from item-detail modals, including both
          # generations that exist in the current Gold Master source.
          s = re.sub(
              r'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-\\[10px\\] text-slate-400">سعر البيع</span><b class="block mt-1 text-white">.*?</b></div>',
              '', s, flags=re.S
          )
          s = re.sub(
              r'<div class="p-3 bg-slate-800 rounded-2xl"><span class="text-\\[10px\\] text-slate-400">التكلفة</span><b class="block mt-1 text-white">.*?</b></div>',
              '', s, flags=re.S
          )
          s = s.replace(
              "'<span class=\"text-2xl font-black text-emerald-400 whitespace-nowrap\">'+f(x.sales_price||x.cost_price||0)+'</span>'+controls",
              "'<div class=\"flex-1 text-xs text-slate-400\">'+s.esc(x.unit||'حبة')+' · '+s.esc(x.category||'أخرى')+'</div>'+controls"
          )

          # Add the warehouse-relevant description to the item detail header.
          old_meta = "'<p class=\"text-xs text-slate-400\">الوحدة: '+s.esc(x.unit||'حبة')+'</p></div></div>'"
          new_meta = "'<p class=\"text-xs text-slate-400\">الوحدة: '+s.esc(x.unit||'حبة')+'</p><p class=\"text-xs text-slate-400\">التصنيف: '+s.esc(x.category||'أخرى')+'</p><p class=\"text-xs text-slate-400\">الوصف: '+s.esc(x.description||'—')+'</p></div></div>'"
          s = s.replace(old_meta, new_meta)

          # Replace catalog/cart price displays with warehouse-only information.
          s = s.replace(
              "'<span class=\"text-[11px] text-emerald-400 font-black\">'+f(x.sales_price||x.cost_price||0)+'</span>'",
              "'<span class=\"text-[11px] text-slate-400 font-black\">'+s.esc(x.category||'أخرى')+'</span>'"
          )
          s = s.replace(
              "'<span class=\"text-[10px] text-slate-500\">'+f(x.price)+' × '+x.qty+'</span>'",
              "'<span class=\"text-[10px] text-slate-500\">الكمية: '+x.qty+'</span>'"
          )

          # Price was not a warehouse business input; do not retain it in the client model
          # and do not send it back to the voucher capability.
          s = s.replace(",price:Number(x.sales_price||x.cost_price||0)", "")
          s = s.replace("unitPrice:x.price,", "")

          # Update build marker so cache/runtime investigation can distinguish this source.
          s = s.replace(
              'RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20',
              'RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20-INV-PRIVACY'
          )

          if s == original:
              raise SystemExit('No source change was produced')
          if 'sales_price' in s or 'cost_price' in s:
              raise SystemExit('Commercial price fields still exist in vouchers.html source')
          if 'unitPrice:' in s:
              raise SystemExit('unitPrice is still sent by vouchers.html')
          if "description" not in s:
              raise SystemExit('Warehouse description field was not added to the catalog query')
          if 'الوصف:' not in s:
              raise SystemExit('Warehouse description was not added to the item detail modal')

          p.write_text(s, encoding='utf-8')
          print('Privacy patch assertions passed')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          s = Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          print('\n'.join(scripts))
          PY
          )

      - name: Commit only the application file and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/forensic-vouchers-inventory-privacy-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/vouchers.html .github/workflows/forensic-vouchers-inventory-privacy-fix.yml
          git diff --cached --check
          git commit -m 'fix(vouchers): hide commercial prices from warehouse item flow [forensic-vouchers-privacy]'
          git push origin main
          # trigger marker: forensic-vouchers-privacy-v2
