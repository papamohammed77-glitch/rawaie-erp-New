name: Vouchers Diamond Normalizer
on:
  push:
    paths:
      - '.github/workflows/vouchers_diamond_apply.yml'
      - '.vouchers-diamond-trigger'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize vouchers Gold Master tail
        shell: python
        run: |
          from pathlib import Path
          p=Path('Current/PWA/vouchers.html')
          s=p.read_text(encoding='utf-8')
          marker='/* RAWAEA VOUCHERS GOLD MASTER 2026-08-20 */'
          if marker not in s:
              raise SystemExit('Gold Master marker not found')
          start=s.index(marker)
          end=s.find('</script>',start)
          if end<0: raise SystemExit('Gold Master script end not found')
          tail=r'''/* RAWAEA VOUCHERS DIAMOND MASTER 2026-08-20 */
(function(){
  var S=window.App;
  if(!S) return;
  S._diamond=true;
  function mapVehicles(){S.vehicleBranchMap={};(S.refs&&S.refs.vehicles||[]).forEach(function(v){var code='VAN-'+String(v.vehicle_code||'').trim().toUpperCase(),b=(S.refs.branches||[]).find(function(x){return String(x.branch_code||'').toUpperCase()===code});if(b)S.vehicleBranchMap[v.id]=b.id;});}
  var oldLoadRefs=S.loadRefs;if(oldLoadRefs){S.loadRefs=function(){var p=oldLoadRefs.apply(S,arguments);return Promise.resolve(p).then(function(){mapVehicles();return p;});};}
  S.getSourceBranchId=function(){var x=document.getElementById('from');if(!x||!x.value)return null;return S.type==='DirectReturn'?(S.vehicleBranchMap||{})[x.value]||null:x.value;};
  S.avail=function(itemId){var b=S.getSourceBranchId();if(!b)return null;var x=S.stock&&S.stock[b+':'+itemId];return x==null?0:Number(x||0);};
  S.canAddQuantity=function(itemId,nextQty){if(S.type==='DirectReturn')return true;var av=S.avail(itemId);if(av==null)return false;if(S.mode==='engine'&&S.type==='Adjustment'){var m=document.getElementById('adjMode');return !m||m.value!=='deduct'||nextQty<=av;}return nextQty<=av;};
  var oldDetails=S.itemDetails;if(oldDetails){S.itemDetails=function(id){var x=(S.items||[]).find(function(i){return i.id===id});if(!x)return oldDetails.apply(S,arguments);return Swal.fire({title:S.esc(x.name||x.item_code),html:'<div class="text-right"><p>الكود: '+S.esc(x.item_code)+'</p><p>الباركود: '+S.esc(x.barcode||'—')+'</p><p>الوحدة: '+S.esc(x.unit||'حبة')+'</p><p>التصنيف: '+S.esc(x.category||'أخرى')+'</p><p>الوصف: '+S.esc(x.description||'—')+'</p><p class="mt-3">المتاح: '+S.avail(id)+'</p></div>',showConfirmButton:false,showCloseButton:true});};}
  var oldCan=S.canAddQuantity;if(oldCan)S.canAddQuantity=function(itemId,nextQty){return S._diamond&&S.avail?S.canAddQuantity(itemId,nextQty):oldCan.apply(S,arguments);};
  mapVehicles();
})();
'''
          # keep the original app body and replace only the executable Gold Master tail
          s=s[:start]+tail+s[end:]
          s=s.replace('RAWAEA-VOUCHERS-GOLD-MASTER-2026-08-20-INV-PRIVACY','RAWAEA-VOUCHERS-DIAMOND-MASTER-2026-08-20')
          p.write_text(s,encoding='utf-8')
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name 'rawaea-automation'
          git config user.email 'actions@rawaea.local'
          git add Current/PWA/vouchers.html
          git diff --cached --quiet || git commit -m 'fix: normalize vouchers diamond master runtime'
          git push