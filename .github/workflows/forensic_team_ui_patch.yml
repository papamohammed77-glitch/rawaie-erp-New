name: forensic-team-ui-patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'chore: finalize warehouse supervisor team ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch team tab surgically
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/warehouse.supervisor')
          s=p.read_text(encoding='utf-8')
          css_old='''        .team-card{background:#fff;border:1px solid #eef2f7;border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.04)}\n        .team-role-select{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;width:100%;font-weight:800;outline:none}\n        .team-role-select:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(59,130,246,.10)}\n        .team-stat{background:#f8fafc;border-radius:18px;padding:12px}\n        .team-muted{color:#64748b;font-size:11px;font-weight:700}'''
          css_new=css_old+'''\n        .team-table-wrap{background:#fff;border:1px solid #e8edf5;border-radius:24px;overflow:auto;box-shadow:0 10px 28px rgba(15,23,42,.05)}\n        .team-table{width:100%;min-width:920px;border-collapse:separate;border-spacing:0}\n        .team-table th{background:#f8fafc;color:#475569;font-size:11px;font-weight:900;padding:13px 14px;text-align:right;border-bottom:1px solid #e5e7eb;white-space:nowrap}\n        .team-table td{padding:13px 14px;border-bottom:1px solid #eef2f7;vertical-align:middle}\n        .team-table tbody tr:hover{background:#fbfdff}\n        .team-table tbody tr:last-child td{border-bottom:none}\n        .team-save-btn{border:none;border-radius:12px;padding:10px 14px;font-weight:900;font-size:12px;cursor:pointer;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 5px 14px rgba(37,99,235,.18);white-space:nowrap}\n        .team-save-btn:disabled{background:#e2e8f0;color:#94a3b8;box-shadow:none;cursor:not-allowed}\n        .team-pending{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;background:#fff7ed;color:#c2410c;font-size:10px;font-weight:900}\n        .team-current{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:900}\n        .team-row-muted{color:#64748b;font-size:11px;font-weight:700}'''
          if css_old not in s:
              raise SystemExit('Expected team CSS block not found')
          s=s.replace(css_old,css_new,1)
          pattern=re.compile(r"    renderRoster:function\(\)\{.*?    renderLive:function\(\)",re.S)
          replacement=r'''    renderRoster:function(){var s=this;RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-2xl text-blue-400"></i></div>');var roles=['استلام','تحضير','تحميل','مرتجعات','تفريغ','أذونات','جرد','احتياطي'];var icons={'استلام':'📦','تحضير':'📋','تحميل':'🚛','مرتجعات':'↩️','تفريغ':'🔄','أذونات':'📄','جرد':'🔍','احتياطي':'🪑'};var scopeRows=s.effectiveBranchRows||[];var scopeText=scopeRows.length?scopeRows.map(function(b){return b.name+' ('+b.branch_code+')'}).join(' • '):((s.effectiveBranchCodes||[]).join(' • ')||'غير محدد');var assigned=0;for(var x=0;x<s.staffList.length;x++){if(s.staffList[x].active_warehouse_role)assigned++}var html='<div class="team-hero mb-4"><div class="flex items-start justify-between gap-3"><div><div class="text-[11px] opacity-75 font-black mb-1">فريقي • نطاق التشغيل</div><div class="text-xl font-black">'+scopeText+'</div><div class="text-xs opacity-80 mt-2">يظهر هنا فقط فريق المخازن داخل نطاقك. اختر المهمة ثم احفظها للعامل المعني؛ المسمى الوظيفي الأساسي لا يتغير.</div></div><div class="text-3xl">👥</div></div><div class="flex flex-wrap gap-2 mt-3"><span class="team-chip">👤 '+s.staffList.length+' عامل</span><span class="team-chip">⚙️ '+assigned+' مكلف</span><span class="team-chip">🔄 '+(s.staffList.length-assigned)+' احتياطي/غير محدد</span></div></div>';html+='<div class="flex flex-col gap-3 mb-4"><input id="teamSearch" class="team-filter" placeholder="ابحث باسم العامل أو البريد أو المسمى أو المهمة..." oninput="App.filterRoster(this.value)"><div class="flex items-center gap-2 text-xs text-slate-400 font-bold"><span>المهمة هنا تشغيلية قابلة للتبديل حسب ضغط العمل؛ لا تغيّر Role الوظيفي الأصلي.</span></div></div>';html+='<div id="teamRosterList">'+s.buildRosterTable(s.staffList,roles,icons)+'</div>';RW_UI.safeHTML(RW_UI.byId('mainContent'),html)},
    buildRosterTable:function(rows,roles,icons){var s=this;if(!rows.length)return '<div class="card text-center text-slate-400 py-10"><div class="text-4xl mb-3">🔎</div><div class="font-black">لا يوجد عمال ضمن نطاق الفرع</div><div class="text-xs mt-2">لا يتم عرض أعضاء من فروع أخرى.</div></div>';var html='<div class="team-table-wrap"><table class="team-table"><thead><tr><th>العامل</th><th>المسمى الوظيفي</th><th>نطاق العامل</th><th>المهمة الحالية</th><th>المهمة الجديدة</th><th>حالة التغيير</th><th>الإجراء</th></tr></thead><tbody>';for(var i=0;i<rows.length;i++){var emp=rows[i],role=emp.active_warehouse_role||'احتياطي',jobLabel=emp.role||'مخزني',branchCodes=s.normalizeBranchCodes(emp.allowed_branch_ids);if(emp.default_branch_id){for(var b=0;b<(s.branchRows||[]).length;b++){if(s.branchRows[b].id===emp.default_branch_id&&branchCodes.indexOf(s.branchRows[b].branch_code)===-1)branchCodes.unshift(s.branchRows[b].branch_code)}}var branchText=branchCodes.length?branchCodes.join(' • '):'نطاق غير محدد';var safeName=String(emp.name||emp.email||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');var safeEmail=String(emp.email||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');html+='<tr class="team-row" data-team-row="'+(safeName+' '+safeEmail+' '+role+' '+jobLabel+' '+branchText).toLowerCase()+'" data-user-id="'+emp.id+'"><td><div class="font-black text-slate-800">'+safeName+'</div><div class="text-xs text-slate-400 mt-1">'+safeEmail+'</div></td><td><span class="team-row-muted">'+jobLabel+'</span></td><td><span class="team-row-muted">'+branchText+'</span></td><td><span class="team-current">'+(icons[role]||'🪑')+' '+role+'</span></td><td><select class="team-role-select" data-user-id="'+emp.id+'" data-original-role="'+role+'" onchange="App.queueRoleChange(this.dataset.userId,this.value)">';for(var j=0;j<roles.length;j++)html+='<option value="'+roles[j]+'"'+(roles[j]===role?' selected':'')+'>'+(icons[roles[j]]||'')+' '+roles[j]+'</option>';html+='</select></td><td><span id="team-pending-'+emp.id+'" class="hidden team-pending">● غير محفوظ</span><span id="team-saved-'+emp.id+'" class="team-row-muted">لا توجد تغييرات</span></td><td><button id="team-save-'+emp.id+'" class="team-save-btn" disabled onclick="App.saveRole(\''+emp.id+'\')"><i class="fa-solid fa-floppy-disk ml-1"></i> حفظ</button></td></tr>'}html+='</tbody></table></div>';return html},
    filterRoster:function(query){var q=String(query||'').trim().toLowerCase(),rows=document.querySelectorAll('[data-team-row]');for(var i=0;i<rows.length;i++)rows[i].style.display=(!q||rows[i].getAttribute('data-team-row').indexOf(q)!==-1)?'table-row':'none'},
    queueRoleChange:function(userId,newRole){var rows=document.querySelectorAll('.team-role-select[data-user-id="'+userId+'"]');if(!rows.length)return;var select=rows[0],original=select.getAttribute('data-original-role')||'';var pending=RW_UI.byId('team-pending-'+userId),saved=RW_UI.byId('team-saved-'+userId),save=RW_UI.byId('team-save-'+userId);var changed=newRole!==original;if(changed){if(pending){pending.classList.remove('hidden')}if(saved){saved.classList.add('hidden')}if(save){save.disabled=false}}else{if(pending){pending.classList.add('hidden')}if(saved){saved.classList.remove('hidden');saved.innerText='لا توجد تغييرات'}if(save){save.disabled=true}}},
    saveRole:function(userId){var s=this,selects=document.querySelectorAll('.team-role-select[data-user-id="'+userId+'"]');if(!selects.length)return;var select=selects[0],newRole=select.value,original=select.getAttribute('data-original-role')||'';if(!userId||!newRole||newRole===original)return;var save=RW_UI.byId('team-save-'+userId),pending=RW_UI.byId('team-pending-'+userId),saved=RW_UI.byId('team-saved-'+userId);if(save)save.disabled=true;RW_UI.showLoader('جاري حفظ مهمة العامل...');supabase.rpc('set_active_warehouse_role',{p_user_id:userId,p_role:newRole}).then(function(r){RW_UI.hideLoader();if(r.error){if(save)save.disabled=false;Swal.fire({title:'تعذر حفظ المهمة',text:r.error.message,icon:'error'});return}for(var i=0;i<s.staffList.length;i++){if(s.staffList[i].id===userId){s.staffList[i].active_warehouse_role=newRole;break}}if(pending)pending.classList.add('hidden');if(saved){saved.classList.remove('hidden');saved.innerText='✓ تم الحفظ'}RW_UI.toast('تم حفظ مهمة '+newRole+' للعامل بنجاح','success');setTimeout(function(){s.renderRoster()},450)})},
    renderLive:function()'''
          ns,n=pattern.subn(replacement,s,count=1)
          if n!=1:
              raise SystemExit('Expected roster block not found')
          p.write_text(ns,encoding='utf-8')
          PY
          git diff --check
          git diff -- Current/PWA/warehouse.supervisor
      - name: Commit final file and remove workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'rawaea-automation'
          git config user.email 'rawaea-automation@users.noreply.github.com'
          git add Current/PWA/warehouse.supervisor
          git rm .github/workflows/forensic_team_ui_patch.yml
          git commit -m 'chore: finalize warehouse supervisor team ui'
          git push origin main
