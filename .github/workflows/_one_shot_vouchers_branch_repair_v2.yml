name: one-shot-vouchers-branch-repair-v2

on:
  push:
    paths:
      - '.github/workflows/_one_shot_vouchers_branch_repair_v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch vouchers.html and remove one-shot workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Current/PWA/vouchers.html')
          s = p.read_text(encoding='utf-8')

          # Remove two obsolete overlapping override layers. Their useful Gold Master base remains intact.
          patterns = [
              r'\n/\* INLINE DIRECT-SALE REPRESENTATIVE GOLD CAPABILITY 2026-08-20 \*/.*?\n\}\)\(\);\n(?=\n/\* FINAL FORENSIC BRANCH-LINKED REPAIR 2026-08-20 \*/)',
              r'\n/\* FINAL FORENSIC BRANCH-LINKED REPAIR 2026-08-20 \*/.*?\n\}\)\(\);\n(?=</script>)'
          ]
          for pat in patterns:
              s, n = re.subn(pat, '\n', s, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Expected one obsolete override for pattern, found {n}')

          block = r'''\n/* FINAL BRANCH-SCOPED VOUCHER ENTITY REPAIR 2026-08-20 */\n(function(){\n  'use strict';\n  if(typeof App==='undefined'||typeof supabase==='undefined'||App.__BRANCH_SCOPED_ENTITY_REPAIR_20260820__)return;\n  App.__BRANCH_SCOPED_ENTITY_REPAIR_20260820__=true;\n\n  function A(v){\n    if(v==null)return [];\n    if(Array.isArray(v))return v.map(String);\n    var s=String(v).trim();\n    if(!s)return [];\n    try{var j=JSON.parse(s);if(Array.isArray(j))return j.map(String);if(typeof j==='string')return [j];}catch(e){}\n    return s.split(',').map(function(x){return x.trim()}).filter(Boolean);\n  }\n  function branchMatch(u,b){\n    if(!u||!b)return false;\n    if(String(u.default_branch_id||'')===String(b.id))return true;\n    var a=A(u.allowed_branch_ids);\n    return a.indexOf(String(b.id))>=0||a.indexOf(String(b.branch_code||''))>=0;\n  }\n  function vehicleBranchId(s,v){\n    var map=s.refs&&s.refs.vehicleBranchMap||{};\n    if(map[v.id])return map[v.id];\n    var code='VAN-'+String(v.vehicle_code||'').trim().toUpperCase();\n    var b=(s.refs.branches||[]).find(function(x){return String(x.branch_code||'').trim().toUpperCase()===code});\n    return b?b.id:null;\n  }\n  function label(x,t){if(!x)return '';if(t==='rep')return x.name||x.email||'';if(t==='vehicle')return x.vehicle_code||x.license_plate||x.model||'';if(t==='supplier')return x.name||x.supplier_code||'';return x.name||x.branch_code||'';}\n  function code(x,t){if(!x)return '';if(t==='rep')return x.email||x.phone||'';if(t==='vehicle')return x.vehicle_code||x.license_plate||'';if(t==='supplier')return x.supplier_code||x.phone||'';return x.branch_code||'';}\n  function rank(x,z,t){if(!z)return 1;var a=App.norm(label(x,t)),b=App.norm(code(x,t));return a===z||b===z?150:a.indexOf(z)===0?115:b.indexOf(z)===0?110:a.indexOf(z)>=0?70:b.indexOf(z)>=0?60:0;}\n\n  var baseLoadRefs=App.loadRefs;\n  App.loadRefs=function(){\n    var s=this;\n    return Promise.all([\n      Promise.resolve(baseLoadRefs.call(this)),\n      supabase.from('users').select('id,name,email,phone,role,status,default_branch_id,allowed_branch_ids').eq('company_id',s.company).eq('status','Active').eq('role','مندوب بيع مباشر').order('name'),\n      supabase.from('vehicles').select('id,vehicle_code,license_plate,model,driver_id,status').eq('company_id',s.company).eq('status','Active').order('vehicle_code'),\n      supabase.from('suppliers').select('id,supplier_code,name,search_label,phone,is_active').eq('company_id',s.company).eq('is_active',true).order('name'),\n      supabase.from('purchase_orders').select('supplier_id,branch_id').eq('company_id',s.company).not('supplier_id','is',null).not('branch_id','is',null)\n    ]).then(function(r){\n      for(var i=1;i<5;i++)if(r[i].error)throw r[i].error;\n      s.refs=s.refs||{};s.refs.reps=r[1].data||[];s.refs.vehicles=r[2].data||[];s.refs.suppliers=r[3].data||[];\n      s.refs.vehicleBranchMap={};\n      (s.refs.vehicles||[]).forEach(function(v){var vb=vehicleBranchId(s,v);if(vb)s.refs.vehicleBranchMap[v.id]=vb;});\n      s.refs.supplierBranchMap={};\n      (r[4].data||[]).forEach(function(x){if(x.supplier_id&&x.branch_id)(s.refs.supplierBranchMap[x.branch_id]||(s.refs.supplierBranchMap[x.branch_id]={}))[x.supplier_id]=1;});\n      return s.refs;\n    });\n  };\n\n  var basePickArr=App.pickArr;\n  App.pickArr=function(key){\n    var s=this,from=(document.getElementById('wsFrom')||{}).value||'',b=(s.refs.branches||[]).find(function(x){return x.id===from});\n    if(key==='wsRep'){\n      if(this.type==='DirectReturn'){\n        var v=(s.refs.vehicles||[]).find(function(x){return x.id===from});\n        var vb=v&&vehicleBranchId(s,v),mb=(s.refs.branches||[]).find(function(x){return x.id===vb});\n        return (s.refs.reps||[]).filter(function(r){return !mb||branchMatch(r,mb)});\n      }\n      return (s.refs.reps||[]).filter(function(r){return !b||branchMatch(r,b)});\n    }\n    if(this.type==='DirectSale'&&key==='wsTo')return (s.refs.vehicles||[]).filter(function(v){var vb=vehicleBranchId(s,v);return !!vb&&(!b||vb===b.id)});\n    if(this.type==='DirectReturn'&&key==='wsFrom')return (s.refs.vehicles||[]).filter(function(v){return !!vehicleBranchId(s,v)});\n    if(this.type==='SupplierReturn'&&key==='wsTo'){var m=(s.refs.supplierBranchMap||{})[from];return m?(s.refs.suppliers||[]).filter(function(x){return !!m[x.id]}):[];}\n    return basePickArr.call(this,key);\n  };\n\n  var basePickSearch=App.pickSearch;\n  App.pickSearch=function(key,q){\n    var t=key==='wsRep'?'rep':(key==='wsTo'&&this.type==='DirectSale'||key==='wsFrom'&&this.type==='DirectReturn')?'vehicle':key==='wsTo'&&this.type==='SupplierReturn'?'supplier':null;\n    if(!t)return basePickSearch.call(this,key,q);\n    var s=this,arr=this.pickArr(key)||[],z=this.norm(q),box=RW_UI.byId(key+'Menu');if(!box)return;\n    var rows=arr.map(function(x){return{x:x,score:rank(x,z,t)}}).filter(function(o){return o.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,15);\n    box.innerHTML=rows.length?rows.map(function(o){var x=o.x;return '<div class="smart-row" onclick="App.pickSelect(\\''+key+'\\',\\''+s.esc(x.id)+'\\')"><div><b class="text-xs text-white">'+s.esc(label(x,t))+'</b><div class="smart-code">'+s.esc(code(x,t))+'</div></div><span class="text-[9px] text-emerald-400">اختيار</span></div>';}).join(''):'<div class="smart-empty">لا توجد نتائج مرتبطة بالفرع المحدد</div>';\n    box.classList.remove('hidden');\n  };\n\n  var basePickSelect=App.pickSelect;\n  App.pickSelect=function(key,id){\n    var s=this;\n    if(key==='wsRep'){\n      var r=(s.refs.reps||[]).find(function(x){return x.id===id});\n      if(!r)return;\n      var from=(document.getElementById('wsFrom')||{}).value||'',b=null;\n      if(this.type==='DirectReturn'){var v=(s.refs.vehicles||[]).find(function(x){return x.id===from}),vb=v&&vehicleBranchId(s,v);b=(s.refs.branches||[]).find(function(x){return x.id===vb});}else b=(s.refs.branches||[]).find(function(x){return x.id===from});\n      if(b&&!branchMatch(r,b)){RW_UI.toast('المندوب غير مرتبط بنطاق الفرع المحدد','error');return;}\n      RW_UI.byId('wsRep').value=id;RW_UI.byId('wsRepSearch').value=label(r,'rep');RW_UI.byId('wsRepMenu').classList.add('hidden');s.summary();return;\n    }\n    if((key==='wsTo'&&s.type==='DirectSale')||(key==='wsFrom'&&s.type==='DirectReturn')){\n      var arr=s.pickArr(key),v=arr.find(function(x){return x.id===id});if(!v)return;\n      RW_UI.byId(key).value=id;RW_UI.byId(key+'Search').value=label(v,'vehicle');RW_UI.byId(key+'Menu').classList.add('hidden');s.summary();return;\n    }\n    if(key==='wsTo'&&s.type==='SupplierReturn'){\n      var sp=(s.refs.suppliers||[]).find(function(x){return x.id===id}),bid=(document.getElementById('wsFrom')||{}).value||'',m=(s.refs.supplierBranchMap||{})[bid];\n      if(!sp||!m||!m[sp.id]){RW_UI.toast('المورد غير مرتبط بالفرع المحدد في البيانات الحالية','error');return;}\n      RW_UI.byId('wsTo').value=id;RW_UI.byId('wsToSearch').value=label(sp,'supplier');RW_UI.byId('wsToMenu').classList.add('hidden');s.summary();return;\n    }\n    return basePickSelect.call(this,key,id);\n  };\n\n  var baseRouteHtml=App.routeHtml;\n  App.routeHtml=function(){\n    var s=this,t=this.type;\n    function picker(key,txt,ro){return '<div class="smart-field"><input type="hidden" id="'+key+'" value=""><input id="'+key+'Search" class="smart-input" autocomplete="off" '+(ro?'readonly ':'')+'placeholder="'+txt+' — ابحث بالاسم أو الكود" onfocus="App.pickShow(\\''+key+'\\')" oninput="App.pickSearch(\\''+key+'\\',this.value)"><div id="'+key+'Menu" class="smart-menu hidden"></div></div>';}\n    if(t==='DirectSale')return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+picker('wsFrom','الفرع المصدر',false)+picker('wsRep','مندوب البيع المباشر — تابع لنطاق الفرع',false)+picker('wsTo','المركبة — فرع متنقل مرتبط بالمصدر',false)+'</div>';\n    if(t==='DirectReturn')return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+picker('wsFrom','المركبة المصدر — فرع متنقل',false)+picker('wsRep','مندوب البيع المباشر — تابع لنطاق الفرع',true)+picker('wsTo','الفرع الوجهة',false)+'</div>';\n    if(t==='SupplierReturn')return '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'+picker('wsFrom','الفرع المصدر',false)+picker('wsTo','المورد — مرتبط بالفرع حسب البيانات الموثقة',false)+'</div>';\n    return baseRouteHtml.call(this);\n  };\n\n  var baseSummary=App.summary;\n  App.summary=function(){\n    var s=this,fr=RW_UI.byId('wsFrom'),re=RW_UI.byId('wsRep'),to=RW_UI.byId('wsTo'),t='';\n    if(this.type==='DirectSale'){if(fr&&fr.value)t+='المصدر: '+s.loc(fr.value,'Branch');if(re&&re.value){var r=(s.refs.reps||[]).find(function(x){return x.id===re.value});if(r)t+=(t?' · ':'')+'المندوب: '+label(r,'rep')}if(to&&to.value)t+=(t?' · ':'')+'المركبة: '+s.loc(to.value,'Vehicle');RW_UI.safeText(RW_UI.byId('routeSummary'),t||'اختر الفرع ثم المندوب والمركبة');return;}\n    if(this.type==='DirectReturn'){if(fr&&fr.value)t+='المركبة: '+s.loc(fr.value,'Vehicle');if(re&&re.value){var rr=(s.refs.reps||[]).find(function(x){return x.id===re.value});if(rr)t+=(t?' · ':'')+'المندوب: '+label(rr,'rep')}if(to&&to.value)t+=(t?' · ':'')+'الفرع: '+s.loc(to.value,'Branch');RW_UI.safeText(RW_UI.byId('routeSummary'),t||'اختر المركبة والمندوب والفرع');return;}\n    if(this.type==='SupplierReturn'){if(fr&&fr.value)t+='المصدر: '+s.loc(fr.value,'Branch');if(to&&to.value)t+=(t?' · ':'')+'المورد: '+s.loc(to.value,'Supplier');RW_UI.safeText(RW_UI.byId('routeSummary'),t||'اختر الفرع ثم المورد المرتبط به');return;}\n    return baseSummary.call(this);\n  };\n\n  var baseSubmit=App.submit;\n  App.submit=function(){\n    var s=this;\n    if(this.mode==='voucher'&&this.type==='DirectSale'){\n      var bid=(document.getElementById('wsFrom')||{}).value||'',rid=(document.getElementById('wsRep')||{}).value||'',vid=(document.getElementById('wsTo')||{}).value||'';\n      var b=(s.refs.branches||[]).find(function(x){return x.id===bid}),r=(s.refs.reps||[]).find(function(x){return x.id===rid}),v=(s.refs.vehicles||[]).find(function(x){return x.id===vid}),vb=v&&vehicleBranchId(s,v);\n      if(!bid||!rid||!vid||!b||!r||!v||!branchMatch(r,b)||vb!==bid){RW_UI.toast('الفرع والمندوب والمركبة يجب أن تكون ضمن نطاق الفرع المحدد','error');return;}\n    }\n    if(this.mode==='voucher'&&this.type==='DirectReturn'){\n      var vid2=(document.getElementById('wsFrom')||{}).value||'',rid2=(document.getElementById('wsRep')||{}).value||'',dest=(document.getElementById('wsTo')||{}).value||'';\n      var v2=(s.refs.vehicles||[]).find(function(x){return x.id===vid2}),r2=(s.refs.reps||[]).find(function(x){return x.id===rid2}),vb2=v2&&vehicleBranchId(s,v2);\n      if(!vid2||!rid2||!dest||!v2||!r2||!vb2){RW_UI.toast('المركبة والمندوب والفرع الوجهة مطلوبة وصحيحة','error');return;}\n    }\n    if(this.mode==='voucher'&&this.type==='SupplierReturn'){\n      var sb=(document.getElementById('wsFrom')||{}).value||'',st=(document.getElementById('wsTo')||{}).value||'',m=(s.refs.supplierBranchMap||{})[sb];\n      if(!sb||!st||!m||!m[st]){RW_UI.toast('لا يمكن اختيار مورد غير مثبت ارتباطه بالفرع في البيانات الحالية','error');return;}\n    }\n    return baseSubmit.apply(this,arguments);\n  };\n\n  console.info('[VOUCHERS] branch-scoped entity repair loaded');\n})();\n'''

          s += block
          p.write_text(s, encoding='utf-8')
          PY

          # Static integrity audit: syntax and forbidden writer/legacy patterns.
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S))
          Path('/tmp/vouchers.js').write_text(js,encoding='utf-8')
          assert 'vehicle.driver_id===rid' not in s, 'old representative/vehicle coupling remained'
          assert 'FINAL FORENSIC BRANCH-LINKED REPAIR 2026-08-20' not in s, 'old final override remained'
          assert 'INLINE DIRECT-SALE REPRESENTATIVE GOLD CAPABILITY 2026-08-20' not in s, 'old inline override remained'
          assert 'FINAL BRANCH-SCOPED VOUCHER ENTITY REPAIR 2026-08-20' in s, 'new final block missing'
          assert '.from(\'stock_branches\').update' not in s, 'direct stock update present'
          assert '.from(\'inventory_log\').insert' not in s, 'direct inventory-log insert present'
          PY
          node --check /tmp/vouchers.js
          git diff --check

          git config user.name 'rawaea-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/vouchers.html
          git rm -f .github/workflows/_one_shot_vouchers_branch_repair.yml .github/workflows/_one_shot_vouchers_branch_repair_v2.yml 2>/dev/null || true
          git commit -m "fix: consolidate branch-scoped voucher pickers" || exit 0
          git push
