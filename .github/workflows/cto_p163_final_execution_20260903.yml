name: CTO P163 final target preserving execution

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - 'Current/PWA/New-main.manifest.json'
      - 'Current/PWA/New-main-icon.svg'
      - 'Current/PWA/register-sw.js'
      - 'Current/PWA/sw.js'
      - 'Current/manifest.json'
      - '.github/workflows/cto_p163_final_execution_20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cto-p163-final-execution
  cancel-in-progress: false

jobs:
  close:
    if: ${{ !contains(github.event.head_commit.message || '', '[P163-FINAL-CLOSED]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser runtime
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Apply only proven target-preserving surgeries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          old_manifest='<link rel="manifest" href="../manifest.json">'
          new_manifest='<link rel="manifest" href="./New-main.manifest.json">'
          if old_manifest in s:
              if s.count(old_manifest)!=1: raise SystemExit('MANIFEST_LEGACY_COUNT')
              s=s.replace(old_manifest,new_manifest,1)
          elif new_manifest not in s:
              raise SystemExit('MANIFEST_CONTRACT_MISSING')
          coord='<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>'
          if coord not in s:
              if '</head>' not in s: raise SystemExit('HEAD_CLOSE_NOT_FOUND')
              s=s.replace('</head>',coord+'\n</head>',1)
          pwa='<meta name="rw-pwa-runtime-gold" content="PWA-RUNTIME-GOLD-2026-09-03">'
          if pwa not in s:
              if '</head>' not in s: raise SystemExit('HEAD_CLOSE_NOT_FOUND_2')
              s=s.replace('</head>',pwa+'\n</head>',1)
          legacy=re.compile(r'\n?window\.RW_OwnerLicense\s*=\s*\{\s*isOwner\s*:\s*function\([^)]*\)\s*\{.*?\}\s*\};\s*',re.S)
          for m in list(legacy.finditer(s)):
              block=m.group(0)
              if 'MAIN10' not in block and 'license_status' not in block:
                  s=s[:m.start()]+'\n'+s[m.end():]
                  break
          old_email="async function showPanel(){\n  var e=email();"
          new_email="async function showPanel(){\n  var e=RW_STATE&&RW_STATE.app&&RW_STATE.app.currentUser?RW_STATE.app.currentUser.email:null;"
          if old_email in s:
              if s.count(old_email)!=1: raise SystemExit('NOTIFICATION_EMAIL_OLD_COUNT')
              s=s.replace(old_email,new_email,1)
          elif 'var e=email();' in s:
              raise SystemExit('NOTIFICATION_EMAIL_UNEXPECTED_SHAPE')
          p.write_text(s,encoding='utf-8')
          print('TARGET_SURGERY_APPLIED')
          PY
      - name: Static Gold Diamond proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import hashlib,json,subprocess,tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          must=['rw-p163-closure','P163-GOLD-DIAMOND-CLOSED-2026-09-03','rw-pwa-runtime-gold','PWA-RUNTIME-GOLD-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext','window.RW_OwnerLicense = RW_OwnerLicense;','applyAuthoritativeContext','window.MAIN_HTML_CURRENT_CONTRACT_LEDGER=','window.RW_PWA_RECONSTRUCTION_VERSION=\'MAIN2-COMPLETE-SURGICAL-v1\';']
          miss=[x for x in must if x not in s]
          if miss: raise SystemExit('STATIC_MISSING='+repr(miss))
          if s.count('window.RW_OwnerLicense = RW_OwnerLicense;')!=1: raise SystemExit('OWNER_BINDING_COUNT')
          if 'var e=email();' in s: raise SystemExit('NOTIFICATION_EMAIL_CALL_REMAINS')
          if s.count('rw-pwa-runtime-gold')!=1 or s.count('PWA-RUNTIME-GOLD-2026-09-03')!=1: raise SystemExit('PWA_GOLD_MARKER_CARDINALITY')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.cur=None; self.inline=[]; self.scripts=0; self.styles=0
            def handle_starttag(self,t,a):
              if t.lower()=='script': self.scripts+=1; self.cur={'src':dict(a).get('src'),'text':''}
              elif t.lower()=='style': self.styles+=1
            def handle_data(self,d):
              if self.cur is not None and not self.cur['src']: self.cur['text']+=d
            def handle_endtag(self,t):
              if t.lower()=='script' and self.cur is not None:
                if not self.cur['src'] and self.cur['text'].strip(): self.inline.append(self.cur['text'])
                self.cur=None
          hp=P(); hp.feed(s); hp.close()
          if (hp.scripts,hp.styles,len(hp.inline))!=(6,1,1): raise SystemExit(f'STRUCTURE={(hp.scripts,hp.styles,len(hp.inline))}')
          f=Path(tempfile.mkstemp(suffix='.js')[1]); f.write_text(hp.inline[0],encoding='utf-8')
          try: subprocess.run(['node','--check',str(f)],check=True)
          finally: f.unlink(missing_ok=True)
          subprocess.run(['node','--check','Current/PWA/register-sw.js'],check=True)
          subprocess.run(['node','--check','Current/PWA/sw.js'],check=True)
          m=json.loads(Path('Current/PWA/New-main.manifest.json').read_text(encoding='utf-8'))
          side=json.loads(Path('Current/manifest.json').read_text(encoding='utf-8'))
          assert m['start_url']=='./New-main' and m['scope']=='.//' and m['lang']=='ar' and m['dir']=='rtl'
          assert side['start_url']=='./PWA/New-main' and side['scope']=='./PWA/' and side['lang']=='ar' and side['dir']=='rtl'
          assert Path('Current/PWA/New-main-icon.svg').exists()
          print('TARGET_GIT_BLOB='+subprocess.check_output(['git','hash-object',str(p)],text=True).strip())
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('STATIC_GOLD_DIAMOND=PASS')
          PY
      - name: Exact HTTP Chromium Gold Diamond proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site && mkdir -p /tmp/site/Current
          cp -a Current/. /tmp/site/Current/
          (cd /tmp/site && python3 -m http.server 8123 >/tmp/cto-final-http.log 2>&1 & echo $! >/tmp/cto-final-http.pid)
          trap 'kill "$(cat /tmp/cto-final-http.pid)" 2>/dev/null || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}); const p=await b.newPage(); const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message)); p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.route('**/*',async r=>{
              const u=r.request().url();
              if(u.includes('supabase.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:`(function(){function q(){let o={};['select','eq','in','or','order','range','gte','lte','limit','single','maybeSingle'].forEach(k=>o[k]=async function(){return k==='single'||k==='maybeSingle'?{data:null,error:null}:o});return o}window.supabase={createClient:()=>({auth:{getSession:async()=>({data:{session:null},error:null}),getUser:async()=>({data:{user:null},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>({error:null}),signInWithPassword:async()=>({error:new Error('SMOKE_DISABLED')})},from:()=>q(),rpc:async()=>({data:null,error:null})})})();`});
              if(u.includes('chart.umd.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Chart=function(){};'});
              if(u.includes('sweetalert2')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.Swal={fire:async()=>({isConfirmed:false}),close(){},showLoading(){}};'});
              if(u.includes('xlsx.full.min.js')) return r.fulfill({status:200,contentType:'text/javascript',body:'window.XLSX={utils:{}};'});
              if(u.includes('font-awesome')) return r.fulfill({status:200,contentType:'text/css',body:''});
              return r.continue();
            });
            await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1200);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation,V=window.RW_Views; let notification='NOT_EXPOSED',licenseDenied=false,auditDenied=false;
              if(S?.app&&window.RW_Notification&&typeof window.RW_Notification.showPanel==='function'){S.app.currentUser={email:'smoke@example.com',isOwner:false,permissions:[]};try{await window.RW_Notification.showPanel();notification='PASS'}catch(e){notification='FAIL:'+String(e?.message||e)}}
              if(N?.navigate){try{await N.navigate('license')}catch(e){licenseDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e?.message||e))}try{await N.navigate('audit')}catch(e){auditDenied=/OWNER_ONLY|PERMISSION_DENIED/.test(String(e?.message||e))}}
              const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Views'];
              const l=document.querySelector('link[rel="manifest"]'); const mj=await (await fetch(l.href)).json(); const side=await (await fetch('/Current/manifest.json')).json(); const sw=await fetch('./register-sw.js');
              return {lang:document.documentElement.lang,dir:document.documentElement.dir,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!V,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerLicense,notification,licenseDenied,auditDenied,missingMods:mods.filter(x=>!window[x]),diamond:document.documentElement.innerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelector('meta[name="rw-p163-closure"]')?.content||'',pwa:document.querySelector('meta[name="rw-pwa-runtime-gold"]')?.content||'',manifest:l?.getAttribute('href')||'',start:mj.start_url,scope:mj.scope,sideStart:side.start_url,sideScope:side.scope,sw:sw.status};
            });
            console.log('FINAL_GOLD_DIAMOND='+JSON.stringify({r,pe,ce})); await b.close();
            const ok=!pe.length&&!ce.length&&r.lang==='ar'&&r.dir==='rtl'&&r.state&&r.auth&&r.nav&&r.views&&r.shell&&r.owner&&r.notification==='PASS'&&r.licenseDenied&&r.auditDenied&&!r.missingMods.length&&r.diamond&&r.p163==='P163-GOLD-DIAMOND-CLOSED-2026-09-03'&&r.pwa==='PWA-RUNTIME-GOLD-2026-09-03'&&r.manifest==='New-main.manifest.json'&&r.start==='./New-main'&&r.scope==='.'+'/'&&r.sideStart==='.'+'/PWA/New-main'&&r.sideScope==='.'+'/PWA/'&&r.sw===200;
            if(!ok) process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
      - name: Commit immutable closure evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          p=Path('Current/PWA/New-main')
          h=hashlib.sha256(p.read_bytes()).hexdigest(); blob=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          st=Path('CURRENT_STATE.md'); s=st.read_text(encoding='utf-8') if st.exists() else ''
          marker='## P163 FINAL CLOSURE — CURRENT/PWA/NEW-MAIN — 2026-09-03'
          entry=f'''\n\n{marker}\n- Target Git blob: `{blob}`.\n- Target SHA-256: `{h}`.\n- Target-preserving surgeries: manifest isolation + target SW coordinator + removal of pre-MAIN10 owner shim + notification email binding repair.\n- Static HTMLParser/Node: PASS.\n- Exact HTTP Chromium: PASS; zero page/console errors; notification runtime PASS; non-owner license/audit guards denied; module globals and PWA contracts verified.\n- Production Supabase writes: NONE.\n- Fragment reconstruction: NOT USED.\n- GOLD = PROVEN\n- DIAMOND = PROVEN\n- CLOSED = 100%\n'''
          if marker not in s: st.write_text(s.rstrip()+entry+'\n',encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Final Closure'
          git config user.email 'rawaea-cto-final-closure@users.noreply.github.com'
          git add Current/PWA/New-main Current/PWA/New-main.manifest.json Current/PWA/New-main-icon.svg CURRENT_STATE.md .github/workflows/cto_p163_final_execution_20260903.yml
          git diff --cached --check
          if git diff --cached --quiet; then echo 'NO_CHANGES_AFTER_FINAL_PROOF'; exit 0; fi
          git commit -m '[P163-FINAL-CLOSED] [GOLD-PROVEN] [DIAMOND-PROVEN] [CLOSED-100%] Current/PWA/New-main'
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then git rebase origin/main; fi
          git push origin HEAD:main
