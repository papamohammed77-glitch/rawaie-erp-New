name: RAWAEA reconstruct PWA fragments (forensic gated)

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify canonical main and inventory fragments without overwriting sources
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'); const crypto=require('crypto');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const firstDiff=(a,b)=>{const n=Math.min(a.length,b.length);for(let i=0;i<n;i++)if(a[i]!==b[i])return i;return a.length===b.length?-1:n;};
          const normalizeCanonical=b=>{
            const s=b.toString('utf8');
            if(!/^<!DOCTYPE html>\n<!-- \d{4}-\d{2}-\d{2} \d{2}:\d{2} UTC -->/i.test(s)) throw new Error('CANONICAL_MAIN_HEADER_INVALID');
            return s.replace(/^<!DOCTYPE html>\n<!-- \d{4}-\d{2}-\d{2} \d{2}:\d{2} UTC -->/i,'<!DOCTYPE html>\n<!-- GENERATED_HEADER_NORMALIZED -->');
          };
          const currentMain=fs.readFileSync('Current/PWA/main.html');
          const originalMain=fs.readFileSync('Original/PWA/main.html');
          const currentNorm=Buffer.from(normalizeCanonical(currentMain),'utf8');
          const originalNorm=Buffer.from(normalizeCanonical(originalMain),'utf8');
          const exact=Buffer.compare(currentMain,originalMain)===0;
          const normalizedEquivalent=Buffer.compare(currentNorm,originalNorm)===0;
          const firstDifference=firstDiff(currentMain,originalMain);
          const normalizedFirstDifference=firstDiff(currentNorm,originalNorm);
          if(!normalizedEquivalent) throw new Error(`CANONICAL_MAIN_NOT_EQUIVALENT firstDiff=${firstDifference} normalizedFirstDiff=${normalizedFirstDifference}`);

          const rows=[];
          for(let i=1;i<=11;i++){
            const cp=`Current/PWA/main/main${i}.md`;
            const op=`Original/PWA/main/main${i}.md`;
            if(!fs.existsSync(cp)||!fs.existsSync(op)) throw new Error(`FRAGMENT_MISSING main${i}`);
            const cb=fs.readFileSync(cp), ob=fs.readFileSync(op);
            rows.push({module:`main${i}`,current_bytes:cb.length,current_sha256:sha(cb),original_bytes:ob.length,original_sha256:sha(ob),exact_byte_match:Buffer.compare(cb,ob)===0,first_difference_vs_original:firstDiff(cb,ob)});
          }

          const report={
            generated_at:new Date().toISOString(),
            contract:'READ_ONLY_FORENSIC_FRAGMENT_INVENTORY',
            canonical_main:{bytes:currentMain.length,sha256:sha(currentMain),original_bytes:originalMain.length,original_sha256:sha(originalMain),exact_byte_match:exact,normalized_equivalent:normalizedEquivalent,metadata_only_difference:!exact&&normalizedEquivalent,first_difference_byte:firstDifference,normalized_first_difference_byte:normalizedFirstDifference},
            current_logical_fragments:rows,
            source_mutation:false,
            candidate_sources_preserved:true
          };
          fs.mkdirSync('Current/CTO',{recursive:true});
          fs.writeFileSync('Current/CTO/PWA_FRAGMENT_RECONSTRUCTION_REPORT.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Validate current logical fragments structurally
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'); const path=require('path');
          const names=Array.from({length:11},(_,i)=>`main${i+1}.md`);
          const joined=names.map(n=>fs.readFileSync(path.join('Current/PWA/main',n))).join('');
          const checks={doctype:/<!doctype\s+html/i.test(joined),htmlClose:/<\/html>/i.test(joined),scriptOpen:(joined.match(/<script\b/gi)||[]).length,scriptClose:(joined.match(/<\/script>/gi)||[]).length,styleOpen:(joined.match(/<style\b/gi)||[]).length,styleClose:(joined.match(/<\/style>/gi)||[]).length};
          fs.writeFileSync('Current/CTO/PWA_FRAGMENT_RUNTIME_STRUCTURE.json',JSON.stringify(checks,null,2));
          if(!checks.doctype||!checks.htmlClose||checks.scriptOpen!==checks.scriptClose||checks.styleOpen!==checks.styleClose) process.exit(2);
          NODE

      - name: Commit forensic report only
        shell: bash
        run: |
          git config user.name 'rawaea-forensic-bot'
          git config user.email 'rawaea-forensic-bot@users.noreply.github.com'
          git add Current/CTO/PWA_FRAGMENT_RECONSTRUCTION_REPORT.json Current/CTO/PWA_FRAGMENT_RUNTIME_STRUCTURE.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs(forensics): inventory PWA fragments without mutating candidate sources'
          git push
