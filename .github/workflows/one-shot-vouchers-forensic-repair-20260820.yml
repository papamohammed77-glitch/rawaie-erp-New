name: One-shot vouchers forensic repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[vouchers-forensic-repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Surgical patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/vouchers.html')
          text = p.read_text(encoding='utf-8')
          marker = '</script><script src="../register-sw.js"></script>'
          if marker not in text:
              raise SystemExit('REGISTER_SW_MARKER_NOT_FOUND')
          repair = r'''\n<script data-rw-vouchers-forensic-repair="2026-08-20">\n(function(){\n  if(window.__RW_VOUCHERS_FORENSIC_REPAIR_20260820__) return;\n  window.__RW_VOUCHERS_FORENSIC_REPAIR_20260820__=true;\n  if(typeof App==='undefined' || typeof supabase==='undefined') return;\n\n  function esc(v){return App.esc?App.esc(v):String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\"/g,'&quot;').replace(/'/g,'&#39;')}\n  function norm(v){return App.norm?App.norm(v):String(v==null?'':v).toLowerCase().trim()}\n  function parseAllowed(v){\n    if(v==null) return [];\n    if(Array.isArray(v)) return v.map(String);\n    var s=String(v).trim();\n    if(!s) return [];\n    try{var j=JSON.parse(s);if(Array.isArray(j))return j.map(String);if(typeof j==='string')return [j]}catch(e){}\n    return s.split(',').map(function(x){return String(x).trim()}).filter(Boolean);\n  }\n  function branchMatch(user,branch){\n    if(!user||!branch) return false;\n    if(String(user.default_branch_id||'')===String(branch.id)) return true;\n    var a=parseAllowed(user.allowed_branch_ids),id=String(branch.id),code=String(branch.branch_code||'');\n    return a.indexOf(id)>=0 || a.indexOf(code)>=0;\n  }\n  function repLabel(x){return x?(x.name||x.email||'') : ''}\n  function vehicleLabel(x){return x?(x.vehicle_code||x.license_plate||x.model||'') : ''}\n  function supplierLabel(x){return x?(x.name||x.supplier_code||'') : ''}\n  function score(x,z,type){\n    if(!z) return 1;\n    var a='',b='',c='';\n    if(type==='rep'){a=norm(x.name);b=norm(x.email);c=norm(x.phone)}\n    else if(type==='vehicle'){a=norm(x.vehicle_code);b=norm(x.license_plate);c=norm(x.model)}\n    else if(type==='supplier'){a=norm(x.name);b=norm(x.supplier_code);c=norm(x.phone)}\n    else {a=norm(x.name);b=norm(x.branch_code);c=norm(x.location)}\n    return a===z||b===z||c===z?140:a.indexOf(z)===0||b.indexOf(z)===0||c.indexOf(z)===0?110:a.indexOf(z)>=0||b.indexOf(z)>=0||c.indexOf(z)>=0?65:0;\n  }\n\n  var previousLoadRefs=App.loadRefs;\n  App.loadRefs=function(){\n    var s=this;\n    return Promise.all([\n      Promise.resolve(previousLoadRefs.call(this)),\n      supabase.from('users').select('id,name,email,phone,role,status,default_branch_id,allowed_branch_ids').eq('company_id',s.company).eq('status','Active').eq('role','مندوب بيع مباشر').order('name'),\n      supabase.from('purchase_orders').select('supplier_id,branch_id').eq('company_id',s.company).not('supplier_id','is',null),\n      supabase.from('vehicles').select('id,vehicle_code,license_plate,model,driver_id,status').eq('company_id',s.company).eq('status','Active').order('vehicle_code'),\n      supabase.from('suppliers').select('id,supplier_code,name,search_label,phone,is_active').eq('company_id',s.company).eq('is_active',true).order('name')\n    ]).then(function(r){\n      var reps=r[1].data||[],pos=r[2].data||[];\n      if(r[1].error) throw r[1].error;\n      if(r[2].error) throw r[2].error;\n      if(r[3].error) throw r[3].error;\n      if(r[4].error) throw r[4].error;\n      s.refs=s.refs||{};\n      s.refs.reps=reps;\n      s.refs.vehicles=r[3].data||[];\n      s.refs.suppliers=r[4].data||[];\n      s.refs.supplierBranchMap={};\n      pos.forEach(function(x){\n        if(!x.supplier_id||!x.branch_id)return;\n        (s.refs.supplierBranchMap[x.branch_id]||(s.refs.supplierBranchMap[x.branch_id]={}))[x.supplier_id]=1;\n      });\n      s.refs.vehicleBranchMap=s.refs.vehicleBranchMap||{};\n      s.refs.vehicles.forEach(function(v){\n        var code='VAN-'+String(v.vehicle_code||'').trim().toUpperCase();\n        var b=(s.refs.branches||[]).find(function(x){return String(x.branch_code||'').trim().toUpperCase()===code});\n        if(b)s.refs.vehicleBranchMap[b.id]=b.id;\n      });\n      return s.refs;\n    });\n  };\n\n  var previousPickArr=App.pickArr;\n  App.pickArr=function(key){\n    var s=this,branchId=(document.getElementById('wsFrom')||{}).value||'';\n    var branch=(s.refs.branches||[]).find(function(b){return b.id===branchId})||null;\n    if(key==='wsRep'){\n      return (s.refs.reps||[]).filter(function(r){return !branch||branchMatch(r,branch)});\n    }\n    if(key==='wsTo' && s.type==='DirectSale'){\n      var repId=(document.getElementById('wsRep')||{}).value||'';\n      return (s.refs.vehicles||[]).filter(function(v){\n        if(!repId||v.driver_id!==repId) return false;\n        var rep=(s.refs.reps||[]).find(function(r){return r.id===v.driver_id});\n        return !branch || branchMatch(rep,branch);\n      });\n    }\n    if(key==='wsFrom' && s.type==='DirectReturn'){\n      return (s.refs.vehicles||[]).filter(function(v){\n        var rep=(s.refs.reps||[]).find(function(r){return r.id===v.driver_id});\n        return !branch || branchMatch(rep,branch);\n      });\n    }\n    if(key==='wsTo' && s.type==='SupplierReturn'){\n      var mapped=(s.refs.supplierBranchMap||{})[branchId];\n      if(mapped){\n        var ids=Object.keys(mapped);\n        var filtered=(s.refs.suppliers||[]).filter(function(x){return ids.indexOf(x.id)>=0});\n        if(filtered.length) return filtered;\n      }\n      return s.refs.suppliers||[];\n    }\n    return previousPickArr.call(this,key);\n  };\n\n  var previousPickSearch=App.pickSearch;\n  App.pickSearch=function(key,q){\n    var type=key==='wsRep'?'rep':key==='wsTo'&&this.type==='DirectSale'?'vehicle':key==='wsFrom'&&this.type==='DirectReturn'?'vehicle':key==='wsTo'&&this.type==='SupplierReturn'?'supplier':null;\n    if(!type) return previousPickSearch.call(this,key,q);\n    var s=this,arr=this.pickArr(key)||[],z=norm(q),box=document.getElementById(key+'Menu');\n    if(!box)return;\n    var scored=arr.map(function(x){return{x:x,score:score(x,z,type)}}).filter(function(o){return o.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,15);\n    if(!scored.length){\n      var msg=type==='rep'?'لا يوجد مندوب بيع مباشر مرتبط بالفرع المختار':type==='vehicle'?'لا توجد مركبة فعالة مرتبطة بالمندوب/الفرع المختار':'لا يوجد مورد مرتبط بالفرع؛ تم عرض موردي الشركة لأن المخطط الحالي لا يحتوي FK فرع للمورد';\n      box.innerHTML='<div class="smart-empty">'+esc(msg)+'</div>';box.classList.remove('hidden');return;\n    }\n    box.innerHTML=scored.map(function(o){\n      var x=o.x,label=type==='rep'?repLabel(x):type==='vehicle'?vehicleLabel(x):supplierLabel(x),code=type==='rep'?(x.phone||x.email||''):type==='vehicle'?((x.license_plate||'')+' · '+(x.vehicle_code||'')):(x.supplier_code||x.phone||'');\n      return '<div class="smart-row" onclick="App.pickSelect(\\''+key+'\\',\\''+esc(x.id)+'\\')"><div><b class="text-xs text-white">'+esc(label)+'</b><div class="smart-code">'+esc(code)+'</div></div><span class="text-[9px] text-emerald-400">اختيار</span></div>';\n    }).join('');\n    box.classList.remove('hidden');\n  };\n\n  var previousPickSelect=App.pickSelect;\n  App.pickSelect=function(key,id){\n    var s=this;\n    if(key==='wsRep'){\n      var rep=(s.refs.reps||[]).find(function(x){return x.id===id});\n      if(!rep)return;\n      var branchId=(document.getElementById('wsFrom')||{}).value||'',branch=(s.refs.branches||[]).find(function(x){return x.id===branchId});\n      if(branch&&!branchMatch(rep,branch)){RW_UI.toast('المندوب غير مرتبط بالفرع المختار','warning');return;}\n      var h=document.getElementById('wsRep'),hs=document.getElementById('wsRepSearch'),menu=document.getElementById('wsRepMenu');\n      if(h)h.value=id;if(hs)hs.value=repLabel(rep);if(menu)menu.classList.add('hidden');\n      if(s.type==='DirectSale'){var v=document.getElementById('wsTo'),vs=document.getElementById('wsToSearch'),vm=document.getElementById('wsToMenu');if(v)v.value='';if(vs)vs.value='';if(vm)vm.classList.add('hidden');}\n      s.updateSource();return;\n    }\n    if((key==='wsTo'&&s.type==='DirectSale')||(key==='wsFrom'&&s.type==='DirectReturn')){\n      var v=(s.refs.vehicles||[]).find(function(x){return x.id===id});\n      if(!v)return;\n      var branchId=(document.getElementById('wsFrom')||{}).value||'',branch=(s.refs.branches||[]).find(function(x){return x.id===branchId}),rep=(s.refs.reps||[]).find(function(x){return x.id===v.driver_id});\n      if(branch&&(!rep||!branchMatch(rep,branch))){RW_UI.toast('المركبة ليست مرتبطة بمندوب الفرع المختار','warning');return;}\n      if(key==='wsTo'&&s.type==='DirectSale'){\n        var repId=(document.getElementById('wsRep')||{}).value||'';\n        if(!repId){RW_UI.toast('اختر مندوب البيع المباشر أولاً','warning');return;}\n        if(v.driver_id!==repId){RW_UI.toast('المركبة لا تتبع المندوب المختار','warning');return;}\n      }\n      if(key==='wsFrom'){\n        var h=document.getElementById('wsFrom'),hs=document.getElementById('wsFromSearch'),menu=document.getElementById('wsFromMenu');\n        if(h)h.value=id;if(hs)hs.value=vehicleLabel(v);if(menu)menu.classList.add('hidden');\n        var rh=document.getElementById('wsRep'),rs=document.getElementById('wsRepSearch'),rm=document.getElementById('wsRepMenu');\n        if(rh)rh.value=rep?rep.id:'';if(rs)rs.value=rep?repLabel(rep):'';if(rm)rm.classList.add('hidden');\n        s.updateSource();return;\n      }\n      var th=document.getElementById('wsTo'),ts=document.getElementById('wsToSearch'),tm=document.getElementById('wsToMenu');\n      if(th)th.value=id;if(ts)ts.value=vehicleLabel(v);if(tm)tm.classList.add('hidden');s.updateSource();return;\n    }\n    if(key==='wsTo'&&s.type==='SupplierReturn'){\n      var supplier=(s.refs.suppliers||[]).find(function(x){return x.id===id});\n      if(!supplier)return;\n      var branchId2=(document.getElementById('wsFrom')||{}).value||'',map=(s.refs.supplierBranchMap||{})[branchId2];\n      if(map&&Object.keys(map).length&&!(map[supplier.id])){RW_UI.toast('المورد غير مرتبط بالفرع المختار','warning');return;}\n      var sh=document.getElementById('wsTo'),ss=document.getElementById('wsToSearch'),sm=document.getElementById('wsToMenu');if(sh)sh.value=id;if(ss)ss.value=supplierLabel(supplier);if(sm)sm.classList.add('hidden');s.updateSource();return;\n    }\n    return previousPickSelect.call(this,key,id);\n  };\n\n  var previousRouteHtml=App.routeHtml;\n  App.routeHtml=function(){\n    var s=this,t=this.type;\n    function picker(key,label,opts){opts=opts||{};return '<div class="smart-field"><input type="hidden" id="'+key+'" value=""><input id="'+key+'Search" class="smart-input" autocomplete="off" '+(opts.readonly?'readonly ':'')+(opts.disabled?'disabled ':'')+'placeholder="'+esc(label)+'" onfocus="App.pickShow(\\''+key+'\\')" oninput="App.pickSearch(\\''+key+'\\',this.value)"><div id="'+key+'Menu" class="smart-menu hidden"></div></div>"'}\n    if(t==='DirectSale') return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+picker('wsFrom','الفرع المصدر — ابحث بالكود أو الاسم')+picker('wsRep','مندوب البيع المباشر — مرتبط بالفرع')+picker('wsTo','المركبة — مرتبطة بالمندوب المختار')+'</div>' ;\n    if(t==='DirectReturn') return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+picker('wsFrom','المركبة المصدر — مرتبطة بالفرع')+picker('wsRep','مندوب البيع المباشر — مرتبط بالمركبة',{readonly:true})+picker('wsTo','الفرع الوجهة — ابحث بالكود أو الاسم')+'</div>' ;\n    if(t==='SupplierReturn') return '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'+picker('wsFrom','الفرع المصدر — ابحث بالكود أو الاسم')+picker('wsTo','المورد — مرتبط بالفرع عند ثبوت الربط')+'</div>' ;\n    return previousRouteHtml.call(this);\n  };\n\n  var previousSummary=App.summary;\n  App.summary=function(){\n    var t='',fr=document.getElementById('wsFrom'),to=document.getElementById('wsTo'),repEl=document.getElementById('wsRep');\n    if(this.type==='DirectSale'){\n      if(fr&&fr.value)t+='المصدر: '+this.loc(fr.value,'Branch');\n      if(repEl&&repEl.value){var r=(this.refs.reps||[]).find(function(x){return x.id===repEl.value});if(r)t+=(t?' · ':'')+'المندوب: '+repLabel(r);}\n      if(to&&to.value)t+=(t?' · ':'')+'المركبة: '+this.loc(to.value,'Vehicle');\n      RW_UI.safeText(document.getElementById('routeSummary'),t||'اختر الفرع ثم المندوب ثم المركبة');\n      RW_UI.safeText(document.getElementById('stockHint'),fr&&fr.value?'المتاح محسوب من المصدر المحدد':'اختر المصدر لمعرفة المتاح');return;\n    }\n    if(this.type==='DirectReturn'){\n      if(fr&&fr.value)t+='المركبة: '+this.loc(fr.value,'Vehicle');\n      if(repEl&&repEl.value){var rr=(this.refs.reps||[]).find(function(x){return x.id===repEl.value});if(rr)t+=(t?' · ':'')+'المندوب: '+repLabel(rr);}\n      if(to&&to.value)t+=(t?' · ':'')+'الوجهة: '+this.loc(to.value,'Branch');\n      RW_UI.safeText(document.getElementById('routeSummary'),t||'اختر المركبة لعرض المندوب المرتبط ثم حدد الفرع');\n      RW_UI.safeText(document.getElementById('stockHint'),fr&&fr.value?'المتاح محسوب من مخزون المركبة':'اختر المركبة لمعرفة المتاح');return;\n    }\n    if(this.type==='SupplierReturn'){\n      if(fr&&fr.value)t+='المصدر: '+this.loc(fr.value,'Branch');\n      if(to&&to.value)t+=(t?' · ':'')+'المورد: '+this.loc(to.value,'Supplier');\n      RW_UI.safeText(document.getElementById('routeSummary'),t||'اختر الفرع ثم المورد');\n      RW_UI.safeText(document.getElementById('stockHint'),fr&&fr.value?'المتاح محسوب من المصدر المحدد':'اختر المصدر لمعرفة المتاح');return;\n    }\n    return previousSummary.call(this);\n  };\n\n  var previousSubmit=App.submit;\n  App.submit=function(){\n    var s=this,notesEl=document.getElementById('wsNotes'),originalNotes=notesEl?notesEl.value:'';\n    if(this.type==='DirectSale'){\n      var br=document.getElementById('wsFrom'),rep=document.getElementById('wsRep'),veh=document.getElementById('wsTo'),bid=br&&br.value||'',rid=rep&&rep.value||'',vid=veh&&veh.value||'';\n      var branch=(this.refs.branches||[]).find(function(x){return x.id===bid}),r=(this.refs.reps||[]).find(function(x){return x.id===rid}),v=(this.refs.vehicles||[]).find(function(x){return x.id===vid});\n      if(!bid){RW_UI.toast('الفرع المصدر مطلوب','warning');return;}\n      if(!rid){RW_UI.toast('مندوب البيع المباشر مطلوب','warning');return;}\n      if(!vid){RW_UI.toast('المركبة مطلوبة بعد اختيار المندوب','warning');return;}\n      if(!r||!branchMatch(r,branch)){RW_UI.toast('المندوب غير مرتبط بالفرع المختار','error');return;}\n      if(!v||v.driver_id!==rid){RW_UI.toast('المركبة المختارة غير مرتبطة بالمندوب المحدد','error');return;}\n      if(notesEl)notesEl.value=(originalNotes?originalNotes+'\\n':'')+'[مندوب البيع المباشر: '+r.id+' | '+repLabel(r)+']';\n    }else if(this.type==='DirectReturn'){\n      var vb=document.getElementById('wsFrom'),vr=document.getElementById('wsRep'),to=document.getElementById('wsTo'),vid2=vb&&vb.value||'',rid2=vr&&vr.value||'',bid2=to&&to.value||'';\n      var vv=(this.refs.vehicles||[]).find(function(x){return x.id===vid2}),rr2=(this.refs.reps||[]).find(function(x){return x.id===rid2}),bb2=(this.refs.branches||[]).find(function(x){return x.id===bid2});\n      if(!vid2){RW_UI.toast('المركبة المصدر مطلوبة','warning');return;}\n      if(!rid2||!rr2||!vv||vv.driver_id!==rid2){RW_UI.toast('مندوب المركبة غير متسق مع قاعدة البيانات','error');return;}\n      if(!bid2){RW_UI.toast('الفرع الوجهة مطلوب','warning');return;}\n      if(!branchMatch(rr2,bb2)){RW_UI.toast('المركبة/المندوب غير مرتبطين بالفرع المختار','error');return;}\n      if(notesEl)notesEl.value=(originalNotes?originalNotes+'\\n':'')+'[مندوب البيع المباشر: '+rr2.id+' | '+repLabel(rr2)+']';\n    }else if(this.type==='SupplierReturn'){\n      var sb=document.getElementById('wsFrom'),st=document.getElementById('wsTo'),sid=st&&st.value||'';\n      if(!sb||!sb.value){RW_UI.toast('الفرع المصدر مطلوب','warning');return;}\n      if(!sid){RW_UI.toast('المورد مطلوب','warning');return;}\n      var map=(this.refs.supplierBranchMap||{})[sb.value];\n      if(map&&Object.keys(map).length&&!map[sid]){RW_UI.toast('المورد غير مرتبط بالفرع المختار','error');return;}\n    }\n    try{return previousSubmit.apply(this,arguments);}finally{if(notesEl)notesEl.value=originalNotes;}\n  };\n\n  var previousNewWorkspace=App.newWorkspace;\n  App.newWorkspace=function(){this.loadRefs();return previousNewWorkspace.apply(this,arguments);};\n\n  try{\n    var pending=this.refs&&this.company?this.loadRefs():Promise.resolve();\n    pending.catch(function(e){console.error('[VOUCHERS] forensic reference hydration failed',e)});\n  }catch(e){console.error('[VOUCHERS] forensic patch init failed',e)}\n  console.info('[VOUCHERS] forensic branch-linked references repair active');\n})();\n</script>'''
          text = text.replace(marker, repair + marker)
          p.write_text(text,encoding='utf-8')
          PY
          node <<'NODE'
          const fs=require('fs');
          const t=fs.readFileSync('Current/PWA/vouchers.html','utf8');
          const re=/<script[^>]*data-rw-vouchers-gm="1"[^>]*>([\s\S]*?)<\/script>/;
          const m=t.match(re); if(!m) throw new Error('MAIN_SCRIPT_NOT_FOUND');
          fs.writeFileSync('/tmp/vouchers.js',m[1]+'\n');
          NODE
          node --check /tmp/vouchers.js
          grep -q 'data-rw-vouchers-forensic-repair="2026-08-20"' Current/PWA/vouchers.html
          git config user.name 'RAWAEA Forensic Repair'
          git config user.email 'actions@rawaea.invalid'
          git add Current/PWA/vouchers.html .github/workflows/one-shot-vouchers-forensic-repair-20260820.yml
          git commit -m '[vouchers-forensic-repair] surgical branch-linked picker closure'
          git rm .github/workflows/one-shot-vouchers-forensic-repair-20260820.yml
          git commit -m '[vouchers-forensic-repair] remove one-shot repair workflow'
          git push
