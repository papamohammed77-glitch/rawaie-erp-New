name: one-shot-vouchers-branch-repair

on:
  push:
    paths:
      - '.github/workflows/_one_shot_vouchers_branch_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch vouchers.html only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Current/PWA/vouchers.html')
          s = p.read_text(encoding='utf-8')

          block = r'''\n/* FINAL BRANCH-SCOPED VOUCHER ENTITY REPAIR 2026-08-20 */\n(function(){\n  'use strict';\n  if(typeof App==='undefined'||typeof supabase==='undefined'||App.__BRANCH_SCOPED_ENTITY_REPAIR_20260820__)return;\n  App.__BRANCH_SCOPED_ENTITY_REPAIR_20260820__=true;\n\n  function A(v){\n    if(v==null)return [];\n    if(Array.isArray(v))return v.map(String);\n    var s=String(v).trim();\n    if(!s)return [];\n    try{\n      var j=JSON.parse(s);\n      if(Array.isArray(j))return j.map(String);\n      if(typeof j==='string')return [j];\n    }catch(e){}\n    return s.split(',').map(function(x){return x.trim()}).filter(Boolean);\n  }\n  function branchMatch(u,b){\n    if(!u||!b)return false;\n    if(String(u.default_branch_id||'')===String(b.id))return true;\n    var a=A(u.allowed_branch_ids);\n    return a.indexOf(String(b.id))>=0||a.indexOf(String(b.branch_code||''))>=0;\n  }\n  function vehicleBranchId(s,v){\n    var map=s.refs&&s.refs.vehicleBranchMap||{};\n    if(map[v.id])return map[v.id];\n    var code='VAN-'+String(v.vehicle_code||'').trim().toUpperCase();\n    var b=(s.refs.branches||[]).find(function(x){return String(x.branch_code||'').trim().toUpperCase()===code});\n    return b?b.id:null;\n  }\n  function entityLabel(x,t){\n    if(!x)return '';\n    if(t==='rep')return x.name||x.email||'';\n    if(t==='vehicle')return x.vehicle_code||x.license_plate||x.model||'';\n    if(t==='supplier')return x.name||x.supplier_code||'';\n    return x.name||x.branch_code||'';\n  }\n  function entityCode(x,t){\n    if(!x)return '';\n    if(t==='rep')return x.email||x.phone||'';\n    if(t==='vehicle')return x.vehicle_code||x.license_plate||'';\n    if(t==='supplier')return x.supplier_code||x.phone||'';\n    return x.branch_code||'';\n  }\n  function rank(x,z,t){\n    if(!z)return 1;\n    var a=App.norm(entityLabel(x,t)),b=App.norm(entityCode(x,t));\n    return a===z||b===z?150:a.indexOf(z)===0?115:b.indexOf(z)===0?110:a.indexOf(z)>=0?70:b.indexOf(z)>=0?60:0;\n  }\n\n  var baseLoadRefs=App.loadRefs;\n  App.loadRefs=function(){\n    var s=this;\n    return Promise.all([\n      Promise.resolve(baseLoadRefs.call(this)),\n      supabase.from('users').select('id,name,email,phone,role,status,default_branch_id,allowed_branch_ids').eq('company_id',s.company).eq('status','Active').eq('role','مندوب بيع مباشر').order('name'),\n      supabase.from('vehicles').select('id,vehicle_code,license_plate,model,driver_id,status').eq('company_id',s.company).eq('status','Active').order('vehicle_code'),\n      supabase.from('suppliers').select('id,supplier_code,name,search_label,phone,is_active').eq('company_id',s.company).eq('is_active',true).order('name'),\n      supabase.from('purchase_orders').select('supplier_id,branch_id').eq('company_id',s.company).not('supplier_id','is',null).not('branch_id','is',null)\n    ]).then(function(r){\n      for(var i=1;i<5;i++)if(r[i].error)throw r[i].error;\n      s.refs=s.refs||{};\n      s.refs.reps=r[1].data||[];\n      s.refs.vehicles=r[2].data||[];\n      s.refs.suppliers=r[3].data||[];\n      s.refs.vehicleBranchMap={};\n      (s.refs.branches||[]).forEach(function(b){\n        var prefix='VAN-'+String(b.branch_code||'').trim().toUpperCase();\n        if(!prefix)return;\n        s.refs.vehicles.forEach(function(v){\n          if(('VAN-'+String(v.vehicle_code||'').trim().toUpperCase())===prefix)s.refs.vehicleBranchMap[v.id]=b.id;\n        });\n      });\n      s.refs.supplierBranchMap={};\n      (r[4].data||[]).forEach(function(x){\n        if(x.supplier_id&&x.branch_id)(s.refs.supplierBranchMap[x.branch_id]||(s.refs.supplierBranchMap[x.branch_id]={}))[x.supplier_id]=1;\n      });\n      return s.refs;\n    });\n  };\n\n  var basePickArr=App.pickArr;\n  App.pickArr=function(key){\n    var s=this,from=(document.getElementById('wsFrom')||{}).value||'',branch=(s.refs.branches||[]).find(function(b){return b.id===from});\n    if(key==='wsRep')return (s.refs.reps||[]).filter(function(r){return !branch||branchMatch(r,branch)});\n    if((this.type==='DirectSale'||this.type==='DirectReturn')&&key==='wsFrom'&&this.type==='DirectReturn'){\n      return (s.refs.vehicles||[]).filter(function(v){var vb=vehicleBranchId(s,v);return !!vb&&(!branch||vb===branch.id)});\n    }\n    if(this.type==='DirectSale'&&key==='wsTo'){\n      return (s.refs.vehicles||[]).filter(function(v){var vb=vehicleBranchId(s,v);return !!vb&&(!branch||vb===branch.id)});\n    }\n    if(this.type==='SupplierReturn'&&key==='wsTo'){\n      var m=(s.refs.supplierBranchMap||{})[from];\n      if(!m)return [];\n      return (s.refs.suppliers||[]).filter(function(x){return !!m[x.id]});\n    }\n    return basePickArr.call(this,key);\n  };\n\n  var basePickSearch=App.pickSearch;\n  App.pickSearch=function(key,q){\n    var t=key==='wsRep'?'rep':((this.type==='DirectSale'||this.type==='DirectReturn')&&key===(this.type==='DirectSale'?'wsTo':'wsFrom')?'vehicle':this.type==='SupplierReturn'&&key==='wsTo'?'supplier':null);\n    if(!t)return basePickSearch.call(this,key,q);\n    var s=this,arr=this.pickArr(key)||[],z=this.norm(q),box=RW_UI.byId(key+'Menu');\n    if(!box)return;\n    var rows=arr.map(function(x){return{x:x,score:rank(x,z,t)}}).filter(function(o){return o.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,15);\n    box.innerHTML=rows.length?rows.map(function(o){var x=o.x;return '<div class="smart-row" onclick="App.pickSelect(\\''+key+'\\',\\''+s.esc(x.id)+'\\')"><div><b class="text-xs text-white">'+s.esc(entityLabel(x,t))+'</b><div class="smart-code">'+s.esc(entityCode(x,t))+'</div></div><span class="text-[9px] text-emerald-400">اختيار</span></div>'}).join(''):'<div class="smart-empty">لا توجد نتائج مرتبطة بالفرع المحدد</div>';\n    box.classList.remove('hidden');\n  };\n\n  var basePickSelect=App.pickSelect;\n  App.pickSelect=function(key,id){\n    var s=this;\n    if(key==='wsRep'){\n      var r=(s.refs.reps||[]).find(function(x){return x.id===id}),b=(s.refs.branches||[]).find(function(x){return x.id===(document.getElementById('wsFrom')||{}).value});\n      if(!r||b&&!branchMatch(r,b))return;\n      RW_UI.byId('wsRep').value=id;\n      RW_UI.byId('wsRepSearch').value=entityLabel(r,'rep');\n      RW_UI.byId('wsRepMenu').classList.add('hidden');\n      if(s.type==='DirectSale')s.summary();\n      return;\n    }\n    if((key==='wsTo'&&s.type==='DirectSale')||(key==='wsFrom'&&s.type==='DirectReturn')){\n      var arr=s.pickArr(key),v=arr.find(function(x){return x.id===id});\n      if(!v)return;\n      RW_UI.byId(key).value=id;\n      RW_UI.byId(key+'Search').value=entityLabel(v,'vehicle');\n      RW_UI.byId(key+'Menu').classList.add('hidden');\n      s.summary();\n      return;\n    }\n    if(key==='wsTo'&&s.type==='SupplierReturn'){\n      var sp=(s.refs.suppliers||[]).find(function(x){return x.id===id}),bid=(document.getElementById('wsFrom')||{}).value||'',m=(s.refs.supplierBranchMap||{})[bid];\n      if(!sp||!m||!m[sp.id]){RW_UI.toast('المورد غير مرتبط بالفرع المحدد في بيانات النظام','error');return;}\n      RW_UI.byId('wsTo').value=id;\n      RW_UI.byId('wsToSearch').value=entityLabel(sp,'supplier');\n      RW_UI.byId('wsToMenu').classList.add('hidden');\n      s.summary();\n      return;\n    }\n    return basePickSelect.call(this,key,id);\n  };\n\n  var baseRouteHtml=App.routeHtml;\n  App.routeHtml=function(){\n    var s=this,t=this.type;\n    function picker(key,label,disabled){return '<div class="smart-field"><input type="hidden" id="'+key+'" value=""><input id="'+key+'Search" class="smart-input" autocomplete="off" '+(disabled?'readonly ':'')+'placeholder="'+label+' — ابحث بالاسم أو الكود" onfocus="App.pickShow(\\''+key+'\\')" oninput="App.pickSearch(\\''+key+'\\',this.value)"><div id="'+key+'Menu" class="smart-menu hidden"></div></div>'}\n    if(t==='DirectSale')return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+picker('wsFrom','الفرع المصدر',false)+picker('wsRep','مندوب البيع المباشر — تابع لنطاق الفرع',false)+picker('wsTo','المركبة — فرع متنقل مرتبط بالمصدر',false)+'</div>';\n    if(t==='DirectReturn')return '<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">'+picker('wsFrom','المركبة المصدر — فرع متنقل تابع للمصدر',false)+picker('wsRep','مندوب البيع المباشر — تابع لنطاق الفرع',false)+picker('wsTo','الفرع الوجهة',false)+'</div>';\n    if(t==='SupplierReturn')return '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">'+picker('wsFrom','الفرع المصدر',false)+picker('wsTo','المورد — مرتبط بالفرع حسب البيانات الموثقة',false)+'</div>';\n    return baseRouteHtml.call(this);\n  };\n\n  var baseSummary=App.summary;\n  App.summary=function(){\n    var s=this,fr=RW_UI.byId('wsFrom'),re=RW_UI.byId('wsRep'),to=RW_UI.byId('wsTo'),t='';\n    if(this.type==='DirectSale'){\n      if(fr&&fr.value)t+='المصدر: '+s.loc(fr.value,'Branch');\n      if(re&&re.value){var r=(s.refs.reps||[]).find(function(x){return x.id===re.value});if(r)t+=(t?' · ':'')+'المندوب: '+entityLabel(r,'rep')}\n      if(to&&to.value)t+=(t?' · ':'')+'المركبة: '+s.loc(to.value,'Vehicle');\n      RW_UI.safeText(RW_UI.byId('routeSummary'),t||'اختر الفرع ثم المندوب والمركبة');\n      RW_UI.safeText(RW_UI.byId('stockHint'),fr&&fr.value?'المتاح محسوب من الفرع المصدر':'اختر الفرع المصدر');\n      return;\n    }\n    if(this.type==='DirectReturn'){\n      if(fr&&fr.value)t+='المركبة: '+s.loc(fr.value,'Vehicle');\n      if(re&&re.value){var rr=(s.refs.reps||[]).find(function(x){return x.id===re.value});if(rr)t+=(t?' · ':'')+'المندوب: '+entityLabel(rr,'rep')}\n      if(to&&to.value)t+=(t?' · ':'')+'الفرع: '+s.loc(to.value,'Branch');\n      RW_UI.safeText(RW_UI.byId('routeSummary'),t||'اختر المركبة والمندوب والفرع');\n      RW_UI.safeText(RW_UI.byId('stockHint'),fr&&fr.value?'المتاح محسوب من الفرع المتنقل':'اختر المركبة');\n      return;\n    }\n    if(this.type==='SupplierReturn'){\n      if(fr&&fr.value)t+='المصدر: '+s.loc(fr.value,'Branch');\n      if(to&&to.value)t+=(t?' · ':'')+'المورد: '+s.loc(to.value,'Supplier');\n      RW_UI.safeText(RW_UI.byId('routeSummary'),t||'اختر الفرع ثم المورد المرتبط به');\n      return;\n    }\n    return baseSummary.call(this);\n  };\n\n  var baseSubmit=App.submit;\n  App.submit=function(){\n    var s=this;\n    if(this.mode==='voucher'&&(this.type==='DirectSale'||this.type==='DirectReturn')){\n      var bid=this.type==='DirectSale'?(document.getElementById('wsFrom')||{}).value||'':((s.refs.vehicleBranchMap||{})[((document.getElementById('wsFrom')||{}).value||'') ]||'');\n      var rid=(document.getElementById('wsRep')||{}).value||'';\n      var vid=(document.getElementById('wsFrom')||{}).value||'';\n      if(this.type==='DirectSale'){\n        var vehicleId=(document.getElementById('wsTo')||{}).value||'',b=(s.refs.branches||[]).find(function(x){return x.id===bid}),r=(s.refs.reps||[]).find(function(x){return x.id===rid}),v=(s.refs.vehicles||[]).find(function(x){return x.id===vehicleId}),vb=vehicleBranchId(s,v);\n        if(!bid||!rid||!vehicleId||!r||!v||!branchMatch(r,b)||vb!==bid){RW_UI.toast('الفرع والمندوب والمركبة يجب أن تكون جميعها ضمن نطاق الفرع المحدد','error');return;}\n      }else{\n        var v2=(s.refs.vehicles||[]).find(function(x){return x.id===vid}),r2=(s.refs.reps||[]).find(function(x){return x.id===rid}),dest=(document.getElementById('wsTo')||{}).value||'',d2=(s.refs.branches||[]).find(function(x){return x.id===dest}),srcBranch=vehicleBranchId(s,v2);\n        if(!vid||!rid||!dest||!v2||!r2||!d2||!srcBranch||!branchMatch(r2,d2)){RW_UI.toast('المركبة والمندوب والفرع الوجهة يجب أن تكون صالحة وضمن نطاق الشركة','error');return;}\n      }\n    }\n    if(this.mode==='voucher'&&this.type==='SupplierReturn'){\n      var sb=(document.getElementById('wsFrom')||{}).value||'',st=(document.getElementById('wsTo')||{}).value||'',m=(s.refs.supplierBranchMap||{})[sb];\n      if(!sb||!st||!m||!m[st]){RW_UI.toast('لا يمكن اختيار مورد غير مثبت ارتباطه بالفرع في البيانات الحالية','error');return;}\n    }\n    return baseSubmit.apply(this,arguments);\n  };\n\n  console.info('[VOUCHERS] branch-scoped entity repair loaded');\n})();\n'''

          # Remove only the previous final branch-linked override block, leaving the validated Gold Master and all earlier capabilities intact.
          pattern = r'\n/\* FINAL FORENSIC BRANCH-LINKED REPAIR 2026-08-20 \*/.*?\n\}\)\(\);\n(?=</script>)'
          s2, n = re.subn(pattern, block, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one final forensic block, found {n}')

          # Ensure the replacement is present and the old vehicle↔rep hard-coupling marker is absent from the final override.
          if 'FINAL BRANCH-SCOPED VOUCHER ENTITY REPAIR 2026-08-20' not in s2:
              raise SystemExit('New repair block missing')
          if "v.driver_id===rid" in s2[s2.index('FINAL BRANCH-SCOPED VOUCHER ENTITY REPAIR 2026-08-20'):]:
              raise SystemExit('Forbidden vehicle↔rep coupling remained in final repair block')

          p.write_text(s2, encoding='utf-8')
          PY

          node --check <(python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S))
          print(js)
          PY
          )

          git diff --check
          git diff -- Current/PWA/vouchers.html

      - name: Commit vouchers.html only
        shell: bash
        run: |
          git config user.name 'rawaea-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/vouchers.html
          git commit -m "fix: enforce branch-scoped voucher entity pickers" || exit 0
          git push
