name: owner recovery verification
on:
  push:
    branches: [main]
concurrency:
  group: rawaea-owner-recovery-and-runtime-proof
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover owner auth credential and verify sign-in
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            "https://fiilmooggumokxanwiyx.supabase.co/functions/v1/owner-recovery-20260818?token=P4-OWNER-RECOVERY-20260818-7c3a9f" | tee result.json
          python - <<'PY'
          import json
          r=json.load(open('result.json'))
          assert r.get('success') is True, r
          assert r.get('password_verified') is True, r
          assert r.get('role') == 'مدير النظام', r
          assert r.get('all_branches') is True, r
          print(json.dumps({k:r[k] for k in ['success','auth_user_id','public_user_id','role','permissions_count','all_branches','password_verified']}, ensure_ascii=False))
          PY
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Static target identity
        shell: bash
        run: |
          set -euo pipefail
          test -f Current/PWA/New-main
          node --check Current/PWA/register-sw.js
          node --check Current/PWA/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          req=['<!doctype html>','<html lang="ar" dir="rtl">','P163-GOLD-DIAMOND-CLOSED-2026-09-03','RAWAEA 122 DIAMOND CONTRACT CLOSURE v1','window.RW_Auth=','window.RW_Navigation=','window.RW_Views=','window.RW_ShellContext=','window.RW_OwnerLicense=','RW_Permissions_check']
          assert not [x for x in req if x not in s]
          assert s.count('<link rel="manifest" href="../manifest.json">')==1
          print('TARGET_BLOB='+__import__('subprocess').check_output(['git','rev-parse','HEAD:Current/PWA/New-main'],text=True).strip())
          print('TARGET_SHA256='+hashlib.sha256(s.encode()).hexdigest())
          print('STATIC_TARGET=PASS')
          PY
      - name: Chromium owner-license runtime proof
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rawaea-site && mkdir -p /tmp/rawaea-site
          cp -a Current /tmp/rawaea-site/Current
          cat >/tmp/rawaea-http.py <<'PY'
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          class H(SimpleHTTPRequestHandler):
            def log_message(self,fmt,*args): pass
            def guess_type(self,path): return 'text/html; charset=utf-8' if path.endswith('/New-main') else super().guess_type(path)
          ThreadingHTTPServer(('127.0.0.1',8126),H).serve_forever()
          PY
          (cd /tmp/rawaea-site && python3 /tmp/rawaea-http.py >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          trap 'kill "$(cat /tmp/http.pid)" 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const pe=[],ce=[];
            async function page(){
              const p=await b.newPage({serviceWorkers:'block'});p.setDefaultTimeout(12000);p.setDefaultNavigationTimeout(20000);
              p.on('pageerror',e=>pe.push(String(e.message||e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
              await p.goto('http://127.0.0.1:8126/Current/PWA/New-main',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>window.RW_STATE&&window.RW_Navigation&&window.RW_OwnerLicense,{timeout:12000});return p;
            }
            const p=await page();
            const initial=await p.evaluate(()=>({locale:document.documentElement.lang==='ar'&&document.documentElement.dir==='rtl',auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',shell:typeof RW_ShellContext==='object',ownerLicense:typeof RW_OwnerLicense==='object',notification:!!(window.RW_Notification&&typeof RW_Notification.showPanel==='function'),diamond:document.documentElement.outerHTML.includes('RAWAEA 122 DIAMOND CONTRACT CLOSURE v1'),p163:document.querySelectorAll('meta[name="rw-p163-closure"]').length,manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||''}));
            const denied=await p.evaluate(async()=>{RW_STATE.app.currentUser={id:'x',email:'x@example.com',isOwner:false,permissions:[]};RW_STATE.permissions=[];try{await RW_Navigation.navigate('license');return {ok:false,error:'NO_REJECTION'}}catch(e){return {ok:String(e.message||e)==='OWNER_ONLY',error:String(e.message||e),view:RW_STATE.app.currentView,container:!!document.getElementById('license-main-container')}}});
            await p.close();
            const o=await page();
            const owner=await o.evaluate(async()=>{RW_STATE.app.currentUser={id:'x',email:'owner@smoke.local',isOwner:true,permissions:['*']};RW_STATE.permissions=['*'];try{await RW_Navigation.navigate('license');return {ok:true,view:RW_STATE.app.currentView}}catch(e){return {ok:false,error:String(e.message||e)}}});
            const ownerCheck=await o.evaluate(()=>({view:RW_STATE.app.currentView,container:!!document.getElementById('license-main-container'),text:(document.getElementById('rw-page-container')?.innerText||'').includes('إدارة الترخيص')}));
            await o.close();
            const r={initial,denied,owner,ownerCheck,pe,ce};console.log('OWNER_LICENSE_RUNTIME='+JSON.stringify(r));
            const ok=!pe.length&&!ce.length&&Object.values({locale:initial.locale,auth:initial.auth,nav:initial.nav,views:initial.views,shell:initial.shell,ownerLicense:initial.ownerLicense,notification:initial.notification,diamond:initial.diamond,p163:initial.p163===1,manifest:initial.manifest==='../manifest.json',denied:denied.ok&&denied.view!=='license'&&!denied.container,owner:owner.ok&&owner.view==='license',ownerContainer:ownerCheck.container,ownerText:ownerCheck.text}).every(v=>v!==false);
            await b.close();if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo 'CHROMIUM_OWNER_LICENSE_GOLD_DIAMOND=PASS'
