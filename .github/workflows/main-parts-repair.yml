name: RAWAEA Main PWA Serial Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  serial_repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair one original part per commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          root=Path('Current/PWA/main')
          parts=[root/f'main.{i}.txt' for i in range(1,12)]
          if any(not p.exists() for p in parts): raise SystemExit('MISSING_MAIN_PART')

          def replace_once(text, old, new, name):
              if old in text:
                  return text.replace(old,new,1), True
              return text, False

          def scope_selects(text, table):
              pat=re.compile(r"supabase\\.from\\('"+re.escape(table)+r"'\\)\\.select\\([^;\\n]*?\\)")
              pieces=[]; last=0; changed=False
              for m in pat.finditer(text):
                  pieces.append(text[last:m.end()])
                  tail=text[m.end():m.end()+260]
                  if ".eq('company_id',RW_ShellContext.getCompanyId())" not in tail:
                      pieces.append(".eq('company_id',RW_ShellContext.getCompanyId())")
                      changed=True
                  last=m.end()
              pieces.append(text[last:])
              return ''.join(pieces), changed

          def validate_part(text, idx):
              if idx==1 and 'window.RW_ShellContext=RW_ShellContext;' not in text: raise SystemExit('P1_CONTEXT_MISSING')
              if "showToast('تم تشغيل النظام في الوضع الآمن', 'warning');" in text: raise SystemExit('FAIL_OPEN_REMAINS')
              if re.search(r"supabase\\.from\\('stock_branches'\\)[\\s\\S]{0,500}\\.(update|insert|upsert|delete)\\(",text): raise SystemExit(f'P{idx}_DIRECT_STOCK_WRITER')
              if ".from('inventory_log').insert" in text: raise SystemExit(f'P{idx}_DIRECT_INVENTORY_LOG_WRITER')

          for idx,p in enumerate(parts,1):
              text=p.read_text(encoding='utf-8')
              original=text

              if idx==1:
                  if 'window.RW_ShellContext=RW_ShellContext;' not in text:
                      anchor='window.RW_STATE = RW_STATE;'
                      if anchor not in text: raise SystemExit('P1_NO_STATE_ANCHOR')
                      block="""
// RAWAEA GOVERNED TENANT CONTEXT
var RW_ShellContext=(function(){
  var companyId=null,resolving=null;
  function resolve(){
    if(companyId){RW_STATE.app.companyId=companyId;return Promise.resolve(companyId);}
    if(RW_STATE.app.companyId){companyId=RW_STATE.app.companyId;return Promise.resolve(companyId);}
    if(resolving)return resolving;
    var u=RW_STATE.app.currentUser||{};
    if(u.companyId){companyId=u.companyId;RW_STATE.app.companyId=companyId;return Promise.resolve(companyId);}
    if(!u.authId)return Promise.reject(new Error('AUTH_ID_UNAVAILABLE'));
    resolving=supabase.from('users').select('id,company_id,name,role,status').eq('auth_id',u.authId).eq('status','Active').maybeSingle().then(function(r){
      if(r.error||!r.data||!r.data.company_id)throw new Error('TENANT_CONTEXT_UNAVAILABLE');
      companyId=r.data.company_id;RW_STATE.app.companyId=companyId;RW_STATE.app.userId=r.data.id||null;
      if(RW_STATE.app.currentUser){if(r.data.name)RW_STATE.app.currentUser.name=r.data.name;if(r.data.role)RW_STATE.app.currentUser.role=r.data.role;RW_STATE.app.currentUser.companyId=companyId;}
      return companyId;
    }).finally(function(){resolving=null;});
    return resolving;
  }
  function getCompanyId(){if(!companyId&&RW_STATE.app.companyId)companyId=RW_STATE.app.companyId;if(!companyId&&RW_STATE.app.currentUser&&RW_STATE.app.currentUser.companyId)companyId=RW_STATE.app.currentUser.companyId;if(!companyId)throw new Error('TENANT_CONTEXT_UNAVAILABLE');return companyId;}
  return {resolve:resolve,getCompanyId:getCompanyId,hasCompany:function(){return !!(companyId||RW_STATE.app.companyId||RW_STATE.app.currentUser&&RW_STATE.app.currentUser.companyId);}};
})();
window.RW_ShellContext=RW_ShellContext;
"""
                      text=text.replace(anchor,anchor+block,1)
                  text=text.replace("email: user.email,\n                role:","email: user.email,\n                authId: user.id,\n                companyId: user.company_id || null,\n                role:",1)
                  text=text.replace("RW_STATE.permissions = meta.permissions || ['*'];","RW_STATE.permissions = Array.isArray(meta.permissions) ? meta.permissions : [];",1)
                  if "showToast('تم تشغيل النظام في الوضع الآمن', 'warning');" in text:
                      text=text.replace("showToast('تم تشغيل النظام في الوضع الآمن', 'warning');","throw new Error('FAIL_CLOSED_TENANT_CONTEXT');",1)
                  text=text.replace(".from('app_settings')\n            .select('*')\n            .limit(1)",".from('app_settings')\n            .select('*')\n            .eq('company_id',RW_ShellContext.getCompanyId())\n            .limit(1)",1)

              for table in ['app_settings','customers','branches','suppliers','orders','purchase_orders','receiving','stock_vouchers','runsheets','treasury','chart_of_accounts','roles']:
                  text,_=scope_selects(text,table)
              if idx!=1:
                  text,_=scope_selects(text,'users')

              validate_part(text,idx)
              p.write_text(text,encoding='utf-8')

              scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)
              for sidx,code in enumerate(scripts,1):
                  f=Path(tempfile.gettempdir())/f'rawaea-p{idx}-{sidx}.js';f.write_text(code,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
                  if r.returncode:
                      print(r.stderr);raise SystemExit(f'P{idx}_JS_SYNTAX_{sidx}')

              if text!=original:
                  subprocess.run(['git','add',str(p)],check=True)
                  subprocess.run(['git','commit','-m',f'fix(p{idx}): govern and repair original main part {idx}'],check=True)
                  subprocess.run(['git','push','origin','HEAD:main'],check=True)
                  print(f'P{idx}_COMMITTED')
              else:
                  print(f'P{idx}_NO_CHANGE')

          logical='\n'.join(p.read_text(encoding='utf-8') for p in parts)
          if logical.count('<!DOCTYPE html>')!=1 or logical.count('<html')!=1 or logical.count('</html>')!=1: raise SystemExit('LOGICAL_HTML_STRUCTURE_FAILURE')
          if re.search(r"supabase\\.from\\('stock_branches'\\)[\\s\\S]{0,500}\\.(update|insert|upsert|delete)\\(",logical): raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITER_REMAINS')
          if ".from('inventory_log').insert" in logical: raise SystemExit('DIRECT_INVENTORY_LOG_WRITER_REMAINS')
          print('ALL_MAIN_PARTS_SERIAL_REPAIR_COMPLETED')
          PY
          git diff --check
