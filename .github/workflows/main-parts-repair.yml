name: RAWAEA Main PWA P1 Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-parts-repair.yml'
      - '.github/workflows/p0-main-shell-pr.yml'
permissions:
  contents: write
jobs:
  p1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair existing main1.md only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/main/main1.md')
          s=p.read_text(encoding='utf-8')
          marker='RAWAEA_P1_FORENSIC_CLOSED:v8'
          if marker in s:
              print('P1_ALREADY_CLOSED')
              raise SystemExit(0)
          def req(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'{label}_COUNT={c}')
              s=s.replace(old,new,1)

          anchor='window.RW_STATE = RW_STATE;'
          context="""
// RAWAEA GOVERNED TENANT CONTEXT
var RW_ShellContext=(function(){
 var companyId=null,userId=null,resolving=null;
 function applyUserIdentity(row, authUser){
  companyId=row.company_id||null;
  userId=row.id||null;
  RW_STATE.app.companyId=companyId;
  RW_STATE.app.userId=userId;
  if(RW_STATE.app.currentUser){
   RW_STATE.app.currentUser.id=userId;
   RW_STATE.app.currentUser.authId=(authUser&&authUser.id)||(RW_STATE.app.currentUser.authId)||null;
   RW_STATE.app.currentUser.companyId=companyId;
   if(row.name)RW_STATE.app.currentUser.name=row.name;
   if(row.role)RW_STATE.app.currentUser.role=row.role;
   RW_STATE.app.currentUser.isOwner=RW_STATE.app.currentUser.isOwner===true;
  }
  var dbPerms=Array.isArray(row.permissions)?row.permissions.slice():[];
  if(RW_STATE.app.currentUser && RW_STATE.app.currentUser.isOwner===true){
   RW_STATE.permissions=['*'];
  }else{
   RW_STATE.permissions=dbPerms;
  }
  return companyId;
 }
 function resolve(){
  if(companyId)return Promise.resolve(companyId);
  if(resolving)return resolving;
  var u=RW_STATE.app.currentUser||{};
  if(u.companyId){
   companyId=u.companyId;
   userId=u.id||null;
   RW_STATE.app.companyId=companyId;
   RW_STATE.app.userId=userId;
   if(u.isOwner===true)RW_STATE.permissions=['*'];
   return Promise.resolve(companyId);
  }
  var authUserPromise;
  if(u.authId){
   authUserPromise=Promise.resolve({id:u.authId,email:u.email||null});
  }else{
   authUserPromise=RW_SUPABASE_CLIENT.auth.getUser().then(function(r){
    if(r.error||!r.data||!r.data.user||!r.data.user.id)throw new Error('AUTH_ID_UNAVAILABLE');
    return r.data.user;
   });
  }
  resolving=authUserPromise.then(function(authUser){
   return RW_SUPABASE_CLIENT.from('users').select('id,company_id,name,role,status,permissions').eq('auth_id',authUser.id).eq('status','Active').maybeSingle().then(function(r){
    if(r.error||!r.data||!r.data.company_id)throw new Error('TENANT_CONTEXT_UNAVAILABLE');
    return applyUserIdentity(r.data,authUser);
   });
  }).finally(function(){resolving=null;});
  return resolving;
 }
 function getCompanyId(){if(!companyId)companyId=RW_STATE.app.companyId||(RW_STATE.app.currentUser&&RW_STATE.app.currentUser.companyId)||null;if(!companyId)throw new Error('TENANT_CONTEXT_UNAVAILABLE');return companyId;}
 return {resolve:resolve,getCompanyId:getCompanyId,hasCompany:function(){return !!(companyId||RW_STATE.app.companyId||(RW_STATE.app.currentUser&&RW_STATE.app.currentUser.companyId));}};
})();
window.RW_ShellContext=RW_ShellContext;
"""
          req(anchor,anchor+'\n'+context,'P1_CONTEXT')
          req("email: user.email,\n                role: meta.role || 'مدير النظام',\n                isOwner: meta.isOwner === true || meta.isOwner === 'true'\n            };\n","email: user.email,\n                authId: user.id,\n                companyId: null,\n                role: meta.role || 'مدير النظام',\n                isOwner: meta.isOwner === true || meta.isOwner === 'true'\n            };\n",'P1_USER')
          req("RW_STATE.permissions = meta.permissions || ['*'];","RW_STATE.permissions = (RW_STATE.app.currentUser && RW_STATE.app.currentUser.isOwner === true) ? ['*'] : (Array.isArray(meta.permissions) ? meta.permissions.slice() : []);",'P1_PERMISSIONS')
          req('enterSystem: function() {','enterSystem: async function() {','P1_ENTER')
          req('self.enterSystem();','return self.enterSystem();','P1_ENTER_CALL')
          req('enterSystem: async function() {\n    hideLoader();','enterSystem: async function() {\n    await RW_ShellContext.resolve();\n    hideLoader();','P1_ENTER_BODY')
          req(".from('app_settings')\n            .select('*')\n            .limit(1)",".from('app_settings')\n            .select('*')\n            .eq('company_id',RW_ShellContext.getCompanyId())\n            .limit(1),'P1_SETTINGS')
          safe="showToast('تم تشغيل النظام في الوضع الآمن', 'warning');"
          if safe in s:
              s=s.replace(safe,"throw new Error('FAIL_CLOSED_TENANT_CONTEXT');",1)
          if re.search(r"supabase\.from\(['\"]stock_branches['\"]\)[^;]{0,1200}\.(?:update|insert|upsert|delete)\(",s,re.S):
              raise SystemExit('P1_DIRECT_STOCK_WRITER')
          if re.search(r"supabase\.from\(['\"]inventory_log['\"]\)[^;]{0,700}\.insert\(",s,re.S):
              raise SystemExit('P1_DIRECT_INVENTORY_LOG_WRITER')
          code='\n'.join(re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I))
          f=Path(tempfile.gettempdir())/'p1.js';f.write_text(code,encoding='utf-8')
          r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr)
              raise SystemExit('P1_JS_SYNTAX')
          p.write_text(s.rstrip()+'\n<!-- '+marker+' -->\n',encoding='utf-8')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(p)],check=True)
          subprocess.run(['git','commit','-m','fix(p1): repair existing main1 tenant and owner shell'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
  main2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair existing main2.md only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          p=Path('Current/PWA/main/main2.md')
          s=p.read_text(encoding='utf-8')
          marker='RAWAEA_MAIN2_FORENSIC_CLOSED:v1'
          if marker in s:
              print('MAIN2_ALREADY_CLOSED')
              raise SystemExit(0)
          def req(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}_COUNT={c}')
              s=s.replace(old,new,1)
          def req_count(old,new,count,label):
              global s
              c=s.count(old)
              if c!=count: raise SystemExit(f'{label}_COUNT={c}')
              s=s.replace(old,new)

          anchor='// RW_Dashboard – لوحة التحكم الاحترافية (الإنترو)'
          helper="""function RW_Main2_companyId() {\n    if (typeof RW_ShellContext === 'undefined' || !RW_ShellContext.getCompanyId) {\n        throw new Error('TENANT_CONTEXT_UNAVAILABLE');\n    }\n    return RW_ShellContext.getCompanyId();\n}\n"""
          req(anchor,helper+'\\n'+anchor,'MAIN2_GLOBAL_CTX')
          req("var today = new Date().toISOString().split('T')[0];", "var companyId = RW_Main2_companyId();\n        var today = new Date().toISOString().split('T')[0];", 'DASH_CTX')
          req("supabase.from('orders').select('order_code, customer_id, total_amount, order_date, area').gte('order_date', fromDate).lte('order_date', toDate)", "supabase.from('orders').select('id, order_code, customer_id, customer_name, total_amount, order_date, area').eq('company_id', companyId).gte('order_date', fromDate).lte('order_date', toDate)", 'DASH_ORDERS')
          req("supabase.from('orders').select('total_amount').gte('order_date', prevFrom).lte('order_date', prevTo)", "supabase.from('orders').select('total_amount').eq('company_id', companyId).gte('order_date', prevFrom).lte('prevTo')", 'DASH_PREV')
          req("supabase.from('purchase_orders').select('total_amount').gte('po_date', fromDate).lte('po_date', toDate)", "supabase.from('purchase_orders').select('total_amount').eq('company_id', companyId).gte('po_date', fromDate).lte('po_date', toDate)", 'DASH_PURCHASES')
          req("supabase.from('orders').select('total_amount').gte('order_date', fromDate).lte('order_date', toDate).then(function(ordRes)", "supabase.from('orders').select('total_amount').eq('company_id', companyId).gte('order_date', fromDate).lte('order_date', toDate).then(function(ordRes)", 'DASH_PROFIT_ORDERS')
          req("supabase.from('customers').select('customer_code').then(function(res)", "supabase.from('customers').select('customer_code').eq('company_id', companyId).then(function(res)", 'DASH_CUSTOMERS')
          req("supabase.from('items').select('item_code').then(function(res)", "supabase.from('items').select('item_code').eq('company_id', companyId).then(function(res)", 'DASH_ITEMS')
          old="""        // 5. أفضل الأصناف\n        supabase.from('order_details').select('item_code, item_name, qty, unit_price').gte('created_at', fromDate).lte('created_at', toDate).then(function(res) {\n            renderTopItemsChart(res.data || []);\n        }).catch(function() {});"""
          new="""        // 5. أفضل الأصناف — tenant-safe through scoped order ids.\n        var dashOrderIds = [];\n        for (var oi = 0; oi < orders.length; oi++) {\n            if (orders[oi].id) dashOrderIds.push(orders[oi].id);\n        }\n        if (dashOrderIds.length) {\n            supabase.from('order_details').select('item_code, item_name, qty, unit_price, created_at').in('order_id', dashOrderIds).gte('created_at', fromDate).lte('created_at', toDate).then(function(res) {\n                renderTopItemsChart(res.data || []);\n            }).catch(function() {});\n        } else {\n            renderTopItemsChart([]);\n        }"""
          req(old,new,'DASH_DETAILS')
          old="""        var stockRes = await supabase.from('stock_branches').select('item_id, branch_id, qty, allocated_qty');\n        var stockRows = stockRes.data || [];\n        var stockMap = {};\n        for (var s = 0; s < stockRows.length; s++) {\n            var row = stockRows[s];\n            if (!stockMap[row.item_id]) stockMap[row.item_id] = {};\n            stockMap[row.item_id][row.branch_id] = { qty: Number(row.qty) || 0, allocated: Number(row.allocated_qty) || 0 };\n        }\n        var branchIds = [];\n        for (var b = 0; b < branches.length; b++) {\n            branchIds.push(branches[b].id || branches[b].branch_code);\n        }"""
          new="""        var branchIds = [];\n        for (var b = 0; b < branches.length; b++) {\n            if (branches[b].id) branchIds.push(branches[b].id);\n        }\n        if (!branchIds.length) { window._itemsBranchIds = []; window._itemsBranches = branches; return; }\n        var stockRes = await supabase.from('stock_branches').select('item_id, branch_id, qty, allocated_qty').in('branch_id', branchIds);\n        var stockRows = stockRes.data || [];\n        var stockMap = {};\n        for (var s = 0; s < stockRows.length; s++) {\n            var row = stockRows[s];\n            if (!stockMap[row.item_id]) stockMap[row.item_id] = {};\n            stockMap[row.item_id][row.branch_id] = { qty: Number(row.qty) || 0, allocated: Number(row.allocated_qty) || 0 };\n        }"""
          req(old,new,'STOCK_SCOPE')
          req("        var toDate = byId('mov-date-to') ? byId('mov-date-to').value : '';\n        showLoader('جاري تحميل الحركات...');", "        var toDate = byId('mov-date-to') ? byId('mov-date-to').value : '';\n        var companyId = RW_Main2_companyId();\n        showLoader('جاري تحميل الحركات...');", 'MOV_CTX')
          req("supabase.from('stock_vouchers').select('id, voucher_code, voucher_date, type, reference, from_branch_id, to_branch_id').order('voucher_date', { ascending: true })", "supabase.from('stock_vouchers').select('id, voucher_code, voucher_date, type, reference, from_branch_id, to_branch_id').eq('company_id', companyId).gte('voucher_date', fromDate || '1900-01-01').lte('voucher_date', toDate || '2999-12-31').order('voucher_date', { ascending: true })", 'MOV_SCOPE')
          req("        var vouchersRes = await supabase.from('stock_vouchers').select('id, voucher_code, voucher_date, type, reference, from_branch_id, to_branch_id').or('from_branch_id.eq.'+branchId+',to_branch_id.eq.'+branchId).order('voucher_date',{ascending:true});", "        var companyId = RW_Main2_companyId();\n        var allowedBranches = window._itemsBranchIds || [];\n        if (allowedBranches.indexOf(branchId) === -1) throw new Error('BRANCH_OUTSIDE_TENANT');\n        var vouchersRes = await supabase.from('stock_vouchers').select('id, voucher_code, voucher_date, type, reference, from_branch_id, to_branch_id').eq('company_id', companyId).or('from_branch_id.eq.'+branchId+',to_branch_id.eq.'+branchId).order('voucher_date',{ascending:true});", 'BRANCH_MOV_SCOPE')
          old_cat="supabase.from('categories').select('id, category_name').order('category_name').then(function(res)"
          new_cat="supabase.from('categories').select('id, category_name').eq('company_id', RW_Main2_companyId()).order('category_name').then(function(res)"
          req_count(old_cat,new_cat,3,'CATEGORY_READS')
          req("supabase.from('items').select('id').eq('category_id', id).limit(1)", "supabase.from('items').select('id').eq('company_id', RW_Main2_companyId()).eq('category_id', id).limit(1)", 'CAT_ITEM_CHECK')
          req("supabase.from('categories').select('id, category_name').neq('id', id).order('category_name').then(function(catRes)", "supabase.from('categories').select('id, category_name').eq('company_id', RW_Main2_companyId()).neq('id', id).order('category_name').then(function(catRes)", 'CAT_REPLACEMENTS')
          req("        var branchId = byId('upload-branch') ? byId('upload-branch').value : '';\n        if (!branchId)", "        var branchId = byId('upload-branch') ? byId('upload-branch').value : '';\n        var allowedBranchIds = window._itemsBranchIds || [];\n        if (!branchId)", 'UPLOAD_BRANCH_CHECK')
          req("        if (!branchId) { safeHTML(previewTable, '<div class=\"text-center py-8 text-red-500\">يرجى اختيار الفرع أولاً</div>'); if (executeBtn) executeBtn.disabled = true; return; }", "        if (!branchId) { safeHTML(previewTable, '<div class=\"text-center py-8 text-red-500\">يرجى اختيار الفرع أولاً</div>'); if (executeBtn) executeBtn.disabled = true; return; }\n        if (allowedBranchIds.indexOf(branchId) === -1) { safeHTML(previewTable, '<div class=\"text-center py-8 text-red-500\">الفرع خارج نطاق الشركة الحالية</div>'); if (executeBtn) executeBtn.disabled = true; return; }", 'UPLOAD_BRANCH_SCOPE')
          req("supabase.from('items').select('id, item_code, barcode, name').in('barcode', barcodes)", "supabase.from('items').select('id, item_code, barcode, name').eq('company_id', RW_Main2_companyId()).in('barcode', barcodes)", 'UPLOAD_ITEMS_SCOPE')
          forbidden=["supabase.from('stock_branches').update(","supabase.from('stock_branches').insert(","supabase.from('stock_branches').upsert(","supabase.from('stock_branches').delete(","supabase.from('inventory_log').insert(","supabase.from('inventory_log').upsert(")]
          for x in forbidden:
              if x in s: raise SystemExit('FORBIDDEN_DIRECT_WRITER:'+x)
          f=Path(tempfile.gettempdir())/'main2.js'; f.write_text(s,encoding='utf-8')
          r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
          if r.returncode:
              print(r.stderr); raise SystemExit('MAIN2_JS_SYNTAX')
          subprocess.run(['git','diff','--check'],check=True)
          s=s.rstrip()+'\n// '+marker+'\n'
          p.write_text(s,encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(p)],check=True)
          subprocess.run(['git','commit','-m','fix(main2): close tenant-scoped reads and reporting integrity'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          PY
