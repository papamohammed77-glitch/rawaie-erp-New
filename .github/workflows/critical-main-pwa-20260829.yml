name: RAWAEA Critical Main PWA Restoration 20260829
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'chore: critical main pwa restoration complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Execute governed repair
        run: python3 tools/p0_main_shell_repair_v2.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          required=[
            'window.RW_ShellContext',
            'window.RW_OwnerContract',
            'window.RW_SettingsIdentity',
            'window.RW_ShellBranding',
            "if (view === 'license') { if (!RW_OwnerContract.isOwner())",
            "currency: appSets.currency || 'SAR'"
          ]
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          if "meta.permissions || ['*']" in s: raise SystemExit('wildcard fallback remains')
          if re.search(r"\.from\('app_settings'\)\.select\('\*'\)\.limit\(1\)",s): raise SystemExit('global app_settings remains')
          if re.search(r"\.from\('stock_branches'\).*\.update",s,re.S): raise SystemExit('direct stock writer remains')
          if '.from(\'inventory_log\').insert' in s: raise SystemExit('direct inventory log writer remains')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(scripts,1):
              p=Path(tempfile.gettempdir())/f'rw_main_{i}.js'
              p.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(f'syntax failure {i}')
          print('CRITICAL_MAIN_PWA_VALID',len(scripts))
          PY
          git diff --check
      - name: Record and commit
        run: |
          set -euo pipefail
          git config user.name 'RAWAEA Critical Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > Current/CTO/20260829_MAIN_PWA_CRITICAL_REPAIR.md <<'EOF'
# RAWAEA ERP — Critical Main PWA Restoration — 2026-08-29

Scope: restore app_settings-backed identity/settings continuity and preserve OWNER/license semantics in Current/PWA/main.html.

Required gates executed in workflow:
- governed source transformation;
- inline JavaScript syntax validation;
- no generic wildcard permission fallback;
- no global app_settings lookup;
- no direct stock_branches mutation in main.html;
- no direct inventory_log writer in main.html;
- git diff integrity.

Production backend dependency: save-settings deployed separately with JWT and OWNER validation.
Browser E2E is not claimed by this workflow.
EOF
          git add Current/PWA/main.html Current/CTO/20260829_MAIN_PWA_CRITICAL_REPAIR.md
          git rm .github/workflows/critical-main-pwa-20260829.yml
          git commit -m 'chore: critical main pwa restoration complete'
          git push origin HEAD:main
