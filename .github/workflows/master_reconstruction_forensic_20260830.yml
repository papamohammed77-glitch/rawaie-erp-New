name: RAWAEA MASTER Reconstruction Forensic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inventory fragments
        run: |
          set -euo pipefail
          test -f Current/PWA/main.html
          for i in $(seq 1 11); do test -f "Current/PWA/main/main${i}.md"; test -f "Original/PWA/main/main${i}.md"; done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          def text(p): return Path(p).read_text(encoding='utf-8')
          def sig(p):
              s=text(p)
              return {'sha256':hashlib.sha256(s.encode()).hexdigest(),'bytes':len(s.encode()),'lines':len(s.splitlines()),'functions':sorted(set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',s))),'rpcs':sorted(set(re.findall(r'\.rpc\(\s*[\"\']([^\"\']+)',s))),'tables':sorted(set(re.findall(r'\.from\(\s*[\"\']([^\"\']+)',s))),'edges':sorted(set(re.findall(r'functions/v1/([A-Za-z0-9._-]+)',s))),'storage':sorted(set(re.findall(r'(?:localStorage|sessionStorage)\.(?:getItem|setItem|removeItem)\(\s*[\"\']([^\"\']+)',s)))}
          out={}
          for i in range(1,12):
              c=sig(f'Current/PWA/main/main{i}.md'); o=sig(f'Original/PWA/main/main{i}.md')
              out[f'main{i}']={'current':c,'original':o,'missing_functions':sorted(set(o['functions'])-set(c['functions'])),'missing_rpcs':sorted(set(o['rpcs'])-set(c['rpcs'])),'missing_tables':sorted(set(o['tables'])-set(c['tables'])),'missing_edges':sorted(set(o['edges'])-set(c['edges'])),'missing_storage':sorted(set(o['storage'])-set(c['storage']))}
          cur=text('Current/PWA/main.html'); concat=''.join(text(f'Current/PWA/main/main{i}.md') for i in range(1,12))
          out['_assembly']={'current_main':sig('Current/PWA/main.html'),'concat_current_sha256':hashlib.sha256(concat.encode()).hexdigest(),'concat_equals_current':cur==concat}
          Path('forensic-main-reconstruction.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:{x:len(v) for x,v in r.items() if x.startswith('missing_')} for k,r in out.items() if isinstance(r,dict)},ensure_ascii=False))
          print('ASSEMBLY_EQUAL=',out['_assembly']['concat_equals_current'])
          PY
      - name: Build candidate
        run: |
          set -euo pipefail
          cat Current/PWA/main/main{1..11}.md > MASTER_RECONSTRUCTION_CANDIDATE.html
          test -s MASTER_RECONSTRUCTION_CANDIDATE.html
          grep -q '<html' MASTER_RECONSTRUCTION_CANDIDATE.html
          grep -q '</html>' MASTER_RECONSTRUCTION_CANDIDATE.html
          sha256sum Current/PWA/main.html MASTER_RECONSTRUCTION_CANDIDATE.html
      - name: Upload forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: master-reconstruction-forensic
          path: |
            forensic-main-reconstruction.json
            MASTER_RECONSTRUCTION_CANDIDATE.html
