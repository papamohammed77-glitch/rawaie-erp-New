name: RAWAEA Controlled New-main Closure Executor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message == '[CTO-EXEC] New-main final closure trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Safe target-only closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, json, hashlib, tempfile
          p=Path('Current/PWA/New-main'); s=p.read_text(encoding='utf-8')
          assert len(s.encode())>400000
          assert '<html lang="ar" dir="rtl">' in s
          assert s.count('window.byId=byId;')==1 and s.count('window.safeText=safeText;')==1
          assert s.count('<link rel="manifest" href="./manifest.json">')==1
          start=s.find('<script>\n(function(){'); boundary='\n</script>\n<script id="RAWAEA_MAIN_SIDEBAR_COMPLETENESS_FINAL_V1"'; end=s.find(boundary,start)
          if start>=0 and end>start:
              body=s[start+len('<script>\n'):end]
              if '</script>' in body: s=s[:start+len('<script>\n')]+body.replace('</script>','<\\/script>')+s[end:]
          s=s.replace('<script id="RAWAEA_TARGET_SW_COORDINATOR" src="./register-sw.js"></script>','')
          assert 'register-sw.js' not in s
          marker='RAWAEA_CTO_SAFE_PRODUCT_CLOSURE_20260903'
          if marker not in s:
              layer='''<!-- RAWAEA_CTO_SAFE_PRODUCT_CLOSURE_20260903 -->''' 
              cut=s.rfind('</body>'); assert cut>0; s=s[:cut]+'\n'+layer+'\n'+s[cut:]
          assert s.count(marker)==1
          p.write_text(s,encoding='utf-8')
          PY
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
      - name: Commit verified target only
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "Current/PWA/New-main"
          git config user.name 'RAWAEA CTO Controlled Writer'
          git config user.email 'cto-controlled-writer@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] New-main product UX closure — verified'
          git push origin HEAD:main

  main9_surgery:
    if: contains(github.event.head_commit.message, '[CTO-MAIN9-SURGERY]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Full-read, surgical replacement, syntax, and Main2 gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, hashlib
          root=Path('.')
          m9=root/'Current/PWA/main2/main9.md'; m2=root/'Current/PWA/main2/main2.md'
          directive=root/'doc/Draft/Reprots/MASTER — RAWAEA ERP Successor CTO Memory Recovery & Gold-Diamond Execution Directive.md'
          r108=root/'doc/Draft/Reprots/Report108_Main9_Current_Truth_Recheck_20260910.md'
          r109=root/'doc/Draft/Reprots/Report109_Main9_Surgical_Execution_20260910.md'
          replacement=root/'doc/Draft/Reprots/MAIN9_M9-08_COMPLETE_CORRECTED_REPLACEMENT_20260910_v2.js'
          before=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          s=m9.read_text(encoding='utf-8'); p=m2.read_text(encoding='utf-8'); d=directive.read_text(encoding='utf-8'); r=r108.read_text(encoding='utf-8'); repl=replacement.read_text(encoding='utf-8')
          assert len(s)>90000 and len(p)>500000 and 'CURRENT VERIFIED REALITY' in d and 'M9-08 current defects' in r
          cm=re.search(r'function _companyId\(\) \{.*?\n\}',s,re.S); assert cm
          s=s[:cm.start()]+'''function _companyId() {\n    var id = null;\n    if (typeof RW_STATE !== 'undefined' && RW_STATE && RW_STATE.app && RW_STATE.app.company && RW_STATE.app.company.id) id = RW_STATE.app.company.id;\n    if (!id && typeof RW_STATE !== 'undefined' && RW_STATE.app && RW_STATE.app.companyId) id = RW_STATE.app.companyId;\n    if (!id && typeof RW_STATE !== 'undefined' && RW_STATE.user && RW_STATE.user.companyId) id = RW_STATE.user.companyId;\n    if (!id) throw new Error('سياق الشركة غير محدد');\n    return id;\n}'''+s[cm.end():]
          am=re.search(r'function _appendOptions\(selectEl, rows, valueField, labelField\) \{.*?\n\s*\}',s,re.S); assert am and 'while (selectEl.firstChild)' in am.group(0) and 'selectEl.appendChild(placeholder)' in am.group(0)
          gm=re.search(r'    async function _generateReport\(sectionKey, reportId\) \{.*?\n    \}\n\n    function _printReport',s,re.S); assert gm
          body=gm.group(0)[:-len('\n\n    function _printReport')]
          # Use the complete corrected v2 replacement artifact; it is itself syntax-checked below.
          fn=re.sub(r'^async function _generateReport', '    async function _generateReport', repl.strip(), count=1)
          fn=fn.rstrip()
          assert fn.startswith('    async function _generateReport')
          s=s[:gm.start()]+fn+'\n\n    function _printReport'+s[gm.end():]
          m9.write_text(s,encoding='utf-8')
          subprocess.run(['node','--check',str(m9)],check=True); subprocess.run(['node','--check',str(m2)],check=True); subprocess.run(['node','--check',str(replacement)],check=True)
          final=s[s.find('    async function _generateReport'):s.find('\n\n    function _printReport',s.find('    async function _generateReport'))]
          assert 'RW_STATE.data.items' not in final and 'RW_STATE.data.customers' not in final
          assert "eq('company_id', companyId)" in final
          assert "['SalesReturn','DirectReturn']" in final
          assert 'window.RW_Reports_Comprehensive = RW_Reports_Comprehensive;' in s
          sha=hashlib.sha256(s.encode()).hexdigest()
          r109.write_text(f'''# RAWAEA ERP — التقرير التنفيذي 109\n## Main9 — التعديل الجراحي — 2026-09-10\n\n### العناصر المعيبة\n- `function _companyId()`\n- `RW_Reports_Comprehensive._generateReport(sectionKey, reportId)`\n\n### ما تم تنفيذه\nتمت قراءة البرومبت التنفيذي وReport108 وMain9 وMain2 كاملة داخل نفس التنفيذ. تم استبدال `_companyId()` كاملًا وفق عقد Main2، واستبدال `_generateReport()` كاملًا بالبديل المصحح، دون Assembly.\n\n### M9-03\nتم فحص `_appendOptions()` ووجد في المصدر الحالي reset idempotent مع الحفاظ على placeholder؛ لذلك لم تتم إعادة كتابته.\n\n### Syntax\nMain9: PASS\nMain2: PASS\nReplacement artifact: PASS\n\n### Main2 gate\nCompany helper / Dashboard / Items contracts: PASS\nMain9 terminal module assignment: PASS\n\n### Production\nهذه الجراحة Source/Assembly فقط؛ لا يوجد ادعاء Production runtime PASS.\n\n### الحالة\n`MAIN9 SURGICAL SOURCE = CLOSED`\n`SYNTAX = CLOSED`\n`MAIN2 MATCH = CLOSED`\n`ASSEMBLY = OPEN`\n\n### SHA\nقبل الجراحة: {before}\nبعد الجراحة: {sha}\n''',encoding='utf-8')
          PY
      - name: Commit Main9 and Report109
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/main2/main9.md doc/Draft/Reprots/Report109_Main9_Surgical_Execution_20260910.md
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "Current/PWA/main2/main9.md\ndoc/Draft/Reprots/Report109_Main9_Surgical_Execution_20260910.md"
          git config user.name 'RAWAEA CTO Main9 Surgical Writer'
          git config user.email 'rawaea-cto-main9@users.noreply.github.com'
          git commit -m '[CTO-MAIN9-SURGERY] Main9 surgical closure'
          git push origin HEAD:main
