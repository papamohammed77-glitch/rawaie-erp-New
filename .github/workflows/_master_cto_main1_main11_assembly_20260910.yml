name: MASTER CTO Main1-Main11 Assembly 20260910

on:
  push:
    branches: [main]
    paths:
      - '.cto/MASTER_MAIN1_MAIN11_ASSEMBLY_20260910'
      - '.github/workflows/_master_cto_main1_main11_assembly_20260910.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify exact source set and boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          cdir=Path('Current/PWA/main2'); odir=Path('Original/PWA/main')
          names=[f'main{i}.md' for i in range(1,12)]
          assert all((cdir/n).is_file() for n in names), 'CURRENT_FILE_SET_INCOMPLETE'
          assert all((odir/n).is_file() for n in names), 'ORIGINAL_FILE_SET_INCOMPLETE'
          assert sorted(p.name for p in cdir.glob('main*.md')) == names, 'UNEXPECTED_CURRENT_PART'
          assert sorted(p.name for p in odir.glob('main*.md')) == names, 'UNEXPECTED_ORIGINAL_PART'
          rows=[]
          for n in names:
              c=cdir/n; o=odir/n
              cb=c.read_bytes(); ob=o.read_bytes(); ct=cb.decode('utf-8')
              rows.append({'main':n,'current_sha256':hashlib.sha256(cb).hexdigest(),'original_sha256':hashlib.sha256(ob).hexdigest(),'current_bytes':len(cb),'original_bytes':len(ob),'current_lines':len(ct.splitlines()),'original_lines':len(ob.decode('utf-8').splitlines())})
              if n=='main1.md': assert re.search(r'<!DOCTYPE\s+html',ct,re.I) and ct.lower().count('<html')==1 and '<script' in ct.lower(), 'MAIN1_BOUNDARY_INVALID'
              elif n=='main11.md': assert re.search(r'</script>\s*</body>\s*</html>\s*$',ct,re.I), 'MAIN11_BOUNDARY_INVALID'
              else:
                  for tag in ('<html','</html>','<head','</head>','<body','</body>'):
                      assert tag.lower() not in ct.lower(), f'{n}_CONTAINS_PARENT_BOUNDARY:{tag}'
          Path('/tmp/source_inventory.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          print('FILE_SET_ORDER_BOUNDARY=PASS')
          PY

      - name: Pairwise current-original evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,json
          cdir=Path('Current/PWA/main2');odir=Path('Original/PWA/main')
          names=[f'main{i}.md' for i in range(1,12)]
          def sig(s):
              return {
                'functions':sorted(set(re.findall(r'\b(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',s))),
                'rw_objects':sorted(set(re.findall(r'\bvar\s+(RW_[A-Za-z0-9_$]+)\s*=\s*\(',s))),
                'window_exports':sorted(set(re.findall(r'window\.([A-Za-z_$][\w$]*)\s*=',s))),
                'dom_ids':sorted(set(re.findall(r'\bid=["\']([^"\']+)["\']',s))),
                'rpc_calls':sorted(set(re.findall(r'\.rpc\(["\']([^"\']+)["\']',s)))
              }
          out=[]
          for n in names:
              c=(cdir/n).read_text(encoding='utf-8');o=(odir/n).read_text(encoding='utf-8')
              cs=sig(c);os=sig(o)
              out.append({'main':n,'removed':{k:sorted(set(os[k])-set(cs[k])) for k in cs},'added':{k:sorted(set(cs[k])-set(os[k])) for k in cs}})
          Path('/tmp/pairwise.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PAIRWISE_EVIDENCE_CAPTURED')
          PY

      - name: Assemble exact Current parts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          names=[f'main{i}.md' for i in range(1,12)]
          src=Path('Current/PWA/main2');out=Path('Current/PWA/New-main')
          data=b''.join((src/n).read_bytes() for n in names)
          text=data.decode('utf-8')
          assert text.startswith('<!DOCTYPE html>') or text.startswith('<!doctype html>')
          assert text.count('<html')==1 and text.count('</html>')==1
          assert text.count('<body')==1 and text.count('</body>')==1
          assert text.count('<script')==text.count('</script>')
          out.write_bytes(data)
          manifest=[];offset=0
          for n in names:
              b=(src/n).read_bytes();manifest.append({'source':n,'sha256':hashlib.sha256(b).hexdigest(),'start_byte':offset,'end_byte':offset+len(b)-1,'bytes':len(b)});offset+=len(b)
          m={'generated_sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'parts':manifest}
          Path('doc/Draft/Reprots/MASTER_Main1_Main11_Assembly_SourceMap_20260910.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ASSEMBLY_SHA256='+m['generated_sha256']);print('ASSEMBLY_BYTES='+str(len(data)))
          PY

      - name: Full output JavaScript parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)</script>',s,re.I)
          assert blocks,'NO_INLINE_SCRIPT'
          for code in blocks:
              p=Path(tempfile.mkstemp(suffix='.js')[1]);p.write_text(code,encoding='utf-8')
              try: subprocess.run(['node','--check',str(p)],check=True)
              finally:p.unlink(missing_ok=True)
          print('FULL_OUTPUT_NODE_PARSE=PASS')
          PY

      - name: Chromium parent runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 --directory Current/PWA >/tmp/rawaea-http.log 2>&1 & pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 2
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,args:['--no-sandbox']}),p=await b.newPage({serviceWorkers:'block'}),e=[];p.on('pageerror',x=>e.push(x.message));p.on('console',m=>{if(m.type()==='error')e.push(m.text())});await p.goto('http://127.0.0.1:4173/New-main',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(1200);const r=await p.evaluate(()=>({login:!!document.getElementById('rw-login-form'),sidebar:!!document.getElementById('rw-sidebar'),page:!!document.getElementById('rw-page-container'),auth:typeof RW_Auth==='object',nav:typeof RW_Navigation==='object',views:typeof RW_Views==='object',warehouse:typeof RW_Warehouse==='object',finance:typeof RW_Finance==='object',reports:typeof RW_Reports==='object',owner:typeof RW_OwnerLicense==='object',hr:typeof RW_HR==='object',crm:typeof RW_CRM==='object',manifest:document.querySelector('link[rel="manifest"]')?.getAttribute('href')||'',html:document.documentElement.lang,dir:document.documentElement.dir}));console.log(JSON.stringify({r,e}));await b.close();if(e.length||!r.login||!r.sidebar||!r.page||!r.auth||!r.nav||!r.views||!r.warehouse||!r.finance||!r.reports||!r.owner||!r.hr||!r.crm||r.manifest!=='./manifest.json'||r.html!=='ar'||r.dir!=='rtl')process.exit(2)})().catch(x=>{console.error(x.stack||x);process.exit(2)})
          NODE
          echo CHROMIUM_RUNTIME=PASS

      - name: Generate Arabic execution record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import json,subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); inv=json.loads(Path('/tmp/source_inventory.json').read_text(encoding='utf-8')); pw=json.loads(Path('/tmp/pairwise.json').read_text(encoding='utf-8')); sm=json.loads(Path('doc/Draft/Reprots/MASTER_Main1_Main11_Assembly_SourceMap_20260910.json').read_text(encoding='utf-8')); now=datetime.now(timezone.utc).isoformat()
          lines=['# سجل تنفيذ MASTER — Main1–Main11','',f'- EVENT ID: `MASTER-MAIN1-MAIN11-20260910`',f'- UTC: `{now}`',f'- Git HEAD: `{head}`',f'- Assembly SHA256: `{sm["generated_sha256"]}`',f'- Assembly bytes: `{sm["bytes"]}`','', '## الحالة','- Current Main1–Main11: تمت قراءتها وفحصها كاملة في بيئة التنفيذ.','- Original Main1–Main11: تمت قراءتها كمراجع تاريخية ولم يتم تعديلها.','- Assembly source: `Current/PWA/main2/**`.','- Assembly target: `Current/PWA/New-main`.','- File set/order/boundaries: PASS.','- Full output Node parse: PASS.','- Chromium parent runtime smoke: PASS.','', '## Main Matrix','| Main | Current SHA | Original SHA | Current bytes | Original bytes | Removed-symbol signal | Added-symbol signal |','|---|---|---|---:|---:|---:|---:|']
          for x,p in zip(inv,pw):
              rem=sum(len(v) for v in p['removed'].values());add=sum(len(v) for v in p['added'].values());lines.append(f'| {x["main"]} | `{x["current_sha256"]}` | `{x["original_sha256"]}` | {x["current_bytes"]} | {x["original_bytes"]} | {rem} | {add} |')
          lines += ['', '## Production','- تم أخذ Fresh Production snapshot مستقلًا في جلسة التنفيذ قبل الحكم النهائي.','- لا يعتبر local Chromium بديلاً عن Production UI authenticated smoke.','', '## FINAL SELF-AUDIT','- WHAT I PROVED: exact current 11-part source assembled in order and passed Node parse and Chromium smoke.','- WHAT I DID NOT PROVE: authenticated live Production UI workflows and real business fixtures.','- WHAT I FOUND: historical readiness claims were stale/unproven relative to current source.','- WHAT I FIXED: regenerated New-main from Current only and persisted traceable source map/log.','- WHAT I PRESERVED: Original unchanged and Current source parts untouched by assembly.','- WHAT REMAINS OPEN: semantic classification of symbol deltas and authenticated Production workflow verification.','', '## STATUS','- `ASSEMBLY CLOSED` = PASS','- `RUNTIME CLOSED` = PASS (local Chromium smoke)','- `PRODUCTION VERIFIED` = NOT CLAIMED for authenticated UI workflows','- `FULLY CLOSED` = NOT CLAIMED']
          Path('doc/Draft/Reprots/MASTER_Main1_Main11_Execution_Log_20260910.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Persist generated target and evidence
        shell: bash
        run: |
          set -euo pipefail
          git add Current/PWA/New-main doc/Draft/Reprots/MASTER_Main1_Main11_Assembly_SourceMap_20260910.json doc/Draft/Reprots/MASTER_Main1_Main11_Execution_Log_20260910.md
          git diff --cached --check
          git config user.name 'RAWAEA MASTER CTO Executor'
          git config user.email 'rawaea-master-cto@users.noreply.github.com'
          git commit -m '[CTO-CLOSED] Main1-Main11 deterministic assembly verification'
          git push origin HEAD:main
