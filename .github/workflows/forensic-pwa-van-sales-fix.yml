name: Forensic PWA Van Sales Surgical Fix
on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/van-sales.html'
      - '.github/workflows/forensic-pwa-van-sales-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix(pwa): add save-sales operation id to van sales'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Surgical replacement in the same PWA file
        shell: python
        run: |
          from pathlib import Path
          p = Path('Current/PWA/van-sales.html')
          s = p.read_text(encoding='utf-8')
          old = """            var hdr = {\n                customer_code: c.customer_code,\n                custName: c.name,\n                area: c.area || '',\n                total: sub,\n"""
          new = """            var hdr = {\n                operation_id: crypto.randomUUID(),\n                customer_code: c.customer_code,\n                custName: c.name,\n                area: c.area || '',\n                total: sub,\n"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target block; found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit surgical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-cto-bot'
          git config user.email 'actions@github.com'
          git add Current/PWA/van-sales.html
          git commit -m 'fix(pwa): add save-sales operation id to van sales'
          git push origin main
