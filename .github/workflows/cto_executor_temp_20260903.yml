name: CTO executor temporary 20260903
on:
  push:
    branches: [cto-new-main-gold-20260903]
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[CTO-EXECUTED]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - name: Diagnose exact final JS syntax failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,re,subprocess,tempfile
          spec=importlib.util.spec_from_file_location('b','tools/run_final_main_reconstruction_20260831.py')
          b=importlib.util.module_from_spec(spec);spec.loader.exec_module(b)
          parts=[]
          for i,p in enumerate(b.PARTS,1):
              raw=p.read_text(encoding='utf-8-sig')
              if i==1: raw=b.normalize_main1(raw)
              elif i==7: raw=b.patch_main7(raw)
              raw=b.normalize_document_closures(raw)
              parts.append(raw.rstrip())
          def js_body(fragment,first=False):
              if first:
                  m=re.search(r'<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*)',fragment,re.I)
                  if not m: raise RuntimeError('MAIN1_INLINE_SCRIPT_MISSING')
                  return m.group(1)
              return fragment
          js_parts=[js_body(parts[0],True)]+parts[1:]
          running=''
          for i,x in enumerate(js_parts,1):
              running += ('\n\n' if running else '') + x
              print(f'SOURCE main{i} cumulative_js_lines={running.count(chr(10))+1} chars={len(running)}')
          candidate=b.repair_runtime_contracts(running+'\n\n') [0]
          out=Path('/tmp/final.js');out.write_text(candidate,encoding='utf-8')
          r=subprocess.run(['node','--check',str(out)],capture_output=True,text=True)
          print('NODE_EXIT',r.returncode)
          print(r.stderr)
          lines=candidate.splitlines()
          for center in (6035,6034,6036):
              print('--- AROUND',center,'---')
              for n in range(max(1,center-12),min(len(lines),center+12)+1): print(f'{n}: {lines[n-1]}')
          PY
