name: Validate Main2 Fragments

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main2/main*.md'
      - '.github/workflows/validate-main2-fragments.yml'
  pull_request:
    paths:
      - 'Current/PWA/main2/main*.md'
      - '.github/workflows/validate-main2-fragments.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Main1-Main11 JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 11); do
            cp "Current/PWA/main2/main${n}.md" "/tmp/main${n}.js"
            node --check "/tmp/main${n}.js"
          done

      - name: Validate canonical Main2 fragment set
        shell: bash
        run: |
          set -euo pipefail
          test -f Current/PWA/main2/main1.md
          test -f Current/PWA/main2/main2.md
          test -f Current/PWA/main2/main3.md
          test -f Current/PWA/main2/main4.md
          test -f Current/PWA/main2/main5.md
          test -f Current/PWA/main2/main6.md
          test -f Current/PWA/main2/main7.md
          test -f Current/PWA/main2/main8.md
          test -f Current/PWA/main2/main9.md
          test -f Current/PWA/main2/main10.md
          test -f Current/PWA/main2/main11.md
