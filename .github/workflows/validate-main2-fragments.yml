name: Validate Main2 Reporting Sources

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main2/main9.md'
      - 'Current/PWA/main2/main10.md'
      - '.github/workflows/validate-main2-fragments.yml'
  pull_request:
    paths:
      - 'Current/PWA/main2/main9.md'
      - 'Current/PWA/main2/main10.md'
      - '.github/workflows/validate-main2-fragments.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Main9 and Main10 JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          cp Current/PWA/main2/main9.md /tmp/main9.js
          cp Current/PWA/main2/main10.md /tmp/main10.js
          node --check /tmp/main9.js
          node --check /tmp/main10.js

      - name: Validate Main9 company-scope contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F "function _companyId()" Current/PWA/main2/main9.md >/dev/null
          grep -F ".eq('company_id', companyId)" Current/PWA/main2/main9.md >/dev/null
          grep -F "'SalesReturn'" Current/PWA/main2/main9.md >/dev/null
          grep -F "'DirectReturn'" Current/PWA/main2/main9.md >/dev/null
