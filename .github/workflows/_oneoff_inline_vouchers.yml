name: _oneoff_inline_vouchers
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inline guard and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/vouchers.html')
          s = p.read_text(encoding='utf-8')
          old = '<script>\nfunction f'
          new = '<script data-rw-vouchers-gm="1">\nfunction f'
          if old not in s:
              raise SystemExit('TARGET_NOT_FOUND')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/_oneoff_inline_vouchers.yml').unlink()
          PY
          git config user.name 'rawaea-cto-bot'
          git config user.email 'rawaea-cto-bot@users.noreply.github.com'
          git add Current/PWA/vouchers.html .github/workflows/_oneoff_inline_vouchers.yml
          git commit -m 'fix(vouchers): make inline Gold Master authoritative'
          git push origin HEAD:main
