      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('Current/PWA/vouchers.html').read_text(encoding='utf-8')
          a=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/vouchers-app.js').write_text(a,encoding='utf-8')
