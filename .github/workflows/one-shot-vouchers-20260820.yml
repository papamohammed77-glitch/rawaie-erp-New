          "supabase.from('stock_vouchers').select('*').eq('company_id',s.company).eq('voucher_code',code).maybeSingle().then(function(r){var v=r.data;if(!v)throw new Error('الإذن غير موجود');return supabase.from('stock_voucher_details').select('*').eq('voucher_id',v.id).order('item_code').then(function(d){",
          'details query')
          # receive operation id robust
          must("var op='UI-RECEIVE:'+s.company+':'+v.id,body={voucher_code:code,receivedItems:a.value,operation_id:op};RW_UI.showLoader();RW_API.call('receive-stock-voucher',body,function(j){RW_UI.hideLoader();if(j&&j.success){RW_UI.toast(j.duplicate?'تم التعرف على التكرار':'تم الاستلام','success');s.loadList('pending')}else RW_UI.showError((j&&j.msg)||'فشل الاستلام')})",
          "var op=s.receiveOps[code]||(s.receiveOps[code]=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'UI-RECEIVE:'+s.company+':'+v.id+':'+Date.now()+':'+Math.random().toString(36).slice(2));body={voucher_code:code,receivedItems:a.value,operation_id:op};RW_UI.showLoader();RW_API.call('receive-stock-voucher',body,function(j){RW_UI.hideLoader();if(j&&j.success){delete s.receiveOps[code];RW_UI.toast(j.duplicate?'تم التعرف على التكرار':'تم الاستلام','success');s.loadList('pending')}else RW_UI.showError((j&&j.msg)||'فشل الاستلام')})",
          'receive op')
          # prepare scoped stock rows to known branches
          must("return Promise.all([supabase.from('items').select('id,item_code,barcode,name,search_label,category,unit,sales_price,cost_price,image_url,is_active').order('item_code').limit(5000),supabase.from('stock_branches').select('branch_id,item_id,qty,allocated_qty').limit(10000)]).then(function(r){",
          "var bids=s.refs.branches.map(function(b){return b.id});if(!bids.length)return Promise.resolve().then(function(){s.items=[];s.stock={}});return Promise.all([supabase.from('items').select('id,item_code,barcode,name,search_label,category,unit,sales_price,cost_price,image_url,is_active').order('item_code').limit(5000),supabase.from('stock_branches').select('branch_id,item_id,qty,allocated_qty').in('branch_id',bids).limit(10000)]).then(function(r){",
          'prepare scoping')
          # replace routeHtml entirely
          start=s.index('routeHtml:function(){')
          end=s.index('renderWorkspace:function(){',start)
          route="""routeHtml:function(){var s=this,t=this.type;function picker(key,label,arr){return '<div class=\\\"smart-field\\\"><input type=\\\"hidden\\\" id=\\\"'+key+'\\\" value=\\\"\\\"><input id=\\\"'+key+'Search\\\" class=\\\"smart-input\\\" autocomplete=\\\"off\\\" placeholder=\\\"'+label+' — ابحث بالكود أو الاسم\\\" onfocus=\\\"App.pickShow(\\\\''+key+'\\\\')\\\" oninput=\\\"App.pickSearch(\\\\''+key+'\\\\',this.value)\\\"><div id=\\\"'+key+'Menu\\\" class=\\\"smart-menu hidden\\\"></div></div>'}if(t==='Scrap'||t==='Adjustment')return '<div class=\\\"grid grid-cols-1\\\">'+picker('wsFrom','الفرع المصدر',s.refs.branches)+'</div>';var fromType=t==='DirectReturn'?'Vehicle':'Branch';var toType=t==='Transfer'||t==='DirectReturn'?'Branch':t==='DirectSale'?'Vehicle':'Supplier';var fa=fromType==='Branch'?s.refs.branches:s.refs.vehicles,ta=toType==='Branch'?s.refs.branches:toType==='Vehicle'?s.refs.vehicles:s.refs.suppliers;return '<div class=\\\"grid grid-cols-1 sm:grid-cols-2 gap-2\\\">'+picker('wsFrom',fromType==='Branch'?'الفرع المصدر':'المركبة المصدر',fa)+picker('wsTo',toType==='Branch'?'الفرع الوجهة':toType==='Vehicle'?'المركبة الوجهة':'المورد الوجهة',ta)+'</div>'},
"""
          s=s[:start]+route+s[end:]
          # engine submit should not touch wsTo (it already ignores but accesses it before mode); use safe
          must("var ref=RW_UI.byId('wsRef').value.trim(),notes=RW_UI.byId('wsNotes').value.trim(),fr=RW_UI.byId('wsFrom').value,to=RW_UI.byId('wsTo').value;if(!ref)",
               "var ref=RW_UI.byId('wsRef').value.trim(),notes=RW_UI.byId('wsNotes').value.trim(),fr=RW_UI.byId('wsFrom').value,to=RW_UI.byId('wsTo')?RW_UI.byId('wsTo').value:null;if(!ref)",
               'engine target safe')
          # add picker helpers before renderWorkspace
          insert='''pickLabel:function(key,id,arr){var x=(arr||[]).find(function(z){return z.id===id});return x?(x.name||x.vehicle_code||x.supplier_code||x.branch_code||''):'\\u062a\\u062d\\u062f\\u064a\\u062f';},pickArr:function(key){return key==='wsFrom'?(this.type==='DirectReturn'?this.refs.vehicles:(this.refs.branches)):(this.type==='DirectSale'?this.refs.vehicles:this.type==='SupplierReturn'?this.refs.suppliers:this.refs.branches)},pickShow:function(key){var menu=RW_UI.byId(key+'Menu');if(!menu)return;var q=(RW_UI.byId(key+'Search').value||'').trim();this.pickSearch(key,q)},pickSearch:function(key,q){var s=this,arr=this.pickArr(key)||[],z=this.norm(q),box=RW_UI.byId(key+'Menu');if(!box)return;var scored=arr.map(function(x){var code=s.norm(x.branch_code||x.vehicle_code||x.supplier_code||''),name=s.norm(x.name||x.vehicle_code||x.supplier_code||'');var sc=code===z&&z?120:name===z&&z?115:code.indexOf(z)===0&&z?95:name.indexOf(z)===0&&z?90:code.indexOf(z)>=0&&z?70:name.indexOf(z)>=0&&z?55:0;return{x:x,score:sc}}).filter(function(x){return z?x.score>0:true}).sort(function(a,b){return b.score-a.score||String(a.x.name||a.x.vehicle_code||a.x.supplier_code||a.x.branch_code).localeCompare(String(b.x.name||b.x.vehicle_code||b.x.supplier_code||b.x.branch_code))}).slice(0,12);box.innerHTML=scored.length?scored.map(function(o){var x=o.x,label=x.name||x.vehicle_code||x.supplier_code||x.branch_code,code=x.branch_code||x.vehicle_code||x.supplier_code||'';return '<div class=\\\"smart-row\\\" onclick=\\\"App.pickSelect(\\\\''+key+'\\\\',\\\\''+s.esc(x.id)+'\\\\')\\\"><div><b class=\\\"text-xs text-white\\\">'+s.esc(label)+'</b><div class=\\\"smart-code\\\">'+s.esc(code)+'</div></div><span class=\\\"text-[9px] text-emerald-400\\\">اختيار</span></div>'}).join(''):'<div class=\\\"smart-empty\\\">لا توجد نتائج</div>';box.classList.remove('hidden')},pickSelect:function(key,id){var s=this,arr=this.pickArr(key)||[],x=arr.find(function(z){return z.id===id});if(!x)return;RW_UI.byId(key).value=id;RW_UI.byId(key+'Search').value=x.name||x.vehicle_code||x.supplier_code||x.branch_code;RW_UI.byId(key+'Menu').classList.add('hidden');this.updateSource()},norm:function(v){return String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\\s+/g,' ').trim()},'''
