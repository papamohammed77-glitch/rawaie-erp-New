name: one-shot-vouchers-20260820
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'chore(ci): remove one-shot vouchers workflow'
    steps:
      - uses: actions/checkout@v4
      - name: Surgical patch vouchers.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('Current/PWA/vouchers.html')
          s=p.read_text(encoding='utf-8')
          original=s
          def must(old,new,tag):
              global s
              if old not in s:
                  raise SystemExit(f'MISSING PATCH TARGET: {tag}')
              s=s.replace(old,new,1)
          must(
              '.ws{height:100%;display:flex;flex-direction:column;min-height:0;background:#0f172a;color:#e2e8f0}.ws-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0;overflow:hidden}.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b}.cart{min-width:0;display:flex;flex-direction:column;min-height:0;background:#111827}.dark-input{background:#1e293b;border:1px solid #475569;color:#fff}',
              '.ws{height:100%;display:flex;flex-direction:column;min-height:0;background:#0f172a;color:#e2e8f0}.ws-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0;overflow:hidden}.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b}.cart{min-width:0;display:flex;flex-direction:column;min-height:0;background:#111827}.dark-input{background:#1e293b;border:1px solid #475569;color:#fff}.smart-field{position:relative}.smart-input{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;outline:none}.smart-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.10)}.smart-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:120;background:#0b1220;border:1px solid #334155;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.36);max-height:260px;overflow-y:auto}.smart-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #1e293b;cursor:pointer}.smart-row:hover,.smart-row.active{background:#1e293b}.smart-code{color:#94a3b8;font-size:10px}.smart-empty{padding:14px;text-align:center;color:#64748b;font-size:11px}',
              'base css + smart picker'
