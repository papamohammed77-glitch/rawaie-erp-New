          s=s.replace('.ws-grid{flex:1;display:grid;', '.ws-grid{flex:1;display:grid;',1)
          s=s.replace('.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b}', '.catalog{min-width:0;display:flex;flex-direction:column;min-height:0;border-left:1px solid #1e293b;overscroll-behavior:contain}',1)
          s=s.replace('<main id="mainContent" class="flex-1 overflow-hidden">', '<main id="mainContent" class="flex-1 min-h-0 overflow-hidden">',1)
