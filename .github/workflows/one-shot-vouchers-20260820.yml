              "App.tab=function(t){this.tabName=t;document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active');x.classList.add('text-slate-400')});var b=RW_UI.byId('tab-'+t);if(b){b.classList.add('active');b.classList.remove('text-slate-400')}if(t==='account'){this.account();return}this.loadList(t)},",
              "App.tab=function(t){this.tabName=t;document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active');x.classList.add('text-slate-400')});var b=RW_UI.byId('tab-'+t);if(b){b.classList.add('active');b.classList.remove('text-slate-400')}if(t==='account'){this.account();return}this.loadList(t)},",
              'noop guard'
