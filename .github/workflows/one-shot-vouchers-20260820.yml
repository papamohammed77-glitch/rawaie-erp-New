               "var App={user:null,company:null,tabName:'pending',type:'Transfer',mode:null,vouchers:[],refs:{branches:[],vehicles:[],suppliers:[]},items:[],stock:{},cart:[],cat:'الكل',timer:null,results:[],focus:0,receiveOps:{},pickerFocus:{},",
               'state')
          # pending list includes Received
