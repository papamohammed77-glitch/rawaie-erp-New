          # category active state and smarter product normalization
          s=s.replace("h+='<button onclick=\"App.catSet('+JSON.stringify(c)+')\" class=\"px-3 py-1.5 rounded-full text-[11px] font-black '+(i?'bg-slate-800 text-slate-400':'bg-blue-600 text-white')+'\">'+s.esc(c)+'</button>'", "h+='<button onclick=\"App.catSet('+JSON.stringify(c)+')\" class=\"px-3 py-1.5 rounded-full text-[11px] font-black '+(s.cat===c?'bg-blue-600 text-white':'bg-slate-800 text-slate-400')+'\">'+s.esc(c)+'</button>'",1)
          # product filter ranking
          oldfrag="var s=this,q=(RW_UI.byId('wsSearch')||{}).value||'',a=this.items.filter(function(x){return (s.cat==='الكل'||(x.category||'أخرى')===s.cat)&&(!q||(x.name||'').toLowerCase().includes(q.toLowerCase())||(x.item_code||'').toLowerCase().includes(q.toLowerCase())||(x.barcode||'').toLowerCase().includes(q.toLowerCase())||(x.search_label||'').toLowerCase().includes(q.toLowerCase()))}).slice(0,100);"
          newfrag="var s=this,q=(RW_UI.byId('wsSearch')||{}).value||'',z=this.norm(q),a=this.items.filter(function(x){if(s.cat!=='الكل'&&(x.category||'أخرى')!==s.cat)return false;if(!z)return true;var n=s.norm(x.name),c=s.norm(x.item_code),b=s.norm(x.barcode),l=s.norm(x.search_label);return c===z||b===z||c.indexOf(z)===0||b.indexOf(z)===0||n.indexOf(z)>=0||l.indexOf(z)>=0}).sort(function(a,b){var A=function(x){var c=s.norm(x.item_code),br=s.norm(x.barcode),n=s.norm(x.name),l=s.norm(x.search_label);return c===z?120:br===z?115:c.indexOf(z)===0?95:br.indexOf(z)===0?90:n.indexOf(z)>=0?60:l.indexOf(z)>=0?45:0},B=A(b)-A(a);return B||String(a.name||'').localeCompare(String(b.name||''))}).slice(0,100);"
          must(oldfrag,newfrag,'product smart filter')
          # replace search function with normalized ranking
