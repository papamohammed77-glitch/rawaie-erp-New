          end=s.index('updateResults:function()',start)
          searchfn="""search:function(q){var s=this;this.renderProducts();clearTimeout(this.timer);this.timer=setTimeout(function(){var z=s.norm(q),box=RW_UI.byId('wsResults');if(!z){box.classList.add('hidden');s.results=[];return}var a=s.items.map(function(x){var n=s.norm(x.name),c=s.norm(x.item_code),b=s.norm(x.barcode),l=s.norm(x.search_label),score=c===z?140:b===z?135:c.indexOf(z)===0?110:b.indexOf(z)===0?105:n.indexOf(z)>=0?70:l.indexOf(z)>=0?50:0;return{item:x,score:score}}).filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score||String(a.item.name||'').localeCompare(String(b.item.name||''))}).slice(0,12).map(function(x){return x.item});s.results=a;s.focus=0;box.innerHTML=a.length?a.map(function(x,i){return '<div class=\\\"result-row '+(i===0?'active':'')+'\\\" data-ri=\\\"'+i+'\\\" onclick=\\\"App.add(\\\\''+s.esc(x.item_code)+'\\\\');App.focusSearch()\\\"><div class=\\\"w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center overflow-hidden\\\">'+(x.image_url?'<img src=\\\"'+s.esc(x.image_url)+'\\\" class=\\\"w-full h-full object-cover\\\">':'📦')+'</div><div class=\\\"flex-1 min-w-0\\\"><b class=\\\"text-xs truncate block\\\">'+s.esc(x.name||x.item_code)+'</b><span class=\\\"text-[10px] text-slate-400\\\">'+s.esc(x.item_code)+' · '+s.esc(x.barcode||'')+' · '+s.esc(x.unit||'حبة')+'</span></div><span class=\\\"text-[10px] text-emerald-600 font-black\\\">إضافة</span></div>'}).join(''):'<div class=\\\"p-4 text-center text-slate-400\\\">لا توجد نتائج ذكية</div>';box.classList.remove('hidden')},120)},"""
