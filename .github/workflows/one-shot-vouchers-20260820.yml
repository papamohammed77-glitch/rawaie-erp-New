          new="""cards:function(rows,scope){var s=this;if(!rows.length)return '<div class=\"card text-center py-14\"><div class=\"text-5xl mb-3\">☕</div><b class=\"text-slate-400\">لا توجد أذونات</b></div>';return rows.map(function(v){var c=v.status==='Draft'?'bg-amber-100 text-amber-700':v.status==='Sent'?'bg-blue-100 text-blue-700':v.status==='Received'?'bg-emerald-100 text-emerald-700':v.status==='Cancelled'?'bg-rose-100 text-rose-700':'bg-slate-100 text-slate-700';var l=v.status==='Draft'?'مسودة':v.status==='Sent'?'مُرسل':v.status==='Received'?'مُستلم':v.status==='Completed'?'مكتمل':'ملغى';var a='';if(scope==='pending'&&v.status==='Draft')a+='<button onclick=\"event.stopPropagation();App.send(\\''+s.esc(v.voucher_code)+'\\')\" class=\"bg-indigo-600 text-white px-3 py-2 rounded-xl text-xs font-black\">إرسال</button><button onclick=\"event.stopPropagation();App.cancel(\\''+s.esc(v.voucher_code)+'\\')\" class=\"bg-rose-600 text-white px-3 py-2 rounded-xl text-xs font-black\">إلغاء</button>';if(scope==='pending'&&v.status==='Sent')a+='<button onclick=\"event.stopPropagation();App.receive(\\''+s.esc(v.voucher_code)+'\\')\" class=\"bg-emerald-600 text-white px-3 py-2 rounded-xl text-xs font-black\">استلام</button>';if(scope==='pending'&&v.status==='Received')a+='<button onclick=\"event.stopPropagation();App.complete(\\''+s.esc(v.voucher_code)+'\\')\" class=\"bg-violet-600 text-white px-3 py-2 rounded-xl text-xs font-black\">إكمال</button>';return '<div class=\"card mb-3 cursor-pointer\"><div class=\"flex justify-between gap-3\"><div onclick=\"App.details(\\''+s.esc(v.voucher_code)+'\\')\"><div><b>'+s.esc(v.voucher_code)+'</b> <span class=\"px-2 py-1 rounded-full text-[10px] font-bold '+c+'\">'+l+'</span></div><p class=\"text-xs text-slate-400 mt-1\">'+s.esc(v.type)+' · '+s.esc(v.reference||'بدون مرجع')+' · '+s.esc(v.voucher_date||'')+'</p></div><div class=\"flex gap-2 flex-wrap justify-end\">'+a+'</div></div></div>'}).join('')},"""
          if old not in s:
              raise SystemExit('MISSING PATCH TARGET: cards')
          s=s.replace(old,new,1)
          # insert cancel/complete after send
          must("send:function(code){var s=this;RW_UI.showConfirm('تنفيذ '+code+'؟',function(){RW_UI.showLoader();RW_API.call('send-stock-voucher',{voucher_code:code},function(j){RW_UI.hideLoader();if(j&&j.success){RW_UI.toast('تم التنفيذ','success');s.loadList('pending')}else RW_UI.showError((j&&j.msg)||'فشل التنفيذ')})})},",
          "send:function(code){var s=this;RW_UI.showConfirm('تنفيذ '+code+'؟',function(){RW_UI.showLoader();RW_API.call('send-stock-voucher',{voucher_code:code},function(j){RW_UI.hideLoader();if(j&&j.success){RW_UI.toast('تم التنفيذ','success');s.loadList('pending')}else RW_UI.showError((j&&j.msg)||'فشل التنفيذ')})})},cancel:function(code){var s=this;RW_UI.showConfirm('إلغاء '+code+'؟',function(){RW_UI.showLoader();RW_API.call('cancel-stock-voucher',{voucher_code:code},function(j){RW_UI.hideLoader();if(j&&j.success){RW_UI.toast('تم الإلغاء','success');s.loadList('pending')}else RW_UI.showError((j&&j.msg)||'فشل الإلغاء')})})},complete:function(code){var s=this;RW_UI.showConfirm('إكمال '+code+'؟',function(){RW_UI.showLoader();RW_API.call('complete-stock-voucher',{voucher_code:code},function(j){RW_UI.hideLoader();if(j&&j.success){RW_UI.toast('تم الإكمال','success');s.loadList('pending')}else RW_UI.showError((j&&j.msg)||'فشل الإكمال')})})},",
