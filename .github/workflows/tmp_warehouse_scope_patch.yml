name: tmp-warehouse-supervisor-team-scope
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'warehouse supervisor branch-scoped team') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Surgical patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('Current/PWA/warehouse.supervisor')
          text = p.read_text(encoding='utf-8')
          if 'branchScope: []' in text:
              raise SystemExit('PATCH_ALREADY_APPLIED')

          old_state = "currentUser: null, companyId: null, staffList: [], currentTab: 'dashboard', chartInstance: null,"
          new_state = "currentUser: null, companyId: null, supervisorProfile: null, branchScope: [], branchMap: {}, staffList: [], currentTab: 'dashboard', chartInstance: null,"
          if old_state not in text:
              raise SystemExit('STATE_MARKER_NOT_FOUND')
          text = text.replace(old_state, new_state, 1)

          old_init_start = "    init: function(){var s=this;RW_Auth.init(function(user,err){"
          init_pos = text.find(old_init_start)
          if init_pos < 0:
              raise SystemExit('INIT_START_NOT_FOUND')
          enter_marker = "    enterApp: function(){"
          enter_pos = text.find(enter_marker, init_pos)
          if enter_pos < 0:
              raise SystemExit('ENTER_MARKER_NOT_FOUND')
          new_init = '''    init: function(){
        var s=this;
        RW_Auth.init(function(user,err){
            if(err||!user){
                if(err==='NO_SESSION')return;
                RW_UI.showError('فشل استعادة الجلسة');
                return;
            }
            var isO=user.isOwner,perms=user.permissions||[],has=isO||perms.indexOf('warehouse_supervisor')!==-1;
            if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return;}
            RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);
            s.currentUser=user;
            supabase.from('users')
                .select('company_id,default_branch_id,allowed_branch_ids')
                .eq('id',user.id||'')
                .maybeSingle()
                .then(function(r){
                    if(r.error||!r.data||!r.data.company_id)throw new Error('سياق الشركة غير محدد');
                    s.companyId=r.data.company_id;
                    s.supervisorProfile=r.data;
                    return supabase.from('branches')
                        .select('id,branch_code,name')
                        .eq('company_id',s.companyId)
                        .order('name');
                })
                .then(function(r){
                    if(r.error)throw new Error(r.error.message||'تعذر تحميل فروع الشركة');
                    s.branchMap={};
                    (r.data||[]).forEach(function(b){s.branchMap[b.id]=b;});
                    s.branchScope=s.resolveBranchScope(s.supervisorProfile);
                    if(!s.branchScope.length)throw new Error('نطاق فرع المشرف غير محدد');
                    s.enterApp();
                })
                .catch(function(e){RW_UI.showError(e.message||'تعذر تحديد نطاق الفرع');});
        });
    },

    normalizeBranchScope: function(value){
        if(value===null||value===undefined)return [];
        if(Array.isArray(value))return value.map(function(x){return String(x).trim();}).filter(Boolean);
        if(typeof value==='string'){
            var v=value.trim();
            if(!v)return [];
            try{
                var parsed=JSON.parse(v);
                if(Array.isArray(parsed))return parsed.map(function(x){return String(x).trim();}).filter(Boolean);
                if(typeof parsed==='string'&&parsed.trim())return [parsed.trim()];
            }catch(e){}
            return [v];
        }
        return [];
    },

    resolveBranchScope: function(row){
        var s=this;
        if(!row)return [];
        if(row.default_branch_id && s.branchMap[row.default_branch_id] && s.branchMap[row.default_branch_id].branch_code){
            return [String(s.branchMap[row.default_branch_id].branch_code).trim()];
        }
        return s.normalizeBranchScope(row.allowed_branch_ids);
    },

    scopesIntersect: function(actorScope,targetScope){
        if(!actorScope.length||!targetScope.length)return false;
        if(actorScope.indexOf('*')!==-1)return true;
        for(var i=0;i<actorScope.length;i++){
            if(targetScope.indexOf(actorScope[i])!==-1)return true;
        }
        return false;
    },

    branchScopeLabel: function(scope){
        var s=this;
        if(!scope||!scope.length)return 'غير محدد';
        var out=[];
        for(var i=0;i<scope.length;i++){
            var code=scope[i];
            if(code==='*'){out.push('كل الفروع');continue;}
            var found=null;
            var ids=Object.keys(s.branchMap||{});
            for(var j=0;j<ids.length;j++){
                var b=s.branchMap[ids[j]];
                if(b && b.branch_code===code){found=b;break;}
            }
            out.push(found ? (found.name||code) : code);
        }
        return out.join('، ');
    },

'''
          text = text[:init_pos] + new_init + text[enter_pos:]

          load_start = "    loadStaff: function(){"
          load_pos = text.find(load_start)
          render_dash = "    renderDashboard: function(){"
          dash_pos = text.find(render_dash, load_pos)
          if load_pos < 0 or dash_pos < 0:
              raise SystemExit('LOADSTAFF_BOUNDARY_NOT_FOUND')
          new_load = '''    loadStaff: function(){
        var s=this;
        if(!s.branchScope.length){
            s.staffList=[];
            if(s.currentTab==='roster')s.renderRoster();
            return;
        }
        supabase.from('users')
            .select('id,name,email,role,active_warehouse_role,default_branch_id,allowed_branch_ids')
            .eq('company_id',s.companyId)
            .eq('role','مخزني')
            .eq('status','Active')
            .order('name')
            .then(function(r){
                if(r.error){Swal.fire({title:'خطأ',text:r.error.message,icon:'error'});return;}
                var all=r.data||[];
                s.staffList=all.filter(function(emp){
                    return s.scopesIntersect(s.branchScope,s.resolveBranchScope(emp));
                });
                if(s.currentTab==='roster')s.renderRoster();
            });
    },

'''
          text = text[:load_pos] + new_load + text[dash_pos:]

          roster_start = "    renderRoster: function(){"
          roster_pos = text.find(roster_start)
          update_marker = "    updateRole: function(userId,newRole){"
          update_pos = text.find(update_marker, roster_pos)
          if roster_pos < 0 or update_pos < 0:
              raise SystemExit('ROSTER_BOUNDARY_NOT_FOUND')
          new_roster = '''    renderRoster: function(){
        var s=this;
        RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-2xl text-blue-400"></i></div>');
        var roles=['استلام','تحضير','تحميل','مرتجعات','تفريغ','أذونات','جرد','احتياطي'];
        var icons={'استلام':'📦','تحضير':'📋','تحميل':'🚛','مرتجعات':'↩️','تفريغ':'🔄','أذونات':'📄','جرد':'🔍','احتياطي':'🪑'};
        var html='<h2 class="text-lg font-black mb-2">👥 فريق المخازن</h2>';
        html+='<div class="card mb-4 bg-slate-50 border border-slate-200">';
        html+='<div class="flex items-center justify-between gap-3"><div><div class="font-black text-slate-800">نطاق عمل المشرف</div><div class="text-xs text-slate-500 mt-1">'+s.branchScopeLabel(s.branchScope)+'</div></div>';
        html+='<div class="bg-blue-100 text-blue-700 px-3 py-2 rounded-2xl text-xs font-black">'+s.staffList.length+' عامل مخزني</div></div>';
        html+='<p class="text-xs text-slate-500 mt-3">اختر المهمة التشغيلية للفرد حسب احتياج العمل. يمكن تبديل المهمة في أي وقت، بشرط بقاء العامل ضمن نطاق فرع المشرف.</p></div>';
        if(!s.staffList.length){
            html+='<div class="card text-center text-slate-400">لا يوجد عمال مخازن في نطاق الفرع الحالي</div>';
        }else{
            for(var i=0;i<s.staffList.length;i++){
                var emp=s.staffList[i];
                var role=emp.active_warehouse_role||'احتياطي';
                var empScope=s.resolveBranchScope(emp);
                var empBranch=s.branchScopeLabel(empScope);
                html+='<div class="card mb-3 slide-in">';
                html+='<div class="flex justify-between items-center mb-3 gap-3"><div class="min-w-0"><span class="font-bold">'+emp.name+'</span><br><span class="text-xs text-slate-400">'+emp.email+'</span></div>';
                html+='<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap">'+(icons[role]||'')+' '+role+'</span></div>';
                html+='<div class="text-[11px] text-slate-400 mb-2">الفرع: <span class="font-bold text-slate-600">'+empBranch+'</span></div>';
                html+='<label class="text-xs font-bold text-slate-500 block mb-1">المهمة التشغيلية الحالية</label>';
                html+='<select class="w-full p-3 bg-slate-50 rounded-xl border font-bold text-sm" data-user-id="'+emp.id+'" onchange="App.updateRole(this.dataset.userId,this.value)">';
                for(var j=0;j<roles.length;j++){
                    html+='<option value="'+roles[j]+'"'+(roles[j]===role?' selected':'')+'>'+(icons[roles[j]]||'')+' '+roles[j]+'</option>';
                }
                html+='</select></div>';
            }
        }
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
    },

'''
          text = text[:roster_pos] + new_roster + text[update_pos:]

          if 'branchScopeLabel(s.branchScope)' not in text or "eq('role','مخزني')" not in text or 'scopesIntersect' not in text:
              raise SystemExit('PATCH_SENTINELS_NOT_FOUND_AFTER_PATCH')

          p.write_text(text, encoding='utf-8')

      - name: Commit patch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Current/PWA/warehouse.supervisor
          git commit -m "fix: warehouse supervisor branch-scoped team" || exit 0
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/tmp_warehouse_scope_patch.yml
          git add .github/workflows/tmp_warehouse_scope_patch.yml
          git commit -m "chore: remove temporary warehouse supervisor patch workflow" || exit 0
          git push
