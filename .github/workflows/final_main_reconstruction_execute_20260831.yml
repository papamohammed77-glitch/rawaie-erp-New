name: RAWAEA NEW-MAIN TARGET CONTRACT CLOSURE

on:
  push:
    branches: [main]
    paths: [Current/PWA/New-main, CURRENT_STATE.md, .github/workflows/final_main_reconstruction_execute_20260831.yml]
  workflow_dispatch:

concurrency:
  group: rawaea-new-main-contract-closure
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Static target validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          if s.count('/* RAWAEA 122 DIAMOND CONTRACT CLOSURE v1 */')!=1: raise SystemExit('122_MARKER_MISSING')
          if "meta.isOwner===true||meta.isOwner==='true'" not in s: raise SystemExit('OWNER_METADATA_CONTRACT_MISSING')
          for x in ['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views']:
              if x not in s: raise SystemExit('MODULE_MISSING:'+x)
          m=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
          if len(m)!=1: raise SystemExit('INLINE_RUNTIME_COUNT')
          if not re.fullmatch(r'\s*</body>\s*</html>\s*',s[m[0].end():],re.I): raise SystemExit('OUTER_HTML_TAIL_INVALID')
          f=Path(tempfile.gettempdir())/'new-main.js'; f.write_text(m[0].group('b'),encoding='utf-8')
          r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('TARGET_JS_SYNTAX_FAIL')
          print('STATIC_TARGET_PASS')
          PY
      - name: Browser navigation owner license CRM smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p /tmp/rawaea-pwa
          cp Current/PWA/New-main /tmp/rawaea-pwa/New-main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-pwa >/tmp/rawaea-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[];
            p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});
            await p.goto('http://127.0.0.1:8123/New-main.html',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(2000);
            const out=await p.evaluate(async()=>{
              const n=window.RW_Navigation,flat=[];const walk=a=>(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)walk(x.submenu)});walk(n.menuTree);
              const critical=['hr','crm','users','roles','license','settings'].every(x=>flat.includes(x));
              const mods=['RW_CRM','RW_Users','RW_Roles','RW_OwnerLicense','RW_HR','RW_Views'].every(x=>!!window[x]);
              const refs={crm:window.RW_CRM,users:window.RW_Users,roles:window.RW_Roles,license:window.RW_OwnerLicense},orig={};const calls=[];
              Object.keys(refs).forEach(k=>{orig[k]=refs[k].render;refs[k].render=()=>{calls.push(k);return Promise.resolve()}});
              window.RW_STATE.app.currentUser={isOwner:false,permissions:['customers','users','roles']};let denied=false;
              await n.navigate('crm');await n.navigate('users');await n.navigate('roles');try{await n.navigate('license')}catch(e){denied=e.message==='OWNER_ONLY'}
              window.RW_STATE.app.currentUser={isOwner:true,permissions:['*']};await n.navigate('license');
              Object.keys(refs).forEach(k=>refs[k].render=orig[k]);
              return {critical,mods,denied,calls,contract:window.RW_122_CONTRACT};
            });
            console.log(JSON.stringify({out,pe,ce}));
            if(!out.critical||!out.mods||!out.denied||out.calls.join(',')!=='crm,users,roles,license'||pe.length||ce.length)process.exit(2);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE
