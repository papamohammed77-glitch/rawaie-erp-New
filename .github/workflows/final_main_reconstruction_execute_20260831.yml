name: RAWAEA TARGET-ONLY GOLD DIAMOND CLOSURE

# Temporary activation of an existing repository executor.
# Product target remains Current/PWA/New-main only.
# This workflow is self-disabling after the successful [CTO-EXECUTED] commit.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  closure:
    if: ${{ !contains(github.event.head_commit.message, '[CTO-EXECUTED]') && !contains(github.event.head_commit.message, '[CTO-TRIGGER]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout governed repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Reconstruct New-main from the existing eleven governed fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_final_main_reconstruction_20260831.py

      - name: Execute and prove P163 ownership closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          compat='/* RAWAEA MAIN2 COMPATIBILITY */'
          auth='/* RAWAEA MAIN2 AUTHORITATIVE MODULE */'
          version="window.RW_PWA_RECONSTRUCTION_VERSION='MAIN2-COMPLETE-SURGICAL-v1';"
          governed='// MAIN2_GOVERNED_CLOSED:v1'
          aliases=['window.RW_Dashboard={render:renderDashboard};','window.RW_Items={render:renderItems};']
          checks={
            'compat_absent':compat not in s,
            'authoritative_exactly_one':s.count(auth)==1,
            'reconstruction_version_exactly_one':s.count(version)==1,
            'governed_exactly_one':s.count(governed)==1,
            'dashboard_legacy_alias_absent':aliases[0] not in s,
            'items_legacy_alias_absent':aliases[1] not in s,
            'actions_preserved':'actions' in s,
            'main1_delegation_preserved':'main1Delegation' in s,
            'main3_preserved':'MAIN3' in s,
            'main2_owner_sequence':re.search(r"window\\.RW_Items\\s*=\\s*RW_Items;[\\s\\S]{0,180}MAIN2-COMPLETE-SURGICAL-v1[\\s\\S]{0,180}MAIN2_GOVERNED_CLOSED:v1",s) is not None,
            'script_balance':s.lower().count('<script')==s.lower().count('</script>'),
            'style_balance':s.lower().count('<style')==s.lower().count('</style>'),
            'canonical_sw_once':s.count("navigator.serviceWorker.register('./sw.js',{scope:'./'})")==1,
            'gd_marker':'RAWAEA GOLD DIAMOND' in s,
            'core_stock_engine':'post_stock_movement' in s and 'reserve_stock' in s,
            'core_auth':'window.RW_Auth' in s and 'window.RW_Navigation' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('GOLD_DIAMOND_SOURCE_GATES_FAILED:'+repr(bad))
          print('GOLD_DIAMOND_SOURCE_GATES_PASS',checks)
          print('NEW_MAIN_SHA256',hashlib.sha256(s.encode()).hexdigest())
          PY

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          m=[x for x in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',x.group('a') or '',re.I)]
          if len(m)!=1: raise SystemExit('INLINE_APPLICATION_SCRIPT_COUNT='+str(len(m)))
          Path('/tmp/rawaea-new-main.js').write_text(m[0].group('b'),encoding='utf-8')
          PY
          node --check /tmp/rawaea-new-main.js

      - name: Browser smoke gate against the exact New-main target
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          mkdir -p /tmp/rawaea-pwa
          cp -r Current/PWA/. /tmp/rawaea-pwa/
          cp Current/PWA/New-main /tmp/rawaea-pwa/New-main.html
          python3 -m http.server 8123 --directory /tmp/rawaea-pwa >/tmp/rawaea-pwa.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            const errors=[];
            p.on('pageerror',e=>errors.push(e.message));
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await p.goto('http://127.0.0.1:8123/New-main.html',{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForTimeout(1500);
            const r=await p.evaluate(async()=>{
              const S=window.RW_STATE,N=window.RW_Navigation;
              const flat=[];(function w(a){(a||[]).forEach(x=>{if(x.view)flat.push(x.view);if(x.submenu)w(x.submenu)})})(N&&N.menuTree);
              const req=['dashboard','telesales','customers','online-store','pos','orders','runsheets','suppliers','purchase-pos','purchases','receiving','items','branches','picking','loading','delivery','return','unloading','transfer','direct-sale','direct-return','supplier-return','vouchers','vehicle-count','branch-count','general-count','settlement','reports-dashboard','reports-detailed','reports-comprehensive','hr','crm','users','roles','license','settings','audit-log','notifications'];
              const mods=['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_OwnerLicense','RW_HR','RW_CRM','RW_Users','RW_Roles','RW_Views'];
              let denied=false; if(S&&S.app&&N&&N.navigate){S.app.currentUser={isOwner:false};try{await N.navigate('license')}catch(e){denied=e.message==='OWNER_ONLY'}}
              return {lang:document.documentElement.lang,body:!!document.body,state:!!S,auth:!!window.RW_Auth,nav:!!N,views:!!window.RW_Views,shell:!!window.RW_ShellContext,owner:!!window.RW_OwnerContract,critical:req.every(v=>flat.includes(v)),mods:mods.every(v=>!!window[v]),denied,count:flat.length,gd:!!window.RW_GOLD_DIAMOND};
            });
            console.log(JSON.stringify({r,errors}));
            if(errors.length||r.lang!=='ar'||!r.body||!r.state||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||!r.critical||!r.mods||!r.denied||r.count<30||!r.gd)process.exit(2);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE

      - name: Persist only the verified product result and state evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          target=Path('Current/PWA/New-main').read_text(encoding='utf-8')
          state=Path('CURRENT_STATE.md')
          st=state.read_text(encoding='utf-8')
          marker='P163 CLOSED — MAIN2 ownership surgery + governed New-main reconstruction'
          evidence=(
            '\n\n## CTO EXECUTION — 2026-09-03\n\n'
            + marker + '\n'
            + '- Target: `Current/PWA/New-main`\n'
            + f'- Verified target SHA-256: `{hashlib.sha256(target.encode()).hexdigest()}`\n'
            + '- Reconstruction source: existing `Current/PWA/main/main1.md` through `main11.md`.\n'
            + '- P163: duplicate MAIN2 compatibility removed; only the authoritative MAIN2 owner remains; legacy Main1 dashboard/items aliases removed; `actions`, `main1Delegation`, and MAIN3 preserved.\n'
            + '- Static gates: source ownership, JS syntax, document balance, service-worker uniqueness, and core stock-engine contract passed.\n'
            + '- Browser smoke: shell, navigation, modules, route set, owner-only license boundary, and Gold/Diamond marker passed.\n'
            + '- Production database writes: none. `Original/PWA/main/*` remained evidence-only.\n'
          )
          if marker not in st: state.write_text(st.rstrip()+evidence,encoding='utf-8')
          PY
          git config user.name 'RAWAEA CTO Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/New-main CURRENT_STATE.md
          git diff --cached --check
          git commit -m '[CTO-EXECUTED] New-main Gold/Diamond closure P163'
          git push origin HEAD:main
