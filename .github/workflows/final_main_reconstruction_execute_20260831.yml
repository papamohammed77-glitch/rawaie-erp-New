name: RAWAEA NEW-MAIN TARGET RECONSTRUCTION

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main/main*.md'
      - 'Current/PWA/New-main'
      - '.github/workflows/final_main_reconstruction_execute_20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message, '[new-main-target-persist]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and published target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: MAIN2-MAIN11 authoritative module integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-new-main-bot'
          git config user.email 'rawaea-new-main-bot@users.noreply.github.com'

          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          target=Path('Current/PWA/New-main')
          source_dir=Path('Current/PWA/main')

          def runtime(s):
              ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
              if len(ms)!=1: raise RuntimeError('INLINE_RUNTIME_COUNT:'+str(len(ms)))
              return ms[0]

          def validate(stage):
              s=target.read_text(encoding='utf-8')
              required=['rw-login-page','rw-main-shell','rw-page-container','rw-header-title','rw-header-subtitle','rw-sidebar-nav','rw-logout-btn']
              for name,min_stage in [('RW_ShellContext',1),('RW_Auth',1),('RW_Navigation',1),('RW_Dashboard',2),('RW_Items',2),('RW_POS',4),('RW_Orders',5),('RW_Runsheets',6),('RW_Purchases',7),('RW_Warehouse',7),('RW_Finance',8),('RW_Reports',9),('RW_OwnerLicense',10),('RW_HR',11),('RW_CRM',11),('RW_Views',11)]:
                  if stage>=min_stage: required.append(name)
              miss=[x for x in required if x not in s]
              if miss: raise RuntimeError(f'MAIN{stage}_CONTRACT_MISSING:'+','.join(miss))
              if s.lower().count('</body>')!=1 or s.lower().count('</html>')!=1: raise RuntimeError(f'MAIN{stage}_CLOSURE_INVALID')
              js=runtime(s).group('b')
              f=Path(tempfile.gettempdir())/f'rw-stage-{stage}.js';f.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode: print(r.stderr);raise RuntimeError(f'MAIN{stage}_JS_SYNTAX_FAIL')

          def commit_stage(stage):
              subprocess.run(['git','add','Current/PWA/New-main'],check=True)
              subprocess.run(['git','commit','--allow-empty','-m',f'[new-main-target-persist] MAIN{stage} complete'],check=True)
              subprocess.run(['git','push','origin','HEAD:main'],check=True)

          validate(1)
          s=target.read_text(encoding='utf-8')
          # Repair MAIN2 in-place if the earlier compact/failed implementation exists.
          source2=source_dir/'main2.md'
          if '/* RAWAEA MAIN2 AUTHORITATIVE MODULE */' not in s:
              legacy_start=s.find('/* RAWAEA MAIN2 COMPATIBILITY */')
              legacy_end=s.find('/* MAIN2_GOVERNED_CLOSED:v1 */',legacy_start)
              if legacy_start>=0 and legacy_end>=0:
                  m=runtime(s); a,b=m.start('b'),m.end('b'); body=m.group('b'); ls=body.find('/* RAWAEA MAIN2 COMPATIBILITY */'); le=body.find('/* MAIN2_GOVERNED_CLOSED:v1 */',ls)
                  if ls<0 or le<0: raise RuntimeError('MAIN2_LEGACY_BODY_NOT_FOUND')
                  frag=source2.read_text(encoding='utf-8-sig').rstrip()
                  s=s[:a]+body[:ls]+'/* RAWAEA MAIN2 AUTHORITATIVE MODULE */\n'+frag+'\n'+body[le+len('/* MAIN2_GOVERNED_CLOSED:v1 */'):]+s[b:]
                  target.write_text(s,encoding='utf-8')
              else:
                  raise RuntimeError('MAIN2_EXISTING_ANCHOR_NOT_FOUND')
          validate(2)
          commit_stage(2)

          for stage in range(3,12):
              s=target.read_text(encoding='utf-8')
              marker=f'/* RAWAEA MAIN{stage} AUTHORITATIVE MODULE */'
              if marker not in s:
                  m=runtime(s); a,b=m.start('b'),m.end('b'); body=m.group('b')
                  frag=(source_dir/f'main{stage}.md').read_text(encoding='utf-8-sig').rstrip()
                  if re.search(r'</script>|<!doctype\b|<html\b|<body\b',frag,re.I): raise RuntimeError(f'MAIN{stage}_WRAPPER_INVALID')
                  candidate=s[:a]+body+'\n'+marker+'\n'+frag+s[b:]
                  target.write_text(candidate,encoding='utf-8')
              validate(stage)
              commit_stage(stage)

          print('MAIN1_TO_MAIN11_TARGET_CHAIN_COMPLETE')
          PY

      - name: Final published New-main browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 --directory Current/PWA >/tmp/rawaea-new-main-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[],bad=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});p.on('response',r=>{if(r.status()>=400&&!/favicon\\.ico$/i.test(r.url()))bad.push(r.status()+':'+r.url())});await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(3000);const x=await p.evaluate(()=>({lang:document.documentElement.lang,login:!!document.getElementById('rw-login-page'),app:!!document.getElementById('rw-main-shell'),shell:!!window.RW_ShellContext,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,owner:!!window.RW_OwnerLicense,mods:['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_HR','RW_CRM'].every(k=>!!window[k])}));console.log(JSON.stringify({x,pe,ce,bad}));if(x.lang!=='ar'||!x.login||!x.app||!x.shell||!x.auth||!x.nav||!x.views||!x.owner||!x.mods||pe.length||ce.length||bad.length)process.exit(2);await b.close();})().catch(e=>{console.error(e);process.exit(2)});
          NODE
