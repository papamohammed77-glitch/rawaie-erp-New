name: RAWAEA FINAL MAIN.HTML RECONSTRUCTION — 20260831

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_final_main_reconstruction_20260831.py'
      - 'tools/p0_main_shell_repair_v2.py'
      - 'tools/master_reconstruction_postprocess.py'
      - 'Current/PWA/main.html'
      - 'Original/PWA/main.html'
      - 'Current/PWA/main/**'
      - '.github/workflows/final_main_reconstruction_execute_20260831.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/run_final_main_reconstruction_20260831.py'
      - 'tools/master_reconstruction_postprocess.py'
      - 'Original/PWA/main.html'
      - 'Current/PWA/main/**'
      - '.github/workflows/final_main_reconstruction_execute_20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message, '[final-main-reconstruction-persist]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout verified reconstruction sources
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s Current/PWA/main.html
          test -s Original/PWA/main.html
          git rev-parse HEAD
          sha256sum Current/PWA/main.html

      - name: Execute clean-room reconstruction
        run: python3 tools/run_final_main_reconstruction_20260831.py

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('Current/PWA/main.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,c in enumerate(scripts,1):
              p=Path(tempfile.gettempdir())/f'rw-final-{i}.js'
              p.write_text(c,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'JS_SYNTAX_FAIL_{i}')
          print('JS_SYNTAX_PASS',len(scripts))
          PY

      - name: Browser smoke gate
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rw-final-pwa
          mkdir -p /tmp/rw-final-pwa
          cp -r Current/PWA/. /tmp/rw-final-pwa/
          python3 -m http.server 8123 --directory /tmp/rw-final-pwa >/tmp/rw-final-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[]; const consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            await page.goto('http://127.0.0.1:8123/main.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const r=await page.evaluate(()=>({
              title:document.title,
              lang:document.documentElement.lang,
              body:!!document.body,
              rwState:!!window.RW_STATE,
              auth:!!window.RW_Auth,
              nav:!!window.RW_Navigation,
              views:!!window.RW_Views,
              shell:!!window.RW_ShellContext,
              owner:!!window.RW_OwnerContract
            }));
            console.log(JSON.stringify({result:r,pageErrors,consoleErrors}));
            if(r.lang!=='ar'||!r.body||!r.rwState||!r.auth||!r.nav||!r.views||!r.shell||!r.owner||pageErrors.length) process.exit(2);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE

      - name: Persist final reconstructed main and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-reconstruction-bot'
          git config user.email 'rawaea-reconstruction-bot@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('Current/PWA/main.html')
          out=Path('Current/CTO/20260831_MAIN_HTML_FINAL_EXECUTION.json')
          payload={'event_type':'MAIN_HTML_RECONSTRUCTION_EXECUTED_AND_BROWSER_VERIFIED','utc':'2026-08-31','main_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'executor':'tools/run_final_main_reconstruction_20260831.py','source_seed':'Current/PWA/main/main1.md..main11.md','historical_main_used_as_seed':False,'historical_fragment_concatenation':True,'production_runtime':'PENDING'}
          out.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('Current/CTO/20260831_MAIN_HTML_RECONSTRUCTION_EVENT.md').write_text('# LAST VERIFIED EVENT\n\nMAIN.HTML reconstruction executed from the 11 material fragments by governed clean-room runner and passed structural, contract, JavaScript syntax, and local browser smoke gates. Production runtime remains a separate gate.\n',encoding='utf-8')
          PY
          git add Current/PWA/main.html Current/CTO
          git diff --cached --quiet && { echo 'NO_FINAL_DELTA'; exit 1; }
          git commit -m '[final-main-reconstruction-persist] persist reconstructed main.html and verified evidence'
          git push origin HEAD:main
