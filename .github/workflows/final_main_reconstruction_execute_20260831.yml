name: RAWAEA NEW-MAIN TARGET RECONSTRUCTION

on:
  push:
    branches: [main]
    paths:
      - 'tools/run_final_main_reconstruction_20260831.py'
      - 'Current/PWA/main/**'
      - 'Current/PWA/New-main'
      - '.github/workflows/final_main_reconstruction_execute_20260831.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message, '[new-main-target-persist]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout target and authoritative fragments
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Baseline target protection
        shell: bash
        run: |
          set -euo pipefail
          test -s Current/PWA/New-main
          test -s Current/PWA/main/main1.md
          test -s Current/PWA/main/main2.md
          test -s Current/PWA/main/main3.md
          test -s Current/PWA/main/main4.md
          test -s Current/PWA/main/main5.md
          test -s Current/PWA/main/main6.md
          test -s Current/PWA/main/main7.md
          test -s Current/PWA/main/main8.md
          test -s Current/PWA/main/main9.md
          test -s Current/PWA/main/main10.md
          test -s Current/PWA/main/main11.md
          git rev-parse HEAD
          sha256sum Current/PWA/New-main

      - name: Build New-main from MAIN1 through MAIN11
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_final_main_reconstruction_20260831.py

      - name: Structural and JavaScript gate on New-main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          required=['rw-login-page','rw-main-shell','rw-page-container','rw-header-title','rw-header-subtitle','rw-sidebar-nav','rw-logout-btn','window.RW_ShellContext','window.RW_Auth','window.RW_Navigation','window.RW_Views','window.RW_OwnerLicense','window.RW_Dashboard','window.RW_Items','window.RW_POS','window.RW_Orders','window.RW_Runsheets','window.RW_Purchases','window.RW_Warehouse','window.RW_Finance','window.RW_Reports','window.RW_HR','window.RW_CRM']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('STRUCTURAL_CONTRACT_MISSING:'+','.join(missing))
          if s.lower().count('</html>')!=1 or s.lower().count('</body>')!=1: raise SystemExit('DOCUMENT_CLOSURE_INVALID')
          scripts=re.findall(r'<script(?![^>]*\\bsrc\\s*=)[^>]*>([\\s\\S]*?)</script>',s,re.I)
          if len(scripts)!=1: raise SystemExit('INLINE_SCRIPT_COUNT_INVALID:'+str(len(scripts)))
          js=Path(tempfile.gettempdir())/'new-main.js'; js.write_text(scripts[0],encoding='utf-8')
          r=subprocess.run(['node','--check',str(js)],capture_output=True,text=True)
          if r.returncode: print(r.stderr); raise SystemExit('JS_SYNTAX_FAIL')
          print('STRUCTURAL_AND_JS_PASS')
          PY

      - name: Local browser smoke gate on New-main
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          rm -rf /tmp/rw-new-main
          mkdir -p /tmp/rw-new-main
          cp -r Current/PWA/. /tmp/rw-new-main/
          python3 -m http.server 8123 --directory /tmp/rw-new-main >/tmp/rw-new-main-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const pageErrors=[]; const consoleErrors=[]; const bad=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400 && !/favicon\\.ico$/i.test(r.url())) bad.push({status:r.status(),url:r.url()})});
            await page.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            const r=await page.evaluate(()=>({lang:document.documentElement.lang,body:!!document.body,login:!!document.getElementById('rw-login-page'),app:!!document.getElementById('rw-main-shell'),shell:!!window.RW_ShellContext,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,views:!!window.RW_Views,owner:!!window.RW_OwnerLicense,requiredViews:['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_HR','RW_CRM'].every(k=>!!window[k])}));
            console.log(JSON.stringify({result:r,pageErrors,consoleErrors,bad}));
            if(r.lang!=='ar'||!r.body||!r.login||!r.app||!r.shell||!r.auth||!r.nav||!r.views||!r.owner||!r.requiredViews||pageErrors.length||consoleErrors.length||bad.length) process.exit(2);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(2)});
          NODE

      - name: Persist only New-main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-new-main-bot'
          git config user.email 'rawaea-new-main-bot@users.noreply.github.com'
          git add Current/PWA/New-main
          git diff --cached --quiet && { echo 'NO_NEW_MAIN_DELTA'; exit 1; }
          git commit -m '[new-main-target-persist] persist New-main only'
          git push origin HEAD:main
