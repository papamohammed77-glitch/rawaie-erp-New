name: RAWAEA NEW-MAIN TARGET RECONSTRUCTION

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/main/main*.md'
      - 'Current/PWA/New-main'
      - '.github/workflows/final_main_reconstruction_execute_20260831.yml'
  workflow_dispatch:

concurrency:
  group: rawaea-new-main-reconstruction
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message, '[new-main-target-persist]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source and published target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Parent contract hardening and resume from MAIN5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rawaea-new-main-bot'
          git config user.email 'rawaea-new-main-bot@users.noreply.github.com'
          python3 <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          target=Path('Current/PWA/New-main'); src=Path('Current/PWA/main')
          def inline(s):
              ms=[m for m in re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',s,re.I) if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I)]
              if len(ms)!=1: raise RuntimeError('INLINE_RUNTIME_COUNT:'+str(len(ms)))
              return ms[0]
          def validate(stage):
              s=target.read_text(encoding='utf-8')
              req=['rw-login-page','rw-main-shell','rw-page-container','rw-header-title','rw-header-subtitle','rw-sidebar-nav','rw-logout-btn','window.RW_ShellContext','window.RW_Auth','window.RW_Navigation']
              for n,mn in [('RW_Dashboard',2),('RW_Items',2),('RW_POS',4),('RW_Orders',5),('RW_Runsheets',5),('RW_Purchases',7),('RW_Warehouse',7),('RW_Finance',8),('RW_Reports',9),('RW_OwnerLicense',10),('RW_HR',11),('RW_CRM',11),('RW_Views',11)]:
                  if stage>=mn:req.append(n)
              if stage>=1:req += ['window.RW_ParentRegistry','RW_Permissions_check']
              miss=[x for x in req if x not in s]
              if miss:raise RuntimeError(f'MAIN{stage}_CONTRACT_MISSING:'+','.join(miss))
              m=inline(s);tail=s[m.end():]
              if not re.fullmatch(r'\s*</body>\s*</html>\s*',tail,re.I):raise RuntimeError(f'MAIN{stage}_OUTER_HTML_TAIL_INVALID')
              f=Path(tempfile.gettempdir())/f'rw-main{stage}.js';f.write_text(m.group('b'),encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:print(r.stderr);raise RuntimeError(f'MAIN{stage}_JS_SYNTAX_FAIL')
              if stage>=7:
                  for needle in ["eq('status','Picking')","eq('status','Loading')","eq('status','Delivering')","eq('status','Returning')","complete-delivery"]:
                      if needle not in s: raise RuntimeError(f'MAIN7_TARGET_CONTRACT_MISSING:{needle}')
          def persist(stage,msg=None):
              subprocess.run(['git','add','Current/PWA/New-main'],check=True)
              if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
                  subprocess.run(['git','commit','-m',msg or f'[new-main-target-persist] MAIN{stage} complete'],check=True);subprocess.run(['git','push','origin','HEAD:main'],check=True)
          s=target.read_text(encoding='utf-8');m=inline(s);body=m.group('b')
          repaired=body.replace("\\\\'", "\\'")
          if repaired!=body:target.write_text(s[:m.start('b')]+repaired+s[m.end('b'):],encoding='utf-8')
          validate(1)
          for stage in range(5,12):
              s=target.read_text(encoding='utf-8');m=inline(s);body=m.group('b');marker=f'/* RAWAEA MAIN{stage} AUTHORITATIVE MODULE */'
              if marker not in body:
                  frag=(src/f'main{stage}.md').read_text(encoding='utf-8-sig').rstrip()
                  if stage==7:
                      repairs={
                          "eq('status','Picked');if(r.error)throw r.error;window._pickingData": "eq('status','Picking');if(r.error)throw r.error;window._pickingData",
                          "_renderRsTable(q('pk-table'),d,'Picked',": "_renderRsTable(q('pk-table'),d,'Picking',",
                          '<option value="">Picked</option><option>Picked</option>': '<option value="">Picking</option><option>Picking</option>',
                          "eq('status','Loaded');if(r.error)throw r.error;window._loadingData": "eq('status','Loading');if(r.error)throw r.error;window._loadingData",
                          "_renderRsTable(q('ld-table'),d,'Loaded',": "_renderRsTable(q('ld-table'),d,'Loading',",
                          "eq('status','Delivered');if(r.error)throw r.error;window._deliveryData": "eq('status','Delivering');if(r.error)throw r.error;window._deliveryData",
                          "_renderRsTable(q('dv-table'),d,'Delivered',": "_renderRsTable(q('dv-table'),d,'Delivering',",
                          "eq('status','Returned');if(r.error)throw r.error;window._returnData": "eq('status','Returning');if(r.error)throw r.error;window._returnData",
                          "_renderRsTable(q('rt-table'),d,'Returned',": "_renderRsTable(q('rt-table'),d,'Returning',",
                          "hideLoader();showToast('تم إنهاء التوصيل','success');RW_Main7.refreshRunsheets();": "await RW_Main7.edge('complete-delivery',{runsheet_code:code});hideLoader();showToast('تم إنهاء التوصيل','success');RW_Main7.refreshRunsheets();"
                      }
                      for old,new in repairs.items():frag=frag.replace(old,new)
                      if len(frag)<50000:raise RuntimeError('MAIN7_SOURCE_TOO_SMALL')
                      for needle in ["eq('status','Picking')","eq('status','Loading')","eq('status','Delivering')","eq('status','Returning')","complete-delivery"]:
                          if needle not in frag:raise RuntimeError('MAIN7_SOURCE_REPAIR_FAILED:'+needle)
                  if re.match(r'^\s*(?:<!doctype\b|<html\b|<head\b|<body\b)',frag,re.I):raise RuntimeError(f'MAIN{stage}_SOURCE_WRAPPER')
                  frag=re.sub(r'</script>','<\\/script>',frag,flags=re.I)
                  target.write_text(s[:m.start('b')]+body+'\n'+marker+'\n'+frag+s[m.end('b'):],encoding='utf-8')
              validate(stage);persist(stage)
          print('NEW_MAIN_PARENT_AND_MAIN5_TO_MAIN11_COMPLETE')
          PY

      - name: Final published New-main browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 --directory Current/PWA >/tmp/rawaea-new-main-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage();const pe=[],ce=[],bad=[];p.on('pageerror',e=>pe.push(e.message));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});p.on('response',r=>{if(r.status()>=400&&!/favicon\\.ico$/i.test(r.url()))bad.push(r.status()+':'+r.url())});await p.goto('http://127.0.0.1:8123/New-main',{waitUntil:'domcontentloaded',timeout:30000});await p.waitForTimeout(3000);const x=await p.evaluate(()=>({lang:document.documentElement.lang,login:!!document.getElementById('rw-login-page'),app:!!document.getElementById('rw-main-shell'),shell:!!window.RW_ShellContext,auth:!!window.RW_Auth,nav:!!window.RW_Navigation,parent:!!window.RW_ParentRegistry,views:!!window.RW_Views,owner:!!window.RW_OwnerLicense,mods:['RW_Dashboard','RW_Items','RW_POS','RW_Orders','RW_Runsheets','RW_Purchases','RW_Warehouse','RW_Finance','RW_Reports','RW_HR','RW_CRM'].every(k=>!!window[k])}));console.log(JSON.stringify({x,pe,ce,bad}));if(x.lang!=='ar'||!x.login||!x.app||!x.shell||!x.auth||!x.nav||!x.parent||!x.views||!x.owner||!x.mods||pe.length||ce.length||bad.length)process.exit(2);await b.close();})().catch(e=>{console.error(e);process.exit(2)});
          NODE
