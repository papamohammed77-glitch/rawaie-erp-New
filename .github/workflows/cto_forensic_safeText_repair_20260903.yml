name: CTO forensic safeText scope repair

on:
  push:
    branches: [main]
    paths:
      - 'Current/PWA/New-main'
      - '.github/workflows/cto_forensic_safeText_repair_20260903.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rawaea-cto-forensic-safeText
  cancel-in-progress: false

jobs:
  forensic-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Direct forensic scope proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          assert len(s.encode())>500000, f'Unexpected target size: {len(s.encode())}'
          lines=s.splitlines()
          def_lines=[i+1 for i,l in enumerate(lines) if re.search(r'function safeText\s*\(',l)]
          call_lines=[i+1 for i,l in enumerate(lines) if 'safeText(' in l]
          global_export=[i+1 for i,l in enumerate(lines) if 'window.safeText=safeText' in l]
          closure=s.find('\n})();\n\n/* RAWAEA 122 DIAMOND CONTRACT CLOSURE v1 */')
          assert closure>0, 'Expected first IIFE closure not found'
          after_closure=[i+1 for i in range(len(lines)) if lines[i].find('safeText(')>=0 and (sum(len(x)+1 for x in lines[:i])>closure)]
          print('TARGET_BYTES=',len(s.encode()))
          print('SAFETEXT_DEFINITIONS=',def_lines)
          print('SAFETEXT_CALL_COUNT=',len(call_lines))
          print('SAFETEXT_CALL_LINES_HEAD=',call_lines[:40])
          print('FIRST_MAIN_IIFE_CLOSURE_BYTE=',closure)
          print('SAFETEXT_CALLS_AFTER_MAIN_IIFE=',after_closure[:40])
          print('SAFE_TEXT_GLOBAL_EXPORT=',global_export)
          assert len(def_lines)==1, 'Expected exactly one safeText definition'
          assert after_closure, 'No safeText consumer found after main IIFE closure; do not patch on inference'
          print('FORENSIC_SCOPE_PROOF=PASS')
          PY

      - name: Minimal scope bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Current/PWA/New-main')
          s=p.read_text(encoding='utf-8')
          needle="function safeText(el,text){if(el)el.textContent=text==null?'':String(text)}"
          bridge="window.safeText=safeText;"
          assert s.count(needle)==1, 'safeText definition changed or duplicated'
          if bridge not in s:
              s=s.replace(needle, needle+'\n'+bridge, 1)
              p.write_text(s,encoding='utf-8')
              print('MINIMAL_PATCH=APPLIED')
          else:
              print('MINIMAL_PATCH=ALREADY_PRESENT')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('Current/PWA/New-main','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/i);
          if(!m) throw new Error('INLINE_SCRIPT_NOT_FOUND');
          fs.writeFileSync('/tmp/new-main-inline.js',m[1]);
          NODE
          node --check /tmp/new-main-inline.js
          echo 'STATIC_SYNTAX=PASS'

      - name: Chromium owner and non-owner regression
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          mkdir -p /tmp/rawaea-site/Current/PWA
          cp -a Current /tmp/rawaea-site/Current/
          cat >/tmp/rawaea-http.py <<'PY'
          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          class H(SimpleHTTPRequestHandler):
            def log_message(self,fmt,*args): pass
          ThreadingHTTPServer(('127.0.0.1',8123),H).serve_forever()
          PY
          (cd /tmp/rawaea-site && python3 /tmp/rawaea-http.py >/tmp/http.log 2>&1 & echo $! >/tmp/http.pid)
          trap 'kill "$(cat /tmp/http.pid)" 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            async function make(){
              const p=await b.newPage({serviceWorkers:'block'});
              const errors=[];
              p.on('pageerror',e=>errors.push(String(e.message||e)));
              p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              await p.goto('http://127.0.0.1:8123/Current/PWA/New-main',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>window.RW_Navigation&&window.RW_OwnerLicense&&window.RW_STATE,{timeout:12000});
              await p.waitForTimeout(500);
              return {p,errors};
            }
            const pg=await make();
            const globalBridge=await pg.p.evaluate(()=>typeof window.safeText==='function');
            const denied=await pg.p.evaluate(async()=>{
              RW_STATE.app.currentUser={id:'smoke',email:'smoke@example.com',isOwner:false,permissions:[]};
              RW_STATE.permissions=[];
              try{await RW_Navigation.navigate('license');return 'NO_REJECTION';}catch(e){return String(e.message||e)}
            });
            await pg.p.close();
            const own=await make();
            const owner=await own.p.evaluate(async()=>{
              RW_STATE.app.currentUser={id:'smoke',email:'owner@smoke.local',isOwner:true,permissions:['*']};
              RW_STATE.permissions=['*'];
              try{await RW_Navigation.navigate('license');}catch(e){return {error:String(e.message||e)}}
              return {view:RW_STATE.app.currentView,text:document.getElementById('rw-page-container')?.innerText||'',container:!!document.getElementById('license-main-container')};
            });
            const all=[...pg.errors,...own.errors];
            console.log(JSON.stringify({globalBridge,denied,owner,errors:all},null,2));
            const ok=globalBridge&&denied==='OWNER_ONLY'&&owner.view==='license'&&owner.container&&/إدارة الترخيص/.test(owner.text)&&all.length===0;
            await own.p.close();await b.close();
            if(!ok)process.exit(2);
          })().catch(e=>{console.error(e.stack||e);process.exit(2)});
          NODE
          echo 'CHROMIUM_LICENSE_GATE=PASS'

      - name: Persist minimal patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'papamohammed77-glitch'
          git config user.email 'papamohammed77-glitch@users.noreply.github.com'
          git add Current/PWA/New-main
          if git diff --cached --quiet; then
            echo 'NO_TARGET_CHANGE=TRUE'
          else
            git commit -m '[CTO-FORENSIC] Bridge safeText across governed runtime scope'
            git push origin HEAD:main
          fi
          git rm .github/workflows/cto_forensic_safeText_repair_20260903.yml || true
          git commit -m '[CTO-FORENSIC] Remove one-time forensic repair workflow' || true
          git push origin HEAD:main || true
