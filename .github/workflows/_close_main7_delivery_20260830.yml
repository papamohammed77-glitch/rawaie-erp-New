name: RAWAEA MAIN7 Delivery Closure 20260830
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    if: github.event.head_commit.message != 'chore: main7 delivery closure complete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Surgical patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('Current/PWA/main/main7.md')
          s=p.read_text(encoding='utf-8')
          bad=".from('order_details').select('item_code,qty_loaded,qty_delivered').eq('company_id',companyId()).eq('order_id',orders[i].id)"
          good=".from('order_details').select('item_code,qty_loaded,qty_delivered').eq('order_id',orders[i].id)"
          count=s.count(bad)
          if count != 1:
              raise SystemExit(f'Expected exactly one known defect, found {count}')
          ns=s.replace(bad,good,1)
          if bad in ns:
              raise SystemExit('Known defect remains')
          if 'order_details' not in ns or "complete-order-delivery" not in ns:
              raise SystemExit('Delivery contract unexpectedly missing')
          if re.search(r"\.from\('stock_branches'\).*\.update",ns,re.S) or ".from('inventory_log').insert" in ns:
              raise SystemExit('Forbidden direct stock writer appeared')
          p.write_text(ns,encoding='utf-8')
          print('MAIN7_PATCH_OK')
          PY
          git diff --check
      - name: Write audit
        shell: bash
        run: |
          set -euo pipefail
          cat > Current/CTO/EVENT-MAIN7-DELIVERY-CLOSURE-20260830.md <<'EOF'
# EVENT-MAIN7-DELIVERY-CLOSURE-20260830

EVENT ID: MAIN7-DELIVERY-20260830-01
DATE: 2026-08-30
SOURCE: Current Production Supabase + direct Current Git + historical reports 89-102
OBJECTIVE: Close the remaining MAIN7 Delivery source defect while preserving the complete fragment contract.

PRE-AUDIT / INPUT STATE:
- Current/PWA/main/main7.md directly inspected from current Git.
- Report 102 identified the remaining defect: order_details.company_id filter in Delivery.
- Current Production order_details has no company_id column.
- Current Production Delivery backend resolves company_id from authenticated users and delegates to complete_order_delivery_atomic.
- main7 already resolves orders through company-scoped runsheet/order queries.

HISTORICAL CONTRACT:
MAIN7 is UX/orchestration only; physical inventory mutation remains behind canonical capability Edge/RPC functions.

CURRENT PRODUCTION FACT:
Production Delivery capability is active and company-scoped. No schema change is required for order_details.

CURRENT GIT FACT:
The known invalid order_details.company_id predicate existed exactly once at closure start.

CURRENT EVIDENCE:
order_details rows are related to the already company-scoped orders row through order_id; adding an invented company_id field would create schema debt.

DISCOVERY:
The historical “solved” companyId issue had reappeared in current Git as a stale predicate. Current Git therefore overrides the historical claim.

ROOT CAUSE:
A prior MAIN7 reconstruction retained an obsolete company filter on a table that does not carry company_id.

BUSINESS IMPACT:
Delivery detail retrieval could fail at runtime before the Delivery capability was invoked.

ARCHITECTURAL IMPACT:
None to inventory/accounting engines; only the frontend query predicate changed.

DATABASE IMPACT:
None.

EDGE/RPC IMPACT:
None.

FRONTEND IMPACT:
Removed one invalid predicate; retained order_id relation, item fields, delivery calculation, stable operation identity, and Edge call.

CHANGE MADE:
Removed .eq('company_id',companyId()) only from the order_details Delivery query.

WHY:
Tenant scoping is already established by the company-scoped orders query and order_id foreign-key relation.

ALTERNATIVES REJECTED:
- Add company_id to order_details: rejected; not part of current schema contract.
- Switch to runsheet_details: rejected; would bypass the established order-level fulfillment detail contract.
- Rewrite all MAIN7: rejected; no evidence justified functional loss.

MIGRATION: None.
DEPLOYMENT: GitHub Actions surgical source update.
COMMIT: generated by closure workflow after validation.

TEST:
Exact-one replacement, diff-check, preserved delivery contract, and no direct stock writer checks.

RUNTIME TEST:
Backend Production capability/schema verified directly. Full browser E2E is not claimed because main7.md is a fragment assembled into the final PWA later.

PRODUCTION VERIFY:
Production DB will be re-queried after commit.

DATA CLEANUP: None.
AUDIT PRESERVATION: No business data or audit history changed.

POST-CHANGE STATE:
Current main7 no longer references order_details.company_id.

OBSOLETE STATE:
The obsolete predicate is permanently removed from Current/main7.

REMAINING OPEN ITEMS:
Integrated main.html assembly + authenticated browser E2E remain a separate deployment-stage verification and are not hidden behind this source-fragment closure.

LATER CORRECTIONS: None identified.

SOURCE REFERENCES:
- Current/PWA/main/main7.md
- Current Production complete-order-delivery Edge Function
- Current Production order_details schema
- Report 102
EOF
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Current/PWA/main/main7.md').read_text(encoding='utf-8')
          assert ".from('order_details').select('item_code,qty_loaded,qty_delivered').eq('order_id',orders[i].id)" in s
          assert ".from('order_details').select('item_code,qty_loaded,qty_delivered').eq('company_id',companyId()).eq('order_id',orders[i].id)" not in s
          assert 'complete-order-delivery' in s
          assert 'window.RW_Warehouse=API;' in s
          print('MAIN7_FINAL_SOURCE_VALID')
          PY
          git config user.name 'RAWAEA Governed Closure Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/PWA/main/main7.md Current/CTO/EVENT-MAIN7-DELIVERY-CLOSURE-20260830.md
          git rm .github/workflows/_close_main7_delivery_20260830.yml
          git commit -m 'chore: main7 delivery closure complete'
          git push origin HEAD:main
