name: forensic-supervisor-fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forensic_supervisor_fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact supervisor syntax fix and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Current/PWA/warehouse.supervisor')
          s = p.read_text(encoding='utf-8')
          old = "onchange=\"App.updateRole(\\\\''+emp.id+'\\\\',this.value)\">"
          new = "data-user-id=\"'+emp.id+'\" onchange=\"App.updateRole(this.dataset.userId,this.value)\">"
          if old not in s:
              raise SystemExit('TARGET_NOT_FOUND')
          s2 = s.replace(old, new, 1)
          p.write_text(s2, encoding='utf-8')
          PY
          rm -f .github/workflows/forensic_supervisor_fix.yml
          git config user.name 'rawaea-forensic-bot'
          git config user.email 'rawaea-forensic-bot@users.noreply.github.com'
          git add Current/PWA/warehouse.supervisor .github/workflows/forensic_supervisor_fix.yml
          git commit -m 'fix(PWA): repair warehouse supervisor role selector syntax'
          git push
