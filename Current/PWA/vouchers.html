<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../core.js"></script><script>var supabase=window.supabase;</script>
<style>
*{box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#f8fafc;-webkit-tap-highlight-color:transparent}.auth-bg{background:linear-gradient(135deg,#312e81,#4338ca,#4f46e5)}
.card{background:#fff;border:1px solid #eef2ff;border-radius:26px;padding:1.15rem;box-shadow:0 1px 3px rgba(15,23,42,.03),0 14px 32px rgba(79,70,229,.06);transition:.2s}.card:active{transform:scale(.99)}
.gold-header{background:linear-gradient(115deg,#21154f 0%,#312e81 42%,#4f46e5 100%);box-shadow:0 12px 32px rgba(49,46,129,.24)}.gold-chip{background:linear-gradient(135deg,#f7d774,#d4af37,#b88718);color:#1f1600;box-shadow:0 8px 22px rgba(212,175,55,.28)}
.voucher-menu{background:rgba(255,255,255,.98);backdrop-filter:blur(18px);border:1px solid rgba(212,175,55,.25);box-shadow:0 18px 45px rgba(15,23,42,.18)}.type-card{transition:.2s}.type-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(79,70,229,.12)}
.tab-btn{transition:.2s}.tab-btn.active{background:linear-gradient(135deg,#eef2ff,#fff7d6);color:#312e81;border-color:#e7cf82}.btn-primary{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff}.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-bg p-4"><div class="bg-white rounded-[36px] shadow-2xl p-6 w-[92%] max-w-md"><div class="text-center mb-6"><div class="w-20 h-20 gold-chip rounded-3xl mx-auto flex items-center justify-center mb-5"><i class="fa-solid fa-file-signature text-3xl"></i></div><h1 class="font-black text-2xl text-slate-800">الروائع</h1><p class="text-sm text-slate-400">الأذونات المخزنية اليدوية</p></div><div class="space-y-4"><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none"><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-3 top-1/2 -translate-y-1/2 p-2"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div><button onclick="App.doLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-6">تسجيل الدخول</button><p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-4 hidden"></p></div></div>
<div id="mainApp" class="hidden flex flex-col h-full">
<header class="gold-header text-white p-3 sticky top-0 z-40 flex-shrink-0"><div class="flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0"><div class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center"><i class="fa-solid fa-file-signature text-lg"></i></div><div class="min-w-0"><div class="font-black text-sm sm:text-base">الأذونات المخزنية</div><div class="text-[11px] text-white/70">إدارة الأذونات اليدوية من مركز واحد</div></div></div><div class="flex items-center gap-2"><button id="headerTypeButton" onclick="App.toggleVoucherMenu()" class="gold-chip rounded-2xl px-3 py-2 flex items-center gap-2 text-xs sm:text-sm font-black"><i class="fa-solid fa-plus"></i><span id="headerTypeLabel">إذن جديد</span><i class="fa-solid fa-chevron-down text-[10px]"></i></button><button onclick="App.doLogout()" class="bg-white/10 w-10 h-10 rounded-2xl"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div></div><div id="voucherMenu" class="hidden voucher-menu rounded-3xl p-3 mt-3"><div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><button class="type-card text-right p-3 rounded-2xl bg-white border border-indigo-100" onclick="App.chooseVoucherType('Transfer')"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center"><i class="fa-solid fa-right-left"></i></span><span><b>تحويل داخلي</b><small class="block text-[10px] text-slate-400 mt-1">فرع ← فرع</small></span></div></button><button class="type-card text-right p-3 rounded-2xl bg-white border border-indigo-100" onclick="App.chooseVoucherType('DirectSale')"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-truck-fast"></i></span><span><b>صرف مباشر</b><small class="block text-[10px] text-slate-400 mt-1">فرع → مركبة</small></span></div></button><button class="type-card text-right p-3 rounded-2xl bg-white border border-indigo-100" onclick="App.chooseVoucherType('DirectReturn')"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center"><i class="fa-solid fa-rotate-left"></i></span><span><b>مرتجع مباشر</b><small class="block text-[10px] text-slate-400 mt-1">مركبة → فرع</small></span></div></button><button class="type-card text-right p-3 rounded-2xl bg-white border border-indigo-100" onclick="App.chooseVoucherType('SupplierReturn')"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center"><i class="fa-solid fa-box-open"></i></span><span><b>مرتجع مورد</b><small class="block text-[10px] text-slate-400 mt-1">فرع → مورد</small></span></div></button><div class="type-card p-3 rounded-2xl bg-slate-50 border border-dashed border-slate-300 opacity-70"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-trash-can"></i></span><span><b class="text-slate-600">إتلاف / إعدام</b><small class="block text-[10px] text-slate-400 mt-1">غير متاح: CREATE Contract غير مثبت</small></span></div></div><div class="type-card p-3 rounded-2xl bg-slate-50 border border-dashed border-slate-300 opacity-70"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-2xl bg-slate-200 text-slate-500 flex items-center justify-center"><i class="fa-solid fa-scale-balanced"></i></span><span><b class="text-slate-600">تسوية جرد</b><small class="block text-[10px] text-slate-400 mt-1">غير متاح: CREATE Contract غير مثبت</small></span></div></div></div></div></header>
<div class="flex gap-1.5 p-2 bg-white border-b overflow-x-auto flex-shrink-0"><button onclick="App.switchTab('pending')" id="tab-pending" class="tab-btn px-5 py-2.5 rounded-2xl font-bold text-sm border border-transparent active">📄 معلقة</button><button onclick="App.switchTab('completed')" id="tab-completed" class="tab-btn px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400 border border-transparent">✅ مكتملة</button><button onclick="App.switchTab('account')" id="tab-account" class="tab-btn px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400 border border-transparent">⚙️ حسابي</button></div><main id="mainContent" class="flex-1 overflow-y-auto p-4"></main></div>
<script>
var App={currentUser:null,companyId:null,currentTab:'pending',selectedType:'Transfer',vouchers:[],newVoucherCart:[],maps:{branches:[],vehicles:[],suppliers:[]},catalog:{Transfer:'تحويل داخلي',DirectSale:'صرف مباشر',DirectReturn:'مرتجع مباشر',SupplierReturn:'مرتجع مورد'},esc:function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')},togglePass:function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash'}else{p.type='password';i.className='fa-solid fa-eye'}},doLogin:function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return}RW_UI.showLoader();RW_Auth.doLogin(e,p,function(u,er){RW_UI.hideLoader();if(er){RW_UI.byId('loginMsg').innerText=er;RW_UI.byId('loginMsg').classList.remove('hidden')}else App.init()})},init:function(){var s=this;RW_Auth.init(function(u,er){if(er||!u){RW_UI.showError('انتهت الجلسة',function(){location.reload()});return}s.currentUser=u;supabase.auth.getUser().then(function(r){if(r.error||!r.data.user)throw new Error('جلسة غير صالحة');return supabase.from('users').select('company_id').eq('auth_id',r.data.user.id).maybeSingle()}).then(function(r){if(r.error||!r.data||!r.data.company_id)throw new Error('سياق الشركة غير محدد');s.companyId=r.data.company_id;return s.loadReferenceData()}).then(function(){if(!s.currentUser.isOwner&&s.currentUser.activeWarehouseRole!=='أذونات'){RW_UI.showError('دورك النشط هو "'+(s.currentUser.activeWarehouseRole||'غير محدد')+'"',function(){RW_Auth.doLogout()});return}s.enterApp()}).catch(function(e){RW_UI.showError(e.message||'تعذر تهيئة الأذونات')})})},enterApp:function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');RW_UI.updateConnectionStatus('connDot','connLabel');this.updateHeaderType();this.switchTab('pending')},doLogout:function(){RW_Auth.doLogout(function(){location.reload()})},toggleVoucherMenu:function(){var m=RW_UI.byId('voucherMenu');if(m)m.classList.toggle('hidden')},chooseVoucherType:function(type){if(!this.catalog[type])return;this.selectedType=type;this.updateHeaderType();var m=RW_UI.byId('voucherMenu');if(m)m.classList.add('hidden');this.openNewVoucherModal(type)},updateHeaderType:function(){RW_UI.safeText(RW_UI.byId('headerTypeLabel'),'إذن: '+(this.catalog[this.selectedType]||'جديد'))},loadReferenceData:function(){var s=this;return Promise.all([supabase.from('branches').select('id,branch_code,name').eq('company_id',s.companyId).eq('is_active',true).order('name'),supabase.from('vehicles').select('id,vehicle_code,status').eq('company_id',s.companyId).eq('status','Active').order('vehicle_code'),supabase.from('suppliers').select('id,supplier_code,name').eq('company_id',s.companyId).eq('is_active',true).order('name')]).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;if(r[2].error)throw r[2].error;s.maps.branches=r[0].data||[];s.maps.vehicles=r[1].data||[];s.maps.suppliers=r[2].data||[]})},switchTab:function(tab){this.currentTab=tab;['pending','completed','account'].forEach(function(x){var b=RW_UI.byId('tab-'+x);if(b){b.classList.remove('active');b.classList.add('text-slate-400')}});var a=RW_UI.byId('tab-'+tab);if(a){a.classList.add('active');a.classList.remove('text-slate-400')}if(tab==='account')this.renderAccount();else this.loadVouchers(tab)},loadVouchers:function(scope){var s=this;RW_UI.showSkeleton('mainContent',3,'card');var q=supabase.from('stock_vouchers').select('*').eq('company_id',s.companyId).eq('source','Manual').order('voucher_date',{ascending:false}).limit(100);q=scope==='pending'?q.in('status',['Draft','Sent']):q.in('status',['Received','Completed','Cancelled']);q.then(function(r){if(r.error)throw r.error;s.vouchers=r.data||[];s.renderList(scope)}).catch(function(e){RW_UI.showError(e.message||'فشل تحميل الأذونات')})},renderList:function(scope){var s=this,h='<div class="flex justify-between items-center mb-4"><div><p class="text-slate-400 text-sm">أهلاً، <span class="font-bold text-slate-700">'+s.esc(s.currentUser.name||'زميل')+'</span></p><p class="text-xs text-slate-400 mt-1">اختيار نوع الإذن أصبح من الهيدر — لا توجد أزرار إنشاء مكررة داخل الصفحة.</p></div></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4"><div class="card bg-gradient-to-br from-white to-indigo-50"><p class="text-xs text-slate-400">المعلّقة</p><b class="text-2xl text-indigo-700">'+s.vouchers.filter(function(v){return ['Draft','Sent'].indexOf(v.status)>-1}).length+'</b></div><div class="card bg-gradient-to-br from-white to-emerald-50"><p class="text-xs text-slate-400">المستلمة</p><b class="text-2xl text-emerald-700">'+s.vouchers.filter(function(v){return v.status==='Received'}).length+'</b></div><div class="card bg-gradient-to-br from-white to-amber-50"><p class="text-xs text-slate-400">المحدد الآن</p><b class="text-sm text-amber-700">'+s.esc(s.catalog[s.selectedType]||'—')+'</b></div></div><input id="voucherSearch" oninput="App.filterList()" placeholder="🔍 بحث برقم الإذن أو المرجع أو النوع" class="w-full p-3 bg-white rounded-2xl border-2 border-slate-100 mb-4"><h2 class="text-lg font-black mb-4">'+(scope==='pending'?'📄 الأذونات المعلّقة':'✅ الأذونات المكتملة')+'</h2><div id="voucherCardsContainer">'+s.cardsHTML(s.vouchers,scope)+'</div>';RW_UI.safeHTML(RW_UI.byId('mainContent'),h)},filterList:function(){var q=(RW_UI.byId('voucherSearch').value||'').toLowerCase(),rows=this.vouchers.filter(function(v){return (String(v.voucher_code||'').toLowerCase().indexOf(q)>-1||String(v.reference||'').toLowerCase().indexOf(q)>-1||String(v.type||'').toLowerCase().indexOf(q)>-1)});var c=RW_UI.byId('voucherCardsContainer');if(c)RW_UI.safeHTML(c,this.cardsHTML(rows,this.currentTab))},cardsHTML:function(rows,scope){if(!rows.length)return '<div class="text-center py-12"><div class="text-6xl mb-4">☕</div><p class="text-slate-400 font-bold">لا توجد أذونات.</p></div>';var s=this,h='';rows.forEach(function(v){var cls=v.status==='Draft'?'bg-amber-100 text-amber-700':v.status==='Sent'?'bg-blue-100 text-blue-700':v.status==='Received'?'bg-emerald-100 text-emerald-700':v.status==='Cancelled'?'bg-red-100 text-red-700':'bg-slate-100 text-slate-700';var label=v.status==='Draft'?'مسودة':v.status==='Sent'?'مُرسل':v.status==='Received'?'مُستلم':v.status==='Completed'?'مكتمل':v.status==='Cancelled'?'ملغى':v.status;h+='<div class="card mb-3 cursor-pointer" onclick="App.viewVoucherDetails(\''+s.esc(v.voucher_code)+'\')"><div class="flex justify-between gap-3"><div><b>'+s.esc(v.voucher_code)+'</b><p class="text-xs text-slate-400 mt-1">'+s.esc(s.catalog[v.type]||v.type)+' · '+s.esc(v.reference||'بدون مرجع')+'</p></div><div class="flex items-center gap-2"><span class="px-2 py-1 rounded-full text-xs font-bold '+cls+'">'+label+'</span>';if(scope==='pending'&&v.status==='Draft')h+='<button onclick="event.stopPropagation();App.sendVoucher(\''+s.esc(v.voucher_code)+'\')" class="bg-indigo-600 text-white px-3 py-1 rounded-lg text-xs font-bold">إرسال</button>';if(scope==='pending'&&v.status==='Sent')h+='<button onclick="event.stopPropagation();App.openReceiveModal(\''+s.esc(v.voucher_code)+'\')" class="bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-bold">استلام</button>';h+='</div></div></div>'});return h},sendVoucher:function(code){var s=this;RW_UI.showConfirm('إرسال '+code+'؟',function(){RW_UI.showLoader();RW_API.call('send-stock-voucher',{voucher_code:code},function(j){RW_UI.hideLoader();if(j.success){RW_UI.toast('تم الإرسال','success');s.loadVouchers('pending')}else RW_UI.showError(j.msg||'فشل الإرسال')})})},locationLabel:function(type,id){if(!type||!id)return '—';if(type==='Branch'){var b=this.maps.branches.find(function(x){return x.id===id});return b?(b.name+' ('+b.branch_code+')'):'فرع غير معروف'}if(type==='Vehicle'){var v=this.m
