tab:function(t){this.tabName=t;['pending','completed','account'].forEach(function(x){var b=RW_UI.byId('tab-'+x);if(b)b.className=x===t?'px-5 py-2.5 rounded-2xl font-bold text-sm bg-indigo-50 text-indigo-700':'px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-500'});if(t==='account'){this.account();return}this.loadList(t)},loadList:function(scope){var s=this;RW_UI.showSkeleton('mainContent',3,'card');supabase.from('stock_vouchers').select('*').eq('company_id',s.company).eq('source','Manual').order('voucher_date',{ascending:false}).limit(200).then(function(r){if(r.error)throw r.error;var allowed=scope==='pending'?['Draft','Sent','Received']:['Completed','Cancelled'];s.vouchers=(r.data||[]).filter(function(v){return allowed.includes(v.status)});s.renderList(scope)}).catch(function(e){RW_UI.showError(e.message||'فشل تحميل الأذونات')})},renderList:function(scope){var s=this,html='<div class="h-full overflow-auto p-4"><div class="max-w-[1100px] mx-auto"><div class="flex items-center justify-between mb-4"><b class="text-lg">'+(scope==='pending'?'📄 الأذونات المعلقة':'✅ الأذونات المكتملة')+'</b><button onclick="App.toggleMenu()" class="chip px-4 py-2 rounded-2xl text-xs font-black">+ نوع جديد</button></div><input id="listSearch" oninput="App.filterList()" placeholder="🔍 بحث برقم الإذن أو المرجع أو النوع" class="w-full p-3.5 bg-white rounded-2xl border-2 border-slate-100 outline-none font-semibold text-sm mb-4"><div id="listCards">'+this.cards(this.vouchers,scope)+'</div></div></div>';RW_UI.safeHTML(RW_UI.byId('mainContent'),html)},filterList:function(){var q=this.norm((RW_UI.byId('listSearch')||{}).value||''),rows=this.vouchers.filter(function(v){return this.norm(v.voucher_code).includes(q)||this.norm(v.reference).includes(q)||this.norm(v.type).includes(q)}.bind(this));RW_UI.safeHTML(RW_UI.byId('listCards'),this.cards(rows,this.tabName))},cards:function(rows,scope){var s=this;if(!rows.length)return '<div class="card text-center py-14 text-slate-400">لا توجد أذونات</div>'; loc:function(t,id){var arr=t==='Branch'?this.refs.branches:t==='Vehicle'?this.refs.vehicles:this.refs.suppliers,x=(arr||[]).find(function(z){return z.id===id});return x?(x.name||x.vehicle_code||x.supplier_code||x.branch_code||'غير معروف'):'غير معروف'},details:function(code){var s=this;RW_UI.showLoader();supabase.from('stock_vouchers').select('*').eq('company_id',s.company).eq('voucher_code',code).maybeSingle().then(function(r){if(r.error||!r.data)throw new Error('الإذن غير موجود');var v=r.data;return supabase.from('stock_voucher_details').select('item_id,item_code,item_name,unit,qty,received_qty,notes').eq('voucher_id',v.id).order('item_code').then(function(d){if(d.error)throw d.error;RW_UI.hideLoader();var h='<div class="text-right text-sm"><div class="grid grid-cols-2 gap-2 mb-3"><div class="p-3 bg-slate-50 rounded-xl">النوع<br><b>'+s.esc(v.type)+'</b></div><div class="p-3 bg-slate-50 rounded-xl">الحالة<br><b>'+s.esc(v.status)+'</b></div><div class="p-3 bg-slate-50 rounded-xl">المصدر<br><b>'+s.esc(s.loc(v.from_type,v.from_id))+'</b></div><div class="p-3 bg-slate-50 rounded-xl">الوجهة<br><b>'+s.esc(s.loc(v.to_type,v.to_id))+'</b></div></div><div class="text-xs text-slate-500 mb-3">المرجع: '+s.esc(v.reference||'—')+'<br>ملاحظات: '+s.esc(v.notes||'—')+'</div><div class="border rounded-2xl overflow-auto"><table class="w-full"><thead class="bg-slate-100"><tr><th class="p-3">الصنف</th><th class="p-3">الوحدة</th><th class="p-3">الكمية</th><th class="p-3">المستلم</th><th class="p-3">المتبقي</th></tr></thead><tbody>'+(d.data||[]).map(function(x){return '<tr class="border-t"><td class="p-3">'+s.esc(x.item_name||x.item_code)+'</td><td class="p-3">'+s.esc(x.unit||'حبة')+'</td><td class="p-3 text-center">'+Number(x.qty||0)+'</td><td class="p-3 text-center">'+Number(x.received_qty||0)+'</td><td class="p-3 text-center">'+Math.max(0,Number(x.qty||0)-Number(x.received_qty||0))+'</td></tr>'}).join('')+'</tbody></table></div></div>';Swal.fire({title:'تفاصيل الإذن',html:h,width:860,s
