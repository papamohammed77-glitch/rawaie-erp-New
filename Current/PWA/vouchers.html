und:#2563eb;border-color:#2563eb}.smart-field{position:relative}.smart-input{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;outline:none}.smart-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.10)}.smart-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:120;background:#0b1220;border:1px solid #334155;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.36);max-height:260px;overflow-y:auto}.smart-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #1e293b}.smart-row:hover{background:#1e293b}.smart-code{color:#94a3b8;font-size:10px}.smart-empty{padding:14px;text-align:center;color:#64748b;font-size:11px}.result-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;color:#0f172a;border-radius:18px;border:1px solid #e2e8f0;box-shadow:0 22px 50px rgba(15,23,42,.30);z-index:90;overflow:hidden}.result-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}.result-row:hover,.result-row.active{background:#eff6ff}.workspace-head{position:relative;overflow:visible}.mobile-bar{display:none}@media(max-width:900px){.ws-grid{grid-template-columns:1fr}.cart{display:none}.mobile-bar{display:flex}.catalog{border-left:0}.mobile-drawer{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.82);display:none;align-items:flex-end}.mobile-drawer.open{display:flex}.mobile-inner{width:100%;max-height:88vh;background:#111827;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;border-top:1px solid #334155}}</style>
</head><body class="h-screen overflow-hidden">
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-bg p-4"><div class="bg-white rounded-[36px] shadow-2xl p-6 w-[92%] max-w-md"><div class="text-center mb-6"><div class="w-20 h-20 gold-chip rounded-3xl mx-auto flex items-center justify-center mb-5"><i class="fa-solid fa-file-signature text-3xl"></i></div><h1 class="font-black text-2xl text-slate-800">الروائع</h1><p class="text-sm text-slate-400 font-semibold">مركز الأذونات والحركات المخزنية</p></div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none mb-3"><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-3 top-1/2 -translate-y-1/2 p-2"><i id="passIcon" class="fa-solid fa-eye"></i></button></div><button type="button" onclick="App.doLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-5">تسجيل الدخول</button><button type="button" onclick="App.resetPassword()" class="w-full text-indigo-600 py-2 rounded-2xl font-bold text-sm">نسيت كلمة المرور؟</button><p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p></div></div>
<div id="recoveryScreen" class="hidden fixed inset-0 z-[110] flex items-center justify-center auth-bg p-4 overflow-y-auto"><div class="bg-white rounded-[36px] shadow-2xl p-6 w-[92%] max-w-md my-6"><div class="text-center mb-6"><div class="w-16 h-16 rounded-3xl bg-indigo-50 text-indigo-700 mx-auto flex items-center justify-center mb-4"><i class="fa-solid fa-key text-2xl"></i></div><h2 class="font-black text-xl text-slate-800">تعيين كلمة مرور جديدة</h2><p class="text-sm text-slate-400 mt-1">أدخل كلمة مرور جديدة ثم العودة إلى تسجيل الدخول</p></div><input id="recoveryPass1" type="password" autocomplete="new-password" placeholder="كلمة المرور الجديدة" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none mb-3"><input id="recoveryPass2" type="password" autocomplete="new-password" placeholder="تأكيد كلمة المرور" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none"><button type="button" onclick="App.applyRecoveryPassword()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-5">حفظ كلمة المرور</button><button type="button" onclick="App.cancelRecovery()" class="w-full text-slate-500 py-2 rounded-2xl font-bold text-sm mt-1">العودة لتسجيل الدخول</button><p id="recoveryMsg" class="text-center text-xs font-bold mt-3 hidden"></p></div></div>
<div id="mainApp" class="hidden h-full flex flex-col"><header class="gold-header text-white p-3 flex-shrink-0"><div class="flex items-center justify-between gap-2"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center"><i class="fa-solid fa-file-signature"></i></div><div><b class="font-black">الأذونات المخزنية</b><div class="text-[11px] text-white/70">دورة الإذن الكاملة · مزامنة حيّة</div></div></div><div class="flex items-center gap-2"><span id="connDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span id="connLabel" class="text-[11px] hidden sm:inline">جاري التحقق</span><button id="typeBtn" onclick="App.toggleMenu()" class="gold-chip rounded-2xl px-3 py-2 text-xs font-black"><i class="fa-solid fa-plus ml-1"></i><span id="typeLabel">إذن جديد</span></button><button onclick="App.logout()" class="bg-white/10 w-10 h-10 rounded-2xl"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div></div><div id="typeMenu" class="hidden mt-3 bg-white rounded-3xl p-3 text-slate-900 shadow-2xl"><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2"><button onclick="App.choose('Transfer')" class="p-3 rounded-2xl border text-right"><b>تحويل داخلي</b><small class="block text-[10px] text-slate-400">فرع → فرع</small></button><button onclick="App.choose('DirectSale')" class="p-3 rounded-2xl border text-right"><b>صرف مباشر</b><small class="block text-[10px] text-slate-400">فرع → مركبة</small></button><button onclick="App.choose('DirectReturn')" class="p-3 rounded-2xl border text-right"><b>مرتجع مباشر</b><small class="block text-[10px] text-slate-400">مركبة → فرع</small></button><button onclick="App.choose('SupplierReturn')" class="p-3 rounded-2xl border text-right"><b>مرتجع مورد</b><small class="block text-[10px] text-slate-400">فرع → مورد</small></button><button onclick="App.choose('Scrap')" class="p-3 rounded-2xl border text-right"><b>إتلاف / إعدام</b><small class="block text-[10px] text-orange-500">Adjustment Engine</small></button><button onclick="App.choose('Adjustment')" class="p-3 rounded-2xl border text-right"><b>تسوية جرد</b><small class="block text-[10px] text-violet-500">Adjustment Engine</small></button></div></div></header><div class="flex gap-1.5 p-2 bg-white border-b overflow-x-auto flex-shrink-0"><button onclick="App.tab('pending')" id="tab-pending" class="tab-btn px-5 py-2.5 rounded-2xl font-bold text-sm border active">📄 معلقة</button><button onclick="App.tab('completed')" id="tab-completed" class="tab-btn px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400 border border-transparent">✅ مكتملة</button><button onclick="App.tab('account')" id="tab-account" class="tab-btn px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400 border border-transparent">⚙️ حسابي</button></div><main id="mainContent" class="flex-1 min-h-0 overflow-hidden"></main></div>
<script>
function f(n){return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})}
var App={user:null,company:null,tabName:'pending',type:'Transfer',mode:null,vouchers:[],refs:{branches:[],vehicles:[],suppliers:[],reps:[],supplierBranchMap:{}},items:[],stock:{},cart:[],cat:'الكل',timer:null,results:[],focus:0,receiveOps:{},busy:{},realtime:null,lastSyncAt:null,
esc:function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\\"/g,'&quot;').replace(/'/g,'&#39;')},
norm:function(v){return String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\\s+/g,' ').trim()},
togglePass:function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');p.type=p.type==='password'?'text':'password';i.className=p.type==='password'?'fa-solid fa-eye':'fa-solid fa-eye-slash'},
resetPassword:function(){var e=RW_UI.byId('loginEmail').value.trim();if(!e){RW_UI.toast('أدخل البريد أولاً','warning');return}RW_UI.showLoader();supabase.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname}).then(function(r){RW_UI.hideLoader();RW_UI.toast(r.error?r.error.message:'تم إرسال رابط الاستعادة','success')})},
applyRecoveryPassword:function(){var a=RW_UI.byId('recoveryPass1').value,b=RW_UI.byId('recoveryPass2').value,m=RW_UI.byId('recoveryMsg');m.classList.add('hidden');if(!a||a.length<6){m.textContent='كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل';m.className='text-center text-xs font-bold mt-3 text-red-500';m.classList.remove('hidden');return}if(a!==b){m.textContent='تأكيد كلمة المرور غير مطابق';m.className='text-center text-xs font-bold mt-3 text-red-500';m.classList.remove('hidden');return}RW_UI.showLoader();supabase.auth.updateUser({password:a}).then(function(r){RW_UI.hideLoader();if(r.error){m.textContent=r.error.message||'فشل تحديث كلمة المرور';m.className='text-center text-xs font-bold mt-3 text-red-500';m.classList.remove('hidden');return}RW_UI.toast('تم تحديث كلمة المرور بنجاح','success');return supabase.auth.signOut()}).then(function(){App.cancelRecovery()}).catch(function(e){RW_UI.hideLoader();m.textContent=e.message||'فشل تحديث كلمة المرور';m.className='text-center text-xs font-bold mt-3 text-red-500';m.classList.remove('hidden')})},
showRecovery:function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('recoveryScreen').classList.remove('hidden')},cancelRecovery:function(){RW_UI.byId('recoveryScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('loginScreen').classList.remove('hidden');if(location.hash){try{history.replaceState({},document.title,location.pathname+location.search)}catch(e){}}},
doLogin:function(){var s=this,e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.toast('أدخل بيانات الدخول','warning');return}RW_UI.showLoader();RW_Auth.doLogin(e,p,function(u,er){RW_UI.hideLoader();if(er){RW_UI.toast(er,'error');return}s.init()})},
init:function(){var s=this;RW_Auth.init(function(u,er){if(!u){if(er&&er!=='NO_SESSION')RW_UI.toast(er,'error');return}s.user=u;supabase.auth.getUser().then(function(r){if(r.error)throw r.error;return supabase.from('users').select('company_id,role,status').eq('auth_id',r.data.user.id).maybeSingle()}).then(function(r){if(r.error||!r.data||!r.data.company_id)throw new Error('سياق الشركة غير محدد');if(r.data.status&&r.data.status!=='Active')throw new Error('المستخدم غير نشط');s.company=r.data.company_id;return s.loadRefs()}).then(function(){if(!s.user.isOwner&&s.user.activeWarehouseRole!=='أذونات')throw new Error('غير مصرح – هذه الوحدة مخصصة لصلاحية الأذونات');RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('recoveryScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');s.updateConnection();s.subscribeRealtime();s.tab('pending');s.prefetchStock()}).catch(function(e){RW_UI.showError(e.message||'تعذر التهيئة')})})},
logout:function(){this.unsubscribeRealtime();RW_Auth.doLogout(function(){location.reload()})},
loadRefs:function(){var s=this;return Promise.all([supabase.from('branches').select('id,branch_code,name').eq('company_id',s.company).eq('is_active',true).order('name'),supabase.from('vehicles').select('id,vehicle_code,license_plate,model,driver_id,status').eq('company_id',s.company).eq('status','Active').order('vehicle_code'),supabase.from('suppliers').select('id,supplier_code,name,phone,is_active').eq('company_id',s.company).eq('is_active',true).order('name'),supabase.from('users').select('id,name,email,phone,role,status,default_branch_id,allowed_branch_ids').eq('company_id',s.company).eq('status','Active').eq('role','مندوب بيع مباشر').order('name'),supabase.from('purchase_orders').select('supplier_id,branch_id').eq('company_id',s.company).not('supplier_id','is',null)]).then(function(r){for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;s.refs.branches=r[0].data||[];s.refs.vehicles=r[1].data||[];s.refs.suppliers=r[2].data||[];s.refs.reps=r[3].data||[];s.refs.supplierBranchMap={};(r[4].data||[]).forEach(function(x){if(x.supplier_id&&x.branch_id)(s.refs.supplierBranchMap[x.branch_id]||(s.refs.supplierBranchMap[x.branch_id]={}))[x.supplier_id]=1});return s.refs})},
updateConnection:function(live){var d=RW_UI.byId('connDot'),l=RW_UI.byId('connLabel');if(navigator.onLine){d.className='w-2.5 h-2.5 rounded-full '+(live===false?'bg-amber-400':'bg-emerald-400');l.textContent=live===false?'متصل · مزامنة عادية':'متزامن حي'}else{d.className='w-2.5 h-2.5 rounded-full bg-rose-400';l.textContent='غير متصل'}},
subscribeRealtime:function(){var s=this;if(!supabase||!supabase.channel)return;this.unsubscribeRealtime();var branchIds=(this.refs.branches||[]).map(function(b){return b.id});var ch=supabase.channel('rw-vouchers-live-'+s.company).on('postgres_changes',{event:'*',schema:'public',table:'stock_vouchers',filter:'company_id=eq.'+s.company},function(){s.debouncedRefresh()}).on('postgres_changes',{event:'*',schema:'public',table:'stock_voucher_details'},function(){s.debouncedRefresh()}).on('postgres_changes',{event:'*',schema:'public',table:'stock_branches',filter:branchIds.length?'branch_id=in.('+branchIds.join(',')+')':undefined},function(){s.debouncedRefreshStock()}).subscribe(function(status){s.updateConnection(status==='SUBSCRIBED');if(status==='SUBSCRIBED')s.markSync()});this.realtime=ch},
unsubscribeRealtime:function(){if(this.realtime&&supabase){try{supabase.removeChannel(this.realtime)}catch(e){}this.realtime=null}},markSync:function(){this.lastSyncAt=new Date();var x=document.getElementById('syncAt');if(x)x.textContent='آخر مزامنة: '+this.lastSyncAt.toLocaleTimeString('ar-EG')},debouncedRefresh:function(){var s=this;clearTimeout(this._refreshTimer);this._refreshTimer=setTimeout(function(){s.loadList(s.tabName)},250)},debouncedRefreshStock:function(){var s=this;clearTimeout(this._stockTimer);this._stockTimer=setTimeout(function(){s.prefetchStock(true)},180)},
prefetchStock:function(silent){var s=this,bids=this.refs.branches.map(function(b){return b.id});if(!bids.length){this.stock={};return Promise.resolve()};if(!silent)RW_UI.showLoader('جاري مزامنة أرصدة المخزون...');return supabase.from('stock_branches').select('branch_id,item_id,qty,allocated_qty').in('branch_id',bids).limit(20000).then(function(r){if(r.error)throw r.error;s.stock={};(r.data||[]).forEach(function(x){s.stock[x.branch_id+':'+x.item_id]=Math.max(0,Number(x.qty||0)-Number(x.allocated_qty||0))});s.markSync();if(!silent)RW_UI.hideLoader();if(s.mode==='voucher')s.renderProducts();return r.data}).catch(function(e){if(!silent)RW_UI.hideLoader();console.error('[VOUCHERS] stock sync failed',e);throw e})},
tab:function(t){this.tabName=t;document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active');x.classList.add('text-slate-400')});var b=RW_UI.byId('tab-'+t);if(b){b.classList.add('active');b.classList.remove('text-slate-400')}if(t==='account'){this.account();return}this.loadList(t)},toggleMenu:function(){RW_UI.byId('typeMenu').classList.toggle('hidden')},choose:function(t){this.type=t;this.mode=(t==='Scrap'||t==='Adjustment')?'engine':'voucher';this.toggleMenu();this.newWorkspace()},
actionFor:function(v){if(!v)return'';if(v.status==='Draft')return'draft';if(v.status==='Sent')return(v.type==='Transfer'||v.type==='DirectReturn')?'receive':'complete';if(v.status==='Received')return'complete';return''},
