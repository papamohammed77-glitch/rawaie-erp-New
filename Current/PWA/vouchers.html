<style>
*{box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#f8fafc;-webkit-tap-highlight-color:transparent}.auth-bg{background:linear-gradient(135deg,#21154f,#312e81,#4f46e5)}

<body class="h-screen flex flex-col overflow-hidden">

<header class="gold-header text-white p-3 sticky top-0 z-40 flex-shrink-0"><div class="flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0"><div class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center"><i class="fa-solid fa-file-signature"></i></div><div><div class="font-black text-sm sm:text-base">الأذونات المخزنية</div><div class="text-[11px] text-white/70">مركز واحد للدورات اليدوية والحركات التصحيحية</div></div></div><div class="flex items-center gap-2"><button id="headerTypeButton" onclick="App.toggleVoucherMenu()" class="gold-chip rounded-2xl px-3 py-2 flex items-center gap-2 text-xs sm:text-sm font-black"><i class="fa-solid fa-plus"></i><span id="headerTypeLabel">إذن جديد</span><i class="fa-solid fa-chevron-down text-[10px]"></i></button><button onclick="App.doLogout()" class="bg-white/10 w-10 h-10 rounded-2xl"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div></div><div id="voucherMenu" class="hidden voucher-menu rounded-3xl p-3 mt-3"><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

</div><div class="mt-3 p-3 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-800">الأربع الأولى لها عقد Manual Voucher حقيقي في Production. الإتلاف والجرد متاحان عبر محرك التسوية الموجود، دون اختلاق سجل stock_vouchers.</div></div></header>

<script>
var App={currentUser:null,companyId:null,currentTab:'pending',selectedType:'Transfer',vouchers:[],cart:[],maps:{branches:[],vehicles:[],suppliers:[]},catalog:{Transfer:'تحويل داخلي',DirectSale:'صرف مباشر',DirectReturn:'مرتجع مباشر',SupplierReturn:'مرتجع مورد',Scrap:'إتلاف / إعدام',Adjustment:'تسوية جرد'},esc:function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')},togglePass:function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash'}else{p.type='password';i.className='fa-solid fa-eye'}},doLogin:function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return}RW_UI.showLoader();RW_Auth.doLogin(e,p,function(u,er){RW_UI.hideLoader();if(er){RW_UI.byId('loginMsg').innerText=er;RW_UI.byId('loginMsg').classList.remove('hidden')}else App.init()})},init:function(){var s=this;RW_Auth.init(function(u,er){if(!u){if(er&&er!=='NO_SESSION'){console.warn('⚠️ تعذر استعادة الجلسة السابقة:',er)}return}s.currentUser=u;supabase.auth.getUser().then(function(r){if(r.error||!r.data.user)throw new Error('جلسة غير صالحة');return supabase.from('users').select('company_id').eq('auth_id',r.data.user.id).maybeSingle()}).then(function(r){if(r.error||!r.data||!r.data.company_id)throw new Error('سياق الشركة غير محدد');s.companyId=r.data.company_id;return s.loadRefs()}).then(function(){if(!s.currentUser.isOwner&&s.currentUser.activeWarehouseRole!=='أذونات'){RW_UI.showError('دورك النشط هو "'+(s.currentUser.activeWarehouseRole||'غير محدد')+'"',function(){RW_Auth.doLogout()});return}s.enterApp()}).catch(function(e){RW_UI.showError(e.message||'تعذر تهيئة الأذونات')})})},enterApp:function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');this.updateHeader();this.switchTab('pending')},doLogout:function(){RW_Auth.doLogout(function(){location.reload()})},updateHeader:function(){RW_UI.safeText(RW_UI.byId('headerTypeLabel'),'إذن: '+this.catalog[this.selectedType])},toggleVoucherMenu:function(){var m=RW_UI.byId('voucherMenu');if(m)m.classList.toggle('hidden')},chooseVoucherType:function(type){this.selectedType=type;this.updateHeader();var m=RW_UI.byId('voucherMenu');if(m)m.classList.add('hidden');this.newVoucher(type)},chooseEngineType:function(type){if(type!=='Scrap'&&type!=='Adjustment')return;this.selectedType=type;this.updateHeader();var m=RW_UI.byId('voucherMenu');if(m)m.classList.add('hidden');this.newEngineOperation(type)},loadRefs:function(){var s=this;return Promise.all([supabase.from('branches').select('id,branch_code,name').eq('company_id',s.companyId).eq('is_active',true).order('name'),supabase.from('vehicles').select('id,vehicle_code,status').eq('company_id',s.companyId).eq('status','Active').order('vehicle_code'),supabase.from('suppliers').select('id,supplier_code,name').eq('company_id',s.companyId).eq('is_active',true).order('name')]).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;if(r[2].error)throw r[2].error;s.maps={branches:r[0].data||[],vehicles:r[1].data||[],suppliers:r[2].data||[]}})},switchTab:function(t){this.currentTab=t;['pending','completed','account'].forEach(function(x){var b=RW_UI.byId('tab-'+x);if(b){b.classList.remove('active');b.classList.add('text-slate-400')}});var a=RW_UI.byId('tab-'+t);if(a){a.classList.add('active');a.classList.remove('text-slate-400')}if(t==='account')this.account();else this.load(t)},load:function(scope){var s=this;RW_UI.showSkeleton('mainContent',3,'card');var q=supabase.from('stock_vouchers').select('*').eq('company_id',s.companyId).eq('source','Manual').order('voucher_date',{ascending:false}).limit(100);q=scope==='pending'?q.in('status',['Draft','Sent']):q.in('status',['Received','Completed','Cancelled']);q.then(function(r){if(r.error)throw r.error;s.vouchers=r.data||[];s.render(scope)}).catch(function(e){RW_UI.showError(e.message||'فشل تحميل الأذونات')})},render:function(scope){var s=this,h='<div class="max-w-[1100px] mx-auto"><div class="flex flex-wrap justify-between gap-3 mb-4"><div><p class="text-slate-400 text-sm">أهلاً، <b class="text-slate-700">'+s.esc(s.currentUser.name||'زميل')+'</b></p><p class="text-xs text-slate-400 mt-1">لا توجد أي كتابة مباشرة إلى stock_branches أو inventory_log من هذه الصفحة.</p></div><button onclick="App.toggleVoucherMenu()" class="btn-gold px-4 py-3 rounded-2xl font-black">+ نوع جديد</button></div><div class="grid grid-cols-1 sm:grid-cols-4 gap-2 mb-4"><div class="card"><p class="text-xs text-slate-400">المعلقة</p><b class="text-2xl text-indigo-700">'+s.vouchers.filter(function(v){return ['Draft','Sent'].indexOf(v.status)>=0}).length+'</b></div><div class="card"><p class="text-xs text-slate-400">المغلقة</p><b class="text-2xl text-emerald-700">'+s.vouchers.filter(function(v){return ['Received','Completed','Cancelled'].indexOf(v.status)>=0}).length+'</b></div><div class="card"><p class="text-xs text-slate-400">النوع الحالي</p><b class="text-sm text-amber-700">'+s.esc(s.catalog[s.selectedType])+'</b></div><div class="card"><p class="text-xs text-slate-400">الدعم</p><b class="text-sm text-slate-700">4 Voucher + 2 Engine</b></div></div><div class="card mb-4"><input id="voucherSearch" oninput="App.filter()" placeholder="🔍 بحث برقم الإذن أو المرجع أو النوع" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 outline-none font-semibold text-sm"></div><div class="flex items-center justify-between mb-3"><h2 class="text-lg font-black">'+(scope==='pending'?'📄 الأذونات المعلقة':'✅ الأذونات المكتملة')+'</h2><span class="text-xs text-slate-400">'+s.vouchers.length+' سجل</span></div><div id="cards">'+s.cards(s.vouchers,scope)+'</div></div>';RW_UI.safeHTML(RW_UI.byId('mainContent'),h)},filter:function(){var q=(RW_UI.byId('voucherSearch').value||'').toLowerCase(),rows=this.vouchers.filter(function(v){return String(v.voucher_code||'').toLowerCase().includes(q)||String(v.reference||'').toLowerCase().includes(q)||String(v.type||'').toLowerCase().includes(q)});RW_UI.safeHTML(RW_UI.byId('cards'),this.cards(rows,this.currentTab))},cards:function(rows,scope){if(!rows.length)return '<div class="card text-center py-14"><div class="text-6xl mb-4">☕</div><p class="text-slate-400 font-bold">لا توجد أذونات.</p></div>';var s=this,h='';rows.forEach(function(v){var cls=v.status==='Draft'?'bg-amber-100 text-amber-700':v.status==='Sent'?'bg-blue-100 text-blue-700':v.status==='Received'?'bg-emerald-100 text-emerald-700':v.status==='Cancelled'?'bg-rose-100 text-rose-700':'bg-slate-100 text-slate-700';var lab=v.status==='Draft'?'مسودة':v.status==='Sent'?'مُرسل':v.status==='Received'?'مُستلم':v.status==='Completed'?'مكتمل':'ملغى';h+='<div class="card mb-3 cursor-pointer slide-in" onclick="App.details(\''+s.esc(v.voucher_code)+'\')"><div class="flex flex-wrap justify-between gap-3"><div><div class="flex items-center gap-2"><b>'+s.esc(v.voucher_code)+'</b><span class="px-2 py-1 rounded-full text-xs font-bold '+cls+'">'+lab+'</span></div><p class="text-xs text-slate-400 mt-1">'+s.esc(s.catalog[v.type]||v.type)+' · '+s.esc(v.reference||'بدون مرجع')+'</p><p class="text-[11px] text-slate-400 mt-1">'+s.esc(v.voucher_date||'')+'</p></div><div class="flex items-center gap-2">'+(scope==='pending'&&v.status==='Draft'?'<button onclick="event.stopPropagation();App.send(\''+s.esc(v.voucher_code)+'\')" class="btn-primary px-3 py-2 rounded-xl text-xs font-black">إرسال</button>':'')+(scope==='pending'&&v.status==='Sent'&&v.type==='Transfer'?'<button onclick="event.stopPropagation();App.receive(\''+s.esc(v.voucher_code)+'\')" class="bg-emerald-600 text-white px-3 py-2 rounded-xl text-xs font-black">استلام</button>':'')+'</div></div></div>'});return h},location:function(type,id){if(type==='Branch'){var b=this.maps.branches.find(function(x){retu
