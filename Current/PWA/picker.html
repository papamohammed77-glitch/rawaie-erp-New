<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>محضّر | الروائع ERP</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#4f46e5">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Cairo',sans-serif;background:#f8fafc;-webkit-tap-highlight-color:transparent}.auth-container{background:linear-gradient(135deg,#312e81 0%,#4338ca 40%,#4f46e5 100%)}.card{background:#fff;border-radius:24px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.02),0 8px 24px rgba(0,0,0,.03);transition:all .2s}.card:active{transform:scale(.985);background:#fafafa}.btn-primary{background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;padding:1rem 1.5rem;border-radius:16px;font-weight:700;border:none;cursor:pointer;width:100%;transition:all .2s;box-shadow:0 4px 12px rgba(79,70,229,.25)}.btn-primary:active{transform:scale(.97)}.btn-danger{background:linear-gradient(135deg,#ef4444,#f87171);color:#fff;padding:.75rem 1.25rem;border-radius:14px;font-weight:700;border:none;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(239,68,68,.2)}.btn-reopen{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff;padding:.75rem 1.25rem;border-radius:14px;font-weight:700;border:none;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(245,158,11,.2)}.tab-btn{transition:all .2s}.progress-bar{transition:width .4s}.slide-in{animation:slideIn .3s ease}@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}.search-dropdown{max-height:60vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.12)}.sticky-top{position:sticky;top:0;z-index:20}
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4"><div class="bg-white rounded-[36px] shadow-2xl p-6 w-[92%] max-w-md slide-in"><div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-200 mb-5"><i class="fa-solid fa-clipboard-list text-white text-3xl"></i></div><h1 class="font-black text-2xl text-slate-800">الروائع</h1><p class="text-sm text-slate-400 font-semibold mt-1">المحضّر</p></div><div class="space-y-4"><div><label class="block text-xs font-bold text-slate-500 mb-1.5">البريد الإلكتروني</label><input id="loginEmail" type="email" placeholder="example@domain.com" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 focus:bg-white outline-none font-semibold text-sm"></div><div><label class="block text-xs font-bold text-slate-500 mb-1.5">كلمة السر</label><input id="loginPass" type="password" placeholder="••••••••" class="w-full p-3.5 bg-slate-50 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 focus:bg-white outline-none font-semibold text-sm"></div></div><button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 text-white py-4 rounded-2xl font-bold text-base shadow-lg mt-6">تسجيل الدخول</button><p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-4 hidden"></p></div></div>
<div id="mainApp" class="hidden flex flex-col h-full"><header class="bg-gradient-to-r from-indigo-700 to-indigo-600 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0"><span class="font-black text-base">📋 المحضّر</span><div class="flex items-center gap-2"><span class="text-xs font-bold opacity-90" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/15 w-9 h-9 rounded-full flex items-center justify-center"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div></header><div class="flex gap-1.5 p-2 bg-white border-b border-slate-100 overflow-x-auto flex-shrink-0"><button onclick="App.switchTab('pending')" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-2xl font-bold text-sm bg-indigo-600 text-white shadow-sm" id="tab-pending">📋 قيد التحضير</button><button onclick="App.switchTab('completed')" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400" id="tab-completed">✅ مكتملة</button><button onclick="App.switchTab('account')" class="tab-btn whitespace-nowrap px-5 py-2.5 rounded-2xl font-bold text-sm text-slate-400" id="tab-account">⚙️ حسابي</button></div><main id="mainContent" class="flex-1 overflow-y-auto p-4"></main></div>
<script>
var SUPABASE_URL='https://fiilmooggumokxanwiyx.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpaWxtb29nZ3Vtb2t4YW53aXl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDkwOTIsImV4cCI6MjA5NDI4NTA5Mn0.LZScCxnCiRrTSCCBmTryszQpY1AwBgR2dkTBc5K0c4';
var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);var db=new Dexie('RW_Picker');db.version(1).stores({session:'runsheet_code'});
function byId(id){return document.getElementById(id)}function safeText(el,text){if(el)el.textContent=text}function safeHTML(el,html){if(el)el.innerHTML=html}function toast(m,t){Swal.fire({toast:true,position:'top',icon:t||'info',title:m,showConfirmButton:false,timer:2200,customClass:{popup:'!rounded-2xl !shadow-xl'}})}
var ITEM_MASTER={};
var App={currentUser:null,pubUserId:null,companyId:null,currentTab:'pending',session:null,timerInterval:null,searchTimer:null,searchResults:[],completedRunsheets:[],

doLogin:function(){var email=byId('loginEmail').value.trim(),pass=byId('loginPass').value.trim();if(!email||!pass){byId('loginMsg').innerText='أدخل البريد الإلكتروني وكلمة المرور';byId('loginMsg').classList.remove('hidden');return}var self=this;Swal.showLoading();supabase.auth.signInWithPassword({email:email,password:pass}).then(function(r){Swal.close();if(r.error){byId('loginMsg').innerText=r.error.message;byId('loginMsg').classList.remove('hidden')}else self.init()}).catch(function(){Swal.close();byId('loginMsg').innerText='فشل الاتصال بالخادم';byId('loginMsg').classList.remove('hidden')})},

loadItemMaster:function(){var self=this;return supabase.from('items').select('id,item_code,name,unit,description,image_url,is_active').order('item_code').then(function(r){if(r.error)throw r.error;ITEM_MASTER={};(r.data||[]).forEach(function(i){if(i.item_code)ITEM_MASTER[i.item_code]=i});return r.data||[]})},

init:function(){var self=this;supabase.auth.getSession().then(function(r){if(!r.data||!r.data.session)return;self.currentUser=r.data.session.user;var meta=self.currentUser.user_metadata||{};var isOwner=(meta.isOwner===true||meta.isOwner==='true'||meta.role==='owner'||meta.role==='مالك');var perms=meta.permissions||[];if(!isOwner&&(!Array.isArray(perms)||perms.indexOf('warehouse')===-1)){toast('ليس لديك صلاحية الوصول للمخازن','error');return supabase.auth.signOut()}return supabase.from('users').select('id,name,company_id,status,active_warehouse_role').eq('auth_id',self.currentUser.id).maybeSingle().then(function(u){if(u.error)throw u.error;if(!u.data||!u.data.id||!u.data.company_id)throw new Error('تعذر تحديد المستخدم المرتبط بحسابك');if(u.data.status&&u.data.status!=='Active')throw new Error('المستخدم غير نشط');if(!isOwner&&u.data.active_warehouse_role!=='تحضير')throw new Error('دور المستخدم النشط ليس التحضير');self.pubUserId=u.data.id;self.companyId=u.data.company_id;return self.loadItemMaster().then(function(){safeText(byId('headerUserName'),u.data.name||meta.name||self.currentUser.email);self.enterApp()})}).catch(function(e){console.error(e);toast(e.message||'تعذر تحديد المستخدم أو بيانات النظام','error');supabase.auth.signOut()})})},

enterApp:function(){byId('loginScreen').classList.add('hidden');byId('mainApp').classList.remove('hidden');this.switchTab('pending')},
switchTab:function(tab){this.currentTab=tab;['pending','completed','account'].forEach(function(t){var b=byId('tab-'+t);if(b){b.classList.remove('bg-indigo-600','text-white','shadow-sm');b.classList.add('text-slate-400')}});var a=byId('tab-'+tab);if(a){a.classList.add('bg-indigo-600','text-white','shadow-sm');a.classList.remove('text-slate-400')}if(tab==='pending')this.renderPendingTab();else if(tab==='completed')this.renderCompletedTab();else this.renderAccount()},

renderPendingTab:function(){var self=this;safeHTML(byId('mainContent'),'<div class="mb-6"><div class="skeleton h-14 w-full mb-4"></div><div class="skeleton h-32 w-full"></div></div>');if(!self.companyId||!self.pubUserId)return;var mine=supabase.from('runsheets').select('id,runsheet_code,status,run_date,picker_id,run_sheet_details(count)').eq('company_id',self.companyId).eq('status','Picking').eq('picker_id',self.pubUserId).order('run_date',{ascending:false}).limit(20);var open=supabase.from('runsheets').select('id,runsheet_code,status,run_date,picker_id,run_sheet_details(count)').eq('company_id',self.companyId).in('status',['Open','Confirmed']).order('run_date',{ascending:false}).limit(50);Promise.all([mine,open]).then(function(rs){if(rs[0].error)throw rs[0].error;if(rs[1].error)throw rs[1].error;self.renderRunsheetLists(rs[0].data||[],rs[1].data||[])}).catch(function(e){console.error(e);safeHTML(byId('mainContent'),'<div class="text-center py-20 text-red-400">فشل تحميل البيانات</div>')})},

renderRunsheetLists:function(mine,open){var self=this,h='<div class="mb-4 text-sm text-slate-400">اختر رانشيت للتحضير</div><div class="relative mb-6"><input id="searchRunsheet" oninput="App.onSearchInput(this.value)" placeholder="🔍 ابحث عن رقم رانشيت..." class="w-full p-4 bg-white rounded-2xl border-2 border-slate-100 outline-none font-semibold text-sm shadow-sm"><div id="searchDropdown" class="search-dropdown absolute top-full left-0 right-0 bg-white rounded-2xl mt-2 hidden z-40"></div></div>';if(mine.length){h+='<h2 class="text-lg font-black text-slate-800 mb-3">📌 مهامي النشطة</h2>';mine.forEach(function(r){h+=self.runsheetCard(r,true)});h+='<hr class="my-6 border-slate-100">'}h+='<h2 class="text-lg font-black text-slate-800 mb-3">📋 مهام متاحة للتحضير</h2>';if(!open.length)h+='<div class="text-center py-12 text-slate-400">لا توجد مهام متاحة في الوقت الحالي.</div>';else open.forEach(function(r){h+=self.runsheetCard(r,false)});safeHTML(byId('mainContent'),h)},
runsheetCard:function(r,mine){var n=r.run_sheet_details&&r.run_sheet_details[0]?r.run_sheet_details[0].count:0;var status=mine?'قيد التحضير':(r.status==='Confirmed'?'مؤكد':'مفتوح');var action=mine?'<button onclick="event.stopPropagation();App.cancelPicking(\''+r.runsheet_code+'\')" class="btn-danger mt-3 text-xs">إلغاء التحضير</button>':'';return '<div class="card mb-3 cursor-pointer slide-in" onclick="App.openRunsheet(\''+r.runsheet_code+'\')"><div class="flex justify-between items-center"><div><span class="font-black text-base text-slate-800">'+r.runsheet_code+'</span><p class="text-xs text-slate-400 mt-1">'+(r.run_date||'')+' | '+n+' أصناف</p></div><span class="px-2.5 py-1 rounded-full text-xs font-bold '+(mine?'bg-amber-50 text-amber-600':r.status==='Confirmed'?'bg-emerald-50 text-emerald-600':'bg-blue-50 text-blue-600')+'">'+status+'</span></div>'+action+'</div>'},

onSearchInput:function(q){var self=this;if(this.searchTimer)clearTimeout(this.searchTimer);if(!q.trim()){var d=byId('searchDropdown');if(d)d.classList.add('hidden');return}this.searchTimer=setTimeout(function(){supabase.from('runsheets').select('runsheet_code,status,run_date,picker_id,run_sheet_details(count)').eq('company_id',self.companyId).in('status',['Open','Confirmed','Picking']).ilike('runsheet_code','%'+q.trim()+'%').limit(10).then(function(r){if(r.error)throw r.error;self.searchResults=r.data||[];self.renderSearchDropdown()}).catch(function(e){console.error(e);self.searchResults=[];self.renderSearchDropdown()})},250)},
renderSearchDropdown:function(){var d=byId('searchDropdown');if(!d)return;if(!this.searchResults.length){safeHTML(d,'<div class="p-4 text-center text-slate-400">لا يوجد رانشيت بهذا الرقم</div>');d.classList.remove('hidden');return}var self=this,h='';this.searchResults.forEach(function(r){var mine=r.status==='Picking'&&r.picker_id===self.pubUserId;var taken=r.status==='Picking'&&!mine;h+='<div onclick="App.openRunsheet(\''+r.runsheet_code+'\')" class="p-3 border-b border-slate-50 cursor-pointer flex justify-between"><div><b>'+r.runsheet_code+'</b><div class="text-xs text-slate-400">'+(r.run_date||'')+'</div></div><span class="text-xs font-bold '+(mine?'text-amber-600':taken?'text-red-500':'text-blue-600')+'">'+(mine?'قيد تحضيرك':taken?'مع زميل آخر':r.status==='Confirmed'?'مؤكد':'مفتوح')+'</span></div>'});safeHTML(d,h);d.classList.remove('hidden')},

openRunsheet:function(code){var self=this;if(!this.companyId)return;safeHTML(byId('mainContent'),'<div class="text-center py-20"><div class="skeleton h-48 w-full"></div></div>');Promise.all([supabase.from('runsheets').select('*').eq('company_id',this.companyId).eq('runsheet_code',code).maybeSingle(),supabase.from('run_sheet_details').select('*').eq('runsheet_id',null)]).then(function(){return supabase.from('runsheets').select('*').eq('company_id',self.companyId).eq('runsheet_code',code).maybeSingle()}).then(function(rr){if(rr.error)throw rr.error;if(!rr.data){toast('الرانشيت غير موجود','error');return self.renderPendingTab()}var rs=rr.data;if((rs.status==='Picking'||rs.status==='Picked')&&rs.picker_id!==self.pubUserId){toast('الرانشيت مرتبط بمستخدم آخر','warning');return self.renderPendingTab()}return supabase.from('run_sheet_details').select('*').eq('runsheet_id',rs.id).then(function(dr){if(dr.error)throw dr.error;var details=dr.data||[];if(rs.status==='Picking'&&rs.picker_id===self.pubUserId){self.session={runsheet_code:code,runsheet_id:rs.id,start_time:rs.picker_start||new Date().toISOString(),items:details.map(function(d){var m=ITEM_MASTER[d.item_code]||{};return {item_code:d.item_code,item_name:m.name||d.item_name||'',unit:m.unit||d.unit||'حبة',description:m.description||'',qty_ordered:Number(d.qty_ordered)||0,qty_picked:Number(d.qty_picked)||0,notes:''}})};return self.renderActiveSession()}var h='<div class="flex items-center gap-3 mb-6"><button onclick="App.renderPendingTab()" class="w-10 h-10 bg-white rounded-2xl text-indigo-600 shadow-sm"><i class="fa-solid fa-arrow-right"></i></button><span class="font-black text-xl">'+code+' | '+details.length+' أصناف</span></div>';if(rs.status==='Open'||rs.status==='Confirmed')h+='<button onclick="App.startPicking(\''+code+'\')" class="btn-primary mb-6 sticky-top">بدء التحضير</button>';h+='<p class="text-sm text-slate-400 mb-4">بيانات الصنف والصورة من Item Master الموحد.</p>';details.forEach(function(d){var m=ITEM_MASTER[d.item_code]||{};h+='<div class="card mb-3 cursor-pointer" onclick="App.showItemDetail(\''+d.item_code+'\')"><div class="flex items-center gap-4">'+self._img(d.item_code)+'<div><p class="font-bold text-slate-700">'+(m.name||d.item_name||'')+'</p><p class="text-xs text-slate-400 mt-1">'+(m.unit||d.unit||'حبة')+' | الكمية: '+(Number(d.qty_ordered)||0)+'</p></div></div></div>'});safeHTML(byId('mainContent'),h)})}) .catch(function(e){console.error(e);toast(e.message||'فشل تحميل الرانشيت','error');self.renderPendingTab()})},

_img:function(code){var m=ITEM_MASTER[code]||{};return m.image_url?'<img src="'+m.image_url+'" class="w-14 h-14 rounded-2xl object-cover border-2 border-white shadow-sm" onerror="this.style.display=\'none\'">':'<div class="w-14 h-14 bg-gradient-to-br from-slate-100 to-slate-200 rounded-2xl flex items-center justify-center text-slate-400"><i class="fa-solid fa-box"></i></div>'},
showItemDetail:function(code){var m=ITEM_MASTER[code]||{};Swal.fire({html:'<div class="text-right">'+(m.image_url?'<img src="'+m.image_url+'" class="w-full h-48 object-cover rounded-2xl mb-4">':'<div class="w-full h-48 bg-slate-100 rounded-2xl mb-4 flex items-center justify-center"><i class="fa-solid fa-box text-4xl text-slate-400"></i></div>')+'<h3 class="font-black text-xl text-slate-800">'+(m.name||code)+'</h3><div class="mt-3 space-y-2 text-sm"><div class="flex justify-between"><span class="text-slate-400">الكود</span><b>'+code+'</b></div><div class="flex justify-between"><span class="text-slate-400">الوحدة</span><b>'+(m.unit||'حبة')+'</b></div></div>'+(m.description?'<p class="text-sm text-slate-500 mt-3 pt-3 border-t">'+m.description+'</p>':'')+'</div>',showCloseButton:true,showConfirmButton:false,width:'380px'})},

startPicking:function(code){var self=this;if(!navigator.onLine)return toast('أنت غير متصل','warning');Swal.fire({title:'جاري بدء التحضير...',allowOutsideClick:false,didOpen:function(){Swal.showLoading()}});supabase.auth.getSession().then(function(s){var t=s.data.session?s.data.session.access_token:null;if(!t)throw new Error('انتهت الجلسة');return fetch(SUPABASE_URL+'/functions/v1/start-picking',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({runsheet_code:code})})}).then(function(r){if(!r.ok)return r.json().then(function(e){throw new Error(e.msg||'فشل')});return r.json()}).then(function(j){Swal.close();if(!j.success)throw new Error(j.msg||'فشل');toast('تم بدء التحضير','success');self.openRunsheet(code)}).catch(function(e){Swal.close();toast(e.message||'فشل الاتصال','error')})},

cancelPicking:function(code){var self=this;Swal.fire({title:'تأكيد الإلغاء',text:'سيتم إلغاء الحجز وإعادة الرانشيت إلى Open.',icon:'warning',showCancelButton:true,confirmButtonText:'نعم، ألغِ التحضير',cancelButtonText:'رجوع'}).then(function(r){if(!r.isConfirmed)return;return supabase.auth.getSession().then(function(s){var t=s.data.session?s.data.session.access_token:null;if(!t)throw new Error('انتهت الجلسة');return fetch(SUPABASE_URL+'/functions/v1/cancel-picking',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({runsheet_code:code})})}).then(function(x){if(!x.ok)return x.json().then(function(e){throw new Error(e.msg||'فشل')});return x.json()}).then(function(j){if(!j.success)throw new Error(j.msg||'فشل');db.session.clear();self.session=null;if(self.timerInterval)clearInterval(self.timerInterval);toast('تم إلغاء التحضير','success');self.renderPendingTab()}).catch(function(e){toast(e.message||'فشل الإلغاء','error')})})},

renderActiveSession:function(){var self=this,s=this.session;if(!s)return this.renderPendingTab();var picked=s.items.filter(function(i){return i.qty_picked>0}).length;var pct=s.items.length?Math.round(picked/s.items.length*100):0;var h='<div class="bg-indigo-50 rounded-3xl p-5 mb-6"><div class="flex justify-between mb-4"><span class="font-black text-2xl">'+s.runsheet_code+' | '+s.items.length+' صنف</span><span class="bg-white text-indigo-600 px-4 py-2 rounded-2xl text-sm font-black" id="timerLabel">⏱️ 00:00</span></div><div class="bg-white rounded-2xl p-4"><div class="flex justify-between text-xs font-bold text-slate-400 mb-2"><span>تقدم التحضير</span><span>'+picked+' / '+s.items.length+'</span></div><div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden"><div class="progress-bar h-full bg-indigo-500 rounded-full" style="width:'+pct+'%"></div></div></div></div><p class="text-sm text-slate-400 mb-4">الكميات تعديلات محلية وتُحفظ في order_details فقط عند الإنهاء.</p>';s.items.forEach(function(it,i){var done=it.qty_picked>0;h+='<div class="card mb-3 cursor-pointer '+(done?'border-r-4 border-indigo-400':'')+'" onclick="App.editPickedItem('+i+')"><div class="flex items-center justify-between"><div class="flex items-center gap-4">'+self._img(it.item_code)+'<div><p class="font-bold text-slate-700">'+it.item_name+'</p><p class="text-xs text-slate-400 mt-1">'+it.unit+' | مطلوب: '+it.qty_ordered+' | محضّر: <b class="'+(done?'text-indigo-600':'text-slate-500')+'">'+it.qty_picked+'</b></p>'+(it.notes?'<p class="text-xs text-amber-600 mt-1">📝 '+it.notes+'</p>':'')+'</div></div><i class="fa-solid fa-pen text-slate-300"></i></div></div>'});h+='<button onclick="App.completePicking()" class="btn-primary mt-6">✅ إنهاء التحضير</button><button onclick="App.cancelPicking(\''+s.runsheet_code+'\')" class="btn-danger w-full mt-3">✕ إلغاء التحضير</button>';safeHTML(byId('mainContent'),h);this.startTimer()},
startTimer:function(){var self=this;if(this.timerInterval)clearInterval(this.timerInterval);this.timerInterval=setInterval(function(){if(!self.session||!self.session.start_time)return;var d=Math.max(0,Math.floor((Date.now()-new Date(self.session.start_time).getTime())/1000));var m=Math.floor(d/60),s=d%60;safeText(byId('timerLabel'),'⏱️ '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'))},1000)},

editPickedItem:function(index){var self=this,it=this.session.items[index];Swal.fire({title:'<span class="text-slate-800">'+it.item_name+'</span>',html:'<div class="text-center">'+(ITEM_MASTER[it.item_code]&&ITEM_MASTER[it.item_code].image_url?'<img src="'+ITEM_MASTER[it.item_code].image_url+'" class="w-20 h-20 object-cover rounded-2xl mx-auto mb-3">':'')+'</div><div class="text-right text-sm space-y-2"><div class="flex justify-between"><span>الكمية المطلوبة</span><b>'+it.qty_ordered+'</b></div><div class="flex justify-between"><span>الوحدة</span><b>'+it.unit+'</b></div><input id="swal-qty" type="number" min="0" max="'+it.qty_ordered+'" value="'+it.qty_picked+'" class="swal2-input !rounded-xl !text-center !font-bold"><input id="swal-notes" value="'+(it.notes||'')+'" placeholder="سبب النقص..." class="swal2-input !rounded-xl"></div>',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',preConfirm:function(){return{qty:Math.max(0,Math.min(Number(document.getElementById('swal-qty').value)||0,it.qty_ordered)),notes:document.getElementById('swal-notes').value.trim()}}}).then(function(r){if(r.isConfirmed){self.session.items[index].qty_picked=r.value.qty;self.session.items[index].notes=r.value.notes;self.renderActiveSession()}})},

completePicking:function(){var self=this;if(!this.session||!navigator.onLine)return;var items=this.session.items.map(function(i){return{itemCode:i.item_code,pickedQty:i.qty_picked,notes:i.notes}});Swal.fire({title:'تأكيد إنهاء التحضير',text:'سيتم تنفيذ الحجز وتحديث order_details ذريًا من خلال محرك التحضير.',icon:'info',showCancelButton:true,confirmButtonText:'تأكيد',cancelButtonText:'إلغاء'}).then(function(r){if(!r.isConfirmed)return;Swal.showLoading();return supabase.auth.getSession().then(function(s){var t=s.data.session?s.data.session.access_token:null;if(!t)throw new Error('انتهت الجلسة');return fetch(SUPABASE_URL+'/functions/v1/complete-picking',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({runsheet_code:self.session.runsheet_code,items:items})})}).then(function(x){if(!x.ok)return x.json().then(function(e){throw new Error(e.msg||'فشل')});return x.json()}).then(function(j){Swal.close();if(!j.success)throw new Error(j.msg||'فشل');db.session.clear();self.session=null;if(self.timerInterval)clearInterval(self.timerInterval);toast('تم إنهاء التحضير والحجز','success');self.renderPendingTab()}).catch(function(e){Swal.close();toast(e.message||'فشل إنهاء التحضير','error')})})},

renderCompletedTab:function(){var self=this;safeHTML(byId('mainContent'),'<div class="text-center py-20"><div class="skeleton h-12 w-3/4"></div></div>');supabase.from('runsheets').select('runsheet_code,run_date,status').eq('company_id',this.companyId).eq('status','Picked').eq('picker_id',this.pubUserId).order('run_date',{ascending:false}).limit(50).then(function(r){if(r.error)throw r.error;self.completedRunsheets=r.data||[];var h='<h2 class="text-lg font-black text-slate-800 mb-4">✅ الرانشيتات التي أنهيتها</h2>';if(!self.completedRunsheets.length)h+='<div class="text-center py-16 text-slate-400">لا توجد رانشيتات مكتملة.</div>';else self.completedRunsheets.forEach(function(x){h+='<div class="card mb-3 flex justify-between"><div><b>'+x.runsheet_code+'</b><p class="text-xs text-slate-400">'+x.run_date+'</p></div><button onclick="App.reopenPicking(\''+x.runsheet_code+'\')" class="btn-reopen text-xs">تعديل التحضير</button></div>'});safeHTML(byId('mainContent'),h)}).catch(function(){safeHTML(byId('mainContent'),'<div class="text-center py-20 text-red-400">فشل تحميل البيانات</div>')})},
reopenPicking:function(code){var self=this;Swal.fire({title:'تأكيد التعديل',text:'سيُفرج عن الحجز وتُعاد حالة الرانشيت إلى Picking.',showCancelButton:true,confirmButtonText:'متابعة',cancelButtonText:'إلغاء'}).then(function(r){if(!r.isConfirmed)return;return supabase.auth.getSession().then(function(s){var t=s.data.session?s.data.session.access_token:null;if(!t)throw new Error('انتهت الجلسة');return fetch(SUPABASE_URL+'/functions/v1/reopen-picking',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify({runsheet_code:code})})}).then(function(x){if(!x.ok)return x.json().then(function(e){throw new Error(e.msg||'فشل')});return x.json()}).then(function(j){if(!j.success)throw new Error(j.msg||'فشل');toast('تم إعادة فتح الرانشيت','success');self.renderPendingTab()}).catch(function(e){toast(e.message||'فشل إعادة الفتح','error')})})},
renderAccount:function(){safeHTML(byId('mainContent'),'<div class="text-center mb-8 mt-4"><div class="w-20 h-20 bg-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-white text-3xl font-black">'+(this.currentUser.user_metadata.name||'?').charAt(0)+'</div><h2 class="font-black text-xl mt-4">'+(this.currentUser.user_metadata.name||this.currentUser.email)+'</h2><p class="text-sm text-slate-400">محضّر</p></div><button onclick="App.doLogout()" class="w-full bg-white border-2 border-red-100 text-red-500 py-4 rounded-2xl font-bold">تسجيل الخروج</button>')},
doLogout:function(){var self=this;if(this.timerInterval)clearInterval(this.timerInterval);supabase.auth.signOut().then(function(){self.currentUser=null;self.session=null;byId('mainApp').classList.add('hidden');byId('loginScreen').classList.remove('hidden');byId('loginEmail').value='';byId('loginPass').value=''})}
};
document.addEventListener('DOMContentLoaded',function(){App.init()});
</script>
<script src="../register-sw.js"></script>
</body>
</html>
