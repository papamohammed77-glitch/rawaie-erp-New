<style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f3f6f9;color:#17202a}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.btn{transition:.18s}.btn:hover{transform:translateY(-1px)}.table-wrap{overflow:auto}.table-wrap table{min-width:900px}.sticky-head th{position:sticky;top:0;background:#f8fafc;z-index:2}.muted{color:#64748b}.danger{color:#b91c1c}.ok{color:#047857}.warn{color:#b45309}.nav-btn.active{background:#047857;color:#fff}.nav-btn{white-space:nowrap}.kpi{border:1px solid #e5e7eb;border-radius:18px;padding:18px;background:linear-gradient(180deg,#fff,#f8fafc)}.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.pill-ok{background:#dcfce7;color:#166534}.pill-warn{background:#fef3c7;color:#92400e}.pill-danger{background:#fee2e2;color:#991b1b}.pill-info{background:#dbeafe;color:#1d4ed8}.metric-big{font-size:26px;font-weight:900}.empty{padding:40px;text-align:center;color:#64748b}.small{font-size:12px}.field{width:100%;padding:10px 12px;border:1px solid #dbe2ea;border-radius:10px;background:#fff;font-weight:700}.field:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.1)}

<body>
<div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-emerald-950 via-emerald-800 to-emerald-600 p-4"><div class="w-full max-w-md bg-white rounded-3xl p-7 shadow-2xl"><div class="text-center mb-6"><div class="w-20 h-20 mx-auto rounded-2xl bg-emerald-700 text-white flex items-center justify-center text-3xl shadow-lg"><i class="fa-solid fa-calculator"></i></div><h1 class="text-2xl font-black mt-4">الروائع ERP</h1><p class="text-sm text-slate-500 mt-1">Accountant Control Center</p></div><div class="space-y-3"><input id="loginEmail" type="email" class="field" placeholder="البريد الإلكتروني"><div class="relative"><input id="loginPass" type="password" class="field pl-12" placeholder="كلمة المرور"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-slate-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div><button class="btn w-full mt-4 bg-emerald-700 text-white p-3.5 rounded-xl font-black" onclick="App.doLogin()">دخول آمن</button><p id="loginMsg" class="hidden text-center text-sm font-bold text-red-600 mt-3"></p></div></div>
<div id="mainApp" class="hidden min-h-screen"><header class="sticky top-0 z-30 bg-white border-b shadow-sm"><div class="max-w-[1900px] mx-auto px-4 md:px-6 py-4 flex items-center justify-between gap-4"><div><div class="text-lg md:text-xl font-black">💰 المحاسب — مركز التحكم المالي</div><div class="text-xs muted" id="companyLabel">—</div></div><div class="flex items-center gap-3"><div class="hidden md:block text-right"><div id="headerUserName" class="text-sm font-black">—</div><div id="headerUserRole" class="text-xs muted">—</div></div><button class="btn px-3 py-2 rounded-lg bg-slate-100 font-bold text-sm" onclick="App.refresh()"><i class="fa-solid fa-rotate"></i> تحديث</button><button class="btn px-3 py-2 rounded-lg bg-red-50 text-red-700 font-bold text-sm" onclick="App.doLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button></div></div></header><div class="bg-white border-b overflow-x-auto"><div class="max-w-[1900px] mx-auto px-3 md:px-6 py-2 flex gap-2" id="nav"></div></div><main class="max-w-[1900px] mx-auto p-4 md:p-6"><div id="mainContent"></div></main></div>
<script>
var App={
currentTab:'dashboard',user:null,companyId:null,context:null,
uid:function(){return(window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'op-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);},
dates:function(){var d=new Date(),to=d.toISOString().slice(0,10),from=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);return{from:from,to:to};},
money:function(n){return(Number(n)||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';},
num:function(n){return(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2});},
esc:function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});},
togglePass:function(){var p=document.getElementById('loginPass'),i=document.getElementById('passIcon');if(!p||!i)return;if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}else{p.type='password';i.className='fa-solid fa-eye';}},
authFail:function(msg){var x=document.getElementById('loginMsg');if(x){x.innerText=msg||'تعذر الدخول';x.classList.remove('hidden');}if(window.RW_UI&&RW_UI.showError)RW_UI.showError(msg||'تعذر الدخول');},
init:function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err!=='NO_SESSION')s.authFail(err||'جلسة غير صالحة');return;}var perms=Array.isArray(user.permissions)?user.permissions:[];if(!(!!user.isOwner||perms.indexOf('*')!==-1||perms.indexOf('finance')!==-1)){s.authFail('غير مصرح لهذا الدور');return;}s.user=user;s.loadContext().then(function(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');s.setupNav();s.render();}).catch(function(e){s.authFail(e.message||'تعذر تحميل السياق المالي');});});},
doLogin:function(){var s=this,e=String(document.getElementById('loginEmail').value||'').trim(),p=String(document.getElementById('loginPass').value||'').trim();if(!e||!p){s.authFail('أدخل البريد وكلمة المرور');return;}RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(user,err){RW_UI.hideLoader();if(err){s.authFail(err);return;}s.init();});},
doLogout:function(){RW_Auth.doLogout(function(){location.reload();});},
loadContext:function(){var s=this;return supabase.auth.getUser().then(function(ar){if(ar.error||!ar.data||!ar.data.user)throw new Error('INVALID_SESSION');return supabase.from('users').select('id,company_id,status,name').eq('auth_id',ar.data.user.id).maybeSingle();}).then(function(ur){if(ur.error||!ur.data||!ur.data.company_id||(ur.data.status&&ur.data.status!=='Active'))throw new Error('INVALID_COMPANY_CONTEXT');s.companyId=ur.data.company_id;document.getElementById('companyLabel').innerText='Company: '+s.companyId;document.getElementById('headerUserName').innerText=s.user.name||s.user.email||'—';document.getElementById('headerUserRole').innerText=s.user.isOwner?'OWNER':(s.user.role||'Finance');return Promise.all([supabase.from('treasury').select('id,account_code,account_name,current_balance,is_active').eq('company_id',s.companyId).eq('is_active',true).order('account_code'),supabase.from('chart_of_accounts').select('id,account_code,account_name,account_type,normal_balance,is_active').eq('company_id',s.companyId).eq('is_active',true).order('account_code')]);}).then(function(r){if(r[0].error)throw r[0].error;if(!r[0].data||!r[0].data.length)throw new Error('RECEIPT_TREASURY_MAPPING_REQUIRED');if(r[1].error)throw r[1].error;if(!r[1].data||!r[1].data.length)throw new Error('NO_ACTIVE_ACCOUNTS_AVAILABLE');var cash=r[1].data.filter(function(a){return a.account_code==='121';})[0]||null;if(!cash)throw new Error('CASH_ACCOUNT_121_NOT_CONFIGURED');s.context={treasuries:r[0].data,accounts:r[1].data,cashAccounts:r[1].data.filter(function(a){return a.account_type==='Asset'&&a.normal_balance==='Debit';}),cashAccount:cash};return s.context;});},
refresh:function(){var s=this;RW_UI.showLoader('جاري تحديث المركز المالي...');this.loadContext().then(function(){s.render();}).catch(function(e){RW_UI.showError(e.message||'فشل التحديث');}).finally(function(){RW_UI.hideLoader();});},
setupNav:function(){var s=this,items=[['dashboard','النظرة المالية','fa-gauge-high'],['receipts','القبض','fa-arrow-down'],['payments','الصرف','fa-arrow-up'],['journal','القيود','fa-book-open'],['reports','التقارير','fa-chart-column'],['operations','العمليات','fa-route'],['partners','الذمم','fa-users'],['inventory','المخزون','fa-boxes-stacked'],['gl','G/L & دليل الحسابات','fa-sitemap'],['reconciliation','المطابقة والرقابة','fa-scale-balanced'],['audit','المراجعة والأثر','fa-shield-halved']];var n='';items.forEach(function(x){n+='<button class="nav-btn '+(x[0]===s.currentTab?'active':'text-slate-600')+' px-4 py-2 rounded-xl font-black text-sm" onclick="App.switchTab(\''+x[0]+'\')"><i class="fa-solid '+x[2]+' ml-1"></i>'+x[1]+'</button>';});document.getElementById('nav').innerHTML=n;},
switchTab:function(t){this.currentTab=t;this.setupNav();this.render();},
render:function(){var m=document.getElementById('mainContent');m.innerHTML='<div class="panel p-10 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><div class="mt-3 font-bold">جاري التحميل...</div></div>';var fn={dashboard:'renderDashboard',receipts:'renderReceipts',payments:'renderPayments',journal:'renderJournal',reports:'renderReports',operations:'renderOperations',partners:'renderPartners',inventory:'renderInventory',gl:'renderGL',reconciliation:'renderReconciliation',audit:'renderAudit'}[this.currentTab]||'renderDashboard';this[fn]();},
kpi:function(t,v,s,c){return'<div class="kpi"><div class="text-xs muted font-bold">'+this.esc(t)+'</div><div class="metric-big mt-2 '+(c||'')+'">'+v+'</div><div class="text-[11px] muted mt-1">'+this.esc(s||'')+'</div></div>';},
table:function(rows,cols,opts){rows=rows||[];if(!rows.length)return'<div class="empty">لا توجد بيانات</div>';var h='<div class="table-wrap"><table class="w-full text-sm"><thead><tr class="sticky-head">';cols.forEach(function(c){h+='<th class="text-right p-3 border-b font-black">'+App.esc(c)+'</th>';});h+='</tr></thead><tbody>';rows.forEach(function(r){h+='<tr class="border-b hover:bg-slate-50">';cols.forEach(function(c){var v=r[c];if(c==='debit'||c==='credit'||c==='amount'||c.indexOf('value')!==-1||c.indexOf('balance')!==-1||c==='outstanding'||c==='difference'){v=App.money(v);}h+='<td class="p-3">'+App.esc(v)+'</td>';});h+='</tr>';});return h+'</tbody></table></div>';},
filters:function(id,extra){var d=this.dates();return'<div class="panel p-4 mb-4"><div class="grid md:grid-cols-4 gap-3 items-end"><div><label class="text-xs font-black">من</label><input id="'+id+'From" type="date" class="field" value="'+d.from+'"></div><div><label class="text-xs font-black">إلى</label><input id="'+id+'To" type="date" class="field" value="'+d.to+'"></div>'+(extra||'')+'<button class="btn bg-slate-900 text-white px-4 py-2 rounded-xl font-black" onclick="App.applyFilters(\''+id+'\')"><i class="fa-solid fa-filter"></i> تطبيق</button></div></div>';},
applyFilters:function(id){var f=document.getElementById(id+'From').value,t=document.getElementById(id+'To').value;if(!f||!t||f>t){RW_UI.showError('نطاق التاريخ غير صالح');return;}if(id==='cashReceipt'||id==='cashPayment')this.renderCashBox(id==='cashReceipt'?'Receipt':'Payment',f,t);if(id==='operations')this.renderOperations(f,t);if(id==='audit')this.renderAudit(f,t);},
renderDashboard:function(){var s=this,d=this.dates();Promise.all([supabase.from('treasury').select('current_balance').eq('company_id',s.companyId).eq('is_active',true),supabase.from('cash_box').select('type,amount').eq('company_id',s.companyId).gte('voucher_date',d.from).lte('voucher_date',d.to),supabase.from('journal_entries').select('id,entry_code,entry_date,status').eq('company_id',s.companyId).eq('status','Posted').order('entry_date',{ascending:false}).limit(100),supabase.rpc('accountant_reconciliation_summary',{p_as_of_date:d.to}),supabase.rpc('accountant_period_readiness',{p_from_date:d.from,p_to_date:d.to}),supabase.rpc('accountant_exception_center',{p_as_of_date:d.to})]).then(function(r){for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;var cash=0,rec=0,pay=0;(r[0].data||[]).forEach(function(x){cash+=Number(x.current_balance)||0;});(r[1].data||[]).forEach(function(x){if(x.type==='Receipt')rec+=Number(x.amount)||0;if(x.type==='Payment')pay+=Number(x.amount)||0;});var ex=r[5].data||[],read=r[4].data||[],recon=r[3].data||[],pending=0;try{Object.keys(sessionStorage).forEach(function(k){if(k.indexOf('rw_cash_pending_'+s.companyId+'_')===0)pending++;});}catch(e){}var h='<div class="grid grid-cols-2 lg:grid-cols-6 gap-4">';h+=s.kpi('الخزائن',s.money(cash),'الرصيد الدفتري الحالي');h+=s.kpi('مقبوضات الفترة',s.money(rec),'cash_box','ok');h+=s.kpi('مدفوعات الفترة',s.money(pay),'cash_box');h+=s.kpi('صافي الحركة',s.money(rec-pay),'قبض − صرف');h+=s.kpi('القيود المنشورة',s.num((r[2].data||[]).length),'آخر 100');h+=s.kpi('استثناءات',s.num(ex.length),ex.length?'تحتاج مراجعة':'لا توجد',ex.length?'danger':'ok');h+='</div>'+(pending?'<div class="panel p-4 mt-5 border-amber-300 bg-amber-50"><div class="font-black text-amber-900">هناك عملية قبض/صرف محفوظة لإعادة المحاولة بنفس الهوية.</div><div class="text-xs text-amber-800 mt-1">لن يتم إنشاء حركة ثانية؛ سيتم استخدام نفس Operation ID.</div><div class="flex gap-2 mt-3"><button class="btn bg-white border px-3 py-2 rounded-lg font-bold" onclick="App.retryPending(\'Receipt\')">إعادة القبض</button><button class="btn bg-white border px-3 py-2 rounded-lg font-bold" onclick="App.retryPending(\'Payment\')">إعادة الصرف</button></div></div>':'')+'<div class="grid lg:grid-cols-3 gap-4 mt-5"><div class="panel p-5 lg:col-span-2"><div class="flex justify-between items-center"><div><h2 class="font-black text-lg">Financial Health</h2><p class="text-xs muted">قراءة رقابية من الـRead Models الحالية</p></div><button class="btn bg-slate-100 px-3 py-2 rounded-lg font-bold text-xs" onclick="App.switchTab(\'reconciliation\')">فتح المطابقة</button></div><div class="grid md:grid-cols-2 gap-3 mt-4">';recon.forEach(function(x){var c=x.status==='OK'?'pill-ok':x.status==='EXCEPTION'?'pill-danger':'pill-warn';h+='<div class="border rounded-xl p-4"><div class="flex justify-between"><span class="font-black text-sm">'+s.esc(x.check_code)+'</span><span class="pill '+c+'">'+s.esc(x.status)+'</span></div><div class="mt-2 font-black">'+s.money(x.difference)+'</div><div class="text-xs muted mt-1">'+s.esc(x.detail)+'</div></div>';});h+='</div></div><div class="panel p-5"><h2 class="font-black text-lg">Period Readiness</h2><div class="space-y-2 mt-4">';read.forEach(function(x){var c=x.status==='PASS'?'pill-ok':x.status==='FAIL'?'pill-danger':'pill-warn';h+='<div class="flex justify-between gap-2 border-b pb-2"><div><div class="font-bold text-sm">'+s.esc(x.gate_code)+'</div><div class="text-[11px] muted">'+s.esc(x.detail)+'</div></div><span class="pill '+c+'">'+s.esc(x.status)+'</span></div>';});h+='</div></div></div><div class="panel p-5 mt-5"><div class="flex justify-between items-center"><h2 class="font-black text-lg">الاستثناءات المفتوحة</h2><span class="pill '+(ex.length?'pill-danger':'pill-ok')+'">'+s.num(ex.length)+'</span></div>'+s.table(ex.slice(0,50),['exception_type','severity','record_key','description','amount','detected_at'])+'</div>';document.getElementById('mainContent').innerHTML=h;}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل لوحة التحكم');});},
renderReceipts:function(){this.renderCashBox('Receipt',this.dates().from,this.dates().to);},
renderPayments:function(){this.renderCashBox('Payment',this.dates().from,this.dates().to);},
renderCashBox:function(type,from,to){var s=this,id=type==='Receipt'?'cashReceipt':'cashPayment';var pending='';try{pending=sessionStorage.getItem('rw_cash_pending_'+s.companyId+'_'+type)||'';}catch(e){}supabase.from('cash_box').select('voucher_code,voucher_date,type,amount,reference,treasury_id,user_email,created_at').eq('company_id',s.companyId).eq('type',type).gte('voucher_date',from).lte('voucher_date',to).order('created_at',{ascending:false}).limit(500).then(function(r){if(r.error)throw r.error;var h='<div class="flex items-center justify-between mb-4"><div><h2 class="font-black text-xl">'+(type==='Receipt'?'سندات القبض':'سندات الصرف')+'</h2><p class="text-xs muted">'+s.esc(from)+' → '+s.esc(to)+'</p></div><button class="btn '+(type==='Receipt'?'bg-emerald-700':'bg-red-600')+' text-white px-4 py-2 rounded-lg font-black" onclick="App.cashVoucher(\''+type+'\')">+ سند</button></div>'+s.filters(id)+((pending)?'<div class="panel p-4 mb-4 border-amber-300 bg-amber-50"><span class="font-black">عملية معلقة محفوظة.</span> <button class="underline font-black mr-2" onclick="App.retryPending(\''+type+'\')">إعادة المحاولة</button></div>':'')+'<div class="panel p-5">'+s.table(r.data||[],['voucher_code','voucher_date','type','amount','reference','treasury_id','user_email','created_at'])+'</div>';document.getElementById('mainContent').innerHTML=h;}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل السندات');});},
createPending:function(type,body){var key='rw_cash_pending_'+this.companyId+'_'+type;try{sessionStorage.setItem(key,JSON.stringify(body));}catch(e){}},
clearPending:function(type){try{sessionStorage.removeItem('rw_cash_pending_'+this.companyId+'_'+type);}catch(e){}},
retryPending:function(type){var s=this,key='rw_cash_pending_'+s.companyId+'_'+type,body=null;try{body=JSON.parse(sessionStorage.getItem(key)||'null');}catch(e){}if(!body)return RW_UI.showError('لا توجد عملية محفوظة لهذا النوع');s.sendCashOperation(type,body);},
sendCashOperation:function(type,body){var s=this;RW_UI.showLoader('جاري تنفيذ '+(type==='Receipt'?'سند القبض':'سند الصرف')+'...');RW_API.callWithRetry(type==='Receipt'?'save-receipt-voucher':'save-payment-voucher',body,2,function(payload,err){RW_UI.hideLoader();if(err||!payload||payload.success===false){RW_UI.showError((payload&&payload.msg)||err||'فشل تنفيذ العملية. تم الاحتفاظ بها لإعادة المحاولة بنفس الهوية.');return;}s.clearPending(type);RW_UI.toast(payload.duplicate?'تم تأكيد العملية السابقة دون تكرار الحركة':'تم الحفظ بنجاح','success');s.renderCashBox(type,s.dates().from,s.dates().to);});},
cashVoucher:function(type){var s=this,ctx=this.context;if(!ctx)return RW_UI.showError('السياق المالي غير جاهز');var treasuryOpts='';ctx.treasuries.forEach(function(t){treasuryOpts+='<option value="'+s.esc(t.id)+'">'+s.esc(t.account_code)+' — '+s.esc(t.account_name)+' — '+s.money(t.current_balance)+'</option>';});var opts='<option value="">اختر الحساب المقابل</option>';ctx.accounts.filter(function(a){return a.is_active&&a.id!==ctx.cashAccount.id;}).forEach(function(a){opts+='<option value="'+s.esc(a.id)+'">'+s.esc(a.account_code)+' — '+s.esc(a.account_name)+'</option>';});var title=type==='Receipt'?'سند قبض جديد':'سند صرف جديد';Swal.fire({title:title,width:720,html:'<div class="text-right"><label class="text-xs font-black">الخزينة</label><select id="cvTreasury" class="swal2-select" style="width:90%">'+treasuryOpts+'</select><label class="text-xs font-black">التاريخ</label><input id="cvDate" type="date" class="swal2-input" value="'+new Date().toISOString().slice(0,10)+'"><label class="text-xs font-black">المبلغ</label><input id="cvAmt" type="number" min="0.01" step="0.01" class="swal2-input" placeholder="المبلغ"><label class="text-xs font-black">الحساب المقابل</label><select id="cvAccount" class="swal2-select" style="width:90%">'+opts+'</select><label class="text-xs font-black">المرجع</label><input id="cvRef" class="swal2-input" placeholder="مرجع السند"><label class="text-xs font-black">الملاحظات</label><textarea id="cvNotes" class="swal2-textarea" placeholder="الوصف / الملاحظات"></textarea></div>',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',allowOutsideClick:false,preConfirm:function(){var amount=Number(document.getElementById('cvAmt').value),accountId=String(document.getElementById('cvAccount').value||''),treasuryId=String(document.getElementById('cvTreasury').value||''),date=String(document.getElementById('cvDate').value||''),ref=String(document.getElementById('cvRef').value||'').trim(),notes=String(document.getElementById('cvNotes').valu renderJournal:function(){var s=this,d=this.dates();supabase.from('journal_entries').select('id,entry_code,entry_date,reference,description,entry_type,status,created_by,posting_date').eq('company_id',s.companyId).order('created_at',{ascending:false}).limit(500).then(function(r){if(r.error)throw r.error;return Promise.all([Promise.resolve(r.data||[]),supabase.from('journal_lines').select('entry_id,account_id,account_name,debit,credit,notes').in('entry_id',(r.data||[]).map(function(x){return x.id;}))]);}).then(function(x){var entries=x[0],lines=x[1].data||[],by={};lines.forEach(function(l){(by[l.entry_id]||(by[l.entry_id]=[])).push(l);});var bad=entries.filter(function(e){return e.status==='Posted'&&!by[e.id];});var h='<div class="flex justify-between items-center mb-4"><div><h2 class="font-black text-xl">القيود اليومية</h2><p class="text-xs muted">كل Journal Entry يتطلب خطوطًا متوازنة في الـCore.</p></div><span class="pill '+(bad.length?'pill-danger':'pill-ok')+'">Zero-line Posted: '+s.num(bad.length)+'</span></div><div class="panel p-5">';entries.forEach(function(e){h+='<div class="border rounded-xl p-4 mb-3"><div class="flex justify-between gap-3"><div><div class="font-black">'+s.esc(e.entry_code)+' — '+s.esc(e.entry_type)+'</div><div class="text-xs muted">'+s.esc(e.entry_date)+' · '+s.esc(e.reference||'')+'</div></div><span class="pill '+(e.status==='Posted'?'pill-ok':'pill-warn')+'">'+s.esc(e.status)+'</span></div><div class="mt-3 text-sm">'+s.esc(e.description||'')+'</div>'+s.table(by[e.id]||[],['account_name','debit','credit','notes'])+'</div>';});h+='</div>';document.getElementById('mainContent').innerHTML=h;}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل القيود');});},
