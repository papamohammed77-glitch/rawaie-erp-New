<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المحاسب | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <script>var supabase = window.supabase;</script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9}
        .auth-container{background:linear-gradient(135deg,#064e3b 0%,#047857 40%,#059669 100%)}
        .input-field:focus{border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,0.1)}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
        .stat-card{background:#fff;border-radius:16px;padding:1rem;box-shadow:0 4px 6px rgba(0,0,0,0.02)}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-emerald-600 to-emerald-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4"><i class="fa-solid fa-coins text-white text-3xl"></i></div><h1 class="font-black text-2xl text-gray-800">الروائع</h1><p class="text-xs text-gray-400">المحاسب</p></div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول</h2>
        <div class="space-y-3"><div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-emerald-600 outline-none font-bold text-sm"></div><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-emerald-600 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<div id="mainApp" class="hidden flex flex-col h-full">
    <header class="bg-emerald-700 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0">
        <span class="font-black text-sm">💰 المحاسب</span>
        <div class="flex items-center gap-2"><span class="text-xs font-bold" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div class="flex gap-1 p-2 bg-white border-b overflow-x-auto flex-shrink-0">
        <button onclick="App.switchTab('dashboard')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm bg-emerald-600 text-white" id="tab-dashboard">📊 KPI</button>
        <button onclick="App.switchTab('receipts')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-receipts">📥 سندات قبض</button>
        <button onclick="App.switchTab('payments')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-payments">📤 سندات صرف</button>
        <button onclick="App.switchTab('journal')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-journal">📒 قيود</button>
    </div>
    <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>
</div>

<script>
var db = new Dexie('RW_Accountant'); db.version(1).stores({ meta: 'key' });

var App = {
    currentUser: null, currentTab: 'dashboard',
    togglePass: function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}else{p.type='password';i.className='fa-solid fa-eye';}},
    doLogin: function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}RW_UI.byId('loginMsg').classList.add('hidden');var s=this;RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(user,err){RW_UI.hideLoader();if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}else{s.init();}});},
    init: function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة');return;}var isO=user.isOwner,perms=user.permissions,has=isO||(Array.isArray(perms)&&perms.indexOf('finance')!==-1);if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return;}RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);s.currentUser=user;s.enterApp();});},
    enterApp: function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');this.switchTab('dashboard');},
    doLogout: function(){var s=this;RW_Auth.doLogout(function(){RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('loginScreen').classList.remove('hidden');});},
    switchTab: function(t){this.currentTab=t;['dashboard','receipts','payments','journal'].forEach(function(x){var b=RW_UI.byId('tab-'+x);if(b){b.classList.remove('bg-emerald-600','text-white');b.classList.add('text-gray-500');}});var a=RW_UI.byId('tab-'+t);if(a){a.classList.add('bg-emerald-600','text-white');a.classList.remove('text-gray-500');}if(t==='dashboard')this.renderDashboard();else if(t==='receipts')this.renderReceipts();else if(t==='payments')this.renderPayments();else if(t==='journal')this.renderJournal();},

    renderDashboard: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin"></i></div>');
        var today=new Date().toISOString().split('T')[0],firstDay=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().split('T')[0];
        Promise.all([supabase.from('treasury').select('current_balance'),supabase.from('cash_box').select('amount,type').gte('voucher_date',firstDay).lte('voucher_date',today),supabase.from('customers').select('debt')]).then(function(r){
            var treasury=r[0].data||[],cash=r[1].data||[],customers=r[2].data||[];
            var totalTreasury=0;for(var i=0;i<treasury.length;i++)totalTreasury+=Number(treasury[i].current_balance)||0;
            var receipts=0,payments=0;for(var j=0;j<cash.length;j++){if(cash[j].type==='Receipt')receipts+=Number(cash[j].amount)||0;else payments+=Number(cash[j].amount)||0;}
            var totalDebt=0;for(var k=0;k<customers.length;k++)totalDebt+=Number(customers[k].debt)||0;
            var html='<h2 class="text-lg font-black mb-4">💰 المؤشرات المالية</h2>';
            html+='<div class="grid grid-cols-2 gap-3">';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">رصيد الخزائن</p><p class="text-2xl font-black text-emerald-600">'+fmtNum(totalTreasury)+' ج.م</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">مقبوضات الشهر</p><p class="text-2xl font-black text-green-600">'+fmtNum(receipts)+' ج.م</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">مدفوعات الشهر</p><p class="text-2xl font-black text-red-600">'+fmtNum(payments)+' ج.م</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">ذمم العملاء</p><p class="text-2xl font-black text-amber-600">'+fmtNum(totalDebt)+' ج.م</p></div>';
            html+='</div>';RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
        });
    },

    renderReceipts: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin"></i></div>');
        supabase.from('cash_box').select('*').eq('type','Receipt').order('voucher_date',{ascending:false}).limit(30).then(function(r){var data=r.data||[],html='<h2 class="text-lg font-black mb-4">📥 سندات القبض</h2><button onclick="App.newReceipt()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black mb-4">➕ سند قبض جديد</button>';
        for(var i=0;i<data.length;i++){html+='<div class="card mb-2"><div class="flex justify-between"><span class="font-bold">'+data[i].voucher_date+'</span><span class="font-black text-green-600">'+fmtNum(data[i].amount)+' ج.م</span></div><p class="text-xs text-gray-400">'+data[i].treasury_id+' | '+data[i].reference+'</p></div>';}
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);});
    },

newReceipt: function () {
    var s = this;

    function getOperationId(storageKey, payloadFingerprint) {
        try {
            var raw = sessionStorage.getItem(storageKey);

            if (raw) {
                var pending = JSON.parse(raw);

                if (
                    pending &&
                    pending.fingerprint === payloadFingerprint &&
                    pending.operationId &&
                    pending.createdAt &&
                    (Date.now() - pending.createdAt) < 15 * 60 * 1000
                ) {
                    return pending.operationId;
                }
            }
        } catch (e) {}

        var operationId =
            window.crypto &&
            typeof window.crypto.randomUUID === 'function'
                ? window.crypto.randomUUID()
                : (
                    'RCV-' +
                    Date.now() +
                    '-' +
                    Math.random().toString(36).slice(2, 10)
                );

        try {
            sessionStorage.setItem(
                storageKey,
                JSON.stringify({
                    operationId: operationId,
                    fingerprint: payloadFingerprint,
                    createdAt: Date.now()
                })
            );
        } catch (e) {}

        return operationId;
    }

    function clearPending(storageKey) {
        try {
            sessionStorage.removeItem(storageKey);
        } catch (e) {}
    }

    Swal.fire({
        title: 'جاري تحميل السياق المالي...',
        allowOutsideClick: false,
        allowEscapeKey: false,
        didOpen: function () {
            Swal.showLoading();
        }
    });

    supabase.auth.getUser()

        .then(function (authResult) {
            if (
                authResult.error ||
                !authResult.data ||
                !authResult.data.user
            ) {
                throw new Error('INVALID_SESSION');
            }

            return supabase
                .from('users')
                .select('company_id,status')
                .eq('auth_id', authResult.data.user.id)
                .maybeSingle()
                .then(function (userResult) {
                    if (
                        userResult.error ||
                        !userResult.data ||
                        !userResult.data.company_id ||
                        (
                            userResult.data.status &&
                            userResult.data.status !== 'Active'
                        )
                    ) {
                        throw new Error('INVALID_COMPANY_CONTEXT');
                    }

                    return {
                        user: authResult.data.user,
                        companyId: userResult.data.company_id
                    };
                });
        })

        .then(function (ctx) {

            return Promise.all([

                supabase
                    .from('treasury')
                    .select(
                        'id,account_code,account_name,current_balance,is_active'
                    )
                    .eq('company_id', ctx.companyId)
                    .eq('is_active', true),

                supabase
                    .from('chart_of_accounts')
                    .select(
                        'id,account_code,account_name,account_type,normal_balance,is_active'
                    )
                    .eq('company_id', ctx.companyId)
                    .eq('account_code', '121')
                    .eq('is_active', true)
                    .maybeSingle(),

                supabase
                    .from('chart_of_accounts')
                    .select(
                        'id,account_code,account_name,account_type,normal_balance,is_active'
                    )
                    .eq('company_id', ctx.companyId)
                    .eq('is_active', true)
                    .neq('account_code', '121')
                    .order('account_code', {
                        ascending: true
                    })
            ])

            .then(function (results) {

                var treasuryResult = results[0];
                var cashAccountResult = results[1];
                var offsetAccountsResult = results[2];

                if (treasuryResult.error) {
                    throw treasuryResult.error;
                }

                if (
                    !treasuryResult.data ||
                    treasuryResult.data.length !== 1
                ) {
                    throw new Error(
                        'RECEIPT_TREASURY_MAPPING_REQUIRED'
                    );
                }

                if (cashAccountResult.error) {
                    throw cashAccountResult.error;
                }

                if (
                    !cashAccountResult.data ||
                    !cashAccountResult.data.id
                ) {
                    throw new Error(
                        'CASH_ACCOUNT_121_NOT_CONFIGURED'
                    );
                }

                if (offsetAccountsResult.error) {
                    throw offsetAccountsResult.error;
                }

                var accounts =
                    offsetAccountsResult.data || [];

                if (!accounts.length) {
                    throw new Error(
                        'NO_ACTIVE_OFFSET_ACCOUNTS_AVAILABLE'
                    );
                }

                return {
                    user: ctx.user,
                    companyId: ctx.companyId,
                    treasury: treasuryResult.data[0],
                    cashAccount: cashAccountResult.data,
                    offsetAccounts: accounts
                };
            });
        })

        .then(function (ctx) {

            var offsetSelect =
                '<option value="">اختر الحساب المقابل</option>';

            var container = document.createElement('div');

            for (
                var i = 0;
                i < ctx.offsetAccounts.length;
                i++
            ) {
                var account = ctx.offsetAccounts[i];

                offsetSelect +=
                    '<option value="' +
                    String(account.id).replace(
                        /"/g,
                        '&quot;'
                    ) +
                    '">' +
                    String(account.account_code || '') +
                    ' — ' +
                    String(account.account_name || '') +
                    '</option>';
            }

            Swal.fire({

                title: 'سند قبض جديد',

                html:
                    '<div style="text-align:right">' +

                        '<label style="display:block;margin:0 0 6px;font-weight:700">' +
                            'المبلغ' +
                        '</label>' +

                        '<input ' +
                            'id="rcptAmt" ' +
                            'class="swal2-input" ' +
                            'type="number" ' +
                            'min="0.01" ' +
                            'step="0.01" ' +
                            'placeholder="المبلغ">' +

                        '<label style="display:block;margin:10px 0 6px;font-weight:700">' +
                            'الحساب المقابل' +
                        '</label>' +

                        '<select ' +
                            'id="rcptOffsetAccount" ' +
                            'class="swal2-select" ' +
                            'style="width:90%;margin:0 auto 10px auto">' +
                            offsetSelect +
                        '</select>' +

                        '<label style="display:block;margin:10px 0 6px;font-weight:700">' +
                            'المرجع' +
                        '</label>' +

                        '<input ' +
                            'id="rcptRef" ' +
                            'class="swal2-input" ' +
                            'placeholder="مرجع السند">' +

                        '<label style="display:block;margin:10px 0 6px;font-weight:700">' +
                            'ملاحظات' +
                        '</label>' +

                        '<textarea ' +
                            'id="rcptNotes" ' +
                            'class="swal2-textarea" ' +
                            'placeholder="ملاحظات اختيارية">' +
                        '</textarea>' +

                    '</div>',

                showCancelButton: true,
                confirmButtonText: 'حفظ سند القبض',
                cancelButtonText: 'إلغاء',
                allowOutsideClick: false,

                preConfirm: function () {

                    var amount = Number(
                        document.getElementById('rcptAmt').value
                    );

                    var offsetAccountId = String(
                        document.getElementById(
                            'rcptOffsetAccount'
                        ).value || ''
                    ).trim();

                    var reference = String(
                        document.getElementById('rcptRef').value || ''
                    ).trim();

                    var notes = String(
                        document.getElementById('rcptNotes').value || ''
                    ).trim();

                    if (
                        !Number.isFinite(amount) ||
                        amount <= 0
                    ) {
                        Swal.showValidationMessage(
                            'أدخل مبلغ قبض صحيح أكبر من صفر'
                        );
                        return false;
                    }

                    if (!offsetAccountId) {
                        Swal.showValidationMessage(
                            'يجب اختيار الحساب المقابل'
                        );
                        return false;
                    }

                    return {
                        amount: amount,
                        offsetAccountId: offsetAccountId,
                        reference: reference,
                        notes: notes
                    };
                }

            })

            .then(function (result) {

                if (
                    !result.isConfirmed ||
                    !result.value
                ) {
                    return;
                }

                var payload = result.value;

                var fingerprint = JSON.stringify({
                    amount: payload.amount,
                    offsetAccountId: payload.offsetAccountId,
                    reference: payload.reference,
                    notes: payload.notes
                });

                var storageKey =
                    'RW_ACCOUNTANT_PENDING_RECEIPT';

                var operationId =
                    getOperationId(
                        storageKey,
                        fingerprint
                    );

                RW_UI.showLoader(
                    'جاري حفظ سند القبض...'
                );

                return supabase.functions.invoke(
                    'save-receipt-voucher',
                    {
                        body: {

                            header: {
                                operationId: operationId,

                                treasuryId:
                                    ctx.treasury.id,

                                cashAccountId:
                                    ctx.cashAccount.id,

                                offsetAccountId:
                                    payload.offsetAccountId,

                                date:
                                    new Date()
                                        .toISOString()
                                        .slice(0, 10),

                                reference:
                                    payload.reference || null,

                                notes:
                                    payload.notes || null,

                                voucherCode:
                                    null
                            },

                            lines: [
                                {
                                    accountId:
                                        payload.offsetAccountId,

                                    amount:
                                        payload.amount,

                                    description:
                                        payload.reference ||
                                        'سند قبض'
                                }
                            ]
                        }
                    }
                )

                .then(function (response) {

                    RW_UI.hideLoader();

                    if (response.error) {
                        throw response.error;
                    }

                    var data =
                        response.data || {};

                    if (data.success === false) {
                        throw new Error(
                            data.error ||
                            data.msg ||
                            'فشل حفظ سند القبض'
                        );
                    }

                    clearPending(storageKey);

                    RW_UI.toast(
                        data.duplicate
                            ? 'العملية موجودة بالفعل ولم تتم إضافة حركة ثانية'
                            : 'تم حفظ سند القبض بنجاح',
                        'success'
                    );

                    s.renderReceipts();
                })

                .catch(function (error) {

                    RW_UI.hideLoader();

                    /*
                     * لا نحذف operationId هنا.
                     * يبقى في sessionStorage ليُستخدم في retry
                     * لنفس العملية، ويمنع إنشاء حركة مالية ثانية.
                     */
                    RW_UI.showError(
                        error && error.message
                            ? error.message
                            : 'تعذر حفظ سند القبض'
                    );
                });
            });
        });
}
    renderPayments: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin"></i></div>');
        supabase.from('cash_box').select('*').eq('type','Payment').order('voucher_date',{ascending:false}).limit(30).then(function(r){var data=r.data||[],html='<h2 class="text-lg font-black mb-4">📤 سندات الصرف</h2><button onclick="App.newPayment()" class="w-full bg-red-600 text-white py-3 rounded-xl font-black mb-4">➕ سند صرف جديد</button>';
        for(var i=0;i<data.length;i++){html+='<div class="card mb-2"><div class="flex justify-between"><span class="font-bold">'+data[i].voucher_date+'</span><span class="font-black text-red-600">'+fmtNum(data[i].amount)+' ج.م</span></div><p class="text-xs text-gray-400">'+data[i].treasury_id+' | '+data[i].reference+'</p></div>';}
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);});
    },

                        'id,account_code,account_name,current_balance,is_active'
                    )
                    .eq('company_id', ctx.companyId)
                    .eq('is_active', true),

                supabase
                    .from('chart_of_accounts')
                    .select(
                        'id,account_code,account_name,account_type,normal_balance,is_active'
                    )
                    .eq('company_id', ctx.companyId)
                    .eq('account_code', '121')
                    .eq('is_active', true)
                    .maybeSingle(),

                supabase
                    .from('chart_of_accounts')
                    .select(
                        'id,account_code,account_name,account_type,normal_balance,is_active'
                    )
                    .eq('company_id', ctx.companyId)
                    .eq('is_active', true)
                    .neq('account_code', '121')
                    .order('account_code', {
                        ascending: true
                    })
            ])

            .then(function (results) {

                var treasuryResult = results[0];
                var cashAccountResult = results[1];
                var offsetAccountsResult = results[2];

                if (treasuryResult.error) {
                    throw treasuryResult.error;
                }

                if (
                    !treasuryResult.data ||
                    treasuryResult.data.length !== 1
                ) {
                    throw new Error(
                        'PAYMENT_TREASURY_MAPPING_REQUIRED'
                    );
                }

                if (cashAccountResult.error) {
                    throw cashAccountResult.error;
                }

                if (
                    !cashAccountResult.data ||
                    !cashAccountResult.data.id
                ) {
                    throw new Error(
                        'CASH_ACCOUNT_121_NOT_CONFIGURED'
                    );
                }

                if (offsetAccountsResult.error) {
                    throw offsetAccountsResult.error;
                }

                var accounts =
                    offsetAccountsResult.data || [];

                if (!accounts.length) {
                    throw new Error(
                        'NO_ACTIVE_OFFSET_ACCOUNTS_AVAILABLE'
                    );
                }

                return {
                    user: ctx.user,
                    companyId: ctx.companyId,
                    treasury: treasuryResult.data[0],
                    cashAccount: cashAccountResult.data,
                    offsetAccounts: accounts
                };
            });
        })

        .then(function (ctx) {

            var offsetSelect =
                '<option value="">اختر الحساب المقابل</option>';

            for (
                var i = 0;
                i < ctx.offsetAccounts.length;
                i++
            ) {

                var account =
                    ctx.offsetAccounts[i];

                offsetSelect +=
                    '<option value="' +
                    String(account.id).replace(
                        /"/g,
                        '&quot;'
                    ) +
                    '">' +
                    String(account.account_code || '') +
                    ' — ' +
                    String(account.account_name || '') +
                    '</option>';
            }

            Swal.fire({

                title: 'سند صرف جديد',

                html:
                    '<div style="text-align:right">' +

                        '<label style="display:block;margin:0 0 6px;font-weight:700">' +
                            'المبلغ' +
                        '</label>' +

                        '<input ' +
                            'id="pmtAmt" ' +
                            'class="swal2-input" ' +
                            'type="number" ' +
                            'min="0.01" ' +
                            'step="0.01" ' +
                            'placeholder="المبلغ">' +

                        '<label style="display:block;margin:10px 0 6px;font-weight:700">' +
                            'الحساب المقابل' +
                        '</label>' +

                        '<select ' +
                            'id="pmtOffsetAccount" ' +
                            'class="swal2-select" ' +
                            'style="width:90%;margin:0 auto 10px auto">' +
                            offsetSelect +
                        '</select>' +

                        '<label style="display:block;margin:10px 0 6px;font-weight:700">' +
                            'المرجع' +
                        '</label>' +

                        '<input ' +
                            'id="pmtRef" ' +
                            'class="swal2-input" ' +
                            'placeholder="مرجع السند">' +

                        '<label style="display:block;margin:10px 0 6px;font-weight:700">' +
                            'ملاحظات' +
                        '</label>' +

                        '<textarea ' +
                            'id="pmtNotes" ' +
                            'class="swal2-textarea" ' +
                            'placeholder="ملاحظات اختيارية">' +
                        '</textarea>' +

                    '</div>',

                showCancelButton: true,
                confirmButtonText: 'حفظ سند الصرف',
                cancelButtonText: 'إلغاء',
                allowOutsideClick: false,

                preConfirm: function () {

                    var amount = Number(
                        document.getElementById(
                            'pmtAmt'
                        ).value
                    );

                    var offsetAccountId =
                        String(
                            document.getElementById(
                                'pmtOffsetAccount'
                            ).value || ''
                        ).trim();

                    var reference =
                        String(
                            document.getElementById(
                                'pmtRef'
                            ).value || ''
                        ).trim();

                    var notes =
                        String(
                            document.getElementById(
                                'pmtNotes'
                            ).value || ''
                        ).trim();

                    if (
                        !Number.isFinite(amount) ||
                        amount <= 0
                    ) {
                        Swal.showValidationMessage(
                            'أدخل مبلغ صرف صحيح أكبر من صفر'
                        );
                        return false;
                    }

                    if (!offsetAccountId) {
                        Swal.showValidationMessage(
                            'يجب اختيار الحساب المقابل'
                        );
                        return false;
                    }

                    return {
                        amount: amount,
                        offsetAccountId: offsetAccountId,
                        reference: reference,
                        notes: notes
                    };
                }

            })

            .then(function (result) {

                if (
                    !result.isConfirmed ||
                    !result.value
                ) {
                    return;
                }

                var payload =
                    result.value;

                var fingerprint =
                    JSON.stringify({
                        amount:
                            payload.amount,
                        offsetAccountId:
                            payload.offsetAccountId,
                        reference:
                            payload.reference,
                        notes:
                            payload.notes
                    });

                var storageKey =
                    'RW_ACCOUNTANT_PENDING_PAYMENT';

                var operationId =
                    getOperationId(
                        storageKey,
                        fingerprint
                    );

                RW_UI.showLoader(
                    'جاري حفظ سند الصرف...'
                );

                return supabase.functions.invoke(
                    'save-payment-voucher',
                    {
                        body: {

                            header: {
                                operationId:
                                    operationId,

                                treasuryId:
                                    ctx.treasury.id,

                                cashAccountId:
                                    ctx.cashAccount.id,

                                offsetAccountId:
                                    payload.offsetAccountId,

                                date:
                                    new Date()
                                        .toISOString()
                                        .slice(0, 10),

                                reference:
                                    payload.reference ||
                                    null,

                                notes:
                                    payload.notes ||
                                    null,

                                voucherCode:
                                    null
                            },

                            lines: [
                                {
                                    accountId:
                                        payload.offsetAccountId,

                                    amount:
                                        payload.amount,

                                    description:
                                        payload.reference ||
                                        'سند صرف'
                                }
                            ]
                        }
                    }
                )

                .then(function (response) {

                    RW_UI.hideLoader();

                    if (response.error) {
                        throw response.error;
                    }

                    var data =
                        response.data || {};

                    if (data.success === false) {
                        throw new Error(
                            data.error ||
                            data.msg ||
                            'فشل حفظ سند الصرف'
                        );
                    }

                    clearPending(storageKey);

                    RW_UI.toast(
                        data.duplicate
                            ? 'العملية موجودة بالفعل ولم تتم إضافة حركة ثانية'
                            : 'تم حفظ سند الصرف بنجاح',
                        'success'
                    );

                    s.renderPayments();
                })

                .catch(function (error) {

                    RW_UI.hideLoader();

                    /*
                     * الاحتفاظ بالـoperationId يسمح بإعادة المحاولة
                     * دون إنشاء حركة مالية ثانية.
                     */
                    RW_UI.showError(
                        error && error.message
                            ? error.message
                            : 'تعذر حفظ سند الصرف'
                    );
                });
            });
        });
}
    renderJournal: function(){
        RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10 text-gray-400"><i class="fa-solid fa-book text-4xl mb-3"></i><p>القيود اليومية – تُدار من النظام الأم</p><p class="text-sm mt-2">استخدم تطبيق المركز الرئيسي لإدارة القيود المحاسبية</p></div>');
    }
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
</script>
<script src="../register-sw.js"></script>
</body>
</html>
