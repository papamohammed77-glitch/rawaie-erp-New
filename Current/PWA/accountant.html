*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f3f6f9;color:#17202a}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.btn{transition:.18s}.btn:hover{transform:translateY(-1px)}.field{width:100%;padding:10px 12px;border:1px solid #dbe2ea;border-radius:10px;background:#fff;font-weight:700}.field:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.1)}.nav-btn{white-space:nowrap}.nav-btn.active{background:linear-gradient(135deg,#047857,#065f46);color:#fff;box-shadow:0 7px 18px rgba(4,120,87,.18)}.kpi{border:1px solid #e5e7eb;border-radius:18px;padding:18px;background:linear-gradient(180deg,#fff,#f8fafc)}.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.pill-ok{background:#dcfce7;color:#166534}.pill-warn{background:#fef3c7;color:#92400e}.pill-danger{background:#fee2e2;color:#991b1b}.pill-info{background:#dbeafe;color:#1d4ed8}.muted{color:#64748b}.metric-big{font-size:26px;font-weight:900}.empty{padding:40px;text-align:center;color:#64748b}.table-wrap{overflow:auto}.table-wrap table{min-width:900px}.sticky-head th{position:sticky;top:0;background:#f8fafc;z-index:2}.sync{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid #e2e8f0;border-radius:999px;background:#f8fafc;font-size:11px;font-weight:800;color:#475569}.dot{width:8px;height:8px;border-radius:999px;background:#10b981}.sync.offline .dot{background:#ef4444}.sync.busy .dot{background:#f59e0b}.section-title{font-size:19px;font-weight:900}.section-subtitle{font-size:12px;color:#64748b;margin-top:3px}

<script>
var App={currentTab:'dashboard',user:null,companyId:null,context:null,reportRows:[],renderToken:0,liveTimer:null,liveBusy:false,filters:{},
uid:function(){return crypto&&crypto.randomUUID?crypto.randomUUID():'op-'+Date.now()+'-'+Math.random().toString(36).slice(2,10)},
localDate:function(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
dates:function(){var d=new Date();return{from:this.localDate(new Date(d.getFullYear(),d.getMonth(),1)),to:this.localDate(d)}},
money:function(n){return(Number(n)||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'},num:function(n){return(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})},
esc:function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})},
current:function(t){return t===this.renderToken},setSync:function(state,text){var b=document.getElementById('sync'),x=document.getElementById('syncText');if(!b||!x)return;b.classList.toggle('offline',state==='offline');b.classList.toggle('busy',state==='busy');x.textContent=text||'مزامنة تلقائية'},
authFail:function(m){var x=document.getElementById('loginMsg');if(x){x.textContent=m||'تعذر الدخول';x.classList.remove('hidden')}if(window.RW_UI&&RW_UI.showError)RW_UI.showError(m||'تعذر الدخول')},
init:function(){var s=this;RW_Auth.init(function(u,e){if(e||!u){if(e!=='NO_SESSION')s.authFail(e||'جلسة غير صالحة');return}var p=Array.isArray(u.permissions)?u.permissions:[];if(!(u.isOwner||p.indexOf('*')!==-1||p.indexOf('finance')!==-1))return s.authFail('غير مصرح لهذا الدور');s.user=u;s.loadContext().then(function(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');s.setupNav();s.render();s.startLiveSync()}).catch(function(x){s.authFail(x.message)})})},
doLogin:function(){var s=this,e=String(document.getElementById('loginEmail').value||'').trim(),p=String(document.getElementById('loginPass').value||'').trim();if(!e||!p)return s.authFail('أدخل البريد وكلمة المرور');RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(u,x){RW_UI.hideLoader();if(x)return s.authFail(x);s.init()})},
doLogout:function(){this.stopLiveSync();RW_Auth.doLogout(function(){location.reload()})},togglePass:function(){var p=document.getElementById('loginPass'),i=document.getElementById('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash'}else{p.type='password';i.className='fa-solid fa-eye'}},
loadContext:function(){var s=this;return supabase.auth.getUser().then(function(a){if(a.error||!a.data.user)throw Error('INVALID_SESSION');return supabase.from('users').select('id,company_id,status,name').eq('auth_id',a.data.user.id).maybeSingle()}).then(function(r){if(r.error||!r.data||!r.data.company_id||r.data.status==='Inactive')throw Error('INVALID_COMPANY_CONTEXT');s.companyId=r.data.company_id;document.getElementById('companyLabel').textContent='Company: '+s.companyId;document.getElementById('headerUserName').textContent=s.user.name||s.user.email||'—';document.getElementById('headerUserRole').textContent=s.user.isOwner?'OWNER':(s.user.role||'Finance');return Promise.all([supabase.from('treasury').select('id,account_code,account_name,current_balance,is_active').eq('company_id',s.companyId).eq('is_active',true).order('account_code'),supabase.from('chart_of_accounts').select('id,account_code,account_name,account_type,normal_balance,is_active').eq('company_id',s.companyId).eq('is_active',true).order('account_code')])}).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;if(!r[0].data.length)throw Error('RECEIPT_TREASURY_MAPPING_REQUIRED');var cash=r[1].data.filter(function(a){return a.account_code==='121'})[0];if(!cash)throw Error('CASH_ACCOUNT_121_NOT_CONFIGURED');s.context={treasuries:r[0].data,accounts:r[1].data,cashAccount:cash};return s.context})},
refresh:function(){var s=this;RW_UI.showLoader('جاري تحديث المركز المالي...');this.loadContext().then(function(){s.setSync('online','تمت المزامنة — '+s.localDate());s.render()}).catch(function(e){s.setSync('offline','تعذر تحديث البيانات');RW_UI.showError(e.message)}).finally(function(){RW_UI.hideLoader()})},
startLiveSync:function(){var s=this;this.stopLiveSync();this.setSync(navigator.onLine?'online':'offline',navigator.onLine?'مزامنة تلقائية · كل 15 ثانية':'غير متصل');this.liveTimer=setInterval(function(){s.silentRefresh()},15000);window.addEventListener('online',function(){s.setSync('online','عاد الاتصال');s.silentRefresh()});window.addEventListener('offline',function(){s.setSync('offline','غير متصل')});document.addEventListener('visibilitychange',function(){if(!document.hidden)s.silentRefresh()})},
stopLiveSync:function(){if(this.liveTimer){clearInterval(this.liveTimer);this.liveTimer=null}},
silentRefresh:function(){var s=this;if(s.liveBusy||document.hidden||!navigator.onLine)return;if(window.Swal&&Swal.isVisible&&Swal.isVisible())return;var a=document.activeElement;if(a&&a.closest&&a.closest('#mainContent')&&['INPUT','TEXTAREA','SELECT'].indexOf(a.tagName)!==-1)return;var ok={dashboard:1,receipts:1,payments:1,journal:1,operations:1,partners:1,inventory:1,reconciliation:1,audit:1};if(!ok[s.currentTab])return;s.liveBusy=true;s.setSync('busy','جاري المزامنة...');s.loadContext().then(function(){s.setSync('online','مزامنة تلقائية · '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}));s.render(false)}).catch(function(){s.setSync('offline','تعذر تحديث البيانات')}).finally(function(){s.liveBusy=false})},
setupNav:function(){var s=this,a=[['dashboard','النظرة المالية','fa-gauge-high'],['receipts','القبض','fa-arrow-down'],['payments','الصرف','fa-arrow-up'],['journal','القيود','fa-book-open'],['reports','التقارير','fa-chart-column'],['operations','العمليات','fa-route'],['partners','الذمم','fa-users'],['inventory','المخزون','fa-boxes-stacked'],['gl','G/L ودليل الحسابات','fa-sitemap'],['reconciliation','المطابقة والرقابة','fa-scale-balanced'],['audit','المراجعة والأثر','fa-shield-halved']];document.getElementById('nav').innerHTML=a.map(function(x){return'<button class="nav-btn '+(x[0]===s.currentTab?'active':'text-slate-600')+' px-4 py-2 rounded-xl font-black text-sm" onclick="App.switchTab(\''+x[0]+'\')"><i class="fa-solid '+x[2]+' ml-1"></i>'+x[1]+'</button>'}).join('')},
switchTab:function(t){this.currentTab=t;this.setupNav();this.render()},
render:function(show){var s=this,t=++this.renderToken;if(show!==false)document.getElementById('mainContent').innerHTML='<div class="panel p-10 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><div class="mt-3 font-bold">جاري التحميل...</div></div>';var f={dashboard:'dashboard',receipts:'cash',payments:'cash',journal:'journal',reports:'reports',operations:'operations',partners:'partners',inventory:'inventory',gl:'gl',reconciliation:'reconciliation',audit:'audit'}[this.currentTab];if(f==='cash')return this.renderCash(this.currentTab==='receipts'?'Receipt':'Payment',t);if(f==='dashboard')return this.renderDashboard(t);if(f==='journal')return this.renderJournal(t);if(f==='reports')return this.renderReports(t);if(f==='operations')return this.renderOperations(t);if(f==='partners')return this.renderPartners(t);if(f==='inventory')return this.renderInventory(t);if(f==='gl')return this.renderGL(t);if(f==='reconciliation')return this.renderReconciliation(t);this.renderAudit(null,null,t)},
section:function(t,sub){return'<div class="mb-4"><h2 class="section-title">'+this.esc(t)+'</h2><p class="section-subtitle">'+this.esc(sub||'')+'</p></div>'},
kpi:function(t,v,sub,c){return'<div class="kpi"><div class="text-xs muted font-bold">'+this.esc(t)+'</div><div class="metric-big mt-2 '+(c||'')+'">'+v+'</div><div class="text-[11px] muted mt-1">'+this.esc(sub||'')+'</div></div>'},
table:function(rows,cols){rows=rows||[];if(!rows.length)return'<div class="empty">لا توجد بيانات</div>';return'<div class="table-wrap"><table class="w-full text-sm"><thead><tr class="sticky-head">'+cols.map(function(c){return'<th class="text-right p-3 border-b font-black">'+App.esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return'<tr class="border-b hover:bg-slate-50">'+cols.map(function(c){var v=r[c];if(['debit','credit','amount','outstanding','difference'].indexOf(c)!==-1||c.indexOf('value')!==-1||c.indexOf('balance')!==-1)v=App.money(v);return'<td class="p-3">'+App.esc(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'},
filters:function(id){var d=this.filters[id]||this.dates();return'<div class="panel p-4 mb-4"><div class="grid md:grid-cols-3 gap-3 items-end"><div><label class="text-xs font-black">من</label><input id="'+id+'From" type="date" class="field" value="'+d.from+'"></div><div><label class="text-xs font-black">إلى</label><input id="'+id+'To" type="date" class="field" value="'+d.to+'"></div><button class="btn bg-slate-900 text-white px-4 py-2 rounded-xl font-black" onclick="App.applyFilter(\''+id+'\')">تطبيق</button></div></div>'},
applyFilter:function(id){var f=document.getElementById(id+'From').value,t=document.getElementById(id+'To').value;if(!f||!t||f>t)return RW_UI.showError('نطاق التاريخ غير صالح');this.filters[id]={from:f,to:t};if(id==='cashReceipt'||id==='cashPayment')this.renderCash(id==='cashReceipt'?'Receipt':'Payment',this.renderToken);if(id==='operations')this.renderOperations(this.renderToken);if(id==='audit')this.renderAudit(f,t,this.renderToken)},
renderDashboard:function(t){var s=this,d=this.dates();Promise.all([supabase.from('treasury').select('current_balance').eq('company_id',s.companyId).eq('is_active',true),supabase.from('cash_box').select('type,amount').eq('company_id',s.companyId).gte('voucher_date',d.from).lte('voucher_date',d.to),supabase.rpc('accountant_reconciliation_summary',{p_as_of_date:d.to}),supabase.rpc('accountant_period_readiness',{p_from_date:d.from,p_to_date:d.to}),supabase.rpc('accountant_exception_center',{p_as_of_date:d.to})]).then(function(r){if(!s.current(t))return;for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;var cash=0,rec=0,pay=0;(r[0].data||[]).forEach(function(x){cash+=Number(x.current_balance)||0});(r[1].data||[]).forEach(function(x){if(x.type==='Receipt')rec+=Number(x.amount)||0;else if(x.type==='Payment')pay+=Number(x.amount)||0});var recon=r[2].data||[],read=r[3].data||[],ex=r[4].data||[],h='<div class="grid grid-cols-2 lg:grid-cols-6 gap-4">';h+=s.kpi('الخزائن',s.money(cash),'الرصيد الدفتري الحالي');h+=s.kpi('مقبوضات الفترة',s.money(rec),'cash_box','ok');h+=s.kpi('مدفوعات الفترة',s.money(pay),'cash_box');h+=s.kpi('صافي الحركة',s.money(rec-pay),'قبض − صرف');h+=s.kpi('استثناءات',s.num(ex.length),ex.length?'تحتاج مراجعة':'لا توجد',ex.length?'danger':'ok');h+=s.kpi('جاهزية الفترة',s.num(read.filter(function(x){return x.status==='PASS'}).length)+'/'+s.num(read.length),'بوابات readiness');h+='</div><div class="grid lg:grid-cols-2 gap-4 mt-5"><div class="panel p-5">'+s.section('Financial Health','Production Read Models')+s.table(recon,['check_code','status','difference','detail'])+'</div><div class="panel p-5">'+s.section('Period Readiness','Integrity gates')+s.table(read,['gate_code','status','metric','detail'])+'</div></div><div class="panel p-5 mt-5">'+s.section('Exception Center','الاستثناءات التي تتطلب تدخلًا')+s.table(ex.slice(0,100),['exception_type','severity','record_key','description','amount','detected_at'])+'</div>';document.getElementById('mainContent').innerHTML=h}).catch(function(e){if(s.current(t))RW_UI.showError(e.message||'تعذر تحميل لوحة التحكم')})},
renderCash:function(type,t){var s=this,id=type==='Receipt'?'cashReceipt':'cashPayment',d=s.filters[id]||s.dates();supabase.from('cash_box').select('voucher_code,voucher_date,type,amount,reference,treasury_id,user_email,created_at').eq('company_id',s.companyId).eq('type',type).gte('voucher_date',d.from).lte('voucher_date',d.to).order('created_at',{ascending:false}).limit(500).then(function(r){if(!s.current(t))return;if(r.error)throw r.error;var pending='';try{pending=sessionStorage.getItem('rw_cash_pending_'+s.companyId+'_'+type)||''}catch(e){}var h=s.section(type==='Receipt'?'سندات القبض':'سندات الصرف',d.from+' → '+d.to)+s.filters(id)+(pending?'<div class="panel p-4 mb-4 border-amber-300 bg-amber-50"><b>عملية معلقة محفوظة بنفس الهوية.</b> <button class="underline font-black mr-2" onclick="App.retryPending(\''+type+'\')">إعادة المحاولة</button></div>':'')+'<div class="panel p-5"><div class="flex justify-end mb-3"><button class="btn '+(type==='Receipt'?'bg-emerald-700':'bg-red-600')+' text-white px-4 py-2 rounded-lg font-black" onclick="App.cashVoucher(\''+type+'\')">+ سند</button></div>'+s.table(r.data||[],['voucher_code','voucher_date','type','amount','reference','treasury_id','user_email','created_at'])+'</div>';document.getElementById('mainContent').innerHTML=h}).catch(function(e){if(s.current(t))RW_UI.showError(e.message||'تعذر تحميل السندات')})},
createPending:function(type,b){try{sessionStorage.setItem('rw_cash_pending_'+this.companyId+'_'+type,JSON.stringify(b))}catch(e){}},clearPending:function(type){try{sessionStorage.removeItem('rw_cash_pending_'+this.companyId+'_'+type)}catch(e){}},
retryPending:function(type){var b=null;try{b=JSON.parse(sessionStorage.getItem('rw_cash_pending_'+this.companyId+'_'+type)||'null')}catch(e){}if(!b)return RW_UI.showError('لا توجد عملية محفوظة لهذا النوع');this.sendCash(type,b)},
sendCash:function(type,body){var s=this;RW_UI.showLoader('جاري تنفيذ العملية...');RW_API.callWithRetry(type==='Receipt'?'save-receipt-voucher':'save-payment-voucher',body,2,function(p,e){RW_UI.hideLoader();if(e||!p||p.success===false)return RW_UI.showError((p&&p.error)||e||'فشل التنفيذ. تم الاحتفاظ بالعملية لإعادة المحاولة.');s.clearPending(type);RW_UI.toast(p.duplicate?'تم تأكيد العملية السابقة دون تكرار الحركة':'تم الحفظ بنجاح','success');var id=type==='Receipt'?'cashReceipt':'cashPayment',d=s.filters[id]||s.dates();s.renderCash(type,s.renderToken,d.from,d.to)})},
cashVoucher:function(type){var s=this,c=this.context;if(!c)return RW_UI.showError('السياق المالي غير جاهز');var ts=c.treasuries.map(function(x){return'<option value="'+s.esc(x.id)+'">'+s.esc(x.account_code)+' — '+s.esc(x.account_name)+' — '+s.money(x.current_balance)+'</option>'}).join(''),ac=c.accounts.filter(function(x){return x.is_active&&x.id!==c.cashAccount.id}).map(function(x){return'<option value="'+s.esc(x.id)+'">'+s.esc(x.account_code)+' — '+s.esc(x.account_name)+'</option>'}).join('');Swal.fire({title:type==='Receipt'?'سند قبض جديد':'سند صرف جديد',width:720,html:'<div class="text-right"><label>الخزينة</label><select id="cvT" class="swal2-select" style="width:90%">'+ts+'</select><label>التاريخ</label><input id="cvD" type="date" class="swal2-input" value="'+s.localDate()+'"><label>المبلغ</label><input id="cvA" type="number" min="0.01" step="0.01" class="swal2-input"><label>الحساب المقابل</label><select id="cvC" class="swal2-select" style="width:90%"><option value="">اختر الحساب</option>'+ac+'</select><label>المرجع</label><input id="cvR" class="swal2-input"><label>الملاحظات</label><textarea id="cvN" class="swal2-textarea"></textarea></div>',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',allowOutsideClick:false,preConfirm:function(){var a=Number(document.getElementById('cvA').value),tr=document.getElementById('cvT').value,co=document.getElementById('cvC').value,dt=document.getElementById('cvD').value;if(!(a>0))return Swal.showValidationMessage('المبلغ يجب أن يكون أكبر من صفر');if(!tr||!co||!dt)return Swal.showValidationMessage('اكمل بيانات السند');return{amount:a,treasuryId:tr,offsetAccountId:co,date:dt,reference:String(document.getElementById('cvR').value||'').trim(),notes:String(document.getElementById('cvN').value||'').trim()}}}).then(function(r){if(!r.isConfirmed)return;var op=s.uid(),b={header:{operationId:op,treasuryId:r.value.treasuryId,cashAccountId:c.cashAccount.id,offsetAccountId:r.value.offsetAccountId,date:r.value.date,reference:r.value.reference||null,notes:r.value.notes||'',voucherCode:null},lines:[{amount:r.value.amount,description:r.value.notes||type}]};s.createPending(type,b);s.sendCash(type,b)})},
renderJournal:function(t){var s=this;supabase.from('journal_entries').select('id,entry_code,entry_date,reference,description,entry_type,status,created_by,posting_date').eq('company_id',s.companyId).order('created_at',{ascending:false}).limit(500).then(function(r){if(!s.current(t))return;if(r.error)throw r.error;var es=r.data||[];if(!es.length){document.getElementById('mainContent').innerHTML=s.section('القيود اليومية','لا توجد قيود حاليًا')+'<div class="panel p-5"><div class="empty">لا توجد قيود منشورة.</div></div>';return}var ids=es.map(function(x){return x.id});return supabase.from('journal_lines').select('entry_id,account_id,account_name,debit,credit,notes').in('entry_id',ids).then(function(l){if(l.error)throw l.error;return{es:es,ls:l.data||[]}})}).then(function(x){if(!x||!s.current(t))return;var by={};x.ls.forEach(function(l){(by[l.entry_id]||(by[l.entry_id]=[])).push(l)});var bad=x.es.filter(function(e){return e.status==='Posted'&&(!by[e.id]||!by[e.id].length)}),h=s.section('القيود اليومية','Journal Entries / Journal Lines')+'<div class="mb-4"><span class="pill '+(bad.length?'pill-danger':'pill-ok')+'">Zero-line Posted: '+s.num(bad.length)+'</span></div><div class="panel p-5">';x.es.forEach(function(e){h+='<div class="border rounded-xl p-4 mb-3"><div class="flex justify-between"><div><b>'+s.esc(e.entry_code)+'</b> — '+s.esc(e.entry_type)+'<div class="text-xs muted">'+s.esc(e.entry_date)+' · '+s.esc(e.reference||'')+'</div></div><span class="pill '+(e.status==='Posted'?'pill-ok':'pill-warn')+'">'+s.esc(e.status)+'</span></div><div class="mt-3 text-sm">'+s.esc(e.description||'')+'</div>'+s.table(by[e.id]||[],['account_name','debit','credit','notes'])+'</div>'});document.getElementById('mainContent').innerHTML=h}).catch(function(e){if(s.current(t))RW_UI.showError(e.message||'تعذر تحميل القيود')})},
renderReports:function(){var s=this,d=this.dates();document.getElementById('mainContent').innerHTML=s.section('التقارير المالية','Trial Balance · P&L · Balance Sheet · Cost Center · Cash Flow')+'<div class="panel p-4"><div class="grid md:grid-cols-4 gap-3 items-end"><select id="rt" class="field"><option value="tb">Trial Balance</option><option value="pnl">Profit & Loss</option><option value="bs">Balance Sheet</option><option value="cc">P&L by Cost Center</option><option value="cf">Cash Flow</option></select><input id="rf" type="date" class="field" value="'+d.from+'"><input id="rto" type="date" class="field" value="'+d.to+'"><button class="btn bg-emerald-700 text-white px-4 py-2 rounded-xl font-black" onclick="App.runReport()">تشغيل</button></div></div><div id="ro" class="mt-4"></div>'},
runReport:function(){var s=this,t=document.getElementById('rt').value,f=document.getElementById('rf').value,to=document.getElementById('rto').value;if(!f||!to||f>to)return RW_UI.showError('نطاق التاريخ غير صالح');RW_UI.showLoader('جاري تشغيل التقرير...');var q=t==='bs'?supabase.rpc('get_balance_sheet',{p_as_of:to}):t==='tb'?supabase.rpc('get_trial_balance',{p_from_date:f,p_to_date:to}):t==='pnl'?supabase.rpc('get_profit_loss',{p_from_date:f,p_to_date:to}):t==='cc'?supabase.rpc('get_pnl_by_cost_center',{p_from_date:f,p_to_date:to}):supabase.rpc('get_cash_flow',{p_from_date:f,p_to_date:to});q.then(function(r){RW_UI.hideLoader();if(r.error)throw r.error;s.reportRows=r.data||[];document.getElementById('ro').innerHTML='<div class="panel p-5"><div class="flex justify-between items-center mb-3"><b>'+s.esc(document.getElementById('rt').selectedOptions[0].text)+'</b><button class="btn bg-slate-100 px-3 py-2 rounded-lg font-bold" onclick="App.exportRows()">CSV</button></div>'+s.table(s.reportRows,Object.keys(s.reportRows[0]||{message:'لا توجد بيانات'}))+'</div>'}).catch(function(e){RW_UI.hideLoader();RW_UI.showError(e.message||'فشل التقرير')})},
exportRows:function(){var r=this.reportRows||[];if(!r.length)return RW_UI.showError('لا توجد بيانات للتصدير');var c=Object.keys(r[0]),csv=[c.join(',')].concat(r.map(function(x){return c.map(function(k){return JSON.stringify(x[k]==null?'':x[k])}).join(',')})).join('\r\n'),b=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rawaea-accountant-report.csv';a.click();URL.revokeObjectURL(a.href)},
renderOperations:function(t){var s=this,d=s.filters.operations||s.dates();Promise.all([supabase.rpc('accountant_runsheet_center',{p_from_date:d.from,p_to_date:d.to,p_status:null}),supabase.rpc('accountant_order_center',{p_from_date:d.from,p_to_date:d.to,p_search:null}),supabase.from('driver_liabilities').select('id,driver_id,runsheet_id,item_code,item_name,qty_missing,amount,status,reason,created_at').eq('company_id',s.companyId).order('created_at',{ascending:false}).limit(500)]).then(function(r){if(!s.current(t))return;for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;var h=s.section('العمليات التشغيلية المالية','Runsheets · Orders · Driver Liability')+s.filters('operations')+'<div class="grid lg:grid-cols-2 gap-4"><div class="panel p-5">'+s.section('Runsheets')+s.table(r[0].data||[],['runsheet_code','run_date','status','order_count','sales_value','amount_paid','outstanding','loaded_value','delivered_value','returned_value','shortage_value','settlement_status','settlement_code'])+'</div><div class="panel p-5">'+s.section('Orders')+s.table(r[1].data||[],['order_code','order_date','order_status','customer_name','payment_type','runsheet_code','total_amount','amount_paid','outstanding','ordered_qty','delivered_qty','returned_qty','delivered_value','returned_value'])+'</div></div><div class="panel p-5 mt-4">'+s.section('مديونية/عهد السائقين')+s.table(r[2].data||[],['driver_id','runsheet_id','item_code','item_name','qty_missing','amount','status','reason','created_at'])+'</div>';document.getElementById('mainContent').innerHTML=h}).catch(function(e){if(s.current(t))RW_UI.showError(e.message||'تعذر تحميل العمليات')})},
renderPartners:function(t){var s=this,d=s.localDate();Promise.all([supabase.rpc('accountant_customer_aging',{p_as_of_date:d}),supabase.rpc('accountant_supplier_aging',{p_as_of_date:d})]).then(function(r){if(!s.current(t))return;if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;document.getElementById('mainContent').innerHTML=s.section('الذمم والحسابات المساعدة','A/R · A/P Aging — as of '+d)+'<div class="grid lg:grid-cols-2 gap-4"><div class="panel p-5">'+s.section('أعمار العملاء')+s.table(r[0].data||[],['customer_code','customer_name','current_amount','days_1_30','days_31_60','days_61_90','over_90','net_balance'])+'</div><div class="panel p-5">'+s.section('أعمار الموردين')+s.table(r[1].data||[],['supplier_code','supplier_name','current_amount','days_1_30','days_31_60','days_61_90','over_90','net_balance'])+'</div></div>'}).catch(function(e){if(s.current(t))RW_UI.showError(e.message||'تعذر تحميل الذمم')})},

renderGL:function(t){var s=this;supabase.rpc('accountant_coa_tree').then(function(r){if(!s.current(t))return;if(r.error)throw r.error;var a=r.data||[],h=s.section('G/L ودليل الحسابات','Select an account to view activity')+'<div class="grid lg:grid-cols-3 gap-4"><div class="panel p-5"><div class="space-y-1">'+a.map(function(x){var l=(x.account_code||'')+' — '+(x.account_name||'');return'<button class="w-full text-right border-b py-2 hover:bg-slate-50" data-id="'+s.esc(x.id)+'" data-label="'+s.esc(l)+'" onclick="App.accountActivityByButton(this)"><b>'+s.esc(x.account_code)+'</b><div class="text-xs">'+s.esc(x.account_name)+'</div></button>'}).join('')+'</div></div><div id="glActivity" class="panel p-5 lg:col-span-2"><div class="empty">اختر حسابًا لعرض الحركة</div></div></div>';document.getElementById('mainContent').innerHTML=h}).catch(function(e){if(s.current(t))RW_UI.showError(e.message||'تعذر تحميل دليل الحسابات')})},
accountActivityByButton:function(e){this.accountActivity(e.getAttribute('data-id'),e.getAttribute('data-label')||'')},accountActivity:function(id,label){var s=this,d=s.dates();supabase.rpc('accountant_gl_account_activity',{p_account_id:id,p_from_date:d.from,p_to_date:d.to}).then(function(r){if(r.error)throw r.error;document.getElementById('glActivity').innerHTML='<b>'+s.esc(label)+'</b><div class="text-xs muted mt-1">'+d.from+' → '+d.to+'</div>'+s.table(r.data||[],['entry_code','entry_date','reference','description','debit','credit','running_balance'])}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل حركة الحساب')})},
