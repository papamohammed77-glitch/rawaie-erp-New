<style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#f3f6f9;color:#17202a}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 8px 28px rgba(15,23,42,.05)}.btn{transition:.18s}.btn:hover{transform:translateY(-1px)}.table-wrap{overflow:auto}.table-wrap table{min-width:900px}.sticky-head th{position:sticky;top:0;background:#f8fafc;z-index:2}.muted{color:#64748b}.danger{color:#b91c1c}.ok{color:#047857}.warn{color:#b45309}.nav-btn.active{background:#047857;color:#fff}.nav-btn{white-space:nowrap}.kpi{border:1px solid #e5e7eb;border-radius:18px;padding:18px;background:linear-gradient(180deg,#fff,#f8fafc)}.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.pill-ok{background:#dcfce7;color:#166534}.pill-warn{background:#fef3c7;color:#92400e}.pill-danger{background:#fee2e2;color:#991b1b}.pill-info{background:#dbeafe;color:#1d4ed8}.metric-big{font-size:26px;font-weight:900}.empty{padding:40px;text-align:center;color:#64748b}.subtabs button.active{background:#e0f2fe;color:#0369a1}.tree-row{display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid #f1f5f9}.tree-row .code{width:100px;font-family:monospace}.small{font-size:12px}

<body>
<div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-emerald-950 via-emerald-800 to-emerald-600 p-4"><div class="w-full max-w-md bg-white rounded-3xl p-7 shadow-2xl"><div class="text-center mb-6"><div class="w-20 h-20 mx-auto rounded-2xl bg-emerald-700 text-white flex items-center justify-center text-3xl shadow-lg"><i class="fa-solid fa-calculator"></i></div><h1 class="text-2xl font-black mt-4">الروائع ERP</h1><p class="text-sm text-slate-500 mt-1">Accountant Control Center</p></div><div class="space-y-3"><input id="loginEmail" type="email" class="w-full p-3.5 rounded-xl border-2 border-slate-200 font-bold outline-none focus:border-emerald-600" placeholder="البريد الإلكتروني"><div class="relative"><input id="loginPass" type="password" class="w-full p-3.5 rounded-xl border-2 border-slate-200 font-bold outline-none focus:border-emerald-600 pl-12" placeholder="كلمة المرور"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-slate-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div><button class="btn w-full mt-4 bg-emerald-700 text-white p-3.5 rounded-xl font-black" onclick="App.doLogin()">دخول آمن</button><p id="loginMsg" class="hidden text-center text-sm font-bold text-red-600 mt-3"></p></div></div>
<div id="mainApp" class="hidden min-h-screen"><header class="sticky top-0 z-30 bg-white border-b shadow-sm"><div class="max-w-[1800px] mx-auto px-4 md:px-6 py-4 flex items-center justify-between gap-4"><div><div class="text-lg md:text-xl font-black">💰 المحاسب — مركز التحكم المالي</div><div class="text-xs muted" id="companyLabel">—</div></div><div class="flex items-center gap-3"><div class="hidden md:block text-right"><div id="headerUserName" class="text-sm font-black">—</div><div id="headerUserRole" class="text-xs muted">—</div></div><button class="btn px-3 py-2 rounded-lg bg-slate-100 font-bold text-sm" onclick="App.refresh()"><i class="fa-solid fa-rotate"></i> تحديث</button><button class="btn px-3 py-2 rounded-lg bg-red-50 text-red-700 font-bold text-sm" onclick="App.doLogout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button></div></div></header><div class="bg-white border-b overflow-x-auto"><div class="max-w-[1800px] mx-auto px-3 md:px-6 py-2 flex gap-2" id="nav"></div></div><main class="max-w-[1800px] mx-auto p-4 md:p-6"><div id="mainContent"></div></main></div>
<script>
var App={currentTab:'dashboard',subTab:'tb',user:null,companyId:null,context:null,reportRows:[],dates:function(){var d=new Date(),to=d.toISOString().slice(0,10),from=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);return{from:from,to:to};},money:function(n){return (Number(n)||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';},num:function(n){return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2});},esc:function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});},
togglePass:function(){var p=document.getElementById('loginPass'),i=document.getElementById('passIcon');if(!p||!i)return;if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}else{p.type='password';i.className='fa-solid fa-eye';}},
init:function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err!=='NO_SESSION')s.authFail(err||'جلسة غير صالحة');return;}var isO=!!user.isOwner,perms=Array.isArray(user.permissions)?user.permissions:[];if(!(isO||perms.indexOf('finance')!==-1)){s.authFail('غير مصرح لهذا الدور');return;}s.user=user;s.loadContext().then(function(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');s.setupNav();s.render();}).catch(function(e){s.authFail(e.message||'تعذر تحميل السياق المالي');});});},
authFail:function(msg){var x=document.getElementById('loginMsg');if(x){x.innerText=msg||'تعذر الدخول';x.classList.remove('hidden');}if(RW_UI&&RW_UI.showError)RW_UI.showError(msg||'تعذر الدخول');},
doLogin:function(){var s=this,e=String(document.getElementById('loginEmail').value||'').trim(),p=String(document.getElementById('loginPass').value||'').trim();if(!e||!p){s.authFail('أدخل البريد وكلمة المرور');return;}RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(user,err){RW_UI.hideLoader();if(err){s.authFail(err);return;}s.init();});},
doLogout:function(){RW_Auth.doLogout(function(){location.reload();});},
loadContext:function(){var s=this;return supabase.auth.getUser().then(function(ar){if(ar.error||!ar.data||!ar.data.user)throw new Error('INVALID_SESSION');return supabase.from('users').select('id,company_id,status,name').eq('auth_id',ar.data.user.id).maybeSingle();}).then(function(ur){if(ur.error||!ur.data||!ur.data.company_id||(ur.data.status&&ur.data.status!=='Active'))throw new Error('INVALID_COMPANY_CONTEXT');s.companyId=ur.data.company_id;document.getElementById('companyLabel').innerText='Company: '+s.companyId;document.getElementById('headerUserName').innerText=s.user.name||s.user.email||'—';document.getElementById('headerUserRole').innerText=s.user.isOwner?'OWNER':'Finance';return Promise.all([supabase.from('treasury').select('id,account_code,account_name,current_balance,is_active').eq('company_id',s.companyId).eq('is_active',true),supabase.from('chart_of_accounts').select('id,account_code,account_name,account_type,normal_balance,is_active').eq('company_id',s.companyId).eq('account_code','121').eq('is_active',true).maybeSingle(),supabase.from('chart_of_accounts').select('id,account_code,account_name,account_type,normal_balance,is_active').eq('company_id',s.companyId).eq('is_active',true).order('account_code')]);}).then(function(r){if(r[0].error)throw r[0].error;if(!r[0].data||r[0].data.length!==1)throw new Error('RECEIPT_TREASURY_MAPPING_REQUIRED');if(r[1].error)throw r[1].error;if(!r[1].data)throw new Error('CASH_ACCOUNT_121_NOT_CONFIGURED');if(r[2].error)throw r[2].error;s.context={treasury:r[0].data[0],cashAccount:r[1].data,accounts:r[2].data};return s.context;});},
refresh:function(){var s=this;RW_UI.showLoader('جاري تحديث المركز المالي...');this.context=null;this.loadContext().then(function(){s.render();}).catch(function(e){RW_UI.showError(e.message||'فشل التحديث');}).finally(function(){RW_UI.hideLoader();});},
setupNav:function(){var s=this,items=[['dashboard','النظرة المالية','fa-gauge-high'],['receipts','القبض','fa-arrow-down'],['payments','الصرف','fa-arrow-up'],['journal','القيود','fa-book-open'],['reports','التقارير','fa-chart-column'],['operations','العمليات','fa-route'],['partners','الذمم','fa-users'],['inventory','المخزون','fa-boxes-stacked'],['gl','G/L & دليل الحسابات','fa-sitemap'],['reconciliation','المطابقة والرقابة','fa-scale-balanced'],['audit','المراجعة والأثر','fa-shield-halved']];var n='';items.forEach(function(x){n+='<button class="nav-btn '+(x[0]===s.currentTab?'active':'text-slate-600')+' px-4 py-2 rounded-xl font-black text-sm" data-tab="'+x[0]+'" onclick="App.switchTab(\''+x[0]+'\')"><i class="fa-solid '+x[2]+' ml-1"></i>'+x[1]+'</button>';});document.getElementById('nav').innerHTML=n;},
switchTab:function(t){this.currentTab=t;this.setupNav();this.render();},
render:function(){var m=document.getElementById('mainContent');m.innerHTML='<div class="panel p-10 text-center text-slate-500"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><div class="mt-3 font-bold">جاري التحميل...</div></div>';var map={dashboard:'renderDashboard',receipts:'renderReceipts',payments:'renderPayments',journal:'renderJournal',reports:'renderReports',operations:'renderOperations',partners:'renderPartners',inventory:'renderInventory',gl:'renderGL',reconciliation:'renderReconciliation',audit:'renderAudit'};this[map[this.currentTab]||'renderDashboard']();},
kpi:function(title,value,sub,cls){return '<div class="kpi"><div class="text-xs muted font-bold">'+this.esc(title)+'</div><div class="metric-big mt-2 '+(cls||'')+'">'+value+'</div><div class="text-[11px] muted mt-1">'+this.esc(sub||'')+'</div></div>';},
renderDashboard:function(){var s=this,ds=this.dates();Promise.all([supabase.from('treasury').select('current_balance').eq('company_id',s.companyId).eq('is_active',true),supabase.from('cash_box').select('type,amount,voucher_date').eq('company_id',s.companyId).gte('voucher_date',ds.from).lte('voucher_date',ds.to),supabase.from('journal_entries').select('id,entry_code,entry_date,status').eq('company_id',s.companyId).eq('status','Posted').order('entry_date',{ascending:false}).limit(50),supabase.rpc('accountant_reconciliation_summary',{p_as_of_date:ds.to}),supabase.rpc('accountant_period_readiness',{p_from_date:ds.from,p_to_date:ds.to}),supabase.rpc('accountant_exception_center',{p_as_of_date:ds.to})]).then(function(r){for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;var cash=0,rec=0,pay=0;(r[0].data||[]).forEach(function(x){cash+=Number(x.current_balance)||0;});(r[1].data||[]).forEach(function(x){if(x.type==='Receipt')rec+=Number(x.amount)||0;if(x.type==='Payment')pay+=Number(x.amount)||0;});var ex=(r[5].data||[]),read=(r[4].data||[]),html='<div class="grid grid-cols-2 lg:grid-cols-6 gap-4">';html+=s.kpi('الخزائن',s.money(cash),'الرصيد الحالي');html+=s.kpi('مقبوضات الشهر',s.money(rec),'cash_box','ok');html+=s.kpi('مدفوعات الشهر',s.money(pay),'cash_box');html+=s.kpi('صافي الحركة',s.money(rec-pay),'قبض − صرف');html+=s.kpi('القيود المنشورة',s.num((r[2].data||[]).length),'آخر 50');html+=s.kpi('الاستثناءات',s.num(ex.length),ex.length?'تحتاج مراجعة':'لا توجد',ex.length?'danger':'ok');html+='</div><div class="grid lg:grid-cols-3 gap-4 mt-5"><div class="panel p-5 lg:col-span-2"><div class="flex items-center justify-between"><div><h2 class="font-black text-lg">Financial Health</h2><p class="text-xs muted">Read Models فقط — لا يوجد Writer مالي جديد هنا</p></div><button onclick="App.switchTab(\'reconciliation\')" class="btn bg-slate-100 px-3 py-2 rounded-lg font-bold text-xs">فتح المطابقة</button></div><div class="grid md:grid-cols-2 gap-3 mt-4">';(r[3].data||[]).forEach(function(x){var c=x.status==='OK'?'pill-ok':x.status==='EXCEPTION'?'pill-danger':'pill-warn';html+='<div class="border rounded-xl p-4"><div class="flex justify-between"><span class="font-black text-sm">'+s.esc(x.check_code)+'</span><span class="pill '+c+'">'+s.esc(x.status)+'</span></div><div class="mt-2 font-black">'+s.money(x.difference)+'</div><div class="text-xs muted mt-1">'+s.esc(x.detail)+'</div></div>';});html+='</div></div><div class="panel p-5"><h2 class="font-black text-lg">Period Readiness</h2><div class="space-y-2 mt-4">';read.forEach(function(x){var cc=x.status==='PASS'?'pill-ok':x.status==='FAIL'?'pill-danger':'pill-warn';html+='<div class="flex justify-between gap-2 border-b pb-2"><div><div class="font-bold text-sm">'+s.esc(x.gate_code)+'</div><div class="text-[11px] muted">'+s.esc(x.detail)+'</div></div><span class="pill '+cc+'">'+s.esc(x.status)+'</span></div>';});html+='</div></div></div><div class="panel p-5 mt-5"><h2 class="font-black text-lg">الاستثناءات المفتوحة</h2><div class="table-wrap mt-3">'+s.table(ex.slice(0,50),['exception_type','severity','record_key','description','amount','detected_at'])+'</div></div>';document.getElementById('mainContent').innerHTML=html;}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل لوحة التحكم');});},
renderReceipts:function(){this.renderCashBox('Receipt');},renderPayments:function(){this.renderCashBox('Payment');},
renderCashBox:function(type){var s=this,ds=this.dates(),title=type==='Receipt'?'سندات القبض':'سندات الصرف';supabase.from('cash_box').select('voucher_code,voucher_date,type,amount,reference,treasury_id,created_by,created_at').eq('company_id',s.companyId).eq('type',type).gte('voucher_date',ds.from).lte('voucher_date',ds.to).order('created_at',{ascending:false}).limit(500).then(function(r){if(r.error)throw r.error;var h='<div class="flex items-center justify-between mb-4"><div><h2 class="font-black text-xl">'+title+'</h2><p class="text-xs muted">'+s.esc(ds.from)+' → '+s.esc(ds.to)+'</p></div><button class="btn '+(type==='Receipt'?'bg-emerald-700':'bg-red-600')+' text-white px-4 py-2 rounded-lg font-black" onclick="App.cashVoucher(\''+type+'\')">+ سند</button></div><div class="panel p-5"><div class="table-wrap">'+s.table(r.data||[],['voucher_code','voucher_date','type','amount','reference','created_by','created_at'],true)+'</div></div>';document.getElementById('mainContent').innerHTML=h;}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل السندات');});},
cashVoucher:function(type){var s=this,ctx=this.context;if(!ctx)return RW_UI.showError('السياق المالي غير جاهز');var opts='<option value="">اختر الحساب المقابل</option>';ctx.accounts.filter(function(a){return a.is_active&&a.account_code!=='121';}).forEach(function(a){opts+='<option value="'+s.esc(a.id)+'">'+s.esc(a.account_code)+' — '+s.esc(a.account_name)+'</option>';});var title=type==='Receipt'?'سند قبض جديد':'سند صرف جديد';Swal.fire({title:title,width:680,html:'<div class="text-right space-y-2"><div class="bg-slate-50 rounded-xl p-3 text-sm"><b>الخزينة:</b> '+s.esc(ctx.treasury.account_name)+' — '+s.money(ctx.treasury.current_balance)+'</div><input id="cvDate" type="date" class="swal2-input" value="'+new Date().toISOString().slice(0,10)+'"><input id="cvAmt" type="number" min="0.01" step="0.01" class="swal2-input" placeholder="المبلغ"><select id="cvAccount" class="swal2-select" style="width:90%">'+opts+'</select><input id="cvRef" class="swal2-input" placeholder="المرجع"><textarea id="cvNotes" class="swal2-textarea" placeholder="الوصف / الملاحظات"></textarea></div>',showCancelButton:true,confirmButtonText:'حفظ',cancelButtonText:'إلغاء',allowOutsideClick:false,preConfirm:function(){var amount=Number(document.getElementById('cvAmt').value),accountId=String(document.getElementById('cvAccount').value||''),date=String(document.getElementById('cvDate').value||'');if(!(amount>0))return Swal.showValidationMessage('المبلغ يجب أن يكون أكبر من صفر');if(!accountId)return Swal.showValidationMessage('اختر الحساب المقابل');if(!date)return Swal.showValidationMessage('التاريخ مطلوب');if(type==='Payment'&&amount>Number(ctx.treasury.current_balance||0))return Swal.showValidationMessage('الرصيد الحالي لا يكفي للصرف');return{amount:amount,accountId:accountId,date:date,ref:String(document.getElementById('cvRef').value||''),notes:String(document.getElementById('cvNotes').value||'')};}}).then(function(res){if(!res.isConfirmed)return;var p=res.value,op=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():type.slice(0,3)+'-'+Date.now(),fn=type==='Receipt'?'save-receipt-voucher':'save-payment-voucher';RW_UI.showLoader('جاري حفظ السند...');supabase.functions.invoke(fn,{body:{header:{operationId:op,treasuryId:ctx.treasury.id,cashAccountId:ctx.cashAccount.id,offsetAccountId:p.accountId,date:p.date,reference:p.ref||null,notes:p.notes||null,voucherCode:null},lines:[{accountId:p.accountId,amount:p.amount,description:p.notes||title}]}}).then(function(r){if(r.error)throw r.error;if(r.data&&r.data.success===false)throw new Error(r.data.error||r.data.msg||'فشل الحفظ');RW_UI.toast(r.data&&r.data.duplicate?'لم تتكرر العملية':'تم الحفظ بنجاح','success');s.render();}).catch(function(e){RW_UI.showError(e.message||'فشل حفظ السند');}).finally(function(){RW_UI.hideLoader();});});},
renderJournal:function(){var s=this,ds=this.dates();supabase.from('journal_entries').select('id,entry_code,entry_date,reference,description,entry_type,status,created_by').eq('company_id',s.companyId).eq('status','Posted').gte('entry_date',ds.from).lte('entry_date',ds.to).order('entry_date',{ascending:false}).limit(500).then(function(r){if(r.error)throw r.error;document.getElementById('mainContent').innerHTML='<div class="panel p-5"><div class="flex items-center justify-between"><div><h2 class="font-black text-xl">دفتر القيود المنشورة</h2><p class="text-xs muted">العرض والتدقيق؛ الترحيل عبر Core</p></div></div><div class="table-wrap mt-4">'+s.journalTable(r.data||[])+'</div></div>';}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل القيود');});},
journalTable:function(rows){var s=this;if(!rows.length)return '<div class="empty">لا توجد قيود منشورة</div>';var h='<table class="w-full text-sm"><thead><tr class="border-b"><th class="p-2">التاريخ</th><th class="p-2">القيد</th><th class="p-2">المرجع</th><th class="p-2">النوع</th><th class="p-2">المنشئ</th><th class="p-2">التفاصيل</th></tr></thead><tbody>';rows.forEach(function(x){h+='<tr class="border-b"><td class="p-2">'+s.esc(x.entry_date)+'</td><td class="p-2 font-black">'+s.esc(x.entry_code)+'</td><td class="p-2">'+s.esc(x.reference||'—')+'</td><td class="p-2">'+s.esc(x.entry_type||'—')+'</td><td class="p-2">'+s.esc(x.created_by||'—')+'</td><td class="p-2"><button class="px-3 py-1 rounded bg-slate-100 font-bold" onclick="App.showJournalLines(&quot;'+x.id+'&quot;)">فتح</button></td></tr>';});return h+'</tbody></table>';},
showJournalLines:function(id){var s=this;Promise.all([supabase.from('journal_entries').select('entry_code,entry_date,reference,description,entry_type,created_by').eq('id',id).eq('company_id',s.companyId).maybeSingle(),supabase.from('journal_lines').select('account_id,account_name,debit,credit,notes').eq('entry_id',id)]).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;if(!r[0].data)throw new Error('القيد غير موجود');var h=r[0].data,lines=r[1].data||[],debit=0,credit=0,b='<div class="text-right"><div class="mb-3"><b>'+s.esc(h.entry_code)+'</b> · '+s.esc(h.entry_date)+' · '+s.esc(h.reference||'')+'<br>'+s.esc(h.description||'')+'</div><div class="table-wrap"><table class="w-full"><thead><tr class="border-b"><th class="p-2">الحساب</th><th class="p-2">مدين</th><th class="p-2">دائن</th></tr></thead><tbody>';lines.forEach(function(x){debit+=Number(x.debit)||0;credit+=Number(x.credit)||0;b+='<tr class="border-b"><td class="p-2">'+s.esc(x.account_name||x.account_id)+'</td><td class="p-2">'+s.money(x.debit)+'</td><td class="p-2">'+s.money(x.credit)+'</td></tr>';});b+='</tbody></table></div><div class="mt-3 font-bold">مدين: '+s.money(debit)+' — دائن: '+s.money(credit)+'</div></div>';Swal.fire({title:'تفاصيل القيد',html:b,width:900,confirmButtonText:'إغلاق'});}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل تفاصيل القيد');});},
renderReports:function(){var s=this,ds=this.dates();document.getElementById('mainContent').innerHTML='<div class="panel p-5"><div class="flex flex-wrap justify-between items-end gap-3"><div><h2 class="text-xl font-black">التقارير المالية</h2><p class="text-xs muted">Reporting Core — العرض لا ينشئ حركة</p></div><div class="flex gap-2"><input id="rFrom" type="date" value="'+ds.from+'" class="p-2 rounded-lg border"><input id="rTo" type="date" value="'+ds.to+'" class="p-2 rounded-lg border"></div></div><div class="flex flex-wrap gap-2 mt-4"><button class="px-3 py-2 rounded-lg bg-slate-100 font-bold" onclick="App.runReport(&quot;tb&quot;)">ميزان المراجعة</button><button class="px-3 py-2 rounded-lg bg-slate-100 font-bold" onclick="App.runReport(&quot;pl&quot;)">الأرباح والخسائر</button><button class="px-3 py-2 rounded-lg bg-slate-100 font-bold" onclick="App.runReport(&quot;bs&quot;)">الميزانية</button><button class="px-3 py-2 rounded-lg bg-slate-100 font-bold" onclick="App.runReport(&quot;cc&quot;)">مراكز التكلفة</button><button class="px-3 py-2 rounded-lg bg-slate-100 font-bold" onclick="App.runReport(&quot;cf&quot;)">التدفقات النقدية</button><button class="px-3 py-2 rounded-lg bg-emerald-50 text-emerald-800 font-bold" onclick="App.runCashMovement()">حركة الخزينة</button><button class="px-3 py-2 rounded-lg bg-slate-100 font-bold" onclick="App.exportReport()">CSV</button></div><div id="reportBody" class="mt-5"><div class="empty">اختر تقريرًا</div></div></div>';},
runReport:function(kind){var s=this,from=document.getElementById('rFrom').value,to=document.getElementById('rTo').value;if(from>to)return RW_UI.showError('الفترة غير صحيحة');var fn=kind==='tb'?'get_trial_balance':kind==='pl'?'get_profit_loss':kind==='bs'?'get_balance_sheet':kind==='cc'?'get_pnl_by_cost_center':'get_cash_flow';var args=kind==='bs'?{p_as_of:to}:{p_from_date:from,p_to_date:to};document.getElementById('reportBody').innerHTML='<div class="empty">جاري الاستخراج...</div>';supabase.rpc(fn,args).then(function(r){if(r.error)throw r.error;s.reportRows=r.data||[];document.getElementById('reportBody').innerHTML=s.table(s.reportRows,s.reportRows.length?Object.keys(s.reportRows[0]):[],true);}).catch(function(e){RW_UI.showError(e.message||'فشل التقرير');});},
runCashMovement:function(){var s=this,from=document.getElementById('rFrom').value,to=document.getElementById('rTo').value;supabase.from('cash_box').select('voucher_date,type,voucher_code,amount,reference').eq('company_id',s.companyId).gte('voucher_date',from).lte('voucher_date',to).order('voucher_date',{ascending:true}).limit(1000).then(function(r){if(r.error)throw r.error;s.reportRows=r.data||[];document.getElementById('reportBody').innerHTML=s.table(s.reportRows,['voucher_date','voucher_code','type','amount','reference'],true);}).catch(function(e){RW_UI.showError(e.message||'تعذر استخراج حركة الخزينة');});},
renderOperations:function(){var s=this,ds=this.dates();Promise.all([supabase.rpc('accountant_runsheet_center',{p_from_date:ds.from,p_to_date:ds.to,p_status:null}),supabase.rpc('accountant_order_center',{p_from_date:ds.from,p_to_date:ds.to,p_search:null})]).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;document.getElementById('mainContent').innerHTML='<div class="grid lg:grid-cols-2 gap-5"><div class="panel p-5"><div class="flex justify-between"><h2 class="font-black text-lg">مركز الرانشيتات المالي</h2><span class="pill pill-info">'+(r[0].data||[]).length+' رانشيت</span></div><div class="table-wrap mt-3">'+s.table(r[0].data||[],['runsheet_code','run_date','status','order_count','sales_value','amount_paid','outstanding','loaded_value','delivered_value','returned_value','shortage_value','settlement_status'])+'</div></div><div class="panel p-5"><div class="flex justify-between"><h2 class="font-black text-lg">مركز الأوردرات المالي</h2><span class="pill pill-info">'+(r[1].data||[]).length+' أوردر</span></div><div class="table-wrap mt-3">'+s.table(r[1].data||[],['order_code','order_date','order_status','customer_name','payment_type','runsheet_code','total_amount','amount_paid','outstanding','ordered_qty','delivered_qty','returned_qty'])+'</div></div></div>';}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل العمليات');});},
renderPartners:function(){var s=this;Promise.all([supabase.rpc('accountant_customer_aging',{p_as_of_date:new Date().toISOString().slice(0,10)}),supabase.rpc('accountant_supplier_aging',{p_as_of_date:new Date().toISOString().slice(0,10)})]).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;document.getElementById('mainContent').innerHTML='<div class="grid lg:grid-cols-2 gap-5"><div class="panel p-5"><h2 class="font-black text-lg">Customer Aging</h2><div class="table-wrap mt-3">'+s.table(r[0].data||[],['customer_code','customer_name','current_amount','days_1_30','days_31_60','days_61_90','over_90','net_balance'],true)+'</div></div><div class="panel p-5"><h2 class="font-black text-lg">Supplier Aging</h2><div class="table-wrap mt-3">'+s.table(r[1].data||[],['supplier_code','supplier_name','current_amount','days_1_30','days_31_60','days_61_90','over_90','net_balance'],true)+'</div></div></div>';}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل الذمم');});},
renderInventory:function(){var s=this,ds=this.dates();supabase.rpc('accountant_inventory_control',{p_from_date:ds.from,p_to_date:ds.to}).then(function(r){if(r.error)throw r.error;document.getElementById('mainContent').innerHTML='<div class="panel p-5"><div class="flex items-center justify-between"><div><h2 class="font-black text-xl">Inventory Financial Control</h2><p class="text-xs muted">current cost_price estimate — ليست cost-layer valuation</p></div><span class="pill pill-info">Read Only</span></div><div class="table-wrap mt-4">'+s.table(r.data||[],['movement_type','movement_qty','movement_count','current_qty','current_value_estimate','gl_inventory_balance','estimated_value_variance'],true)+'</div></div>';}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل رقابة المخزون');});},
renderGL:function(){var html='<div class="subtabs flex flex-wrap gap-2 mb-4"><button class="active px-4 py-2 rounded-xl font-black" id="tbTab" onclick="App.glTab(\'tb\')">Trial Balance</button><button class="px-4 py-2 rounded-xl font-black" id="coaTab" onclick="App.glTab(\'coa\')">دليل الحسابات</button><button class="px-4 py-2 rounded-xl font-black" id="activityTab" onclick="App.glTab(\'activity\')">حركة حساب</button><button class="px-4 py-2 rounded-xl font-black" id="pnlTab" onclick="App.glTab(\'pnl\')">P&L</button><button class="px-4 py-2 rounded-xl font-black" id="bsTab" onclick="App.glTab(\'bs\')">Balance Sheet</button><button class="px-4 py-2 rounded-xl font-black" id="cfTab" onclick="App.glTab(\'cf\')">Cash Flow</button></div><div id="glBody"></div>';document.getElementById('mainContent').innerHTML=html;this.glTab(this.subTab||'tb');},
glTab:function(t){var s=this;this.subTab=t;['tb','coa','activity','pnl','bs','cf'].forEach(function(x){var b=document.getElementById(x+'Tab');if(b){if(x===t)b.classList.add('active');else b.classList.remove('active');}});var ds=this.dates(),body=document.getElementById('glBody');body.innerHTML='<div class="panel p-8 text-center muted">جاري تحميل التقرير...</div>';var p;if(t==='tb')p=supabase.rpc('get_trial_balance',{p_from_date:ds.from,p_to_date:ds.to});else if(t==='coa')p=supabase.rpc('accountant_coa_tree');else if(t==='pnl')p=supabase.rpc('get_profit_loss',{p_from_date:ds.from,p_to_date:ds.to});else if(t==='bs')p=supabase.rpc('get_balance_sheet',{p_as_of:ds.to});else if(t==='cf')p=supabase.rpc('get_cash_flow',{p_from_date:ds.from,p_to_date:ds.to});else return s.renderAccountActivity();p.then(function(r){if(r.error)throw r.error;s.reportRows=r.data||[];var cols=r.data&&r.data.length?Object.keys(r.data[0]):[];if(t==='coa'){body.innerHTML='<div class="panel p-5"><h2 class="font-black text-lg mb-3">Chart of Accounts Tree</h2>'+(r.data||[]).map(function(x){return '<div class="tree-row"><span class="code">'+s.esc(x.account_code)+'</span><span class="indent" style="padding-right:'+(Number(x.level_no||0)*22)+'px"><b>'+s.esc(x.account_name)+'</b> <span class="small muted">'+s.esc(x.account_type)+' / '+s.esc(x.normal_balance)+'</span></span><span class="pill '+(x.is_active?'pill-ok':'pill-warn')+'">'+(x.is_active?'Active':'Inactive')+'</span></div>';}).join('')+'</div>'; }else body.innerHTML='<div class="panel p-5"><div class="flex justify-between items-center mb-3"><h2 class="font-black text-lg">'+s.esc(t.toUpperCase())+'</h2><button onclick="App.exportReport()" class="btn bg-slate-100 px-3 py-2 rounded-lg font-bold text-xs">CSV</button></div>'+s.table(r.data||[],cols,true)+'</div>';}).catch(function(e){body.innerHTML='<div class="panel p-6 text-red-600 font-bold">'+s.esc(e.message||'تعذر تحميل التقرير')+'</div>';});},
renderAccountActivity:function(){var s=this,opts='<option value="">اختر حسابًا</option>';this.context.accounts.forEach(function(a){opts+='<option value="'+s.esc(a.id)+'">'+s.esc(a.account_code)+' — '+s.esc(a.account_name)+'</option>';});document.getElementById('glBody').innerHTML='<div class="panel p-5"><div class="grid md:grid-cols-4 gap-3"><select id="gaAccount" class="p-3 rounded-xl border">'+opts+'</select><input id="gaFrom" type="date" value="'+this.dates().from+'" class="p-3 rounded-xl border"><input id="gaTo" type="date" value="'+this.dates().to+'" class="p-3 rounded-xl border"><button onclick="App.loadActivity()" class="bg-emerald-700 text-white rounded-xl font-black">عرض الحركة</button></div><div id="activityBody" class="mt-4"></div></div>';},
loadActivity:function(){var s=this,id=document.getElementById('gaAccount').value,from=document.getElementById('gaFrom').value,to=document.getElementById('gaTo').value;if(!id)return RW_UI.showError('اختر الحساب');supabase.rpc('accountant_gl_account_activity',{p_account_id:id,p_from_date:from,p_to_date:to}).then(function(r){if(r.error)throw r.error;document.getElementById('activityBody').innerHTML=s.table(r.data||[],['entry_code','entry_date','reference','description','entry_type','debit','credit','running_balance'],true);}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل حركة الحساب');});},
renderReconciliation:function(){var s=this,ds=this.dates();Promise.all([supabase.rpc('accountant_reconciliation_summary',{p_as_of_date:ds.to}),supabase.rpc('accountant_period_readiness',{p_from_date:ds.from,p_to_date:ds.to}),supabase.rpc('accountant_exception_center',{p_as_of_date:ds.to})]).then(function(r){for(var i=0;i<r.length;i++)if(r[i].error)throw r[i].error;document.getElementById('mainContent').innerHTML='<div class="grid lg:grid-cols-2 gap-5"><div class="panel p-5"><h2 class="font-black text-lg">Subledger ↔ G/L Reconciliation</h2><div class="table-wrap mt-3">'+s.table(r[0].data||[],['check_code','status','difference','detail'],true)+'</div></div><div class="panel p-5"><h2 class="font-black text-lg">Period Close Readiness</h2><div class="table-wrap mt-3">'+s.table(r[1].data||[],['gate_code','status','metric','detail'])+'</div></div></div><div class="panel p-5 mt-5"><h2 class="font-black text-lg">Exception Center</h2><div class="table-wrap mt-3">'+s.table(r[2].data||[],['exception_type','severity','record_key','description','amount','detected_at'])+'</div></div>';}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل مركز المطابقة');});},
renderAudit:function(){var s=this,ds=this.dates();Promise.all([supabase.rpc('accountant_audit_feed',{p_from_date:ds.from,p_to_date:ds.to,p_table_name:null,p_user_email:null,p_record_id:null}),supabase.from('erp_operation_registry').select('operation_type,operation_key,status,created_at,completed_at').eq('company_id',this.companyId).order('created_at',{ascending:false}).limit(300)]).then(function(r){if(r[0].error)throw r[0].error;if(r[1].error)throw r[1].error;document.getElementById('mainContent').innerHTML='<div class="grid lg:grid-cols-2 gap-5"><div class="panel p-5"><h2 class="font-black text-lg">Audit Feed</h2><div class="table-wrap mt-3">'+s.table(r[0].data||[],['created_at','user_email','action','table_name','record_id'])+'</div></div><div class="panel p-5"><h2 class="font-black text-lg">Core Operation Registry</h2><div class="table-wrap mt-3">'+s.table(r[1].data||[],['created_at','operation_type','operation_key','status','completed_at'])+'</div></div></div>';}).catch(function(e){RW_UI.showError(e.message||'تعذر تحميل سجل المراجعة');});},
table:function(rows,cols,moneyCols){if(!rows||!rows.length)return '<div class="empty">لا توجد بيانات للفترة المحددة.</div>';var html='<table class="w-full text-sm"><thead class="sticky-head"><tr class="border-b">';cols.forEach(function(c){html+='<th class="p-2 text-right font-black">'+this.esc(c)+'</th>';},this);html+='</tr></thead><tbody>';rows.forEach(function(row){html+='<tr class="border-b hover:bg-slate-50">';cols.forEach(function(c){var v=row[c],isMoney=/amount|value|balance|debit|credit|variance|liability|sales|paid|outstanding|qty/.test(c),show=v==null?'':v;if(typeof v==='number')show=isMoney?this.money(v):this.num(v);html+='<td class="p-2 '+(isMoney?'font-bold':'')+'">'+this.esc(show)+'</td>';},this);html+='</tr>';},this);return html+'</tbody></table>';},
exportReport:function(){var rows=this.reportRows||[];if(!rows.length)return RW_UI.showError('لا توجد بيانات للتصدير');var keys=Object.keys(rows[0]),csv=[keys.join(',')].concat(rows.map(function(r){return keys.map(function(k){return '"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"';}).join(',');})).join('\r\n'),blob=new Blob([new Uint8Array([0xEF,0xBB,0xBF]),csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rawaea-accountant-report.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);}
};
