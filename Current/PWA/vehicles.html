<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="rw-build" content="RAWAEA-VEHICLE-MASTER-2026-08-29-R2"><title>إدارة السيارات | الروائع ERP</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.min.js"></script><style>body{font-family:Cairo,system-ui;background:#f8fafc}.gold{background:linear-gradient(135deg,#21154f,#312e81 45%,#4f46e5)}.smart{position:relative}.menu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 20px 45px rgba(15,23,42,.18);max-height:240px;overflow:auto}.row:hover{background:#eff6ff}</style></head><body><div id="app" class="min-h-screen"><div class="gold text-white p-4"><div class="max-w-7xl mx-auto flex items-center justify-between gap-3"><div><div class="text-xl font-black">🚚 إدارة السيارات والأسطول</div><div class="text-xs text-white/70 mt-1">Vehicle Master · Mobile Stock · Transport Ready</div></div><div class="flex gap-2"><button id="backBtn" class="bg-white/10 border border-white/20 px-4 py-2 rounded-2xl font-bold">↩ النظام الأم</button><button id="addBtn" class="bg-white/15 border border-white/20 px-4 py-2 rounded-2xl font-black">+ سيارة جديدة</button></div></div></div><main class="max-w-7xl mx-auto p-4 space-y-4"><div class="grid grid-cols-2 md:grid-cols-5 gap-3"><div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-400">إجمالي السيارات</div><div id="kpiAll" class="text-2xl font-black mt-1">—</div></div><div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-400">نشطة</div><div id="kpiActive" class="text-2xl font-black mt-1 text-emerald-600">—</div></div><div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-400">مخزن متنقل</div><div id="kpiMobile" class="text-2xl font-black mt-1 text-blue-600">—</div></div><div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-400">مبيعات مباشرة</div><div id="kpiDirect" class="text-2xl font-black mt-1 text-violet-600">—</div></div><div class="bg-white rounded-2xl border p-4"><div class="text-xs text-slate-400">مبردة</div><div id="kpiCold" class="text-2xl font-black mt-1 text-cyan-600">—</div></div></div><div class="bg-white rounded-2xl border p-4"><input id="search" class="w-full md:w-1/2 p-3 rounded-xl border bg-slate-50" placeholder="🔎 بحث ذكي: كود السيارة، اللوحة، الموديل، المندوب..."></div><div id="tableWrap" class="bg-white rounded-2xl border overflow-auto"></div></main></div><script>const SUPABASE_URL='https://fiilmooggumokxanwiyx.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpaWxtb29nZ3Vtb2t4YW53aXl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MDkwOTIsImV4cCI6MjA5NDI4NTA5Mn0.LZScCxnCiRrTSCCBmTryszQpY1AwBgR2dkTBbC5kOc4';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let sessionUser=null,companyId=null,data=[],drivers=[];function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]) )}async function init(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)return location.href='main.html';const {data:u,error}=await supabaseClient.from('users').select('id,company_id,name,email,status,permissions,role').eq('auth_id',session.user.id).maybeSingle();if(error||!u||u.status&&u.status!=='Active')throw Error('تعذر تحديد مستخدم النظام');const p=Array.isArray(u.permissions)?u.permissions:[];if(session.user.user_metadata?.isOwner!==true&&!p.includes('*')&&!p.includes('vehicles.manage')&&!['مدير عام','مدير مخازن'].includes(u.role))throw Error('غير مصرح بإدارة السيارات');sessionUser=u;companyId=u.company_id;await load();}async function load(){const [vr,dr]=await Promise.all([supabaseClient.from('vehicles').select('id,vehicle_code,model,license_plate,driver_id,max_weight_kg,max_volume_m3,min_trip_value,status,notes,vehicle_type,operation_mode,ownership_type,model_year,vin,fuel_type,refrigerated,mobile_stock_enabled,mobile_branch_id,created_at').eq('company_id',companyId).order('vehicle_code'),supabaseClient.from('users').select('id,name,email,phone,role,status').eq('company_id',companyId).eq('status','Active').order('name')]);if(vr.error)throw vr.error;data=vr.data||[];drivers=dr.data||[];render();}function render(){document.getElementById('kpiAll').textContent=data.length;document.getElementById('kpiActive').textContent=data.filter(x=>x.status==='Active').length;document.getElementById('kpiMobile').textContent=data.filter(x=>x.mobile_stock_enabled).length;document.getElementById('kpiDirect').textContent=data.filter(x=>['DirectSales','Mixed'].includes(x.operation_mode)).length;document.getElementById('kpiCold').textContent=data.filter(x=>x.refrigerated).length;filter();}function filter(){const q=(document.getElementById('search').value||'').trim().toLowerCase();const f=data.filter(v=>!q||[v.vehicle_code,v.license_plate,v.model,v.vehicle_type,v.operation_mode,v.vin,(drivers.find(d=>d.id===v.driver_id)||{}).name].some(x=>String(x||'').toLowerCase().includes(q)));let h='<table class="min-w-[1100px] w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3">الكود</th><th class="p-3">اللوحة</th><th class="p-3">النوع</th><th class="p-3">التشغيل</th><th class="p-3">المندوب/السائق</th><th class="p-3 text-center">الوزن كجم</th><th class="p-3 text-center">الحجم م³</th><th class="p-3 text-center">مخزن متنقل</th><th class="p-3">الحالة</th><th class="p-3">الفرع المتنقل</th></tr></thead><tbody>';for(const v of f){const d=drivers.find(x=>x.id===v.driver_id);h+='<tr class="border-t"><td class="p-3 font-black">'+esc(v.vehicle_code)+'</td><td class="p-3">'+esc(v.license_plate)+'</td><td class="p-3">'+esc(v.vehicle_type||'Delivery')+'</td><td class="p-3">'+esc(v.operation_mode||'Mixed')+(v.refrigerated?' · ❄️':'')+'</td><td class="p-3">'+esc(d?d.name||d.email:'—')+'</td><td class="p-3 text-center">'+esc(v.max_weight_kg||'—')+'</td><td class="p-3 text-center">'+esc(v.max_volume_m3||'—')+'</td><td class="p-3 text-center">'+(v.mobile_stock_enabled?'✅':'—')+'</td><td class="p-3">'+esc(v.status)+'</td><td class="p-3">'+esc(v.mobile_branch_id?'VAN-'+v.vehicle_code:'—')+'</td></tr>';}h+='</tbody></table>';document.getElementById('tableWrap').innerHTML=f.length?h:'<div class="p-10 text-center text-slate-400">لا توجد سيارات</div>';}function smartDriver(){const box=document.getElementById('driverMenu'),q=document.getElementById('driverSearch').value.trim().toLowerCase();const a=drivers.filter(d=>!q||[d.name,d.email,d.phone,d.role].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,12);box.innerHTML=a.map(d=>'<div class="row p-3 border-b cursor-pointer" data-id="'+d.id+'"><b>'+esc(d.name||d.email)+'</b><span class="text-xs text-slate-400 block">'+esc(d.role||d.email)+'</span></div>').join('')||'<div class="p-3 text-slate-400">لا توجد نتائج</div>';box.classList.remove('hidden');box.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{document.getElementById('driverId').value=el.dataset.id;document.getElementById('driverSearch').value=el.querySelector('b').textContent;box.classList.add('hidden')});}async function addVehicle(){const html='<div class="text-right grid grid-cols-1 md:grid-cols-2 gap-3"><input id="vCode" class="p-3 border rounded-xl" placeholder="كود السيارة *"><input id="vPlate" class="p-3 border rounded-xl" placeholder="رقم اللوحة *"><input id="vModel" class="p-3 border rounded-xl" placeholder="الموديل"><select id="vType" class="p-3 border rounded-xl"><option>Delivery</option><option>DirectSales</option><option>RefrigeratedDelivery</option><option>Transport</option><option>Other</option></select><select id="vMode" class="p-3 border rounded-xl"><option>Mixed</option><option>Delivery</option><option>DirectSales</option><option>Transport</option></select><input id="vYear" type="number" class="p-3 border rounded-xl" placeholder="سنة الموديل"><input id="vVin" class="p-3 border rounded-xl" placeholder="VIN / رقم الهيكل"><input id="vWeight" type="number" class="p-3 border rounded-xl" placeholder="الحمولة القصوى كجم"><input id="vVolume" type="number" step="0.001" class="p-3 border rounded-xl" placeholder="الحجم الأقصى م³"><input id="vTrip" type="number" class="p-3 border rounded-xl" placeholder="الحد الأدنى لقيمة الرحلة"><input id="vFuel" class="p-3 border rounded-xl" placeholder="نوع الوقود"><div class="smart"><input id="driverSearch" oninput="smartDriver()" onfocus="smartDriver()" class="w-full p-3 border rounded-xl" placeholder="🔎 مندوب/سائق"><input id="driverId" type="hidden"><div id="driverMenu" class="menu hidden"></div></div><label class="flex items-center gap-2 p-3"><input id="vCold" type="checkbox"> مركبة مبردة</label><label class="flex items-center gap-2 p-3"><input id="vMobile" type="checkbox" checked> إنشاء مخزن/فرع متنقل تلقائيًا</label><textarea id="vNotes" class="p-3 border rounded-xl md:col-span-2" placeholder="ملاحظات"></textarea></div>';const r=await Swal.fire({title:'إضافة سيارة جديدة',html,width:860,showCancelButton:true,confirmButtonText:'إنشاء السيارة',cancelButtonText:'إلغاء',preConfirm:()=>{const code=document.getElementById('vCode').value.trim(),plate=document.getElementById('vPlate').value.trim();if(!code||!plate){Swal.showValidationMessage('كود السيارة ورقم اللوحة مطلوبان');return false}return {vehicle_code:code,license_plate:plate,model:document.getElementById('vModel').value.trim(),vehicle_type:document.getElementById('vType').value,operation_mode:document.getElementById('vMode').value,model_year:document.getElementById('vYear').value||null,vin:document.getElementById('vVin').value.trim()||null,max_weight_kg:document.getElementById('vWeight').value||null,max_volume_m3:document.getElementById('vVolume').value||null,min_trip_value:document.getElementById('vTrip').value||null,fuel_type:document.getElementById('vFuel').value.trim()||null,driver_id:document.getElementById('driverId').value||null,refrigerated:document.getElementById('vCold').checked,mobile_stock_enabled:document.getElementById('vMobile').checked,notes:document.getElementById('vNotes').value.trim()}}});if(!r.isConfirmed)return;Swal.fire({title:'جاري إنشاء السيارة...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});const {data:{session}}=await supabaseClient.auth.getSession();const {data:j,error}=await supabaseClient.rpc('create_vehicle_atomic',{p_company_id:companyId,p_vehicle_code:r.value.vehicle_code,p_model:r.value.model,p_license_plate:r.value.license_plate,p_driver_id:r.value.driver_id,p_max_weight_kg:r.value.max_weight_kg==null?null:Number(r.value.max_weight_kg),p_max_volume_m3:r.value.max_volume_m3==null?null:Number(r.value.max_volume_m3),p_min_trip_value:r.value.min_trip_value==null?null:Number(r.value.min_trip_value),p_status:'Active',p_notes:r.value.notes,p_vehicle_type:r.value.vehicle_type,p_operation_mode:r.value.operation_mode,p_ownership_type:'Owned',p_model_year:r.value.model_year==null?null:Number(r.value.model_year),p_vin:r.value.vin,p_fuel_type:r.value.fuel_type,p_refrigerated:r.value.refrigerated,p_mobile_stock_enabled:r.value.mobile_stock_enabled,p_created_by:sessionUser.email});Swal.close();if(error){Swal.fire('فشل',error.message||'تعذر إنشاء السيارة','error');return}await Swal.fire('تم','تم إنشاء السيارة وربطها بالفرع المتنقل','success');await load();}document.getElementById('search').oninput=filter;document.getElementById('addBtn').onclick=addVehicle;document.getElementById('backBtn').onclick=()=>location.href='main.html';init().catch(e=>Swal.fire('خطأ',e.message||'تعذر تحميل الصفحة','error'));</script></body></html>
